<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 822" width="720" height="822" role="img" aria-label="Replacing a tool handle (axe, hammer, hoe): 1 remove the old handle: saw off the broken handle, then drill into what is left from the wedge side and knock it out; 2 choose well-seasoned hardwood with the grain running along the length of the handle, free of knots and cracks; 3 rough it out first, then shave and test-fit repeatedly until the head end can just be knocked tightly into the tool's eye; 4 knock the head end of the handle into the eye, leaving a little sticking out, saw a slot down into the top of the handle (about 2/3 of the depth of the eye), knock a hardwood wedge into the slot (a little glue can be added) to spread the handle tight, and saw off the part that sticks out flush; 5 swing it and tap it, there must be no looseness at all. Stop using an axe or hammer at once if its head is loose and repair it, as a flying head injures people; do not soak a dry tool handle in water to make it swell tight, as once it dries it will be looser than before" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Replacing a tool handle</title>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker><marker id="arS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker><marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#b8c2cc"/><path d="M0 0 V6" stroke="#7d8894" stroke-width="1"/></pattern><pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fbe9e9"/><path d="M0 0 V6" stroke="#c33" stroke-width="1.2"/></pattern></defs>
<g fill="#222">
<text x="360" y="28" font-size="18" text-anchor="middle" font-weight="bold">Replacing a tool handle (axe, hammer, hoe): knock in, then wedge tight</text>
<rect x="10" y="44" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="186" y="44" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="362" y="44" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="538" y="44" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="10" y="372" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="186" y="372" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="362" y="372" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="538" y="372" width="172" height="320" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="20" y="68" font-size="15" font-weight="bold">① Remove</text>
<text x="196" y="68" font-size="15" font-weight="bold">② Choose wood</text>
<text x="372" y="68" font-size="15" font-weight="bold">③ Shape</text>
<text x="548" y="68" font-size="15" font-weight="bold">④ Knock in</text>
<text x="20" y="396" font-size="15" font-weight="bold">⑤ Saw a slot</text>
<text x="196" y="396" font-size="15" font-weight="bold">⑥ Wedge</text>
<text x="372" y="396" font-size="15" font-weight="bold">⑦ Saw flush</text>
<text x="548" y="396" font-size="15" font-weight="bold">⑧ Check</text>
<g font-size="12" fill="#555" text-anchor="end">
<text x="172" y="68">(section)</text><text x="524" y="68">(section)</text><text x="700" y="68">(section)</text>
<text x="172" y="396">(section)</text><text x="348" y="396">(section)</text><text x="524" y="396">(section)</text>
</g>
<g font-size="13">
<text x="20" y="290">Saw off the broken</text>
<text x="20" y="307">handle; drill into the</text>
<text x="20" y="324">rest from the wedge</text>
<text x="20" y="341">side and knock it out</text>
<text x="196" y="290">Well-seasoned</text>
<text x="196" y="307">hardwood, grain along</text>
<text x="196" y="324">the handle's length; no</text>
<text x="196" y="341">knots or cracks</text>
<text x="372" y="290">Rough it out, then shave</text>
<text x="372" y="307">and test-fit until the</text>
<text x="372" y="324">head end can just be</text>
<text x="372" y="341">knocked tightly into</text>
<text x="372" y="358">the tool's eye</text>
<text x="548" y="290">Knock the head end of</text>
<text x="548" y="307">the handle into the eye,</text>
<text x="548" y="324">leaving a little</text>
<text x="548" y="341">sticking out</text>
<text x="20" y="618">Saw a slot down into</text>
<text x="20" y="635">the top of the handle</text>
<text x="20" y="652">(about 2/3 of the</text>
<text x="20" y="669">depth of the eye)</text>
<text x="196" y="618">Knock a hardwood</text>
<text x="196" y="635">wedge into the slot</text>
<text x="196" y="652">(a little glue can be</text>
<text x="196" y="669">added) to spread the</text>
<text x="196" y="686">handle tight</text>
<text x="372" y="618">Saw off the part that</text>
<text x="372" y="635">sticks out flush</text>
<text x="548" y="618">Swing it and tap it;</text>
<text x="548" y="635">there must be no</text>
<text x="548" y="652">looseness at all</text>
</g>
