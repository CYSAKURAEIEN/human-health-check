<text x="24" y="606" font-size="16" font-weight="bold">Safety</text>
<path d="M26 632 l6 7 l11 -13" fill="none" stroke="#2a8a3a" stroke-width="3"/>
<text x="52" y="638" font-size="14.5">Hold the work firmly in a clamp or vice</text>
<path d="M26 666 l6 7 l11 -13" fill="none" stroke="#2a8a3a" stroke-width="3"/>
<text x="52" y="672" font-size="14.5">Keep the saw sharp: blunt tools need more force and slip more easily, causing injuries</text>
<path d="M26 700 l6 7 l11 -13" fill="none" stroke="#2a8a3a" stroke-width="3"/>
<text x="52" y="706" font-size="14.5">Wear a mask when sawing (wood dust); where possible open the windows or work outdoors</text>
<path d="M26 727 l14 14 M40 727 l-14 14" stroke="#c33" stroke-width="3"/>
<text x="52" y="740" font-size="14.5" fill="#c33">Do not wear loose sleeves or gloves when using power saws or other rotating tools</text>
<text x="52" y="758" font-size="14.5" fill="#c33">(they can get caught and pull you in)</text>
<path d="M26 786 l6 7 l11 -13" fill="none" stroke="#2a8a3a" stroke-width="3"/>
<text x="52" y="792" font-size="14.5">Oil saw blades and hang them up so they do not bend</text>
