<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 854" width="720" height="854" role="img" aria-label="Sawing wood: measure twice, cut once; draw right angles with a try square and snap long straight lines with a chalk line; saw on the waste side of the line, because the saw cut itself has a width. 1 rest your thumb against the blade and draw it back gently a few times to start a small cut; 2 once the cut is started, saw back and forth with long strokes and even force; 3 do not press down hard, let the teeth do the cutting; 4 slow down when nearly through and support the end about to come off so the wood does not tear. Safety: hold the work firmly in a clamp or vice; keep the saw sharp, as blunt tools need more force and slip more easily, causing injuries; wear a mask when sawing and where possible open the windows or work outdoors; do not wear loose sleeves or gloves when using power saws or other rotating tools; oil saw blades and hang them up so they do not bend" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
