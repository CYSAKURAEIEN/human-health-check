<text x="360" y="742" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">Anything with white milky sap is never purslane — do not pick or eat it</text>
<text x="360" y="770" font-size="14" text-anchor="middle">Purslane: fleshy, thick spoon-like leaves, round smooth stems; snapped, it gives clear slime</text>
<text x="360" y="794" font-size="14" text-anchor="middle">Spurges: leaves thin, small and not fleshy; white milky sap when broken</text>
<text x="360" y="822" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">If you cannot identify it for certain, do not pick it; do not pick</text>
<text x="360" y="842" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">by roadsides or at the edges of freshly sprayed fields</text>
