<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 868" width="720" height="868" role="img" aria-label="Purslane compared with spurges that lie flat on the ground: both lie flat on the ground and often have reddish stems, and some grow in the same plot. Purslane (Machixian) is a fleshy herb; its stems lie flat, much branched, round, pale green or tinged purplish-red, smooth and hairless; its leaves are obovate, like little spoons, thick and juicy; small yellow flowers open in the morning and close after noon; snap a stem and clear slime comes out, with no white milky sap. Spurges (Euphorbiaceae) such as spotted spurge and Euphorbia humifusa have thin, small leaves that are not fleshy, and their stems are often reddish and lie flat; snap a stem and white milky sap comes out, which irritates the skin and eyes, and eating it causes burning pain in the mouth and violent vomiting and diarrhoea. Anything with white milky sap is never purslane: do not pick or eat it">
<rect width="100%" height="100%" fill="#fff"/>
<title>Purslane compared with spurges</title>
