<text x="396" y="582" font-size="16" font-weight="bold" fill="#c33">White milky sap</text>
<text x="396" y="606" font-size="14">The sap irritates skin and eyes;</text>
<text x="396" y="626" font-size="14">eating it causes a burning mouth,</text>
<text x="396" y="644" font-size="14">violent vomiting and diarrhoea</text>
<text x="566" y="560" font-size="15" fill="#c33">→ Not purslane</text>
