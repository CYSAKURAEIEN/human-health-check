<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 756" width="720" height="756" role="img" aria-label="Fire materials and fire lays: materials go from fine to coarse: tinder, kindling (match-thick, pencil-thick, thumb-thick) and fuel (finger- to wrist-thick), added gradually from small to large; a teepee fire lights quickly, with a small gap on the windward side to light it through; a log cabin fire is stacked in criss-cross layers and suits cooking; a star fire has a few thick logs with one end pointing to the centre, pushed inward as they burn short, and saves wood; a platform fire on wet ground or snow starts with a platform of logs laid first">
<rect width="100%" height="100%" fill="#fff"/>
<title>Fire materials and fire lays</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
