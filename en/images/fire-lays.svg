<text x="14" y="178" font-size="14">Criss-cross layers (#); good airflow, burns hot;</text>
<text x="14" y="197" font-size="14">collapses into an even bed of embers, good</text>
<text x="14" y="216" font-size="14">for cooking and roasting</text>
</g>
