<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 734" width="720" height="734" role="img" aria-label="Tourniquet (last resort): only for life-threatening heavy bleeding from an arm or thigh; call 120 at the same time. 1 Put it 5-7 cm above the wound (on the side nearer the heart), not over a joint such as the elbow or knee; if you cannot tell where the wound is, put it on the upper arm or the top of the thigh. 2 Use a strip of cloth at least 5 cm wide, not wire, string or other thin cord. 3 Windlass method: wrap a wide strip of cloth twice round the limb and tie a half knot, lay a short stick on it and tie another knot over it, turn the stick to tighten until the bleeding stops, secure the stick with another strip of cloth or tape and write down the time. Once it is on, do not loosen it; try to get to hospital within 2 hours" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Tourniquet (last resort)</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
</defs>
<text x="360" y="28" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Tourniquet (last resort)</text>
<text x="360" y="50" font-size="13" fill="#c33" text-anchor="middle">Only for life-threatening heavy bleeding from an arm or thigh; when needed, put it on early and call 120</text>
<text x="360" y="68" font-size="13" fill="#222" text-anchor="middle">For ordinary bleeding, press hard directly first – no tourniquet; never on the head, neck or trunk</text>

<!-- 1 position -->
<rect x="8" y="80" width="448" height="250" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="22" y="104" font-size="16" fill="#222" font-weight="bold">① Where to put it (a leg as the example)</text>
<!-- leg (side view, casualty lying flat) -->
<path d="M34 170 Q140 168 236 176 Q252 168 266 178 Q330 180 392 186 L398 150 Q404 140 414 146 L420 196 Q422 214 404 214 L392 212 Q340 220 300 214 Q268 222 238 214 Q140 226 34 232 Z" fill="#f3e3d3" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M34 170 Q28 186 36 200 Q30 216 34 232" fill="none" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>
<path d="M248 180 Q258 196 248 210" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- tourniquet -->
<rect x="118" y="162" width="22" height="78" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<line x1="129" y1="164" x2="129" y2="238" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
<!-- wound -->
<path d="M180 184 L188 192 L180 200 L188 208 L180 216" fill="none" stroke="#c33" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<!-- 5-7 cm -->
<line x1="140" y1="150" x2="140" y2="160" stroke="#0b5cad" stroke-width="1.2"/>
<line x1="184" y1="150" x2="184" y2="180" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="3 2"/>
<line x1="142" y1="152" x2="182" y2="152" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#ab)" marker-end="url(#ab)"/>
<text x="162" y="142" font-size="15" fill="#0b5cad" text-anchor="middle" font-weight="bold">5-7 cm</text>
<text x="184" y="256" font-size="14" fill="#c33" text-anchor="middle">wound</text>
<text x="96" y="130" font-size="14" fill="#222" text-anchor="middle">tourniquet</text>
<line x1="100" y1="135" x2="122" y2="164" stroke="#0b5cad" stroke-width="1.3"/><circle cx="122" cy="164" r="2.6" fill="#0b5cad"/>
<!-- joint -->
<circle cx="256" cy="196" r="28" fill="none" stroke="#c33" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M276 130 L290 144 M290 130 L276 144" stroke="#c33" stroke-width="3" stroke-linecap="round"/>
<text x="296" y="136" font-size="14" fill="#c33">not over a joint</text>
<text x="296" y="153" font-size="14" fill="#c33">(elbow, knee)</text>
<line x1="294" y1="156" x2="276" y2="176" stroke="#c33" stroke-width="1.3"/>
<text x="256" y="246" font-size="13" fill="#666" text-anchor="middle">knee</text>
<text x="412" y="236" font-size="13" fill="#666" text-anchor="middle">foot</text>
<!-- side nearer the heart -->
<line x1="110" y1="262" x2="40" y2="262" stroke="#0b5cad" stroke-width="2" marker-end="url(#ab)"/>
<text x="48" y="282" font-size="14" fill="#0b5cad">side nearer the heart</text>
<text x="22" y="302" font-size="14" fill="#222">Can't tell where the wound is → as high as possible</text>
<text x="22" y="320" font-size="14" fill="#222">on the limb (upper arm or top of the thigh)</text>

<!-- 2 wide strip of cloth -->
<rect x="466" y="80" width="246" height="250" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="480" y="104" font-size="16" fill="#222" font-weight="bold">② Use a wide strip of cloth</text>
<rect x="492" y="126" width="196" height="44" rx="20" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<rect x="578" y="118" width="26" height="60" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<text x="480" y="200" font-size="16" fill="#0b5cad" font-weight="bold">✓</text>
<text x="498" y="200" font-size="14" fill="#222">wide strip, at least 5 cm</text>
<path d="M492 232 Q492 222 512 222 L582 222 Q590 230 598 222 L668 222 Q688 222 688 242 Q688 262 668 262 L598 262 Q590 254 582 262 L512 262 Q492 262 492 242 Z" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<line x1="590" y1="214" x2="590" y2="270" stroke="#555" stroke-width="2"/>
<text x="480" y="292" font-size="16" fill="#c33" font-weight="bold">✗</text>
<text x="498" y="292" font-size="14" fill="#c33">no wire, string or thin cord</text>

<g transform="translate(0,18)">
<!-- 3 windlass method -->
<rect x="8" y="322" width="704" height="228" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="22" y="346" font-size="16" fill="#222" font-weight="bold">③ No ready-made tourniquet: windlass method</text>
<text x="700" y="346" font-size="13" fill="#666" text-anchor="end">(limb seen from above, heart to the left)</text>

<!-- panel 1 -->
<g>
<rect x="28" y="390" width="140" height="44" rx="20" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M146 400 L152 406 L146 412 L152 418" fill="none" stroke="#c33" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="74" y="382" width="24" height="60" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<line x1="86" y1="384" x2="86" y2="440" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
<ellipse cx="86" cy="412" rx="10" ry="7" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M80 408 Q86 416 92 408" fill="none" stroke="#333" stroke-width="1.3"/>
<text x="28" y="470" font-size="14" fill="#222">① Wrap a wide strip</text>
<text x="28" y="488" font-size="14" fill="#222">twice round, tie</text>
<text x="28" y="506" font-size="14" fill="#222">a half knot</text>
</g>
<!-- panel 2 -->
<g>
<rect x="200" y="390" width="140" height="44" rx="20" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M318 400 L324 406 L318 412 L324 418" fill="none" stroke="#c33" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="246" y="382" width="24" height="60" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<line x1="258" y1="384" x2="258" y2="440" stroke="#333" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="222" y="407" width="72" height="10" rx="4" fill="#c9a26b" stroke="#333" stroke-width="2"/>
<ellipse cx="258" cy="412" rx="9" ry="10" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M252 406 Q258 414 264 406" fill="none" stroke="#333" stroke-width="1.3"/>
<text x="200" y="470" font-size="14" fill="#222">② Lay a short stick on</text>
<text x="200" y="488" font-size="14" fill="#222">the knot and tie</text>
<text x="200" y="506" font-size="14" fill="#222">another knot over it</text>
<text x="200" y="524" font-size="12" fill="#666">(pen, chopstick, spanner,</text>
<text x="200" y="538" font-size="12" fill="#666">branch)</text>
</g>
<!-- panel 3 -->
<g>
<rect x="372" y="390" width="140" height="44" rx="20" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M490 400 L496 406 L490 412 L496 418" fill="none" stroke="#c33" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M418 382 L442 382 L438 402 L442 422 L442 442 L418 442 L422 422 L418 402 Z" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M420 394 Q430 404 440 394 M420 430 Q430 420 440 430" fill="none" stroke="#333" stroke-width="1.3"/>
<rect x="394" y="407" width="72" height="10" rx="4" fill="#c9a26b" stroke="#333" stroke-width="2" transform="rotate(-35 430 412)"/>
<ellipse cx="430" cy="412" rx="9" ry="10" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M466 384 A42 42 0 0 1 472 428" fill="none" stroke="#c33" stroke-width="3" marker-end="url(#ar)"/>
<text x="504" y="380" font-size="13" fill="#c33" text-anchor="middle">bleeding stops</text>
<text x="372" y="470" font-size="14" fill="#222">③ Turn the stick to</text>
<text x="372" y="488" font-size="14" fill="#222">tighten it</text>
<text x="372" y="506" font-size="14" fill="#c33" font-weight="bold">until bleeding stops</text>
</g>
<!-- panel 4 -->
<g>
<rect x="544" y="390" width="140" height="44" rx="20" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M662 400 L668 406 L662 412 L668 418" fill="none" stroke="#c33" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M590 382 L614 382 L610 402 L614 422 L614 442 L590 442 L594 422 L590 402 Z" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<rect x="566" y="407" width="72" height="10" rx="4" fill="#c9a26b" stroke="#333" stroke-width="2"/>
<ellipse cx="602" cy="412" rx="9" ry="10" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<rect x="626" y="386" width="12" height="52" rx="3" fill="#fbfaf3" stroke="#333" stroke-width="2"/>
<rect x="560" y="360" width="112" height="20" rx="3" fill="#fff" stroke="#c33" stroke-width="1.5"/>
<text x="616" y="375" font-size="13" fill="#c33" text-anchor="middle">Tourniquet 14:35</text>
<text x="544" y="470" font-size="14" fill="#222">④ Secure the stick</text>
<text x="544" y="488" font-size="14" fill="#222">with cloth or tape so it</text>
<text x="544" y="506" font-size="14" fill="#222">can't unwind; write</text>
<text x="544" y="524" font-size="14" fill="#222">down the time</text>
</g>
</g>
<!-- once it is on -->
<text x="22" y="598" font-size="14" fill="#c33" font-weight="bold">● Once it is on, don't loosen it and don't cover it. It hurts a great deal – that is normal;</text>
<text x="36" y="616" font-size="14" fill="#c33" font-weight="bold">don't loosen it because it hurts</text>
<text x="22" y="640" font-size="14" fill="#222">● It must be tightened until the bleeding stops: too loose squeezes only the veins, not the arteries,</text>
<text x="36" y="658" font-size="14" fill="#222">and bleeding gets worse; when it is on correctly you cannot feel a pulse further down the limb</text>
<text x="22" y="680" font-size="14" fill="#222">● Still bleeding with one on → put a second one on just above the first, right next to it</text>
<text x="22" y="702" font-size="14" fill="#222">● Write the time on the tourniquet, the casualty's forehead or tape; tell 120 and the doctor who takes over.</text>
<text x="36" y="720" font-size="14" fill="#222">Get to hospital within 2 hours if you can – <tspan fill="#c33">do not loosen it yourself when time is up; a doctor decides</tspan></text>
</svg>
