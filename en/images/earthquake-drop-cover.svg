<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 662" width="720" height="662" role="img" aria-label="Sheltering indoors during an earthquake: 1 Drop onto your hands and knees; 2 Cover: get under a sturdy table, protect your head and neck with your hands, face down; 3 Hold on: hold the table leg, move with the table if it shifts, and stay until the shaking stops; 4 with no table, crouch in a corner against an inside wall, protect your head with both hands, and keep away from windows, mirrors and ceiling lights; do not jump from the building or use the lift, do not run downstairs while it is shaking, do not make a special dash for a doorway, do not stand on a balcony or by an outside wall">
<rect width="100%" height="100%" fill="#fff"/>
<title>Indoors during an earthquake: drop, cover, hold on</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<g id="table">
<rect x="22" y="92" width="186" height="9" fill="#c8a46e" stroke="#333" stroke-width="2"/>
<rect x="30" y="101" width="9" height="81" fill="#c8a46e" stroke="#333" stroke-width="2"/>
<rect x="191" y="101" width="9" height="81" fill="#c8a46e" stroke="#333" stroke-width="2"/>
</g>
<!-- kneeling body protecting the head (head to the left) -->
<g id="crouch">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M152,150 L114,170 L160,174" stroke="#333" stroke-width="19"/><path d="M152,150 L114,170 L160,174" stroke="#cfe0f0" stroke-width="14"/>
<path d="M150,146 L104,152" stroke="#333" stroke-width="30"/><path d="M150,146 L104,152" stroke="#cfe0f0" stroke-width="25"/>
</g>
<circle cx="80" cy="161" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M70,149 Q86,142 95,156 Q90,151 70,149 Z" fill="#555"/>
</g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Indoors during an earthquake: drop, cover, hold on</text>

<!-- 1 drop -->
<g transform="translate(10,42)">
<rect x="0" y="0" width="226" height="298" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<line x1="12" y1="183" x2="214" y2="183" stroke="#999" stroke-width="3"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M142,138 L142,173 L190,174" stroke="#333" stroke-width="19"/><path d="M142,138 L142,173 L190,174" stroke="#cfe0f0" stroke-width="14"/>
<path d="M144,134 L84,130" stroke="#333" stroke-width="30"/><path d="M144,134 L84,130" stroke="#cfe0f0" stroke-width="25"/>
<path d="M84,134 L80,174" stroke="#333" stroke-width="14"/><path d="M84,134 L80,174" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="74" cy="177" rx="10" ry="5" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<circle cx="58" cy="118" r="16" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M50,103 Q68,98 74,114 Q66,106 50,103 Z" fill="#555"/>
<path d="M115,30 L115,82" stroke="#c33" stroke-width="4" marker-end="url(#ar)"/>
<text x="126" y="52" font-size="14" fill="#c33">Get down</text>
<text x="126" y="69" font-size="14" fill="#c33">at once</text>
<text x="14" y="38" font-size="13" fill="#0b5cad">hands and</text>
<text x="14" y="54" font-size="13" fill="#0b5cad">knees down</text>
<line x1="44" y1="60" x2="76" y2="166" stroke="#0b5cad" stroke-width="1"/>
<text x="12" y="212"><tspan font-weight="bold">①</tspan> Drop: onto hands and</text>
<text x="30" y="232">knees, lowering your centre</text>
<text x="30" y="252">of gravity so you don't fall;</text>
<text x="30" y="270" font-size="13" fill="#555">you can still crawl to move</text>
</g>

<!-- 2 cover -->
<g transform="translate(247,42)">
<rect x="0" y="0" width="226" height="298" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<line x1="12" y1="183" x2="214" y2="183" stroke="#999" stroke-width="3"/>
<use href="#table"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M104,158 L100,177 L66,177" stroke="#333" stroke-width="14"/><path d="M104,158 L100,177 L66,177" stroke="#f3e3d3" stroke-width="9"/>
</g>
<use href="#crouch"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M106,144 L84,128 L68,146" stroke="#333" stroke-width="14"/><path d="M106,144 L84,128 L68,146" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="66" cy="150" rx="6" ry="9" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<text x="22" y="84" font-size="13" fill="#0b5cad">sturdy table</text>
<text x="112" y="50" font-size="13" fill="#0b5cad">hands protect</text>
<text x="112" y="65" font-size="13" fill="#0b5cad">head and neck</text>
<line x1="124" y1="70" x2="90" y2="128" stroke="#0b5cad" stroke-width="1"/>
<line x1="50" y1="196" x2="76" y2="174" stroke="#0b5cad" stroke-width="1"/>
<text x="14" y="204" font-size="13" fill="#0b5cad">face down</text>
<text x="12" y="228"><tspan font-weight="bold">②</tspan> Cover: get under a sturdy</text>
<text x="30" y="248">table or piece of furniture;</text>
<text x="30" y="268">protect head and neck with</text>
<text x="30" y="286">your hands, face down</text>
</g>

<!-- 3 hold on -->
<g transform="translate(484,42)">
<rect x="0" y="0" width="226" height="298" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<line x1="12" y1="183" x2="214" y2="183" stroke="#999" stroke-width="3"/>
<use href="#table"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M100,150 L88,142" stroke="#333" stroke-width="14"/><path d="M100,150 L88,142" stroke="#e8c9b0" stroke-width="9"/>
</g>
<use href="#crouch"/>
<ellipse cx="88" cy="143" rx="7" ry="5" fill="#e8c9b0" stroke="#333" stroke-width="2"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M108,144 L74,120 L44,128" stroke="#333" stroke-width="14"/><path d="M108,144 L74,120 L44,128" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="38" cy="128" rx="8" ry="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<text x="10" y="70" font-size="13" fill="#0b5cad">hold the</text>
<text x="10" y="85" font-size="13" fill="#0b5cad">table leg</text>
<line x1="30" y1="89" x2="36" y2="120" stroke="#0b5cad" stroke-width="1"/>
<text x="110" y="70" font-size="13" fill="#0b5cad">other hand on</text>
<text x="110" y="85" font-size="13" fill="#0b5cad">head and neck</text>
<line x1="140" y1="89" x2="94" y2="140" stroke="#0b5cad" stroke-width="1"/>
<path d="M60,198 L170,198" stroke="#c33" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="12" y="228"><tspan font-weight="bold">③</tspan> Hold on: if the table</text>
<text x="30" y="248">shifts, move with it; stay</text>
<text x="30" y="268">in position until the</text>
<text x="30" y="286">shaking stops</text>
</g>

<!-- 4 no table -->
<g transform="translate(10,350)">
<rect x="0" y="0" width="350" height="258" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<line x1="12" y1="160" x2="338" y2="160" stroke="#999" stroke-width="3"/>
<rect x="18" y="16" width="14" height="144" fill="#e6e6e6" stroke="#999" stroke-width="2"/>
<text x="38" y="30" font-size="13" fill="#0b5cad">inside corner</text>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M52,140 L92,116 L88,152 L100,152" stroke="#333" stroke-width="19"/><path d="M52,140 L92,116 L88,152 L100,152" stroke="#cfe0f0" stroke-width="14"/>
<path d="M50,136 L66,94" stroke="#333" stroke-width="30"/><path d="M50,136 L66,94" stroke="#cfe0f0" stroke-width="25"/>
</g>
<circle cx="88" cy="86" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M74,80 Q80,66 96,72 Q84,72 74,80 Z" fill="#555"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M66,92 L72,64 L90,68" stroke="#333" stroke-width="14"/><path d="M66,92 L72,64 L90,68" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="92" cy="70" rx="8" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<text x="112" y="56" font-size="13" fill="#0b5cad">crouch, hands</text>
<text x="112" y="71" font-size="13" fill="#0b5cad">over head</text>
<line x1="110" y1="58" x2="96" y2="68" stroke="#0b5cad" stroke-width="1"/>
<!-- window -->
<rect x="210" y="40" width="44" height="58" fill="#eaf3fb" stroke="#333" stroke-width="2"/>
<line x1="232" y1="40" x2="232" y2="98" stroke="#333" stroke-width="1.5"/>
<line x1="210" y1="69" x2="254" y2="69" stroke="#333" stroke-width="1.5"/>
<path d="M214,46 L250,92 M250,46 L214,92" stroke="#c33" stroke-width="3"/>
<text x="232" y="116" font-size="13" text-anchor="middle" fill="#c33">window</text>
<!-- ceiling light -->
<line x1="300" y1="2" x2="300" y2="36" stroke="#333" stroke-width="1.5"/>
<path d="M284,52 L290,36 L310,36 L316,52 Z" fill="#f7e9b5" stroke="#333" stroke-width="2"/>
<path d="M286,40 L314,62 M314,40 L286,62" stroke="#c33" stroke-width="3"/>
<text x="300" y="80" font-size="13" text-anchor="middle" fill="#c33">lamp</text>
<!-- mirror -->
<rect x="282" y="94" width="34" height="50" rx="4" fill="#eef" stroke="#333" stroke-width="2"/>
<path d="M286,98 L312,140 M312,98 L286,140" stroke="#c33" stroke-width="3"/>
<text x="299" y="156" font-size="13" text-anchor="middle" fill="#c33">mirror</text>
<path d="M196,140 L128,140" stroke="#c33" stroke-width="3" marker-end="url(#ar)"/>
<text x="134" y="132" font-size="13" fill="#c33">keep away</text>
<text x="12" y="186"><tspan font-weight="bold">④</tspan> No table: crouch in an inside corner,</text>
<text x="30" y="206">hands over your head, away from windows,</text>
<text x="30" y="226">mirrors and ceiling lights; put a pillow,</text>
<text x="30" y="244">cushion or school bag over your head</text>
</g>

<!-- don'ts -->
<g transform="translate(370,350)">
<rect x="0" y="0" width="340" height="258" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="16" y="30" font-size="16" font-weight="bold" fill="#c33">While it shakes, don't</text>
<text x="16" y="58" font-size="15">✗ Jump from the building or use the lift</text>
<text x="16" y="84" font-size="15">✗ Run downstairs or into a building</text>
<text x="16" y="110" font-size="15">✗ Make a special dash for a doorway</text>
<text x="34" y="129" font-size="13" fill="#555">Modern doorways are no stronger than</text>
<text x="34" y="145" font-size="13" fill="#555">anywhere else</text>
<text x="16" y="171" font-size="15">✗ Stand on a balcony or by an outside wall</text>
<text x="16" y="197" font-size="15">✗ Go near windows, mirrors, tall cupboards</text>
<text x="16" y="223" font-size="15">✗ Delay to grab valuables or your phone</text>
</g>

<text x="360" y="632" font-size="14" text-anchor="middle">Strong shaking usually lasts from tens of seconds to a minute or two: take cover close by,</text>
<text x="360" y="650" font-size="14" text-anchor="middle">stay until the shaking stops, then evacuate</text>
</g>
</svg>
