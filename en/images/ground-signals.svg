<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 732" width="720" height="732" role="img" aria-label="International distress signals: SOS is short-short-short, long-long-long, short-short-short; when sent by whistle, torch or knocking, a short is about 1 second and a long about 3 seconds; the rule of three is three whistle blasts, three fires or three flashes, evenly spaced, with a pause of about 1 minute after each set before repeating; three fires go in a triangle or a straight line, about 20-30 m apart; ground-to-air signals: V need help, X need medical help, ↑ travelling in this direction, Y yes / agree, N no / refuse; lines about 0.5-1 m wide; ground markings such as SOS or HELP as large as possible, at least 3 m">
<rect width="100%" height="100%" fill="#fff"/>
<title>International distress and ground-to-air signals</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<g id="fire"><path d="M-14,0 L14,-3 M-14,-3 L14,0" stroke="#5a3d1e" stroke-width="4" stroke-linecap="round"/><path d="M-9,-3 Q-12,-15 -4,-23 Q-4,-15 0,-13 Q1,-24 7,-31 Q8,-17 12,-12 Q13,-5 9,-3 Z" fill="#f08a24" stroke="#c33" stroke-width="1.5"/><path d="M-4,-4 Q-5,-11 0,-15 Q1,-9 4,-7 Q5,-4 4,-4 Z" fill="#ffd34d"/></g>
<g id="bar"><rect x="0" y="0" width="12" height="18" rx="2" fill="#c33"/></g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">International distress signals: SOS and the rule of three</text>

<!-- 1 SOS -->
<g transform="translate(10,44)">
<rect x="0" y="0" width="345" height="256" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold"><tspan>①</tspan><tspan> SOS: 3 short, 3 long, 3 short</tspan></text>
<text x="172" y="66" font-size="24" font-weight="bold" text-anchor="middle" letter-spacing="2">... --- ...</text>
<g fill="#c33">
<rect x="16" y="88" width="14" height="18" rx="2"/><rect x="40" y="88" width="14" height="18" rx="2"/><rect x="64" y="88" width="14" height="18" rx="2"/>
<rect x="100" y="88" width="42" height="18" rx="2"/><rect x="152" y="88" width="42" height="18" rx="2"/><rect x="204" y="88" width="42" height="18" rx="2"/>
<rect x="268" y="88" width="14" height="18" rx="2"/><rect x="292" y="88" width="14" height="18" rx="2"/><rect x="316" y="88" width="14" height="18" rx="2"/>
</g>
<text x="47" y="128" font-size="15" font-weight="bold" text-anchor="middle">S</text>
<text x="173" y="128" font-size="15" font-weight="bold" text-anchor="middle">O</text>
<text x="299" y="128" font-size="15" font-weight="bold" text-anchor="middle">S</text>
<line x1="23" y1="108" x2="36" y2="146" stroke="#0b5cad" stroke-width="1"/>
<text x="16" y="162" font-size="14" fill="#0b5cad">short: about 1 second</text>
<line x1="121" y1="108" x2="186" y2="146" stroke="#0b5cad" stroke-width="1"/>
<text x="174" y="162" font-size="14" fill="#0b5cad">long: about 3 seconds</text>
<text x="12" y="198" font-size="14">A whistle, a torch or knocking can all send SOS</text>
<text x="12" y="222" font-size="14">At night, shine a torch or phone light</text>
<text x="12" y="241" font-size="14">up at the sky</text>
</g>

<!-- 2 rule of three -->
<g transform="translate(365,44)">
<rect x="0" y="0" width="345" height="256" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">② Rule of three: evenly spaced, repeated</text>
<!-- whistle -->
<g transform="translate(58,72)">
<path d="M-22,-10 L4,-10 A12,12 0 1 1 4,14 L-6,14 A12,12 0 0 1 -18,2 L-22,2 Z" fill="#cfe0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<circle cx="6" cy="2" r="4" fill="#333"/>
<path d="M24,-14 q6,6 0,12 M30,-20 q10,12 0,24 M36,-26 q14,18 0,36" fill="none" stroke="#c33" stroke-width="2" stroke-linecap="round"/>
</g>
<text x="58" y="122" font-size="14" text-anchor="middle">three whistles</text>
<!-- three fires -->
<use href="#fire" transform="translate(150,90) scale(0.8)"/>
<use href="#fire" transform="translate(174,90) scale(0.8)"/>
<use href="#fire" transform="translate(198,90) scale(0.8)"/>
<text x="174" y="122" font-size="14" text-anchor="middle">three fires</text>
<!-- three flashes -->
<g transform="translate(278,76)">
<rect x="-14" y="-10" width="22" height="28" rx="3" fill="#dfe9f3" stroke="#333" stroke-width="2" transform="rotate(-20)"/>
<path d="M8,-6 L30,-22 M10,2 L36,-4 M8,10 L30,18" stroke="#e08a00" stroke-width="2.5" stroke-linecap="round"/>
</g>
<text x="284" y="122" font-size="14" text-anchor="middle">three flashes</text>
<!-- rhythm -->
<use href="#bar" transform="translate(16,146)"/><use href="#bar" transform="translate(40,146)"/><use href="#bar" transform="translate(64,146)"/>
<path d="M84,155 L224,155" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="154" y="148" font-size="13" fill="#0b5cad" text-anchor="middle">pause about 1 minute</text>
<use href="#bar" transform="translate(232,146)"/><use href="#bar" transform="translate(256,146)"/><use href="#bar" transform="translate(280,146)"/>
<text x="302" y="162" font-size="16">…</text>
<text x="12" y="192" font-size="13">After each set of three, pause about 1 minute so</text>
<text x="12" y="210" font-size="13">listeners can judge the direction. When you hear</text>
<text x="12" y="228" font-size="13">a reply (also three), keep signalling to guide</text>
<text x="12" y="246" font-size="13">them to you</text>
</g>

<!-- 3 three fires -->
<g transform="translate(10,312)">
<rect x="0" y="0" width="345" height="292" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">③ Three fires: triangle or straight line</text>
<rect x="12" y="38" width="321" height="150" rx="4" fill="#f2ede1"/>
<path d="M90,72 L40,158 L140,158 Z" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="5 4"/>
<use href="#fire" transform="translate(90,80)"/>
<use href="#fire" transform="translate(40,166)"/>
<use href="#fire" transform="translate(140,166)"/>
<text x="90" y="182" font-size="13" fill="#0b5cad" text-anchor="middle">about 20-30 m</text>
<text x="124" y="96" font-size="13" fill="#0b5cad">about</text>
<text x="124" y="111" font-size="13" fill="#0b5cad">20-30 m</text>
<text x="178" y="124" font-size="15" text-anchor="middle">or</text>
<use href="#fire" transform="translate(206,128)"/>
<use href="#fire" transform="translate(260,128)"/>
<use href="#fire" transform="translate(314,128)"/>
<path d="M210,140 L256,140" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<path d="M264,140 L310,140" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="260" y="162" font-size="13" fill="#0b5cad" text-anchor="middle">about 20-30 m apart</text>
<text x="12" y="212" font-size="13">Build signal fires in advance and light them as</text>
<text x="12" y="230" font-size="13">soon as you hear an aircraft. Build them in the</text>
<text x="12" y="248" font-size="13">open or on high ground; take care not to start</text>
<text x="12" y="266" font-size="13">a forest fire</text>
<text x="333" y="284" font-size="12" fill="#888" text-anchor="end">Top view, distances not to scale</text>
</g>

<!-- 4 ground-to-air signals -->
<g transform="translate(365,312)">
<rect x="0" y="0" width="345" height="292" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">④ Ground-to-air signals (in the open)</text>
<g stroke="#4a3a28" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" fill="none">
<rect x="22" y="38" width="90" height="56" rx="4" fill="#eadfc6" stroke="none"/>
<path d="M53,48 L67,84 L81,48"/>
<rect x="128" y="38" width="90" height="56" rx="4" fill="#eadfc6" stroke="none"/>
<path d="M159,48 L187,84 M187,48 L159,84"/>
<rect x="234" y="38" width="90" height="56" rx="4" fill="#eadfc6" stroke="none"/>
<path d="M279,86 L279,52 M266,63 L279,48 L292,63"/>
<rect x="22" y="142" width="90" height="56" rx="4" fill="#eadfc6" stroke="none"/>
<path d="M53,152 L67,170 L81,152 M67,170 L67,188"/>
<rect x="128" y="142" width="90" height="56" rx="4" fill="#eadfc6" stroke="none"/>
<path d="M161,188 L161,152 L185,188 L185,152"/>
</g>
<text x="67" y="112" font-size="13" text-anchor="middle">V need help</text>
<text x="173" y="112" font-size="13" text-anchor="middle">X need</text>
<text x="173" y="128" font-size="13" text-anchor="middle">medical help</text>
<text x="279" y="112" font-size="13" text-anchor="middle">↑ travelling</text>
<text x="279" y="128" font-size="13" text-anchor="middle">this way</text>
<text x="67" y="216" font-size="13" text-anchor="middle">Y yes / agree</text>
<text x="173" y="216" font-size="13" text-anchor="middle">N no / refuse</text>
<line x1="189" y1="176" x2="246" y2="162" stroke="#0b5cad" stroke-width="1"/>
<circle cx="189" cy="176" r="2.5" fill="#0b5cad"/>
<text x="250" y="160" font-size="13" fill="#0b5cad">lines about</text>
<text x="250" y="177" font-size="13" fill="#0b5cad">0.5-1 m wide</text>
<text x="12" y="244" font-size="13">Make each symbol as large as possible; SOS or</text>
<text x="12" y="262" font-size="13">HELP at least 3 m, in colours that stand out</text>
<text x="12" y="280" font-size="13">clearly from the surroundings</text>
</g>

<rect x="10" y="616" width="700" height="104" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="26" y="640" font-size="14">The best call for help is made before anything goes wrong: leave a route plan before you</text>
<text x="26" y="660" font-size="14">set out. If you have phone signal, call the police first.</text>
<text x="26" y="686" font-size="14">Lay symbols with stones, branches, bright clothing or dug trenches; straight lines and</text>
<text x="26" y="706" font-size="14">right angles are rare in nature, so they are easier to spot</text>
</g>
</svg>
