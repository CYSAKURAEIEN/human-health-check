<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 952" width="720" height="952" role="img" aria-label="Wire drawing: file one end of a metal rod to a point, push it through a hole slightly smaller than the rod and pull it out hard from the other side, and it becomes thinner and longer; draw it again and again through a series of holes from large to small to get the fine wire you need. The draw plate is high-carbon steel (salvaged files and leaf springs are best), about 1-2 cm thick, with a row of holes from large to small, each opened out from the back into a cone, wide at the entry and narrow at the exit; the diameter at the exit is the diameter of wire from that hole; neighbouring holes reduce the cross-sectional area by about 10-20%, i.e. the diameter by about 5-10%; smooth the hole walls, then harden and temper. Drawing steps: anneal the blank, file or hammer one end to a point, lubricate with soap, wax, beef or mutton fat, fix the draw plate in a vice or to a wooden post, grip the point that comes through with pliers and pull hard; pull thick wire with a winch or lever; move to the next smaller hole and repeat; after a few passes the wire becomes hard and brittle, so anneal it and carry on; pickle the scale off iron wire after annealing. Annealing: copper and brass, heat to dark red and cool in air or quench straight into water; iron and mild steel, heat to cherry red (about 780-850°C) and bury in furnace ash to cool slowly; aluminium, about 300-400°C, never red hot; rub on soap and heat until the soap turns black or a marker-pen mark disappears. A wire that snaps suddenly whips back hard: never stand in line with the wire" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>The draw plate and wire drawing</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
<marker id="tkB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5,0 V10" stroke="#0b5cad" stroke-width="1.5"/></marker>
<pattern id="steel" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#b8c2cc"/><path d="M0,0 V8" stroke="#6f7983" stroke-width="1.2"/></pattern>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Wire drawing: pull through holes from large to small, again and again</text>

<!-- 1 draw plate -->
<rect x="10" y="44" width="700" height="296" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① The draw plate</text>
<text x="178" y="70" font-size="14" fill="#555">high-carbon steel (salvaged files and leaf springs are best)</text>

<text x="190" y="98" font-size="13" fill="#555" text-anchor="middle">front view (exit side)</text>
<rect x="30" y="108" width="320" height="76" rx="4" fill="#8a949e" stroke="#333" stroke-width="2"/>
<g fill="#fff" stroke="#333" stroke-width="1.8">
<circle cx="60" cy="146" r="15"/>
<circle cx="104" cy="146" r="13.9"/>
<circle cx="147" cy="146" r="12.9"/>
<circle cx="189" cy="146" r="12"/>
<circle cx="230" cy="146" r="11.2"/>
<circle cx="270" cy="146" r="10.4"/>
<circle cx="309" cy="146" r="9.7"/>
</g>
<line x1="60" y1="204" x2="309" y2="204" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="190" y="224" font-size="14" fill="#0b5cad" text-anchor="middle">a row of holes from large to small;</text>
<text x="190" y="242" font-size="14" fill="#0b5cad" text-anchor="middle">move down one size each pass</text>

<!-- section -->
<text x="560" y="98" font-size="13" fill="#555" text-anchor="middle">one hole in section</text>
<path d="M530,108 H590 V170 L530,154 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M530,206 L590,190 V214 H530 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M530,108 V214 M590,108 V214" stroke="#333" stroke-width="2"/>
<text x="522" y="146" font-size="13" text-anchor="end">wide entry</text>
<text x="522" y="162" font-size="12" fill="#555" text-anchor="end">(opened out from the</text>
<text x="522" y="177" font-size="12" fill="#555" text-anchor="end">back into a cone)</text>
<text x="598" y="130" font-size="13">narrow exit</text>
<path d="M592,170 H612 M592,190 H612" stroke="#0b5cad" stroke-width="1" stroke-dasharray="2 2"/>
<path d="M606,152 V168" stroke="#0b5cad" stroke-width="1.3" marker-end="url(#arB)"/>
<path d="M606,208 V192" stroke="#0b5cad" stroke-width="1.3" marker-end="url(#arB)"/>
<text x="618" y="168" font-size="12" fill="#0b5cad">exit diameter</text>
<text x="618" y="184" font-size="12" fill="#0b5cad">= diameter of</text>
<text x="618" y="200" font-size="12" fill="#0b5cad">this wire</text>
<path d="M530,232 H590" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="560" y="250" font-size="13" fill="#0b5cad" text-anchor="middle">about 1-2 cm thick</text>

<text x="24" y="272" font-size="14">Neighbouring holes: cross-sectional area about 10-20% smaller (i.e. diameter about 5-10%</text>
<text x="24" y="290" font-size="14">smaller); too big a step and the wire snaps</text>
<text x="24" y="314" font-size="13" fill="#555">Making it: anneal to soften → drill → open out from the back into a cone → smooth the hole walls</text>
<text x="24" y="330" font-size="13" fill="#555">→ harden and temper (hard, wear-resistant hole walls)</text>

<!-- 2 one pass -->
<g transform="translate(0,38)">
<rect x="10" y="314" width="700" height="270" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="340" font-size="16" font-weight="bold">② One pass (section)</text>

<!-- post / vice -->
<rect x="282" y="470" width="76" height="70" fill="#d9b38c" stroke="#333" stroke-width="2"/>
<text x="320" y="516" font-size="12" fill="#555" text-anchor="middle">vice or</text>
<text x="320" y="530" font-size="12" fill="#555" text-anchor="middle">wooden post</text>
<!-- draw plate in section -->
<path d="M300,360 H340 V424 L300,418 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M300,442 L340,436 V470 H300 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M300,360 V470 M340,360 V470" stroke="#333" stroke-width="2"/>
<text x="320" y="354" font-size="13" text-anchor="middle">draw plate</text>
<!-- wire blank -->
<path d="M50,421 H300 L340,424 H476 L500,430 L476,436 H340 L300,439 H50" fill="#d08a4f" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M50,421 q-6,4 0,9 q6,5 0,9" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- lubricant -->
<path d="M246,421 q10,-9 22,-4 q14,-6 26,2 L300,421 Z M246,439 q12,8 24,3 q14,6 30,-3 Z" fill="#f2e6a8" stroke="#a89040" stroke-width="1.2"/>
<path d="M246,404 L262,415" stroke="#555" stroke-width="1"/>
<text x="240" y="384" font-size="13" text-anchor="end">lubricate:</text>
<text x="240" y="401" font-size="13" text-anchor="end">soap, wax, beef or mutton fat</text>
<text x="150" y="464" font-size="13" text-anchor="middle">blank: a round rod of even</text>
<text x="150" y="480" font-size="13" text-anchor="middle">thickness, annealed first</text>
<line x1="150" y1="450" x2="150" y2="441" stroke="#555" stroke-width="1"/>
<text x="408" y="464" font-size="13" text-anchor="middle">thinner, longer</text>
<line x1="408" y1="450" x2="408" y2="438" stroke="#555" stroke-width="1"/>
<!-- pliers -->
<path d="M464,420 H494 L516,430 L610,410" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M464,440 H494 L516,430 L610,450" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="516" cy="430" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="480" y="384" font-size="13" text-anchor="middle">end filed or hammered to a</text>
<text x="480" y="401" font-size="13" text-anchor="middle">point, pushed through the entry</text>
<text x="560" y="466" font-size="13" text-anchor="middle">pliers grip the point</text>
<line x1="618" y1="430" x2="694" y2="430" stroke="#c33" stroke-width="4" marker-end="url(#arR)"/>
<text x="656" y="410" font-size="14" fill="#c33" font-weight="bold" text-anchor="middle">pull hard</text>
<text x="604" y="496" font-size="13" text-anchor="middle">thick wire: winch or lever</text>

<rect x="380" y="510" width="318" height="64" rx="5" fill="#fbeeee" stroke="#c33" stroke-width="1.2"/>
<text x="392" y="529" font-size="13" fill="#c33" font-weight="bold">⚠️ A wire that snaps whips back hard:</text>
<text x="392" y="547" font-size="13" fill="#c33">never stand in line with the wire; keep</text>
<text x="392" y="564" font-size="13" fill="#c33">everyone clear when using a winch</text>
</g>

<!-- 3 repeat -->
<g transform="translate(0,58)">
<rect x="10" y="576" width="700" height="308" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="602" font-size="16" font-weight="bold">③ Repeat: a few passes → anneal → draw again</text>
<g fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5">
<rect x="24" y="616" width="150" height="50" rx="6"/>
<rect x="198" y="616" width="150" height="50" rx="6"/>
<rect x="372" y="616" width="150" height="50" rx="6" fill="#fbeeee" stroke="#c33"/>
<rect x="546" y="616" width="150" height="50" rx="6"/>
</g>
<g font-size="14" text-anchor="middle">
<text x="99" y="637">next smaller hole,</text><text x="99" y="656">draw again</text>
<text x="273" y="637">after a few passes:</text><text x="273" y="656">hard and brittle</text>
<text x="447" y="637" font-weight="bold" fill="#c33">anneal</text><text x="447" y="656">soft again</text>
<text x="621" y="637">iron wire: pickle</text><text x="621" y="656">off the scale first</text>
</g>
<g stroke="#0b5cad" stroke-width="2"><line x1="176" y1="641" x2="194" y2="641" marker-end="url(#arB)"/><line x1="350" y1="641" x2="368" y2="641" marker-end="url(#arB)"/><line x1="524" y1="641" x2="542" y2="641" marker-end="url(#arB)"/></g>
<path d="M621,668 V684 H99 V672" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="360" y="700" font-size="13" fill="#0b5cad" text-anchor="middle">carry on drawing</text>

<text x="24" y="726" font-size="14" font-weight="bold">Annealing</text>
<line x1="24" y1="734" x2="696" y2="734" stroke="#ccc" stroke-width="1"/>
<rect x="24" y="744" width="16" height="16" rx="3" fill="#8e1c14" stroke="#333" stroke-width="1"/>
<text x="48" y="757" font-size="14" font-weight="bold">copper, brass</text>
<text x="172" y="757" font-size="13">heat to dark red; cool in air or quench in water (fast cooling does not harden it)</text>
<rect x="24" y="772" width="16" height="16" rx="3" fill="#d23a1e" stroke="#333" stroke-width="1"/>
<text x="48" y="785" font-size="14" font-weight="bold">iron, mild steel</text>
<text x="172" y="785" font-size="13">heat to cherry red (about 780-850°C), bury in furnace ash and let it cool slowly</text>
<rect x="24" y="800" width="16" height="16" rx="3" fill="#d6dde4" stroke="#333" stroke-width="1"/>
<path d="M27,803 L37,813 M37,803 L27,813" stroke="#c33" stroke-width="1.6"/>
<text x="48" y="813" font-size="14" font-weight="bold">aluminium</text>
<text x="172" y="813" font-size="13">about 300-400°C, never red hot (it would melt); rub on soap and heat</text>
<text x="172" y="830" font-size="13">until the soap turns black</text>
<text x="24" y="856" font-size="13" fill="#555">Copper wire is easiest to draw, aluminium next, iron wire hardest. Annealed work is very hot:</text>
<text x="24" y="873" font-size="13" fill="#555">even when it does not look red it can be several hundred °C</text>
</g>
</g>
</svg>
