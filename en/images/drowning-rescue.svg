<path d="M108,72 L90,84 L72,82" stroke="#333" stroke-width="14"/><path d="M108,72 L90,84 L72,82" stroke="#f3e3d3" stroke-width="9"/>
</g>
<circle cx="112" cy="48" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M98,44 Q102,30 118,33 Q106,36 98,44 Z" fill="#555"/>
<ellipse cx="70" cy="82" rx="7" ry="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M112,74 L134,90 L146,86" stroke="#333" stroke-width="14"/><path d="M112,74 L134,90 L146,86" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="148" cy="86" rx="7" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>

<path d="M326,110 L244,91" stroke="#c33" stroke-width="3" marker-end="url(#ar)"/>
<text x="250" y="80" font-size="14" fill="#c33">Pull back slowly</text>

<text x="12" y="16" font-size="13" fill="#0b5cad">Other hand holds</text>
<text x="12" y="30" font-size="13" fill="#0b5cad">something fixed</text>
<line x1="40" y1="35" x2="66" y2="78" stroke="#0b5cad" stroke-width="1"/>
<text x="250" y="28" font-size="13" fill="#0b5cad">A bamboo pole, branch, knotted</text>
<text x="250" y="46" font-size="13" fill="#0b5cad">strip of clothes or belt all work</text>
<line x1="420" y1="50" x2="334" y2="126" stroke="#0b5cad" stroke-width="1"/>
<text x="40" y="154" font-size="13" fill="#0b5cad">Lie or crouch low, weight low</text>
<line x1="110" y1="142" x2="116" y2="128" stroke="#0b5cad" stroke-width="1"/>
<text x="12" y="204"><tspan font-weight="bold">① Reach:</tspan> lie on the bank or crouch low; hold something</text>
<text x="26" y="222">fixed with the other hand and hold out the pole or strip;</text>
<text x="26" y="240">once they grab it, pull them in slowly.</text>
<text x="26" y="258" fill="#c33">If you feel yourself being pulled into the water, let go at once</text>
</g>


