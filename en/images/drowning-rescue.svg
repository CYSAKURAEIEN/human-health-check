<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" width="720" height="920" role="img" aria-label="Order of water rescue: first shout, call loudly for help and have bystanders call 110/120; 1 reach: lie on the bank or crouch low to keep your weight low, hold something fixed with the other hand, and hold out a bamboo pole, branch, strip of knotted clothes or belt; once they grab it, pull them in slowly, and let go at once if you feel yourself being pulled into the water; 2 throw: throw a lifebuoy or anything else that floats, ideally tied to a rope, in front of them on the downstream side; 3 row: approach by boat; 4 swim: the last resort, only with training; non-swimmers must not go into the water, and do not form a human chain holding hands into the water">
<rect width="100%" height="100%" fill="#fff"/>
<title>Water rescue: shout, then reach, throw, row, and swim only as a last resort</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="17" font-weight="bold" text-anchor="middle">Water rescue: try everything from the bank first; go in only as a last resort</text>


<g text-anchor="middle">
<rect x="10" y="42" width="120" height="50" rx="8" fill="#eef5fb" stroke="#0b5cad" stroke-width="1.5"/>
<text x="70" y="64" font-size="17" font-weight="bold">Shout</text>
<text x="70" y="84" font-size="13" fill="#555">call for help</text>
<rect x="155" y="42" width="120" height="50" rx="8" fill="#eef5fb" stroke="#0b5cad" stroke-width="1.5"/>
<text x="215" y="64" font-size="17" font-weight="bold">① Reach</text>
<text x="215" y="84" font-size="13" fill="#555">hold out a pole</text>
<rect x="300" y="42" width="120" height="50" rx="8" fill="#eef5fb" stroke="#0b5cad" stroke-width="1.5"/>
<text x="360" y="64" font-size="17" font-weight="bold">② Throw</text>
<text x="360" y="84" font-size="13" fill="#555">a floating object</text>
<rect x="445" y="42" width="120" height="50" rx="8" fill="#eef5fb" stroke="#0b5cad" stroke-width="1.5"/>
<text x="505" y="64" font-size="17" font-weight="bold">③ Row</text>
<text x="505" y="84" font-size="13" fill="#555">approach by boat</text>
<rect x="590" y="42" width="120" height="50" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
<text x="650" y="64" font-size="17" font-weight="bold" fill="#c33">④ Swim</text>
<text x="650" y="84" font-size="13" fill="#c33">last resort, trained</text>
</g>
<g stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)">
<path d="M133,67 L152,67"/><path d="M278,67 L297,67"/><path d="M423,67 L442,67"/><path d="M568,67 L587,67"/>
</g>


<g transform="translate(10,102)">
