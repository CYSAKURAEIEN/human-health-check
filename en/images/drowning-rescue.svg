<circle cx="190" cy="132" r="11" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M180,127 Q190,116 200,127 Q190,122 180,127 Z" fill="#555"/>
<rect x="176" y="141" width="28" height="40" fill="#d8ebf7"/>
<path d="M174,140 L206,140" stroke="#7aa6cc" stroke-width="2"/>
<path d="M146,108 L178,118" stroke="#c33" stroke-width="3" marker-end="url(#ar)"/>
<text x="12" y="204"><tspan font-weight="bold">③ Row:</tspan> approach by boat</text>
</g>


<g transform="translate(10,662)">
<rect x="0" y="0" width="350" height="216" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="30" font-size="16" font-weight="bold">④ Swim: the last resort (needs training)</text>
<text x="16" y="56" font-size="13" fill="#555">If you must swim out (trained, no other way):</text>
<text x="16" y="84" font-size="14">• Take a float; stop a few metres away</text>
<text x="16" y="110" font-size="14">• Push the float to them first, then</text>
<text x="28" y="128" font-size="14">approach from behind</text>
<text x="16" y="154" font-size="14">• If they grab you, take a deep breath and</text>
<text x="28" y="172" font-size="14">sink under the water: they will let go</text>
<text x="28" y="190" font-size="14">by instinct</text>
</g>


<g transform="translate(370,662)">
<rect x="0" y="0" width="340" height="216" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="16" y="30" font-size="16" font-weight="bold" fill="#c33">⚠ Safety first</text>
<text x="16" y="58" font-size="14">✗ Non-swimmers must not go in: the</text>
<text x="32" y="76" font-size="14">drowning person may pull you under</text>
<text x="16" y="100" font-size="14">✗ Don't form a "human chain" holding</text>
<text x="32" y="118" font-size="14">hands to go into the water</text>
<text x="16" y="142" font-size="14">✗ Don't go in as a group</text>
<text x="16" y="166" font-size="14">✗ Fallen through ice: don't walk straight</text>
<text x="32" y="184" font-size="14">out onto the ice; lie flat and rescue</text>
<text x="32" y="202" font-size="14">with a long pole, ladder or rope</text>
</g>

<text x="360" y="904" font-size="15" text-anchor="middle">A drowning person often does not shout or wave, and sinks within tens of seconds</text>
</g>
</svg>
