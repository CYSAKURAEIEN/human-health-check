<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M76,92 L62,126 M80,92 L98,126" stroke="#333" stroke-width="19"/><path d="M76,92 L62,126 M80,92 L98,126" stroke="#cfe0f0" stroke-width="14"/>
