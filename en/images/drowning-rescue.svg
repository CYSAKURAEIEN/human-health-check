<text x="168" y="172" font-size="13" fill="#0b5cad">Ideally tied to a rope</text>
<line x1="192" y1="160" x2="190" y2="142" stroke="#0b5cad" stroke-width="1"/>

<g transform="translate(312,14)">
<rect x="0" y="0" width="140" height="104" rx="6" fill="#fff" stroke="#bbb" stroke-width="1"/>
<text x="8" y="17" font-size="12" fill="#555">Top view</text>
<rect x="1" y="24" width="138" height="52" fill="#d8ebf7"/>
<path d="M1,76 L139,76" stroke="#999" stroke-width="2"/>
<path d="M14,36 L58,36" stroke="#0b5cad" stroke-width="2" marker-end="url(#ab)"/>
<text x="64" y="40" font-size="12" fill="#0b5cad">current</text>
<circle cx="72" cy="58" r="6" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<circle cx="102" cy="58" r="7" fill="none" stroke="#f08a3c" stroke-width="4"/>
<circle cx="40" cy="88" r="7" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<path d="M45,84 L95,61" stroke="#c33" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="54" y="99" font-size="12" fill="#222">you (on bank)</text>
<text x="113" y="62" font-size="12" fill="#c33">aim</text>
</g>
<text x="12" y="204" font-size="13"><tspan font-weight="bold">② Throw:</tspan> anything that floats: a lifebuoy, an empty</text>
<text x="26" y="222" font-size="13">plastic container with a little water in it (throws more</text>
<text x="26" y="240" font-size="13">accurately), empty drink bottles, a basketball, foam board, a</text>
<text x="26" y="258" font-size="13">rucksack; ideally tie on a rope; throw it in front of them, downstream</text>
</g>


<g transform="translate(484,382)">
<rect x="0" y="0" width="226" height="270" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<rect x="12" y="140" width="202" height="42" fill="#d8ebf7"/>
