<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" width="720" height="950" role="img" aria-label="RCDs and circuit breakers: the consumer unit at home usually has two kinds of switch, which do different jobs. A circuit breaker (MCB) trips when the current is too high (overload, short circuit) and prevents electrical fires; it is an ordinary switch. An RCD trips quickly when current leaks to a person or to earth and prevents electric shock; it has a T or Test button. Socket circuits, bathrooms and kitchens must have RCD protection; for homes usually choose one with a rated tripping current of 30 mA; in old houses without one, have an electrician fit one. Press the Test button once a month: it should trip at once, then switch it back on; if it does not trip, the RCD has failed and an electrician should replace it. After a trip: first unplug the appliance you were using, then switch back on; if it trips again, there is a fault in the wiring or an appliance, so do not keep forcing it back on and have an electrician check it; never remove or bypass an RCD, or replace it with a bigger switch, because it keeps tripping. Have a qualified electrician change wiring or replace switches in the consumer unit" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>RCDs and circuit breakers</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
<!-- circuit breaker -->
<g id="mcb">
<rect x="-28" y="-60" width="56" height="120" rx="5" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
<rect x="-16" y="-55" width="32" height="12" rx="2" fill="#c9c9c9" stroke="#555"/>
<rect x="-16" y="43" width="32" height="12" rx="2" fill="#c9c9c9" stroke="#555"/>
<rect x="-10" y="-26" width="20" height="52" rx="3" fill="#ddd" stroke="#333" stroke-width="1.5"/>
</g>
<!-- RCD -->
<g id="rcd">
<rect x="-46" y="-60" width="92" height="120" rx="5" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
<rect x="-38" y="-55" width="76" height="12" rx="2" fill="#c9c9c9" stroke="#555"/>
<rect x="-38" y="43" width="76" height="12" rx="2" fill="#c9c9c9" stroke="#555"/>
<rect x="-28" y="-26" width="20" height="52" rx="3" fill="#ddd" stroke="#333" stroke-width="1.5"/>
<circle cx="22" cy="0" r="11" fill="#f2c14e" stroke="#333" stroke-width="2"/>
<text x="22" y="5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">T</text>
</g>
<rect id="lvUp" x="-8" y="-24" width="16" height="22" rx="2" fill="#333"/>
<rect id="lvDn" x="-8" y="2" width="16" height="22" rx="2" fill="#333"/>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">RCDs and circuit breakers: two switches, different jobs</text>

<!-- 1 circuit breaker -->
<rect x="10" y="44" width="345" height="432" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="72" font-size="16" font-weight="bold">Circuit breaker (MCB)</text>
<use href="#mcb" x="80" y="170"/><use href="#lvUp" x="80" y="170"/>
<text x="80" y="250" font-size="13" fill="#555" text-anchor="middle">an ordinary switch</text>
<!-- overload fire icon -->
<rect x="150" y="196" width="120" height="22" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
<g fill="#333"><rect x="160" y="182" width="14" height="14" rx="2"/><rect x="184" y="182" width="14" height="14" rx="2"/><rect x="208" y="182" width="14" height="14" rx="2"/><rect x="232" y="182" width="14" height="14" rx="2"/><rect x="256" y="182" width="10" height="14" rx="2"/></g>
<path d="M167 182 Q160 150 150 140 M191 182 Q190 150 182 136 M215 182 Q220 150 216 134 M239 182 Q248 152 252 136" fill="none" stroke="#333" stroke-width="2"/>
<path d="M270 207 H330" stroke="#333" stroke-width="3"/>
<path d="M290 206 Q284 186 294 176 Q296 188 302 182 Q300 168 312 160 Q312 178 320 186 Q324 198 314 206 Z" fill="#f2a33a" stroke="#c33" stroke-width="1.5"/>
<text x="160" y="106" font-size="13" fill="#c33">current too high</text>
<text x="160" y="122" font-size="13" fill="#c33">(overload, short circuit)</text>
<text x="24" y="286" font-size="14">Trips when the current is too high</text>
<text x="24" y="304" font-size="14">(overload, short circuit)</text>
<text x="24" y="334" font-size="17" font-weight="bold" fill="#c33">→ prevents electrical fires</text>

<!-- 1 RCD -->
<rect x="365" y="44" width="345" height="432" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="379" y="72" font-size="16" font-weight="bold">RCD (residual current device)</text>
<use href="#rcd" x="440" y="170"/><use href="#lvUp" x="422" y="170"/>
<text x="460" y="250" font-size="13" fill="#555" text-anchor="middle">has a "T" or "Test" button</text>
<line x1="500" y1="110" x2="465" y2="160" stroke="#0b5cad" stroke-width="1.2"/><circle cx="465" cy="160" r="2.6" fill="#0b5cad"/>
<text x="476" y="104" font-size="13" fill="#0b5cad">Test button</text>
<!-- leakage shock icon -->
<path d="M520 150 H700" stroke="#333" stroke-width="3"/>
<path d="M596 145 H612 V155 H596 Z" fill="#c33" stroke="#333" stroke-width="1"/>
<circle cx="640" cy="176" r="8" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="632" y="186" width="16" height="30" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M634 192 L606 152" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M636 216 L634 242 M644 216 L646 242" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M600 242 H690" stroke="#999" stroke-width="3"/>
<path d="M610 160 L630 194 L640 214 L640 236" fill="none" stroke="#c33" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arR)"/>
<text x="528" y="176" font-size="13" fill="#c33">leaks to</text>
<text x="528" y="192" font-size="13" fill="#c33">a person</text>
<text x="528" y="208" font-size="13" fill="#c33">or to earth</text>
<text x="379" y="286" font-size="14">Trips quickly when current leaks to</text>
<text x="379" y="304" font-size="14">a person or to earth</text>
<text x="379" y="334" font-size="17" font-weight="bold" fill="#c33">→ prevents electric shock</text>
<text x="379" y="362" font-size="14">✓ Socket circuits, bathrooms and kitchens</text>
<text x="395" y="380" font-size="14">must have one</text>
<text x="379" y="402" font-size="14">✓ For homes, usually choose a rated</text>
<text x="395" y="420" font-size="14">tripping current of <tspan font-weight="bold">30 mA</tspan></text>
<text x="379" y="442" font-size="14">✓ Old houses without one: have an</text>
<text x="395" y="460" font-size="14">electrician fit one</text>

<!-- 2 monthly test -->
<g transform="translate(0,66)">
<rect x="10" y="422" width="700" height="214" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="448" font-size="16" font-weight="bold">Press the "Test" button once a month</text>
<g transform="translate(86,530) scale(0.75)"><use href="#rcd"/><use href="#lvUp" x="-18"/></g>
<path d="M136 470 L108 522" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="140" y="476" font-size="13" fill="#c33" font-weight="bold">press</text>
<path d="M150 530 H186" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<g transform="translate(250,530) scale(0.75)"><use href="#rcd"/><use href="#lvDn" x="-18"/></g>
<path d="M216 500 V552" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M314 530 H350" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<g transform="translate(414,530) scale(0.75)"><use href="#rcd"/><use href="#lvUp" x="-18"/></g>
<path d="M380 558 V506" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="86" y="602" font-size="14" font-weight="bold" text-anchor="middle">① Press the</text>
<text x="86" y="620" font-size="14" font-weight="bold" text-anchor="middle">"Test" button</text>
<text x="250" y="602" font-size="14" font-weight="bold" text-anchor="middle">② It should</text>
<text x="250" y="620" font-size="14" font-weight="bold" text-anchor="middle">trip at once</text>
<text x="414" y="602" font-size="14" font-weight="bold" text-anchor="middle">③ Then switch</text>
<text x="414" y="620" font-size="14" font-weight="bold" text-anchor="middle">it back on</text>
<rect x="500" y="478" width="196" height="110" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="514" y="504" font-size="15" font-weight="bold" fill="#c33">✗ Does not trip</text>
<text x="514" y="528" font-size="14">The RCD has failed</text>
<text x="514" y="552" font-size="14" font-weight="bold">→ have an electrician</text>
<text x="530" y="570" font-size="14" font-weight="bold">replace it</text>

</g>

<!-- 3 after a trip -->
<g transform="translate(0,58)">
<rect x="10" y="654" width="700" height="226" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="680" font-size="16" font-weight="bold">After a trip</text>
<g font-size="14">
<rect x="24" y="696" width="150" height="84" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="99" y="722" text-anchor="middle" font-weight="bold">① First unplug</text>
<text x="99" y="742" text-anchor="middle">the appliance</text>
<text x="99" y="760" text-anchor="middle">you were using</text>
<path d="M176 738 H196" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<rect x="200" y="696" width="120" height="84" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="260" y="734" text-anchor="middle" font-weight="bold">② Then switch</text>
<text x="260" y="752" text-anchor="middle" font-weight="bold">back on</text>
<path d="M322 738 H342" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<rect x="346" y="696" width="120" height="84" rx="6" fill="#fff" stroke="#555" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="406" y="734" text-anchor="middle" font-weight="bold">Trips again</text>
<text x="406" y="752" text-anchor="middle" font-weight="bold">after that?</text>
<path d="M468 738 H488" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<rect x="492" y="696" width="204" height="84" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="502" y="716" font-size="13">Fault in the wiring or</text>
<text x="502" y="733" font-size="13">an appliance:</text>
<text x="502" y="752" font-size="13" font-weight="bold" fill="#c33">do not keep forcing it on;</text>
<text x="502" y="769" font-size="13" font-weight="bold" fill="#c33">have an electrician check it</text>
</g>
<text x="24" y="806" font-size="14" font-weight="bold" fill="#c33">✗ Never remove or bypass an RCD, or replace it with a bigger switch,</text>
<text x="38" y="824" font-size="14" font-weight="bold" fill="#c33">because "it keeps tripping"</text>
<text x="24" y="850" font-size="14" fill="#555">Replacing switches in the consumer unit or changing the wiring</text>
<text x="24" y="868" font-size="14" fill="#555">→ use a qualified electrician; do not do it yourself</text>
</g>
</g>
</svg>
