<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 932" width="720" height="932" role="img" aria-label="Niubangzi (burdock fruit) compared with Cang'erzi (cocklebur fruit): both are in the daisy family, both have hooked prickles, both stick to clothing, and they often grow together in the wild. Burdock is a tall herb, 1-2 m tall; its basal leaves are very large, broadly ovate or heart-shaped, with greyish-white felt underneath; the flower heads are round, the bracts hooked at the tip, the flowers purplish-red, and when ripe the whole round involucre is like a hooked burr. The herb Niubangzi is the achene knocked out of the burr: long-obovoid, slightly flattened, slightly curved, 5-7 mm long, greyish-brown with purplish-black spots and several lengthwise ridges. Cocklebur is toxic and damages the liver; its leaves are triangular-ovate and rough, its burrs spindle-shaped or elliptical, about 1-1.5 cm long, and the whole prickly fruit is Cang'erzi. Do not collect them mixed; if unsure, do not pick; wear gloves when harvesting">
<rect width="100%" height="100%" fill="#fff"/>
<title>Niubangzi (burdock fruit) compared with Cang'erzi (cocklebur fruit)</title>
