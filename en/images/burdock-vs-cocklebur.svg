<text x="520" y="532" font-size="15" font-weight="bold">Spindle-shaped or</text>
<text x="520" y="550" font-size="15" font-weight="bold">elliptical</text>
<text x="520" y="572" font-size="14">about 1-1.5 cm long,</text>
<text x="520" y="590" font-size="14">covered in hooked</text>
<text x="520" y="608" font-size="14">prickles</text>
<text x="520" y="636" font-size="15" font-weight="bold" fill="#c33">The whole prickly</text>
<text x="520" y="656" font-size="15" font-weight="bold" fill="#c33">fruit is Cang'erzi</text>
<text x="538" y="714" font-size="13" fill="#555" text-anchor="middle">Cang'erzi is the whole prickly fruit,</text>
<text x="538" y="731" font-size="13" fill="#555" text-anchor="middle">not an achene knocked out of it</text>
<rect x="10" y="756" width="700" height="166" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="784" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">Cocklebur fruit is toxic and damages the liver —</text>
<text x="360" y="805" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">do not collect it mixed with burdock fruit</text>
<text x="360" y="834" font-size="15" text-anchor="middle">Tall, very large leaves, round burrs, purplish-red flowers → burdock</text>
<text x="360" y="857" font-size="15" text-anchor="middle">Rough, triangular-ovate leaves, spindle-shaped burrs → cocklebur</text>
<text x="360" y="886" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">If you cannot tell them apart, do not pick; the hooked bracts and</text>
<text x="360" y="907" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">fine bristles irritate the skin — wear gloves when harvesting</text>
</g>
</svg>
