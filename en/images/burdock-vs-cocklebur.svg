<text x="212" y="504" font-size="13" fill="#0b5cad">Tip bluntly rounded,</text>
<text x="212" y="520" font-size="13" fill="#0b5cad">with a ring</text>
<text x="212" y="556" font-size="14" font-weight="bold">Herb: achene</text>
<text x="212" y="574" font-size="13">long-obovoid,</text>
<text x="212" y="590" font-size="13">slightly flattened</text>
<text x="212" y="606" font-size="13">and curved,</text>
<text x="212" y="622" font-size="13">5-7 mm long;</text>
<text x="212" y="638" font-size="13">greyish-brown with</text>
<text x="212" y="654" font-size="13">purplish-black spots;</text>
<text x="212" y="670" font-size="13">several lengthwise</text>
<text x="212" y="686" font-size="13">ridges</text>
<text x="182" y="714" font-size="13" fill="#555" text-anchor="middle">Niubangzi is the achene knocked out</text>
<text x="182" y="731" font-size="13" fill="#555" text-anchor="middle">of the burr, not the burr itself</text>
