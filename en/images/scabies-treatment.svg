<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img" aria-label="Treating scabies: see a doctor to confirm it and use anti-scabies medicine (mainly creams) as the doctor or the leaflet says. 1 Apply the cream to all the skin from the neck down, not just the itchy areas; for babies and young children include the head and face as the doctor says; leave it on for the stated time before washing it off; usually a second treatment is needed after an interval. 2 Family members living together and close contacts must be treated at the same time, even without symptoms, otherwise you keep reinfecting each other. Clothing and bedding, dealt with on the day of treatment: 3 wash in hot water (50-60°C or hotter); 4 dry in the sun or tumble-dry on a hot setting; 5 seal things that cannot be washed (soft toys, thick quilts, shoes) in a plastic bag and leave for at least 3 days; scabies mites die 2-3 days after leaving the body; vacuum or wipe floors and sofas. Itching may continue for 2-4 weeks after treatment; this is a normal allergic reaction and does not necessarily mean treatment failed; if new rash still appears after 4 weeks, go back to the doctor. Do not scald the skin with boiling water, scrub with salt, or wash repeatedly with strong alkaline soap." font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Treating scabies: whole body, whole family, clothing and bedding</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<!-- body with cream applied (front view), origin on the ground between the feet; pink = area to treat -->
<g id="body">
<path d="M-18,-142 L-30,-74 M18,-142 L30,-74" stroke="#333" stroke-width="15" stroke-linecap="round"/>
<path d="M-18,-142 L-30,-74 M18,-142 L30,-74" stroke="#f6c4c4" stroke-width="11" stroke-linecap="round"/>
<rect x="-21" y="-82" width="19" height="80" rx="8" fill="#f6c4c4" stroke="#333" stroke-width="2"/>
<rect x="2" y="-82" width="19" height="80" rx="8" fill="#f6c4c4" stroke="#333" stroke-width="2"/>
<rect x="-24" y="-152" width="48" height="80" rx="14" fill="#f6c4c4" stroke="#333" stroke-width="2.2"/>
<rect x="-6" y="-164" width="12" height="14" fill="#f3e3d3"/>
<path d="M-6,-164 V-152 M6,-164 V-152" stroke="#333" stroke-width="2"/>
<circle cx="0" cy="-178" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
</g>
<!-- family: small clothed figures, pink lower body = cream applied -->
<g id="pp">
<path d="M-11,-58 L-17,-22 M11,-58 L17,-22" stroke="#333" stroke-width="10" stroke-linecap="round"/>
<path d="M-11,-58 L-17,-22 M11,-58 L17,-22" stroke="#f6c4c4" stroke-width="6.5" stroke-linecap="round"/>
<rect x="-13" y="-30" width="11" height="30" rx="5" fill="#f6c4c4" stroke="#333" stroke-width="1.8"/>
<rect x="2" y="-30" width="11" height="30" rx="5" fill="#f6c4c4" stroke="#333" stroke-width="1.8"/>
<rect x="-15" y="-64" width="30" height="40" rx="9" fill="#f6c4c4" stroke="#333" stroke-width="2"/>
<circle cx="0" cy="-75" r="10" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
</defs>
<text x="360" y="30" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Treating scabies: whole body, whole family, clothing</text>
<text x="360" y="54" font-size="13" fill="#555" text-anchor="middle">See a doctor first to confirm it; use anti-scabies medicine (mainly creams) as the doctor or leaflet says</text>

<!-- 1 cream on everything from the neck down -->
<rect x="8" y="68" width="344" height="344" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<use href="#body" transform="translate(76 302)"/>
<use href="#body" transform="translate(180 302)"/>
<path d="M165 124 Q180 102 195 124 Q192 112 180 110 Q168 112 165 124 Z" fill="#5a4636" stroke="#333" stroke-width="1.5"/>
<path d="M165 124 Q166 104 180 103 Q194 104 195 124 Q186 118 180 118 Q174 118 165 124 Z" fill="#5a4636"/>
<line x1="40" y1="303" x2="220" y2="303" stroke="#999" stroke-width="2"/>
<text x="76" y="324" font-size="13" fill="#555" text-anchor="middle">front</text>
<text x="180" y="324" font-size="13" fill="#555" text-anchor="middle">back</text>
<line x1="28" y1="150" x2="232" y2="150" stroke="#c33" stroke-width="1.5" stroke-dasharray="5 3"/>
<line x1="232" y1="150" x2="244" y2="150" stroke="#c33" stroke-width="1.5"/>
<text x="248" y="146" font-size="13" fill="#c33" font-weight="bold">all skin from</text>
<text x="248" y="163" font-size="13" fill="#c33" font-weight="bold">the neck down</text>
<rect x="248" y="196" width="16" height="16" rx="3" fill="#f6c4c4" stroke="#333" stroke-width="1.5"/>
<text x="270" y="209" font-size="13" fill="#222">cream area</text>
<text x="248" y="236" font-size="12" fill="#555">not only where</text>
<text x="248" y="250" font-size="12" fill="#555">it itches</text>
<line x1="246" y1="104" x2="198" y2="114" stroke="#0b5cad" stroke-width="1.2"/>
<text x="248" y="84" font-size="12" fill="#0b5cad">babies and young</text>
<text x="248" y="97" font-size="12" fill="#0b5cad">children: include</text>
<text x="248" y="110" font-size="12" fill="#0b5cad">head and face as</text>
<text x="248" y="123" font-size="12" fill="#0b5cad">the doctor says</text>
<text x="22" y="352" font-size="15" fill="#222" font-weight="bold">① Cream on all skin from the neck down</text>
<text x="22" y="373" font-size="13" fill="#222">Leave it on for the stated time, then wash it off;</text>
<text x="22" y="393" font-size="13" fill="#222">a second treatment is usually needed later</text>

<!-- 2 treat the whole family together -->
<rect x="368" y="68" width="344" height="344" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<use href="#pp" transform="translate(418 302) scale(1.35)"/>
<use href="#pp" transform="translate(484 302) scale(1.35)"/>
<use href="#pp" transform="translate(544 302)"/>
<use href="#pp" transform="translate(592 302) scale(0.85)"/>
<line x1="388" y1="303" x2="692" y2="303" stroke="#999" stroke-width="2"/>
<path d="M392 162 q0 -14 14 -14 h86 q12 0 16 -12 q4 12 16 12 h86 q14 0 14 14" fill="none" stroke="#0b5cad" stroke-width="2.2"/>
<text x="508" y="124" font-size="16" fill="#0b5cad" text-anchor="middle" font-weight="bold">Treat the whole family together</text>
<line x1="636" y1="234" x2="604" y2="248" stroke="#0b5cad" stroke-width="1.2"/>
<text x="632" y="212" font-size="12" fill="#0b5cad">no symptoms:</text>
<text x="632" y="228" font-size="12" fill="#0b5cad">treat anyway</text>
<text x="382" y="346" font-size="14" fill="#222" font-weight="bold">② Family living together and close</text>
<text x="382" y="365" font-size="14" fill="#222" font-weight="bold">contacts: treat at the same time,</text>
<text x="382" y="384" font-size="14" fill="#222" font-weight="bold">even without symptoms</text>
<text x="382" y="403" font-size="13" fill="#c33">otherwise you keep reinfecting each other</text>

<!-- clothing -->
<text x="14" y="440" font-size="16" fill="#0b5cad" font-weight="bold">Clothing and bedding (on the day of treatment)</text>
<text x="706" y="440" font-size="13" fill="#222" text-anchor="end">Vacuum or wipe floors and sofas</text>

<!-- 3 wash hot -->
<rect x="8" y="450" width="228" height="216" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="44" y="478" width="96" height="104" rx="8" fill="#fff" stroke="#333" stroke-width="2.2"/>
<line x1="44" y1="498" x2="140" y2="498" stroke="#333" stroke-width="1.5"/>
<circle cx="128" cy="488" r="4" fill="#c33"/>
<circle cx="92" cy="540" r="30" fill="#cfe0f0" stroke="#333" stroke-width="2.2"/>
<path d="M70 548 q11 -10 22 0 t22 0" fill="none" stroke="#0b5cad" stroke-width="2"/>
<path d="M76 538 q8 -10 18 -4 q8 4 16 -2" fill="none" stroke="#9a7aa0" stroke-width="5" stroke-linecap="round"/>
<rect x="164" y="482" width="14" height="80" rx="7" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="168" y="500" width="6" height="62" fill="#c33"/>
<circle cx="171" cy="568" r="11" fill="#c33" stroke="#333" stroke-width="2"/>
<text x="186" y="506" font-size="13" fill="#c33" font-weight="bold">hot</text>
<text x="22" y="612" font-size="15" fill="#222" font-weight="bold">③ Wash in hot water</text>
<text x="22" y="634" font-size="15" fill="#c33" font-weight="bold">50-60°C or hotter</text>

<!-- 4 dry in the sun or tumble-dry -->
<rect x="246" y="450" width="228" height="216" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<circle cx="436" cy="484" r="14" fill="#f5c542" stroke="#c99a1a" stroke-width="2"/>
<path d="M436 462 v-6 M436 506 v6 M414 484 h-6 M458 484 h6 M420 468 l-4 -4 M452 500 l4 4 M452 468 l4 -4 M420 500 l-4 4" stroke="#c99a1a" stroke-width="2" stroke-linecap="round"/>
<path d="M262 586 V500 M410 586 V500" stroke="#8a6a3a" stroke-width="4" stroke-linecap="round"/>
<path d="M262 506 Q336 520 410 506" fill="none" stroke="#666" stroke-width="1.5"/>
<path d="M276 509 L340 516 L338 572 L274 566 Z" fill="#eef3f8" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M276 530 L339 536" stroke="#9ab8d6" stroke-width="2"/>
<path d="M358 515 l10 -1 q5 6 10 0 l10 -2 l8 12 l-8 5 v26 h-28 v-26 l-8 -5 Z" fill="#f6c4c4" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<line x1="250" y1="587" x2="470" y2="587" stroke="#999" stroke-width="2"/>
<text x="260" y="612" font-size="15" fill="#222" font-weight="bold">④ Dry in the sun, or</text>
<text x="260" y="634" font-size="15" fill="#222" font-weight="bold">tumble-dry on hot</text>

<!-- 5 bag what cannot be washed -->
<rect x="484" y="450" width="228" height="216" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M512 500 Q506 560 514 584 H602 Q610 560 604 500 Q582 492 558 496 Q534 492 512 500 Z" fill="#f2f6f9" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M548 498 L558 474 L568 498" fill="#f2f6f9" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M548 486 L568 486" stroke="#c33" stroke-width="3" stroke-linecap="round"/>
<circle cx="542" cy="534" r="7" fill="#c9a26b" stroke="#333" stroke-width="1.5"/>
<circle cx="560" cy="534" r="7" fill="#c9a26b" stroke="#333" stroke-width="1.5"/>
<circle cx="551" cy="545" r="13" fill="#c9a26b" stroke="#333" stroke-width="1.8"/>
<ellipse cx="551" cy="570" rx="15" ry="11" fill="#c9a26b" stroke="#333" stroke-width="1.8"/>
<circle cx="546" cy="543" r="1.6" fill="#333"/><circle cx="556" cy="543" r="1.6" fill="#333"/>
<path d="M572 578 v-18 q0 -4 6 -4 h4 q4 0 6 6 l4 6 q10 2 10 10 Z" fill="#666" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="626" y="500" width="64" height="58" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="626" y="500" width="64" height="16" rx="5" fill="#c33"/>
<rect x="626" y="510" width="64" height="6" fill="#c33"/>
<text x="658" y="531" font-size="12" fill="#555" text-anchor="middle">at least</text>
<text x="658" y="551" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">3 days</text>
<text x="498" y="604" font-size="14" fill="#222" font-weight="bold">⑤ Seal what can't be washed</text>
<text x="498" y="622" font-size="14" fill="#222" font-weight="bold">in a plastic bag;</text>
<text x="498" y="641" font-size="14" fill="#c33" font-weight="bold">leave for at least 3 days</text>
<text x="498" y="658" font-size="12" fill="#555">soft toys, thick quilts, shoes, etc.</text>

<!-- bottom -->
<rect x="8" y="680" width="704" height="150" rx="10" fill="#fdf3f3" stroke="#e6b8b8" stroke-width="1.5"/>
<text x="22" y="704" font-size="14" fill="#222">Scabies mites die 2-3 days after leaving the body</text>
<text x="22" y="730" font-size="14" fill="#c33" font-weight="bold">⚠️ Itching may continue for 2-4 weeks after treatment:</text>
<text x="44" y="750" font-size="14" fill="#222">this is a normal allergic reaction and does not necessarily mean the treatment failed</text>
<text x="44" y="770" font-size="14" fill="#222">New rash still appearing after 4 weeks → go back to the doctor</text>
<text x="22" y="798" font-size="14" fill="#c33" font-weight="bold">✗ Don't scald the skin with boiling water, scrub it with salt, or wash it repeatedly</text>
<text x="38" y="818" font-size="14" fill="#c33" font-weight="bold">with strong alkaline soap <tspan fill="#555" font-weight="normal" font-size="13">(it damages the skin and does not kill the mites)</tspan></text>
</svg>
