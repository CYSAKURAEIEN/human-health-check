<path d="M288 190 L294 226 L303 252" fill="none" stroke="#333" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M288 190 L294 226 L303 252" fill="none" stroke="#cfe0f0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
