<path d="M415 146 L436 202 L478 196" fill="none" stroke="#333" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 146 L436 202 L478 196" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="481" y="181" width="15" height="15" rx="5" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<ellipse cx="484" cy="194" rx="9" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M530 218 Q506 214 497 182.6" fill="none" stroke="#c33" stroke-width="3.5" stroke-linecap="round"/><path d="M494 172 L491.2 184.2 L502.8 180.9Z" fill="#c33"/>
<text x="504" y="240" font-size="14" fill="#c33">Quick thrust</text>
<text x="504" y="256" font-size="14" fill="#c33">in and up</text>
<text x="504" y="278" font-size="13" fill="#222">Thumb side</text>
<text x="504" y="293" font-size="13" fill="#222">of fist on</text>
<text x="504" y="308" font-size="13" fill="#222">belly; other</text>
<text x="504" y="323" font-size="13" fill="#222">hand grips it</text>
<line x1="499" y1="272" x2="492" y2="199" stroke="#0b5cad" stroke-width="1.3"/><circle cx="492" cy="199" r="2.6" fill="#0b5cad"/>
<text x="380" y="66" font-size="15" fill="#0b5cad">Stand behind,</text>
<text x="380" y="85" font-size="15" fill="#0b5cad">arms round the waist</text>
<text x="502" y="112" font-size="15" fill="#0b5cad">Casualty</text>
<text x="648" y="66" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Fist position (front)</text>
<path d="M592 82 Q648 76 704 82 L698 300 L598 300 Z" fill="#fff" stroke="#333" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="648" y1="86" x2="648" y2="138" stroke="#333" stroke-width="2"/>
<path d="M598 198 L648 138 L698 198" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="648" cy="262" r="3.5" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="628" y="186" width="40" height="34" rx="8" fill="#f6dada" stroke="#c33" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="648" y="208" font-size="14" fill="#c33" text-anchor="middle">fist</text>
<path d="M678 222 L683 222 L683 260 L678 260" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="674" y="238" font-size="12" fill="#0b5cad" text-anchor="end">about two</text>
<text x="674" y="252" font-size="12" fill="#0b5cad" text-anchor="end">finger-widths</text>
<text x="641" y="122" font-size="13" fill="#222" text-anchor="end">xiphoid</text>
<line x1="642" y1="125" x2="649" y2="137" stroke="#0b5cad" stroke-width="1.3"/><circle cx="649" cy="137" r="2.6" fill="#0b5cad"/>
<text x="648" y="286" font-size="13" fill="#222" text-anchor="middle">navel</text>
<text x="590" y="168" font-size="14" fill="#222" text-anchor="end">lower</text>
<text x="590" y="185" font-size="14" fill="#222" text-anchor="end">rib edge</text>
<line x1="592" y1="176" x2="610" y2="184" stroke="#0b5cad" stroke-width="1.3"/><circle cx="610" cy="184" r="2.6" fill="#0b5cad"/>
<text x="560" y="368" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">② 5 abdominal thrusts</text>
<text x="560" y="390" font-size="14" fill="#222" text-anchor="middle">Above the navel, below the xiphoid. Each thrust</text>
<text x="560" y="408" font-size="14" fill="#222" text-anchor="middle">separate and forceful, as if lifting the person up</text>
</g>
<text x="400" y="466" font-size="15" fill="#222" text-anchor="middle">5 back blows ↔ 5 abdominal thrusts: keep alternating until</text>
<text x="400" y="485" font-size="15" fill="#222" text-anchor="middle">the object comes out or the casualty becomes unconscious</text>
<text x="400" y="508" font-size="15" fill="#c33" text-anchor="middle">Unconscious → lay them down and start CPR immediately;</text>
<text x="400" y="527" font-size="15" fill="#c33" text-anchor="middle">for pregnant or obese casualties, use chest thrusts instead</text>
</g>
</svg>
