<path d="M236 222 L244 278 L252 331" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M236 222 L244 278 L252 331" fill="none" stroke="#a9bfd6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 331 L264 332" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M252 331 L264 332" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
