<text x="254" y="58" font-size="14" fill="#222">Heel of hand: firm</text>
<text x="254" y="75" font-size="14" fill="#222">blows between the</text>
<text x="254" y="92" font-size="14" fill="#222">shoulder blades</text>
<line x1="300" y1="98" x2="274" y2="171" stroke="#0b5cad" stroke-width="1.3"/><circle cx="274" cy="171" r="2.6" fill="#0b5cad"/>
<text x="262" y="300" font-size="14" fill="#222">Other hand</text>
<text x="262" y="317" font-size="14" fill="#222">supports the chest</text>
<line x1="272" y1="286" x2="266" y2="226" stroke="#0b5cad" stroke-width="1.3"/><circle cx="266" cy="226" r="2.6" fill="#0b5cad"/>
<text x="24" y="222" font-size="15" fill="#0b5cad">Rescuer:</text>
<text x="24" y="240" font-size="14" fill="#0b5cad">behind, to</text>
<text x="24" y="257" font-size="14" fill="#0b5cad">one side</text>
<text x="318" y="242" font-size="15" fill="#0b5cad">Casualty</text>
<text x="200" y="368" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">① 5 back blows</text>
<text x="200" y="390" font-size="14" fill="#222" text-anchor="middle">Support the chest with one hand; lean the upper</text>
<text x="200" y="408" font-size="14" fill="#222" text-anchor="middle">body forward, head lower than the chest</text>
<text x="200" y="426" font-size="14" fill="#222" text-anchor="middle">After each blow, check if the object has come out</text>
<g transform="translate(40 0)">
<path d="M405 222 L421 278 L437 331" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M405 222 L421 278 L437 331" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M437 331 L449 332" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M437 331 L449 332" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M401 222 L393 278 L383 331" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M401 222 L393 278 L383 331" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M383 331 L395 332" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M383 331 L395 332" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M415 148 L442 198 L480 192" fill="none" stroke="#333" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M415 148 L442 198 L480 192" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405 220 L413 140" fill="none" stroke="#333" stroke-width="45" stroke-linecap="round" stroke-linejoin="round"/><path d="M405 220 L413 140" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="418" cy="116" r="18" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M455 222 L451 278 L445 331" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 222 L451 278 L445 331" fill="none" stroke="#a9bfd6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M445 331 L457 332" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M445 331 L457 332" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M461 222 L469 278 L475 331" fill="none" stroke="#333" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M461 222 L469 278 L475 331" fill="none" stroke="#a9bfd6" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 331 L487 332" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M475 331 L487 332" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
