<path d="M158 145 L194 208 L258 222" fill="none" stroke="#333" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M158 145 L194 208 L258 222" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
