<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="First aid for choking in adults and children over 1 year: (1) stand behind and to one side, lean the casualty forward and give 5 firm blows between the shoulder blades with the heel of the hand; (2) stand behind, put your arms round the waist, place the fist above the navel and below the xiphoid, and give 5 quick inward and upward thrusts; alternate the two" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Choking in adults and children: back blows and abdominal thrusts</title>
<text x="400" y="28" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Adults and children over 1 year: conscious, airway completely blocked</text>
<text x="400" y="48" font-size="14" fill="#222" text-anchor="middle">(cannot cough, speak or breathe)</text>
