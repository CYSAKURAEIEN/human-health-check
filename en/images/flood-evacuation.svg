<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1004" width="720" height="1004" role="img" aria-label="Flood evacuation: what drowns people is usually not very deep water but moving water; fast-flowing water about 15 cm deep can knock a person over, flowing water about 30 cm deep can float a small car and sweep it away, and flowing water about 60 cm deep can sweep away most vehicles, including off-road vehicles; when you receive an evacuation or relocation notice, leave at once, go to high ground, avoid river channels and valleys, and move the elderly, children, the sick, pregnant women and disabled people first; do not wade, do not drive into flooded areas, flooded underpasses, tunnels or submerged bridges, keep away from power poles and transformers, do not climb power poles or pylons, do not shelter in mud-brick or brick-and-timber single-storey houses, do not use lifts, do not stand on river embankments to watch or take photos, and do not return to the village on your own before the water goes down">
<rect width="100%" height="100%" fill="#fff"/>
<title>Flood evacuation: leave early, go to high ground, stay out of moving water</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<g id="p">
<g stroke-linecap="round"><path d="M-3,-12 L-5,0 M3,-12 L5,0" stroke="#333" stroke-width="3.5"/></g>
<rect x="-7" y="-31" width="14" height="20" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="0" cy="-38" r="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
<g id="flow" stroke="#0b5cad" stroke-width="2">
<path d="M0,0 L24,0" marker-end="url(#aw)"/>
</g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Flood evacuation: leave early, go high, stay out of moving water</text>

<!-- A moving water -->
<g transform="translate(10,42)">
<rect x="0" y="0" width="700" height="306" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="26" font-size="16" font-weight="bold">What drowns people is usually not deep water but moving water</text>
<line x1="12" y1="220" x2="688" y2="220" stroke="#999" stroke-width="3"/>

<!-- person -->
<g transform="translate(116,220) rotate(-6)">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M-7,-86 L-10,-2 M7,-86 L12,-2" stroke="#333" stroke-width="19"/><path d="M-7,-86 L-10,-2 M7,-86 L12,-2" stroke="#cfe0f0" stroke-width="14"/>
<path d="M0,-138 L0,-88" stroke="#333" stroke-width="32"/><path d="M0,-138 L0,-88" stroke="#cfe0f0" stroke-width="27"/>
<path d="M-10,-134 L-44,-108 M10,-134 L44,-112" stroke="#333" stroke-width="12"/><path d="M-10,-134 L-44,-108 M10,-134 L44,-112" stroke="#f3e3d3" stroke-width="7"/>
</g>
<circle cx="0" cy="-158" r="14" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M-12,-166 Q0,-178 13,-164 Q2,-170 -12,-166 Z" fill="#555"/>
</g>
<rect x="20" y="205" width="200" height="15" fill="#9ccbe8" fill-opacity="0.8"/>
<use href="#flow" transform="translate(30,213)"/>
<use href="#flow" transform="translate(160,213)"/>
<path d="M40,205 L52,205 M46,205 L46,220 M40,220 L52,220" stroke="#c33" stroke-width="2"/>
<text x="16" y="248" font-size="15" font-weight="bold" fill="#c33">Fast water about 15 cm</text>
<text x="16" y="270" font-size="15">deep can knock a</text>
<text x="16" y="290" font-size="15">person over</text>

<!-- small car -->
<g transform="translate(250,0)">
<g transform="rotate(-3,100,200)">
<path d="M10,198 L10,178 Q12,170 28,168 L56,166 L78,142 L140,142 L164,166 L184,170 Q194,172 194,182 L194,198 Z" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
<path d="M84,148 L104,148 L104,164 L68,164 Z M110,148 L136,148 L154,164 L110,164 Z" fill="#eaf3fb" stroke="#333" stroke-width="1.5"/>
<circle cx="46" cy="198" r="15" fill="#555" stroke="#333" stroke-width="2"/>
<circle cx="158" cy="198" r="15" fill="#555" stroke="#333" stroke-width="2"/>
</g>
<rect x="0" y="205" width="210" height="15" fill="#9ccbe8" fill-opacity="0.8"/>
<use href="#flow" transform="translate(70,213)"/>
<path d="M200,182 L222,182" stroke="#c33" stroke-width="3" marker-end="url(#ar)"/>
<path d="M200,205 L212,205 M206,205 L206,220 M200,220 L212,220" stroke="#c33" stroke-width="2"/>
<text x="0" y="248" font-size="15" font-weight="bold" fill="#c33">Flowing water about 30 cm</text>
<text x="0" y="270" font-size="15">deep can float a small car</text>
<text x="0" y="290" font-size="15">and sweep it away</text>
</g>

<!-- off-road vehicle -->
<g transform="translate(476,0)">
<g transform="rotate(-2,110,200)">
<path d="M14,200 L14,172 Q16,166 28,166 L58,164 L76,134 L188,132 Q198,132 200,142 L204,164 L204,200 Z" fill="#f0f0f0" stroke="#333" stroke-width="2.5"/>
<path d="M82,140 L122,140 L122,160 L70,160 Z M128,140 L184,140 L186,160 L128,160 Z" fill="#eaf3fb" stroke="#333" stroke-width="1.5"/>
<circle cx="56" cy="201" r="19" fill="#555" stroke="#333" stroke-width="2"/>
<circle cx="168" cy="201" r="19" fill="#555" stroke="#333" stroke-width="2"/>
</g>
<rect x="0" y="190" width="212" height="30" fill="#9ccbe8" fill-opacity="0.8"/>
<use href="#flow" transform="translate(20,206)"/>
<use href="#flow" transform="translate(96,206)"/>
<path d="M190,190 L202,190 M196,190 L196,220 M190,220 L202,220" stroke="#c33" stroke-width="2"/>
<text x="0" y="248" font-size="15" font-weight="bold" fill="#c33">Flowing water about 60 cm</text>
<text x="0" y="270" font-size="15">deep can sweep away most</text>
<text x="0" y="290" font-size="15">vehicles, even off-roaders</text>
</g>
</g>

<!-- B evacuation direction -->
<g transform="translate(10,358)">
<rect x="0" y="0" width="700" height="248" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="26" font-size="16" font-weight="bold">Leave early, go to high ground</text>
<path d="M12,196 L118,196 L138,112 L166,112 L186,170 L420,170 L600,62 L688,62 L688,244 L12,244 Z" fill="#eee"/>
<path d="M12,196 L118,196 L138,112 L166,112 L186,170 L420,170 L600,62 L688,62" fill="none" stroke="#999" stroke-width="3" stroke-linejoin="round"/>
<!-- river channel -->
<path d="M12,120 L136,120 L118,196 L12,196 Z" fill="#9ccbe8" fill-opacity="0.8"/>
<use href="#flow" transform="translate(30,150)"/>
<text x="40" y="182" font-size="14" fill="#0b5cad">river</text>
<!-- person on the embankment -->
<use href="#p" transform="translate(152,112)"/>
<path d="M140,60 L164,84 M164,60 L140,84" stroke="#c33" stroke-width="3" stroke-linecap="round"/>
<text x="14" y="52" font-size="13" fill="#c33">✗ Don't watch or</text>
<text x="28" y="68" font-size="13" fill="#c33">take photos on</text>
<text x="28" y="84" font-size="13" fill="#c33">embankments</text>
<!-- house -->
<rect x="200" y="122" width="54" height="48" fill="#f7efe2" stroke="#333" stroke-width="2"/>
<path d="M194,124 L227,98 L260,124 Z" fill="#c8a46e" stroke="#333" stroke-width="2"/>
<!-- power pole, transformer -->
<line x1="296" y1="170" x2="296" y2="78" stroke="#333" stroke-width="4"/>
<line x1="284" y1="84" x2="308" y2="84" stroke="#333" stroke-width="3"/>
<rect x="300" y="98" width="14" height="18" fill="#bbb" stroke="#333" stroke-width="1.5"/>
<path d="M308,84 Q340,100 372,88" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- car -->
<g transform="rotate(-6,368,150)">
<path d="M336,160 L336,148 L348,146 L356,134 L384,134 L392,146 L402,148 L402,160 Z" fill="#f0f0f0" stroke="#333" stroke-width="2"/>
<circle cx="350" cy="161" r="6" fill="#555" stroke="#333" stroke-width="1.5"/>
<circle cx="390" cy="161" r="6" fill="#555" stroke="#333" stroke-width="1.5"/>
</g>
<!-- floodwater -->
<path d="M178,146 L460,146 L420,170 L186,170 Z" fill="#9ccbe8" fill-opacity="0.8"/>
<use href="#flow" transform="translate(206,158)"/>
<path d="M284,100 L308,124 M308,100 L284,124" stroke="#c33" stroke-width="3" stroke-linecap="round"/>
<path d="M358,112 L378,132 M378,112 L358,132" stroke="#c33" stroke-width="3" stroke-linecap="round"/>
<!-- evacuation arrow -->
<path d="M240,92 Q420,24 610,40" fill="none" stroke="#c33" stroke-width="4" marker-end="url(#ar)"/>
<text x="250" y="34" font-size="15" font-weight="bold" fill="#c33">✓ Leave as soon as you are told</text>
<!-- high ground -->
<use href="#p" transform="translate(632,62)"/>
<use href="#p" transform="translate(660,62)"/>
<text x="604" y="84" font-size="13" fill="#0b5cad">high ground,</text>
<text x="604" y="100" font-size="13" fill="#0b5cad">shelter site</text>
<!-- labels below ground -->
<text x="196" y="192" font-size="13" fill="#c33">✗ Keep away from power poles and transformers (water may be live)</text>
<text x="196" y="212" font-size="13" fill="#c33">✗ Don't drive into flooded areas</text>
<text x="412" y="232" font-size="13" fill="#0b5cad">Go uphill at right angles to the river</text>
</g>

<!-- C key points -->
<g transform="translate(10,616)">
<rect x="0" y="0" width="350" height="336" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="16" font-weight="bold">Key points</text>
<text x="16" y="56" font-size="14">● Told to evacuate or relocate, or water rising</text>
<text x="30" y="75" font-size="14">fast: leave now, don't wait for it to come in</text>
<text x="16" y="101" font-size="14">● Move the elderly, children, the sick, pregnant</text>
<text x="30" y="120" font-size="14">women and disabled people first</text>
<text x="16" y="146" font-size="14">● Go high, avoid rivers and valleys; route</text>
<text x="30" y="165" font-size="14">around low roads, bridges and underpasses</text>
<text x="16" y="191" font-size="14">● Turn off power and gas, take the emergency</text>
<text x="30" y="210" font-size="14">bag, don't go alone</text>
<text x="16" y="236" font-size="14">● You can't judge depth in the dark: if you can</text>
<text x="30" y="255" font-size="14">leave before dark, don't delay</text>
<text x="16" y="281" font-size="14">● No time to leave: go up to the second storey</text>
<text x="30" y="300" font-size="14">or higher of a solid building, a roof, high</text>
<text x="30" y="319" font-size="14">ground or a big sturdy tree</text>
</g>

<!-- D don'ts -->
<g transform="translate(370,616)">
<rect x="0" y="0" width="340" height="336" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="16" y="28" font-size="16" font-weight="bold" fill="#c33">Don't</text>
<text x="16" y="56" font-size="14">✗ Wade if water is above the knee or too</text>
<text x="30" y="75" font-size="14">fast to stand in</text>
<text x="16" y="101" font-size="14">✗ Drive into flooded areas, flooded spaces</text>
<text x="30" y="120" font-size="14">under flyovers, tunnels, underpasses or</text>
<text x="30" y="139" font-size="14">submerged bridges</text>
<text x="16" y="165" font-size="14">✗ Climb power poles or pylons; go near</text>
<text x="30" y="184" font-size="14">transformers</text>
<text x="16" y="210" font-size="14">✗ Shelter in mud-brick or brick-and-timber</text>
<text x="30" y="229" font-size="14">single-storey houses</text>
<text x="30" y="247" font-size="13" fill="#555">Soaked walls can suddenly collapse whole</text>
<text x="16" y="273" font-size="14">✗ Use lifts; stop to gather grain or livestock</text>
<text x="16" y="299" font-size="14">✗ Watch or take photos on embankments</text>
<text x="16" y="325" font-size="14">✗ Go back on your own before the water falls</text>
</g>

<text x="360" y="972" font-size="14" text-anchor="middle">Swept into fast water: face up, feet first downstream, work diagonally to the bank;</text>
<text x="360" y="990" font-size="14" text-anchor="middle">don't try to stand up in fast water</text>
</g>
</svg>
