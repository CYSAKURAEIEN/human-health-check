<path d="M372 158 L410 160" fill="none" stroke="#333" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/><path d="M372 158 L410 160" fill="none" stroke="#f3e3d3" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="420" cy="180" r="11" fill="#fff" stroke="#333" stroke-width="2"/>
<path d="M420 180 m-5 0 a5 5 0 1 1 5 5" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M410 150 L432 156 L440 174 L432 190" fill="none" stroke="#333" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 150 L432 156 L440 174 L432 190" fill="none" stroke="#f3e3d3" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M239 140 L251 149 L239 158 L251 167 L239 176" fill="none" stroke="#c33" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="151" y="134" width="18" height="75" rx="3" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="154" cy="211" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="166" cy="211" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><circle cx="160" cy="211" r="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/>
<rect x="321" y="134" width="18" height="75" rx="3" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="324" cy="211" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="336" cy="211" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><circle cx="330" cy="211" r="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/>
<text x="236" y="126" font-size="15" fill="#c33" text-anchor="middle">no tie over the fracture</text>
<text x="352" y="106" font-size="14" fill="#222" text-anchor="middle">ties 3-5 cm wide</text>
<line x1="340" y1="113" x2="332" y2="134" stroke="#0b5cad" stroke-width="1.3"/><circle cx="332" cy="134" r="2.6" fill="#0b5cad"/>
<text x="12" y="196" font-size="15" fill="#222">pad</text>
<line x1="42" y1="191" x2="98" y2="187" stroke="#0b5cad" stroke-width="1.3"/><circle cx="98" cy="187" r="2.6" fill="#0b5cad"/>
<path d="M90 220 L90 230 M90 225 L434 225 M434 220 L434 230" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="262" y="248" font-size="14" fill="#222" text-anchor="middle">Splint on the palm side, from the elbow to the palm</text>
<text x="462" y="72" font-size="16" fill="#222" font-weight="bold">① Forearm or wrist fracture</text>
<text x="462" y="96" font-size="14" fill="#222">then support it in a sling</text>
<text x="474" y="136" font-size="13" fill="#222">Hand holds a rolled</text>
<text x="474" y="152" font-size="13" fill="#222">bandage, fingers curled</text>
<text x="474" y="168" font-size="13" fill="#222">naturally, fingertips</text>
<text x="474" y="184" font-size="13" fill="#222">showing</text>
<line x1="472" y1="168" x2="436" y2="188" stroke="#0b5cad" stroke-width="1.3"/><circle cx="436" cy="188" r="2.6" fill="#0b5cad"/>
<text x="474" y="210" font-size="13" fill="#222">Knots on the splint side,</text>
<text x="474" y="226" font-size="13" fill="#222">not over the injury</text>
<line x1="472" y1="219" x2="342" y2="212" stroke="#0b5cad" stroke-width="1.3"/><circle cx="342" cy="212" r="2.6" fill="#0b5cad"/>
<rect x="100" y="344" width="446" height="14" rx="3" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<rect x="100" y="442" width="446" height="14" rx="3" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<rect x="206" y="358" width="56" height="12" rx="6" fill="#f6f0e2" stroke="#333" stroke-width="1.8"/>
<rect x="206" y="430" width="56" height="12" rx="6" fill="#f6f0e2" stroke="#333" stroke-width="1.8"/>
<rect x="440" y="358" width="60" height="12" rx="6" fill="#f6f0e2" stroke="#333" stroke-width="1.8"/>
<rect x="440" y="430" width="60" height="12" rx="6" fill="#f6f0e2" stroke="#333" stroke-width="1.8"/>
<path d="M18 368 L214 374 Q236 369 258 374 L470 386 L470 414 L258 426 Q236 431 214 426 L18 432" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M466 386 Q492 374 512 378 Q526 400 512 422 Q492 426 466 414" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<circle cx="514" cy="384" r="4.2" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/>
<circle cx="516" cy="392" r="3.6" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/>
<circle cx="518" cy="400" r="3.6" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/>
<circle cx="516" cy="408" r="3.6" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/>
<circle cx="514" cy="416" r="3.6" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/>
<path d="M226 392 Q236 400 226 408" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M346 378 L358 387 L346 396 L358 405 L346 414" fill="none" stroke="#c33" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="121" y="338" width="18" height="124" rx="3" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="124" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="136" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><circle cx="130" cy="334" r="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/>
<rect x="273" y="338" width="18" height="124" rx="3" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="276" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="288" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><circle cx="282" cy="334" r="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/>
<rect x="405" y="338" width="18" height="124" rx="3" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="408" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="420" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><circle cx="414" cy="334" r="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/>
<rect x="461" y="338" width="18" height="124" rx="3" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="464" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><ellipse cx="476" cy="334" rx="6" ry="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/><circle cx="470" cy="334" r="3.5" fill="#f2e6c9" stroke="#333" stroke-width="2"/>
<text x="24" y="298" font-size="16" fill="#222" font-weight="bold">② Lower leg fracture (casualty lying flat, seen from above)</text>
<text x="352" y="326" font-size="15" fill="#c33" text-anchor="middle">no tie over the fracture</text>
<text x="24" y="326" font-size="14" fill="#222">top end at mid-thigh</text>
<line x1="88" y1="331" x2="104" y2="346" stroke="#0b5cad" stroke-width="1.3"/><circle cx="104" cy="346" r="2.6" fill="#0b5cad"/>
<text x="560" y="328" font-size="14" fill="#222">bottom end past</text>
<text x="560" y="344" font-size="14" fill="#222">the heel</text>
<line x1="558" y1="335" x2="542" y2="346" stroke="#0b5cad" stroke-width="1.3"/><circle cx="542" cy="346" r="2.6" fill="#0b5cad"/>
<text x="560" y="382" font-size="14" fill="#222">toes showing: check</text>
<text x="560" y="399" font-size="14" fill="#222">colour, warmth</text>
<text x="560" y="416" font-size="14" fill="#222">and feeling</text>
<line x1="558" y1="394" x2="524" y2="398" stroke="#0b5cad" stroke-width="1.3"/><circle cx="524" cy="398" r="2.6" fill="#0b5cad"/>
<text x="24" y="488" font-size="14" fill="#222">one splint on the inner</text>
<text x="24" y="505" font-size="14" fill="#222">and one on the outer side</text>
<line x1="90" y1="478" x2="120" y2="456" stroke="#0b5cad" stroke-width="1.3"/><circle cx="120" cy="456" r="2.6" fill="#0b5cad"/>
<text x="234" y="488" font-size="14" fill="#222">pad both sides of</text>
<text x="234" y="505" font-size="14" fill="#222">knee and ankle</text>
<line x1="262" y1="476" x2="238" y2="444" stroke="#0b5cad" stroke-width="1.3"/><circle cx="238" cy="444" r="2.6" fill="#0b5cad"/>
<line x1="352" y1="478" x2="456" y2="444" stroke="#0b5cad" stroke-width="1.3"/><circle cx="456" cy="444" r="2.6" fill="#0b5cad"/>
<text x="560" y="470" font-size="14" fill="#222">immobilises knee</text>
<text x="560" y="487" font-size="14" fill="#222">and ankle joints</text>
<text x="560" y="296" font-size="14" fill="#222">knots on splint side</text>
<line x1="558" y1="300" x2="476" y2="333" stroke="#0b5cad" stroke-width="1.3"/><circle cx="476" cy="333" r="2.6" fill="#0b5cad"/>
<text x="360" y="536" font-size="14" fill="#222" text-anchor="middle">Ties 3-5 cm wide, loose enough to slip one finger under; no thin string or wire;</text>
<text x="360" y="554" font-size="14" fill="#222" text-anchor="middle">splint the limb as it lies – don't straighten it</text>
<text x="360" y="578" font-size="14" fill="#c33" text-anchor="middle">Before and after splinting, check colour, warmth, feeling and movement of fingers or toes;</text>
<text x="360" y="596" font-size="14" fill="#c33" text-anchor="middle">pale, blue, cold or numb → loosen and retie first</text>
</svg>
