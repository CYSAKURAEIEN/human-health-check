<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 606" width="720" height="606" role="img" aria-label="Splinting fractures with improvised splints: 1 forearm fracture: put the splint on the palm side from the elbow to the palm, with padding in between; tie once above and once below the fracture, with the knots on the splint side; the hand holds a rolled bandage with the fingertips showing; 2 lower leg fracture: put one splint on the inner side and one on the outer side, from mid-thigh to beyond the heel, pad both sides of the knee and ankle, do not tie over the fracture, and leave the toes showing to check circulation" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Improvised splints</title>
<text x="360" y="28" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Improvised splints</text>
<rect x="8" y="42" width="704" height="222" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="8" y="274" width="704" height="240" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M96 62 L104 154" fill="none" stroke="#333" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/><path d="M96 62 L104 154" fill="none" stroke="#cfe0f0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M96 178 Q110 173 124 178 T152 178 T180 178 T208 178 T236 178 T264 178 T292 178 T320 178 T348 178 T376 178 T404 178 L430 192 L96 192 Z" fill="#f6f0e2" stroke="#333" stroke-width="1.8"/>
