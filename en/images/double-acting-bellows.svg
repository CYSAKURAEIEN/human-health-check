<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1050" width="720" height="1050" role="img" aria-label="Double-acting piston bellows in section: a rectangular wooden box about 60-100 cm long with an inner cross-section of about 25 × 30 cm; the piston is a board the same size as the inner cross-section, with soft leather, felt or chicken feathers nailed all round, feathers pointing outwards; the rod passes through a hole in one end of the box to the centre of the piston, with a leather sleeve over the hole. The end boards at both ends of the box each have an inlet valve, a leather flap nailed on the inside of the hole that can only swing inwards; a duct along the side or bottom opens into both ends of the box, and its outlet in the middle has an outlet valve that swings left and right and leads to the tuyere. When the rod is pushed, the air left of the piston is compressed, the left inlet valve is pressed shut, the air passes through the duct, pushes the outlet valve to the right and is blown out of the tuyere, while the right inlet valve is sucked open and fresh air is drawn in; pulling back does the reverse. Every stroke blows air, so the blast is continuous" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Double-acting piston bellows</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="dimB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#0b5cad"/></marker>
</defs>
<g fill="#222">
<text x="360" y="26" font-size="18" font-weight="bold" text-anchor="middle">Double-acting piston bellows: blows on push and pull (section)</text>
<rect x="160" y="38" width="16" height="12" fill="#f8d7d7" stroke="#c33" stroke-width="1"/>
<text x="182" y="49" font-size="13">compressed air being blown out</text>
<rect x="400" y="38" width="16" height="12" fill="#dbe8f6" stroke="#0b5cad" stroke-width="1"/>
<text x="422" y="49" font-size="13">fresh air drawn in</text>

<!-- 1 push -->
<g transform="translate(0,58)">
<rect x="10" y="0" width="700" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="26" font-size="16" font-weight="bold">① Push the rod: piston moves left</text>
<rect x="130" y="66" width="320" height="154" fill="#e2cfa6" stroke="#333" stroke-width="2.5"/>
<rect x="270" y="220" width="40" height="34" fill="#e2cfa6" stroke="#333" stroke-width="2"/>
<rect x="140" y="76" width="80" height="100" fill="#f8d7d7"/>
<rect x="232" y="76" width="208" height="100" fill="#dbe8f6"/>
<rect x="140" y="186" width="150" height="24" fill="#f8d7d7"/>
<rect x="290" y="186" width="150" height="24" fill="#dbe8f6"/>
<rect x="142" y="175" width="28" height="12" fill="#f8d7d7"/>
<rect x="410" y="175" width="28" height="12" fill="#dbe8f6"/>
<rect x="278" y="208" width="24" height="47" fill="#f8d7d7"/>
<rect x="129" y="84" width="12" height="24" fill="#fff"/>
<rect x="439" y="84" width="12" height="24" fill="#fff"/>
<path d="M142,176 H140 V76 H440 V176 H438 M410,176 H170 M142,186 H140 V210 H278 V255 M302,255 V210 H440 V186 H438 M410,186 H170" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- piston, rod -->
<rect x="232" y="123" width="364" height="6" fill="#9a9a9a" stroke="#333" stroke-width="1"/>
<rect x="220" y="82" width="12" height="88" fill="#b98b56" stroke="#333" stroke-width="1.5"/>
<rect x="217" y="76" width="18" height="6" fill="#7a5230"/><rect x="217" y="170" width="18" height="6" fill="#7a5230"/>
<rect x="450" y="117" width="14" height="18" rx="2" fill="#a0522d" stroke="#333" stroke-width="1"/>
<rect x="596" y="104" width="12" height="44" rx="4" fill="#b98b56" stroke="#333" stroke-width="1.5"/>
<!-- valves -->
<g stroke="#6b3e1e" stroke-width="4" stroke-linecap="round">
<path d="M142,83 V109"/><path d="M438,83 L420,104"/><path d="M290,187 L301,209"/>
</g>
<g fill="#333"><circle cx="142" cy="83" r="2.5"/><circle cx="438" cy="83" r="2.5"/><circle cx="290" cy="187" r="2.5"/></g>
<!-- airflow -->
<g fill="none" stroke-width="2.5">
<path d="M212,140 H168 Q156,140 156,152 V188 Q156,198 166,198 H264" stroke="#c33" marker-end="url(#arR)"/>
<path d="M290,226 V286" stroke="#c33" marker-end="url(#arR)"/>
<path d="M476,102 H452 Q436,102 426,116" stroke="#0b5cad" marker-end="url(#arB)"/>
<path d="M590,162 H504" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
</g>
<text x="614" y="168" font-size="16" font-weight="bold" fill="#c33">push</text>
<!-- labels -->
<text x="226" y="56" font-size="14" text-anchor="middle">piston (sealed all round, see below)</text>
<line x1="226" y1="60" x2="226" y2="75" stroke="#555" stroke-width="1"/>
<text x="124" y="80" font-size="14" text-anchor="end">inlet valve</text>
<text x="124" y="98" font-size="14" text-anchor="end" font-weight="bold" fill="#c33">closed</text>
<text x="124" y="116" font-size="13" text-anchor="end" fill="#c33">(pressed shut)</text>
<text x="486" y="80" font-size="14">inlet valve</text>
<text x="486" y="98" font-size="14" font-weight="bold" fill="#0b5cad">open</text>
<text x="486" y="116" font-size="13" fill="#0b5cad">(sucked open)</text>
<text x="180" y="128" font-size="12" font-weight="bold" fill="#c33" text-anchor="middle">compressed</text>
<text x="336" y="162" font-size="14" fill="#0b5cad" text-anchor="middle">fresh air drawn in</text>
<text x="24" y="248" font-size="14">Duct: along the side (or bottom)</text>
<text x="24" y="266" font-size="14">of the box, open to both ends</text>
<line x1="210" y1="236" x2="210" y2="205" stroke="#555" stroke-width="1"/>
<text x="282" y="292" font-size="14" text-anchor="end" fill="#c33">air out → tuyere</text>
<text x="324" y="248" font-size="14" font-weight="bold">Outlet valve: a small flap that swings</text>
<text x="324" y="266" font-size="13" fill="#555">(or use two one-way leather flaps)</text>
<text x="324" y="284" font-size="13">Air from the left → flap pushed right, blocks backflow</text>
<line x1="322" y1="243" x2="299" y2="202" stroke="#555" stroke-width="1"/>
<text x="360" y="316" font-size="15" text-anchor="middle">Push: the air left of the piston is compressed and blown out</text>
<text x="360" y="336" font-size="15" text-anchor="middle">through the duct and the tuyere; fresh air is drawn in on the right</text>
</g>

<!-- 2 pull -->
<g transform="translate(0,418)">
<rect x="10" y="0" width="700" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="26" font-size="16" font-weight="bold">② Pull back: piston moves right</text>
<path d="M130,44 V62 M450,44 V62" stroke="#0b5cad" stroke-width="1"/>
<line x1="132" y1="53" x2="448" y2="53" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<rect x="194" y="36" width="192" height="20" fill="#fff"/>
<text x="290" y="51" font-size="14" fill="#0b5cad" text-anchor="middle">box about <tspan font-weight="bold">60-100 cm</tspan> long</text>
<rect x="130" y="66" width="320" height="154" fill="#e2cfa6" stroke="#333" stroke-width="2.5"/>
<rect x="270" y="220" width="40" height="34" fill="#e2cfa6" stroke="#333" stroke-width="2"/>
<rect x="140" y="76" width="208" height="100" fill="#dbe8f6"/>
<rect x="360" y="76" width="80" height="100" fill="#f8d7d7"/>
<rect x="140" y="186" width="150" height="24" fill="#dbe8f6"/>
<rect x="290" y="186" width="150" height="24" fill="#f8d7d7"/>
<rect x="142" y="175" width="28" height="12" fill="#dbe8f6"/>
<rect x="410" y="175" width="28" height="12" fill="#f8d7d7"/>
<rect x="278" y="208" width="24" height="47" fill="#f8d7d7"/>
<rect x="129" y="84" width="12" height="24" fill="#fff"/>
<rect x="439" y="84" width="12" height="24" fill="#fff"/>
<path d="M142,176 H140 V76 H440 V176 H438 M410,176 H170 M142,186 H140 V210 H278 V255 M302,255 V210 H440 V186 H438 M410,186 H170" fill="none" stroke="#333" stroke-width="1.5"/>
<rect x="360" y="123" width="236" height="6" fill="#9a9a9a" stroke="#333" stroke-width="1"/>
<rect x="348" y="82" width="12" height="88" fill="#b98b56" stroke="#333" stroke-width="1.5"/>
<rect x="345" y="76" width="18" height="6" fill="#7a5230"/><rect x="345" y="170" width="18" height="6" fill="#7a5230"/>
<rect x="450" y="117" width="14" height="18" rx="2" fill="#a0522d" stroke="#333" stroke-width="1"/>
<rect x="596" y="104" width="12" height="44" rx="4" fill="#b98b56" stroke="#333" stroke-width="1.5"/>
<g stroke="#6b3e1e" stroke-width="4" stroke-linecap="round">
<path d="M142,83 L160,104"/><path d="M438,83 V109"/><path d="M290,187 L279,209"/>
</g>
<g fill="#333"><circle cx="142" cy="83" r="2.5"/><circle cx="438" cy="83" r="2.5"/><circle cx="290" cy="187" r="2.5"/></g>
<g fill="none" stroke-width="2.5">
<path d="M368,140 H412 Q424,140 424,152 V188 Q424,198 414,198 H316" stroke="#c33" marker-end="url(#arR)"/>
<path d="M290,226 V286" stroke="#c33" marker-end="url(#arR)"/>
<path d="M84,102 H126 Q142,102 152,116" stroke="#0b5cad" marker-end="url(#arB)"/>
<path d="M504,162 H590" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
</g>
<text x="618" y="168" font-size="16" font-weight="bold" fill="#c33">pull</text>
<text x="618" y="131" font-size="14">rod</text>
<text x="124" y="150" font-size="14" text-anchor="end">inlet valve</text>
<text x="124" y="168" font-size="14" text-anchor="end" font-weight="bold" fill="#0b5cad">open</text>
<text x="124" y="186" font-size="13" text-anchor="end" fill="#0b5cad">(sucked open)</text>
<line x1="104" y1="136" x2="131" y2="109" stroke="#555" stroke-width="1"/>
<text x="486" y="80" font-size="14">inlet valve</text>
<text x="486" y="98" font-size="14" font-weight="bold" fill="#c33">closed</text>
<text x="486" y="116" font-size="13" fill="#c33">(pressed shut)</text>
<line x1="482" y1="94" x2="453" y2="94" stroke="#555" stroke-width="1"/>
<text x="400" y="110" font-size="12" font-weight="bold" fill="#c33" text-anchor="middle">compressed</text>
<text x="244" y="152" font-size="14" fill="#0b5cad" text-anchor="middle">fresh air drawn in</text>
<text x="474" y="206" font-size="14">leather sleeve (reduces leaks)</text>
<line x1="480" y1="192" x2="459" y2="137" stroke="#555" stroke-width="1"/>
<text x="282" y="292" font-size="14" text-anchor="end" fill="#c33">air out → tuyere</text>
<text x="324" y="252" font-size="14" font-weight="bold">Outlet valve: air from the right →</text>
<text x="324" y="270" font-size="14">flap pushed left, blocks backflow</text>
<line x1="322" y1="246" x2="282" y2="202" stroke="#555" stroke-width="1"/>
<text x="360" y="316" font-size="15" text-anchor="middle">Pull: the reverse; the air right of the piston is compressed and blown</text>
<text x="360" y="336" font-size="15" text-anchor="middle">out through the duct and the tuyere; fresh air is drawn in on the left</text>
</g>

<text x="360" y="796" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">→ Every stroke, push and pull, blows air: the blast is continuous</text>

<!-- piston front view and key points -->
<rect x="10" y="810" width="700" height="230" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<g transform="translate(0,40)">
<rect x="34" y="790" width="90" height="108" fill="#e2cfa6" stroke="#333" stroke-width="2"/>
<rect x="42" y="798" width="74" height="92" fill="#fff" stroke="#333" stroke-width="1"/>
<rect x="47" y="803" width="64" height="82" fill="#b98b56" stroke="#7a5230" stroke-width="8" stroke-dasharray="2 2"/>
<circle cx="79" cy="844" r="5" fill="#9a9a9a" stroke="#333" stroke-width="1"/>
<text x="79" y="920" font-size="13" text-anchor="middle" fill="#555">piston, front</text>
</g>
<text x="150" y="836" font-size="15" font-weight="bold">Piston: a board the same size as the inside of the box</text>
<text x="150" y="856" font-size="15" font-weight="bold">(inner cross-section about 25 × 30 cm)</text>
<text x="150" y="878" font-size="14">Nail soft leather, felt or chicken feathers (feathers pointing</text>
<text x="150" y="896" font-size="14">outwards) all round, so it slides without leaking; rod at the centre</text>
<text x="150" y="924" font-size="15" font-weight="bold">Key points</text>
<text x="150" y="946" font-size="14">✓ The seal round the piston matters most: too tight and it</text>
<text x="166" y="964" font-size="14">won't move, too loose and air leaks</text>
<text x="150" y="986" font-size="14">✓ Box and duct must not leak: seal joints with glue or clay;</text>
<text x="166" y="1004" font-size="14">plane the inside walls flat and smooth</text>
<text x="150" y="1026" font-size="14">✓ Fit a leather sleeve over the rod hole to reduce leaks</text>
</g>
</svg>
