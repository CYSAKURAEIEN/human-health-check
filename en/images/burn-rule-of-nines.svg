<line x1="459" y1="614" x2="459" y2="672" stroke="#333" stroke-width="1.5"/>
<line x1="472" y1="614" x2="472" y2="672" stroke="#333" stroke-width="1.5"/>
<line x1="485" y1="614" x2="485" y2="672" stroke="#333" stroke-width="1.5"/>
<path d="M 446 704 Q 432 692 424 674 Q 420 664 430 666 Q 440 682 446 688" fill="#f3e3d3" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="416" y="604" width="90" height="170" rx="14" fill="none" stroke="#c33" stroke-width="2" stroke-dasharray="6 4"/>
<text x="520" y="624" font-size="14" fill="#222"><tspan font-weight="bold">The casualty's own</tspan> palm</text>
<text x="520" y="644" font-size="14" fill="#222">(fingers included) ≈ <tspan fill="#c33" font-weight="bold">1%</tspan></text>
<text x="520" y="668" font-size="14" fill="#222">Fingers together: whole</text>
<text x="520" y="688" font-size="14" fill="#222">palm plus fingers</text>
<text x="520" y="712" font-size="14" fill="#c33">Use the casualty's hand,</text>
<text x="520" y="732" font-size="14" fill="#c33">not the rescuer's</text>
<text x="520" y="756" font-size="14" fill="#666">First-degree burns (red</text>
<text x="520" y="776" font-size="14" fill="#666">only) are not counted</text>
</g>
<text x="400" y="838" font-size="15" fill="#c33" text-anchor="middle" font-weight="bold">Second-degree burns &gt;10% in adults or &gt;5% in children,</text>
<text x="400" y="858" font-size="15" fill="#c33" text-anchor="middle" font-weight="bold">or any third-degree burn → seek medical care immediately</text>
</svg>
