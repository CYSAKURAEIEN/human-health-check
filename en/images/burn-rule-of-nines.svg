<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 872" width="800" height="872" role="img" aria-label="Estimating burn area (Chinese new rule of nines, adults): head and neck 9% (scalp, face and neck 3% each); both upper limbs 18% (both upper arms 7%, both forearms 6%, both hands 5%); trunk 27% (front 13%, back 13%, perineum 1%); both lower limbs 46% (both buttocks 5%, both thighs 21%, both lower legs 13%, both feet 7%). Children under 12: head and neck = 9% + (12 - age)%, both lower limbs = 46% - (12 - age)%. Palm method: the casualty's own palm including the fingers is about 1% of body surface area" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
