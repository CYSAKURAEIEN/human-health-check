<circle cx="490" cy="96" r="24" fill="#e8c37c" stroke="#333" stroke-width="2"/>
<text x="190" y="196" font-size="14" fill="#222" text-anchor="middle">Front of</text>
<text x="190" y="214" font-size="14" fill="#222" text-anchor="middle">trunk</text>
<text x="190" y="232" font-size="15" text-anchor="middle"><tspan fill="#c33" font-weight="bold">13%</tspan></text>
<text x="490" y="182" font-size="14" fill="#222" text-anchor="middle">Back of</text>
<text x="490" y="200" font-size="14" fill="#222" text-anchor="middle">trunk</text>
<text x="490" y="218" font-size="15" text-anchor="middle"><tspan fill="#c33" font-weight="bold">13%</tspan></text>
<text x="-46" y="106" font-size="14" fill="#222" text-anchor="start">Face <tspan fill="#c33" font-weight="bold">3%</tspan></text>
<line x1="16" y1="101" x2="180" y2="106" stroke="#0b5cad" stroke-width="1.3"/><circle cx="180" cy="106" r="2.6" fill="#0b5cad"/>
<text x="-46" y="184" font-size="14" fill="#222" text-anchor="start">Both upper arms <tspan fill="#c33" font-weight="bold">7%</tspan></text>
<line x1="102" y1="179" x2="130" y2="184" stroke="#0b5cad" stroke-width="1.3"/><circle cx="130" cy="184" r="2.6" fill="#0b5cad"/>
<text x="-46" y="262" font-size="14" fill="#222" text-anchor="start">Both forearms <tspan fill="#c33" font-weight="bold">6%</tspan></text>
<line x1="86" y1="257" x2="122" y2="262" stroke="#0b5cad" stroke-width="1.3"/><circle cx="122" cy="262" r="2.6" fill="#0b5cad"/>
<text x="-46" y="330" font-size="14" fill="#222" text-anchor="start">Both hands <tspan fill="#c33" font-weight="bold">5%</tspan></text>
<line x1="64" y1="325" x2="118" y2="318" stroke="#0b5cad" stroke-width="1.3"/><circle cx="118" cy="318" r="2.6" fill="#0b5cad"/>
<text x="270" y="140" font-size="14" fill="#222" text-anchor="start">Neck <tspan fill="#c33" font-weight="bold">3%</tspan></text>
<line x1="266" y1="135" x2="196" y2="126" stroke="#0b5cad" stroke-width="1.3"/><circle cx="196" cy="126" r="2.6" fill="#0b5cad"/>
<text x="284" y="312" font-size="14" fill="#222" text-anchor="start">Perineum <tspan fill="#c33" font-weight="bold">1%</tspan></text>
<line x1="280" y1="307" x2="190" y2="296" stroke="#0b5cad" stroke-width="1.3"/><circle cx="190" cy="296" r="2.6" fill="#0b5cad"/>
<text x="270" y="360" font-size="14" fill="#222" text-anchor="start">Both thighs <tspan fill="#c33" font-weight="bold">21%</tspan></text>
<line x1="266" y1="355" x2="214" y2="350" stroke="#0b5cad" stroke-width="1.3"/><circle cx="214" cy="350" r="2.6" fill="#0b5cad"/>
<text x="270" y="436" font-size="14" fill="#222" text-anchor="start">Both lower legs <tspan fill="#c33" font-weight="bold">13%</tspan></text>
<line x1="266" y1="431" x2="216" y2="434" stroke="#0b5cad" stroke-width="1.3"/><circle cx="216" cy="434" r="2.6" fill="#0b5cad"/>
<text x="270" y="500" font-size="14" fill="#222" text-anchor="start">Both feet <tspan fill="#c33" font-weight="bold">7%</tspan></text>
<line x1="266" y1="495" x2="222" y2="484" stroke="#0b5cad" stroke-width="1.3"/><circle cx="222" cy="484" r="2.6" fill="#0b5cad"/>
<text x="596" y="76" font-size="14" fill="#222" text-anchor="start">Scalp (hair) <tspan fill="#c33" font-weight="bold">3%</tspan></text>
<line x1="592" y1="71" x2="504" y2="84" stroke="#0b5cad" stroke-width="1.3"/><circle cx="504" cy="84" r="2.6" fill="#0b5cad"/>
<text x="596" y="392" font-size="14" fill="#222" text-anchor="start">Both buttocks <tspan fill="#c33" font-weight="bold">5%</tspan></text>
<line x1="592" y1="387" x2="512" y2="282" stroke="#0b5cad" stroke-width="1.3"/><circle cx="512" cy="282" r="2.6" fill="#0b5cad"/>
<text x="190" y="532" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Front</text>
<text x="490" y="532" font-size="15" fill="#222" text-anchor="middle" font-weight="bold">Back</text>
<text x="596" y="452" font-size="13" fill="#666">Figures for limbs</text>
<text x="596" y="469" font-size="13" fill="#666">and neck include</text>
<text x="596" y="486" font-size="13" fill="#666">front and back;</text>
<text x="596" y="503" font-size="13" fill="#666">marked once</text>
</g>
<rect x="8" y="566" width="412" height="246" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="22" y="590" font-size="16" fill="#222" font-weight="bold">Totals by region (adult)</text>
<rect x="24" y="603" width="16" height="16" rx="3" fill="#fae6bf" stroke="#333" stroke-width="1.5"/>
<text x="50" y="616" font-size="15" fill="#222">Head and neck</text>
<text x="210" y="616" font-size="15" text-anchor="end"><tspan fill="#c33" font-weight="bold">9%</tspan></text>
<rect x="24" y="627" width="16" height="16" rx="3" fill="#cfe6c4" stroke="#333" stroke-width="1.5"/>
<text x="50" y="640" font-size="15" fill="#222">Both upper limbs</text>
<text x="210" y="640" font-size="15" text-anchor="end"><tspan fill="#c33" font-weight="bold">18%</tspan></text>
<text x="218" y="640" font-size="14" fill="#666">(2 × 9%)</text>
<rect x="24" y="651" width="16" height="16" rx="3" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<text x="50" y="664" font-size="15" fill="#222">Trunk</text>
<text x="210" y="664" font-size="15" text-anchor="end"><tspan fill="#c33" font-weight="bold">27%</tspan></text>
<text x="218" y="664" font-size="14" fill="#666">(3 × 9%)</text>
<rect x="24" y="675" width="16" height="16" rx="3" fill="#e4daf0" stroke="#333" stroke-width="1.5"/>
<text x="50" y="688" font-size="15" fill="#222">Both lower limbs</text>
<text x="210" y="688" font-size="15" text-anchor="end"><tspan fill="#c33" font-weight="bold">46%</tspan></text>
<text x="218" y="688" font-size="14" fill="#666">(5 × 9% + 1%)</text>
<line x1="22" y1="702" x2="406" y2="702" stroke="#ddd" stroke-width="1.5"/>
<text x="22" y="724" font-size="14" fill="#222" font-weight="bold">Children under 12 (big head, short legs): adjust</text>
<text x="22" y="744" font-size="14" fill="#222">Head and neck = 9% + (12 - age)%</text>
<text x="22" y="763" font-size="14" fill="#222">Both lower limbs = 46% - (12 - age)%</text>
<text x="22" y="782" font-size="14" fill="#0b5cad">e.g. a 2-year-old: head and neck about 19%,</text>
<text x="22" y="800" font-size="14" fill="#0b5cad">both lower limbs about 36%</text>
<g transform="translate(40 0)">
<rect x="390" y="566" width="362" height="246" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="404" y="590" font-size="16" fill="#222" font-weight="bold">Small or patchy burns: palm method</text>
