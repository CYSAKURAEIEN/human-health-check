<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 970" width="720" height="970" role="img" aria-label="Winnowing and wind cleaning: 1 winnowing fan (fanning mill): grain falls at an even rate from the hopper above, with an adjustable gate at its outlet to control the flow, and passes through the sideways wind from the hand-cranked fan; heavy grains fall almost straight down into the outlet near the fan, light shrivelled grains are blown a little aside into the outlet further off, and chaff and dust blow out of the opening at the other end of the wooden box; cranking fast makes a strong wind that may blow good grain out too, cranking slowly does not blow the chaff clean, and the flow should be thin and even; the crank can catch sleeves and hair. 2 Winnowing in the wind: wait for a steady light breeze, stand side-on to the wind and throw the grain upwards at a slant in an arc with a wooden shovel; plump grains land close by, shrivelled grains and chaff a little further off, and dust and broken leaves blow away. 3 Winnowing basket: hold both sides and toss it up and down, pushing slightly forwards; the grain gathers towards the back and the chaff is tossed to the front edge and shaken out" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Winnowing: winnowing fan, winnowing in the wind and winnowing basket</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<g id="gh"><ellipse rx="4.5" ry="3" fill="#d9a520" stroke="#6b4f10" stroke-width="1"/></g>
<g id="gl"><ellipse rx="4" ry="2.5" fill="#f6eecb" stroke="#a08a50" stroke-width="1"/></g>
<g id="ch"><path d="M-4,1 L4,-1" stroke="#999" stroke-width="1.5"/></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Winnowing: let the wind blow the light material away</text>

<!-- 1 winnowing fan -->
<rect x="10" y="44" width="700" height="520" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="15" font-weight="bold">① Winnowing fan: on windless days make your own wind by hand (cross-section)</text>
<path d="M11.5,368 H708.5" stroke="#999" stroke-width="3"/>
<path d="M150,294 V368 M588,294 V368" stroke="#8f6d2e" stroke-width="5"/>
<!-- wooden box + round air duct -->
<path d="M110,178 H600 V294 H110 A58,58 0 0 1 110,178 Z" fill="#fbf6ec"/>
<path d="M600,178 H110 A58,58 0 0 0 110,294 H246 M306,294 H360 M430,294 H600" fill="none" stroke="#8f6d2e" stroke-width="4"/>
<!-- outlets -->
<path d="M246,294 L262,334 M306,294 L290,334 M360,294 L378,334 M430,294 L412,334" stroke="#8f6d2e" stroke-width="3"/>
<path d="M248,338 H304 L300,366 H252 Z" fill="#e8dcc0" stroke="#333" stroke-width="1.5"/>
<path d="M366,338 H424 L420,366 H370 Z" fill="#e8dcc0" stroke="#333" stroke-width="1.5"/>
<use href="#gh" x="268" y="336"/><use href="#gh" x="280" y="334"/><use href="#gh" x="274" y="340"/><use href="#gh" x="286" y="340"/>
<use href="#gl" x="388" y="336"/><use href="#gl" x="400" y="339"/><use href="#gl" x="394" y="333"/>
<!-- fan -->
<g fill="#d9c29a" stroke="#333" stroke-width="1.5">
<rect x="110" y="231" width="48" height="10" transform="rotate(20,110,236)"/>
<rect x="110" y="231" width="48" height="10" transform="rotate(110,110,236)"/>
<rect x="110" y="231" width="48" height="10" transform="rotate(200,110,236)"/>
<rect x="110" y="231" width="48" height="10" transform="rotate(290,110,236)"/>
</g>
<circle cx="110" cy="236" r="6" fill="#333"/>
<path d="M110,236 L68,290" stroke="#555" stroke-width="5" stroke-linecap="round"/>
<circle cx="68" cy="290" r="7" fill="#8f6d2e" stroke="#333" stroke-width="1.5"/>
<!-- hopper + gate -->
<path d="M212,96 H328 L282,166 H258 Z" fill="#fbf6ec" stroke="#8f6d2e" stroke-width="3" stroke-linejoin="round"/>
<path d="M232,126 H308 L282,166 H258 Z" fill="#e3c46a"/>
<path d="M258,166 V178 M282,166 V178" stroke="#8f6d2e" stroke-width="3"/>
<rect x="236" y="164" width="32" height="5" fill="#555" stroke="#333" stroke-width="1"/>
<!-- wind -->
<path d="M176,212 H232 M176,238 H232 M176,264 H232" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
<path d="M470,246 H560" stroke="#c33" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arR)"/>
<text x="184" y="204" font-size="14" font-weight="bold" fill="#c33">wind</text>
<!-- particle paths -->
<path d="M270,182 Q276,240 276,292" fill="none" stroke="#d9a520" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M272,182 Q300,210 394,292" fill="none" stroke="#a08a50" stroke-width="1" stroke-dasharray="3 3"/>
<use href="#gh" x="271" y="196"/><use href="#gh" x="273" y="218"/><use href="#gh" x="275" y="242"/><use href="#gh" x="276" y="266"/><use href="#gh" x="276" y="286"/>
<use href="#gl" x="290" y="204"/><use href="#gl" x="314" y="222"/><use href="#gl" x="340" y="243"/><use href="#gl" x="364" y="264"/><use href="#gl" x="384" y="284"/>
<use href="#ch" x="300" y="196"/><use href="#ch" x="340" y="204"/><use href="#ch" x="386" y="208"/><use href="#ch" x="430" y="214"/><use href="#ch" x="480" y="218"/><use href="#ch" x="530" y="222"/><use href="#ch" x="580" y="224"/><use href="#ch" x="622" y="226"/><use href="#ch" x="656" y="232"/><use href="#ch" x="688" y="238"/>
<g fill="#999"><circle cx="320" cy="200" r="1.5"/><circle cx="410" cy="206" r="1.5"/><circle cx="505" cy="212" r="1.5"/><circle cx="600" cy="216" r="1.5"/><circle cx="640" cy="220" r="1.5"/><circle cx="672" cy="214" r="1.5"/></g>
<!-- labels -->
<g stroke="#555" stroke-width="1"><path d="M174,152 L238,164"/><path d="M336,118 L314,124"/><path d="M40,130 L72,214"/></g>
<g font-size="13">
<text x="24" y="92">Hand-cranked fan: 4-6</text><text x="24" y="108">wooden blades on a shaft,</text>
<text x="24" y="124">inside a round air duct</text>
<text x="72" y="156">adjustable gate:</text>
<text x="72" y="172">controls the flow</text>
<text x="340" y="114">hopper: grain falls at an even rate</text>
<text x="24" y="318">crank</text>
<text x="470" y="286" fill="#555">wooden box</text>
<text x="654" y="282" text-anchor="middle">other end of</text>
<text x="654" y="300" text-anchor="middle">box open: chaff</text>
<text x="654" y="318" text-anchor="middle">and dust</text><text x="654" y="336" text-anchor="middle">blow out</text>
<text x="300" y="166" fill="#6b4f10">heavy grains fall almost straight down</text>
<text x="394" y="266" fill="#7a6838">light grains blown a little aside</text>
</g>
<g font-size="14" font-weight="bold" text-anchor="middle">
<text x="276" y="390">outlet 1: plump grain</text>
<text x="384" y="390" text-anchor="start">outlet 2: shrivelled grain (further off)</text>
</g>
<text x="276" y="408" font-size="13" text-anchor="middle" fill="#555">(near the fan)</text>
<path d="M24,424 H696" stroke="#ddd" stroke-width="1.5"/>
<g font-size="13">
<text x="24" y="448" font-size="14" font-weight="bold">Adjusting:</text>
<text x="24" y="468">• Crank fast → strong wind; good grain may</text>
<text x="36" y="485">be blown out too</text>
<text x="24" y="504">• Crank slowly → weak wind; chaff is not</text>
<text x="36" y="521">blown clean</text>
<text x="24" y="540">• Keep the flow thin and even; too much at</text>
<text x="36" y="557">once and the wind cannot get through it</text>
</g>
<rect x="372" y="436" width="326" height="116" rx="6" fill="#fbeaea" stroke="#c33" stroke-width="1.5"/>
<g font-size="13" fill="#c33">
<text x="384" y="458" font-weight="bold">⚠ The crank can catch sleeves, hair</text>
<text x="400" y="475" font-weight="bold">and scarves</text>
<text x="384" y="494">→ Tie cuffs tight, put long hair up, wear</text>
<text x="400" y="511">no scarves or long dangling items</text>
<text x="384" y="530">⚠ Let it stop completely before adjusting</text>
<text x="400" y="547">or clearing it</text>
</g>

<g transform="translate(0,24)">
<!-- 2 winnowing in the wind -->
<rect x="10" y="552" width="700" height="380" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<line x1="360" y1="566" x2="360" y2="918" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="578" font-size="16" font-weight="bold">② In the wind</text>
<path d="M11.5,700 H352 V740 H11.5 Z" fill="#e8e8e8"/>
<path d="M11.5,700 H352" stroke="#999" stroke-width="3"/>
<path d="M24,596 H92 M272,596 H340" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
<text x="24" y="614" font-size="14" font-weight="bold" fill="#c33">wind</text>
<!-- person (front view) -->
<path d="M63,680 L58,700 M77,680 L82,700" stroke="#333" stroke-width="4" stroke-linecap="round"/>
<rect x="55" y="634" width="30" height="48" rx="10" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="70" cy="620" r="12" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M84,664 L130,606" stroke="#8f6d2e" stroke-width="4" stroke-linecap="round"/>
<path d="M124,602 L142,586 L150,596 L134,612 Z" fill="#d9c29a" stroke="#333" stroke-width="1.5"/>
<path d="M58,642 L92,654 M82,640 L110,628" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
<text x="100" y="660" font-size="13">wooden</text><text x="100" y="676" font-size="13">shovel</text>
<!-- throwing arc and where things land -->
<path d="M146,590 Q168,560 182,580" fill="none" stroke="#aaa" stroke-width="1" stroke-dasharray="3 3"/>
<use href="#gh" x="156" y="576"/><use href="#gh" x="168" y="570"/><use href="#gl" x="176" y="574"/>
<use href="#gh" x="186" y="604"/><use href="#gh" x="192" y="632"/><use href="#gh" x="196" y="660"/><use href="#gh" x="199" y="684"/>
<use href="#gl" x="200" y="606"/><use href="#gl" x="220" y="634"/><use href="#gl" x="240" y="660"/><use href="#gl" x="256" y="684"/>
<use href="#ch" x="212" y="588"/><use href="#ch" x="252" y="596"/><use href="#ch" x="292" y="616"/><use href="#ch" x="330" y="622"/>
<g fill="#999"><circle cx="232" cy="584" r="1.5"/><circle cx="272" cy="606" r="1.5"/><circle cx="312" cy="612" r="1.5"/></g>
<path d="M178,700 A22,10 0 0 1 222,700 Z" fill="#d9a520" stroke="#6b4f10" stroke-width="1.5"/>
<path d="M248,700 A18,7 0 0 1 284,700 Z" fill="#f6eecb" stroke="#a08a50" stroke-width="1.5"/>
<g font-size="13" text-anchor="middle">
<text x="196" y="718" font-weight="bold">plump grain</text><text x="196" y="734">(close by)</text>
<text x="294" y="718" font-weight="bold">shrivelled, chaff</text><text x="294" y="734">(further off)</text>
<text x="346" y="634" text-anchor="end" fill="#555" font-size="12">dust, broken</text><text x="346" y="648" text-anchor="end" fill="#555" font-size="12">leaves</text><text x="346" y="662" text-anchor="end" fill="#555" font-size="12">blow away</text>
</g>
<g font-size="13">
<text x="24" y="758">1. Wait for a steady light breeze (leaves moving</text>
<text x="40" y="775">all the time, thin twigs swaying gently); too</text>
<text x="40" y="792">strong a wind blows good grain away too</text>
<text x="24" y="811">2. Stand side-on to the wind, scoop up grain with</text>
<text x="40" y="828">a wooden shovel, throw it upwards in an arc</text>
<text x="24" y="847">3. Heavy, plump grains land close by; shrivelled</text>
<text x="40" y="864">grains and chaff a little further off; dust and</text>
<text x="40" y="881">broken leaves blow away</text>
<text x="24" y="900">4. Lightly sweep the chaff off the heap with a broom</text>
<text x="24" y="919">5. Usually two or three passes to get it clean</text>
</g>

<!-- 3 winnowing basket -->
<text x="374" y="578" font-size="16" font-weight="bold">③ Winnowing basket (small amounts)</text>
<path d="M404,620 V674" stroke="#c33" stroke-width="3" marker-start="url(#arR2)" marker-end="url(#arR2)"/>
<text x="404" y="698" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">toss up</text><text x="404" y="714" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">and down</text>
<path d="M540,706 H612" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
<text x="576" y="726" font-size="13" text-anchor="middle" fill="#c33" font-weight="bold">push slightly forwards</text>
<path d="M440,612 Q434,678 470,682 L650,676" fill="none" stroke="#8f6d2e" stroke-width="5" stroke-linecap="round"/>
<use href="#gh" x="454" y="672"/><use href="#gh" x="464" y="676"/><use href="#gh" x="474" y="676"/><use href="#gh" x="484" y="676"/><use href="#gh" x="494" y="676"/><use href="#gh" x="459" y="666"/><use href="#gh" x="469" y="670"/><use href="#gh" x="479" y="670"/><use href="#gh" x="489" y="670"/><use href="#gh" x="472" y="664"/><use href="#gh" x="504" y="676"/>
<use href="#ch" x="604" y="672"/><use href="#ch" x="620" y="671"/><use href="#ch" x="636" y="670"/><use href="#ch" x="664" y="662"/><use href="#ch" x="682" y="654"/><use href="#ch" x="696" y="664"/>
<g font-size="13">
<text x="452" y="652">grain gathers at the back</text>
<text x="702" y="600" text-anchor="end">chaff and bits are tossed</text><text x="702" y="616" text-anchor="end">to the front edge; a light</text>
<text x="702" y="632" text-anchor="end">shake sends them out</text>
</g>
<g font-size="13">
<text x="374" y="758">Hold both sides and toss it up and down,</text>
<text x="374" y="775">pushing slightly forwards</text>
<text x="374" y="796">→ The grain gathers towards the back of the</text>
<text x="390" y="813">basket; chaff and bits are tossed to the</text>
<text x="390" y="830">front edge and a light shake sends them out</text>
<text x="374" y="854">✓ Use the same method to remove bran after</text>
<text x="390" y="871">milling or pounding rice</text>
</g>
</g>
</g>
</svg>
