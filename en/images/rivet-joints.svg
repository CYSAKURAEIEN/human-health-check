<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 874" width="720" height="874" role="img" aria-label="Riveting and seaming iron sheet. Rules of thumb for sizes: rivet diameter d for thin plate about 1.5-2 times the plate thickness; rivet pitch (centre to centre) at least 3d; rivet to plate edge at least 2d; rivet length is the total thickness of both plates plus about 1.5d (to form the second head). Cold riveting: 1 clamp the two plates together and drill through both at once, the hole slightly larger than the rivet; 2 insert the rivet, with the head side resting on an anvil or a block of iron; 3 with a hammer, first thicken (upset) the protruding shank; 4 then form it into a round head, so the two plates sit tight against each other with no play. Hot riveting: heat the rivet to bright red, quickly insert it in the hole, hold it up from behind and hammer a head on the front; as the rivet cools it shrinks and pulls the two plates very tight, much stronger than cold riveting and good where loads are high. Seaming iron sheet: bend the edges of two sheets so they hook into each other, then hammer flat, with no rivets and no welding; used for sheet-iron buckets, stovepipes and troughs; seal the seam with soft solder to make it watertight" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Riveting and seaming iron sheet</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="tkB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0 V10" stroke="#0b5cad" stroke-width="1.5"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" text-anchor="middle" font-weight="bold">Riveting: drill both plates together, back the head, upset, then round it</text>

<!-- rules of thumb for sizes -->
<rect x="10" y="44" width="700" height="248" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="20" y="68" font-size="15" font-weight="bold">Rules of thumb for sizes (d = rivet diameter)</text>
<text x="660" y="88" font-size="12" fill="#555" text-anchor="end">(section)</text>
<rect x="30" y="76" width="300" height="86" fill="#d6dde4" stroke="none"/>
<rect x="30" y="162" width="300" height="34" fill="#b8c2cc" stroke="none"/>
<path d="M30,98 H330" stroke="#333" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M30,162 H330" stroke="#333" stroke-width="2"/>
<text x="36" y="92" font-size="12" fill="#555">upper plate (top view)</text>
<text x="326" y="177" font-size="12" fill="#555" text-anchor="end">lower plate</text>
<g fill="#eef1f4" stroke="#333" stroke-width="2">
<circle cx="110" cy="130" r="8"/><circle cx="158" cy="130" r="8"/><circle cx="206" cy="130" r="8"/><circle cx="254" cy="130" r="8"/><circle cx="302" cy="130" r="8"/>
</g>
<path d="M206,142 V180 M254,142 V180" stroke="#0b5cad" stroke-width="1" stroke-dasharray="2 2"/>
<path d="M206,176 H254" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="230" y="194" font-size="12.5" fill="#0b5cad" text-anchor="middle">pitch: at least 3d</text>
<path d="M74,130 H102" stroke="#0b5cad" stroke-width="1" stroke-dasharray="2 2"/>
<path d="M80,130 V162" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="34" y="178" font-size="12.5" fill="#0b5cad">to edge: at least 2d</text>
<rect x="400" y="140" width="260" height="10" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="380" y="150" width="240" height="10" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="500" y="139" width="20" height="22" fill="#fff"/>
<path d="M500,140 V160 M520,140 V160" stroke="#333" stroke-width="1.5"/>
<rect x="502" y="116" width="16" height="45" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<path d="M492,160 A18,11 0 0 0 528,160 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<path d="M502,108 H518" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="494" y="112" font-size="13" fill="#0b5cad" text-anchor="end" font-weight="bold">d</text>
<path d="M530,116 V140" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="538" y="116" font-size="12.5" fill="#0b5cad">sticks out about 1.5d</text>
<text x="538" y="133" font-size="12.5" fill="#0b5cad">to form the second head</text>
<path d="M470,140 V160" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="380" y="190" font-size="12.5" fill="#0b5cad">total thickness</text>
<text x="380" y="204" font-size="12.5" fill="#0b5cad">of both plates</text>
<line x1="440" y1="184" x2="469" y2="157" stroke="#0b5cad" stroke-width="1.2"/>
<text x="566" y="190" font-size="12.5" fill="#555">hole slightly larger</text>
<text x="566" y="204" font-size="12.5" fill="#555">than the rivet</text>
<line x1="582" y1="178" x2="520" y2="156" stroke="#0b5cad" stroke-width="1.2"/><circle cx="520" cy="156" r="2.2" fill="#0b5cad"/>
<text x="512" y="190" font-size="12" fill="#555" text-anchor="middle">head</text>
<g font-size="13.5">
<text x="20" y="232">Rivet diameter d: for thin plate about 1.5-2 times the plate thickness</text>
<text x="20" y="252">Pitch (centre to centre) at least 3d; rivet to plate edge at least 2d</text>
<text x="20" y="272">Rivet length = total thickness of both plates + about 1.5d (to form the second head)</text>
</g>

<!-- cold riveting, 4 steps -->
<g transform="translate(10,302)">
<rect width="172" height="252" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">① Clamp and drill</text>
<rect x="30" y="110" width="128" height="10" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="30" y="120" width="128" height="10" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<path d="M52,94 H18 V146 H52" fill="none" stroke="#555" stroke-width="5" stroke-linejoin="round"/>
<path d="M44,86 V108" stroke="#555" stroke-width="4"/>
<rect x="37" y="104" width="14" height="6" fill="#555"/>
<rect x="37" y="130" width="14" height="6" fill="#555"/>
<rect x="76" y="34" width="20" height="18" rx="2" fill="#888" stroke="#333" stroke-width="1.5"/>
<path d="M79,52 H93 V102 L86,110 L79,102 Z" fill="#d6dde4" stroke="#333" stroke-width="1.5"/>
<path d="M79,60 L93,68 M79,72 L93,80 M79,84 L93,92 M79,96 L93,104" stroke="#555" stroke-width="1.2"/>
<path d="M114,48 V92" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="120" y="68" font-size="12" fill="#555">drill</text>
<text x="58" y="150" font-size="12" fill="#555">clamp</text>
<g font-size="13">
<text x="10" y="186">Clamp both plates and</text>
<text x="10" y="204">drill through together</text>
<text x="10" y="222">(hole slightly larger</text>
<text x="10" y="240">than the rivet)</text>
</g>
</g>

<g transform="translate(186,302)">
<rect width="172" height="252" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">② Insert the rivet</text>
<rect x="14" y="110" width="144" height="10" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="14" y="120" width="144" height="10" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="76" y="109" width="20" height="22" fill="#fff"/>
<path d="M76,110 V130 M96,110 V130" stroke="#333" stroke-width="1.5"/>
<rect x="78" y="86" width="16" height="45" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<path d="M68,130 A18,10 0 0 0 104,130 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<rect x="40" y="140" width="92" height="22" fill="#666" stroke="#333" stroke-width="1.8"/>
<path d="M86,48 V78" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="136" y="156" font-size="12" fill="#555">anvil</text>
<text x="112" y="80" font-size="12" fill="#555">shank</text>
<line x1="110" y1="76" x2="95" y2="92" stroke="#0b5cad" stroke-width="1.2"/>
<g font-size="13">
<text x="10" y="186">Insert the rivet; rest the</text>
<text x="10" y="204">head side on an anvil or</text>
<text x="10" y="222">a block of iron</text>
</g>
</g>

<g transform="translate(362,302)">
<rect width="172" height="252" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">③ Upset it first</text>
<rect x="14" y="110" width="144" height="10" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="14" y="120" width="144" height="10" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="76" y="109" width="20" height="22" fill="#e6e9ec"/>
<path d="M76,110 V130 M96,110 V130" stroke="#333" stroke-width="1.5"/>
<path d="M76,110 Q70,104 72,96 H100 Q102,104 96,110 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<path d="M68,130 A18,10 0 0 0 104,130 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<rect x="40" y="140" width="92" height="22" fill="#666" stroke="#333" stroke-width="1.8"/>
<rect x="56" y="66" width="60" height="26" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="116" y="73" width="50" height="11" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M86,34 V60" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="10" y="100" font-size="12" fill="#c33" font-weight="bold">upset</text>
<line x1="48" y1="98" x2="70" y2="102" stroke="#c33" stroke-width="1.2"/>
<g font-size="13">
<text x="10" y="186">With a hammer, first</text>
<text x="10" y="204">thicken the protruding</text>
<text x="10" y="222">shank (upset it)</text>
</g>
</g>

<g transform="translate(538,302)">
<rect width="172" height="252" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">④ Round the head</text>
<rect x="14" y="110" width="144" height="10" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="14" y="120" width="144" height="10" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="76" y="109" width="20" height="22" fill="#e6e9ec"/>
<path d="M76,110 V130 M96,110 V130" stroke="#333" stroke-width="1.5"/>
<path d="M68,110 A18,12 0 0 1 104,110 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<path d="M68,130 A18,10 0 0 0 104,130 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<rect x="40" y="140" width="92" height="22" fill="#666" stroke="#333" stroke-width="1.8"/>
<path d="M44,62 L66,94" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M128,62 L106,94" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M86,46 V84" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M18,104 l5,6 l9,-11" fill="none" stroke="#2a8a3a" stroke-width="2.5"/>
<text x="10" y="150" font-size="12" fill="#2a8a3a">tight</text>
<g font-size="13">
<text x="10" y="186">Then form a round head;</text>
<text x="10" y="204">the two plates sit tight</text>
<text x="10" y="222">together, with no play</text>
</g>
</g>

<!-- hot riveting -->
<g transform="translate(10,564)">
<rect width="344" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">Hot riveting (large rivets, steelwork)</text>
<rect x="40" y="100" width="260" height="14" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="40" y="114" width="260" height="14" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="159" y="99" width="22" height="30" fill="#d4372a"/>
<path d="M159,100 V128 M181,100 V128" stroke="#333" stroke-width="1.5"/>
<rect x="160" y="70" width="20" height="58" fill="#d4372a" stroke="#333" stroke-width="1.8"/>
<path d="M148,128 A22,13 0 0 0 192,128 Z" fill="#d4372a" stroke="#333" stroke-width="1.8"/>
<rect x="152" y="141" width="36" height="28" fill="#666" stroke="#333" stroke-width="1.8"/>
<path d="M170,192 V174" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<rect x="138" y="32" width="64" height="24" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="202" y="38" width="56" height="11" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M170,58 V66" stroke="#c33" stroke-width="2.5"/>
<text x="230" y="80" font-size="12.5" fill="#c33" font-weight="bold">rivet heated to</text>
<text x="230" y="94" font-size="12.5" fill="#c33" font-weight="bold">bright red</text>
<line x1="228" y1="78" x2="182" y2="86" stroke="#0b5cad" stroke-width="1.2"/>
<text x="196" y="160" font-size="12.5" fill="#555">held up behind</text>
<text x="264" y="46" font-size="12.5" fill="#555">hammer</text>
<text x="264" y="60" font-size="12.5" fill="#555">the front</text>
<path d="M90,78 V97" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<path d="M90,150 V131" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="16" y="58" font-size="12.5" fill="#0b5cad">cools and shrinks,</text>
<text x="16" y="72" font-size="12.5" fill="#0b5cad">pulls tight</text>
<g font-size="13">
<text x="10" y="210">Heat the rivet to bright red, quickly insert it,</text>
<text x="10" y="228">hold it up from behind and hammer a head on</text>
<text x="10" y="246">the front; as it cools it shrinks and pulls the</text>
<text x="10" y="264">two plates very tight → much stronger than</text>
<text x="10" y="282">cold riveting; good where loads are high</text>
</g>
</g>

<!-- seaming -->
<g transform="translate(366,564)">
<rect width="344" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">Seaming iron sheet (section)</text>
<g fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path d="M20,70 H96 A4,4 0 0 0 96,62 H72"/>
<path d="M224,58 H124 A4,4 0 0 0 124,66 H148"/>
<path d="M20,120 H96 A4,4 0 0 0 96,112 H80"/>
<path d="M200,108 H76 A4,4 0 0 0 76,116 H92"/>
<path d="M20,172 H96 A2,2 0 0 0 96,168 H80"/>
<path d="M200,162 H76 A2,2 0 0 0 76,166 H92"/>
</g>
<path d="M86,138 V156" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="236" y="68" font-size="13">① bend edges</text>
<text x="236" y="118" font-size="13">② hook together</text>
<text x="236" y="170" font-size="13">③ hammer flat</text>
<g font-size="13">
<text x="10" y="210">Bend the edges of two sheets so they hook</text>
<text x="10" y="228">together, then hammer flat: no rivets, no</text>
<text x="10" y="246">welding. The usual way to make sheet-iron</text>
<text x="10" y="264">buckets, stovepipes and troughs; seal the</text>
<text x="10" y="282">seam with soft solder to make it watertight</text>
</g>
</g>
</g>
</svg>
