<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 716" width="720" height="716" role="img" aria-label="Right-angle mortise and tenon (for joining table and chair legs to rails): mark out a tenon on the end of the rail, about 1/3 of the timber's thickness, and saw off the waste on both sides; mark out the mortise in the matching place on the leg, drill out most of it, then square it up with a chisel; test-fit first, and if it is tight, trim the tenon; do not force it in with a hammer, as it will split the mortise; apply glue and knock it in, clamp tight, and only put weight on it once fully dry" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
