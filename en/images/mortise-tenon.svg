<text x="20" y="410" font-size="15" font-weight="bold">① Mark out</text>
<text x="20" y="598" font-size="13">Mark out the</text>
<text x="20" y="616" font-size="13">tenon on the end</text>
<text x="20" y="634" font-size="13">of the rail (about</text>
<text x="20" y="652" font-size="13">1/3 of the timber's</text>
<text x="20" y="670" font-size="13">thickness)</text>
<text x="161" y="410" font-size="15" font-weight="bold">② Saw</text>
<text x="161" y="598" font-size="13">Saw off the waste</text>
<text x="161" y="616" font-size="13">on both sides to</text>
<text x="161" y="634" font-size="13">form the tenon</text>
<text x="302" y="410" font-size="15" font-weight="bold">③ Mortise</text>
<text x="302" y="598" font-size="13">Mark the mortise</text>
<text x="302" y="616" font-size="13">on the leg; drill</text>
<text x="302" y="634" font-size="13">out most of it,</text>
<text x="302" y="652" font-size="13">then square it up</text>
<text x="302" y="670" font-size="13">with a chisel</text>
<text x="443" y="410" font-size="15" font-weight="bold">④ Test-fit</text>
<text x="443" y="598" font-size="13">If it is tight,</text>
<text x="443" y="616" font-size="13">trim the tenon;</text>
<text x="443" y="634" font-size="13" fill="#c33">do not force it in</text>
<text x="443" y="652" font-size="13" fill="#c33">with a hammer</text>
<text x="443" y="670" font-size="13" fill="#c33">(it will split</text>
<text x="443" y="688" font-size="13" fill="#c33">the mortise)</text>
<text x="584" y="410" font-size="15" font-weight="bold">⑤ Glue</text>
<text x="584" y="598" font-size="13">Apply glue and</text>
<text x="584" y="616" font-size="13">knock it in,</text>
<text x="584" y="634" font-size="13">clamp tight; put</text>
<text x="584" y="652" font-size="13">weight on it only</text>
<text x="584" y="670" font-size="13">once fully dry</text>
