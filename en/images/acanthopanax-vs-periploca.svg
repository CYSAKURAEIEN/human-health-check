<text x="552" y="240" font-size="14">Leaves <tspan font-weight="bold">opposite</tspan>,</text>
<text x="552" y="257" font-size="14">lanceolate,</text>
<text x="552" y="274" font-size="14">smooth, <tspan font-weight="bold">no prickles</tspan></text>
<text x="552" y="182" font-size="14">Broken, it gives</text>
<text x="552" y="201" font-size="15" font-weight="bold" fill="#c33">white milky sap</text>

