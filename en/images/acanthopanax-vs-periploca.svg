<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 930" width="720" height="930" role="img" aria-label="Wujiapi compared with Xiangjiapi: Xiangjiapi (northern Wujiapi) is the root bark of Chinese silk vine, Periploca sepium; it contains cardiac glycosides, is toxic, is often passed off as Wujiapi and is also mixed into Digupi. Acanthopanax is an upright shrub 2-3 m tall, with scattered, flattened hooked prickles on the branches and palmately compound leaves of 5 leaflets (rarely 3-4); Wujiapi is in irregular rolled tubes, the outer surface greyish-brown with slightly twisted lengthwise wrinkles and transverse lenticel-like marks, the inner surface pale yellow or greyish-yellow with fine lengthwise lines, faintly fragrant, taste slightly hot and bitter. Periploca is a twining vine that gives white milky sap when broken, with opposite, lanceolate, smooth leaves without prickles; Xiangjiapi has a soft, loose cork that often flakes off in scales, and a strong, peculiar fragrance (some describe it as like wintergreen oil). Do not use, or steep in liquor, any Wujiapi or Digupi with a strong, peculiar fragrance; poisoning can cause nausea and vomiting, seeing things tinged yellow or green, a very slow heartbeat or heart rhythm problems, and in severe cases cardiac arrest">
<rect width="100%" height="100%" fill="#fff"/>
<title>Wujiapi compared with Xiangjiapi</title>
<defs>
<g id="palm"><path d="M0 0 H22" stroke="#4d6b2a" stroke-width="2"/><g fill="#a9c77c" stroke="#333" stroke-width="1.1"><path transform="translate(22 0) rotate(-66)" d="M0 0 C5 -3 14 -8 22 -6 C27 -4 27 4 22 6 C14 8 5 3 0 0Z"/><path transform="translate(22 0) rotate(-33)" d="M0 0 C6 -3 17 -9 26 -7 C32 -5 32 5 26 7 C17 9 6 3 0 0Z"/><path transform="translate(22 0)" d="M0 0 C6 -3 18 -10 28 -7 C35 -5 35 5 28 7 C18 10 6 3 0 0Z"/><path transform="translate(22 0) rotate(33)" d="M0 0 C6 -3 17 -9 26 -7 C32 -5 32 5 26 7 C17 9 6 3 0 0Z"/><path transform="translate(22 0) rotate(66)" d="M0 0 C5 -3 14 -8 22 -6 C27 -4 27 4 22 6 C14 8 5 3 0 0Z"/></g></g>
<g id="lance"><path d="M0 0 C8 -6 26 -7 44 0 C26 7 8 6 0 0Z" fill="#b5cf88" stroke="#333" stroke-width="1.1"/><path d="M2 0 H40" stroke="#5f7f36" stroke-width="0.8"/></g>
<path id="spine" d="M0 0 L7 -3 Q4 2 6 6 Z" fill="#6b4a2a"/>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Wujiapi vs Xiangjiapi (toxic): how to tell them apart (schematic)</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">Xiangjiapi (northern Wujiapi) is often passed off as Wujiapi and also mixed into Digupi;</text>
<text x="360" y="70" font-size="13" fill="#555" text-anchor="middle">it contains cardiac glycosides — look at the whole plant when collecting, smell it first when buying</text>
<g transform="translate(0 18)">
<rect x="10" y="64" width="345" height="580" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="365" y="64" width="345" height="580" rx="8" fill="none" stroke="#c33" stroke-width="2"/>

<!-- 1 Acanthopanax -->
<text x="26" y="92" font-size="18" font-weight="bold">① Wujiapi <tspan font-size="14" font-weight="normal">(Nan Wujiapi)</tspan></text>
<text x="26" y="112" font-size="12" fill="#555">Araliaceae · root bark of <tspan font-style="italic">Acanthopanax gracilistylus</tspan></text>
