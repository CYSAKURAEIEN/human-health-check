</g>
</g>
<text x="196" y="432" font-size="13">Irregular rolled tubes</text>
<text x="196" y="451" font-size="12">Outer: greyish-brown,</text>
<text x="196" y="466" font-size="12">slightly twisted</text>
<text x="196" y="481" font-size="12">lengthwise wrinkles,</text>
<text x="196" y="497" font-size="12">transverse lenticel-</text>
<text x="196" y="512" font-size="12">like marks</text>
<text x="196" y="530" font-size="12">Inner: pale yellow or</text>
<text x="196" y="545" font-size="12">greyish-yellow,</text>
<text x="196" y="560" font-size="12">fine lengthwise lines</text>
<rect x="22" y="570" width="321" height="62" rx="6" fill="#f4f4f4"/>
<text x="182" y="594" font-size="16" text-anchor="middle">Smell: <tspan font-weight="bold">faintly fragrant</tspan></text>
<text x="182" y="618" font-size="14" text-anchor="middle">taste slightly hot and bitter</text>

