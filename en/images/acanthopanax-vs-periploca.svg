<text x="222" y="150" font-size="15" font-weight="bold">Upright shrub</text>
<text x="222" y="169" font-size="13">2-3 m tall</text>
<text x="222" y="208" font-size="14" font-weight="bold">Palmately</text>
<text x="222" y="225" font-size="14" font-weight="bold">compound leaves</text>
<text x="222" y="243" font-size="13">5 leaflets</text>
<text x="222" y="259" font-size="13">(rarely 3-4)</text>
<text x="230" y="302" font-size="13">Branches bear</text>
<text x="230" y="319" font-size="13">scattered, flattened</text>
<text x="230" y="336" font-size="14" font-weight="bold">hooked prickles</text>
<!-- 2 Periploca -->
<text x="381" y="92" font-size="18" font-weight="bold" fill="#c33">② Xiangjiapi</text>
<text x="381" y="112" font-size="12" fill="#555">Root bark of Chinese silk vine · <tspan font-style="italic">Periploca sepium</tspan></text>
