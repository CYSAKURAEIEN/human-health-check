<text x="566" y="452" font-size="14" font-weight="bold">Soft, loose cork</text>
<text x="566" y="476" font-size="14">often flakes off</text>
<text x="566" y="494" font-size="14" font-weight="bold">in scales</text>
<!-- aroma -->
<g stroke="#c33" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M420 528 C412 520 428 514 420 506"/>
<path d="M450 532 C442 522 458 516 450 506"/>
