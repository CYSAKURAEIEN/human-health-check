</g>
<rect x="377" y="546" width="321" height="86" rx="6" fill="#fdecec" stroke="#c33" stroke-width="1"/>
<text x="537" y="580" font-size="16" text-anchor="middle" fill="#c33">Smell: <tspan font-weight="bold">strong, peculiar fragrance</tspan></text>
<text x="537" y="606" font-size="14" text-anchor="middle">(some describe it as like wintergreen oil)</text>

<!-- bottom -->
<rect x="10" y="656" width="700" height="246" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="686" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">A "Wujiapi" or "Digupi" with a strong, peculiar fragrance</text>
<text x="360" y="708" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">is very likely Xiangjiapi — do not use it</text>
<text x="360" y="736" font-size="14" text-anchor="middle">Wujiapi is only faintly fragrant and Digupi has little smell;</text>
<text x="360" y="755" font-size="14" text-anchor="middle">an upright shrub with prickles ≠ a twining vine with white milky sap</text>
<text x="360" y="782" font-size="14" text-anchor="middle">Poisoning: nausea and vomiting, seeing things tinged yellow or green,</text>
<text x="360" y="801" font-size="14" text-anchor="middle"><tspan font-weight="bold">a very slow heartbeat or heart rhythm problems</tspan>, in severe cases cardiac arrest</text>
<text x="360" y="822" font-size="13" fill="#555" text-anchor="middle">The risk is higher in people taking digoxin or other heart-strengthening medicines</text>
<text x="360" y="850" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">❌ Do not buy "Wujiapi" yourself to steep in medicinal liquor;</text>
<text x="360" y="869" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">if you cannot identify it for certain, do not pick it or use it</text>
<text x="360" y="892" font-size="13" fill="#555" text-anchor="middle">Whether to use it, and how much, is for a TCM practitioner to decide</text>
</g>
</g>
</svg>
