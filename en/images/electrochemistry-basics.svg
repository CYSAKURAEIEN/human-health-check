<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 812" width="720" height="812" role="img" aria-label="Electrochemistry: electrode potentials, cells, electrolysis and corrosion protection. Oxidation is losing electrons and reduction is gaining electrons; the two always happen together. 1 Standard electrode potentials (V): lithium -3.04, potassium -2.93, sodium -2.71, magnesium -2.37, aluminium -1.66, zinc -0.76, iron -0.44, tin -0.14, lead -0.13, hydrogen 0, copper +0.34, silver +0.80, gold +1.50; the farther apart two metals are in the table, the higher the voltage of the cell they make. 2 Zinc-copper cell (Daniell cell): zinc is the negative electrode and is oxidised, Zn → Zn²⁺; copper is the positive electrode, where copper ions are reduced, Cu²⁺ → Cu; electrons flow from zinc to copper through the wire; the cell voltage is about the positive electrode potential minus the negative electrode potential = 0.34 - (-0.76) = 1.10 V. 3 Electrolytic refining of copper: an external current drives a reaction that would not happen by itself; crude copper is the anode and pure copper the cathode, giving high-purity copper. Mass deposited = (charge ÷ F) × (molar mass ÷ charge of the ion), F about 96485 C/mol; example: copper plating at 1 A for 1 hour, charge 3600 C, about 0.0373 mol of electrons, copper is divalent, 0.0187 mol of copper, about 1.2 g of copper. 4 Corrosion and protection: rusting of steel is electrochemical corrosion; many tiny galvanic cells form at different spots on the iron surface; corrosion is faster with salt water or when two metals touch; sacrificial anode protection: connect a block of more reactive zinc or magnesium to a ship hull, water pipe or boiler so that the zinc or magnesium corrodes first and protects the steel; replace it regularly. This chapter explains principles; it is not a guide for experiments or production" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Electrochemistry: electrode potentials, cells, electrolysis and corrosion</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Electrochemistry: potentials, cells, electrolysis, corrosion</text>
<text x="360" y="50" font-size="13" fill="#555" text-anchor="middle">Oxidation = losing electrons; reduction = gaining electrons; the two always happen together</text>
<text x="360" y="67" font-size="13" fill="#555" text-anchor="middle">This chapter explains principles; it is not a guide for experiments or production</text>
<g transform="translate(0,16)">

<!-- 1 electrode potentials -->
<rect x="8" y="64" width="262" height="510" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="88" font-size="15" font-weight="bold">① Standard potentials (V)</text>
<rect x="40" y="238" width="174" height="22" rx="3" fill="#e3eefa"/>
<rect x="40" y="378" width="174" height="22" rx="3" fill="#fbe9e9"/>
<rect x="40" y="350" width="174" height="22" rx="3" fill="none" stroke="#999" stroke-dasharray="3 3"/>
<path d="M26,450 V108" stroke="#555" stroke-width="1.8" marker-end="url(#arK)"/>
<text x="20" y="250" font-size="12" fill="#555" transform="rotate(-90 20 250)" text-anchor="middle">further up = more reactive, loses electrons more easily</text>
<g font-size="13">
<text x="48" y="116">Lithium Li⁺/Li</text><text x="206" y="116" text-anchor="end">-3.04</text>
<text x="48" y="144">Potassium K⁺/K</text><text x="206" y="144" text-anchor="end">-2.93</text>
<text x="48" y="172">Sodium Na⁺/Na</text><text x="206" y="172" text-anchor="end">-2.71</text>
<text x="48" y="200">Magnesium Mg²⁺/Mg</text><text x="206" y="200" text-anchor="end">-2.37</text>
<text x="48" y="228">Aluminium Al³⁺/Al</text><text x="206" y="228" text-anchor="end">-1.66</text>
<text x="48" y="254" font-weight="bold" fill="#0b5cad">Zinc Zn²⁺/Zn</text><text x="206" y="254" text-anchor="end" font-weight="bold" fill="#0b5cad">-0.76</text>
<text x="48" y="284">Iron Fe²⁺/Fe</text><text x="206" y="284" text-anchor="end">-0.44</text>
<text x="48" y="312">Tin Sn²⁺/Sn</text><text x="206" y="312" text-anchor="end">-0.14</text>
<text x="48" y="340">Lead Pb²⁺/Pb</text><text x="206" y="340" text-anchor="end">-0.13</text>
<text x="48" y="366">Hydrogen H⁺/H₂</text><text x="206" y="366" text-anchor="end">0</text>
<text x="48" y="394" font-weight="bold" fill="#c33">Copper Cu²⁺/Cu</text><text x="206" y="394" text-anchor="end" font-weight="bold" fill="#c33">+0.34</text>
<text x="48" y="424">Silver Ag⁺/Ag</text><text x="206" y="424" text-anchor="end">+0.80</text>
<text x="48" y="452">Gold Au³⁺/Au</text><text x="206" y="452" text-anchor="end">+1.50</text>
</g>
<path d="M218,249 H226 V389 H218" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="232" y="314" font-size="13" font-weight="bold">1.10</text>
<text x="240" y="330" font-size="13" font-weight="bold">V</text>
<g font-size="12" fill="#333">
<text x="18" y="482">The farther apart two metals</text>
<text x="18" y="500">are in the table, the higher</text>
<text x="18" y="518">the voltage of the cell they make</text>
</g>

<!-- 2 zinc-copper cell -->
<rect x="278" y="64" width="434" height="272" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="288" y="88" font-size="15" font-weight="bold">② Zinc-copper cell (Daniell cell)</text>
<g transform="translate(0,12)">
<!-- wire and voltmeter -->
<path d="M332,138 V110 H392 M424,110 H484 V138" fill="none" stroke="#333" stroke-width="2"/>
<circle cx="408" cy="110" r="16" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="408" y="115" font-size="14" font-weight="bold" text-anchor="middle">V</text>
<text x="408" y="140" font-size="13" font-weight="bold" fill="#c33" text-anchor="middle">1.10 V</text>
<path d="M342,102 H380" stroke="#0b5cad" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="361" y="95" font-size="12" fill="#0b5cad" text-anchor="middle">electrons</text>
<!-- vessel -->
<path d="M300,160 V280 H516 V160" fill="none" stroke="#333" stroke-width="2.5"/>
<rect x="302" y="172" width="212" height="106" fill="#e8f2fb"/>
<path d="M408,166 V278" stroke="#777" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="324" y="138" width="16" height="122" fill="#b8bcc4" stroke="#333" stroke-width="1.8"/>
<rect x="476" y="138" width="16" height="122" fill="#d9884a" stroke="#333" stroke-width="1.8"/>
<g font-size="12" fill="#0b5cad"><text x="366" y="224" text-anchor="middle">Zn²⁺</text><text x="446" y="224" text-anchor="middle">Cu²⁺</text></g>
<path d="M342,232 Q352,244 362,240" fill="none" stroke="#0b5cad" stroke-width="1.5" marker-end="url(#arB)"/>
<path d="M454,240 Q466,244 472,232" fill="none" stroke="#c33" stroke-width="1.5" marker-end="url(#arR)"/>
<g font-size="13" text-anchor="middle">
<text x="344" y="300" font-weight="bold" fill="#0b5cad">Zinc: negative</text>
<text x="344" y="318">oxidised, Zn → Zn²⁺</text>
<text x="484" y="300" font-weight="bold" fill="#c33">Copper: positive</text>
<text x="484" y="318">Cu²⁺ reduced → Cu</text>
</g>
<g font-size="13">
<text x="530" y="176">Zn + Cu²⁺ → Zn²⁺ + Cu</text>
<text x="530" y="210" font-weight="bold">Cell voltage ≈</text>
<text x="530" y="230">E(positive) - E(negative)</text>
<text x="530" y="252">= 0.34 - (-0.76)</text>
<text x="530" y="276" font-size="15" font-weight="bold" fill="#c33">= 1.10 V</text>
</g>

</g>
<!-- 3 electrolysis -->
<rect x="278" y="344" width="434" height="230" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="288" y="368" font-size="15" font-weight="bold">③ Electrolysis: a current drives the reaction</text>
<g transform="translate(0,14)">
<!-- power supply -->
<path d="M324,418 V388 H372 M380,388 H436 V418" fill="none" stroke="#333" stroke-width="2"/>
<path d="M372,376 V400 M380,382 V394" stroke="#333" stroke-width="2.5"/>
<text x="366" y="382" font-size="13" font-weight="bold" fill="#c33" text-anchor="end">+</text>
<text x="386" y="383" font-size="14" font-weight="bold" fill="#0b5cad">−</text>
<text x="380" y="414" font-size="12" text-anchor="middle" fill="#555">DC supply</text>
<path d="M300,430 V520 H460 V430" fill="none" stroke="#333" stroke-width="2.5"/>
<rect x="302" y="440" width="156" height="78" fill="#e8f2fb"/>
<rect x="316" y="418" width="18" height="90" fill="#b07040" stroke="#333" stroke-width="1.8"/>
<rect x="430" y="418" width="12" height="90" fill="#e08a4a" stroke="#333" stroke-width="1.8"/>
<path d="M342,472 H418" stroke="#c33" stroke-width="1.8" marker-end="url(#arR)"/>
<text x="380" y="466" font-size="12" fill="#c33" text-anchor="middle">Cu²⁺</text>
<text x="325" y="534" font-size="12" font-weight="bold" text-anchor="middle">crude copper</text>
<text x="325" y="549" font-size="12" font-weight="bold" text-anchor="middle">(anode +)</text>
<text x="426" y="534" font-size="12" font-weight="bold" text-anchor="middle">pure copper</text>
<text x="426" y="549" font-size="12" font-weight="bold" text-anchor="middle">(cathode −)</text>
<g font-size="12">
<text x="472" y="396" font-weight="bold">Refining: crude copper as anode,</text>
<text x="472" y="411" font-weight="bold">pure copper as cathode</text>
<text x="472" y="426" font-weight="bold">→ high-purity copper</text>
<text x="472" y="444">Mass deposited = (charge ÷ F)</text>
<text x="484" y="459">× (molar mass ÷ ionic charge)</text>
<text x="472" y="474">F ≈ 96485 C/mol</text>
<text x="472" y="492" fill="#0b5cad" font-weight="bold">e.g. copper plating, 1 A, 1 hour</text>
<text x="472" y="507" fill="#0b5cad">3600 C → about 0.0373 mol e⁻</text>
<text x="472" y="522" fill="#0b5cad">→ 0.0187 mol Cu × 64 ≈ 1.2 g</text>
</g>

</g>
<g transform="translate(0,38)">
<!-- 4 corrosion and protection -->
<rect x="8" y="544" width="704" height="204" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="568" font-size="15" font-weight="bold">④ Corrosion and protection: sacrificial anode</text>
<!-- steel pipe -->
<rect x="30" y="612" width="300" height="30" fill="#9aa3ad" stroke="#333" stroke-width="2"/>
<path d="M30,620 H330" stroke="#c8ced5" stroke-width="3"/>
<rect x="150" y="642" width="60" height="26" rx="2" fill="#c7cbd1" stroke="#333" stroke-width="2"/>
<path d="M156,668 l4,-6 l4,6 M176,668 l5,-8 l4,8 M196,668 l4,-5 l4,5" fill="none" stroke="#777" stroke-width="1.2"/>
<path d="M160,642 V636 M200,642 V636" stroke="#333" stroke-width="2.5"/>
<text x="30" y="604" font-size="13" font-weight="bold" fill="#0b5cad">Steel (hull, water pipe, boiler): protected</text>
<path d="M216,662 H262" stroke="#c33" stroke-width="1.5" marker-start="url(#arR)"/>
<text x="268" y="658" font-size="13" font-weight="bold" fill="#c33">zinc or magnesium</text>
<text x="268" y="674" font-size="13" font-weight="bold" fill="#c33">block</text>
<text x="268" y="692" font-size="12" fill="#c33">corrodes first;</text>
<text x="268" y="707" font-size="12" fill="#c33">replace it regularly</text>
<text x="30" y="722" font-size="12" fill="#555">Zinc and magnesium are more reactive than iron</text>
<text x="30" y="737" font-size="12" fill="#555">(higher up in ①)</text>
<g font-size="13">
<text x="412" y="600" font-weight="bold">Rust is electrochemical corrosion:</text>
<text x="412" y="618">many tiny galvanic cells form at</text>
<text x="412" y="636">different spots on the iron surface</text>
<text x="412" y="658" font-weight="bold" fill="#c33">Salt water, or two metals touching,</text>
<text x="412" y="676" font-weight="bold" fill="#c33">make it corrode faster</text>
<text x="412" y="698">Connect a block of more reactive zinc</text>
<text x="412" y="716">or magnesium: it corrodes first and</text>
<text x="412" y="734">protects the steel</text>
</g>
</g>
</g>
</g>
</svg>
