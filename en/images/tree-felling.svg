<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="Felling a tree: 1 on the side you want the tree to fall, cut a notch (a wedge-shaped cut) about 1/4-1/3 of the trunk diameter deep; from the opposite side, slightly higher than the bottom of the notch, saw or chop towards the notch; leave a strip of uncut hinge wood in the middle so the tree falls in the planned direction; do not cut through the hinge, or the tree will go out of control. 2 From above: clear one escape route on each side, at about 45° behind the planned direction of fall; do not retreat straight backwards (when the trunk hits the ground the butt may kick back); everyone else stands at least two tree lengths away; no people, buildings or power lines in the direction of fall, and it will not hang up in another tree; clear shrubs and climbers from around the tree. 3 Before felling, look at which way the tree leans, which side has heavier branches, whether dead branches are hanging in it (widow-makers), and whether the trunk is rotten or hollow. 4 When the tree starts to fall, shout a warning, leave at once along the escape route and watch the crown as you go. 5 A tree that hangs up in another tree as it falls (a hung-up tree) is the most dangerous: do not climb it, do not cut the tree holding it up, do not walk underneath it; pull it down from the side and from a distance with ropes or levers, or get an experienced person to deal with it. Fell trees only under the guidance of an experienced person; beginners should not fell trees more than about 20 cm in diameter alone; do not fell in strong wind, rain or snow, or in the dark" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Felling a tree: notch, hinge wood and escape routes</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2a8a3a"/></marker>
<marker id="tkB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0 V10" stroke="#0b5cad" stroke-width="1.5"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<pattern id="hinge" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#ffe08a"/><path d="M0 0 V5" stroke="#c33" stroke-width="1.4"/></pattern>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" text-anchor="middle" font-weight="bold">Felling: plan the fall and escape routes, notch on the falling side, leave a hinge</text>

<!-- 1 notch and back cut -->
<rect x="10" y="44" width="290" height="400" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="20" y="68" font-size="15" font-weight="bold">① Notch and back cut (side)</text>
<path d="M100,330 V92 q12.5,-8 25,0 t25,0 t25,0 t25,0 V226 L170,264 H200 V330 Z" fill="#f1dcb5" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M118,96 V244 M186,96 V220 M118,272 V326 M186,272 V326" stroke="#c9a66b" stroke-width="1"/>
<path d="M20,330 H290" stroke="#999" stroke-width="2.5"/>
<rect x="158" y="250" width="12" height="14" fill="url(#hinge)" stroke="#c33" stroke-width="1"/>
<path d="M100,250 H158" stroke="#333" stroke-width="3"/>
<path d="M24,250 H86" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="18" y="206" font-size="14" font-weight="bold">Back cut</text>
<text x="18" y="224" font-size="13">from the</text>
<text x="18" y="240" font-size="13">other side</text>
<path d="M86,264 H170" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M94,250 V264" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="18" y="282" font-size="13" fill="#0b5cad">slightly</text>
<text x="18" y="297" font-size="13" fill="#0b5cad">above the</text>
<text x="18" y="312" font-size="13" fill="#0b5cad">notch floor</text>
<text x="108" y="176" font-size="14" font-weight="bold" fill="#c33">hinge wood</text>
<text x="108" y="193" font-size="13" fill="#c33">do not cut it</text>
<line x1="140" y1="199" x2="163" y2="248" stroke="#0b5cad" stroke-width="1.3"/><circle cx="163" cy="248" r="2.4" fill="#0b5cad"/>
<text x="206" y="206" font-size="14" font-weight="bold" fill="#c33">notch</text>
<text x="206" y="222" font-size="13">(wedge cut)</text>
<path d="M172,276 H198" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="206" y="274" font-size="13" fill="#0b5cad">depth</text>
<text x="206" y="289" font-size="13" fill="#0b5cad">1/4-1/3 of</text>
<text x="206" y="304" font-size="13" fill="#0b5cad">diameter</text>
<path d="M100,318 H200" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="150" y="312" font-size="12.5" fill="#0b5cad" text-anchor="middle">trunk diameter</text>
<path d="M210,118 Q262,124 274,180" fill="none" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
<text x="236" y="110" font-size="15" font-weight="bold" fill="#c33">fall</text>
<g font-size="13">
<text x="20" y="356">Notch on the side it is to fall, about</text>
<text x="20" y="371">1/4-1/3 of the diameter deep</text>
<text x="20" y="389">Back cut from the opposite side,</text>
<text x="20" y="404">slightly above the notch floor</text>
<text x="20" y="422" fill="#c33">✗ Do not cut through the hinge, or</text>
<text x="34" y="438" fill="#c33">the tree goes out of control</text>
</g>

<!-- 2 from above -->
<rect x="310" y="44" width="400" height="400" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="320" y="68" font-size="15" font-weight="bold">② Fall, escape routes, danger zone (above)</text>
<circle cx="510" cy="210" r="120" fill="#fdf0f0" stroke="#c33" stroke-width="2" stroke-dasharray="7 4"/>
<text x="586" y="92" font-size="13" fill="#c33" font-weight="bold">others beyond</text>
<text x="586" y="109" font-size="13" fill="#c33" font-weight="bold">2 tree lengths</text>
<path d="M510,202 V176" stroke="#8b6b3e" stroke-width="7" stroke-dasharray="5 3"/>
<ellipse cx="510" cy="163" rx="17" ry="13" fill="#e4eedb" stroke="#555" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="510" cy="210" r="8" fill="#c8a06a" stroke="#333" stroke-width="2"/>
<path d="M486,198 V150" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
<text x="480" y="178" font-size="14" font-weight="bold" fill="#c33" text-anchor="end">fall</text>
<path d="M534,210 V150" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="540" y="174" font-size="13" fill="#0b5cad">tree length</text>
<path d="M518,210 H630" stroke="#0b5cad" stroke-width="1.3" marker-end="url(#tkB)"/>
<text x="580" y="228" font-size="12.5" fill="#0b5cad" text-anchor="middle">2 × tree length</text>
<path d="M510,220 V306" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M500,300 L520,320 M520,300 L500,320" stroke="#c33" stroke-width="3"/>
<path d="M510,250 A40,40 0 0,1 481.7,238.3" fill="none" stroke="#0b5cad" stroke-width="1.3"/>
<text x="490" y="270" font-size="12" fill="#0b5cad" text-anchor="middle">45°</text>
<path d="M503,217 L428,292" stroke="#2a8a3a" stroke-width="3.5" marker-end="url(#arG)"/>
<path d="M517,217 L592,292" stroke="#2a8a3a" stroke-width="3.5" marker-end="url(#arG)"/>
<text x="318" y="306" font-size="14" font-weight="bold" fill="#2a8a3a">escape route</text>
<text x="318" y="323" font-size="13" fill="#2a8a3a">about 45° behind</text>
<text x="604" y="306" font-size="14" font-weight="bold" fill="#2a8a3a">escape route</text>
<text x="604" y="323" font-size="13" fill="#2a8a3a">one each side</text>
<text x="510" y="352" font-size="13" fill="#c33" text-anchor="middle">✗ Not straight back: the butt may kick back</text>
<g font-size="13">
<text x="320" y="380">No people, buildings or power lines in the line of</text>
<text x="320" y="396">fall, and it must not hang up in another tree;</text>
<text x="320" y="412">clear shrubs and climbers from around the tree;</text>
<text x="320" y="428">clear one escape route on each side</text>
</g>

<!-- 3 check the tree first -->
<g transform="translate(10,454)">
<rect x="0" y="0" width="228" height="290" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">③ Check the tree</text>
<path d="M10,180 H218" stroke="#999" stroke-width="2.5"/>
<path d="M106,180 V60" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M98,180 L126,180 L142,82 L128,80 Z" fill="#c8a06a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="152" cy="72" rx="58" ry="36" fill="#dbe8cf" stroke="#333" stroke-width="2"/>
<ellipse cx="114" cy="150" rx="5" ry="16" fill="#5a4630" stroke="#333" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M102,74 L98,82 L104,86 L96,94 L82,130" fill="none" stroke="#777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M92,104 L78,106 M88,114 L96,124" stroke="#777" stroke-width="2.5" stroke-linecap="round"/>
<path d="M160,54 L200,40" stroke="#0b5cad" stroke-width="1.3" marker-end="url(#arB)"/>
<text x="196" y="30" font-size="12" fill="#0b5cad" text-anchor="end">lean</text>
<text x="12" y="116" font-size="13" font-weight="bold" fill="#c33">widow-</text>
<text x="12" y="131" font-size="13" font-weight="bold" fill="#c33">maker</text>
<line x1="62" y1="122" x2="84" y2="120" stroke="#0b5cad" stroke-width="1.3"/><circle cx="84" cy="120" r="2.4" fill="#0b5cad"/>
<text x="150" y="146" font-size="13" fill="#555">rotten,</text>
<text x="150" y="161" font-size="13" fill="#555">hollow?</text>
<line x1="146" y1="144" x2="118" y2="150" stroke="#0b5cad" stroke-width="1.3"/><circle cx="118" cy="150" r="2.4" fill="#0b5cad"/>
<g font-size="13">
<text x="10" y="204">Which way it leans, which side</text>
<text x="10" y="219">has heavier branches; dead</text>
<text x="10" y="234">branches hanging in it (widow-</text>
<text x="10" y="249">makers); rotten or hollow trunk</text>
<text x="10" y="267" fill="#c33">Leaning or dead trees, or with</text>
<text x="10" y="282" fill="#c33">broken branches: ask an expert</text>
</g>
</g>

<!-- 4 starting to fall -->
<g transform="translate(246,454)">
<rect x="0" y="0" width="228" height="290" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">④ As it starts to fall</text>
<path d="M10,180 H218" stroke="#999" stroke-width="2.5"/>
<path d="M120,180 L136,180 L172,104 L160,98 Z" fill="#c8a06a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="174" cy="80" rx="16" ry="30" transform="rotate(28 174 80)" fill="#dbe8cf" stroke="#333" stroke-width="2"/>
<path d="M192,38 Q220,62 214,120" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<circle cx="74" cy="104" r="10" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<circle cx="79" cy="102" r="1.6" fill="#333"/>
<path d="M72,114 L66,148 M66,148 L54,178 M66,148 L80,176 M70,124 L52,140 M70,124 L86,136" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M84,100 L162,74" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="100" y="62" font-size="12" fill="#0b5cad">watch</text>
<text x="100" y="76" font-size="12" fill="#0b5cad">crown</text>
<path d="M44,164 H14" stroke="#2a8a3a" stroke-width="3.5" marker-end="url(#arG)"/>
<text x="12" y="156" font-size="12" fill="#2a8a3a" font-weight="bold">escape</text>
<rect x="18" y="44" width="72" height="26" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<path d="M58,70 L66,88 L68,70" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<path d="M59,69.5 H67" stroke="#fdf3f3" stroke-width="2"/>
<text x="54" y="62" font-size="13" font-weight="bold" fill="#c33" text-anchor="middle">Shout!</text>
<g font-size="13">
<text x="10" y="206">When it starts to fall, shout a</text>
<text x="10" y="222">warning, leave at once along</text>
<text x="10" y="238">your escape route, and watch</text>
<text x="10" y="254">the crown as you go</text>
</g>
</g>

<!-- 5 hung-up tree -->
<g transform="translate(482,454)">
<rect x="0" y="0" width="228" height="290" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">⑤ Hung-up tree</text>
<text x="10" y="42" font-size="13" font-weight="bold" fill="#c33">most dangerous</text>
<path d="M10,180 H218" stroke="#999" stroke-width="2.5"/>
<path d="M170,180 V70" stroke="#333" stroke-width="18"/>
<path d="M170,180 V70" stroke="#c8a06a" stroke-width="14"/>
<ellipse cx="172" cy="62" rx="44" ry="28" fill="#dbe8cf" stroke="#333" stroke-width="2"/>
<path d="M30,176 L40,182 L160,82 L152,74 Z" fill="#c8a06a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="160" cy="70" rx="20" ry="13" transform="rotate(-40 160 70)" fill="#c9dbb8" stroke="#333" stroke-width="1.5"/>
<path d="M162,140 L178,156 M178,140 L162,156" stroke="#c33" stroke-width="3"/>
<text x="184" y="144" font-size="12" fill="#c33" font-weight="bold">don't</text>
<text x="184" y="158" font-size="12" fill="#c33" font-weight="bold">cut</text>
<circle cx="98" cy="146" r="7" fill="#f3e3d3" stroke="#333" stroke-width="1.8"/>
<path d="M98,153 V166 M98,166 L92,180 M98,166 L104,180 M98,158 L90,166 M98,158 L106,166" fill="none" stroke="#333" stroke-width="2.4" stroke-linecap="round"/>
<circle cx="98" cy="160" r="20" fill="none" stroke="#c33" stroke-width="2.5"/>
<path d="M84,146 L112,174" stroke="#c33" stroke-width="2.5"/>
<g font-size="13">
<text x="10" y="204" fill="#c33">✗ Do not climb it</text>
<text x="10" y="220" fill="#c33">✗ Do not cut the tree holding it</text>
<text x="10" y="236" fill="#c33">✗ Do not walk underneath it</text>
<text x="10" y="254" fill="#2a8a3a">✓ Pull it down with ropes or levers</text>
<text x="10" y="269" fill="#2a8a3a">from the side and from a distance,</text>
<text x="10" y="284" fill="#2a8a3a">or get an experienced person</text>
</g>
</g>

<!-- safety -->
<rect x="10" y="754" width="700" height="136" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="780" font-size="16" font-weight="bold">Safety</text>
<path d="M26,794 l14,14 M40,794 l-14,14" stroke="#c33" stroke-width="3"/>
<text x="52" y="807" font-size="14"><tspan font-weight="bold">Fell trees only under the guidance of an experienced person;</tspan></text>
<text x="52" y="825" font-size="14">beginners should not fell trees over about 20 cm in diameter alone</text>
<path d="M26,836 l14,14 M40,836 l-14,14" stroke="#c33" stroke-width="3"/>
<text x="52" y="849" font-size="14">Do not fell in strong wind, rain or snow, or in the dark</text>
<path d="M26,866 l6,7 l11,-13" fill="none" stroke="#2a8a3a" stroke-width="3"/>
<text x="52" y="875" font-size="14">Work with a partner; take a first-aid kit into the woods</text>
</g>
</svg>
