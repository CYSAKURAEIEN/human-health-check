<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" width="720" height="836" role="img" aria-label="Measuring latitude. Polaris method: in the northern hemisphere the altitude of Polaris is about equal to the local latitude, with an error of less than 1°; for example, if Polaris is 40° above the horizon you are at about 40°N (near Beijing). Measure the altitude with a quadrant: a quarter-circle wooden board with the curved edge marked 0°-90°, two small holes on one straight edge as a sight, and a thin thread with a small weight hung from the centre as a plumb line; aim the sight at the star and the plumb line's reading on the arc is the altitude, accurate to about 0.5-1°. Noon sun method: measure the altitude h of the sun at noon, when it is highest, look up or calculate the sun's declination δ for that day; in the northern hemisphere with the sun to the south, latitude equals 90° minus h plus δ; at the equinoxes δ is about 0°, at the summer solstice about +23.44°, at the winter solstice about -23.44°; for example, on 21 June with the noon sun at 80°, latitude is about 33.4°, about 33°N. Do not look at the sun: when measuring the sun, let sunlight pass through the front hole so that the spot of light falls on the back hole" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Measuring latitude: the Polaris method and the noon sun method</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="17" font-weight="bold" text-anchor="middle">Latitude: altitude of Polaris ≈ local latitude (northern hemisphere)</text>

<!-- 1 Polaris method -->
<rect x="10" y="44" width="700" height="410" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① Polaris method: use a quadrant</text>

<!-- line of sight -->
<path d="M70,356.7 L396.4,82.9" stroke="#c33" stroke-width="1.6" stroke-dasharray="7 4"/>
<!-- Polaris -->
<circle cx="396.4" cy="82.9" r="11" fill="none" stroke="#c33" stroke-width="2"/>
<circle cx="396.4" cy="82.9" r="5" fill="#333"/>
<text x="414" y="88" font-size="16" font-weight="bold" fill="#c33">Polaris</text>

<!-- quadrant -->
<path d="M220.2,230.7 L90,340 A170,170 0 0 0 329.5,360.9 Z" fill="#ead7b2" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M329.5,360.9 L320.5,350.2 M305.2,377.9 L300.7,370.1 M278.3,390.4 L275.3,382.0 M249.7,398.1 L247.3,384.3 M190.7,398.1 L192.2,389.3 M162.1,390.4 L166.8,377.3 M135.2,377.9 L139.7,370.1 M110.9,360.9 L116.7,354.0 M90.0,340.0 L100.7,331.0" stroke="#333" stroke-width="1.5"/>
<path d="M317.7,370.0 L314.3,365.0 M292.0,384.8 L289.5,379.3 M264.2,394.9 L262.6,389.1 M235.0,400.1 L234.5,394.1 M205.4,400.1 L205.9,394.1 M176.2,394.9 L177.8,389.1 M148.4,384.8 L150.9,379.3 M122.7,370.0 L126.1,365.0 M100.0,350.9 L104.2,346.7" stroke="#333" stroke-width="1"/>
<text x="311.5" y="344.5" font-size="13" text-anchor="middle">0°</text>
<text x="244.9" y="375.5" font-size="13" text-anchor="middle">30°</text>
<text x="171.6" y="369.1" font-size="13" text-anchor="middle">60°</text>
<text x="123" y="330" font-size="13" text-anchor="middle">90°</text>
<!-- sight holes -->
<path d="M103.7,337.6 L94.7,326.9 M215.5,243.8 L206.5,233.1" stroke="#333" stroke-width="5"/>
<circle cx="99.2" cy="332.3" r="1.8" fill="#fff"/>
<circle cx="211" cy="238.4" r="1.8" fill="#fff"/>
<text x="30" y="232" font-size="13" fill="#0b5cad">two sight holes</text>
<path d="M66,238 L94,321 M130,228 L203,233" stroke="#0b5cad" stroke-width="1"/>
<!-- plumb line -->
<path d="M220.2,230.7 V418" stroke="#333" stroke-width="1.3"/>
<path d="M220.2,418 l-6,4 l6,12 l6,-12 Z" fill="#555" stroke="#333" stroke-width="1.2"/>
<circle cx="220.2" cy="230.7" r="3" fill="#333"/>
<path d="M220.2,400.7 L220.2,384" stroke="#c33" stroke-width="3"/>
<text x="236" y="428" font-size="15" font-weight="bold" fill="#c33">reading 40°</text>
<text x="160" y="428" font-size="13" fill="#555" text-anchor="end">plumb line</text>
<text x="160" y="444" font-size="13" fill="#555" text-anchor="end">(thread + small weight)</text>
<path d="M162,442 L214,428" stroke="#555" stroke-width="1"/>
<!-- altitude -->
<path d="M220.2,230.7 H340" stroke="#0b5cad" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="344" y="235" font-size="13" fill="#0b5cad">horizontal</text>
<path d="M290.2,230.7 A70,70 0 0 0 273.8,185.7" fill="none" stroke="#c33" stroke-width="2"/>
<text x="296" y="216" font-size="15" font-weight="bold" fill="#c33">h = 40°</text>
<!-- eye -->
<path d="M56,356.7 Q70,346 84,356.7 Q70,367 56,356.7 Z" fill="#fff" stroke="#333" stroke-width="1.6"/>
<circle cx="70" cy="356.7" r="3.6" fill="#333"/>
<text x="58" y="384" font-size="13">eye</text>

<!-- notes -->
<text x="430" y="132" font-size="15" font-weight="bold">Quadrant (for use on land)</text>
<text x="430" y="156" font-size="14">· A quarter-circle wooden board,</text>
<text x="444" y="175" font-size="14">curved edge marked 0°-90°</text>
<text x="430" y="198" font-size="14">· Two small holes on one straight</text>
<text x="444" y="217" font-size="14">edge, or a thin tube (the sight)</text>
<text x="430" y="240" font-size="14">· Hang a thread from the centre</text>
<text x="444" y="259" font-size="14">with a small weight (plumb line)</text>
<text x="430" y="288" font-size="14" font-weight="bold">Aim the sight at Polaris; the</text>
<text x="430" y="307" font-size="14" font-weight="bold">plumb line's reading on the arc</text>
<text x="430" y="326" font-size="14" font-weight="bold">is the altitude</text>
<text x="430" y="347" font-size="13" fill="#555">Accuracy about 0.5-1°; bigger is better</text>
<rect x="424" y="362" width="276" height="80" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="436" y="385" font-size="14" font-weight="bold" fill="#0b5cad">Altitude of Polaris ≈ latitude</text>
<text x="436" y="406" font-size="13">(northern hemisphere, error under 1°)</text>
<text x="436" y="430" font-size="14">e.g. 40° → about 40°N (near Beijing)</text>

<!-- 2 noon sun method -->
<rect x="10" y="466" width="700" height="360" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="492" font-size="16" font-weight="bold">② Noon sun method (works on any day)</text>
<!-- horizon -->
<path d="M30,700 H330" stroke="#999" stroke-width="2.5"/>
<text x="330" y="722" font-size="14" font-weight="bold" text-anchor="end">due south →</text>
<!-- sun -->
<g stroke="#e0a020" stroke-width="2.5">
<path d="M204,526 v-12 M204,566 v12 M184,546 h-12 M224,546 h12 M190,532 l-8,-8 M218,532 l8,-8 M190,560 l-8,8 M218,560 l8,8"/>
</g>
<circle cx="204" cy="546" r="15" fill="#ffd34d" stroke="#c98a00" stroke-width="2"/>
<path d="M80,700 L193,559" stroke="#c33" stroke-width="1.6" stroke-dasharray="7 4"/>
<circle cx="80" cy="700" r="4" fill="#333"/>
<text x="80" y="722" font-size="13" text-anchor="middle">observer</text>
<path d="M140,700 A60,60 0 0 0 117.5,653.2" fill="none" stroke="#c33" stroke-width="2"/>
<text x="148" y="686" font-size="16" font-weight="bold" fill="#c33">h</text>
<text x="166" y="536" font-size="13" text-anchor="end">noon (sun at its highest):</text>
<text x="166" y="554" font-size="13" text-anchor="end">the sun is due south</text>
<text x="30" y="748" font-size="13">h: altitude of the sun at noon</text>
<text x="30" y="772" font-size="13" fill="#c33" font-weight="bold">⚠️ Do not look at the sun:</text>
<text x="30" y="791" font-size="13" fill="#c33">let sunlight pass through the front hole</text>
<text x="30" y="810" font-size="13" fill="#c33">onto the back hole; never look with your eye</text>

<!-- formula -->
<rect x="344" y="508" width="356" height="56" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="522" y="535" font-size="18" font-weight="bold" text-anchor="middle">Latitude = 90° − h + δ</text>
<text x="522" y="555" font-size="12" fill="#555" text-anchor="middle">(northern hemisphere, sun to the south; δ: declination)</text>
<text x="352" y="590" font-size="14" font-weight="bold">Sun's declination δ that day</text>
<g font-size="13">
<text x="352" y="612">Spring equinox (about 21 Mar)</text><text x="574" y="612">δ ≈ 0°</text>
<text x="352" y="632">Summer solstice (about 21 Jun)</text><text x="574" y="632">δ ≈ +23.44°</text>
<text x="352" y="652">Autumn equinox (about 23 Sep)</text><text x="574" y="652">δ ≈ 0°</text>
<text x="352" y="672">Winter solstice (about 22 Dec)</text><text x="574" y="672">δ ≈ −23.44°</text>
<text x="352" y="696" fill="#555">Other days: δ ≈ 23.44° × sin[360° × (N − 81) ÷ 365]</text>
<text x="352" y="714" fill="#555">N: day of the year (1 January = 1)</text>
</g>
<rect x="344" y="728" width="356" height="86" rx="6" fill="none" stroke="#bbb" stroke-width="1.2"/>
<text x="356" y="750" font-size="14" font-weight="bold">e.g. 21 June at noon, sun altitude 80°</text>
<text x="356" y="772" font-size="14">Latitude = 90 − 80 + 23.44 ≈ 33.4°</text>
<text x="356" y="794" font-size="14">→ about 33°N</text>
<text x="694" y="808" font-size="12" fill="#888" text-anchor="end">sun altitude not to scale</text>
</g>
</svg>
