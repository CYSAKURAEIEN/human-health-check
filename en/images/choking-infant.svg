<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 612" width="800" height="612" role="img" aria-label="First aid for a choking baby under 1 year: (1) the rescuer sits down, lays the baby face down along the forearm with the head lower than the body, supports the jaw, and gives 5 back blows between the shoulder blades with the heel of the hand; (2) turn the baby face up, head still lower than the body, place the heel of one hand on the breastbone just below the nipple line and press down sharply about 4 cm, 5 times; alternate the two, and do not use abdominal thrusts" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Choking baby: back blows and chest thrusts</title>
<text x="400" y="28" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">Babies under 1 year: conscious, airway completely blocked</text>
<text x="400" y="48" font-size="14" fill="#222" text-anchor="middle">(cannot cry out loud, cannot cough)</text>
<g transform="translate(0 20)">
<rect x="8" y="42" width="384" height="444" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="408" y="42" width="384" height="444" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<line x1="20" y1="386.2" x2="380" y2="386.2" stroke="#999" stroke-width="2"/>
<line x1="420" y1="386.2" x2="780" y2="386.2" stroke="#999" stroke-width="2"/>
<g transform="translate(-77.5 -45) scale(1.25)"><path d="M72 176 L78 288 L140 288 M84 288 L84 345 M134 288 L134 345" fill="none" stroke="#999" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M196 276 L204 341" fill="none" stroke="#333" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 276 L204 341" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 341 L217 342" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 341 L217 342" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 266 L196 274" fill="none" stroke="#333" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 266 L196 274" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 264 L112 182" fill="none" stroke="#333" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 264 L112 182" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><circle cx="124" cy="156" r="18" fill="#f3e3d3" stroke="#333" stroke-width="2"/><path d="M112 188 L150 246 L254 276" fill="none" stroke="#333" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 188 L150 246 L254 276" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 228 L230 244" fill="none" stroke="#333" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 228 L230 244" fill="none" stroke="#f8e7a8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 234 L168 252 L173 268" fill="none" stroke="#333" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 234 L168 252 L173 268" fill="none" stroke="#f8e7a8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="251" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2"/><circle cx="252" cy="266" r="3" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/><path d="M226 248 L233 267" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 248 L233 267" fill="none" stroke="#f3e3d3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="259" cy="269" rx="12" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2" transform="rotate(18 259 269)"/><path d="M114 186 L170 172 L208 206" fill="none" stroke="#333" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 186 L170 172 L208 206" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="214" cy="212" rx="10" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2" transform="rotate(30 214 212)"/><line x1="196" y1="166" x2="214.6" y2="194.6" stroke="#c33" stroke-width="3" stroke-linecap="round"/><path d="M220 203 L219.2 191.6 L209.9 197.6Z" fill="#c33"/><path d="M232 219 L243 216 M229 228 L239 233" fill="none" stroke="#c33" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="226" y="64" font-size="15" fill="#222">Heel of hand: strike</text>
<text x="226" y="82" font-size="15" fill="#222">between the</text>
<text x="226" y="100" font-size="15" fill="#222">shoulder blades</text>
<line x1="250" y1="106" x2="200" y2="235" stroke="#0b5cad" stroke-width="1.3"/><circle cx="200" cy="235" r="2.6" fill="#0b5cad"/>
<text x="268" y="226" font-size="15" fill="#222">Head lower</text>
<text x="268" y="245" font-size="15" fill="#222">than the body</text>
<line x1="272" y1="250" x2="245" y2="260" stroke="#0b5cad" stroke-width="1.3"/><circle cx="245" cy="260" r="2.6" fill="#0b5cad"/>
<text x="246" y="332" font-size="14" fill="#222">Hold the jaw on both</text>
<text x="246" y="349" font-size="14" fill="#222">sides; don't press</text>
<text x="246" y="366" font-size="14" fill="#222">on the throat</text>
<line x1="266" y1="320" x2="250" y2="297.5" stroke="#0b5cad" stroke-width="1.3"/><circle cx="250" cy="297.5" r="2.6" fill="#0b5cad"/>
<text x="200" y="410" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">① Face down on the forearm: 5 back blows</text>
<text x="200" y="432" font-size="14" fill="#222" text-anchor="middle">Sit down and rest your forearm on your thigh;</text>
<text x="200" y="450" font-size="14" fill="#222" text-anchor="middle">strike firmly with the heel of the hand towards</text>
<text x="200" y="468" font-size="14" fill="#222" text-anchor="middle">the head (forwards and downwards)</text>
<g transform="translate(40 0)">
<g transform="translate(282.5 -45) scale(1.25)"><path d="M72 176 L78 288 L140 288 M84 288 L84 345 M134 288 L134 345" fill="none" stroke="#999" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M196 276 L204 341" fill="none" stroke="#333" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/><path d="M196 276 L204 341" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 341 L217 342" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 341 L217 342" fill="none" stroke="#555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 266 L196 274" fill="none" stroke="#333" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 266 L196 274" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 264 L112 182" fill="none" stroke="#333" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><path d="M100 264 L112 182" fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><circle cx="124" cy="156" r="18" fill="#f3e3d3" stroke="#333" stroke-width="2"/><path d="M112 188 L150 246 L254 276" fill="none" stroke="#333" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M112 188 L150 246 L254 276" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 228 L230 244" fill="none" stroke="#333" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/><path d="M181 228 L230 244" fill="none" stroke="#f8e7a8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 226 L170 206 L156 214" fill="none" stroke="#333" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 226 L170 206 L156 214" fill="none" stroke="#f8e7a8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="251" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2"/><circle cx="247" cy="236" r="3" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/><ellipse cx="262" cy="266" rx="12" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2" transform="rotate(25 262 266)"/><path d="M114 186 L166 170 L208 211" fill="none" stroke="#333" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M114 186 L166 170 L208 211" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="214" cy="219" rx="10" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2" transform="rotate(18 214 219)"/><line x1="240" y1="140" x2="225.5" y2="196.3" stroke="#c33" stroke-width="3" stroke-linecap="round"/><path d="M223 206 L230.8 197.7 L220.2 194.9Z" fill="#c33"/></g>
<text x="500" y="66" font-size="15" fill="#c33">Press down</text>
<text x="500" y="84" font-size="15" fill="#c33">sharply,</text>
<text x="500" y="102" font-size="15" fill="#c33">about 4 cm</text>
<text x="614" y="220" font-size="14" fill="#222">Heel of one hand</text>
<text x="614" y="237" font-size="14" fill="#222">on the breastbone</text>
<line x1="612" y1="226" x2="549.5" y2="229" stroke="#0b5cad" stroke-width="1.3"/><circle cx="549.5" cy="229" r="2.6" fill="#0b5cad"/>
<text x="606" y="332" font-size="14" fill="#222">Support back of</text>
<text x="606" y="349" font-size="14" fill="#222">head; head still</text>
<text x="606" y="366" font-size="14" fill="#222">lower than body</text>
<line x1="626" y1="320" x2="612.5" y2="295" stroke="#0b5cad" stroke-width="1.3"/><circle cx="612.5" cy="295" r="2.6" fill="#0b5cad"/>
<text x="660" y="66" font-size="14" fill="#222" text-anchor="middle" font-weight="bold">Where to press</text>
<rect x="626" y="76" width="68" height="76" rx="22" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<line x1="628" y1="102" x2="692" y2="102" stroke="#0b5cad" stroke-width="1.3" stroke-dasharray="4 3"/>
<circle cx="642" cy="102" r="3" fill="#333" stroke="#333" stroke-width="0"/>
<circle cx="678" cy="102" r="3" fill="#333" stroke="#333" stroke-width="0"/>
<rect x="650" y="106" width="20" height="16" rx="5" fill="#f6dada" stroke="#c33" stroke-width="2.2"/>
<text x="660" y="172" font-size="14" fill="#222" text-anchor="middle">Breastbone, just</text>
<text x="660" y="189" font-size="14" fill="#222" text-anchor="middle">below nipple line</text>
<text x="560" y="410" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">② Turn face up: 5 chest thrusts</text>
<text x="560" y="432" font-size="14" fill="#222" text-anchor="middle">Press about 1/3 of chest depth (about 4 cm),</text>
<text x="560" y="450" font-size="14" fill="#222" text-anchor="middle">slower and more forcefully than CPR; let</text>
<text x="560" y="468" font-size="14" fill="#222" text-anchor="middle">the chest come fully back up each time</text>
</g>
<text x="400" y="512" font-size="15" fill="#222" text-anchor="middle">5 back blows ↔ 5 chest thrusts: keep alternating until the</text>
<text x="400" y="531" font-size="15" fill="#222" text-anchor="middle">object comes out or the baby becomes unconscious</text>
<text x="400" y="554" font-size="15" fill="#c33" text-anchor="middle">No abdominal thrusts (Heimlich manoeuvre); never hold upside down and shake;</text>
<text x="400" y="573" font-size="15" fill="#c33" text-anchor="middle">unconscious → start infant CPR</text>
</g>
</svg>
