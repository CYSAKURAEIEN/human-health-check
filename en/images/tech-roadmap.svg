<!-- stage 0 knowledge shortcut -->
<rect x="530" y="715" width="252" height="52" rx="6" fill="#fff" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="540" y="730" font-size="12" fill="#0b5cad" font-weight="bold">Knowledge shortcut: germ theory</text>
<text x="540" y="745" font-size="12" fill="#0b5cad" font-weight="bold">saves lives already at stage 0:</text>
<text x="540" y="760" font-size="12" fill="#0b5cad">wash hands, boil, disinfect, isolate</text>

<!-- legend -->
<rect x="10" y="786" width="780" height="180" rx="8" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M24,803 H62" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="74" y="808" font-size="13">Prerequisite stated in the text (e.g. iron needs charcoal, glass needs lime,</text>
<text x="74" y="825" font-size="13">generators need copper wire and magnets)</text>
<path d="M24,845 H62" stroke="#0b5cad" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arB)"/>
<text x="74" y="850" font-size="13">Shortcut: if you know electromagnetic induction, you need not wait for the steam engine:</text>
<text x="74" y="867" font-size="13">generate electricity from water or wind</text>
<path d="M43,893 V877" stroke="#999" stroke-width="2" marker-end="url(#arG)"/>
<text x="74" y="892" font-size="13">Rough order; the stages are not a strict sequence, and only the main dependencies are shown</text>
<text x="24" y="918" font-size="13" font-weight="bold">Realistic goal: secure survival first, then gradually recover to about late-19th-century technology</text>
<text x="24" y="939" font-size="13" fill="#0b5cad">The steel, copper wire and books in the ruins are far better than anything you can make yourself:</text>
<text x="24" y="956" font-size="13" fill="#0b5cad">preserve and use them first, then make your own</text>
</g>
