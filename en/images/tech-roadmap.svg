<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 976" width="800" height="976" role="img" aria-label="Technology rebuilding roadmap (technology tree), built from the bottom up. Stage 0 Survival: water, food, shelter, hygiene, first aid, fire; knowledge shortcut: germ theory (hand washing, boiling, disinfection, isolation) saves lives already at stage 0. Stage 1 Farming and basic crafts: crops and livestock, seed saving, food preservation, charcoal, woodwork, lime, pottery, soap making, textiles. Stage 2 Metallurgy and machinery: copper and bronze, iron, steel, water wheels, windmills, lathes, gears, standard gauges. Stage 3 Basic chemicals and materials: sulphuric acid, alkali, glass, cement, paper and printing, refractory materials. Stage 4 Power: boilers, steam engines, Stirling engines. Stage 5 Electricity: generators, batteries, electric motors, telegraph, electric light. Stage 6 Advanced chemistry and medicine: electrolysis (chlor-alkali), fertiliser, microscopes and microbiology, drug purification. Stage 7 Electronics: vacuum tubes, semiconductors, radio, computers; making these from scratch is extremely hard, and in practice you use preserved devices. Prerequisites stated in the text: iron needs charcoal (large forests); glass needs lime; boilers need steel plate and steam engines need precision-machined cylinders; generators need copper wire and magnets; fertiliser needs sulphuric acid; electrolysis needs electricity; glass makes lenses and vacuum tubes. Shortcut: knowing electromagnetic induction, you can generate electricity from water or wind without waiting for the steam engine. The stages are not a strict sequence. Realistic goal: secure survival first, then gradually recover to about late-19th-century technology; use the steel, copper wire and books in the ruins first, then make your own" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Technology rebuilding roadmap</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
</defs>
<g fill="#222">
<text x="400" y="28" font-size="18" font-weight="bold" text-anchor="middle">Technology rebuilding roadmap (technology tree)</text>
<text x="400" y="51" font-size="14" text-anchor="middle" fill="#555">Every technology stands on others: build it up from the bottom, one step at a time</text>

