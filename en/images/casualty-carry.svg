<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1076" width="720" height="1076" role="img" aria-label="Moving a casualty: avoid moving them if you can, and wait for an ambulance if you can. 1 Two-person seat carry: two bearers grip crossed hands to form a seat, the casualty sits on it with arms round both bearers' shoulders, and both stand up and walk together; 2 Backpack carry: slip the two shoulder straps of an empty backpack over the casualty's thighs, the rescuer puts the pack on and carries the casualty as if seated on it; 3 Improvised stretcher: two strong poles about 2-2.5 m long, about 50 cm apart, with a blanket folded in over the poles from both sides, or the poles passed through the sleeves of several buttoned-up coats with the openings facing down; first have a healthy person lie on it to test that it holds, and tie the casualty on with strips of cloth; 4 Carrying a stretcher: usually feet first and head behind, head first going uphill or upstairs, feet first going downhill, keeping the head higher than the feet; do not move a suspected spinal injury unless life is at risk on the spot, and do not use seat carries, piggybacks or soft stretchers for spinal injuries">
<rect width="100%" height="100%" fill="#fff"/>
<title>Moving a casualty: seat carry, backpack carry and improvised stretchers</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<g id="bearer">
<circle cx="0" cy="-60" r="9" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M0,-50 L0,-22" stroke="#333" stroke-width="11" stroke-linecap="round"/>
<path d="M0,-50 L0,-22" stroke="#cfe0f0" stroke-width="7" stroke-linecap="round"/>
<path d="M0,-22 L-8,0 M0,-22 L8,0 M0,-46 L0,-27" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
</g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="17" font-weight="bold" text-anchor="middle">Moving a casualty: avoid it if you can; wait for an ambulance if you can</text>


<g transform="translate(10,44)">
<rect x="0" y="0" width="345" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">① Two-person seat carry</text>
<g fill="none" stroke-linecap="round">

<path d="M70,180 L66,256 M92,180 L96,256 M253,180 L249,256 M275,180 L279,256" stroke="#333" stroke-width="20"/>
<path d="M70,180 L66,256 M92,180 L96,256 M253,180 L249,256 M275,180 L279,256" stroke="#cfe0f0" stroke-width="15"/>
</g>
<g fill="#666"><ellipse cx="64" cy="260" rx="12" ry="5"/><ellipse cx="98" cy="260" rx="12" ry="5"/><ellipse cx="247" cy="260" rx="12" ry="5"/><ellipse cx="281" cy="260" rx="12" ry="5"/></g>

<rect x="52" y="92" width="58" height="96" rx="16" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
