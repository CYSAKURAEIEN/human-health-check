<path d="M63,68 Q62,50 81,50 Q100,50 99,68 Q92,58 81,58 Q70,58 63,68 Z" fill="#555"/>
<circle cx="264" cy="70" r="18" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M246,68 Q245,50 264,50 Q283,50 282,68 Q275,58 264,58 Q253,58 246,68 Z" fill="#555"/>

<rect x="146" y="96" width="52" height="80" rx="16" fill="#e6e6e6" stroke="#333" stroke-width="2.5"/>
<circle cx="172" cy="76" r="17" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M155,74 Q154,57 172,57 Q190,57 189,74 Q182,64 172,64 Q162,64 155,74 Z" fill="#555"/>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M152,106 L106,96 L90,98" stroke="#333" stroke-width="14"/><path d="M152,106 L106,96 L90,98" stroke="#e6e6e6" stroke-width="9"/>
<path d="M192,106 L238,96 L254,98" stroke="#333" stroke-width="14"/><path d="M192,106 L238,96 L254,98" stroke="#e6e6e6" stroke-width="9"/>
</g>
<ellipse cx="86" cy="99" rx="7" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<ellipse cx="258" cy="99" rx="7" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M104,108 L150,176" stroke="#333" stroke-width="14"/><path d="M104,108 L150,176" stroke="#f3e3d3" stroke-width="9"/>
<path d="M58,108 L62,150 L146,184" stroke="#333" stroke-width="14"/><path d="M58,108 L62,150 L146,184" stroke="#f3e3d3" stroke-width="9"/>
<path d="M241,108 L194,176" stroke="#333" stroke-width="14"/><path d="M241,108 L194,176" stroke="#f3e3d3" stroke-width="9"/>
<path d="M287,108 L283,150 L198,184" stroke="#333" stroke-width="14"/><path d="M287,108 L283,150 L198,184" stroke="#f3e3d3" stroke-width="9"/>
</g>
<rect x="142" y="170" width="60" height="20" rx="8" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M157,170 L157,190 M172,170 L172,190 M187,170 L187,190" stroke="#333" stroke-width="1.2"/>

<g fill="none" stroke-linecap="round">
<path d="M162,188 L161,226 M182,188 L183,226" stroke="#333" stroke-width="18"/>
<path d="M162,188 L161,226 M182,188 L183,226" stroke="#e6e6e6" stroke-width="13"/>
</g>
<ellipse cx="162" cy="188" rx="11" ry="9" fill="#e6e6e6" stroke="#333" stroke-width="2.5"/>
<ellipse cx="182" cy="188" rx="11" ry="9" fill="#e6e6e6" stroke="#333" stroke-width="2.5"/>
<g fill="#666"><ellipse cx="160" cy="230" rx="10" ry="5"/><ellipse cx="184" cy="230" rx="10" ry="5"/></g>
<line x1="216" y1="206" x2="200" y2="186" stroke="#0b5cad" stroke-width="1"/>
<text x="206" y="222" font-size="13" fill="#0b5cad">"seat"</text>
<line x1="290" y1="60" x2="250" y2="94" stroke="#0b5cad" stroke-width="1"/>
<text x="262" y="38" font-size="13" fill="#0b5cad">Arms round</text>
<text x="262" y="52" font-size="13" fill="#0b5cad">shoulders</text>
<text x="16" y="284">Two bearers grip crossed hands to form a</text>
<text x="16" y="302">"seat"; the casualty sits on it, arms round</text>
<text x="16" y="320">their shoulders; both stand and walk together</text>
</g>


<g transform="translate(365,44)">
<rect x="0" y="0" width="345" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">② Backpack carry</text>
<line x1="40" y1="248" x2="320" y2="248" stroke="#999" stroke-width="3"/>

<g fill="none" stroke-linecap="round">
<path d="M228,172 L214,244 M242,172 L262,244" stroke="#333" stroke-width="20"/>
<path d="M228,172 L214,244 M242,172 L262,244" stroke="#cfe0f0" stroke-width="15"/>
</g>
<g fill="#666"><ellipse cx="219" cy="248" rx="12" ry="5"/><ellipse cx="267" cy="248" rx="12" ry="5"/></g>

<rect x="150" y="96" width="34" height="86" rx="13" transform="rotate(10 167 139)" fill="#e6e6e6" stroke="#333" stroke-width="2.5"/>

<rect x="216" y="88" width="40" height="90" rx="14" transform="rotate(6 236 133)" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>

<rect x="182" y="100" width="36" height="80" rx="9" transform="rotate(6 200 140)" fill="#d6c29a" stroke="#333" stroke-width="2.5"/>
<path d="M188,120 L216,123" stroke="#333" stroke-width="1.5"/>

<circle cx="252" cy="68" r="17" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M235,70 Q230,50 250,50 Q268,50 269,62 Q254,56 244,62 Q240,66 240,76 Z" fill="#555"/>
<path d="M268,66 L274,75 L268,77" fill="#f3e3d3" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<circle cx="260" cy="66" r="2" fill="#333"/>

<circle cx="196" cy="74" r="16" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M180,78 Q176,58 195,57 Q210,57 212,68 Q198,64 190,70 Q186,74 186,82 Z" fill="#555"/>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M164,180 L240,190 L238,222" stroke="#333" stroke-width="20"/>
<path d="M164,180 L240,190 L238,222" stroke="#e6e6e6" stroke-width="15"/>
</g>
<ellipse cx="242" cy="226" rx="11" ry="5" fill="#666"/>

<path d="M206,130 Q214,156 202,172" fill="none" stroke="#6b5530" stroke-width="5" stroke-linecap="round"/>
<ellipse cx="200" cy="185" rx="6" ry="13" fill="none" stroke="#6b5530" stroke-width="5"/>

<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M184,106 L240,96 L262,116" stroke="#333" stroke-width="14"/><path d="M184,106 L240,96 L262,116" stroke="#e6e6e6" stroke-width="9"/>
</g>
<ellipse cx="265" cy="120" rx="7" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<line x1="114" y1="216" x2="192" y2="192" stroke="#0b5cad" stroke-width="1"/>
<text x="24" y="222" font-size="13" fill="#0b5cad">Straps round</text>
<text x="24" y="238" font-size="13" fill="#0b5cad">casualty's thighs</text>
<line x1="290" y1="162" x2="214" y2="150" stroke="#0b5cad" stroke-width="1"/>
<text x="274" y="176" font-size="13" fill="#0b5cad">Empty</text>
<text x="274" y="191" font-size="13" fill="#0b5cad">backpack</text>
<text x="132" y="62" font-size="13" fill="#555" text-anchor="end">Casualty</text>
<line x1="134" y1="58" x2="178" y2="70" stroke="#555" stroke-width="1"/>
<text x="282" y="58" font-size="13" fill="#555">Rescuer</text>
<text x="16" y="284">Slip the straps of an empty backpack over</text>
<text x="16" y="302">the casualty's thighs. The rescuer puts the</text>
<text x="16" y="320">pack on; the casualty rides as if sitting on it</text>
</g>


<g transform="translate(10,384)">
<rect x="0" y="0" width="700" height="286" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">③ Improvised stretcher: two strong poles + blanket/clothes</text>
<text x="16" y="54" font-size="14" font-weight="bold">Method 1: blanket stretcher (top view)</text>
<rect x="104" y="70" width="210" height="80" fill="#f0e2c4" stroke="#333" stroke-width="2"/>
<line x1="104" y1="110" x2="314" y2="110" stroke="#a08850" stroke-width="1.5" stroke-dasharray="5 4"/>
<g stroke-linecap="round">
<path d="M82,80 L336,80 M82,140 L336,140" stroke="#333" stroke-width="9"/>
<path d="M82,80 L336,80 M82,140 L336,140" stroke="#c8a46e" stroke-width="5"/>
</g>
<g stroke="#0b5cad" stroke-width="1.2" fill="none">
<path d="M70,80 L70,140 M64,80 L76,80 M64,140 L76,140"/>
<path d="M82,160 L336,160 M82,154 L82,166 M336,154 L336,166"/>
</g>
<text x="64" y="106" font-size="13" fill="#0b5cad" text-anchor="end">about</text>
<text x="64" y="121" font-size="13" fill="#0b5cad" text-anchor="end">50 cm</text>
<text x="209" y="178" font-size="13" fill="#0b5cad" text-anchor="middle">poles about 2-2.5 m long</text>

<text x="16" y="190" font-size="13">Cross-section:</text>
<path d="M60,214 L240,214" stroke="#a08850" stroke-width="3"/>
<circle cx="120" cy="208" r="6" fill="#c8a46e" stroke="#333" stroke-width="1.5"/>
<circle cx="180" cy="208" r="6" fill="#c8a46e" stroke="#333" stroke-width="1.5"/>
<path d="M62,220 Q64,190 150,196" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#ar)"/>
<path d="M238,220 Q236,190 150,192" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#ar)"/>
<text x="252" y="212" font-size="13">Fold both sides in</text>
<text x="252" y="230" font-size="13">over the poles</text>

<text x="370" y="54" font-size="14" font-weight="bold">Method 2: coat stretcher (top view)</text>
<g stroke="#333" stroke-width="2" stroke-linejoin="round">
<path d="M400,72 L476,72 L476,148 L400,148 Z" fill="#cfe0f0"/>
<path d="M486,72 L562,72 L562,148 L486,148 Z" fill="#cfe0f0"/>
<path d="M572,72 L648,72 L648,148 L572,148 Z" fill="#cfe0f0"/>
<path d="M404,68 L472,68 L472,86 L404,86 Z M404,134 L472,134 L472,152 L404,152 Z" fill="#b4cde6"/>
<path d="M490,68 L558,68 L558,86 L490,86 Z M490,134 L558,134 L558,152 L490,152 Z" fill="#b4cde6"/>
<path d="M576,68 L644,68 L644,86 L576,86 Z M576,134 L644,134 L644,152 L576,152 Z" fill="#b4cde6"/>
</g>
<g stroke-linecap="round">
<path d="M380,77 L670,77 M380,143 L670,143" stroke="#333" stroke-width="9"/>
<path d="M380,77 L670,77 M380,143 L670,143" stroke="#c8a46e" stroke-width="5"/>
</g>
<line x1="610" y1="182" x2="606" y2="148" stroke="#0b5cad" stroke-width="1"/>
<text x="584" y="196" font-size="13" fill="#0b5cad">Poles through</text>
<text x="584" y="211" font-size="13" fill="#0b5cad">the sleeves</text>
<text x="370" y="180" font-size="13">Several coats, buttoned (zipped) up,</text>
<text x="370" y="198" font-size="13">openings facing down</text>
<text x="16" y="256" font-size="13">· First have a healthy person lie on it to check that it takes the weight</text>
<text x="16" y="274" font-size="13">· Tie the casualty on with strips of cloth so they cannot slide off on slopes</text>
</g>


<g transform="translate(10,680)">
<rect x="0" y="0" width="700" height="250" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">④ Carrying a stretcher: uphill head first, downhill feet first</text>
<text x="38" y="48" font-size="14">(keep the head higher than the feet)</text>
<g transform="translate(0,22)">

<line x1="16" y1="160" x2="230" y2="160" stroke="#999" stroke-width="3"/>
<use href="#bearer" transform="translate(52,160)"/>
<use href="#bearer" transform="translate(196,160)"/>
<path d="M50,134 L198,134" stroke="#8a6a3a" stroke-width="5" stroke-linecap="round"/>
<path d="M84,126 L170,126" stroke="#333" stroke-width="13" stroke-linecap="round"/>
<path d="M84,126 L170,126" stroke="#e6e6e6" stroke-width="9" stroke-linecap="round"/>
<circle cx="74" cy="124" r="8" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M110,118 L110,134 M150,118 L150,134" stroke="#6b5530" stroke-width="2.5"/>
<text x="78" y="112" font-size="12" fill="#c33">head</text>
<path d="M150,62 L200,62" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="94" y="67" font-size="13" fill="#0b5cad">forward</text>
<text x="16" y="182" font-size="13"><tspan font-weight="bold">Level ground:</tspan> usually feet first,</text>
<text x="16" y="200" font-size="13">head behind, so the rear bearer</text>
<text x="16" y="218" font-size="13">can watch the casualty's face</text>

<path d="M246,160 L460,74" stroke="#999" stroke-width="3"/>
<use href="#bearer" transform="translate(282,145.5)"/>
<use href="#bearer" transform="translate(420,90)"/>
<path d="M280,120 L422,64" stroke="#8a6a3a" stroke-width="5" stroke-linecap="round"/>
<path d="M312,102 L394,70" stroke="#333" stroke-width="13" stroke-linecap="round"/>
<path d="M312,102 L394,70" stroke="#e6e6e6" stroke-width="9" stroke-linecap="round"/>
<circle cx="404" cy="64" r="8" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<text x="372" y="50" font-size="12" fill="#c33">head</text>
<path d="M330,138 L372,121" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="350" y="148" font-size="13" fill="#0b5cad">forward</text>
<text x="256" y="182" font-size="13"><tspan font-weight="bold">Uphill, upstairs:</tspan></text>
<text x="256" y="200" font-size="13" fill="#c33" font-weight="bold">head first</text>

<path d="M486,74 L690,156" stroke="#999" stroke-width="3"/>
<use href="#bearer" transform="translate(524,89)"/>
<use href="#bearer" transform="translate(662,144.5)"/>
<path d="M522,64 L664,120" stroke="#8a6a3a" stroke-width="5" stroke-linecap="round"/>
<path d="M552,70 L634,102" stroke="#333" stroke-width="13" stroke-linecap="round"/>
<path d="M552,70 L634,102" stroke="#e6e6e6" stroke-width="9" stroke-linecap="round"/>
<circle cx="542" cy="64" r="8" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<text x="532" y="48" font-size="12" fill="#c33">head</text>
<path d="M572,118 L614,135" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="560" y="152" font-size="13" fill="#0b5cad">forward</text>
<text x="496" y="182" font-size="13"><tspan font-weight="bold">Downhill:</tspan></text>
<text x="496" y="200" font-size="13" fill="#c33" font-weight="bold">feet first</text>
</g>
</g>


<g transform="translate(10,940)">
<rect x="0" y="0" width="700" height="126" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="16" y="26" font-size="15" font-weight="bold" fill="#c33">⚠ Suspected spinal injury: do not move them unless life is at risk on the spot</text>
<text x="34" y="46" font-size="15" font-weight="bold" fill="#c33">(falling rock, fire, water); wait for professional rescue</text>
<text x="16" y="72" font-size="14">Seat carries, piggybacks and similar methods must not be used for suspected spinal injury;</text>
<text x="16" y="90" font-size="14">nor can a soft stretcher: use a rigid board and a multi-person flat lift</text>
<text x="16" y="114" font-size="14">Stop bleeding and splint fractures first, then move; keep watching breathing and consciousness</text>
</g>
</g>
</svg>
