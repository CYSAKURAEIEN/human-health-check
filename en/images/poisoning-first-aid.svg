<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" width="720" height="950" role="img" aria-label="General first aid for poisoning. 1 Protect yourself first: a strange smell at the scene, or people collapsing one after another, may mean toxic gas; do not rush in; wear gloves when handling pesticides or chemicals. 2 Get the person away from the poison: if inhaled, move them to fresh air and open doors and windows (hold your breath, in and out quickly); on the skin, remove contaminated clothing and rinse skin and hair with plenty of water; in the eyes, rinse with running water for 15-20 minutes; if swallowed, spit out what is left in the mouth and rinse the mouth with water without swallowing. 3 Call 120 and say clearly what was swallowed or touched, roughly how much and when, and the person's age, rough weight and current condition; mainland China has no national poison helpline yet. 4 Take the bottle, packaging, leftover tablets and vomit to hospital. 5 Unconscious but breathing: recovery position; no response and no normal breathing: start CPR at once. Do not: do not make them vomit; do not give vinegar, milk, raw egg, mung bean soup or other folk remedies unless a doctor or 120 clearly tells you to; give nothing by mouth to anyone not fully conscious; go to hospital even if they seem fine." font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>General first aid for poisoning</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">General first aid for poisoning</text>
<text x="360" y="52" font-size="13" text-anchor="middle" fill="#555">Protect yourself → Remove the poison → Call 120 → Take the poison along → Watch consciousness and breathing</text>

<!-- 1 protect yourself first -->
<g transform="translate(10,64)">
<rect x="0" y="0" width="230" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">① Protect yourself first</text>
<!-- inside the door: toxic gas + a person on the floor -->
<rect x="118" y="44" width="98" height="124" fill="#f4f4ec" stroke="#333" stroke-width="3"/>
<g fill="#c9d6a3" fill-opacity="0.75"><circle cx="146" cy="84" r="18"/><circle cx="172" cy="76" r="20"/><circle cx="196" cy="90" r="16"/><circle cx="160" cy="104" r="18"/><circle cx="188" cy="112" r="16"/></g>
<path d="M136 74 q6 -6 12 0 t12 0 M170 98 q6 -6 12 0 t12 0" fill="none" stroke="#7d8f4a" stroke-width="1.5"/>
<circle cx="138" cy="152" r="9" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="148" y="146" width="44" height="14" rx="6" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M192 150 H210 M192 156 H208" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<circle cx="190" cy="140" r="7" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<rect x="196" y="132" width="16" height="10" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<!-- outside the door: the rescuer -->
<path d="M46 132 V166 M62 132 V166" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<rect x="40" y="88" width="28" height="48" rx="9" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="54" cy="74" r="12" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M68 98 L84 112" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<path d="M76 124 H110" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M86 112 L102 136 M102 112 L86 136" stroke="#c33" stroke-width="3.5" stroke-linecap="round"/>
<path d="M8 168 H222" stroke="#999" stroke-width="2.5"/>
<g font-size="13">
<text x="10" y="184">Strange smell, or people</text>
<text x="10" y="200">collapsing one after another</text>
<text x="10" y="216">→ possibly toxic gas:</text>
<text x="10" y="234" fill="#c33" font-weight="bold">don't rush in</text>
<text x="10" y="256">Wear gloves when handling</text>
<text x="10" y="272">pesticides or chemicals</text>
<text x="10" y="292" font-size="12" fill="#555">Carbon monoxide: see Home and</text>
<text x="10" y="306" font-size="12" fill="#555">Traffic Accidents; chemical leaks:</text>
<text x="10" y="320" font-size="12" fill="#555">see Man-made Disasters</text>
</g>
</g>

<!-- 2 remove the poison -->
<g transform="translate(245,64)">
<rect x="0" y="0" width="465" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">② Get the person away from the poison</text>
<rect x="8" y="36" width="222" height="142" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<rect x="235" y="36" width="222" height="142" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<rect x="8" y="182" width="222" height="142" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<rect x="235" y="182" width="222" height="142" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<!-- inhaled: open window -->
<g transform="translate(8,36)">
<rect x="10" y="22" width="52" height="64" fill="#e3eef8" stroke="#333" stroke-width="2.5"/>
<path d="M36 22 V86 M10 54 H62" stroke="#333" stroke-width="2"/>
<path d="M36 22 L50 30 V94 L36 86 Z" fill="#fff" stroke="#333" stroke-width="2"/>
<path d="M4 40 Q20 34 30 42 M4 58 Q20 52 30 60 M4 76 Q20 70 30 78" fill="none" stroke="#0b5cad" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="76" y="26" font-size="14" font-weight="bold">Inhaled</text>
<g font-size="13"><text x="76" y="48">Move to fresh air;</text><text x="76" y="66">open doors and</text><text x="76" y="84">windows</text><text x="76" y="104" font-size="12" fill="#555">(hold your breath,</text><text x="76" y="119" font-size="12" fill="#555">in and out fast)</text></g>
</g>
<!-- skin: tap rinsing an arm -->
<g transform="translate(235,36)">
<path d="M14 20 H44 V30 H34 V36 H24 V30 H14 Z" fill="#bbb" stroke="#333" stroke-width="2"/>
<path d="M26 38 V64 M29 38 V64 M32 38 V64" stroke="#3a7fc0" stroke-width="1.6"/>
<path d="M4 72 H52" stroke="#333" stroke-width="16" stroke-linecap="round"/>
<path d="M4 72 H52" stroke="#f3e3d3" stroke-width="11" stroke-linecap="round"/>
<path d="M18 78 Q22 86 18 92 M30 78 Q34 88 30 96 M42 78 Q46 86 42 92" fill="none" stroke="#3a7fc0" stroke-width="1.5"/>
<text x="76" y="26" font-size="14" font-weight="bold">On the skin</text>
<g font-size="13"><text x="76" y="48">Remove soiled</text><text x="76" y="66">clothing; rinse skin</text><text x="76" y="84">and hair with plenty</text><text x="76" y="102">of water</text></g>
</g>
<!-- eyes -->
<g transform="translate(8,182)">
<path d="M18 22 H44 V32 H36 V38 H26 V32 H18 Z" fill="#bbb" stroke="#333" stroke-width="2"/>
<path d="M29 40 Q30 52 32 62 M33 40 Q34 52 36 62" fill="none" stroke="#3a7fc0" stroke-width="1.6"/>
<path d="M6 80 Q34 56 62 80 Q34 102 6 80 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
<circle cx="34" cy="80" r="10" fill="#6b8fb3" stroke="#333" stroke-width="1.5"/>
<circle cx="34" cy="80" r="4" fill="#222"/>
<text x="76" y="26" font-size="14" font-weight="bold">In the eyes</text>
<g font-size="13"><text x="76" y="48">Rinse under running</text><text x="76" y="66">water for</text></g>
<text x="76" y="90" font-size="18" font-weight="bold" fill="#c33">15-20 minutes</text>
<text x="76" y="112" font-size="12" fill="#555">See Foreign Bodies:</text>
<text x="76" y="127" font-size="12" fill="#555">chemicals in the eye</text>
</g>
<!-- swallowed -->
<g transform="translate(235,182)">
<path d="M12 28 L18 92 H44 L50 28 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
<path d="M14.5 50 L18 92 H44 L47.5 50 Z" fill="#cfe5f5"/>
<path d="M14.5 50 H47.5" stroke="#3a7fc0" stroke-width="1.5"/>
<text x="76" y="26" font-size="14" font-weight="bold">Swallowed</text>
<g font-size="13"><text x="76" y="48">Spit out what is left</text><text x="76" y="66">in the mouth; rinse</text><text x="76" y="84">with water, spit it out</text><text x="76" y="106" fill="#c33" font-weight="bold">don't swallow</text></g>
</g>
</g>

<!-- 3 call 120 -->
<g transform="translate(10,402)">
<rect x="0" y="0" width="230" height="282" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">③ Call 120</text>
<rect x="20" y="38" width="34" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="2.5"/>
<rect x="25" y="46" width="24" height="36" fill="#e3eef8"/>
<circle cx="37" cy="89" r="3" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="68" y="80" font-size="34" font-weight="bold" fill="#c33">120</text>
<text x="10" y="122" font-size="13" font-weight="bold">Tell them clearly:</text>
<g font-size="13">
<text x="10" y="142">· What was swallowed</text>
<text x="18" y="158">(or touched)</text>
<text x="10" y="176">· About how much, and when</text>
<text x="10" y="194">· The person's age, rough weight</text>
<text x="10" y="212">· Their condition now</text>
</g>
<g font-size="12" fill="#555"><text x="10" y="236">Mainland China has no national</text><text x="10" y="251">poison helpline yet: for any</text><text x="10" y="266">poisoning, call 120 directly</text></g>
</g>

<!-- 4 take the poison along -->
<g transform="translate(245,402)">
<rect x="0" y="0" width="230" height="282" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">④ Take the poison along</text>
<!-- bottle -->
<path d="M28 44 H44 V54 Q56 60 56 72 V110 H16 V72 Q16 60 28 54 Z" fill="#e9eef2" stroke="#333" stroke-width="2"/>
<rect x="26" y="36" width="20" height="9" fill="#c33" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="76" width="32" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>
<path d="M24 83 H48 M24 91 H42" stroke="#999" stroke-width="1.5"/>
<!-- blister pack -->
<rect x="72" y="64" width="54" height="40" rx="3" fill="#dfe4e8" stroke="#333" stroke-width="2"/>
<g fill="#fff" stroke="#333" stroke-width="1.2"><circle cx="84" cy="76" r="5"/><circle cx="99" cy="76" r="5"/><circle cx="114" cy="76" r="5"/><circle cx="84" cy="92" r="5"/></g>
<g fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 2"><circle cx="99" cy="92" r="5"/><circle cx="114" cy="92" r="5"/></g>
<!-- bag -->
<path d="M142 58 H204 L198 110 H148 Z" fill="#f3f0e6" stroke="#333" stroke-width="2"/>
<path d="M160 58 Q160 44 173 44 Q186 44 186 58" fill="none" stroke="#333" stroke-width="2"/>
<g font-size="12" text-anchor="middle" fill="#0b5cad"><text x="36" y="128">bottle,</text><text x="36" y="142">packaging</text><text x="99" y="128">leftover</text><text x="99" y="142">tablets</text><text x="173" y="128">vomit</text><text x="173" y="142">in a bag</text></g>
<g font-size="13">
<text x="10" y="168">Take the bottle, packaging,</text>
<text x="10" y="186">leftover tablets and vomit</text>
<text x="10" y="204">to hospital</text>
<text x="10" y="228" fill="#555" font-size="12">Doctors need to know exactly</text>
<text x="10" y="243" fill="#555" font-size="12">what it was to give the right antidote</text>
</g>
</g>

<!-- 5 watch consciousness and breathing -->
<g transform="translate(480,402)">
<rect x="0" y="0" width="230" height="282" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">⑤ Watch consciousness</text>
<text x="34" y="44" font-size="16" font-weight="bold">and breathing</text>
<g transform="translate(8,34) scale(0.66)">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M185,100 L312,106" stroke="#333" stroke-width="22"/><path d="M185,100 L312,106" stroke="#cfe0f0" stroke-width="17"/>
<path d="M90,104 L90,150 L48,150" stroke="#333" stroke-width="16"/><path d="M90,104 L90,150 L48,150" stroke="#f3e3d3" stroke-width="11"/>
</g>
<ellipse cx="42" cy="150" rx="10" ry="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="74" y="80" width="114" height="34" rx="14" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M180,98 L184,160 L250,162" stroke="#333" stroke-width="22"/><path d="M180,98 L184,160 L250,162" stroke="#cfe0f0" stroke-width="17"/>
</g>
<path d="M58,92 L80,94" stroke="#333" stroke-width="16" stroke-linecap="round"/>
<path d="M58,92 L80,94" stroke="#f3e3d3" stroke-width="11" stroke-linecap="round"/>
<circle cx="50" cy="90" r="21" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M34,76 Q50,62 68,78 Q72,88 68,96 Q60,80 34,76 Z" fill="#555"/>
<path d="M30,98 Q24,104 32,110" fill="none" stroke="#333" stroke-width="2"/>
<path d="M42,108 Q46,110 50,108" fill="none" stroke="#333" stroke-width="1.8"/>
<circle cx="56" cy="90" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M94,88 L114,132 L62,120" stroke="#333" stroke-width="16"/><path d="M94,88 L114,132 L62,120" stroke="#f3e3d3" stroke-width="11"/>
</g>
<ellipse cx="54" cy="118" rx="10" ry="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
<text x="10" y="162" font-size="12" fill="#555">Recovery position (seen from above)</text>
<g font-size="13">
<text x="10" y="186">Unconscious but breathing →</text>
<text x="10" y="204" font-weight="bold" fill="#0b5cad">recovery position, so vomit</text>
<text x="10" y="220" font-weight="bold" fill="#0b5cad">cannot block the airway</text>
<text x="10" y="244">No response, no normal</text>
<text x="10" y="260">breathing →</text>
<text x="90" y="260" font-weight="bold" fill="#c33">CPR at once</text>
</g>
</g>

<!-- do not -->
<g transform="translate(10,692)">
<rect x="0" y="0" width="700" height="248" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#c33">✗ Do not</text>
<g font-size="14">
<text x="14" y="54"><tspan fill="#c33" font-weight="bold">✗ Don't make them vomit:</tspan> no fingers down the throat, no salt water or soapy water;</text>
<text x="32" y="72">vomiting does not clear poison from the stomach effectively</text>
<text x="32" y="92" font-size="12" fill="#555">Corrosives (strong acids, strong alkalis, cleaning products) burn the oesophagus and mouth again on the way up;</text>
<text x="32" y="107" font-size="12" fill="#555">if the person is not fully conscious, vomit is easily breathed into the lungs</text>
<text x="14" y="134"><tspan fill="#c33" font-weight="bold">✗ Don't give vinegar, milk, raw egg, mung bean soup or other “antidote” folk remedies,</tspan></text>
<text x="32" y="152">unless a doctor or 120 clearly tells you to</text>
<text x="14" y="180"><tspan fill="#c33" font-weight="bold">✗ Give nothing by mouth to anyone not fully conscious</tspan></text>
<text x="14" y="208"><tspan fill="#c33" font-weight="bold">✗ Don't skip hospital because they “seem fine now”:</tspan></text>
<text x="32" y="225" font-size="12" fill="#555">paraquat, paracetamol (acetaminophen) and some rat poisons cause serious symptoms only hours to days later;</text>
<text x="32" y="240" font-size="12" fill="#555">by the time symptoms appear, the best time for treatment has often passed</text>
</g>
</g>
</g>
</svg>
