<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 554" width="720" height="554" role="img" aria-label="Finding direction with a watch (northern hemisphere): hold the watch flat, point the hour hand at the sun; the line bisecting the smaller angle between the hour hand and the 12 mark points south; for example at 8 a.m. local solar time the bisector is at the 10 o'clock position, and at 4 p.m. it is at the 2 o'clock position; use local solar time, not Beijing time; in the southern hemisphere point the 12 mark at the sun and the bisector points north" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Finding direction with a watch</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<g id="sun"><circle r="12" fill="#ffd34d" stroke="#e08a00" stroke-width="2"/><path d="M0,-17 V-22 M0,17 V22 M-17,0 H-22 M17,0 H22 M-12,-12 L-15.6,-15.6 M12,12 L15.6,15.6 M-12,12 L-15.6,15.6 M12,-12 L15.6,-15.6" stroke="#e08a00" stroke-width="2" stroke-linecap="round"/></g>
<g id="face">
<circle r="84" fill="#cfe0f0" stroke="#333" stroke-width="3"/>
<circle r="76" fill="#fff" stroke="#333" stroke-width="1.5"/>
<g stroke="#333" stroke-width="2.5" stroke-linecap="round">
<line x1="0" y1="-66" x2="0" y2="-75"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(30)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(60)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(90)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(120)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(150)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(180)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(210)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(240)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(270)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(300)"/><line x1="0" y1="-66" x2="0" y2="-75" transform="rotate(330)"/>
</g>
<g font-size="14" fill="#222" text-anchor="middle">
<text x="0" y="-48" font-size="16" font-weight="bold">12</text><text x="54" y="5">3</text><text x="0" y="60">6</text><text x="-54" y="5">9</text>
</g>
</g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Finding direction with a watch (northern hemisphere)</text>

<g transform="translate(10,44)">
<rect x="0" y="0" width="345" height="326" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="14" y="26" font-size="16" font-weight="bold">Morning (e.g. 8 a.m. local solar time)</text>
<g transform="translate(180,150)">
<use href="#face"/>
<path d="M-26,15 A30,30 0 0 1 0,-30" fill="none" stroke="#0b5cad" stroke-width="2"/>
<path d="M0,0 L-121,-70" stroke="#c33" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arR)"/>
<line x1="0" y1="0" x2="0" y2="-62" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>
<line x1="0" y1="0" x2="-41.6" y2="24" stroke="#333" stroke-width="6" stroke-linecap="round"/>
<circle r="5" fill="#333"/>
<path d="M-50,29 L-92,53" stroke="#e08a00" stroke-width="1.5" stroke-dasharray="4 3"/>
<use href="#sun" transform="translate(-113,65)"/>
<text x="-121" y="-84" font-size="20" font-weight="bold" fill="#c33" text-anchor="middle">South</text>
<text x="-113" y="105" font-size="14" text-anchor="middle">sun</text>
<text x="-24" y="46" font-size="13" fill="#0b5cad" text-anchor="middle">hour hand</text>
</g>
<text x="14" y="290" font-size="14">Hour hand on 8, pointed at the sun; the smaller</text>
<text x="14" y="309" font-size="14">angle to 12 spans 9, 10, 11: bisector at 10</text>
</g>

<g transform="translate(365,44)">
<rect x="0" y="0" width="345" height="326" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="14" y="26" font-size="16" font-weight="bold">Afternoon (e.g. 4 p.m. local solar time)</text>
<g transform="translate(165,150)">
<use href="#face"/>
<path d="M0,-30 A30,30 0 0 1 26,15" fill="none" stroke="#0b5cad" stroke-width="2"/>
<path d="M0,0 L121,-70" stroke="#c33" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arR)"/>
<line x1="0" y1="0" x2="0" y2="-62" stroke="#999" stroke-width="2.5" stroke-linecap="round"/>
<line x1="0" y1="0" x2="41.6" y2="24" stroke="#333" stroke-width="6" stroke-linecap="round"/>
<circle r="5" fill="#333"/>
<path d="M50,29 L92,53" stroke="#e08a00" stroke-width="1.5" stroke-dasharray="4 3"/>
<use href="#sun" transform="translate(113,65)"/>
<text x="121" y="-84" font-size="20" font-weight="bold" fill="#c33" text-anchor="middle">South</text>
<text x="113" y="105" font-size="14" text-anchor="middle">sun</text>
<text x="24" y="46" font-size="13" fill="#0b5cad" text-anchor="middle">hour hand</text>
</g>
<text x="14" y="290" font-size="14">Hour hand on 4, pointed at the sun; the smaller</text>
<text x="14" y="309" font-size="14">angle to 12 spans 3, 2, 1: bisector at 2</text>
</g>

<rect x="10" y="384" width="700" height="154" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="26" y="408" font-size="15">Watch flat → hour hand at the sun → bisector of the smaller angle to 12 points south</text>
<text x="26" y="430" font-size="14" fill="#555">(works between 6 a.m. and 6 p.m.)</text>
<text x="26" y="455" font-size="15" fill="#c33">⚠ Use local solar time, not Beijing time: around Chengdu and Kunming local noon is</text>
<text x="26" y="476" font-size="15" fill="#c33">about 13:00 Beijing time, around Urumqi about 14:00. At low latitudes in summer,</text>
<text x="26" y="497" font-size="15" fill="#c33">near noon the error can be tens of degrees: a rough guide only</text>
<text x="26" y="524" font-size="14">Southern hemisphere: point 12 at the sun; the bisector of 12 and the hour hand points north</text>
</g>
</svg>
