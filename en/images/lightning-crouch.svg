<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="Last resort in lightning when there is nowhere to shelter: crouch with feet tightly together, hands around the knees, head down, on a dry rucksack or sleeping mat; do not lie down or lie flat; if there are several people, spread out at least 15 m apart, do not hold hands, each person crouching; this position only slightly lowers the risk: as soon as you hear thunder, get into a solid building or a closed car">
<rect width="100%" height="100%" fill="#fff"/>
<title>Feet-together crouch in lightning when there is nowhere to shelter</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<!-- crouch, side view, feet at y=0, head to the left -->
<g id="cr">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M50,-28 L34,-74" stroke="#333" stroke-width="28"/><path d="M50,-28 L34,-74" stroke="#cfe0f0" stroke-width="23"/>
<path d="M48,-22 L6,-54 L28,-12" stroke="#333" stroke-width="19"/><path d="M48,-22 L6,-54 L28,-12" stroke="#cfe0f0" stroke-width="14"/>
</g>
<path d="M12,0 Q12,-12 22,-12 L40,-12 Q44,-12 44,-6 L44,0 Z" fill="#555" stroke="#333" stroke-width="1.5"/>
<circle cx="10" cy="-78" r="16" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M2,-93 Q24,-96 24,-72 Q18,-88 2,-93 Z" fill="#555"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M34,-70 L-8,-44 L18,-32" stroke="#333" stroke-width="14"/><path d="M34,-70 L-8,-44 L18,-32" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="22" cy="-32" rx="7" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Lightning, nowhere to shelter, last resort: feet-together crouch</text>

<!-- A correct position -->
<g transform="translate(10,42)">
<rect x="0" y="0" width="440" height="320" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="150" y="30" font-size="14" fill="#555" text-anchor="middle">Side</text>
<text x="330" y="30" font-size="14" fill="#555" text-anchor="middle">Front</text>
<line x1="12" y1="250" x2="428" y2="250" stroke="#999" stroke-width="3"/>
<!-- sleeping mat / rucksack -->
<rect x="96" y="236" width="118" height="12" rx="3" fill="#b9d6a8" stroke="#333" stroke-width="2"/>
<rect x="278" y="236" width="104" height="12" rx="3" fill="#b9d6a8" stroke="#333" stroke-width="2"/>
<use href="#cr" transform="translate(116,236) scale(1.3)"/>
<!-- front -->
<g transform="translate(330,236) scale(1.3)">
<path d="M-30,-98 Q0,-108 30,-98 L32,-58 L-32,-58 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M-28,-92 L-34,-52 M28,-92 L34,-52" stroke="#333" stroke-width="13"/><path d="M-28,-92 L-34,-52 M28,-92 L34,-52" stroke="#f3e3d3" stroke-width="8"/>
<path d="M-9,-10 L-11,-60 M9,-10 L11,-60" stroke="#333" stroke-width="19"/><path d="M-9,-10 L-11,-60 M9,-10 L11,-60" stroke="#cfe0f0" stroke-width="14"/>
</g>
<circle cx="-11" cy="-62" r="10" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
<circle cx="11" cy="-62" r="10" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
<circle cx="0" cy="-86" r="16" fill="#555" stroke="#333" stroke-width="2.5"/>
<path d="M-12,-76 Q0,-68 12,-76" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<g fill="none" stroke-linecap="round"><path d="M-34,-52 Q0,-38 34,-52" stroke="#333" stroke-width="13"/><path d="M-34,-52 Q0,-38 34,-52" stroke="#f3e3d3" stroke-width="8"/></g>
<path d="M-20,0 L-20,-6 Q-20,-12 -12,-12 L-1,-12 L-1,0 Z M20,0 L20,-6 Q20,-12 12,-12 L1,-12 L1,0 Z" fill="#555" stroke="#333" stroke-width="1.5"/>
</g>
<!-- labels -->
<text x="14" y="104" font-size="15" fill="#0b5cad">head down</text>
<line x1="86" y1="108" x2="120" y2="126" stroke="#0b5cad" stroke-width="1"/>
<text x="14" y="150" font-size="15" fill="#0b5cad">hands</text>
<text x="14" y="166" font-size="15" fill="#0b5cad">round knees</text>
<line x1="96" y1="170" x2="118" y2="180" stroke="#0b5cad" stroke-width="1"/>
<text x="206" y="146" font-size="15" fill="#0b5cad">crouch</text>
<line x1="210" y1="156" x2="172" y2="186" stroke="#0b5cad" stroke-width="1"/>
<text x="284" y="200" font-size="14" fill="#0b5cad" text-anchor="end">feet</text>
<text x="284" y="216" font-size="14" fill="#0b5cad" text-anchor="end">tightly</text>
<text x="284" y="232" font-size="14" fill="#0b5cad" text-anchor="end">together</text>
<line x1="286" y1="222" x2="320" y2="230" stroke="#0b5cad" stroke-width="1"/>
<text x="20" y="276" font-size="14">Crouch on something dry that insulates (dry rucksack,</text>
<text x="20" y="294" font-size="14">sleeping mat, plastic raincoat); touch the ground</text>
<text x="20" y="312" font-size="14">with as little of your body as possible</text>
</g>

<!-- B do not lie down -->
<g transform="translate(460,42)">
<rect x="0" y="0" width="250" height="320" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="125" y="34" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">✗ Don't lie down or flat</text>
<line x1="12" y1="170" x2="238" y2="170" stroke="#999" stroke-width="3"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M120,154 L218,156" stroke="#333" stroke-width="19"/><path d="M120,154 L218,156" stroke="#cfe0f0" stroke-width="14"/>
<path d="M68,150 L126,152" stroke="#333" stroke-width="30"/><path d="M68,150 L126,152" stroke="#cfe0f0" stroke-width="25"/>
<path d="M76,160 L118,161" stroke="#333" stroke-width="14"/><path d="M76,160 L118,161" stroke="#f3e3d3" stroke-width="9"/>
</g>
<circle cx="42" cy="152" r="16" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M46,96 L206,188 M206,96 L46,188" stroke="#c33" stroke-width="5" stroke-linecap="round"/>
<text x="16" y="222" font-size="14">The more of your body touches</text>
<text x="16" y="242" font-size="14">the ground, the more harm step</text>
<text x="16" y="262" font-size="14">voltage does as the lightning</text>
<text x="16" y="282" font-size="14">current spreads through the ground</text>
</g>

<!-- C groups -->
<g transform="translate(10,372)">
<rect x="0" y="0" width="700" height="160" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="16" font-weight="bold">In a group: spread out, each person crouching</text>
<line x1="12" y1="118" x2="688" y2="118" stroke="#999" stroke-width="3"/>
<use href="#cr" transform="translate(110,116) scale(0.55)"/>
<use href="#cr" transform="translate(345,116) scale(0.55)"/>
<use href="#cr" transform="translate(580,116) scale(0.55)"/>
<path d="M140,96 L328,96" stroke="#0b5cad" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<path d="M375,96 L563,96" stroke="#0b5cad" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="234" y="88" font-size="15" fill="#0b5cad" text-anchor="middle">at least 15 m</text>
<text x="469" y="88" font-size="15" fill="#0b5cad" text-anchor="middle">at least 15 m</text>
<text x="16" y="146" font-size="14">At least 15 m apart, don't hold hands; then if someone is struck, the others can help at once</text>
</g>

<!-- warning -->
<rect x="10" y="542" width="700" height="66" rx="6" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="566" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">⚠ This only slightly lowers the risk; it is no substitute for leaving early</text>
<text x="360" y="592" font-size="13" fill="#c33" text-anchor="middle">At the first thunder, get into a solid building or closed car; in the hills, get off summits and ridges fast</text>
</g>
</svg>
