<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 908" width="720" height="908" role="img" aria-label="There is no simple way to tell a poisonous mushroom: this picture is not an identification guide. Many of the deadliest amanitas are white, grey or grey-brown and plain-looking, are often mistaken for edible mushrooms, and are the main cause of deaths from mushroom poisoning in China. Colour, silver needles, silver or garlic, thorough cooking or adding chilli, insect bites or animals eating them, growing under pines or in grass, milky juice or colour change, phone photo identification, and the village elders always having eaten them: all these rules of thumb are unreliable. Do not pick, buy, sell or eat wild mushrooms you do not know" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Poisonous mushrooms: no simple test</title>
<text x="360" y="28" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">Poisonous mushrooms: there is no simple test</text>
<rect x="8" y="40" width="704" height="72" rx="8" fill="#c33"/>
<text x="360" y="61" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">No simple method can tell whether a mushroom is poisonous:</text>
<text x="360" y="81" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold">identification needs experts and equipment</text>
<text x="360" y="102" font-size="14" fill="#fff" text-anchor="middle">⚠️ This is not an identification guide: don't "identify" mushrooms from these pictures</text>
<g transform="translate(0,22)">

<!-- amanitas: plain-looking -->
<rect x="8" y="100" width="704" height="276" rx="10" fill="none" stroke="#c33" stroke-width="2"/>
<text x="22" y="126" font-size="16" fill="#c33" font-weight="bold">Deadly amanitas often "don't look poisonous"</text>
<line x1="24" y1="292" x2="256" y2="292" stroke="#999" stroke-width="2"/>
<path d="M36 292 l4 -14 M44 292 l-2 -12 M232 292 l4 -12 M240 292 l-2 -16 M246 292 l5 -10 M150 292 l-3 -10 M156 292 l3 -12" stroke="#6a8a3a" stroke-width="2" stroke-linecap="round"/>
<!-- white -->
<path d="M91 222 Q88 258 86 292 L114 292 Q112 258 109 222 Z" fill="#fafafa" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M52 224 Q56 172 100 168 Q144 172 148 224 Q100 230 52 224 Z" fill="#fafafa" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<!-- grey-brown -->
<path d="M194 246 Q192 270 191 292 L209 292 Q208 270 206 246 Z" fill="#eeeae6" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M166 248 Q170 210 200 207 Q230 210 234 248 Q200 253 166 248 Z" fill="#b9b0a6" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<text x="100" y="154" font-size="13" fill="#222" text-anchor="middle">white</text>
<text x="200" y="196" font-size="13" fill="#222" text-anchor="middle">grey, grey-brown</text>
<text x="140" y="316" font-size="13" fill="#c33" text-anchor="middle">Schematic: plain-looking; you</text>
<text x="140" y="332" font-size="13" fill="#c33" text-anchor="middle">cannot identify them by shape</text>
<g font-size="14" fill="#222">
<text x="280" y="152">● e.g. the destroying angels (<tspan font-style="italic">Amanita verna</tspan>,</text>
<text x="294" y="170"><tspan font-style="italic">A. exitialis</tspan>) and the grey <tspan font-style="italic">A. fuliginea</tspan></text>
<text x="280" y="194">● Many are white, grey or grey-brown and look plain;</text>
<text x="294" y="212">they are often mistaken for edible mushrooms</text>
<text x="280" y="236" fill="#c33" font-weight="bold">● The main cause of mushroom-poisoning deaths</text>
<text x="294" y="254" fill="#c33" font-weight="bold">in China</text>
<text x="280" y="278">● The toxin (amatoxin) is very stable: cooking at</text>
<text x="294" y="296">high heat does not destroy it</text>
<text x="280" y="320">● Poisoning is followed by a "false recovery",</text>
<text x="294" y="338">then liver failure</text>
<text x="280" y="362">● Mushrooms in city parks and lawns are just as toxic</text>
</g>

<!-- unreliable rules of thumb -->
<g transform="translate(0,48)">
<text x="14" y="354" font-size="16" fill="#c33" font-weight="bold">None of these "rules of thumb" can be trusted</text>
<g font-size="13" fill="#222" text-anchor="middle">
<!-- 1 colour -->
<rect x="8" y="364" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<circle cx="58" cy="400" r="11" fill="#d33" stroke="#333" stroke-width="1.5"/><circle cx="84" cy="400" r="11" fill="#f5c518" stroke="#333" stroke-width="1.5"/><circle cx="110" cy="400" r="11" fill="#fff" stroke="#333" stroke-width="1.5"/><circle cx="136" cy="400" r="11" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<text x="94" y="446">Bright colours are</text>
<text x="94" y="462">poisonous, plain</text>
<text x="94" y="478">ones are safe</text>
<!-- 2 silver needle, garlic -->
<rect x="185" y="364" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<line x1="226" y1="418" x2="262" y2="384" stroke="#999" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="259" cy="387" rx="2.5" ry="1.4" fill="#fff" stroke="#666" transform="rotate(-43 259 387)"/>
<path d="M300 380 Q296 392 282 400 Q282 418 300 418 Q318 418 318 400 Q304 392 300 380 Z" fill="#f5f0e6" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M300 386 L300 416 M292 398 Q292 410 296 416 M308 398 Q308 410 304 416" fill="none" stroke="#999" stroke-width="1.2"/>
<text x="271" y="446">Boiled with a silver</text>
<text x="271" y="462">needle, silver or garlic,</text>
<text x="271" y="478">it turns black if</text>
<text x="271" y="494">poisonous</text>
<!-- 3 cooking -->
<rect x="362" y="364" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M412 396 h58 v18 q0 8 -8 8 h-42 q-8 0 -8 -8 Z" fill="#bbb" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<line x1="406" y1="396" x2="476" y2="396" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
<path d="M428 391 q-4 -4 0 -8 t0 -8 M441 391 q-4 -4 0 -8 t0 -8 M454 391 q-4 -4 0 -8 t0 -8" fill="none" stroke="#999" stroke-width="1.6"/>
<path d="M486 386 Q500 392 504 412 Q494 400 482 394 Z" fill="#d33" stroke="#333" stroke-width="1.3"/>
<path d="M483 390 l-4 -6" stroke="#4d6b2a" stroke-width="2.5" stroke-linecap="round"/>
<text x="448" y="446">Cooking it through,</text>
<text x="448" y="462">cooking it long or</text>
<text x="448" y="478">adding chilli removes</text>
<text x="448" y="494">the poison</text>
<!-- 4 insect bites -->
<rect x="539" y="364" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M620 402 Q618 414 617 424 L631 424 Q630 414 628 402 Z" fill="#fafafa" stroke="#333" stroke-width="1.8"/>
<path d="M596 404 Q600 378 624 376 Q636 377 642 384 Q634 386 638 392 Q646 392 650 404 Q624 408 596 404 Z" fill="#fafafa" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<ellipse cx="664" cy="410" rx="7" ry="4.5" fill="#555"/>
<path d="M660 406 l-3 -5 M664 405 l0 -6 M668 406 l3 -5 M660 414 l-3 5 M664 415 l0 6 M668 414 l3 5" stroke="#555" stroke-width="1.2"/>
<text x="625" y="446">Ones bitten by insects</text>
<text x="625" y="462">or eaten by animals</text>
<text x="625" y="478">are safe</text>
<g transform="translate(0,24)">
<!-- 5 pine trees, grass -->
<rect x="8" y="486" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M70 498 L54 520 L62 520 L48 540 L92 540 L78 520 L86 520 Z" fill="#9cbf6e" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/>
<rect x="67" y="540" width="6" height="8" fill="#8a6a3a"/>
<line x1="40" y1="548" x2="148" y2="548" stroke="#999" stroke-width="1.5"/>
<path d="M108 548 l-3 -10 M114 548 l1 -12 M120 548 l4 -10 M132 548 l-3 -9 M138 548 l2 -11" stroke="#6a8a3a" stroke-width="2" stroke-linecap="round"/>
<text x="94" y="568">Ones growing under</text>
<text x="94" y="584">pine trees or in grass</text>
<text x="94" y="600">are safe</text>
<!-- 6 milky juice, colour change -->
<rect x="185" y="486" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M271 500 Q258 520 258 530 A13 13 0 0 0 284 530 Q284 520 271 500 Z" fill="#fbf8ee" stroke="#333" stroke-width="1.8"/>
<text x="271" y="568">Only ones that ooze</text>
<text x="271" y="584">milky juice or change</text>
<text x="271" y="600">colour when torn</text>
<text x="271" y="616">are poisonous</text>
<!-- 7 phone -->
<rect x="362" y="486" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="433" y="496" width="30" height="52" rx="5" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="437" y="502" width="22" height="36" fill="#eef4fa"/>
<path d="M441 524 Q442 514 448 514 Q454 514 455 524 Z M446 524 L446 532 L450 532 L450 524" fill="#fafafa" stroke="#333" stroke-width="1"/>
<text x="448" y="568">Identifying it with</text>
<text x="448" y="584">a phone photo app</text>
<text x="448" y="601" font-size="12" fill="#666">not accurate enough</text>
<text x="448" y="616" font-size="12" fill="#666">to decide by</text>
<!-- 8 village elders -->
<rect x="539" y="486" width="172" height="140" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M600 522 L625 502 L650 522 Z" fill="#cfe0f0" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="606" y="522" width="38" height="24" fill="#fff" stroke="#333" stroke-width="1.8"/>
<rect x="620" y="532" width="10" height="14" fill="#c9a26b" stroke="#333" stroke-width="1.2"/>
<text x="625" y="568">The village elders</text>
<text x="625" y="584">have always eaten them</text>
<text x="625" y="601" font-size="12" fill="#666">many victims have picked</text>
<text x="625" y="616" font-size="12" fill="#666">mushrooms for years</text>
</g>
<!-- red crosses -->
<g font-size="20" fill="#c33" font-weight="bold" text-anchor="start">
<text x="20" y="390">✗</text><text x="197" y="390">✗</text><text x="374" y="390">✗</text><text x="551" y="390">✗</text>
<text x="20" y="536">✗</text><text x="197" y="536">✗</text><text x="374" y="536">✗</text><text x="551" y="536">✗</text>
</g>
</g>

</g>
<!-- conclusion -->
<g transform="translate(0,96)">
<rect x="8" y="614" width="704" height="166" rx="10" fill="#eef4fa" stroke="#0b5cad" stroke-width="1.5"/>
<text x="24" y="640" font-size="16" fill="#0b5cad" font-weight="bold">✓ Do not pick, buy, sell or eat wild mushrooms you do not know</text>
<text x="24" y="664" font-size="14" fill="#222">To "know" one you must be 100% sure; "it looks like it" or "I've eaten similar ones" doesn't count.</text>
<text x="24" y="682" font-size="14" fill="#222">In a survival situation mushrooms give very few calories and are not worth the risk.</text>
<text x="24" y="708" font-size="14" fill="#c33" font-weight="bold">Unwell after eating wild mushrooms? Call 120 at once or get to hospital quickly;</text>
<text x="24" y="726" font-size="14" fill="#c33" font-weight="bold">everyone who ate them must go</text>
<text x="24" y="750" font-size="14" fill="#c33">Symptoms that start more than 6 hours after eating are even more dangerous. Don't skip</text>
<text x="24" y="768" font-size="14" fill="#c33">hospital because "I've vomited and had diarrhoea, so it's over"</text>
</g>
</g>
</svg>
