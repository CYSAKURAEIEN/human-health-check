<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 944" width="720" height="944" role="img" aria-label="Forge in section: the fire bed is a brick or stone platform about 70-80 cm high, a comfortable height for working standing up; the fire pot is a hollow in the middle of the fire bed, about 20-30 cm across and about 15 cm deep; a hood is optional. A side-blast tuyere lets air in from the side, the simplest arrangement, aimed below where the work sits; a bottom blast lets air in through the bottom of the fire pot, which needs an ash door that can be opened. Near the tuyere is the oxidising zone, where work scales badly; a little above it is the reducing zone, the hottest part with little oxygen, the best place to heat the work; keep the fire deep, with the work buried in the middle and fuel above and below. Nearby: a quench tank, a fuel pile and a tool rack. The anvil is fixed firmly on a thick wooden block or brick stand, with its face at about the knuckle height of the user's hanging hands. Carbon monoxide builds up, so ventilation is essential; sparks and bits of charcoal fly a long way; the end of the tuyere near the fire gets extremely hot" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Structure of a forge</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="dimB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#0b5cad"/></marker>
<pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#dcbca4"/><path d="M0,0.5 H40 M0,10.5 H40 M20,0 V10 M0.5,10 V20" stroke="#b8927a" stroke-width="1"/></pattern>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Forge (side blast) in section</text>

<!-- ground -->
<rect x="0" y="430" width="552" height="14" fill="#ececec"/>
<path d="M0,430 H552" stroke="#999" stroke-width="3"/>

<!-- hood -->
<path d="M226,140 L258,96 V56 M354,140 L322,96 V56 M226,140 H354" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="362" y="104" font-size="14" fill="#555">hood (optional)</text>

<!-- fire bed -->
<rect x="150" y="230" width="280" height="200" fill="url(#brick)" stroke="#333" stroke-width="2.5"/>
<!-- fuel heap and fire pot -->
<path d="M205,230 Q230,226 245,205 Q262,176 290,172 Q318,176 335,205 Q350,226 375,230 H325 Q325,270 290,270 Q255,270 255,230 Z" fill="#3d3d3d" stroke="#222" stroke-width="1.5"/>
<g fill="#5e5e5e">
<circle cx="236" cy="222" r="4"/><circle cx="252" cy="196" r="4"/><circle cx="272" cy="184" r="4"/><circle cx="306" cy="183" r="4"/><circle cx="326" cy="196" r="4"/><circle cx="344" cy="222" r="4"/><circle cx="360" cy="226" r="3"/><circle cx="220" cy="227" r="3"/><circle cx="300" cy="240" r="4"/><circle cx="316" cy="252" r="4"/><circle cx="292" cy="262" r="4"/>
</g>
<ellipse cx="290" cy="212" rx="44" ry="15" fill="#f08a2a"/>
<ellipse cx="278" cy="254" rx="17" ry="10" fill="#ffe27a"/>
<path d="M255,230 Q255,270 290,270 Q325,270 325,230" fill="none" stroke="#333" stroke-width="2"/>
<!-- workpiece -->
<rect x="262" y="208" width="258" height="7" fill="#8a8a8a" stroke="#333" stroke-width="1.2"/>
<rect x="263" y="209" width="70" height="5" fill="#e0482a"/>
<!-- air pipe and bellows -->
<rect x="16" y="236" width="60" height="40" rx="3" fill="#e2cfa6" stroke="#333" stroke-width="2"/>
<text x="46" y="261" font-size="14" text-anchor="middle">bellows</text>
<rect x="76" y="251" width="185" height="10" fill="#c9a27a" stroke="#333" stroke-width="1.5"/>
<rect x="76" y="254.5" width="185" height="3" fill="#fff"/>
<path d="M88,243 H140" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M264,258 Q276,256 282,244" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>

<!-- fire zone labels -->
<text x="16" y="70" font-size="13" font-weight="bold">Reducing zone (a little</text>
<text x="16" y="86" font-size="13" font-weight="bold">above the tuyere):</text>
<text x="16" y="102" font-size="13">hottest, little oxygen</text>
<text x="16" y="118" font-size="13" font-weight="bold" fill="#c33">→ best place to heat work</text>
<line x1="190" y1="80" x2="254" y2="209" stroke="#555" stroke-width="1"/>
<text x="16" y="150" font-size="13" font-weight="bold">Oxidising zone (near the</text>
<text x="16" y="166" font-size="13" font-weight="bold">tuyere, plenty of oxygen):</text>
<text x="16" y="182" font-size="13">work put here scales</text>
<text x="16" y="198" font-size="13">badly</text>
<line x1="60" y1="196" x2="268" y2="251" stroke="#555" stroke-width="1"/>
<text x="400" y="158" font-size="13">work buried in the</text>
<text x="400" y="175" font-size="13">middle of the fire,</text>
<text x="400" y="192" font-size="13">fuel above and below</text>
<line x1="398" y1="182" x2="372" y2="207" stroke="#555" stroke-width="1"/>
<text x="16" y="294" font-size="14" font-weight="bold">Tuyere</text>
<text x="16" y="311" font-size="13">(side blast): air</text>
<text x="16" y="327" font-size="13">enters from the</text>
<text x="16" y="343" font-size="13">side, aimed below</text>
<text x="16" y="359" font-size="13">the work</text>

<!-- fire pot dimensions -->
<path d="M255,232 V292 M325,232 V292 M292,270 H346" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="257" y1="286" x2="323" y2="286" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<line x1="340" y1="232" x2="340" y2="268" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<rect x="346" y="242" width="80" height="22" rx="3" fill="#fff"/>
<text x="350" y="258" font-size="13" fill="#0b5cad">≈ <tspan font-weight="bold">15 cm</tspan> deep</text>
<rect x="184" y="296" width="212" height="44" rx="3" fill="#fff"/>
<text x="290" y="314" font-size="13" fill="#0b5cad" text-anchor="middle">fire pot about <tspan font-weight="bold">20-30 cm</tspan> across</text>
<text x="290" y="333" font-size="13" text-anchor="middle">(a hollow in the middle of the bed)</text>
<rect x="174" y="372" width="232" height="24" rx="3" fill="#fff"/>
<text x="290" y="389" font-size="14" text-anchor="middle">fire bed (brick or stone platform)</text>

<!-- height -->
<path d="M432,230 H452 M432,430 H452" stroke="#0b5cad" stroke-width="1"/>
<line x1="444" y1="232" x2="444" y2="428" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<g font-size="14" fill="#0b5cad">
<text x="452" y="282">height about</text>
<text x="452" y="300" font-weight="bold">70-80 cm</text>
<text x="452" y="320" font-size="13">(comfortable</text>
<text x="452" y="335" font-size="13">for working</text>
<text x="452" y="350" font-size="13">standing up)</text>
</g>

<!-- things nearby -->
<path d="M24,430 Q40,404 76,402 Q112,404 130,430 Z" fill="#3d3d3d" stroke="#222" stroke-width="1.5"/>
<g fill="#5e5e5e"><circle cx="52" cy="418" r="4"/><circle cx="76" cy="410" r="4"/><circle cx="100" cy="418" r="4"/><circle cx="66" cy="424" r="3"/><circle cx="90" cy="425" r="3"/></g>
<text x="16" y="380" font-size="13" fill="#555">fuel pile</text>
<text x="16" y="396" font-size="13" fill="#555">walnut-sized, even</text>
<rect x="464" y="406" width="80" height="22" fill="#a9cdf2"/>
<path d="M462,396 V430 H546 V396" fill="none" stroke="#333" stroke-width="2"/>
<text x="504" y="390" font-size="13" fill="#555" text-anchor="middle">quench tank</text>
<text x="16" y="466" font-size="14">Nearby: quench tank, fuel pile, tool rack</text>

<!-- anvil -->
<rect x="560" y="130" width="150" height="370" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="570" y="152" font-size="15" font-weight="bold">Anvil <tspan font-size="12" font-weight="normal" fill="#555">(smaller scale)</tspan></text>
<text x="570" y="172" font-size="13">fixed firmly on a</text>
<text x="570" y="188" font-size="13">thick wooden block</text>
<text x="570" y="204" font-size="13">or brick stand</text>
<path d="M566,430 H704" stroke="#999" stroke-width="3"/>
<rect x="597" y="312" width="15" height="114" rx="5" fill="#9fb8d0" stroke="#333" stroke-width="2"/>
<rect x="596" y="423" width="24" height="7" rx="2" fill="#555"/>
<rect x="593" y="244" width="22" height="76" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="604" cy="231" r="12" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="601" y="250" width="10" height="78" rx="5" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<circle cx="606" cy="334" r="6" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<line x1="614" y1="334" x2="646" y2="334" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M646,334 H702 V340 L694,346 V352 H656 V346 L648,340 Z" fill="#777" stroke="#333" stroke-width="1.5"/>
<rect x="656" y="352" width="38" height="78" fill="#c9a27a" stroke="#333" stroke-width="2"/>
<path d="M662,372 Q675,368 688,372 M662,396 Q675,392 688,396" fill="none" stroke="#8b6b4b" stroke-width="1"/>
<text x="570" y="452" font-size="13" fill="#0b5cad">anvil face at about</text>
<text x="570" y="468" font-size="13" fill="#0b5cad">the knuckles of your</text>
<text x="570" y="484" font-size="13" fill="#0b5cad">hanging hands</text>

<!-- bottom blast -->
<g transform="translate(0,20)">
<rect x="10" y="490" width="240" height="216" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="22" y="512" font-size="15" font-weight="bold">Bottom blast</text>
<text x="22" y="531" font-size="13">Air enters through the bottom of</text>
<text x="22" y="547" font-size="13">the fire pot, which needs an ash</text>
<text x="22" y="563" font-size="13">door that opens for clearing slag</text>
<g transform="translate(0,16)">
<rect x="70" y="566" width="150" height="76" fill="url(#brick)" stroke="#333" stroke-width="2"/>
<path d="M100,566 Q100,598 130,598 Q160,598 160,566 Z" fill="#3d3d3d" stroke="#333" stroke-width="2"/>
<rect x="123" y="597" width="14" height="45" fill="#fff" stroke="#333" stroke-width="1.5"/>
<rect x="24" y="617" width="99" height="10" fill="#c9a27a" stroke="#333" stroke-width="1.5"/>
<rect x="24" y="620.5" width="100" height="3" fill="#fff"/>
<path d="M24,608 H62" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M130,622 V588" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<rect x="119" y="642" width="22" height="5" fill="#777" stroke="#333" stroke-width="1"/>
<circle cx="119" cy="644.5" r="2.5" fill="#333"/>
<text x="150" y="666" font-size="13">ash door</text>
<text x="150" y="681" font-size="13">(opens)</text>
<line x1="148" y1="660" x2="140" y2="648" stroke="#555" stroke-width="1"/>
</g>

<!-- managing the fire -->
<rect x="260" y="490" width="450" height="216" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="274" y="512" font-size="15" font-weight="bold">Managing the fire</text>
<g font-size="13">
<text x="274" y="534">✓ Keep the fire deep: work buried in the middle, fuel above and below</text>
<text x="274" y="553">✓ Keep the fire bed clean: clear out slag regularly</text>
<text x="290" y="570">(slag blocks the tuyere)</text>
<text x="274" y="589">✓ Turn the work often while heating so it heats evenly</text>
<text x="274" y="608">✓ Don't let the work burn (masses of sparks = the steel is burning)</text>
<text x="274" y="627">✓ When not in use, reduce the air and ring the fire with wet fuel</text>
<text x="290" y="644">to keep it alight</text>
<text x="274" y="663">✓ Fuel lumps walnut-sized and even; coal is best turned into</text>
<text x="290" y="680">coke first</text>
</g>
</g>

<!-- safety -->
<rect x="10" y="738" width="700" height="196" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="24" y="762" font-size="15" font-weight="bold" fill="#c33">⚠ Carbon monoxide builds up when the forge runs in a shed or indoors:</text>
<text x="40" y="781" font-size="15" font-weight="bold" fill="#c33">headache, unconsciousness, even death</text>
<text x="40" y="802" font-size="14">→ ventilation is essential; best under a half-open shed</text>
<text x="24" y="828" font-size="15" font-weight="bold" fill="#c33">⚠ The blast throws sparks and bits of charcoal a long way</text>
<text x="40" y="849" font-size="14">→ clear away flammables; have sand and water ready to put out fires</text>
<text x="24" y="875" font-size="15" font-weight="bold" fill="#c33">⚠ The end of the tuyere near the fire gets extremely hot:</text>
<text x="40" y="896" font-size="14">an iron pipe soon burns out; a fireclay pipe is best;</text>
<text x="40" y="916" font-size="14">keep your hands away from the air pipe</text>
</g>
</svg>
