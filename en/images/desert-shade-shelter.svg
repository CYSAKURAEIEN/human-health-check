<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 864" width="720" height="864" role="img" aria-label="Daytime shade in the desert: a pit shade is a shallow trench long enough to lie in, about 40-60 cm deep, with its long side running east-west; pile the dug-out sand on both sides to hold the edges of the cloth; cover with one cloth, then add a second layer about 20-30 cm above it; the air between insulates; put the light, reflective side up. At midday the surface of sand and rock can be 20-30 °C hotter than the air, while sand a few tens of cm below the surface is much cooler. Shade beside a vehicle: fix one edge of the cloth to the roof or side of the vehicle and prop the other edge up with sticks, stones or the spare wheel, pulled tight with a gap for ventilation; sit on a mat to rest, and do not stay in the vehicle with the doors and windows shut. Daily plan: walk for a few hours around dawn, set up shade in the morning, stay still in the shade from about 10:00 to 18:00, walk again after sunset in the evening, and keep warm at night">
<rect width="100%" height="100%" fill="#fff"/>
<title>Desert shade shelters</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#e08a00"/></marker>
<pattern id="sand" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f1e2bd"/><circle cx="3" cy="4" r="1.1" fill="#c9a865"/><circle cx="10" cy="10" r="0.9" fill="#c9a865"/></pattern>
<pattern id="cool" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#e3d6b6"/><circle cx="3" cy="4" r="1.1" fill="#b39660"/><circle cx="10" cy="10" r="0.9" fill="#b39660"/></pattern>
<g id="sun"><circle r="14" fill="#ffd34d" stroke="#e08a00" stroke-width="2"/><path d="M0,-19 V-25 M0,19 V25 M-19,0 H-25 M19,0 H25 M-13.4,-13.4 L-17.7,-17.7 M13.4,13.4 L17.7,17.7 M-13.4,13.4 L-17.7,17.7 M13.4,-13.4 L17.7,-17.7" stroke="#e08a00" stroke-width="2" stroke-linecap="round"/></g>
<g id="moon"><path d="M4,-12 A12,12 0 1 0 12,6 A9,9 0 1 1 4,-12 Z" fill="#fff3b0" stroke="#7a6a20" stroke-width="1.5"/></g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Desert by day: find or make shade first, then stay still in it</text>

<!-- 1 pit shade -->
<g transform="translate(10,44)">
<rect x="0" y="0" width="700" height="372" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">① Pit shade (cross-section)</text>
<text x="16" y="48" font-size="13" fill="#c33">Cooler, but needs digging:</text>
<text x="16" y="64" font-size="13" fill="#c33">dig only early or late</text>
<!-- sand layers: hot on top, cool below -->
<rect x="20" y="180" width="400" height="22" fill="url(#sand)"/>
<rect x="20" y="202" width="400" height="88" fill="url(#cool)"/>
<!-- trench -->
<path d="M164,180 L168,252 Q169,262 180,262 L266,262 Q277,262 278,252 L282,180 Z" fill="#f7f4ee" stroke="#8a7350" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="20" y1="180" x2="164" y2="180" stroke="#999" stroke-width="3"/>
<line x1="282" y1="180" x2="420" y2="180" stroke="#999" stroke-width="3"/>
<!-- lower cloth -->
<rect x="112" y="174" width="222" height="5" fill="#e9edf0" stroke="#555" stroke-width="1.5"/>
<!-- sand heaps -->
<path d="M58,181 C78,160 104,140 132,140 L150,140 C158,150 164,166 170,181 Z" fill="#e8d3a0" stroke="#8a7350" stroke-width="2"/>
<path d="M276,181 C282,166 288,150 296,140 L314,140 C342,140 368,160 388,181 Z" fill="#e8d3a0" stroke="#8a7350" stroke-width="2"/>
<!-- upper cloth -->
<rect x="118" y="134" width="210" height="5" fill="#f4f6f8" stroke="#555" stroke-width="1.5"/>
<line x1="120" y1="134" x2="326" y2="134" stroke="#9aa7b3" stroke-width="1.5"/>
<path d="M114,140 Q122,124 138,124 Q150,126 154,140 Z" fill="#e8d3a0" stroke="#8a7350" stroke-width="2"/>
<path d="M292,140 Q296,126 308,124 Q324,124 332,140 Z" fill="#e8d3a0" stroke="#8a7350" stroke-width="2"/>
<!-- sun -->
<use href="#sun" transform="translate(240,74)"/>
<path d="M226,92 L200,130 M240,96 L240,130 M254,92 L280,130" stroke="#e08a00" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M206,131 L186,104" stroke="#e08a00" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arO)"/>
<!-- air gap dimension -->
<path d="M196,141 L196,171" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<!-- trench depth dimension -->
<line x1="268" y1="262" x2="306" y2="262" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M300,183 L300,259" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="308" y="218" font-size="14" fill="#0b5cad">about</text>
<text x="308" y="236" font-size="14" fill="#0b5cad">40-60 cm</text>
<text x="308" y="254" font-size="14" fill="#0b5cad">deep</text>
<!-- temperature -->
<text x="26" y="198" font-size="13" fill="#c33">hot surface</text>
<text x="26" y="280" font-size="13" fill="#5a4a2a">cool below</text>
<text x="20" y="314" font-size="13" fill="#c33">⚠ At summer midday, sand and rock surfaces can be 20-30 °C</text>
<text x="20" y="332" font-size="13" fill="#c33">  hotter than the air: sitting or lying on them is like being "seared"</text>
<text x="20" y="356" font-size="13">Shade moves: plan where to shift to as the sun moves round</text>
<!-- labels -->
<line x1="310" y1="136" x2="436" y2="66" stroke="#0b5cad" stroke-width="1"/>
<circle cx="310" cy="136" r="2.5" fill="#0b5cad"/>
<text x="440" y="62" font-size="13" fill="#0b5cad">Upper layer: light, reflective side up</text>
<text x="440" y="78" font-size="13" fill="#0b5cad">(foil blanket silver side up)</text>
<line x1="196" y1="156" x2="436" y2="110" stroke="#0b5cad" stroke-width="1"/>
<circle cx="196" cy="156" r="2.5" fill="#0b5cad"/>
<text x="440" y="110" font-size="13" fill="#0b5cad">Layers about 20-30 cm apart: the air</text>
<text x="440" y="126" font-size="13" fill="#0b5cad">between insulates, much cooler than one</text>
<line x1="250" y1="177" x2="436" y2="160" stroke="#0b5cad" stroke-width="1"/>
<circle cx="250" cy="177" r="2.5" fill="#0b5cad"/>
<text x="440" y="164" font-size="13" fill="#0b5cad">First a cloth over the trench</text>
<line x1="360" y1="168" x2="436" y2="190" stroke="#0b5cad" stroke-width="1"/>
<circle cx="360" cy="168" r="2.5" fill="#0b5cad"/>
<text x="440" y="190" font-size="13" fill="#0b5cad">Dug-out sand heaped on both sides</text>
<text x="440" y="206" font-size="13" fill="#0b5cad">holds the cloth edges down</text>
<text x="223" y="232" font-size="12" fill="#0b5cad" text-anchor="middle">shallow trench,</text>
<text x="223" y="246" font-size="12" fill="#0b5cad" text-anchor="middle">room to lie in</text>
<!-- plan view -->
<text x="440" y="262" font-size="13" fill="#555">From above:</text>
<text x="446" y="306" font-size="15" font-weight="bold" fill="#0b5cad">W</text>
<text x="670" y="306" font-size="15" font-weight="bold" fill="#0b5cad">E</text>
<rect x="472" y="276" width="190" height="46" fill="#e8d3a0" stroke="#8a7350" stroke-width="1.5" rx="4"/>
<rect x="482" y="286" width="170" height="26" fill="#f7f4ee" stroke="#8a7350" stroke-width="1.5" rx="6"/>
<circle cx="498" cy="299" r="8" fill="#f3e3d3" stroke="#333" stroke-width="1.8"/>
<rect x="508" y="291" width="64" height="16" rx="6" fill="#cfe0f0" stroke="#333" stroke-width="1.8"/>
<path d="M572,295 L636,295 M572,303 L636,303" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<path d="M572,295 L636,295 M572,303 L636,303" stroke="#cfe0f0" stroke-width="2.5" stroke-linecap="round"/>
<rect x="476" y="280" width="182" height="38" fill="none" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" rx="3"/>
<text x="440" y="342" font-size="13" fill="#0b5cad">Long side east-west: shaded for</text>
<text x="440" y="358" font-size="13" fill="#0b5cad">most of the day</text>
</g>

<!-- 2 shade beside a vehicle -->
<g transform="translate(10,426)">
<rect x="0" y="0" width="700" height="264" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">② Shade beside a vehicle (seen from the front)</text>
<!-- ground and shadow -->
<rect x="20" y="206" width="390" height="8" fill="url(#sand)"/>
<polygon points="226,206 352,206 342,214 222,214" fill="#cbbf9f"/>
<line x1="20" y1="206" x2="410" y2="206" stroke="#999" stroke-width="3"/>
<!-- vehicle -->
<rect x="66" y="180" width="26" height="28" rx="4" fill="#444"/>
<rect x="198" y="180" width="26" height="28" rx="4" fill="#444"/>
<path d="M84,62 L206,62 L222,108 L68,108 Z" fill="#d7e6f2" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M92,70 L198,70 L210,104 L80,104 Z" fill="#a9c7e0" stroke="#333" stroke-width="1.5"/>
<rect x="56" y="106" width="178" height="78" rx="10" fill="#e9e3d4" stroke="#333" stroke-width="2.5"/>
<rect x="104" y="128" width="82" height="22" rx="3" fill="#bbb" stroke="#333" stroke-width="1.5"/>
<circle cx="80" cy="132" r="10" fill="#fff8d0" stroke="#333" stroke-width="2"/>
<circle cx="210" cy="132" r="10" fill="#fff8d0" stroke="#333" stroke-width="2"/>
<rect x="60" y="164" width="170" height="10" rx="4" fill="#ccc" stroke="#333" stroke-width="1.5"/>
<path d="M68,100 L52,100 L52,112 L64,112" fill="#e9e3d4" stroke="#333" stroke-width="2"/>
<!-- shade cloth -->
<path d="M206,60 L344,128" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<path d="M206,60 L344,128" stroke="#f1d27a" stroke-width="4" stroke-linecap="round"/>
<circle cx="206" cy="60" r="4" fill="#c33"/>
<!-- stick and stones -->
<line x1="344" y1="128" x2="344" y2="204" stroke="#7a5a30" stroke-width="6" stroke-linecap="round"/>
<line x1="344" y1="128" x2="388" y2="200" stroke="#555" stroke-width="1.5"/>
<ellipse cx="390" cy="200" rx="12" ry="7" fill="#9a9a9a" stroke="#333" stroke-width="1.8"/>
<ellipse cx="334" cy="202" rx="9" ry="5" fill="#9a9a9a" stroke="#333" stroke-width="1.5"/>
<ellipse cx="354" cy="202" rx="9" ry="5" fill="#9a9a9a" stroke="#333" stroke-width="1.5"/>
<!-- sun -->
<use href="#sun" transform="translate(372,56)"/>
<path d="M356,70 L316,108 M366,76 L340,116" stroke="#e08a00" stroke-width="1.5" stroke-dasharray="4 3"/>
<!-- ventilation -->
<path d="M232,150 C262,158 296,158 330,150" fill="none" stroke="#0b5cad" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arB)"/>
<!-- seated person -->
<g transform="translate(270,204)">
<rect x="-22" y="-3" width="56" height="5" fill="#b9a27a" stroke="#333" stroke-width="1"/>
<path d="M0,-8 L24,-16 L30,-2" fill="none" stroke="#333" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M0,-8 L24,-16 L30,-2" fill="none" stroke="#cfe0f0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="-9" y="-44" width="17" height="38" rx="7" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M2,-38 L20,-20" stroke="#333" stroke-width="8" stroke-linecap="round"/>
<path d="M2,-38 L20,-20" stroke="#cfe0f0" stroke-width="4.5" stroke-linecap="round"/>
<circle cx="2" cy="-55" r="9" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M11,-57 Q11,-67 1,-67 Q-10,-67 -11,-56 L-13,-40 L-5,-42 L-6,-52 Q-2,-60 11,-57 Z" fill="#fbfaf4" stroke="#333" stroke-width="1.5"/>
</g>
<!-- labels -->
<line x1="206" y1="60" x2="426" y2="44" stroke="#0b5cad" stroke-width="1"/>
<text x="430" y="48" font-size="13" fill="#0b5cad">Shade cloth, tarp or car cover: fix</text>
<text x="430" y="64" font-size="13" fill="#0b5cad">one edge to the roof or body</text>
<line x1="344" y1="150" x2="426" y2="92" stroke="#0b5cad" stroke-width="1"/>
<circle cx="344" cy="150" r="2.5" fill="#0b5cad"/>
<text x="430" y="94" font-size="13" fill="#0b5cad">Prop the other edge up with stones,</text>
<text x="430" y="110" font-size="13" fill="#0b5cad">sticks or the spare wheel: a sloping shade</text>
<line x1="300" y1="156" x2="426" y2="140" stroke="#0b5cad" stroke-width="1"/>
<circle cx="300" cy="156" r="2.5" fill="#0b5cad"/>
<text x="430" y="144" font-size="13" fill="#0b5cad">Pull it tight; leave a gap for air</text>
<line x1="262" y1="190" x2="426" y2="172" stroke="#0b5cad" stroke-width="1"/>
<circle cx="262" cy="190" r="2.5" fill="#0b5cad"/>
<text x="430" y="176" font-size="13" fill="#0b5cad">Cover head and neck; sit on a mat</text>
<text x="430" y="202" font-size="13" font-weight="bold" fill="#c33">⚠ By day, don't sit in a shut vehicle:</text>
<text x="430" y="219" font-size="13" fill="#c33">in sun it soon passes 50-60 °C; open the</text>
<text x="430" y="236" font-size="13" fill="#c33">doors and windows and rest in the shade</text>
<text x="430" y="253" font-size="13" fill="#c33">beside it</text>
</g>

<!-- 3 daily plan -->
<g transform="translate(10,700)">
<rect x="0" y="0" width="700" height="154" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">③ How to plan the day</text>
<rect x="16" y="42" width="112" height="52" rx="6" fill="#e6eef8" stroke="#0b5cad" stroke-width="1.5"/>
<text x="72" y="62" text-anchor="middle" font-size="13" fill="#0b5cad">Around dawn</text>
<text x="72" y="82" text-anchor="middle" font-size="12" font-weight="bold">walk a few hours</text>
<rect x="134" y="42" width="112" height="52" rx="6" fill="#fdf6e0" stroke="#c9a12a" stroke-width="1.5"/>
<text x="190" y="62" text-anchor="middle" font-size="12" fill="#8a6d10">Morning, before</text>
<text x="190" y="76" text-anchor="middle" font-size="12" fill="#8a6d10">the strong sun</text>
<text x="190" y="90" text-anchor="middle" font-size="12" font-weight="bold">set up shade</text>
<rect x="252" y="42" width="196" height="52" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<use href="#sun" transform="translate(280,68) scale(0.7)"/>
<text x="370" y="62" text-anchor="middle" font-size="13" fill="#c33">About 10:00-18:00</text>
<text x="370" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#c33">stay still in the shade</text>
<rect x="454" y="42" width="112" height="52" rx="6" fill="#e6eef8" stroke="#0b5cad" stroke-width="1.5"/>
<text x="510" y="62" text-anchor="middle" font-size="13" fill="#0b5cad">After sunset</text>
<text x="510" y="82" text-anchor="middle" font-size="13" font-weight="bold">walk again</text>
<rect x="572" y="42" width="112" height="52" rx="6" fill="#e3e6f0" stroke="#3b4a7a" stroke-width="1.5"/>
<use href="#moon" transform="translate(590,58) scale(0.6)"/>
<text x="640" y="62" text-anchor="middle" font-size="13" fill="#3b4a7a">At night</text>
<text x="628" y="82" text-anchor="middle" font-size="12" font-weight="bold">walk or rest</text>
<text x="16" y="118" font-size="12">Dig, carry and forage in the cool hours. In winter the days are not hot: walk by day, and focus on keeping warm at night</text>
<text x="16" y="140" font-size="12" fill="#3b4a7a">Nights are cold: a 20-30 °C daily swing is common. Dress before dark; insulate from the ground; sleep out of the wind</text>
</g>
</g>
</svg>
