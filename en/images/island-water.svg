<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1408" width="720" height="1408" role="img" aria-label="Finding water on an island: seawater is about 3.5% salt, so 1 L of seawater holds about 35 g of salt; even at its saltiest, urine from the kidneys is less salty than seawater, so you must pass more than 1 L of urine to get rid of that salt: the more you drink, the thirstier you get, and magnesium salts also cause diarrhoea. Rainwater is the best and safest: 1 mm of rain on 1 m² gives 1 L; a 2 m × 3 m sheet can in theory catch about 60 L in a 10 mm shower, in practice about half. A young green coconut usually holds a few hundred mL; a few a day are enough. Dig in a hollow behind the first dune: rain soaks into the sand and floats on the seawater as a freshwater lens; stop as soon as water seeps in, as digging deeper may reach salt water. Dew and solar stills yield very little and are only a supplement">
<rect width="100%" height="100%" fill="#fff"/>
<title>Finding water on an island</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
<marker id="arW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5b8fc0"/></marker>
<pattern id="sand" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#f1e2bd"/><circle cx="3" cy="4" r="1.1" fill="#c9a865"/><circle cx="10" cy="10" r="0.9" fill="#c9a865"/></pattern>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1.1" fill="#8a7350" fill-opacity="0.45"/><circle cx="10" cy="10" r="0.9" fill="#8a7350" fill-opacity="0.45"/></pattern>
<g id="bottle"><path d="M-6,-34 L6,-34 L6,-26 Q14,-21 14,-12 L14,22 Q14,26 10,26 L-10,26 Q-14,26 -14,22 L-14,-12 Q-14,-21 -6,-26 Z" stroke="#333" stroke-width="2"/></g>
<g id="rain"><path d="M0,0 l-4,10 M14,-6 l-4,10 M28,2 l-4,10 M42,-4 l-4,10" stroke="#5b8fc0" stroke-width="1.6" stroke-linecap="round"/></g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Fresh water on an island: never drink seawater; catch rain first</text>

<!-- 1 why not seawater -->
<g transform="translate(10,44)">
<rect x="0" y="0" width="700" height="280" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">① Why you cannot drink seawater</text>
<rect x="16" y="40" width="146" height="150" rx="6" fill="#eef5fb" stroke="#0b5cad" stroke-width="1.5"/>
<use href="#bottle" transform="translate(52,84)" fill="#8fbcd8"/>
<text x="74" y="72" font-size="15" font-weight="bold">1 L of</text>
<text x="74" y="90" font-size="15" font-weight="bold">seawater</text>
<text x="89" y="140" font-size="13" text-anchor="middle">about 3.5% salt:</text>
<text x="89" y="158" font-size="13" text-anchor="middle">about 35 g of salt</text>
<path d="M164,115 L186,115" stroke="#555" stroke-width="2" marker-end="url(#arG)"/>
<rect x="190" y="40" width="146" height="150" rx="6" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
<path d="M263,52 C240,48 226,64 228,84 C230,104 246,112 262,104 C268,100 264,92 258,90 C250,86 252,74 262,72 C270,70 280,66 278,58 C276,52 270,52 263,52 Z" fill="#d98c7a" stroke="#333" stroke-width="2"/>
<text x="263" y="132" font-size="13" text-anchor="middle">Urine from the</text>
<text x="263" y="148" font-size="13" text-anchor="middle">kidneys, even at its</text>
<text x="263" y="164" font-size="13" text-anchor="middle">saltiest, is less salty</text>
<text x="263" y="180" font-size="13" text-anchor="middle">than seawater</text>
<path d="M338,115 L360,115" stroke="#555" stroke-width="2" marker-end="url(#arG)"/>
<rect x="364" y="40" width="146" height="150" rx="6" fill="#fdf8e4" stroke="#b08a1a" stroke-width="1.5"/>
<use href="#bottle" transform="translate(410,84)" fill="#f2d65a"/>
<use href="#bottle" transform="translate(446,84) scale(0.75)" fill="#f2d65a"/>
<text x="463" y="84" font-size="18" font-weight="bold" fill="#b08a1a">&gt;1 L</text>
<text x="437" y="132" font-size="13" text-anchor="middle">You must pass more</text>
<text x="437" y="148" font-size="13" text-anchor="middle">than 1 L of urine</text>
<text x="437" y="164" font-size="13" text-anchor="middle">to get rid of</text>
<text x="437" y="180" font-size="13" text-anchor="middle">that salt</text>
<path d="M512,97 L534,97" stroke="#555" stroke-width="2" marker-end="url(#arG)"/>
<rect x="538" y="40" width="146" height="150" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="611" y="62" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">The more you drink,</text>
<text x="611" y="79" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">the thirstier you get</text>
<text x="611" y="98" font-size="13" fill="#c33" text-anchor="middle">your body ends up</text>
<text x="611" y="113" font-size="13" fill="#c33" text-anchor="middle">with less water</text>
<text x="611" y="134" font-size="13" text-anchor="middle">Magnesium salts in</text>
<text x="611" y="150" font-size="13" text-anchor="middle">seawater also cause</text>
<text x="611" y="166" font-size="13" text-anchor="middle">diarrhoea, losing</text>
<text x="611" y="182" font-size="13" text-anchor="middle">even more water</text>
<text x="16" y="212" font-size="14"><tspan fill="#c33" font-weight="bold">✗</tspan> Don't drink seawater, and don't mix it into fresh water to "make it go further"</text>
<text x="16" y="231" font-size="14"><tspan fill="#c33" font-weight="bold">✗</tspan> Don't drink urine: it speeds up dehydration too</text>
<text x="16" y="250" font-size="14"><tspan fill="#0b5cad" font-weight="bold">✓</tspan> Seawater is fine for washing things and wetting clothes to cool down; wipe salt off the skin</text>
<text x="32" y="268" font-size="14">with a little fresh water or rainwater, or it easily causes rashes and sores</text>
</g>

<!-- 2 rainwater -->
<g transform="translate(10,334)">
<rect x="0" y="0" width="345" height="422" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">② Rainwater: best and safest</text>
<line x1="16" y1="206" x2="329" y2="206" stroke="#999" stroke-width="3"/>
<!-- trees -->
<line x1="44" y1="206" x2="44" y2="66" stroke="#7a5a30" stroke-width="7" stroke-linecap="round"/>
<line x1="296" y1="206" x2="296" y2="66" stroke="#7a5a30" stroke-width="7" stroke-linecap="round"/>
<!-- stakes -->
<line x1="70" y1="206" x2="70" y2="130" stroke="#7a5a30" stroke-width="5" stroke-linecap="round"/>
<line x1="232" y1="206" x2="232" y2="164" stroke="#7a5a30" stroke-width="5" stroke-linecap="round"/>
<!-- plastic sheet -->
<polygon points="48,84 292,90 226,156 74,128" fill="#dbe9f5" stroke="#3d78ad" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M48,84 L44,82 M292,90 L296,88 M74,128 L70,130 M226,156 L232,164" stroke="#555" stroke-width="2"/>
<use href="#rain" transform="translate(84,48)"/>
<use href="#rain" transform="translate(160,52)"/>
<use href="#rain" transform="translate(226,54)"/>
<path d="M180,108 L214,146" stroke="#5b8fc0" stroke-width="1.5" marker-end="url(#arW)"/>
<!-- runoff and container -->
<path d="M226,158 Q224,166 226,176" stroke="#5b8fc0" stroke-width="3" fill="none"/>
<path d="M206,178 L210,206 L242,206 L246,178" fill="#f4f8fc" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="208.4,192 210,206 242,206 243.6,192" fill="#9cc3e6"/>
<text x="78" y="164" font-size="13" fill="#0b5cad">tie down all</text>
<text x="78" y="180" font-size="13" fill="#0b5cad">four corners,</text>
<text x="78" y="196" font-size="13" fill="#0b5cad">one corner low</text>
<line x1="170" y1="186" x2="222" y2="158" stroke="#0b5cad" stroke-width="1"/>
<g font-size="14">
<text x="16" y="232" font-weight="bold">1 mm of rain on 1 m² gives 1 L</text>
<text x="16" y="256">e.g. a 2 m × 3 m plastic sheet (6 m²) can</text>
<text x="16" y="276">in theory catch about 60 L in a 10 mm</text>
<text x="16" y="296">shower; with losses, expect about half</text>
<text x="16" y="322" fill="#c33">Let the first few minutes of rain rinse the</text>
<text x="16" y="342" fill="#c33">sheet; throw that water away</text>
<text x="16" y="368" font-size="13" fill="#555">Cover the water you collect and keep it in</text>
<text x="16" y="385" font-size="13" fill="#555">the shade; boil it before drinking if you can</text>
</g>
</g>

<!-- 3 coconut water -->
<g transform="translate(365,334)">
<rect x="0" y="0" width="345" height="422" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">③ Coconut water: good, within limits</text>
<ellipse cx="58" cy="90" rx="32" ry="36" fill="#86b84f" stroke="#333" stroke-width="2.5"/>
<path d="M50,58 Q58,52 66,58" fill="none" stroke="#4f7a26" stroke-width="2"/>
<path d="M40,80 Q44,100 54,114" fill="none" stroke="#a8d07a" stroke-width="3" stroke-linecap="round"/>
<text x="102" y="74" font-size="15" font-weight="bold" fill="#3f6a1c">Young green coconut</text>
<text x="102" y="94" font-size="13">green husk; dull slosh when shaken</text>
<text x="102" y="111" font-size="13">lots of water: usually a few</text>
<text x="102" y="128" font-size="13">hundred mL each</text>
<ellipse cx="58" cy="168" rx="26" ry="24" fill="#8a5a2b" stroke="#333" stroke-width="2.5"/>
<path d="M42,160 Q52,150 66,156 M44,176 Q56,170 72,176" fill="none" stroke="#5a3a18" stroke-width="1.5"/>
<text x="102" y="160" font-size="15" font-weight="bold" fill="#6a4318">Ripe brown coconut</text>
<text x="102" y="180" font-size="13">little water; the flesh and milk are</text>
<text x="102" y="197" font-size="13">oily: too much easily causes</text>
<text x="102" y="214" font-size="13">diarrhoea</text>
<g font-size="14">
<text x="16" y="248"><tspan fill="#0b5cad" font-weight="bold">✓</tspan> Water from a freshly opened coconut</text>
<text x="32" y="266">is sterile; drink it straight away</text>
<text x="16" y="290"><tspan fill="#c33" font-weight="bold">✗</tspan> Don't rely on coconut water alone: a few</text>
<text x="32" y="308">a day are enough; too much causes</text>
<text x="32" y="326">diarrhoea, so you lose water instead</text>
<text x="16" y="350"><tspan fill="#c33" font-weight="bold">✗</tspan> High in potassium, low in sodium: it</text>
<text x="32" y="368">cannot replace oral rehydration salts</text>
<text x="16" y="392"><tspan fill="#c33" font-weight="bold">✗</tspan> Don't climb tall palms: pick up fallen</text>
<text x="32" y="410">ones or hook them with a long pole</text>
</g>
</g>

<!-- 4 digging in the beach -->
<g transform="translate(10,766)">
<rect x="0" y="0" width="700" height="436" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">④ Digging for fresh water in the sand (section, height exaggerated)</text>
<!-- salt water -->
<rect x="16" y="130" width="424" height="110" fill="#9fbfd4"/>
<!-- freshwater lens -->
<path d="M100,131 L440,124 L440,214 C330,206 190,170 100,131 Z" fill="#d6edf9"/>
<!-- sand above the water table -->
<path d="M92,134 L130,126 L170,118 C190,96 200,80 215,80 C232,80 250,112 285,120 L330,122 C370,118 400,108 440,104 L440,124 L100,131 Z" fill="url(#sand)"/>
<!-- sand grains (whole subsurface) -->
<path d="M16,174 L92,134 L130,126 L170,118 C190,96 200,80 215,80 C232,80 250,112 285,120 L330,122 C370,118 400,108 440,104 L440,240 L16,240 Z" fill="url(#dots)"/>
<path d="M16,174 L92,134 L130,126 L170,118 C190,96 200,80 215,80 C232,80 250,112 285,120 L330,122 C370,118 400,108 440,104" fill="none" stroke="#8a7350" stroke-width="2.5"/>
<path d="M100,131 C190,170 330,206 440,214" fill="none" stroke="#3d78ad" stroke-width="1.5" stroke-dasharray="5 3"/>
<path d="M16,130 q10,-5 20,0 q10,5 20,0 q10,-5 20,0 q8,4 16,2" fill="none" stroke="#3d78ad" stroke-width="2"/>
<text x="24" y="122" font-size="13" fill="#3d78ad">sea</text>
<text x="26" y="226" font-size="13" fill="#1f4a6a">salt water</text>
<text x="250" y="232" font-size="13" fill="#1f4a6a">salt water (heavier, below)</text>
<text x="262" y="172" font-size="13" fill="#1f4a6a">fresh water (lighter, on top)</text>
<!-- high-tide line -->
<line x1="130" y1="126" x2="130" y2="104" stroke="#555" stroke-width="1" stroke-dasharray="3 2"/>
<text x="130" y="100" font-size="12" fill="#555" text-anchor="middle">high-tide line</text>
<text x="215" y="72" font-size="12" fill="#555" text-anchor="middle">first dune</text>
<!-- rain -->
<use href="#rain" transform="translate(344,68)"/>
<use href="#rain" transform="translate(394,62)"/>
<path d="M372,116 L372,146" stroke="#5b8fc0" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arW)"/>
<path d="M412,110 L412,146" stroke="#5b8fc0" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arW)"/>
<!-- plants -->
<path d="M268,116 l-6,-14 M268,116 l0,-16 M268,116 l6,-14 M346,118 l-6,-14 M346,118 l0,-16 M346,118 l6,-14" stroke="#5f7330" stroke-width="2" stroke-linecap="round"/>
<!-- pit -->
<path d="M296,121 L301,140 Q302,143 305,143 L319,143 Q322,143 323,140 L328,121 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M299.5,127 L301,140 Q302,143 305,143 L319,143 Q322,143 323,140 L324.6,127 Z" fill="#7fb6e0"/>
<path d="M296,121 L328,121" stroke="#8a7350" stroke-width="2"/>
<text x="16" y="44" font-size="13" fill="#555">← sea</text>
<text x="436" y="44" font-size="13" fill="#555" text-anchor="end">inland →</text>
<!-- callouts -->
<line x1="400" y1="190" x2="452" y2="228" stroke="#0b5cad" stroke-width="1"/>
<circle cx="400" cy="190" r="2.5" fill="#0b5cad"/>
<text x="456" y="232" fill="#0b5cad">Rain soaks into the sand and,</text>
<text x="456" y="250" fill="#0b5cad">being lighter than seawater,</text>
<text x="456" y="268" fill="#0b5cad">floats on it (freshwater lens)</text>
<text x="456" y="288" font-size="13" fill="#555">Thicker further from the sea, on</text>
<text x="456" y="304" font-size="13" fill="#555">bigger islands and with more rain;</text>
<text x="456" y="320" font-size="13" fill="#555">very small, low islands may have</text>
<text x="456" y="336" font-size="13" fill="#555">none in the dry season</text>
<line x1="312" y1="118" x2="452" y2="58" stroke="#0b5cad" stroke-width="1"/>
<circle cx="312" cy="118" r="2.5" fill="#0b5cad"/>
<text x="456" y="56" fill="#0b5cad">Dig in a hollow behind the first</text>
<text x="456" y="74" fill="#0b5cad">dune (landward side), or where</text>
<text x="456" y="92" fill="#0b5cad">green plants grow; the further</text>
<text x="456" y="110" fill="#0b5cad">from the sea the better</text>
<line x1="324" y1="136" x2="452" y2="144" stroke="#0b5cad" stroke-width="1"/>
<circle cx="324" cy="136" r="2.5" fill="#0b5cad"/>
<text x="456" y="146" fill="#0b5cad">Stop when the sand turns wet</text>
<text x="456" y="164" fill="#0b5cad">and water starts to seep in</text>
<text x="456" y="182" fill="#c33">The deeper you dig, the more</text>
<text x="456" y="200" fill="#c33">likely you hit the salt water</text>
<g font-size="14">
<text x="16" y="364">Let the water seep in slowly; ladle gently from the top without stirring, and don't scoop it</text>
<text x="16" y="384">dry. Taste a small sip first: if it is clearly salty, dig again further inland.</text>
<text x="16" y="408">Filter through cloth; boil it before drinking if you can. The sides cave in easily: don't dig a</text>
<text x="16" y="428">hole deep enough to stand in, and cover it when you have finished.</text>
</g>
</g>

<!-- 5 dew and 6 distilling -->
<g transform="translate(10,1212)">
<rect x="0" y="0" width="345" height="186" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">⑤ Dew: a supplement only</text>
<g font-size="14">
<text x="16" y="54">Collect before sunrise: wipe grass, plastic</text>
<text x="16" y="72">sheets or the boat hull with a cloth and</text>
<text x="16" y="90">wring it into a container</text>
<text x="16" y="114">Heavy dew may give a few hundred mL an</text>
<text x="16" y="132">hour; usually it is much less</text>
<text x="16" y="156" fill="#c33">Dew wiped off seaside grass or rocks</text>
<text x="16" y="174" fill="#c33">may be salty</text>
</g>
</g>
<g transform="translate(365,1212)">
<rect x="0" y="0" width="345" height="186" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">⑥ Distilling seawater: last resort</text>
<g font-size="14">
<text x="16" y="54">Solar still: tens to a few hundred mL a day;</text>
<text x="16" y="72">one person needs about 4-6 L a day, so you</text>
<text x="16" y="90">would need twenty or thirty or more</text>
<text x="16" y="114">Boiling seawater over a fire and collecting</text>
<text x="16" y="132">the steam gives far more water, but each</text>
<text x="16" y="150">litre of fresh water often burns several kg</text>
<text x="16" y="168">of dry wood</text>
</g>
</g>
</g>
</svg>
