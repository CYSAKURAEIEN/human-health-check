<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 950" width="720" height="950" role="img" aria-label="Genuine Dongchong Xiacao (cordyceps) and common fakes. Cordyceps is a Class II nationally protected wild species: buy, never collect; this diagram is only for checking whether cordyceps you have bought is genuine. The genuine herb has two parts. The body looks like a silkworm, 3-5 cm long, deep yellow to yellowish-brown, with 20-30 rings, finer near the head; the head is reddish-brown; 8 pairs of legs, the middle 4 pairs more distinct; the cross-section is pale yellowish-white, often with a black V-shaped or dotted gut in the middle. The stroma grows from the head of the body: a slender cylinder 4-7 cm long, dark brown to tawny brown, slightly swollen at the top; faintly fishy smell, slightly bitter taste. Fakes: Dican is a plant tuber, spindle-shaped with 4-15 rings, with no legs, no head and no stroma, cut surface whitish, sweet; pieces moulded from flour, bean flour or gypsum are all identical in shape, rings and legs, the cut surface is uniform with no black gut dots, they soften and fall apart in water and turn blue with iodine; pieces weighted with iron wire, bamboo sticks or lead wire, or broken pieces glued together: test with a magnet, hold up to the light, break open the joint, and be suspicious of any that are clearly heavier than others of the same size. Cordyceps is high in arsenic; do not eat large amounts over long periods">
<rect width="100%" height="100%" fill="#fff"/>
<title>Dongchong Xiacao (cordyceps): genuine and common fakes</title>
<defs>
<g id="mini">
<path d="M0 -10 C20 -12 50 -11 74 -8 C80 -7 82 7 74 8 C50 11 20 12 0 10 Z" fill="#d9b65a" stroke="#333" stroke-width="1.2"/>
<ellipse cx="-4" cy="0" rx="6" ry="9" fill="#a4502e" stroke="#333" stroke-width="1.2"/>
<path d="M8 -10 V10 M16 -10.5 V10.5 M24 -11 V11 M32 -11 V11 M40 -11 V11 M48 -10.5 V10.5 M56 -10 V10 M64 -9.5 V9.5 M71 -9 V9" stroke="#8a6a2a" stroke-width="0.9"/>
<path d="M6 10 q3 4 6 0 M14 10.5 q3 4 6 0 M30 11 q3 5 6 0 M40 11 q3 5 6 0 M50 10.5 q3 5 6 0 M60 10 q3 5 6 0 M72 8 q3 4 6 0" stroke="#333" stroke-width="1" fill="#d9b65a"/>
<path d="M-6 -8 C-9 -30 -4 -50 -8 -66" stroke="#6b4a2a" stroke-width="3.5" fill="none"/>
<ellipse cx="-8" cy="-68" rx="3" ry="9" fill="#5a3d22"/>
</g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Dongchong Xiacao (cordyceps): genuine vs common fakes (schematic)</text>
<text x="360" y="52" font-size="13" fill="#c33" text-anchor="middle">A Class II nationally protected wild species: buy only, never collect —</text>
<text x="360" y="68" font-size="13" fill="#c33" text-anchor="middle">this diagram is only for checking whether cordyceps you have bought is genuine (not to scale)</text>
<g transform="translate(0 16)">

<!-- 1 genuine -->
<rect x="10" y="66" width="700" height="310" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="26" y="94" font-size="18" font-weight="bold">① Genuine: the "worm" below, the "grass" above</text>
<!-- stroma -->
<path d="M150 288 C144 250 152 200 146 150" stroke="#6b4a2a" stroke-width="8" fill="none" stroke-linecap="round"/>
<ellipse cx="146" cy="138" rx="7" ry="22" fill="#5a3d22" stroke="#333" stroke-width="1"/>
<!-- body -->
<path d="M160 282 C220 278 300 280 350 286 C366 289 372 300 364 308 C340 318 230 320 160 318 Z" fill="#d9b65a" stroke="#333" stroke-width="1.6"/>
<ellipse cx="152" cy="300" rx="14" ry="17" fill="#a4502e" stroke="#333" stroke-width="1.6"/>
<g stroke="#8a6a2a" stroke-width="1.1" fill="none">
<path d="M168 282 V318 M175 282 V318 M182 281.5 V318.5 M189 281 V319 M196 281 V319"/>
<path d="M204 280.5 V319.5 M213 280 V320 M222 280 V320 M231 280 V320 M240 280 V320 M249 280 V320 M258 280.5 V320 M267 281 V320 M276 281 V320 M285 281.5 V319.5 M294 282 V319 M303 282.5 V318.5 M312 283 V318 M321 284 V317 M330 284.5 V316 M339 285.5 V314 M348 287 V312 M356 289 V310"/>
</g>
<g fill="#d9b65a" stroke="#333" stroke-width="1.2">
<path d="M166 318 q3 5 6 0"/><path d="M178 318.5 q3 5 6 0"/><path d="M190 319 q3 5 6 0"/>
<path d="M232 320 q4.5 8 9 0"/><path d="M252 320 q4.5 8 9 0"/><path d="M272 320 q4.5 8 9 0"/><path d="M292 319 q4.5 8 9 0"/>
<path d="M352 311 q3 5 6 0"/>
</g>
<!-- pointers -->
<g stroke="#0b5cad" stroke-width="1" fill="#0b5cad">
<line x1="152" y1="180" x2="186" y2="168"/><circle cx="152" cy="180" r="2.2"/>
<line x1="146" y1="126" x2="186" y2="124"/><circle cx="146" cy="126" r="2.2"/>
<line x1="140" y1="292" x2="104" y2="266"/><circle cx="140" cy="292" r="2.2"/>
<line x1="320" y1="296" x2="384" y2="236"/><circle cx="320" cy="296" r="2.2"/>
<line x1="185" y1="298" x2="200" y2="356"/><circle cx="185" cy="298" r="2.2"/>
<line x1="276" y1="326" x2="384" y2="324"/><circle cx="276" cy="326" r="2.2"/>
</g>
<text x="190" y="128" font-size="14">Top slightly swollen</text>
<text x="190" y="164" font-size="15"><tspan font-weight="bold">Stroma</tspan>: grows from the <tspan font-weight="bold">head</tspan></text>
<text x="190" y="183" font-size="13">slender cylinder, 4-7 cm long,</text>
<text x="190" y="200" font-size="13">dark brown to tawny brown</text>
<text x="26" y="238" font-size="15" font-weight="bold">Head</text>
<text x="26" y="256" font-size="15" font-weight="bold">reddish-brown</text>
<text x="388" y="206" font-size="14" font-weight="bold">Body like a silkworm,</text>
<text x="388" y="223" font-size="13">3-5 cm long; deep</text>
<text x="388" y="239" font-size="13">yellow to yellowish-</text>
<text x="388" y="255" font-size="13">brown; <tspan font-weight="bold">20-30 rings</tspan></text>
<text x="388" y="322" font-size="15" font-weight="bold">8 pairs of legs,</text>
<text x="388" y="340" font-size="13">the middle 4 pairs more distinct</text>
<text x="388" y="362" font-size="13" fill="#555">Faintly fishy smell, slightly bitter taste</text>
<text x="150" y="370" font-size="13">Rings finer near the head</text>
<!-- cross-section -->
<rect x="548" y="82" width="150" height="204" rx="6" fill="none" stroke="#0b5cad" stroke-width="1" stroke-dasharray="5 3"/>
<text x="623" y="99" font-size="12" fill="#0b5cad" text-anchor="middle">Body cross-section</text>
<text x="623" y="113" font-size="12" fill="#0b5cad" text-anchor="middle">(enlarged)</text>
<g transform="translate(0 4)">
<circle cx="623" cy="150" r="34" fill="#f3ead0" stroke="#333" stroke-width="1.6"/>
<path d="M613 142 L623 158 L633 142" stroke="#222" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
</g>
<text x="623" y="210" font-size="13" text-anchor="middle">Pale yellowish-white;</text>
<text x="623" y="226" font-size="13" text-anchor="middle">a <tspan font-weight="bold">black "V"-shaped</tspan></text>
<text x="623" y="242" font-size="13" text-anchor="middle" font-weight="bold">or dotted gut</text>
<text x="623" y="258" font-size="13" text-anchor="middle">often seen in the</text>
<text x="623" y="274" font-size="13" text-anchor="middle">middle (experience)</text>

<!-- 2 Dican -->
<rect x="10" y="390" width="228" height="300" rx="8" fill="none" stroke="#c33" stroke-width="2"/>
<text x="24" y="416" font-size="16" font-weight="bold" fill="#c33">② Dican (plant tuber)</text>
<text x="24" y="436" font-size="12" fill="#555">Tubers of the Lamiaceae plants</text>
<text x="24" y="451" font-size="12" fill="#555" font-style="italic">Stachys geminata</text>
<text x="24" y="466" font-size="12" fill="#555">and Chinese artichoke</text>
<g transform="translate(0 16)">
<path d="M44 490 C70 470 170 470 200 490 C170 510 70 510 44 490 Z" fill="#efe6d0" stroke="#333" stroke-width="1.5"/>
<g stroke="#9a8a6a" stroke-width="1.2" fill="none"><path d="M70 478 C66 486 66 494 70 502"/><path d="M90 474 C86 484 86 496 90 506"/><path d="M110 473 C106 483 106 497 110 507"/><path d="M130 473 C126 483 126 497 130 507"/><path d="M150 474 C146 484 146 496 150 506"/><path d="M170 477 C166 486 166 494 170 503"/></g>
</g>
<text x="124" y="550" font-size="13" text-anchor="middle">Spindle-shaped, 4-15 rings</text>
<text x="124" y="576" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">No legs, no head,</text>
<text x="124" y="596" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">no stroma</text>
<text x="124" y="624" font-size="13" text-anchor="middle">Cut surface whitish;</text>
<text x="124" y="642" font-size="13" text-anchor="middle">tastes sweet</text>

<!-- 3 moulded -->
<rect x="246" y="390" width="228" height="300" rx="8" fill="none" stroke="#c33" stroke-width="2"/>
<text x="260" y="416" font-size="16" font-weight="bold" fill="#c33">③ Moulded fakes</text>
<text x="260" y="436" font-size="12" fill="#555">Flour, bean flour or gypsum</text>
<text x="260" y="451" font-size="12" fill="#555">pressed in a mould</text>
<g transform="translate(0 16)">
<use href="#mini" transform="translate(274 494) scale(0.6)"/>
<use href="#mini" transform="translate(340 494) scale(0.6)"/>
<use href="#mini" transform="translate(406 494) scale(0.6)"/>
</g>
<text x="360" y="542" font-size="13" text-anchor="middle">Every piece: shape, rings, legs</text>
<text x="360" y="560" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">identical — too neat</text>
<text x="304" y="584" font-size="13">Cut surface uniform,</text>
<text x="304" y="600" font-size="13">no black gut dots</text>
<text x="360" y="630" font-size="13" text-anchor="middle">Softens and falls apart in water;</text>
<text x="360" y="650" font-size="13" text-anchor="middle">iodine turns it blue (starch)</text>

<!-- 4 weighted / glued -->
<rect x="482" y="390" width="228" height="300" rx="8" fill="none" stroke="#c33" stroke-width="2"/>
<text x="496" y="416" font-size="16" font-weight="bold" fill="#c33">④ Weighted or glued</text>
<text x="496" y="436" font-size="12" fill="#555">Iron wire, bamboo sticks, lead wire</text>
<text x="496" y="451" font-size="12" fill="#555">inserted; broken pieces glued</text>
<g transform="translate(0 16)">
<use href="#mini" transform="translate(530 510) scale(0.9)"/>
<path d="M528 510 H594" stroke="#555" stroke-width="2" stroke-dasharray="5 3"/>
<path d="M519 478 H529" stroke="#c33" stroke-width="2"/>
<ellipse cx="524" cy="478" rx="5" ry="2.5" fill="#f5e9a0" stroke="#c33" stroke-width="1"/>
<!-- magnet -->
<path d="M650 488 h-14 a14 14 0 0 0 0 28 h14 v-8 h-14 a6 6 0 0 1 0 -12 h14 z" fill="#c33" stroke="#333" stroke-width="1"/>
<rect x="644" y="488" width="8" height="8" fill="#ddd" stroke="#333" stroke-width="1"/>
<rect x="644" y="508" width="8" height="8" fill="#ddd" stroke="#333" stroke-width="1"/>
<g stroke="#0b5cad" stroke-width="1" fill="#0b5cad">
<line x1="580" y1="510" x2="592" y2="530"/><circle cx="580" cy="510" r="2.2"/>
<line x1="529" y1="478" x2="560" y2="470"/><circle cx="529" cy="478" r="2"/>
</g>
</g>
<text x="564" y="484" font-size="12">Glued joint:</text>
<text x="564" y="499" font-size="12">break it open</text>
<text x="596" y="564" font-size="13" text-anchor="middle">Metal inside: use a magnet,</text>
<text x="596" y="580" font-size="13" text-anchor="middle">hold it up to the light</text>
<text x="596" y="612" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">Clearly heavier than</text>
<text x="596" y="631" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">others the same size?</text>
<text x="596" y="650" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">Be suspicious</text>

<!-- bottom -->
<rect x="10" y="704" width="700" height="216" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="732" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">🛡️ Collecting, selling and buying require a permit by law —</text>
<text x="360" y="752" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">do not dig wild cordyceps</text>
<text x="360" y="778" font-size="13" text-anchor="middle">Other cordyceps such as Yaxiangbang chongcao: the body often has a greyish-white or whitish fungal</text>
<text x="360" y="795" font-size="13" text-anchor="middle">coat, rings and legs less distinct than in the genuine herb, stroma often branched or a different colour</text>
<text x="360" y="818" font-size="13" text-anchor="middle">"Chongcaohua" ("cordyceps flowers") is the orange-yellow fruiting body of <tspan font-style="italic">Cordyceps militaris</tspan>,</text>
<text x="360" y="835" font-size="13" text-anchor="middle">not the same thing as Dongchong Xiacao</text>
<text x="360" y="862" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">Dongchong Xiacao is high in arsenic: do not eat large amounts</text>
<text x="360" y="881" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">over long periods as a health supplement</text>
<text x="360" y="906" font-size="14" text-anchor="middle">Very expensive and its benefits overhyped; it cannot replace any proper treatment</text>
</g>
</g>
</svg>
