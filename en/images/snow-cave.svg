<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1018" width="720" height="1018" role="img" aria-label="Snow cave and quinzhee in section: dig the snow cave into a drift at least about 2 m deep; the entrance is small, about 60 cm wide, and below the sleeping platform; the inside is domed and the roof at least 30 cm thick; a cold sink lower than the platform is dug inside, where cold air sinks while warm air rises; poke a vent about as thick as a fist at an angle through the roof above the platform and leave a stick in it; mark the entrance outside. For a quinzhee, first pile a mound about 3 m across and about 2 m high, wait 1-2 hours, push in a ring of sticks about 30 cm long, hollow it out from one side and stop when you reach the stick ends, leaving walls 20-30 cm thick. Never burn charcoal for heat or sleep with a stove lit in a snow cave or quinzhee">
<rect width="100%" height="100%" fill="#fff"/>
<title>Snow cave and quinzhee in section</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<g id="mound"><line x1="10" y1="160" x2="216" y2="160" stroke="#999" stroke-width="3"/><path d="M38,160 A75,100 0 0 1 188,160 Z" fill="#eef4fa" stroke="#8aa9c4" stroke-width="2"/></g>
<g id="sticks" stroke="#8b6b3e" stroke-width="3" stroke-linecap="round"><line x1="185.4" y1="134.1" x2="171" y2="138"/><line x1="172.1" y1="98.4" x2="160.3" y2="107.7"/><line x1="148.2" y1="71.7" x2="141.2" y2="84.9"/><line x1="77.8" y1="71.7" x2="84.8" y2="84.9"/><line x1="53.9" y1="98.4" x2="65.7" y2="107.7"/><line x1="45" y1="117.7" x2="58.6" y2="124"/></g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Snow cave and quinzhee (section): low entrance, high platform, always ventilate</text>

<!-- 1 snow cave -->
<g transform="translate(10,44)">
<rect x="0" y="0" width="700" height="432" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">Snow cave: dig into a deep drift or snowy slope</text>
<text x="16" y="48" font-size="13">(a drift on the lee slope is best)</text>
<line x1="8" y1="340" x2="692" y2="340" stroke="#999" stroke-width="3"/>
<path d="M14,340 C60,339 98,326 106,300 L110,262 C122,180 190,100 320,90 L690,88 L690,340 Z" fill="#eef4fa" stroke="#8aa9c4" stroke-width="2"/>
<!-- inside space -->
<path d="M98,310 L330,310 L330,250 L505,250 C512,190 470,140 400,138 C330,136 268,175 262,255 L110,255 Z" fill="#fff"/>
<path d="M102,310 L330,310 L330,250 L505,250 C512,190 470,140 400,138 C330,136 268,175 262,255 L110,255" fill="none" stroke="#6d8fb0" stroke-width="2.5" stroke-linejoin="round"/>
<!-- vent and stick -->
<line x1="432" y1="150" x2="401" y2="86" stroke="#6d8fb0" stroke-width="13"/>
<line x1="433" y1="152" x2="400" y2="84" stroke="#fff" stroke-width="9"/>
<line x1="432.8" y1="151.7" x2="390.8" y2="66.2" stroke="#8b6b3e" stroke-width="3.5" stroke-linecap="round"/>
<!-- platform, mat, person -->
<rect x="345" y="244" width="150" height="6" fill="#c9a36b" stroke="#8a6d3e" stroke-width="1"/>
<rect x="352" y="226" width="118" height="18" rx="9" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="480" cy="234" r="9" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<!-- snow block partly closing the entrance -->
<rect x="116" y="284" width="26" height="26" fill="#dfe9f3" stroke="#6d8fb0" stroke-width="1.5"/>
<!-- entrance marker -->
<line x1="50" y1="340" x2="50" y2="262" stroke="#8b6b3e" stroke-width="4" stroke-linecap="round"/>
<path d="M51,264 L76,271 L51,280 Z" fill="#c33"/>
<!-- air flow -->
<path d="M300,226 L300,290" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<path d="M282,296 L172,296" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<path d="M452,222 Q464,196 450,168" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M392,222 Q380,196 394,170" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<!-- dimension: snow depth -->
<path d="M664,92 L664,338" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="662" y="290" font-size="13" fill="#0b5cad" text-anchor="end">snow at least</text>
<text x="662" y="306" font-size="13" fill="#0b5cad" text-anchor="end">about 2 m deep</text>
<!-- dimension: roof thickness -->
<path d="M350,93 L350,141" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="342" y="114" font-size="13" fill="#0b5cad" text-anchor="end">roof at least</text>
<text x="342" y="130" font-size="13" fill="#0b5cad" text-anchor="end">30 cm thick</text>
<!-- labels -->
<line x1="404" y1="92" x2="444" y2="52" stroke="#0b5cad" stroke-width="1"/>
<circle cx="404" cy="92" r="2.5" fill="#0b5cad"/>
<text x="448" y="42" font-size="12" fill="#0b5cad">Vent: poke at an angle through the roof</text>
<text x="448" y="56" font-size="12" fill="#0b5cad">above the platform, about fist-thick;</text>
<text x="448" y="70" font-size="12" fill="#0b5cad">leave a stick in it and twist it every</text>
<text x="448" y="84" font-size="12" fill="#0b5cad">hour or two so it doesn't block</text>
<line x1="54" y1="268" x2="40" y2="214" stroke="#0b5cad" stroke-width="1"/>
<circle cx="54" cy="268" r="2.5" fill="#0b5cad"/>
<text x="16" y="150" font-size="12" fill="#0b5cad">Mark the entrance</text>
<text x="16" y="164" font-size="12" fill="#0b5cad">with a branch, ski</text>
<text x="16" y="178" font-size="12" fill="#0b5cad">pole or bright item</text>
<text x="16" y="192" font-size="12" fill="#0b5cad">(in case snow</text>
<text x="16" y="206" font-size="12" fill="#0b5cad">buries it)</text>
<line x1="494" y1="186" x2="528" y2="146" stroke="#0b5cad" stroke-width="1"/>
<circle cx="494" cy="186" r="2.5" fill="#0b5cad"/>
<text x="532" y="112" font-size="12" fill="#0b5cad">Domed (stable);</text>
<text x="532" y="126" font-size="12" fill="#0b5cad">smooth the ceiling so</text>
<text x="532" y="140" font-size="12" fill="#0b5cad">meltwater runs down</text>
<text x="532" y="154" font-size="12" fill="#0b5cad">the curve, not onto you</text>
<line x1="495" y1="247" x2="528" y2="214" stroke="#0b5cad" stroke-width="1"/>
<circle cx="495" cy="247" r="2.5" fill="#0b5cad"/>
<text x="532" y="196" font-size="12" fill="#0b5cad">Sleeping platform</text>
<text x="532" y="210" font-size="12" fill="#0b5cad">above the entrance;</text>
<text x="532" y="224" font-size="12" fill="#0b5cad">a mat on top keeps</text>
<text x="532" y="238" font-size="12" fill="#0b5cad">off the cold snow</text>
<text x="418" y="196" font-size="13" fill="#c33" text-anchor="middle">warm</text>
<line x1="186" y1="282" x2="150" y2="352" stroke="#0b5cad" stroke-width="1"/>
<circle cx="186" cy="282" r="2.5" fill="#0b5cad"/>
<text x="16" y="368" font-size="13" fill="#0b5cad">Small entrance, just big enough to</text>
<text x="16" y="384" font-size="13" fill="#0b5cad">crawl in (about 60 cm wide), below</text>
<text x="16" y="400" font-size="13" fill="#0b5cad">the platform; can be partly blocked</text>
<text x="16" y="416" font-size="13" fill="#0b5cad">with snow blocks or a pack</text>
<line x1="312" y1="304" x2="322" y2="352" stroke="#0b5cad" stroke-width="1"/>
<circle cx="312" cy="304" r="2.5" fill="#0b5cad"/>
<text x="286" y="368" font-size="13" fill="#0b5cad">Cold sink: below the</text>
<text x="286" y="384" font-size="13" fill="#0b5cad">platform; cold air</text>
<text x="286" y="400" font-size="13" fill="#0b5cad">collects here</text>
<path d="M470,364 L506,364" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="514" y="369" font-size="13" fill="#c33">warm air rises to the top</text>
<path d="M470,388 L506,388" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="514" y="393" font-size="13" fill="#0b5cad">cold air sinks and flows</text>
<text x="514" y="409" font-size="13" fill="#0b5cad">out of the entrance</text>
</g>

<!-- 2 quinzhee -->
<g transform="translate(0,12)">
<text x="16" y="490" font-size="17" font-weight="bold">Quinzhee: snow too shallow to dig a cave, but enough to pile up</text>

<g transform="translate(10,500)">
<rect x="0" y="0" width="226" height="256" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">① Pile up a big mound</text>
<use href="#mound"/>
<line x1="113" y1="60" x2="208" y2="60" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M202,62 L202,158" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="160" y="52" font-size="13" fill="#0b5cad" text-anchor="middle">about 2 m high</text>
<path d="M41,148 L185,148" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="113" y="140" font-size="13" fill="#0b5cad" text-anchor="middle">about 3 m across</text>
<text x="12" y="186" font-size="13">Big enough for two; mix the</text>
<text x="12" y="204" font-size="13">snow from different layers as</text>
<text x="12" y="222" font-size="13">you pile it so it sets faster</text>
</g>

<g transform="translate(247,500)">
<rect x="0" y="0" width="226" height="256" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">② Let it set, add sticks</text>
<use href="#mound"/>
<use href="#sticks"/>
<line x1="113" y1="60" x2="113" y2="75" stroke="#8b6b3e" stroke-width="3" stroke-linecap="round"/>
<g transform="translate(188,52)"><circle r="13" fill="#fff" stroke="#333" stroke-width="2"/><path d="M0,0 L0,-8 M0,0 L6,3" stroke="#333" stroke-width="2" stroke-linecap="round"/></g>
<text x="12" y="186" font-size="13">Wait 1-2 hours (about 3 hours</text>
<text x="12" y="204" font-size="13">for dry powder or severe cold);</text>
<text x="12" y="222" font-size="13">push in a ring of sticks about</text>
<text x="12" y="240" font-size="13">30 cm long from outside</text>
</g>

<g transform="translate(484,500)">
<rect x="0" y="0" width="226" height="256" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">③ Dig out to the sticks</text>
<use href="#mound"/>
<path d="M36,158 L80,158 L80,140 L171.3,140 A60,85 0 0 0 55.9,134 L36,134 Z" fill="#fff"/>
<path d="M38,158 L80,158 L80,140 L171.3,140 A60,85 0 0 0 55.9,134 L40,134" fill="none" stroke="#6d8fb0" stroke-width="2" stroke-linejoin="round"/>
<line x1="113" y1="58" x2="113" y2="77" stroke="#6d8fb0" stroke-width="9"/>
<line x1="113" y1="56" x2="113" y2="79" stroke="#fff" stroke-width="5"/>
<use href="#sticks"/>
<rect x="88" y="136" width="76" height="4" fill="#c9a36b"/>
<text x="132" y="126" font-size="12" fill="#0b5cad" text-anchor="middle">sleeping platform</text>
<text x="6" y="126" font-size="12" fill="#0b5cad">entrance</text>
<line x1="113" y1="66" x2="70" y2="46" stroke="#0b5cad" stroke-width="1"/>
<circle cx="113" cy="66" r="2" fill="#0b5cad"/>
<text x="20" y="46" font-size="13" fill="#0b5cad">vent</text>
<line x1="180" y1="112" x2="196" y2="72" stroke="#0b5cad" stroke-width="1"/>
<circle cx="180" cy="112" r="2" fill="#0b5cad"/>
<text x="214" y="60" font-size="13" fill="#0b5cad" text-anchor="end">walls 20-30 cm</text>
<text x="12" y="186" font-size="13">Hollow it from one side, digging</text>
<text x="12" y="204" font-size="13">up to a sleeping platform; stop</text>
<text x="12" y="222" font-size="13">at the stick ends so the walls</text>
<text x="12" y="240" font-size="13">are even; leave a vent</text>
</g>

</g>
<g transform="translate(0,28)">
<rect x="10" y="754" width="700" height="224" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="26" y="778" font-size="14" fill="#c33" font-weight="bold">✗ Never burn charcoal for heat in a snow cave or quinzhee, or sleep with a stove lit</text>
<text x="40" y="796" font-size="14" fill="#c33" font-weight="bold">(carbon monoxide is colourless, odourless and deadly)</text>
<text x="26" y="820" font-size="14">Cook outside or at the entrance if you can; if you must use a stove inside, open the</text>
<text x="26" y="838" font-size="14">entrance and the vent, and put it out as soon as you have finished</text>
<text x="26" y="862" font-size="14">✓ Keep the vent clear at all times and never seal the entrance completely; if it snows</text>
<text x="40" y="880" font-size="14">at night, get up and check once</text>
<text x="26" y="904" font-size="14">✓ A snow cave takes 2-3 hours to dig: start well before dark. Take a shovel (or pot)</text>
<text x="40" y="922" font-size="14">inside so you can dig yourself out if it collapses</text>
<text x="26" y="946" font-size="14">✓ It can reach 0°C inside (relatively warm when it is below zero outside); dig in just a</text>
<text x="40" y="964" font-size="14">base layer and windproof layer, slowly, so you don't sweat</text>
</g>
</g>
</svg>
