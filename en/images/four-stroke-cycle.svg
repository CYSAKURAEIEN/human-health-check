<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 812" width="720" height="812" role="img" aria-label="The four-stroke cycle. 1. Intake: the piston moves down and draws in air (and fuel); inlet valve open, exhaust valve closed. 2. Compression: the piston moves up and compresses the mixture; both valves closed. 3. Power: ignition (or compression ignition); the burning gas expands and pushes the piston down; both valves closed. 4. Exhaust: the piston moves up and pushes out the exhaust gas; exhaust valve open, inlet valve closed. The crankshaft turns half a turn per stroke, two turns for the four strokes, completing one cycle. Petrol engine: spark plug ignition, compression ratio about 8-12, efficiency about 25-30%. Diesel engine: air is compressed until very hot and injected diesel ignites by itself, compression ratio about 15-22, efficiency about 35-40% or more. The carbon monoxide in engine exhaust is colourless and odourless; running an engine indoors can kill" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>The four-stroke cycle</title>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker></defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">The four-stroke cycle of an internal combustion engine (schematic)</text>
<text x="360" y="52" font-size="15" text-anchor="middle">Intake → compression → power → exhaust, over and over;</text>
<text x="360" y="70" font-size="15" text-anchor="middle">only in the power stroke does the burning gas push the piston</text>
