<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 902" width="720" height="902" role="img" aria-label="Drilling steps. 1 Mark out and centre-punch the centre of the hole, so the drill does not wander. 2 Clamp the workpiece in the vice or on the drill-press table; never hold small work by hand when drilling, or it will spin round if the drill grabs. 3 For a large hole, drill a small pilot hole first, then open it up with the large drill. 4 When drilling steel, cool and lubricate with machine oil or soapy water; drill cast iron and brass dry. 5 Ease the pressure as the drill is about to break through; it tends to grab suddenly. 6 When drilling deep holes, withdraw the drill often to clear the chips. Speed: the larger the drill, the lower the speed; the harder the material, the lower the speed. Safety: rotating machines catch gloves, cuffs and long hair, so wear no gloves on a drill press, fasten your cuffs and tie long hair up; flying chips can injure your eyes, so wear safety goggles; do not wipe chips away by hand, use a brush or hook" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Drilling steps</title>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker></defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Drilling: locate first, then clamp; small hole before large</text>
<text x="360" y="52" font-size="14" text-anchor="middle">Centre punch → clamp → pilot hole → open up; cool steel; ease off before breakthrough</text>
<g transform="translate(10,64)">
<rect width="226" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">① Mark out, centre-punch</text>
<g transform="translate(0,10)"><rect x="18" y="128" width="120" height="34" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><path d="M74,124 l4,4 l4,-4" fill="none" stroke="#333" stroke-width="1.2"/><path d="M75,60 H81 V118 L78,126 L75,118 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><rect x="54" y="38" width="44" height="16" rx="2" fill="#777" stroke="#333" stroke-width="1.5"/><path d="M98,46 L138,40" stroke="#c9a66b" stroke-width="6" stroke-linecap="round"/><line x1="48" y1="66" x2="48" y2="96" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/><text x="88" y="88" font-size="13">centre</text><text x="88" y="102" font-size="13">punch</text><rect x="156" y="70" width="56" height="56" fill="#d6dde4" stroke="#333" stroke-width="1.5"/><path d="M184,64 V132 M150,98 H218" stroke="#0b5cad" stroke-width="1.3"/><circle cx="184" cy="98" r="3.5" fill="#333"/><text x="184" y="148" font-size="12" text-anchor="middle" fill="#0b5cad">marked lines</text><text x="184" y="162" font-size="12" text-anchor="middle" fill="#0b5cad">(top view)</text></g>
<text x="113" y="210" font-size="14" text-anchor="middle" fill="#222">Centre-punch the middle</text>
<text x="113" y="229" font-size="14" text-anchor="middle" fill="#222">of the hole (so the drill</text>
<text x="113" y="248" font-size="14" text-anchor="middle" fill="#222">does not wander)</text>
</g>
<g transform="translate(247,64)">
<rect width="226" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">② Clamp the workpiece</text>
<rect x="30" y="160" width="128" height="10" fill="#6f7983" stroke="#333" stroke-width="1.5"/><rect x="36" y="112" width="30" height="48" fill="#8a949e" stroke="#333" stroke-width="1.8"/><rect x="122" y="112" width="30" height="48" fill="#8a949e" stroke="#333" stroke-width="1.8"/><path d="M152,136 H176 M176,126 V146" stroke="#555" stroke-width="3"/><rect x="66" y="104" width="56" height="44" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><line x1="58" y1="128" x2="64" y2="128" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/><line x1="130" y1="128" x2="124" y2="128" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/><path d="M88.0,66 V96.4 L94,100 L100.0,96.4 V66 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><path d="M88.0,94.4 L100.0,87.2 M88.0,83.6 L100.0,76.4" stroke="#555" stroke-width="1.2"/><path d="M82.0,66 L78,44 H110 L106.0,66 Z" fill="#777" stroke="#333" stroke-width="1.5"/><text x="190" y="104" font-size="13" text-anchor="middle">vice</text><line x1="182" y1="108" x2="152" y2="118" stroke="#555" stroke-width="1"/>
<text x="113" y="210" font-size="14" text-anchor="middle" fill="#222">Clamp it in the vice or on</text>
<text x="113" y="229" font-size="14" text-anchor="middle" fill="#222">the drill-press table</text>
<text x="113" y="248" font-size="14" text-anchor="middle" fill="#c33" font-weight="bold">✗ Never hold small</text>
<text x="113" y="267" font-size="14" text-anchor="middle" fill="#c33" font-weight="bold">work by hand</text>
<text x="113" y="286" font-size="14" text-anchor="middle" fill="#222">(it spins if the drill grabs)</text>
</g>
<g transform="translate(484,64)">
<rect width="226" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">③ Small hole first</text>
<rect x="14" y="110" width="92" height="44" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><rect x="56" y="110" width="8" height="44" fill="#fff" stroke="#333" stroke-width="1.2"/><path d="M56.0,66 V101.6 L60,104 L64.0,101.6 V66 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><path d="M56.0,99.6 L64.0,94.8 M56.0,92.4 L64.0,87.6 M56.0,85.2 L64.0,80.4 M56.0,78.0 L64.0,73.2" stroke="#555" stroke-width="1.2"/><path d="M50.0,66 L44,44 H76 L70.0,66 Z" fill="#777" stroke="#333" stroke-width="1.5"/><text x="60" y="172" font-size="13" text-anchor="middle" fill="#0b5cad">pilot hole</text><line x1="108" y1="96" x2="124" y2="96" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/><rect x="126" y="110" width="92" height="44" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><rect x="160" y="110" width="24" height="44" fill="#fff" stroke="#333" stroke-width="1.2"/><path d="M168,110 V154 M176,110 V154" stroke="#999" stroke-width="1" stroke-dasharray="3 2"/><path d="M160.0,66 V96.8 L172,104 L184.0,96.8 V66 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><path d="M160.0,94.8 L184.0,80.4" stroke="#555" stroke-width="1.2"/><path d="M154.0,66 L156,44 H188 L190.0,66 Z" fill="#777" stroke="#333" stroke-width="1.5"/><text x="172" y="172" font-size="13" text-anchor="middle" fill="#0b5cad">open up with</text><text x="172" y="187" font-size="13" text-anchor="middle" fill="#0b5cad">the large drill</text>
<text x="113" y="210" font-size="14" text-anchor="middle" fill="#222">For a large hole, drill a</text>
<text x="113" y="229" font-size="14" text-anchor="middle" fill="#222">small pilot hole first, then</text>
<text x="113" y="248" font-size="14" text-anchor="middle" fill="#222">open it up with the large drill</text>
</g>
<g transform="translate(10,376)">
<rect width="226" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">④ Cool and lubricate</text>
<rect x="20" y="118" width="120" height="40" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><rect x="72" y="118" width="16" height="20" fill="#fff" stroke="#333" stroke-width="1.2"/><path d="M72.0,66 V133.2 L80,138 L88.0,133.2 V66 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><path d="M72.0,131.2 L88.0,121.6 M72.0,116.8 L88.0,107.2 M72.0,102.4 L88.0,92.8 M72.0,88.0 L88.0,78.4" stroke="#555" stroke-width="1.2"/><path d="M66.0,66 L64,44 H96 L94.0,66 Z" fill="#777" stroke="#333" stroke-width="1.5"/><g transform="translate(0,-16) rotate(-30 170 80)"><path d="M150,70 H190 V104 Q190,110 184,110 H156 Q150,110 150,104 Z" fill="#e8c860" stroke="#333" stroke-width="1.6"/><path d="M150,78 L112,70 L112,74 L150,86" fill="#e8c860" stroke="#333" stroke-width="1.4"/></g><path d="M110,94 q-3,6 0,8 q3,-2 0,-8 M102,106 q-3,6 0,8 q3,-2 0,-8" fill="#c9a32a" stroke="#a07f10" stroke-width="1"/><text x="214" y="122" font-size="12" text-anchor="end" fill="#555">machine</text><text x="214" y="136" font-size="12" text-anchor="end" fill="#555">oil or</text><text x="214" y="150" font-size="12" text-anchor="end" fill="#555">soapy</text><text x="214" y="164" font-size="12" text-anchor="end" fill="#555">water</text>
<text x="113" y="210" font-size="14" text-anchor="middle" fill="#222">Steel: cool and lubricate</text>
<text x="113" y="229" font-size="14" text-anchor="middle" fill="#222">with machine oil or</text>
<text x="113" y="248" font-size="14" text-anchor="middle" fill="#222">soapy water</text>
<text x="113" y="267" font-size="14" text-anchor="middle" fill="#222">Cast iron, brass: drill dry</text>
</g>
<g transform="translate(247,376)">
<rect width="226" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">⑤ Near breakthrough</text>
<rect x="30" y="110" width="140" height="44" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><rect x="92" y="110" width="16" height="37" fill="#fff" stroke="#333" stroke-width="1.2"/><rect x="30" y="154" width="40" height="10" fill="#ccc" stroke="#999" stroke-width="1"/><rect x="130" y="154" width="40" height="10" fill="#ccc" stroke="#999" stroke-width="1"/><path d="M92.0,66 V147.2 L100,152 L108.0,147.2 V66 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><path d="M92.0,145.2 L108.0,135.6 M92.0,130.8 L108.0,121.2 M92.0,116.4 L108.0,106.8 M92.0,102.0 L108.0,92.4 M92.0,87.6 L108.0,78.0" stroke="#555" stroke-width="1.2"/><path d="M86.0,66 L84,44 H116 L114.0,66 Z" fill="#777" stroke="#333" stroke-width="1.5"/><line x1="140" y1="62" x2="140" y2="82" stroke="#c33" stroke-width="1.6" marker-end="url(#arR)"/><text x="150" y="70" font-size="13" fill="#c33">light</text><text x="150" y="84" font-size="13" fill="#c33">pressure</text><line x1="170" y1="124" x2="110" y2="146" stroke="#555" stroke-width="1"/><text x="172" y="106" font-size="12" fill="#555">almost</text><text x="172" y="120" font-size="12" fill="#555">through</text>
<text x="113" y="210" font-size="14" text-anchor="middle" fill="#222">Ease the pressure as the</text>
<text x="113" y="229" font-size="14" text-anchor="middle" fill="#222">drill is about to break</text>
<text x="113" y="248" font-size="14" text-anchor="middle" fill="#222">through (it tends to</text>
<text x="113" y="267" font-size="14" text-anchor="middle" fill="#222">grab suddenly)</text>
</g>
<g transform="translate(484,376)">
<rect width="226" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">⑥ Deep holes</text>
<rect x="40" y="110" width="110" height="66" fill="#d6dde4" stroke="#333" stroke-width="1.8"/><rect x="87" y="110" width="16" height="60" fill="#fff" stroke="#333" stroke-width="1.2"/><path d="M87.0,62 V119.2 L95,124 L103.0,119.2 V62 Z" fill="#aab2ba" stroke="#333" stroke-width="1.5"/><path d="M87.0,117.2 L103.0,107.6 M87.0,102.8 L103.0,93.2 M87.0,88.4 L103.0,78.8" stroke="#555" stroke-width="1.2"/><path d="M81.0,62 L79,40 H111 L109.0,62 Z" fill="#777" stroke="#333" stroke-width="1.5"/><path d="M108,106 q6,-4 10,0 q4,4 8,0 M66,106 q6,-4 10,0 q4,4 8,0 M114,96 q5,-3 8,0" fill="none" stroke="#8a6d3b" stroke-width="2"/><line x1="172" y1="140" x2="172" y2="76" stroke="#0b5cad" stroke-width="3" marker-end="url(#arB)"/><text x="180" y="94" font-size="13" fill="#0b5cad">pull</text><text x="180" y="109" font-size="13" fill="#0b5cad">out to</text><text x="180" y="124" font-size="13" fill="#0b5cad">clear</text><text x="180" y="139" font-size="13" fill="#0b5cad">chips</text>
<text x="113" y="210" font-size="14" text-anchor="middle" fill="#222">Withdraw the drill often</text>
<text x="113" y="229" font-size="14" text-anchor="middle" fill="#222">to clear the chips</text>
</g>
<text x="360" y="702" font-size="14" text-anchor="middle"><tspan font-weight="bold">Speed:</tspan> the larger the drill, the lower the speed; the harder the material, the lower the speed</text>
<rect x="10" y="716" width="700" height="176" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
<text x="24" y="742" font-size="16" font-weight="bold" fill="#c33">⚠ Safety</text>
<text x="24" y="768" font-size="14">• Rotating machines catch gloves, cuffs, long hair and necklaces: on a drill press</text>
<text x="36" y="786" font-size="14"><tspan font-weight="bold" fill="#c33">wear no gloves</tspan>, fasten your cuffs and tie long hair up</text>
<text x="24" y="810" font-size="14">• Flying chips can injure your eyes: <tspan font-weight="bold" fill="#c33">wear safety goggles</tspan></text>
<text x="24" y="834" font-size="14">• Never hold small work by hand when drilling; fix it in a vice or clamp, or it will</text>
<text x="36" y="852" font-size="14">spin round with the drill if the drill grabs</text>
<text x="24" y="876" font-size="14">• Metal chips and burrs are sharp: don't wipe chips away by hand; use a brush or hook</text>
</g></svg>
