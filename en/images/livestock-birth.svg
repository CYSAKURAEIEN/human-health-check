<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 914" width="720" height="914" role="img" aria-label="Birth assistance in pigs and sheep: in a normal lambing the water bag appears first, then two front feet (soles down) with the nose resting on the front legs, like a diver; do not interfere with a normal birth; only one front foot showing, the head showing without front feet, or the tail or hind feet coming first is a malpresentation, so call an experienced person or a vet. Pig pregnancy is about 114 days, one piglet about every 10-30 minutes, the whole litter about 2-5 hours; sheep pregnancy is about 150 days, and the lamb usually comes within about 30 minutes to 1 hour after the waters break. After birth: clear mucus from the mouth and nose, and if it is not breathing hold it up by the hind legs and pat the chest; dry it and keep it warm; for piglets tie the cord with thread about 4 cm from the belly, cut on the far side of the thread and apply iodine tincture; a lamb's cord usually breaks by itself, apply iodine, and if it is too long tie it about 4-5 cm from the belly and cut; give colostrum as early as possible, for lambs ideally within 1 hour and no later than 2 hours. Call a vet for straining for more than about 30-60 minutes with no young born, a pause of more than about 1 hour after a few piglets, foul-smelling dark fluid from the vulva, or an afterbirth not out after about 12 hours; do not pull hard, and wear gloves when assisting" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Birth assistance in pigs and sheep</title>
<defs>
<pattern id="straw" width="10" height="8" patternUnits="userSpaceOnUse"><rect width="10" height="8" fill="#f1dc9a"/><path d="M0 6 L6 2 M5 7 L10 4" stroke="#c9a94e" stroke-width="1"/></pattern>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<!-- lamb parts (facing right) -->
<g id="lBody"><path d="M-28 10 Q-14 22 -2 16" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/><path d="M-28 10 Q-14 22 -2 16" fill="none" stroke="#f3ece0" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="38" ry="18" fill="#f3ece0" stroke="#333" stroke-width="1.8"/><path d="M-38 -2 q-6 2 -4 8" fill="none" stroke="#333" stroke-width="1.8"/></g>
<g id="lHead"><ellipse cx="46" cy="0" rx="15" ry="10" fill="#f3ece0" stroke="#333" stroke-width="1.8"/><ellipse cx="38" cy="-9" rx="7" ry="3.5" transform="rotate(-20 38 -9)" fill="#e6dccb" stroke="#333" stroke-width="1.2"/><path d="M45 -3 q3 2 6 0" fill="none" stroke="#333" stroke-width="1.2"/></g>
<g id="legOut"><path d="M24 10 L84 12" stroke="#333" stroke-width="6" stroke-linecap="round"/><path d="M24 10 L84 12" stroke="#f3ece0" stroke-width="3" stroke-linecap="round"/><path d="M84 8 L92 9 L92 16 L84 16 Z" fill="#555"/></g>
<g id="legBack"><path d="M22 10 Q30 22 12 22" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/><path d="M22 10 Q30 22 12 22" fill="none" stroke="#f3ece0" stroke-width="3" stroke-linecap="round"/></g>
<g id="pigS"><path d="M-30 -4 q-8 -4 -5 -9 q4 -3 4 2" fill="none" stroke="#333" stroke-width="1.5"/><ellipse cx="0" cy="0" rx="30" ry="15" fill="#f6cfc6" stroke="#333" stroke-width="1.8"/><circle cx="30" cy="-3" r="10" fill="#f6cfc6" stroke="#333" stroke-width="1.8"/><rect x="38" y="-8" width="6" height="9" rx="2" fill="#eeb3a8" stroke="#333" stroke-width="1.2"/><path d="M23 -10 L28 -20 L33 -11 Z" fill="#eeb3a8" stroke="#333" stroke-width="1.2" stroke-linejoin="round"/><circle cx="34" cy="-6" r="1.2" fill="#222"/></g>
<g id="lamp"><path d="M0 -14 V-4" stroke="#555" stroke-width="1.5"/><path d="M-7 -4 H7 L4 4 H-4 Z" fill="#555"/><circle cx="0" cy="7" r="4" fill="#ffd866" stroke="#e0a020" stroke-width="1.5"/></g>
<g id="xMark"><circle r="10" fill="#fdf3f3" stroke="#c33" stroke-width="2"/><path d="M-5 -5 L5 5 M5 -5 L-5 5" stroke="#c33" stroke-width="2.5"/></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Birth assistance in pigs and sheep (schematic)</text>

<!-- normal lambing and malpresentation -->
<rect x="10" y="44" width="440" height="250" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="68" font-size="16" font-weight="bold">Lambing: normal and malpresented</text>
<g transform="translate(74,116)">
<use href="#lBody"/><use href="#legOut"/><use href="#legOut" transform="translate(-2,6)"/><use href="#lHead"/>
</g>
<path d="M40 160 H200" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="120" y="178" font-size="13" fill="#0b5cad" text-anchor="middle">direction of birth</text>
<text x="118" y="90" font-size="12" fill="#0b5cad">nose on front legs</text>
<line x1="150" y1="94" x2="128" y2="110" stroke="#0b5cad" stroke-width="1"/>
<text x="176" y="146" font-size="12" fill="#0b5cad">soles down</text>
<line x1="186" y1="134" x2="168" y2="130" stroke="#0b5cad" stroke-width="1"/>
<text x="250" y="92" font-size="14" font-weight="bold" fill="#0b5cad">✓ Normal (like a diver)</text>
<g font-size="13">
<text x="250" y="112">First the water bag, then</text>
<text x="250" y="128">two front feet (soles down)</text>
<text x="250" y="144">with the nose resting on</text>
<text x="250" y="160">the front legs</text>
<text x="250" y="178" font-weight="bold">If normal, do not interfere:</text>
<text x="250" y="194" font-weight="bold">let the ewe lamb herself</text>
</g>
<path d="M20 202 H440" stroke="#ddd" stroke-width="1"/>
<text x="24" y="222" font-size="13" font-weight="bold" fill="#c33">Malpresentation → call an experienced person or a vet</text>
<g transform="translate(66,250) scale(0.55)">
<use href="#lBody"/><use href="#legOut"/><use href="#legBack" transform="translate(-4,4)"/><use href="#lHead"/>
</g>
<use href="#xMark" transform="translate(30,236)"/>
<g transform="translate(206,250) scale(0.55)">
<use href="#lBody"/><use href="#legBack"/><use href="#legBack" transform="translate(-4,4)"/><use href="#lHead"/>
</g>
<use href="#xMark" transform="translate(170,236)"/>
<g transform="translate(366,250) scale(-0.55,0.55)">
<use href="#lBody"/><use href="#legBack"/><use href="#lHead"/>
</g>
<g transform="translate(366,250) scale(0.55)">
<path d="M22 12 L70 14" stroke="#333" stroke-width="6" stroke-linecap="round"/><path d="M22 12 L70 14" stroke="#f3ece0" stroke-width="3" stroke-linecap="round"/><path d="M70 10 L78 11 L78 18 L70 18 Z" fill="#555"/>
</g>
<use href="#xMark" transform="translate(310,236)"/>
<g font-size="12" text-anchor="middle">
<text x="86" y="284">only one front foot</text>
<text x="222" y="284">head, no front feet</text>
<text x="366" y="284">tail or hind feet first</text>
</g>

<!-- labour -->
<g transform="translate(460,44)">
<rect x="0" y="0" width="250" height="250" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="14" y="24" font-size="16" font-weight="bold">Labour (for reference)</text>
<g font-size="13">
<text x="14" y="44" font-weight="bold">Pig: pregnancy about 114 days</text>
<text x="14" y="59">The sow usually farrows lying on</text>
<text x="14" y="74">her side; one piglet about every</text>
<text x="14" y="89">10-30 minutes, whole litter</text>
<text x="14" y="104">about 2-5 hours; afterbirth within</text>
<text x="14" y="119">a few hours of the last piglet</text>
<text x="14" y="139" font-weight="bold">Sheep: pregnancy about 150 days</text>
<text x="14" y="154">Lamb usually born about 30 minutes</text>
<text x="14" y="169">to 1 hour after the waters break;</text>
<text x="14" y="184">a twin often 10-30 minutes later;</text>
<text x="14" y="199">afterbirth within a few hours</text>
<text x="14" y="218" fill="#555">Remove the afterbirth and bury it</text>
<text x="14" y="233" fill="#555">deep; do not let the sow eat it</text>
</g>
</g>

<!-- four steps after birth -->
<rect x="10" y="304" width="700" height="390" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="328" font-size="16" font-weight="bold">Straight after birth (piglets, lambs)</text>
<path d="M218 340 V684 M382 340 V684 M546 340 V684" stroke="#ddd" stroke-width="1"/>
<path d="M20 458 H700 M20 584 H700" stroke="#ddd" stroke-width="1"/>
<!-- 1 -->
<use href="#pigS" transform="translate(116,400) scale(0.9)"/>
<path d="M162 380 Q176 374 184 386 Q180 400 166 398 Q158 390 162 380 Z" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<path d="M190 372 Q196 388 188 404" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<!-- 2 -->
<rect x="236" y="414" width="130" height="12" fill="url(#straw)"/>
<use href="#pigS" transform="translate(296,400) scale(0.9)"/>
<path d="M268 392 Q292 376 318 390 L314 404 Q292 392 272 404 Z" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<use href="#lamp" transform="translate(350,358)"/>
<!-- 3 -->
<use href="#pigS" transform="translate(450,382) scale(0.9)"/>
<path d="M446 395 Q444 414 448 438" fill="none" stroke="#d98b8b" stroke-width="4" stroke-linecap="round"/>
<path d="M437 416 H455" stroke="#c33" stroke-width="3"/>
<path d="M434 423 H460" stroke="#333" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M468 397 V414" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="475" y="410" font-size="12" fill="#0b5cad">pig 4 cm</text>
<text x="475" y="426" font-size="12" fill="#0b5cad">lamb 4-5 cm</text>
<text x="408" y="418" font-size="12" fill="#c33">tie</text>
<text x="408" y="434" font-size="12">cut</text>
<text x="396" y="452" font-size="12" fill="#555">scissors, thread boiled</text>
<!-- 4 -->
<path d="M558 350 Q620 336 674 350 Q682 362 674 372 Q620 384 560 372 Q550 360 558 350 Z" fill="#f6cfc6" stroke="#333" stroke-width="1.8"/>
<g fill="#eeb3a8" stroke="#333" stroke-width="1"><circle cx="578" cy="376" r="3"/><circle cx="600" cy="378" r="3"/><circle cx="622" cy="379" r="3"/><circle cx="644" cy="378" r="3"/><circle cx="666" cy="376" r="3"/></g>
<circle cx="684" cy="356" r="11" fill="#f6cfc6" stroke="#333" stroke-width="1.8"/><rect x="693" y="351" width="5" height="9" rx="2" fill="#eeb3a8" stroke="#333" stroke-width="1.2"/><path d="M676 348 L680 338 L686 346 Z" fill="#eeb3a8" stroke="#333" stroke-width="1.2" stroke-linejoin="round"/><circle cx="688" cy="352" r="1.2" fill="#222"/>
<use href="#pigS" transform="translate(632,412) rotate(-50) scale(0.6)"/>
<use href="#pigS" transform="translate(588,412) rotate(-50) scale(0.6)"/>
<text x="556" y="450" font-size="12" fill="#0b5cad">weak ones: front teats</text>
<path d="M684 436 L668 384" stroke="#0b5cad" stroke-width="1"/>
<!-- step titles -->
<g font-size="14" font-weight="bold">
<text x="24" y="476">① Clear mouth, nose</text>
<text x="232" y="476">② Dry, keep warm</text>
<text x="396" y="476">③ Umbilical cord</text>
<text x="560" y="476">④ Colostrum early</text>
</g>
<!-- pig -->
<g font-size="13">
<text x="24" y="496"><tspan font-weight="bold" fill="#0b5cad">Pig:</tspan> wipe mucus from</text>
<text x="24" y="512">mouth and nose with a</text>
<text x="24" y="528">clean cloth at once; not</text>
<text x="24" y="544">breathing but heart still</text>
<text x="24" y="560">beating: hold up by the</text>
<text x="24" y="576">hind legs, pat the chest</text>
<text x="232" y="496"><tspan font-weight="bold" fill="#0b5cad">Pig:</tspan> then dry the</text>
<text x="232" y="512">whole body (especially</text>
<text x="232" y="528">in winter); week 1:</text>
<text x="232" y="544">keep at about 30-34°C</text>
<text x="396" y="496"><tspan font-weight="bold" fill="#0b5cad">Pig:</tspan> tie with thread</text>
<text x="396" y="512">about 4 cm from the</text>
<text x="396" y="528">belly, cut on the far</text>
<text x="396" y="544">side, iodine on the stump</text>
<text x="396" y="560" fill="#555">(broke by itself and not</text>
<text x="396" y="576" fill="#555">bleeding: iodine only)</text>
<text x="560" y="496"><tspan font-weight="bold" fill="#0b5cad">Pig:</tspan> once dry, put</text>
<text x="560" y="512">it straight on a teat</text>
<text x="560" y="528">for colostrum; the first</text>
<text x="560" y="544">few hours matter most</text>
<!-- sheep -->
<text x="24" y="604"><tspan font-weight="bold" fill="#0b5cad">Sheep:</tspan> clear mucus</text>
<text x="24" y="620">from mouth and nose at</text>
<text x="24" y="636">once; not breathing: hold</text>
<text x="24" y="652">up by hind legs, pat chest,</text>
<text x="24" y="668">or tickle a nostril with a</text>
<text x="24" y="684">straw to make it sneeze</text>
<text x="232" y="604"><tspan font-weight="bold" fill="#0b5cad">Sheep:</tspan> let the ewe</text>
<text x="232" y="620">lick it dry (helps them</text>
<text x="232" y="636">bond); in cold weather</text>
<text x="232" y="652">help dry it with straw</text>
<text x="232" y="668">or a cloth</text>
<text x="396" y="604"><tspan font-weight="bold" fill="#0b5cad">Sheep:</tspan> usually breaks</text>
<text x="396" y="620">by itself; iodine on the</text>
<text x="396" y="636">stump; if too long, tie</text>
<text x="396" y="652">about 4-5 cm from the</text>
<text x="396" y="668">belly and cut</text>
<text x="560" y="604"><tspan font-weight="bold" fill="#0b5cad">Sheep:</tspan> ideally</text>
<text x="560" y="620">within 1 hour, at most</text>
<text x="560" y="636">2 hours; on day 1 about</text>
<text x="560" y="652">10%-20% of its weight</text>
<text x="560" y="668">in all, in several feeds</text>
</g>

<!-- when to get help -->
<g transform="translate(10,704)">
<rect x="0" y="0" width="700" height="200" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="14" y="24" font-size="16" font-weight="bold" fill="#c33">Call an experienced person or a vet if</text>
<g font-size="13">
<text x="14" y="50" font-weight="bold">Pigs</text>
<text x="14" y="70">• Straining hard for over about 30-60 minutes,</text>
<text x="26" y="86">no piglet born</text>
<text x="14" y="106">• A long pause (over about 1 hour) after a few</text>
<text x="26" y="122">piglets, sow still straining or exhausted</text>
<text x="14" y="142">• Foul-smelling, dark fluid from the vulva,</text>
<text x="26" y="158">or the sow has a high fever, won't eat or drink</text>
<text x="360" y="50" font-weight="bold">Sheep</text>
<text x="360" y="70">• Straining hard for over about 30-60 minutes,</text>
<text x="372" y="86">no lamb</text>
<text x="360" y="106">• Malpresentation (see above)</text>
<text x="360" y="126">• Lamb stuck and the ewe exhausted</text>
<text x="360" y="146">• Afterbirth not out after about 12 hours</text>
<text x="14" y="178" fill="#c33">× Do not pull hard, or reach in with dirty hands or instruments (tears the birth canal, infection)</text>
<text x="14" y="194" fill="#c33">× Wear gloves when assisting: sheep afterbirth and birth fluids may carry Brucella</text>
</g>
</g>
</g>
</svg>
