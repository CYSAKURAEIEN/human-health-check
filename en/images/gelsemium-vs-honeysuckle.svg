<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 880" width="720" height="880" role="img" aria-label="Gouwen (Gelsemium elegans) compared with Jinyinhua (honeysuckle, Lonicera japonica): gouwen has many yellow flowers in a cyme, each corolla funnel-shaped and evenly 5-lobed at the tip, and smooth, hairless leaves; honeysuckle has two flowers on one flower stalk, a two-lipped corolla with stamens sticking out, flowers that open white and turn yellow, and softly hairy leaves; their flowering seasons overlap" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Gouwen vs honeysuckle</title>
<defs>
<!-- gouwen: funnel-shaped corolla, evenly 5-lobed at the tip (3 lobes visible from the side) -->
<g id="fG">
<path d="M-2.5 3 L0 -3 L2.5 3 Z" fill="#7a9a4a"/>
<path d="M-3 0 L-3 -16 Q-6 -26 -13 -31 Q-15 -39 -6 -36 Q0 -42 6 -36 Q15 -39 13 -31 Q6 -26 3 -16 L3 0 Z" fill="#f5c518" stroke="#333" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
</g>
<g id="fGfront">
<g fill="#f5c518" stroke="#333" stroke-width="1.2">
<ellipse cx="0" cy="-13" rx="9" ry="13" vector-effect="non-scaling-stroke"/>
<ellipse cx="0" cy="-13" rx="9" ry="13" transform="rotate(72)" vector-effect="non-scaling-stroke"/>
<ellipse cx="0" cy="-13" rx="9" ry="13" transform="rotate(144)" vector-effect="non-scaling-stroke"/>
<ellipse cx="0" cy="-13" rx="9" ry="13" transform="rotate(216)" vector-effect="non-scaling-stroke"/>
<ellipse cx="0" cy="-13" rx="9" ry="13" transform="rotate(288)" vector-effect="non-scaling-stroke"/>
</g>
<circle r="5" fill="#c99700" stroke="#333" stroke-width="1" vector-effect="non-scaling-stroke"/>
</g>
<!-- honeysuckle: long slender corolla tube, two-lipped (upper lip 4 shallow lobes, lower lip 1 lobe), stamens sticking out; colour set by the fill of the use -->
<g id="fL">
<path d="M-2 0 L-3.5 -44 L3.5 -44 L2 0 Z" stroke="#333" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<g transform="translate(0 -8)">
<path d="M-3 -36 C-14 -42 -26 -40 -32 -28 C-35 -20 -30 -18 -28 -24 C-24 -34 -14 -34 -3 -31 Z" stroke="#333" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<path d="M3 -36 C6 -50 12 -62 18 -74 Q21 -80 25 -75 Q29 -81 32 -74 Q37 -78 37 -71 Q43 -72 40 -64 C34 -50 20 -40 3 -32 Z" stroke="#333" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
<path d="M0 -36 L-8 -78 M0 -36 L-2 -82 M0 -36 L4 -83 M0 -36 L10 -82 M0 -36 L15 -79 M0 -36 L4 -92" stroke="#555" stroke-width="1" vector-effect="non-scaling-stroke" fill="none"/>
<g fill="#c9a227"><ellipse cx="-8" cy="-79" rx="1.6" ry="2.6"/><ellipse cx="-2" cy="-83" rx="1.6" ry="2.6"/><ellipse cx="4" cy="-84" rx="1.6" ry="2.6"/><ellipse cx="10" cy="-83" rx="1.6" ry="2.6"/><ellipse cx="15" cy="-80" rx="1.6" ry="2.6"/></g>
<circle cx="4" cy="-93" r="2.2" fill="#7a9a4a"/>
</g>
</g>
<!-- two flowers on one flower stalk -->
<g id="pairL">
<path d="M0 0 L10 -14" stroke="#4d6b2a" stroke-width="2" fill="none"/>
<path d="M10 -14 l-6 -2 l3 -3 Z M10 -14 l6 -1 l-2 -4 Z" fill="#7a9a4a"/>
<use href="#fL" transform="translate(10 -14) rotate(-14)"/>
<use href="#fL" transform="translate(10 -14) rotate(20)"/>
</g>
<!-- leaves: gouwen ovate-lanceolate, smooth; honeysuckle ovate, softly hairy -->
<g id="gL"><path d="M0 0 C6 -18 30 -16 78 0 C30 16 6 18 0 0 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.5"/><path d="M0 0 L72 0" stroke="#6a8a3a" stroke-width="1"/></g>
<g id="hL"><path d="M0 0 C2 -22 30 -24 58 0 C30 24 2 22 0 0 Z" fill="none" stroke="#6a8a3a" stroke-width="7" stroke-dasharray="1 3"/><path d="M0 0 C2 -22 30 -24 58 0 C30 24 2 22 0 0 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.5"/><path d="M0 0 L54 0" stroke="#6a8a3a" stroke-width="1"/><path d="M12 -8 l2 -3 M20 -11 l2 -3 M30 -9 l2 -3 M40 -6 l2 -3 M14 7 l2 -3 M24 10 l2 -3 M34 8 l2 -3 M44 5 l2 -3" stroke="#6a8a3a" stroke-width="1"/></g>
</defs>
<g fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Gouwen vs honeysuckle: key identification points (schematic)</text>
<rect x="10" y="44" width="345" height="706" rx="8" fill="none" stroke="#c33" stroke-width="2"/>
<rect x="365" y="44" width="345" height="706" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>

<!-- ===== gouwen ===== -->
<text x="22" y="72" font-size="18" font-weight="bold" fill="#c33">Gouwen<tspan font-size="14" font-weight="normal"> (heartbreak grass)</tspan></text>
<text x="22" y="92" font-size="14" font-style="italic" fill="#555">Gelsemium elegans</text>
<rect x="252" y="54" width="96" height="30" rx="5" fill="#c33"/>
<text x="300" y="75" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">☠️ Deadly</text>
<text x="344" y="104" font-size="13" fill="#c33" text-anchor="end">A few young leaves can kill</text>

<path d="M100 515 C97 440 103 360 100 300 C97 240 102 200 100 172" fill="none" stroke="#4d6b2a" stroke-width="3"/>
<use href="#gL" transform="translate(102 430) rotate(-15)"/>
<use href="#gL" transform="translate(98 430) scale(-1 1) rotate(-15)"/>
<use href="#gL" transform="translate(101 312) rotate(10) scale(0.85)"/>
<use href="#gL" transform="translate(99 312) scale(-1 1) rotate(-15) scale(0.85)"/>
<!-- terminal cyme -->
<path d="M100 174 L100 150 M100 174 L86 158 M86 158 L76 168 M100 174 L114 158 M114 158 L124 168" stroke="#4d6b2a" stroke-width="1.6" fill="none"/>
<use href="#fG" transform="translate(100 150)"/>
<use href="#fG" transform="translate(86 158) rotate(-28)"/>
<use href="#fG" transform="translate(76 168) rotate(-62)"/>
<use href="#fG" transform="translate(114 158) rotate(28)"/>
<use href="#fG" transform="translate(124 168) rotate(62)"/>
<!-- axillary cyme -->
<path d="M102 306 L122 286 M122 286 L120 270 M122 286 L136 280" stroke="#4d6b2a" stroke-width="1.6" fill="none"/>
<use href="#fG" transform="translate(120 270) rotate(-5) scale(0.85)"/>
<use href="#fG" transform="translate(136 280) rotate(45) scale(0.85)"/>

<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M132 150 L194 152"/><path d="M152 266 L194 176"/><path d="M152 418 L194 404"/><path d="M103 480 L194 480"/></g>
<g fill="#0b5cad"><circle cx="132" cy="150" r="2.5"/><circle cx="152" cy="266" r="2.5"/><circle cx="152" cy="418" r="2.5"/><circle cx="103" cy="480" r="2.5"/></g>
<text x="198" y="150" font-size="14">Many flowers in a</text>
<text x="198" y="168" font-size="14" font-weight="bold">cyme</text>
<text x="198" y="186" font-size="13" fill="#555">(terminal or axillary)</text>
<text x="198" y="216" font-size="14">Flowers <tspan font-weight="bold">yellow only</tspan></text>
<text x="198" y="398" font-size="14"><tspan font-weight="bold">Leaves opposite</tspan>,</text>
<text x="198" y="416" font-size="14">ovate-lanceolate,</text>
<text x="198" y="434" font-size="14"><tspan font-weight="bold">smooth, hairless</tspan>,</text>
<text x="198" y="452" font-size="14">rather thin</text>
<text x="198" y="484" font-size="14">Stem smooth and</text>
<text x="198" y="502" font-size="14">hairless</text>

<line x1="22" y1="540" x2="343" y2="540" stroke="#ccc" stroke-dasharray="4 3"/>
<text x="26" y="564" font-size="15" fill="#0b5cad">Flower close-up</text>
<use href="#fG" transform="translate(72 722) scale(2.6)"/>
<use href="#fGfront" transform="translate(165 668) scale(1.6)"/>
<text x="72" y="742" font-size="14" fill="#555" text-anchor="middle">side</text>
<text x="165" y="742" font-size="14" fill="#555" text-anchor="middle">front</text>
<text x="222" y="598" font-size="14" font-weight="bold">Funnel-shaped,</text>
<text x="222" y="616" font-size="14" font-weight="bold">tip evenly</text>
<text x="222" y="634" font-size="14" font-weight="bold">5-lobed</text>
<text x="222" y="652" font-size="14">like a small</text>
<text x="222" y="670" font-size="14">trumpet</text>
<text x="222" y="698" font-size="14">Stamens hidden</text>
<text x="222" y="716" font-size="14">inside the</text>
<text x="222" y="734" font-size="14">corolla</text>

<!-- ===== honeysuckle ===== -->
<text x="381" y="72" font-size="18" font-weight="bold">Jinyinhua<tspan font-size="14" font-weight="normal"> (honeysuckle)</tspan></text>
<text x="381" y="92" font-size="14" font-style="italic" fill="#555">Lonicera japonica</text>

<path d="M440 520 C436 450 446 390 440 330 C436 270 444 230 440 170" fill="none" stroke="#7a9a4a" stroke-width="7" stroke-dasharray="1 3"/>
<path d="M440 520 C436 450 446 390 440 330 C436 270 444 230 440 170" fill="none" stroke="#4d6b2a" stroke-width="3"/>
<use href="#hL" transform="translate(442 450) rotate(10) scale(1.2)"/>
<use href="#hL" transform="translate(438 450) scale(-1 1) rotate(10) scale(1.2)"/>
<use href="#hL" transform="translate(442 330) rotate(20) scale(1.05)"/>
<use href="#hL" transform="translate(438 330) scale(-1 1) rotate(5) scale(1.05)"/>
<use href="#hL" transform="translate(442 200) rotate(15) scale(0.8)"/>
<use href="#hL" transform="translate(438 200) scale(-1 1) rotate(-10) scale(0.8)"/>
<use href="#pairL" transform="translate(442 326) rotate(28) scale(0.85)" fill="#f5c518"/>
<use href="#pairL" transform="translate(442 196) rotate(22) scale(0.85)" fill="#fff"/>

<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M453 189 L544 182"/><path d="M497 150 L544 248"/><path d="M500 290 L544 266"/><path d="M505 462 L544 444"/><path d="M443 508 L544 507"/></g>
<g fill="#0b5cad"><circle cx="453" cy="189" r="2.5"/><circle cx="497" cy="150" r="2.5"/><circle cx="500" cy="290" r="2.5"/><circle cx="505" cy="462" r="2.5"/><circle cx="443" cy="508" r="2.5"/></g>
<text x="548" y="168" font-size="14"><tspan font-weight="bold">Two flowers</tspan> on</text>
<text x="548" y="186" font-size="14">one flower stalk,</text>
<text x="548" y="204" font-size="14">in the leaf axils</text>
<text x="548" y="252" font-size="14">Opens <tspan font-weight="bold">white</tspan>, then</text>
<text x="548" y="270" font-size="14">turns <tspan font-weight="bold">yellow</tspan>; often</text>
<text x="548" y="288" font-size="14">both colours on</text>
<text x="548" y="306" font-size="14">one plant</text>
<text x="548" y="430" font-size="14"><tspan font-weight="bold">Leaves opposite</tspan>,</text>
<text x="548" y="448" font-size="14">ovate, usually</text>
<text x="548" y="466" font-size="14"><tspan font-weight="bold">softly hairy</tspan> on</text>
<text x="548" y="484" font-size="14">both sides</text>
<text x="548" y="512" font-size="14">Young shoots often</text>
<text x="548" y="530" font-size="14">softly hairy</text>

<line x1="377" y1="540" x2="698" y2="540" stroke="#ccc" stroke-dasharray="4 3"/>
<text x="381" y="564" font-size="15" fill="#0b5cad">Flower close-up</text>
<use href="#fL" transform="translate(455 738) scale(1.6)" fill="#fff"/>
<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M472 594 L540 594"/><path d="M521 625 L540 650"/></g>
<g fill="#0b5cad"><circle cx="472" cy="594" r="2.5"/><circle cx="521" cy="625" r="2.5"/></g>
<text x="544" y="590" font-size="14" font-weight="bold">Stamens clearly</text>
<text x="544" y="608" font-size="14" font-weight="bold">stick out of the</text>
<text x="544" y="626" font-size="14" font-weight="bold">corolla</text>
<text x="544" y="655" font-size="14">Upper lip 4-lobed</text>
<text x="544" y="690" font-size="14" font-weight="bold">Two-lipped,</text>
<text x="544" y="708" font-size="14">like an open mouth</text>
<text x="404" y="722" font-size="14" text-anchor="middle">lower lip:</text>
<text x="404" y="740" font-size="14" text-anchor="middle">1 lobe</text>

<!-- key takeaway -->
<rect x="10" y="762" width="700" height="106" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="790" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">Their flowering seasons overlap: season cannot tell them apart</text>
<text x="360" y="818" font-size="16" text-anchor="middle">Check flower shape, inflorescence and leaf hairs, all together</text>
<text x="360" y="850" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">Not sure the vine is honeysuckle? Do not pick its flowers or leaves</text>
</g>
</svg>
