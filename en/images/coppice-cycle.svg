<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1044" width="720" height="1044" role="img" aria-label="How to cut a coppice and cut it plot by plot in rotation. Many broadleaf trees, when cut down, send up a clump of new shoots from the stump that grow into firewood again within a few years. Cut in the dormant season, from winter to early spring before bud burst; do not cut in the growing season from late spring to summer, and shoots from cuts made in late summer or early autumn are easily killed by frost in winter. Leave a stump about 5-15 cm above the ground: lower down, shoots grow from the root collar and are sturdier; make the cut smooth and clean, sloping to one side so rain runs off and does not sit on top of the stump and rot it; use a sharp axe or saw, cutting at a slant from the outside, and do not split the stump or tear the bark. Where livestock may browse, some people cut at 1-2 m instead (pollarding). In the first and second year after cutting, keep 3-5 strong, evenly spaced shoots and cut off the rest. Divide the wood into as many plots as there are years in the rotation, for example 8 plots for an 8-year rotation, cut 1 plot a year and return to plot 1 in year 9; record each plot's location, area, year of cutting and yield; mark boundaries clearly with stone piles, notches or posts; no grazing on a freshly cut plot for the first two or three years; a few large trees may be left uncut in each plot. Rotation for willows about 2-5 years, eucalyptus 3-6 years, poplar and black locust 4-8 years, elm, pagoda tree, Chinese wingnut and alder 5-12 years, oaks and Chinese chestnut 8-15 years; most conifers (pine, Chinese fir, cypress) do not resprout from the stump once cut.">
<rect width="100%" height="100%" fill="#fff"/>
<title>Coppice: how to cut, and cutting plot by plot in rotation</title>
