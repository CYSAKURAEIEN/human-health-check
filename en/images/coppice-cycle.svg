<g id="s5"><path d="M-4,-5 Q-8,-24 -11,-44 M0,-7 V-46 M4,-8 Q8,-27 11,-47" fill="none" stroke="#7a5a30" stroke-width="2.5" stroke-linecap="round"/><use href="#stub"/></g>
<g id="s6"><path d="M-4,-5 Q-8,-28 -11,-51 M0,-7 V-53 M4,-8 Q8,-31 11,-54" fill="none" stroke="#7a5a30" stroke-width="2.8" stroke-linecap="round"/><use href="#stub"/></g>
<g id="s7"><path d="M-4,-5 Q-8,-31 -11,-58 M0,-7 V-60 M4,-8 Q8,-34 11,-61" fill="none" stroke="#7a5a30" stroke-width="3.1" stroke-linecap="round"/><use href="#stub"/></g>
