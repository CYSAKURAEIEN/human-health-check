</g>
<text x="12" y="306">✓ Record each plot's location, area, year of cutting and yield on a map or in a notebook</text>
<text x="12" y="326" fill="#c33">✗ No grazing on a freshly cut plot for the first 2-3 years: livestock eat the shoots bare</text>
</g>
<g transform="translate(10,816)">
<rect width="700" height="218" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">Trees that coppice, and rough rotation lengths</text>
<text x="12" y="44" font-size="13" fill="#555">(rules of thumb only; they vary widely with climate, site and the thickness of wood wanted)</text>
<text x="12" y="70">Willows, osier <tspan font-weight="bold">2-5 years</tspan></text>
<text x="236" y="70">Eucalyptus <tspan font-weight="bold">3-6 years</tspan></text>
<text x="440" y="70">Poplar, black locust <tspan font-weight="bold">4-8 years</tspan></text>
<text x="12" y="94">Elm, pagoda tree, Chinese wingnut, alder <tspan font-weight="bold">5-12 years</tspan></text>
<text x="440" y="94">Oaks, chestnut <tspan font-weight="bold">8-15 years</tspan></text>
<text x="12" y="120">Short cycle: thin wood, easy to cut and carry, less each time;</text>
<text x="12" y="138">long cycle: thicker wood that can also serve as small timber or for charcoal</text>
<text x="12" y="162" fill="#c33">✗ Most conifers (pine, Chinese fir, cypress) do not resprout from the stump: they must be replanted</text>
<text x="12" y="186">Well-managed coppice grows about 3-8 t of dry wood per hectare a year:</text>
<text x="12" y="204">cut only the new growth and the wood can be used indefinitely</text>
</g>
</g>
</svg>
