<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 832" width="720" height="832" role="img" aria-label="Sharpening: first form the edge on a coarse stone, then polish it on a fine stone; soak the stone in water before use (oil for an oilstone), keep it wet while working, and set it on a wet cloth so it does not slip. Find the original angle of the edge, lay the bevel flat on the stone, and push back and forth keeping that angle constant (if the angle rocks up and down you will round the edge); sharpen until you can feel a tiny curled lip (burr) on the other side of the edge, turn it over, lay the back flat on the stone and rub lightly a few times to remove the burr, then repeat on the fine stone. Common angles (guide): kitchen and pocket knives, bevel about 15-20° to the face of the blade; chisels and plane irons, bevel about 25-30°; a splitting axe has a larger angle (blunter and thicker), a felling axe a smaller one. A stone wears hollow in the middle with use; flatten it by rubbing on a flat concrete floor with water and sand" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Sharpening</title>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker><marker id="arR0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#c33"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker></defs>
