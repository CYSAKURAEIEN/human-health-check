<text x="20" y="316" font-size="15" font-weight="bold">① Lay it flat</text>
<text x="161" y="316" font-size="15" font-weight="bold">② Push</text>
<text x="302" y="316" font-size="15" font-weight="bold">③ Feel the burr</text>
<text x="443" y="316" font-size="15" font-weight="bold">④ Turn over</text>
<text x="584" y="316" font-size="15" font-weight="bold">⑤ Fine stone</text>
<g font-size="13">
<text x="20" y="482">Find the edge's</text>
<text x="20" y="499">original angle; lay</text>
<text x="20" y="516">the bevel flat on</text>
<text x="20" y="533">the stone</text>
<text x="161" y="482">Keep that angle</text>
<text x="161" y="499">constant; push back</text>
<text x="161" y="516">and forth</text>
<text x="161" y="536" fill="#c33">Rocking the angle</text>
<text x="161" y="553" fill="#c33">rounds the edge</text>
<text x="302" y="482">Sharpen until you</text>
<text x="302" y="499">feel a tiny curled</text>
<text x="302" y="516">lip (burr) on the</text>
<text x="302" y="533">other side</text>
<text x="443" y="482">Turn over to</text>
<text x="443" y="499">remove the burr:</text>
<text x="443" y="517" font-size="12">chisel, plane: rub</text>
<text x="443" y="532" font-size="12">the back flat, lightly</text>
<text x="443" y="550" font-size="12">knife, axe: other side</text>
<text x="443" y="565" font-size="12">at the same angle</text>
<text x="584" y="482">Repeat on the fine</text>
<text x="584" y="499">stone for a finer</text>
<text x="584" y="516">edge</text>
</g>
