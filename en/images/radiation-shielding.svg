<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 892" width="720" height="892" role="img" aria-label="Types of radiation and protection. 1 Penetrating power of the three types: alpha rays (helium nuclei) are very weak, stopped by a sheet of paper or the outer layer of skin; the main danger is breathing them in or swallowing them; beta rays (electrons) are medium, stopped by a few mm of aluminium; keep them off the skin and out of the body; gamma rays (high-energy photons) are very strong and need thick lead, thick concrete or a thick layer of earth, plus distance. 2 Three rules of protection: time (stay briefly), distance (keep away), shielding (hide behind thick walls or underground). 3 Half-life: after each half-life half is left, after two half-lives a quarter is left; carbon-14 has a half-life of about 5730 years, so a quarter left means about 11500 years ago; iodine-131 about 8 days, caesium-137 about 30 years" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Types of radiation and protection</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<pattern id="conc" width="12" height="12" patternUnits="userSpaceOnUse">
<rect width="12" height="12" fill="#bbb"/>
<circle cx="3" cy="4" r="1.3" fill="#888"/><circle cx="9" cy="9" r="1.6" fill="#888"/>
</pattern>
<!-- radiation warning sign -->
<g id="tre">
<circle r="17" fill="#f5d33a" stroke="#333" stroke-width="1.5"/>
<circle r="3" fill="#222"/>
<path d="M5 0 L14 0 A14 14 0 0 1 7 12.1 L2.5 4.3 A5 5 0 0 0 5 0 Z" fill="#222" transform="rotate(30)"/>
<path d="M5 0 L14 0 A14 14 0 0 1 7 12.1 L2.5 4.3 A5 5 0 0 0 5 0 Z" fill="#222" transform="rotate(150)"/>
<path d="M5 0 L14 0 A14 14 0 0 1 7 12.1 L2.5 4.3 A5 5 0 0 0 5 0 Z" fill="#222" transform="rotate(270)"/>
</g>
<!-- person -->
<g id="man" stroke="#333" stroke-width="2">
<circle cx="0" cy="-46" r="9" fill="#f3e3d3"/>
<rect x="-10" y="-35" width="20" height="30" rx="6" fill="#cfe0f0"/>
<path d="M-5 -6 V16 M5 -6 V16" fill="none" stroke-linecap="round"/>
</g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Types of radiation and protection</text>

<!-- 1 penetrating power -->
<rect x="10" y="42" width="700" height="292" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="68" font-size="16" font-weight="bold">① Penetrating power of the three types of radiation</text>
<g transform="translate(0,20)">
<!-- barriers -->
<rect x="287" y="124" width="7" height="170" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
<rect x="394" y="124" width="14" height="170" fill="#d5dbe3" stroke="#333" stroke-width="1.5"/>
<rect x="490" y="124" width="70" height="170" fill="url(#conc)" stroke="#333" stroke-width="2"/>
<g font-size="13" font-weight="bold" text-anchor="middle">
<text x="290" y="80">a sheet of</text><text x="290" y="96">paper</text>
<text x="401" y="80">a few mm of</text><text x="401" y="96">aluminium</text>
<text x="525" y="80">thick lead,</text><text x="525" y="96">thick concrete</text>
</g>
<g font-size="13" text-anchor="middle" fill="#555">
<text x="290" y="113">skin surface</text>
<text x="525" y="113">thick earth</text>
</g>
<!-- ray names -->
<g font-size="16" font-weight="bold">
<text x="26" y="160">α rays</text>
<text x="26" y="215">β rays</text>
<text x="26" y="270">γ rays</text>
</g>
<g font-size="13" fill="#555">
<text x="26" y="178">helium nuclei</text>
<text x="26" y="233">electrons</text>
<text x="26" y="288">high-energy photons</text>
</g>
<g fill="#0b5cad" font-size="13">
<text x="196" y="146">very weak</text>
<text x="196" y="201">medium</text>
<text x="196" y="256">very strong</text>
</g>
<!-- radioactive source -->
<use href="#tre" x="150" y="210"/>
<path d="M163 196 L180 154 M167 210 H180 M163 224 L180 266" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<!-- rays -->
<g stroke="#c33" fill="none" stroke-linecap="round">
<path d="M180 154 H282" stroke-width="6" marker-end="url(#arR)"/>
<path d="M180 210 H388" stroke-width="3.5" marker-end="url(#arR)"/>
<path d="M180 266 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" stroke-width="2.5"/>
</g>
<path d="M528 259 L542 266 L528 273 Z" fill="#c33"/>
<!-- notes on the right -->
<g font-size="13">
<text x="572" y="144">main danger is</text>
<text x="572" y="160">breathing it in</text>
<text x="572" y="176">or swallowing it</text>
<text x="572" y="205">keep it off the skin</text>
<text x="572" y="223">and out of the body</text>
<text x="572" y="262">plus distance</text>
</g>
</g>

<!-- 2 three rules of protection -->
<g transform="translate(0,20)">
<rect x="10" y="330" width="700" height="226" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="356" font-size="16" font-weight="bold">② Three rules of protection</text>
<!-- time -->
<circle cx="126" cy="430" r="40" fill="#fff" stroke="#333" stroke-width="2.5"/>
<g stroke="#333" stroke-width="2" stroke-linecap="round">
<path d="M126 394 v6 M126 460 v6 M90 430 h6 M156 430 h6"/>
<path d="M126 430 V404 M126 430 L144 440" stroke-width="3"/>
</g>
<path d="M126 390 A40 40 0 0 1 160 409 L126 430 Z" fill="#c33" opacity="0.3"/>
<text x="126" y="500" font-size="16" font-weight="bold" text-anchor="middle">Time</text>
<text x="126" y="522" font-size="14" text-anchor="middle" fill="#0b5cad">stay briefly</text>
<!-- distance -->
<use href="#tre" x="292" y="436"/>
<use href="#man" x="430" y="448"/>
<path d="M314 470 H410" stroke="#0b5cad" stroke-width="1.8" marker-start="url(#arB)" marker-end="url(#arB)"/>
<path d="M240 464 H460" stroke="#999" stroke-width="2"/>
<text x="360" y="500" font-size="16" font-weight="bold" text-anchor="middle">Distance</text>
<text x="360" y="522" font-size="14" text-anchor="middle" fill="#0b5cad">keep away</text>
<!-- shielding -->
<use href="#tre" x="520" y="436"/>
<rect x="562" y="382" width="30" height="82" fill="url(#conc)" stroke="#333" stroke-width="2"/>
<use href="#man" x="636" y="448"/>
<path d="M500 464 H690" stroke="#999" stroke-width="2"/>
<g stroke="#c33" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M540 420 L558 412" marker-end="url(#arR)"/>
<path d="M541 436 H558" marker-end="url(#arR)"/>
<path d="M540 452 L558 458" marker-end="url(#arR)"/>
</g>
<text x="594" y="500" font-size="16" font-weight="bold" text-anchor="middle">Shielding</text>
<text x="594" y="522" font-size="14" text-anchor="middle" fill="#0b5cad">behind thick walls</text>
<text x="594" y="540" font-size="14" text-anchor="middle" fill="#0b5cad">or underground</text>
</g>

<!-- 3 half-life -->
<g transform="translate(0,36)">
<rect x="10" y="556" width="700" height="288" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="582" font-size="16" font-weight="bold">③ Half-life: after each half-life, half is left</text>
<!-- axes: x = 80 + 80 × number of half-lives, y = 760 - 160 × fraction left -->
<path d="M80 600 V760 H420" fill="none" stroke="#333" stroke-width="2"/>
<g stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
<path d="M80 680 H160 V760"/>
<path d="M80 720 H240 V760"/>
<path d="M80 740 H320 V760"/>
</g>
<path d="M80 600 L100 625.5 L120 646.9 L140 664.9 L160 680 L180 692.7 L200 703.4 L220 712.4 L240 720 L260 726.4 L280 731.7 L300 736.2 L320 740 L340 743.2 L360 745.9 L380 748.1 L400 750" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
<circle cx="160" cy="680" r="4" fill="#333"/>
<circle cx="240" cy="720" r="6" fill="#c33"/>
<circle cx="320" cy="740" r="4" fill="#333"/>
<g font-size="13" text-anchor="end">
<text x="72" y="605">1</text>
<text x="72" y="685">1/2</text>
<text x="72" y="725">1/4</text>
<text x="72" y="745">1/8</text>
</g>
<text x="0" y="0" font-size="13" fill="#555" text-anchor="middle" transform="translate(34 680) rotate(-90)">fraction left</text>
<g font-size="13" text-anchor="middle">
<text x="80" y="778">0</text>
<text x="160" y="778">1</text>
<text x="240" y="778">2</text>
<text x="320" y="778">3</text>
<text x="400" y="778">4</text>
</g>
<text x="240" y="834" font-size="13" fill="#555" text-anchor="middle">x axis: number of half-lives</text>
<g font-size="13" fill="#0b5cad" text-anchor="middle">
<text x="22" y="798" text-anchor="start">carbon-14:</text>
<text x="160" y="798">about 5730 years</text>
<text x="240" y="814">about 11500 years</text>
</g>
<text x="252" y="698" font-size="14" font-weight="bold" fill="#c33">1/4 left → about</text>
<text x="252" y="715" font-size="14" font-weight="bold" fill="#c33">11500 years ago</text>
<!-- half-life table -->
<g font-size="14">
<text x="456" y="626" font-weight="bold">Half-lives of common isotopes</text>
<text x="456" y="656" font-weight="bold">Iodine-131</text><text x="560" y="656">about 8 days</text>
<text x="456" y="674" font-size="12" fill="#555">main threat early in a nuclear accident</text>
<text x="456" y="702" font-weight="bold">Caesium-137</text><text x="560" y="702">about 30 years</text>
<text x="456" y="720" font-size="12" fill="#555">contaminates soil for years afterwards</text>
<text x="456" y="748" font-weight="bold">Carbon-14</text><text x="560" y="748">about 5730 years</text>
<text x="456" y="766" font-size="12" fill="#555">used in archaeological dating</text>
</g>
</g>
</g>
</svg>
