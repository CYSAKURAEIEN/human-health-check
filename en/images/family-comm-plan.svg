<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 924" width="720" height="924" role="img" aria-label="Family emergency communication plan: when disaster strikes, family members are often scattered at work, at school or on the road; agreeing a plan in advance works far better than improvising afterwards. 1 Agree three meeting points: the first is a safe open space just outside your home, the second within your neighbourhood (a school playground or park), the third outside your neighbourhood (a relative's or friend's home, or a designated shelter); write them down and make sure children and older people know them too. 2 Agree on a relative or friend who lives in another area as your out-of-area contact: when local calls in the disaster area will not connect, calls to another area often get through more easily; everyone in the family reports to this person, who passes the news on. 3 Write the phone numbers of family, relatives and friends, workplaces and schools on paper and keep it in your wallet and emergency bag, with a copy in your child's school bag. 4 After a disaster, send text messages and make fewer calls: texts use less network capacity and get through more easily when the network is congested; one text should say who you are, where you are, whether you are safe and where you are going next; keep calls short. 5 A radio is the most reliable source of information during power and network cuts: keep a wind-up or solar-charged radio, and trust only official channels. 6 If family members are separated: first wait at and check the agreed meeting points; contact the out-of-area contact; leave notes at your front door and the meeting points, in a plastic bag stuck somewhere easy to see; register and enquire at shelters and relocation sites; report to the police; contact the Red Cross and other relief organisations. If a child or older person goes missing, call 110 at once; there is no need to wait 24 hours. Practise at least once a year">
<rect width="100%" height="100%" fill="#fff"/>
<title>Family emergency communication plan</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777"/></marker>
<g id="person"><circle cx="0" cy="-22" r="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/><path d="M-10 0 V-8 Q-10 -13 -5 -13 H5 Q10 -13 10 -8 V0 Z" fill="#cfe0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/></g>
<g id="flag"><path d="M0 0 V-34" stroke="#333" stroke-width="2"/><path d="M0 -34 L20 -28 L0 -22 Z" fill="#c33"/></g>
<g id="house"><path d="M-18 0 V-20 L0 -34 L18 -20 V0 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/><rect x="-5" y="-12" width="10" height="12" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/></g>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Family emergency communication plan: agree it before disaster</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">Family are often scattered at work, at school, on the road: a plan agreed in advance beats improvising later</text>

<!-- 1 three meeting points -->
<g transform="translate(10,64)">
<rect x="0" y="0" width="345" height="344" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">① Agree three meeting points</text>
<rect x="14" y="40" width="236" height="196" rx="14" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="24" y="60" font-size="13" fill="#0b5cad">neighbourhood</text>
<!-- home -->
<use href="#house" x="62" y="120"/>
<text x="62" y="138" font-size="13" text-anchor="middle">home</text>
<path d="M30 121 H140" stroke="#999" stroke-width="2"/>
<use href="#flag" x="108" y="120"/>
<circle cx="98" cy="74" r="10" fill="#c33"/><text x="98" y="79" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<!-- playground / park in the neighbourhood -->
<rect x="120" y="160" width="112" height="60" rx="30" fill="#e3efd6" stroke="#6a8a3a" stroke-width="1.5"/>
<g transform="translate(140 200)"><path d="M0 0 V-12" stroke="#6a5a3a" stroke-width="3"/><circle cx="0" cy="-20" r="10" fill="#a7c47a" stroke="#4d6b2a" stroke-width="1.5"/></g>
<text x="192" y="212" font-size="12" fill="#4d6b2a" text-anchor="middle">park</text>
<use href="#flag" x="180" y="196"/>
<circle cx="170" cy="150" r="10" fill="#c33"/><text x="170" y="155" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<!-- outside the neighbourhood -->
<use href="#house" x="300" y="160"/>
<use href="#flag" x="322" y="166"/>
<circle cx="300" cy="100" r="10" fill="#c33"/><text x="300" y="105" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<path d="M106 128 Q120 150 132 160" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arB)"/>
<path d="M214 166 Q250 150 274 150" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arB)"/>
<g font-size="14">
<text x="12" y="260"><tspan fill="#c33" font-weight="bold">1</tspan> Safe open space outside your home</text>
<text x="12" y="280"><tspan fill="#c33" font-weight="bold">2</tspan> In the neighbourhood (playground, park)</text>
<text x="12" y="300"><tspan fill="#c33" font-weight="bold">3</tspan> Outside it (relatives, official shelter)</text>
</g>
<text x="12" y="320" font-size="12" fill="#555">Write them down; make sure children and older people</text>
<text x="12" y="335" font-size="12" fill="#555">know them too; practise at least once a year</text>
</g>

<!-- 2 out-of-area contact -->
<g transform="translate(365,64)">
<rect x="0" y="0" width="345" height="344" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">② Agree an out-of-area contact</text>
<rect x="14" y="40" width="160" height="196" rx="10" fill="#f6f6f6" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="24" y="60" font-size="13" fill="#555">disaster area (local)</text>
<use href="#person" x="50" y="104"/><text x="66" y="98" font-size="13">at work</text>
<use href="#person" x="50" y="164"/><text x="66" y="158" font-size="13">at school</text>
<use href="#person" x="50" y="224"/><text x="66" y="218" font-size="13">on the road</text>
<!-- local calls not getting through -->
<path d="M32 108 V136" stroke="#c33" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M27 116 L37 126 M37 116 L27 126" stroke="#c33" stroke-width="2"/>
<path d="M32 168 V196" stroke="#c33" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M27 176 L37 186 M37 176 L27 186" stroke="#c33" stroke-width="2"/>
<!-- out-of-area contact -->
<rect x="232" y="112" width="100" height="98" rx="10" fill="#eef4fb" stroke="#0b5cad" stroke-width="1.5"/>
<use href="#person" x="282" y="166"/>
<text x="282" y="186" font-size="13" font-weight="bold" text-anchor="middle">Out-of-area</text>
<text x="282" y="201" font-size="13" font-weight="bold" text-anchor="middle">contact</text>
<g fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)">
<path d="M126 96 Q190 100 228 140"/>
<path d="M126 156 L228 160"/>
<path d="M126 216 Q190 214 228 180"/>
</g>
<text x="196" y="96" font-size="12" fill="#0b5cad" text-anchor="middle">"I'm safe"</text>
<text x="270" y="228" font-size="12" fill="#0b5cad" text-anchor="middle">passes the news on</text>
<g font-size="14">
<text x="12" y="260">A relative or friend living elsewhere;</text>
<text x="12" y="280">everyone reports to them. When local</text>
<text x="12" y="300">calls fail, calls to another area</text>
<text x="12" y="320"><tspan font-weight="bold">often get through more easily</tspan></text>
</g>
</g>

<!-- 3 numbers on paper -->
<g transform="translate(10,418)">
<rect x="0" y="0" width="226" height="246" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">③ Numbers on paper</text>
<g transform="rotate(-3 113 90)">
<rect x="34" y="40" width="158" height="96" rx="4" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
<g font-size="12"><text x="44" y="60">Family _________</text><text x="44" y="80">Friends ________</text><text x="44" y="100">Work ___________</text><text x="44" y="120">School _________</text></g>
</g>
<text x="12" y="164" font-size="13">Keep in your <tspan font-weight="bold">wallet and</tspan></text>
<text x="12" y="182" font-size="13"><tspan font-weight="bold">emergency bag</tspan>, and a copy in</text>
<text x="12" y="200" font-size="13">your <tspan font-weight="bold">child's school bag</tspan></text>
<text x="12" y="220" font-size="12" fill="#555">With a dead or lost phone, many</text>
<text x="12" y="235" font-size="12" fill="#555">people can't remember one number</text>
</g>

<!-- 4 text, don't call -->
<g transform="translate(246,418)">
<rect x="0" y="0" width="228" height="246" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">④ After: text, call less</text>
<rect x="14" y="40" width="48" height="86" rx="7" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="20" y="50" width="36" height="62" fill="#eef4fb"/>
<circle cx="38" cy="119" r="3" fill="none" stroke="#333" stroke-width="1.2"/>
<path d="M76 40 H214 Q218 40 218 44 V126 Q218 130 214 130 H82 Q78 130 78 126 V78 L68 70 L78 66 V44 Q78 40 82 40 Z" fill="#e8f3e2" stroke="#4d6b2a" stroke-width="1.5"/>
<g font-size="13"><text x="86" y="60">who I am</text><text x="86" y="80">where I am</text><text x="86" y="100">am I safe</text><text x="86" y="120">where I'm going</text></g>
<text x="12" y="152" font-size="13">Texts use less network capacity</text>
<text x="12" y="170" font-size="13">and <tspan font-weight="bold">get through more easily</tspan></text>
<text x="12" y="188" font-size="13">when it is congested</text>
<text x="12" y="210" font-size="13">Keep calls short, then hang up:</text>
<text x="12" y="228" font-size="13">leave lines free for emergencies</text>
</g>

<!-- 5 radio -->
<g transform="translate(484,418)">
<rect x="0" y="0" width="226" height="246" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">⑤ Radio</text>
<path d="M92 50 L130 36" stroke="#333" stroke-width="2"/>
<rect x="56" y="50" width="114" height="66" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="88" cy="83" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
<g stroke="#333" stroke-width="1"><path d="M76 77 H100 M74 83 H102 M76 89 H100"/></g>
<rect x="116" y="66" width="42" height="12" rx="2" fill="#fff" stroke="#333" stroke-width="1.2"/>
<circle cx="137" cy="98" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<path d="M170 76 H184 V100" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="184" cy="103" r="4" fill="#333"/>
<text x="184" y="126" font-size="12" fill="#0b5cad" text-anchor="middle">crank</text>
<text x="12" y="144" font-size="13">With no power or network: the</text>
<text x="12" y="161" font-size="13" font-weight="bold">most reliable source of news</text>
<text x="12" y="181" font-size="13">Keep a wind-up or solar radio</text><text x="12" y="198" font-size="13">in the emergency bag</text>
<text x="12" y="218" font-size="13" fill="#c33" font-weight="bold">Trust official channels only;</text>
<text x="12" y="234" font-size="13" fill="#c33" font-weight="bold">don't believe or spread rumours</text>
</g>

<!-- 6 after separation -->
<g transform="translate(10,674)">
<rect x="0" y="0" width="700" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">⑥ Finding separated family (in this order)</text>
<g fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5">
<rect x="14" y="40" width="204" height="58" rx="6"/><rect x="248" y="40" width="204" height="58" rx="6"/><rect x="482" y="40" width="204" height="58" rx="6"/>
<rect x="14" y="120" width="204" height="58" rx="6"/><rect x="248" y="120" width="204" height="58" rx="6"/><rect x="482" y="120" width="204" height="58" rx="6"/>
</g>
<g fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)">
<path d="M220 69 H244"/><path d="M454 69 H478"/>
<path d="M584 100 V109 H116 V116"/>
<path d="M220 149 H244"/><path d="M454 149 H478"/>
</g>
<g font-size="14">
<text x="24" y="63"><tspan font-weight="bold" fill="#0b5cad">1</tspan> Go to the agreed</text>
<text x="38" y="85">meeting points, wait, look</text>
<text x="258" y="63"><tspan font-weight="bold" fill="#0b5cad">2</tspan> Call the out-of-area</text>
<text x="272" y="85">contact for family news</text>
<text x="492" y="63"><tspan font-weight="bold" fill="#0b5cad">3</tspan> Leave bagged notes at</text>
<text x="506" y="85">home and meeting points</text>
<text x="24" y="143"><tspan font-weight="bold" fill="#0b5cad">4</tspan> At shelters and sites:</text>
<text x="38" y="165">register, ask for family</text>
<text x="258" y="143"><tspan font-weight="bold" fill="#0b5cad">5</tspan> Report to the police</text>
<text x="272" y="165">with photos, description</text>
<text x="492" y="143"><tspan font-weight="bold" fill="#0b5cad">6</tspan> Contact the Red Cross</text>
<text x="506" y="165">etc. for tracing services</text>
</g>
<text x="350" y="206" font-size="13" text-anchor="middle">Notes should say: who I am, the time, whether I am safe, where I have gone, how to reach me</text>
<text x="350" y="230" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">Child or older person missing: call 110 at once; don't wait 24 hours</text>
</g>
</g>
</svg>
