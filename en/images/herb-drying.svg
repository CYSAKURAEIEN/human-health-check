<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1002" width="720" height="1002" role="img" aria-label="Drying medicinal herbs: sun-drying suits most roots and rhizomes, fruits, seeds, barks and whole herbs without volatile oil; spread in a thin layer, turn often, and bring in at dusk so night dew does not re-wet them. Shade-drying suits flowers, leaves and aromatic herbs with volatile oil; dry them in an airy, shady spot or under the eaves, out of strong sun. Oven-drying is for rainy weather, large batches or herbs that must dry fast; use a drying room, a heated kang (brick bed) or a low oven and control the temperature. Oven temperatures: aromatic herbs with volatile oil not above about 35-40°C (textbooks mostly use 35°C), most herbs about 50-60°C, juicy fruits containing vitamin C about 70-90°C for fast drying; oily seeds must not be heated hot or they go oily; brightly coloured flowers, aromatic herbs and roots with volatile oil must not be dried in strong sun. Fully dry when: roots and rhizomes have no damp core in the cut and snap with a crisp sound; leaves and flowers crumble when rubbed; whole-herb stems snap at once; fruits and seeds rattle crisply when shaken; barks snap at once and do not bend or feel soft; weight no longer falls noticeably over two days of weighing. Better to dry one more day than to store herbs before they are fully dry" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Drying medicinal herbs</title>
<defs>
<g id="sl"><ellipse rx="9" ry="4" fill="#e8cfa0" stroke="#333" stroke-width="1"/></g>
</defs>
<g fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">Drying medicinal herbs: sun-drying, shade-drying, oven-drying</text>
<text x="360" y="50" font-size="13" fill="#555" text-anchor="middle">Drying is the most critical step of field processing: dry fast and dry right through, and herbs will not</text>
<text x="360" y="66" font-size="13" fill="#555" text-anchor="middle">go mouldy or spoil (for individual herbs, follow each chapter)</text>
<g transform="translate(0 16)">
<rect x="10" y="66" width="226" height="330" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="24" y="90" font-size="16" font-weight="bold">① Sun-drying</text>
<circle cx="200" cy="116" r="13" fill="#f5c518" stroke="#333" stroke-width="1.5"/>
<path d="M217,116 L224,116 M212,128 L217,133 M200,133 L200,140 M188,128 L183,133 M183,116 L176,116 M188,104 L183,99 M200,99 L200,92 M212,104 L217,99" stroke="#e8a33a" stroke-width="2" stroke-linecap="round"/>
<path d="M46,184 L46,214 M186,184 L186,214" stroke="#8a5a2b" stroke-width="3"/>
<line x1="24" y1="215" x2="222" y2="215" stroke="#999" stroke-width="3"/>
<rect x="34" y="180" width="164" height="6" rx="2" fill="#d9c08a" stroke="#333" stroke-width="1.3"/>
<use href="#sl" x="46" y="176"/>
<use href="#sl" x="66" y="176"/>
<use href="#sl" x="86" y="176"/>
<use href="#sl" x="106" y="176"/>
<use href="#sl" x="126" y="176"/>
<use href="#sl" x="146" y="176"/>
<use href="#sl" x="166" y="176"/>
<use href="#sl" x="186" y="176"/>
<path d="M80,164 C90,142 120,142 130,160" fill="none" stroke="#c33" stroke-width="2"/><path d="M124,156 L131,163 L134,153" fill="none" stroke="#c33" stroke-width="2"/>
<text x="140" y="158" font-size="13" fill="#c33">turn often</text>
<text x="24" y="256" font-size="13"><tspan font-weight="bold">Use for:</tspan> most roots and</text>
<text x="24" y="273" font-size="13">rhizomes, fruits, seeds,</text>
<text x="24" y="290" font-size="13">barks, and whole herbs</text>
<text x="24" y="307" font-size="13">without volatile oil</text>
<text x="24" y="334" font-size="13" fill="#0b5cad">Spread in a thin layer and</text>
<text x="24" y="351" font-size="13" fill="#0b5cad">turn often; bring it in at</text>
<text x="24" y="368" font-size="13" fill="#0b5cad">dusk so night dew does</text>
<text x="24" y="385" font-size="13" fill="#0b5cad">not make it damp again</text>
<rect x="247" y="66" width="226" height="330" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="261" y="90" font-size="16" font-weight="bold">② Shade-drying</text>
<path d="M259,132 L397,106 L461,118 L461,130 L397,120 L259,146 Z" fill="#b9a68a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<line x1="277" y1="146" x2="437" y2="134" stroke="#555" stroke-width="1.5"/>
<path d="M297,143.5 L297,157.5" stroke="#555" stroke-width="1.5"/>
<path d="M297,155.5 L287,203.5 L307,203.5 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M293,173.5 L289,195.5 M300,173.5 L303,195.5" stroke="#6a8a3a" stroke-width="1"/>
<path d="M339,140.3 L339,154.3" stroke="#555" stroke-width="1.5"/>
<path d="M339,152.3 L329,200.3 L349,200.3 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M335,170.3 L331,192.3 M342,170.3 L345,192.3" stroke="#6a8a3a" stroke-width="1"/>
<path d="M381,137.2 L381,151.2" stroke="#555" stroke-width="1.5"/>
<path d="M381,149.2 L371,197.2 L391,197.2 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M377,167.2 L373,189.2 M384,167.2 L387,189.2" stroke="#6a8a3a" stroke-width="1"/>
<path d="M419,134.3 L419,148.3" stroke="#555" stroke-width="1.5"/>
<path d="M419,146.3 L409,194.3 L429,194.3 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M415,164.3 L411,186.3 M422,164.3 L425,186.3" stroke="#6a8a3a" stroke-width="1"/>
<path d="M267,216 q20,-8 40,0 t40,0 t40,0 t40,0 M277,228 q20,-8 40,0 t40,0 t40,0" fill="none" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M425,210 l8,6 l-9,4" fill="none" stroke="#0b5cad" stroke-width="1.5"/>
<text x="443" y="234" font-size="13" fill="#0b5cad" text-anchor="middle">airflow</text>
<text x="261" y="256" font-size="13"><tspan font-weight="bold">Use for:</tspan> flowers, leaves,</text>
<text x="261" y="273" font-size="13">aromatic herbs with volatile</text>
<text x="261" y="290" font-size="13">oil (e.g. Bohe (mint),</text>
<text x="261" y="307" font-size="13">Zisu (perilla))</text>
<text x="261" y="334" font-size="13" fill="#0b5cad">In an airy, shady spot or</text>
<text x="261" y="351" font-size="13" fill="#0b5cad">under the eaves; keep out</text>
<text x="261" y="368" font-size="13" fill="#0b5cad">of strong sun, which drives</text>
<text x="261" y="385" font-size="13" fill="#0b5cad">off aroma and fades colour</text>
<rect x="484" y="66" width="226" height="330" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="498" y="90" font-size="16" font-weight="bold">③ Oven-drying</text>
<rect x="514" y="172" width="140" height="52" rx="3" fill="#d9c8b0" stroke="#333" stroke-width="1.8"/>
<rect x="564" y="194" width="40" height="30" rx="2" fill="#555" stroke="#333" stroke-width="1.5"/>
<path d="M572,224 C568,212 578,208 576,198 C584,206 590,210 586,198 C596,208 600,216 596,224 Z" fill="#e8a33a" stroke="#c33" stroke-width="1.2"/>
<rect x="508" y="162" width="152" height="6" rx="2" fill="#d9c08a" stroke="#333" stroke-width="1.3"/>
<use href="#sl" x="522" y="158"/>
<use href="#sl" x="543" y="158"/>
<use href="#sl" x="564" y="158"/>
<use href="#sl" x="585" y="158"/>
<use href="#sl" x="606" y="158"/>
<use href="#sl" x="627" y="158"/>
<use href="#sl" x="648" y="158"/>
<path d="M544,150 q-5,-8 0,-16 t0,-16 M584,150 q-5,-8 0,-16 t0,-16 M624,150 q-5,-8 0,-16 t0,-16" fill="none" stroke="#c33" stroke-width="1.3" opacity="0.7"/>
<rect x="675" y="112" width="10" height="64" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><rect x="678" y="138" width="4" height="40" fill="#c33"/><circle cx="680" cy="182" r="8" fill="#c33" stroke="#333" stroke-width="1.5"/>
<text x="680" y="206" font-size="12" fill="#c33" text-anchor="middle">control</text>
<text x="680" y="220" font-size="12" fill="#c33" text-anchor="middle">heat</text>
<text x="498" y="256" font-size="13"><tspan font-weight="bold">Use for:</tspan> rainy weather,</text>
<text x="498" y="273" font-size="13">large batches, or herbs</text>
<text x="498" y="290" font-size="13">that must dry fast</text>
<text x="498" y="334" font-size="13" fill="#0b5cad">Use a drying room, a heated</text>
<text x="498" y="351" font-size="13" fill="#0b5cad">kang (brick bed) or a low</text>
<text x="498" y="368" font-size="13" fill="#0b5cad">oven; control the</text>
<text x="498" y="385" font-size="13" fill="#0b5cad">temperature (see below)</text>
<g transform="translate(0 38)">
<rect x="10" y="370" width="700" height="270" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="24" y="394" font-size="16" font-weight="bold">④ Oven temperatures (general textbook principles)</text>
<line x1="236" y1="520" x2="690" y2="520" stroke="#333" stroke-width="1.5"/>
<line x1="236" y1="520" x2="236" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="236" y="540" font-size="12" fill="#555" text-anchor="middle">30°C</text>
<line x1="236" y1="410" x2="236" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="311.7" y1="520" x2="311.7" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="311.7" y="540" font-size="12" fill="#555" text-anchor="middle">40°C</text>
<line x1="311.7" y1="410" x2="311.7" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="387.3" y1="520" x2="387.3" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="387.3" y="540" font-size="12" fill="#555" text-anchor="middle">50°C</text>
<line x1="387.3" y1="410" x2="387.3" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="463" y1="520" x2="463" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="463" y="540" font-size="12" fill="#555" text-anchor="middle">60°C</text>
<line x1="463" y1="410" x2="463" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="538.7" y1="520" x2="538.7" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="538.7" y="540" font-size="12" fill="#555" text-anchor="middle">70°C</text>
<line x1="538.7" y1="410" x2="538.7" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="614.3" y1="520" x2="614.3" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="614.3" y="540" font-size="12" fill="#555" text-anchor="middle">80°C</text>
<line x1="614.3" y1="410" x2="614.3" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="690" y1="520" x2="690" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="690" y="540" font-size="12" fill="#555" text-anchor="middle">90°C</text>
<line x1="690" y1="410" x2="690" y2="520" stroke="#eee" stroke-width="1"/>
<text x="24" y="431" font-size="13">Aromatic herbs (volatile oil)</text>
<path d="M222,426 L236,416 L273.8,416 L273.8,436 L236,436 Z" fill="#8fbf6a" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
<rect x="273.8" y="416" width="37.8" height="20" fill="#8fbf6a" fill-opacity="0.4" stroke="#333" stroke-width="1" stroke-dasharray="3 2"/>
<text x="319.7" y="431" font-size="14" font-weight="bold" fill="#0b5cad">not above about 35-40°C<tspan font-weight="normal" font-size="12" fill="#555"> (textbooks mostly use 35°C)</tspan></text>
<text x="24" y="467" font-size="13">Most herbs</text>
<rect x="387.3" y="452" width="75.7" height="20" fill="#e8a33a" stroke="#333" stroke-width="1"/>
<text x="471" y="467" font-size="14" font-weight="bold" fill="#0b5cad">about 50-60°C</text>
<text x="24" y="503" font-size="13">Juicy fruits with vitamin C</text>
<rect x="538.7" y="488" width="151.3" height="20" fill="#d9534f" stroke="#333" stroke-width="1"/>
<text x="530.7" y="503" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="end">about 70-90°C, fast drying</text>
<text x="24" y="566" font-size="13"><tspan fill="#c33" font-weight="bold">✗ No high heat:</tspan> oily seeds such as Xingren (apricot kernel), Taoren (peach kernel)</text>
<text x="38" y="583" font-size="13">and Baiziren (arborvitae seed); heat makes them "go oily" (oil seeps out)</text>
<text x="24" y="606" font-size="13"><tspan fill="#c33" font-weight="bold">✗ No strong sun:</tspan> brightly coloured flowers such as Honghua (safflower) and Jinyinhua (honeysuckle);</text>
<text x="38" y="623" font-size="13">aromatic herbs; roots with volatile oil such as Danggui (Chinese angelica) and Chuanxiong (Sichuan lovage)</text>
<g transform="translate(0 40)">
<rect x="10" y="612" width="700" height="212" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="24" y="636" font-size="16" font-weight="bold">⑤ How to tell it is fully dry</text>
<path d="M28,684 L62,680 L66,688 L62,696 L28,700 Z" fill="#e8cfa0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M74,676 L108,672 L108,688 L74,692 L78,684 Z" fill="#e8cfa0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
