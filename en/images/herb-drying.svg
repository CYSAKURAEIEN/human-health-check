<path d="M154,688 C164,666 188,666 204,680 L192,686 L200,692 L186,694 L190,702 C174,704 160,700 154,688 Z" fill="#c9d7a0" stroke="#333" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M206,696 l6,3 l-3,5 Z M214,686 l5,2 l-2,5 Z M204,710 l5,1 l-2,4 Z M218,704 l3,3 l-4,2 Z" fill="#c9d7a0" stroke="#333" stroke-width="1"/>
<path d="M266,710 L297,688 M303,686 L330,662" stroke="#7a8a4a" stroke-width="5" stroke-linecap="round"/>
<path d="M280,700 l-8,-12 M318,672 l10,4" stroke="#7a8a4a" stroke-width="2"/>
<path d="M298,676 l-4,-8 M304,674 l1,-9 M310,676 l5,-7" stroke="#c33" stroke-width="1.5" stroke-linecap="round"/>
<path d="M392,678 L444,678 L438,710 Q418,716 398,710 Z" fill="#f3eadb" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<ellipse cx="406" cy="698" rx="4" ry="3" fill="#a0522d" stroke="#333" stroke-width="0.8"/>
<ellipse cx="416" cy="702" rx="4" ry="3" fill="#a0522d" stroke="#333" stroke-width="0.8"/>
<ellipse cx="426" cy="698" rx="4" ry="3" fill="#a0522d" stroke="#333" stroke-width="0.8"/>
