<ellipse cx="410" cy="706" rx="4" ry="3" fill="#a0522d" stroke="#333" stroke-width="0.8"/>
<ellipse cx="422" cy="708" rx="4" ry="3" fill="#a0522d" stroke="#333" stroke-width="0.8"/>
<ellipse cx="402" cy="704" rx="4" ry="3" fill="#a0522d" stroke="#333" stroke-width="0.8"/>
<path d="M382,686 q-6,8 0,16 M376,682 q-8,12 0,24 M454,686 q6,8 0,16 M460,682 q8,12 0,24" fill="none" stroke="#c33" stroke-width="1.5"/>
<path d="M496,690 Q514,682 530,684 L534,692 L530,698 Q514,696 496,702 Z" fill="#9c7a54" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M540,680 Q558,674 576,678 L576,690 Q558,688 542,694 L544,686 Z" fill="#9c7a54" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M532,670 l-4,-8 M538,668 l0,-9 M544,670 l4,-8" stroke="#c33" stroke-width="1.5" stroke-linecap="round"/>
<path d="M622,708 L682,708 L676,686 L628,686 Z" fill="#ddd" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="652" cy="697" r="8" fill="#fff" stroke="#333" stroke-width="1.2"/><path d="M652,697 L657,692" stroke="#c33" stroke-width="1.5"/>
<path d="M624,682 L680,682" stroke="#333" stroke-width="2"/>
<use href="#sl" x="636" y="676"/>
<use href="#sl" x="644" y="672"/>
<use href="#sl" x="652" y="676"/>
<use href="#sl" x="660" y="672"/>
<use href="#sl" x="668" y="676"/>
<text x="74" y="750" font-size="14" font-weight="bold" text-anchor="middle">Roots, rhizomes</text>
<text x="74" y="770" font-size="13" text-anchor="middle">No damp core in</text>
<text x="74" y="787" font-size="13" text-anchor="middle">the cut; snaps</text>
<text x="74" y="804" font-size="13" text-anchor="middle">crisply</text>
<text x="186" y="750" font-size="14" font-weight="bold" text-anchor="middle">Leaves, flowers</text>
<text x="186" y="770" font-size="13" text-anchor="middle">Crumble when</text>
<text x="186" y="787" font-size="13" text-anchor="middle">rubbed; powder</text>
<text x="186" y="804" font-size="13" text-anchor="middle">when pinched</text>
<text x="300" y="750" font-size="14" font-weight="bold" text-anchor="middle">Whole herbs</text>
<text x="300" y="770" font-size="13" text-anchor="middle">Stem snaps</text>
<text x="300" y="787" font-size="13" text-anchor="middle">at once</text>
<text x="418" y="750" font-size="14" font-weight="bold" text-anchor="middle">Fruits, seeds</text>
<text x="418" y="770" font-size="13" text-anchor="middle">Shake a handful:</text>
<text x="418" y="787" font-size="13" text-anchor="middle">a crisp rattle</text>
<text x="536" y="750" font-size="14" font-weight="bold" text-anchor="middle">Barks</text>
<text x="536" y="770" font-size="13" text-anchor="middle">Snap at once;</text>
<text x="536" y="787" font-size="13" text-anchor="middle">not bendy or soft</text>
<text x="652" y="750" font-size="14" font-weight="bold" text-anchor="middle">Weighing</text>
<text x="652" y="770" font-size="13" text-anchor="middle">Weigh two days</text>
<text x="652" y="787" font-size="13" text-anchor="middle">running: no clear</text>
<text x="652" y="804" font-size="13" text-anchor="middle">further loss</text>
<g transform="translate(0 20)">
<rect x="10" y="816" width="700" height="62" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="360" y="842" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">⚠️ Better to dry it one more day than to store it before it is fully dry:</text>
<text x="360" y="864" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">otherwise it will go mouldy within a few days</text>
</g>
</g>
</g>
</g>
</g>
</svg>
