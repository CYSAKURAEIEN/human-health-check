<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 972" width="720" height="972" role="img" aria-label="Why a wheelbarrow saves effort: a wheelbarrow is a lever; the wheel is the fulcrum, the load is in the middle and the person pushes at the handle end; effort times effort arm equals load times load arm, so the closer the load is to the wheel, the less weight the person carries. The common builders' barrow has its wheel at the front, so the person has to lift a good part of the weight; load the heavy items on the side nearest the wheel. The traditional Chinese wheelbarrow has a big wheel in the middle of the barrow and the load on both sides; the centre of gravity is almost directly above the wheel, so the person mainly just steadies it and pushes, and one person can push over 100 kg, even along narrow field banks and mountain tracks. The bigger the wheel, the more easily it rolls over stones and holes; a shoulder strap between the two handles takes some of the load off the hands" font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>Why a wheelbarrow saves effort</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="dimB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#0b5cad"/></marker>
<!-- builders' barrow: wheel centre at (0,0), handle end at (390,-56) -->
<g id="barrow">
<path d="M0,0 L390,-56" stroke="#8f6d2e" stroke-width="7" stroke-linecap="round"/>
<path d="M60,-50 L60,-9 M190,-50 L190,-27" stroke="#333" stroke-width="3"/>
<path d="M215,-31 L222,22 M214,22 H230" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M-8,-100 L246,-100 L210,-50 L44,-50 Z" fill="#ececec" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="366" y1="-52.5" x2="398" y2="-57" stroke="#333" stroke-width="11" stroke-linecap="round"/>
<circle r="34" fill="#e8eef5" stroke="#333" stroke-width="3"/>
<circle r="22" fill="none" stroke="#999" stroke-width="1.5"/>
<circle r="5" fill="#333"/>
</g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Why a wheelbarrow saves effort: a wheelbarrow is a lever</text>

<!-- 1 lever -->
<rect x="10" y="44" width="700" height="322" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="15" font-weight="bold">① The wheel is the fulcrum, the load in the middle, the person pushes at the handle end</text>
<path d="M20,286 H480" stroke="#999" stroke-width="3"/>
<g transform="translate(78,252)">
<use href="#barrow"/>
<path d="M2,-100 Q20,-136 60,-138 Q100,-150 140,-136 Q180,-130 200,-112 L214,-100 Z" fill="#b5a58a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<circle cx="100" cy="-118" r="6" fill="#c33"/>
<path d="M100,-110 V-30" stroke="#c33" stroke-width="3.5" marker-end="url(#arR)"/>
<path d="M390,-6 V-46" stroke="#c33" stroke-width="3.5" marker-end="url(#arR)"/>
</g>
<text x="186" y="193" font-size="13" font-weight="bold" fill="#c33">weight of the load</text>
<text x="458" y="236" font-size="14" font-weight="bold" fill="#c33" text-anchor="end">person's effort</text>
<text x="458" y="254" font-size="13" fill="#c33" text-anchor="end">(lifting the handles)</text>
<path d="M78,252 L40,191" stroke="#555" stroke-width="1"/>
<text x="20" y="168" font-size="14" font-weight="bold" fill="#0b5cad">fulcrum</text><text x="20" y="185" font-size="14" font-weight="bold" fill="#0b5cad">(wheel)</text>
<!-- lever arms -->
<path d="M78,262 V342 M178,140 V314 M468,214 V342" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="79" y1="304" x2="177" y2="304" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<text x="128" y="298" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">load arm</text>
<line x1="79" y1="334" x2="467" y2="334" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<text x="273" y="354" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">effort arm</text>
<!-- notes on the right -->
<rect x="500" y="92" width="196" height="62" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="598" y="118" font-size="15" font-weight="bold" text-anchor="middle">effort × effort arm</text>
<text x="598" y="142" font-size="15" font-weight="bold" text-anchor="middle">= load × load arm</text>
<text x="500" y="182" font-size="14">The effort arm (wheel to</text><text x="500" y="200" font-size="14">handles) is longer than the</text>
<text x="500" y="218" font-size="14">load arm (wheel to load)</text>
<text x="500" y="236" font-size="14">→ the force in your hands is</text><text x="500" y="254" font-size="14">less than the load</text>
<text x="500" y="282" font-size="14" font-weight="bold" fill="#c33">The closer the load is to</text>
<text x="500" y="300" font-size="14" font-weight="bold" fill="#c33">the wheel, the less weight</text><text x="500" y="318" font-size="14" font-weight="bold" fill="#c33">the person carries</text>

<!-- 2 loading -->
<rect x="10" y="378" width="700" height="226" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="404" font-size="15" font-weight="bold">② Builders' barrow (wheel at the front): load the heavy items nearest the wheel</text>
<path d="M30,542 H340 M380,542 H690" stroke="#999" stroke-width="3"/>
<g transform="translate(64,521) scale(0.62)">
<use href="#barrow"/>
<rect x="6" y="-146" width="90" height="46" rx="4" fill="#9a9a9a" stroke="#333" stroke-width="3"/>
<circle cx="51" cy="-123" r="8" fill="#c33"/>
<path d="M390,-6 V-36" stroke="#c33" stroke-width="5" marker-end="url(#arR)"/>
</g>
<g transform="translate(414,521) scale(0.62)">
<use href="#barrow"/>
<rect x="140" y="-146" width="90" height="46" rx="4" fill="#9a9a9a" stroke="#333" stroke-width="3"/>
<circle cx="185" cy="-123" r="8" fill="#c33"/>
<path d="M390,34 V-46" stroke="#c33" stroke-width="5" marker-end="url(#arR)"/>
</g>
<text x="185" y="570" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">✓ Heavy near the wheel: light in the hands</text>
<text x="535" y="570" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">✗ Heavy near the handles: heavy in the hands</text>
<text x="360" y="594" font-size="14" text-anchor="middle" fill="#555">With this barrow the person has to lift a good part of the weight</text>

<!-- 3 traditional Chinese wheelbarrow -->
<rect x="10" y="616" width="700" height="346" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="642" font-size="15" font-weight="bold">③ Traditional Chinese wheelbarrow: big wheel in the middle, load on both sides</text>
<text x="40" y="664" font-size="14" fill="#555">side view</text>
<path d="M20,840 H450" stroke="#999" stroke-width="3"/>
<!-- frame -->
<path d="M96,768 L362,752" stroke="#8f6d2e" stroke-width="7" stroke-linecap="round"/>
<path d="M300,756 L306,830 M298,830 H314" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M118,768 V712 H222 V768" fill="none" stroke="#8f6d2e" stroke-width="5" stroke-linejoin="round"/>
<circle cx="170" cy="782" r="58" fill="#e8eef5" stroke="#333" stroke-width="3"/>
<circle cx="170" cy="782" r="44" fill="none" stroke="#999" stroke-width="1.5"/>
<path d="M170,738 V826 M126,782 H214 M139,751 L201,813 M139,813 L201,751" stroke="#999" stroke-width="1.5"/>
<circle cx="170" cy="782" r="6" fill="#333"/>
<!-- load (the near-side sack) -->
<path d="M120,770 Q114,736 132,724 Q170,714 208,724 Q226,736 220,770 Z" fill="#e2cf9f" fill-opacity="0.92" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<circle cx="170" cy="746" r="6" fill="#c33"/>
<path d="M170,754 V832" stroke="#c33" stroke-width="3" stroke-dasharray="6 4"/>
<text x="24" y="686" font-size="13" font-weight="bold" fill="#c33">centre of gravity almost</text>
<text x="24" y="702" font-size="13" font-weight="bold" fill="#c33">directly above the wheel</text>
<path d="M100,707 L163,743" stroke="#c33" stroke-width="1"/>
<!-- person pushing -->
<path d="M404,704 L394,744 L364,752" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360,752 Q372,712 398,694 Q408,690 416,696" fill="none" stroke="#8f6d2e" stroke-width="3.5" stroke-linecap="round"/>
<g transform="rotate(-18 418 734)"><rect x="405" y="696" width="26" height="76" rx="11" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/></g>
<circle cx="404" cy="680" r="14" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M428,764 L400,838 M430,766 L446,838" stroke="#333" stroke-width="6" stroke-linecap="round"/>
<path d="M372,716 L348,700" stroke="#555" stroke-width="1"/>
<text x="344" y="700" font-size="14" font-weight="bold" text-anchor="end">shoulder strap</text>
<!-- rear view -->
<line x1="464" y1="660" x2="464" y2="856" stroke="#ddd" stroke-width="1.5"/>
<text x="484" y="668" font-size="14" fill="#555">rear view</text>
<path d="M480,840 H700" stroke="#999" stroke-width="3"/>
<rect x="582" y="724" width="16" height="116" rx="7" fill="#e8eef5" stroke="#333" stroke-width="2.5"/>
<path d="M566,770 V712 H614 V770" fill="none" stroke="#8f6d2e" stroke-width="5" stroke-linejoin="round"/>
<path d="M500,770 H680" stroke="#8f6d2e" stroke-width="6" stroke-linecap="round"/>
<path d="M506,768 Q500,730 518,722 Q536,716 554,722 Q566,730 560,768 Z" fill="#e2cf9f" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M620,768 Q614,730 632,722 Q650,716 668,722 Q680,730 674,768 Z" fill="#e2cf9f" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M534,772 L528,830 M646,772 L652,830" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<text x="590" y="700" font-size="14" font-weight="bold" text-anchor="middle">load on both sides</text>
<text x="230" y="866" font-size="14" text-anchor="middle">The person mainly just steadies it and pushes</text>
<text x="590" y="866" font-size="13" text-anchor="middle" font-weight="bold">One person can push over 100 kg</text>
<text x="590" y="884" font-size="13" text-anchor="middle" fill="#555">even along narrow field banks</text><text x="590" y="900" font-size="13" text-anchor="middle" fill="#555">and mountain tracks</text>
<text x="24" y="928" font-size="14" fill="#555">✓ The bigger the wheel, the more easily it rolls over stones and holes</text><text x="24" y="948" font-size="14" fill="#555">✓ A shoulder strap between the two handles takes some of the load off your hands</text>
</g>
</svg>
