<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 792" width="720" height="792" role="img" aria-label="Cross-section of a family fish pond and preparation before stocking. Water depth 1.5-3 m, grow-out ponds usually 2-2.5 m; silt on the bottom 10-20 cm, dredge if thicker; bank top at least 1.5-2 m wide, inner slope about 1:2-1:3 (for every 1 m rise, 2-3 m across), bank top 30-50 cm above the highest water level, built up and rammed in layers (each about 20-30 cm), grass planted on the bank to protect it, no deep-rooted trees; the inlet is above the water surface so water falls into the pond and picks up oxygen, with two screens (coarse then fine, such as a 40-60 mesh nylon net bag); the drain is at the lowest point of the bottom so the pond can be emptied, using a buried standpipe or a stop-log sluice, with a fish screen on the outlet; an overflow with a fish screen at the highest water level. Polyculture: silver and bighead carp in the upper layer, grass carp in the middle to lower layers, common and crucian carp at the bottom. For a family's own use, a pond of 700-2000 m² is best, rectangular, length to width about 2-3:1, running east-west. 15-20 days before stocking, drain the pond (or leave 5-10 cm), remove wild fish, repair the banks, remove silt (leave 10-20 cm), and disinfect with quicklime, bleaching powder or tea-seed cake; quicklime stops being toxic after about 7-10 days; 7-10 days before stocking, fill to 50-80 cm and add well-rotted organic manure; test the water for a day (24 hours) and stock if the test fish are normal; stock when the water is yellow-green or tea-brown with a transparency of about 25-30 cm.">
<rect width="100%" height="100%" fill="#fff"/>
<title>Family fish pond: cross-section and preparation before stocking</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<g id="fish"><path d="M0,0 Q11,-7 22,0 Q11,7 0,0 Z M22,0 L29,-5 L28,0 L29,5 Z" fill="#9fb3c4" stroke="#333" stroke-width="1"/><circle cx="5" cy="-1" r="1.2" fill="#333"/></g>
<path id="grass" d="M0,0 l-3,-7 M0,0 l0,-8 M0,0 l3,-7" stroke="#5a8a3a" stroke-width="1.5" fill="none"/>
<pattern id="layers" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="#e6d6b4"/><path d="M0,9.5 H20" stroke="#cdb88e" stroke-width="1"/></pattern>
</defs>
<g font-family="'Noto Sans','Noto Sans CJK SC',Arial,sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">Family fish pond: cross-section and preparation before stocking</text>
<g transform="translate(10,42)">
<rect width="700" height="430" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">① Pond cross-section <tspan font-size="13" font-weight="normal" fill="#555">(schematic, vertical scale about ×2)</tspan></text>
<path d="M10,196 H62 L92,150 H127 L277,270 L447,276 L597,150 H632 L668,300 H690 V312 H10 Z" fill="url(#layers)" stroke="none"/>
<path d="M664,290 L668,300 H690" fill="none" stroke="#999" stroke-width="2"/>
<path d="M152,170 L277,270 L447,276 L572,170 Z" fill="#cfe5f5"/>
<path d="M265,260 L277,270 L447,276 L459,266 L447,282 L277,278 Z" fill="#7d6a4a"/>
<path d="M277,270 L447,276" stroke="#5e4c30" stroke-width="1"/>
<path d="M10,196 H62 L92,150 H127 L277,270 L447,276 L597,150 H632 L668,300 H690" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M152,170 H572" stroke="#3a7fc0" stroke-width="2"/>
<path d="M147,166 H577" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="161" font-size="13" fill="#0b5cad">highest water level</text>
<use href="#grass" x="98" y="150"/>
<use href="#grass" x="112" y="150"/>
<use href="#grass" x="122" y="150"/>
<use href="#grass" x="136" y="157"/>
<use href="#grass" x="603" y="150"/>
<use href="#grass" x="617" y="150"/>
<use href="#grass" x="628" y="150"/>
<use href="#grass" x="586" y="159"/>
<use href="#grass" x="640" y="190"/>
<use href="#grass" x="650" y="230"/>
<use href="#grass" x="74" y="182"/>
<use href="#grass" x="40" y="196"/>
<rect x="10" y="128" width="154" height="12" fill="#bbb" stroke="#333" stroke-width="1.5"/>
<path d="M60,126 V142 M66,126 V142 M72,126 V142" stroke="#555" stroke-width="1.2"/>
<path d="M164,126 Q186,132 178,150 Q170,154 162,148 Q156,140 164,142 Z" fill="#fff" stroke="#0b5cad" stroke-width="1.2"/>
<path d="M164,128 L180,148 M170,128 L164,150 M176,134 L166,146 M160,136 L180,138" stroke="#0b5cad" stroke-width="0.6"/>
<path d="M172,152 Q176,160 174,168 M166,152 Q166,160 162,168" fill="none" stroke="#3a7fc0" stroke-width="1.8"/>
<path d="M14,134 H44" stroke="#0b5cad" stroke-width="1.5" marker-end="url(#arB)"/>
<rect x="577" y="161" width="78" height="9" fill="#bbb" stroke="#333" stroke-width="1.2"/>
<path d="M581,158 V173 M585,158 V173" stroke="#333" stroke-width="1.2"/>
<path d="M657,166 Q664,168 664,182" fill="none" stroke="#3a7fc0" stroke-width="1.8" marker-end="url(#arB)"/>
<rect x="450" y="170" width="8" height="106" fill="#bbb" stroke="#333" stroke-width="1.2"/>
<rect x="452" y="276" width="216" height="10" fill="#bbb" stroke="#333" stroke-width="1.2"/>
<path d="M670,274 V292 M675,274 V292" stroke="#333" stroke-width="1.2"/>
<use href="#fish" x="180" y="184"/><use href="#fish" x="212" y="190"/>
<text x="246" y="194" font-size="12">silver, bighead carp: top</text>
<use href="#fish" x="242" y="232"/>
<text x="278" y="242" font-size="12">grass carp: middle-lower</text>
<use href="#fish" x="282" y="258"/>
<text x="318" y="263" font-size="12">carp, crucian: bottom</text>
<path d="M440,172 V274 M440,172 l-4,7 M440,172 l4,7 M440,274 l-4,-7 M440,274 l4,-7" fill="none" stroke="#c33" stroke-width="1.5"/>
<text x="434" y="212" font-size="13" fill="#c33" font-weight="bold" text-anchor="end">depth 1.5-3 m</text>
<text x="434" y="227" font-size="12" fill="#c33" text-anchor="end">grow-out: 2-2.5 m</text>
<path d="M177,190 V230 H227" fill="none" stroke="#c33" stroke-width="1.5"/>
<text x="166" y="215" font-size="13" fill="#c33" text-anchor="end">1</text>
<text x="202" y="246" font-size="13" fill="#c33" text-anchor="middle">2-3</text>
<path d="M597,140 V134 H632 V140" fill="none" stroke="#0b5cad" stroke-width="1.2"/>
<path d="M597,150 H560" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M564,150 V166" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M560,150 h8 M560,166 h8" stroke="#0b5cad" stroke-width="1.5"/>
<g font-size="13" fill="#0b5cad">
<text x="14" y="52">Inlet above the water: it falls in (adds oxygen)</text>
<text x="14" y="68">Two screens, coarse then fine (e.g. 40-60 mesh</text>
<text x="14" y="84">nylon net bag): keep out wild fish, spawn, predators</text>
<line x1="66" y1="90" x2="66" y2="124" stroke="#0b5cad" stroke-width="1"/>
<line x1="170" y1="90" x2="172" y2="124" stroke="#0b5cad" stroke-width="1"/>
<text x="690" y="52" text-anchor="end">Bank top at least 1.5-2 m wide</text>
<line x1="614" y1="58" x2="614" y2="132" stroke="#0b5cad" stroke-width="1"/>
<text x="598" y="84" text-anchor="end">Overflow (with fish screen):</text>
<text x="598" y="100" text-anchor="end">excess rain water leaves here</text>
<line x1="600" y1="104" x2="652" y2="160" stroke="#0b5cad" stroke-width="1"/>
<text x="226" y="117">Bank top 30-50 cm above highest level,</text>
<text x="226" y="133">so heavy rain cannot flood out the fish</text>
<line x1="474" y1="123" x2="562" y2="152" stroke="#0b5cad" stroke-width="1"/>
<text x="72" y="122" font-size="12">coarse</text>
<text x="188" y="134" font-size="12">fine</text>
</g>
<g font-size="13">
<rect x="240" y="288" width="178" height="20" rx="4" fill="#fff" stroke="#5e4c30" stroke-width="1"/>
<text x="248" y="303" font-size="12" fill="#5e4c30">silt 10-20 cm (dredge if thicker)</text>
<line x1="330" y1="288" x2="336" y2="278" stroke="#5e4c30" stroke-width="1"/>
<text x="560" y="304" font-size="12" fill="#0b5cad" text-anchor="middle">drain at the lowest point</text>
<text x="14" y="334" fill="#c33">Inner slope about 1:2-1:3: each 1 m rise runs 2-3 m across; gentler in sandy soil.</text>
<text x="14" y="350" fill="#c33">Less likely to collapse, and people or animals that fall in can climb out.</text>
<text x="14" y="370" fill="#0b5cad">Build the bank in layers (about 20-30 cm each), ramming each; grass the bank, no deep-rooted trees.</text>
<text x="14" y="386" fill="#0b5cad">Clay and loam hold water; in sandy soil, line the bottom and inner bank with about 30 cm of rammed clay.</text>
<text x="14" y="406" fill="#0b5cad">Drain at the lowest point, so the pond can be emptied: a buried standpipe (pull it out to drain)</text>
<text x="14" y="422" fill="#0b5cad">or a stop-log sluice; fish screen on the outlet.</text>
</g>
</g>
<g transform="translate(10,482)">
<rect width="250" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">② Size and shape (plan)</text>
<rect x="40" y="56" width="170" height="68" rx="4" fill="#cfe5f5" stroke="#333" stroke-width="2"/>
<text x="30" y="95" font-size="13" text-anchor="end">W</text>
<text x="220" y="95" font-size="13">E</text>
<path d="M125,48 V40 M121,44 L125,36 L129,44" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="134" y="46" font-size="12" fill="#555">N</text>
<path d="M40,132 V138 H210 V132" fill="none" stroke="#0b5cad" stroke-width="1.2"/>
<text x="125" y="154" font-size="13" fill="#0b5cad" text-anchor="middle">length : width ≈ 2-3 : 1,</text>
<text x="125" y="170" font-size="13" fill="#0b5cad" text-anchor="middle">easy to pull a net through</text>
<text x="12" y="198" font-size="13" font-weight="bold">Family use: 700-2000 m² is best</text>
<text x="12" y="216" font-size="13">Too small: water quality swings fast,</text>
<text x="12" y="232" font-size="13">oxygen runs short; too big: hard</text>
<text x="12" y="248" font-size="13">to clear and harvest</text>
<text x="12" y="270" font-size="13">East-west: more sun, and wind on</text>
<text x="12" y="286" font-size="13">the water adds oxygen</text>
</g>
<g transform="translate(266,482)">
<rect width="444" height="300" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">③ Before stocking</text>
<circle cx="24" cy="48" r="9" fill="#0b5cad"/>
<text x="24" y="53" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<line x1="24" y1="58" x2="24" y2="95" stroke="#0b5cad" stroke-width="2"/>
<text x="42" y="53" font-size="14" font-weight="bold">15-20 days before stocking: clear the pond</text>
<text x="42" y="71" font-size="13">Drain (or leave 5-10 cm), remove wild fish and predators,</text>
<text x="42" y="87" font-size="13">mend banks and leaks; <tspan fill="#555">dig out excess silt (leave 10-20 cm)</tspan></text>
<circle cx="24" cy="104" r="9" fill="#0b5cad"/>
<text x="24" y="109" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<line x1="24" y1="114" x2="24" y2="167" stroke="#0b5cad" stroke-width="2"/>
<text x="42" y="109" font-size="14" font-weight="bold">Disinfect (any one)</text>
<text x="42" y="127" font-size="13">Quicklime, bleaching powder or tea-seed cake; wait until</text>
<text x="42" y="143" font-size="13">it is no longer toxic: <tspan fill="#555">quicklime about 7-10 days,</tspan></text>
<text x="42" y="159" font-size="13" fill="#555">bleaching powder about 4-5 days, tea-seed cake about 7 days</text>
<circle cx="24" cy="176" r="9" fill="#0b5cad"/>
<text x="24" y="181" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<line x1="24" y1="186" x2="24" y2="223" stroke="#0b5cad" stroke-width="2"/>
<text x="42" y="181" font-size="14" font-weight="bold">7-10 days before stocking: fill, add base manure</text>
<text x="42" y="199" font-size="13">Fill to 50-80 cm, add well-rotted manure (never raw manure);</text>
<text x="42" y="215" font-size="13" fill="#555">always screen the inlet</text>
<circle cx="24" cy="232" r="9" fill="#0b5cad"/>
<text x="24" y="237" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="42" y="237" font-size="14" font-weight="bold">Test the water, then stock</text>
<text x="42" y="255" font-size="13">Keep a few fish in the pond for a day (24 hours); if they</text>
<text x="42" y="271" font-size="13">swim normally, stock. <tspan fill="#555">Best: yellow-green or tea-brown water,</tspan></text>
<text x="42" y="287" font-size="13" fill="#555">transparency about 25-30 cm</text>
</g>
</g>
</svg>
