<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 990" width="720" height="990" role="img" aria-label="灾后遗体处理要点。救活人优先;发现遗体报告110或当地政府,不要自行搬运、掩埋或焚烧。① 先弄清真正的风险: 因外伤、溺水、火灾等原因死于灾害的人,遗体一般不会引起疫病流行;不要匆忙集体掩埋或焚烧,不撒石灰、不喷消毒液。真正要注意的: 遗体在水源里或附近,尽快移出,受影响的水煮沸或消毒后才能喝;死于霍乱等传染病的人,不清洗、不触摸,报告疾控;处理遗体的人受伤感染、搬运时受伤。② 接触时的防护: 戴手套,穿长袖衣服、靴子;手上有伤口先包扎好或避免接触;接触后用肥皂和流动水洗手;处理时不吃不喝不抽烟、不摸脸;衣物和手套用后清洗或丢弃;有条件时戴口罩,主要减轻气味,不是防疫。③ 每具遗体一个唯一编号,如地点缩写-001,处处写同一个编号: 写在防水标签上系在遗体上;写在包裹的袋子或布外面;随身物品装袋写同一编号,不和遗体分开,交给公安或负责机构;拍照时编号牌出现在每张照片里,拍面部正面、全身、衣服、鞋子,文身、疤痕、胎记、首饰;记录发现的时间、具体地点,大概的性别、年龄、身高、体型,衣物、随身物品、明显特征。面部特征很快改变,越早记录越好;不要只凭家属看照片或看一眼就确定身份后匆忙下葬。④ 万不得已时的临时埋葬,只在长期与外界隔绝、没有任何机构可以联系时,先完成辨认和记录: 单独埋葬;远离饮用水源,4具以下至少200 m,5-60具至少250 m,60具以上至少350 m;墓底高于地下水位至少2 m,挖坑时渗水的地方不能埋;坑深约1.5 m以上;选地势较高、不会被洪水淹没的地方,远离住房;每个墓立标记写编号,画地图记录每个墓的位置和编号" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>灾后遗体处理要点</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
<g id="no"><circle r="17" fill="none" stroke="#c33" stroke-width="3"/><path d="M-12,-12 L12,12" stroke="#c33" stroke-width="3"/></g>
<g id="tagN"><path d="M0,0 H74 L86,11 L74,22 H0 Z" fill="#fffbe8" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/><circle cx="76" cy="11" r="2.5" fill="#fff" stroke="#333" stroke-width="1"/><text x="37" y="15" font-size="10" font-weight="bold" fill="#c33" text-anchor="middle">地点缩写-001</text></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">灾后遗体处理: 防护、编号记录,万不得已时临时埋葬</text>
<text x="360" y="50" font-size="13" fill="#555" text-anchor="middle">救活人永远优先;发现遗体报告110或当地政府,说明位置,不要自行搬运、掩埋或焚烧</text>

<!-- ① 风险 -->
<rect x="8" y="64" width="704" height="142" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="88" font-size="15" font-weight="bold">① 先弄清真正的风险</text>
<rect x="18" y="98" width="330" height="98" rx="4" fill="#e3eefa" stroke="#0b5cad" stroke-width="1.2"/>
<g font-size="13">
<text x="28" y="117" font-weight="bold" fill="#0b5cad">因外伤、溺水、火灾等原因死于灾害的人,</text>
<text x="28" y="135" font-weight="bold" fill="#0b5cad">遗体一般不会引起疫病流行</text>
<text x="28" y="155" fill="#c33">✗ 不要因为怕瘟疫匆忙集体掩埋或焚烧</text>
<text x="40" y="171" font-size="12" fill="#555">(遗体无法辨认,家属找不到亲人)</text>
<text x="28" y="189" fill="#c33">✗ 不撒石灰、不喷消毒液(没有防疫作用)</text>
</g>
<rect x="358" y="98" width="344" height="98" rx="4" fill="#fbe9e9" stroke="#c33" stroke-width="1.2"/>
<g font-size="13">
<text x="368" y="118" font-weight="bold" fill="#c33">真正要注意的:</text>
<text x="368" y="138">· 遗体在水源里或附近: 尽快移出,</text>
<text x="380" y="155">受影响的水煮沸或消毒后才能喝</text>
<text x="368" y="174">· 死于霍乱等传染病: 不清洗、不触摸,报告疾控</text>
<text x="368" y="192">· 处理遗体的人受伤感染、搬运时受伤</text>
</g>

<!-- ② 防护 -->
<rect x="8" y="216" width="704" height="186" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="240" font-size="15" font-weight="bold">② 接触时的防护</text>
<g stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<!-- 手套 -->
<g transform="translate(74,310)" fill="#f0c94a">
<path d="M-16,30 V-6 Q-26,-12 -24,-22 Q-20,-28 -12,-20 V-36 Q-12,-42 -7,-42 Q-2,-42 -2,-36 V-44 Q-2,-50 3,-50 Q8,-50 8,-44 V-38 Q8,-44 13,-44 Q18,-44 18,-38 V-30 Q18,-35 22,-35 Q27,-35 27,-30 V8 Q27,20 18,30 Z"/>
<path d="M-2,-36 V-14 M8,-38 V-14 M18,-30 V-14" fill="none" stroke-width="1.2"/>
<rect x="-18" y="30" width="38" height="10" rx="2" fill="#cfe0f0"/>
</g>
<!-- 包扎伤口 -->
<g transform="translate(190,310)" fill="#f3e3d3">
<path d="M-18,30 V-4 Q-26,-10 -24,-20 Q-20,-26 -12,-18 V-36 Q-12,-42 -7,-42 Q-2,-42 -2,-36 V-44 Q-2,-50 3,-50 Q8,-50 8,-44 V-38 Q8,-44 13,-44 Q18,-44 18,-38 V-30 Q18,-35 22,-35 Q27,-35 27,-30 V8 Q27,20 18,30 Z"/>
<rect x="-19" y="-8" width="46" height="14" rx="2" fill="#fff" transform="rotate(-12 4 -1)"/>
<path d="M-8,-4 L-6,4 M2,-6 L4,2 M12,-8 L14,0" fill="none" stroke-width="1" transform="rotate(-12 4 -1)"/>
</g>
<!-- 洗手 -->
<g transform="translate(306,300)">
<path d="M-30,-34 H2 Q10,-34 10,-26 V-20 H0 V-24 Q0,-26 -2,-26 H-30 Z" fill="#bbb"/>
<rect x="-20" y="-44" width="20" height="5" rx="2" fill="#bbb"/>
<path d="M5,-14 v8 M5,0 v8 M5,14 v6" stroke="#0b5cad" stroke-width="2.5" fill="none"/>
<path d="M-26,40 Q-30,18 -20,10 Q-10,4 -4,16 L-2,40 Z M36,40 Q40,18 30,10 Q20,4 14,16 L12,40 Z" fill="#f3e3d3"/>
<rect x="18" y="-36" width="22" height="12" rx="4" fill="#e8f0d0"/>
</g>
<!-- 不吃不喝不抽烟 -->
<g transform="translate(422,300)">
<path d="M-12,-14 H8 L5,12 H-9 Z" fill="#fff"/>
<path d="M-6,-24 Q-2,-30 -6,-36" fill="none" stroke-width="1.5"/>
<use href="#no"/>
<g transform="translate(0,40)"><rect x="-22" y="-4" width="34" height="8" fill="#fff" stroke-width="1.5"/><rect x="12" y="-4" width="8" height="8" fill="#d98c3a" stroke-width="1.5"/><path d="M22,-6 Q26,-12 22,-18" fill="none" stroke="#999" stroke-width="1.5"/></g>
<g transform="translate(0,40) scale(0.85)"><use href="#no"/></g>
</g>
<!-- 衣物清洗或丢弃 -->
<g transform="translate(538,304)">
<path d="M-22,-30 L-8,-38 Q0,-32 8,-38 L22,-30 L30,-16 L20,-10 L16,-16 V20 H-16 V-16 L-20,-10 L-30,-16 Z" fill="#cfe0f0"/>
<path d="M-22,30 H22 L18,44 H-18 Z" fill="#ddd"/>
<path d="M-12,30 Q-6,22 0,30 Q6,22 12,30" fill="none" stroke="#0b5cad" stroke-width="1.5"/>
</g>
<!-- 口罩 -->
<g transform="translate(654,304)">
<circle r="30" fill="#f3e3d3"/>
<path d="M-16,-8 h8 M8,-8 h8" fill="none"/>
<path d="M-20,2 Q0,-2 20,2 V16 Q0,26 -20,16 Z" fill="#fff"/>
<path d="M-20,6 L-30,0 M20,6 L30,0" fill="none" stroke-width="1.5"/>
</g>
</g>
<g font-size="13" text-anchor="middle">
<text x="74" y="370">戴手套</text>
<text x="74" y="388">长袖衣服、靴子</text>
<text x="190" y="370">手上有伤口</text>
<text x="190" y="388" font-size="12">先包扎好或避免接触</text>
<text x="306" y="370" font-weight="bold" fill="#0b5cad">接触后用肥皂</text>
<text x="306" y="388" font-weight="bold" fill="#0b5cad">和流动水洗手</text>
<text x="422" y="370">不吃不喝不抽烟</text>
<text x="422" y="388">不用手摸脸</text>
<text x="538" y="370">衣物和手套</text>
<text x="538" y="388">用后清洗或丢弃</text>
<text x="654" y="370">有条件时戴口罩</text>
<text x="654" y="388" font-size="12" fill="#555">(减轻气味,不是防疫)</text>
</g>

<!-- ③ 编号和记录 -->
<rect x="8" y="412" width="704" height="268" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="436" font-size="15" font-weight="bold">③ 每具遗体一个唯一编号,处处写同一个号</text>
<text x="702" y="436" font-size="13" fill="#0b5cad" font-weight="bold" text-anchor="end">面部特征很快改变,越早记录越好</text>
<g stroke="#ccc" stroke-width="1.2" fill="#fff">
<rect x="16" y="448" width="132" height="198" rx="5"/>
<rect x="155" y="448" width="132" height="198" rx="5"/>
<rect x="294" y="448" width="132" height="198" rx="5"/>
<rect x="433" y="448" width="132" height="198" rx="5"/>
<rect x="572" y="448" width="132" height="198" rx="5"/>
</g>
<g font-size="14" font-weight="bold" text-anchor="middle">
<text x="82" y="470">防水标签</text>
<text x="221" y="470">包裹的袋子或布</text>
<text x="360" y="470">随身物品</text>
<text x="499" y="470">拍照</text>
<text x="638" y="470">记录</text>
</g>
<!-- 标签 -->
<g stroke="#333" stroke-width="1.5" fill="none">
<path d="M115,499 Q128,492 140,502" />
</g>
<use href="#tagN" x="36" y="488"/>
<!-- 布 -->
<g stroke="#333" stroke-width="1.5" stroke-linejoin="round">
<path d="M171,484 H271 V536 H171 Z" fill="#e6e0d0"/>
<path d="M171,500 H271 M171,520 H271" fill="none" stroke="#b5ab96" stroke-width="1"/>
</g>
<use href="#tagN" x="178" y="499"/>
<!-- 物品袋 -->
<g stroke="#333" stroke-width="1.5" stroke-linejoin="round">
<path d="M318,484 H402 V538 H318 Z" fill="#eef4f8"/>
<path d="M318,492 H402" stroke-width="1"/>
<rect x="326" y="500" width="22" height="30" rx="3" fill="#555"/>
<rect x="354" y="502" width="30" height="20" rx="2" fill="#fff"/>
<path d="M358,508 h16 M358,514 h12" stroke-width="1"/>
</g>
<text x="388" y="534" font-size="10" font-weight="bold" fill="#c33" text-anchor="middle">-001</text>
<!-- 相机 -->
<g stroke="#333" stroke-width="1.5" stroke-linejoin="round">
<rect x="445" y="490" width="108" height="48" rx="5" fill="#ddd"/>
<rect x="460" y="484" width="22" height="8" rx="2" fill="#ddd"/>
<rect x="451" y="496" width="96" height="36" fill="#fff"/>
</g>
<use href="#tagN" x="456" y="503"/>
<!-- 记录卡 -->
<g stroke="#333" stroke-width="1.5">
<rect x="606" y="482" width="64" height="58" fill="#fffbe8"/>
<path d="M614,496 h48 M614,508 h48 M614,520 h40 M614,532 h44" stroke="#888" stroke-width="1.2"/>
</g>
<g font-size="12" text-anchor="middle">
<text x="82" y="562">写上编号</text>
<text x="82" y="580">系在遗体上</text>

<text x="221" y="562">同样的编号写在</text>
<text x="221" y="580">袋子或布的外面</text>

<text x="360" y="558" font-size="11">证件、手机、首饰、钱包</text>
<text x="360" y="576" font-weight="bold" fill="#c33">不和遗体分开</text>
<text x="360" y="594">装袋,写同一个编号</text>
<text x="360" y="612">交给公安或负责机构</text>
<text x="360" y="630">不要私自处置</text>

<text x="499" y="556" font-weight="bold" fill="#c33">编号牌要出现在</text>
<text x="499" y="572" font-weight="bold" fill="#c33">每张照片里</text>
<text x="499" y="590">面部正面、全身、</text>
<text x="499" y="606">衣服、鞋子;</text>
<text x="499" y="622">文身、疤痕、胎记、</text>
<text x="499" y="638">首饰等特征</text>

<text x="638" y="558">发现的时间、地点</text>
<text x="638" y="576">大概的性别、年龄、</text>
<text x="638" y="594">身高、体型</text>
<text x="638" y="612">衣物、随身物品、</text>
<text x="638" y="630">明显特征</text>
</g>
<text x="360" y="669" font-size="13" fill="#c33" font-weight="bold" text-anchor="middle">✗ 不要只凭家属看照片或看一眼就确定身份后匆忙下葬(最终身份由公安等部门确认)</text>

<!-- ④ 临时埋葬 -->
<rect x="8" y="690" width="704" height="290" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="714" font-size="15" font-weight="bold">④ 万不得已时的临时埋葬</text>
<text x="208" y="714" font-size="12" fill="#c33">只在长期与外界隔绝、没有任何机构可以联系时;先完成③的辨认和记录</text>
<!-- 剖面 -->
<rect x="16" y="726" width="420" height="218" fill="#fff" stroke="#ccc" stroke-width="1"/>
<path d="M16,800 H120 Q200,800 240,786 H436" fill="none" stroke="#999" stroke-width="2.5"/>
<path d="M16,800 H120 Q200,800 240,786 H436 V944 H16 Z" fill="#efe6d6"/>
<path d="M16,800 H120 Q200,800 240,786 H436" fill="none" stroke="#999" stroke-width="2.5"/>
<!-- 地下水 -->
<path d="M16,906 H436" stroke="#0b5cad" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="24" y="924" font-size="12" fill="#0b5cad">地下水位</text>
<!-- 水井 -->
<g stroke="#333" stroke-width="2" fill="#ddd">
<rect x="34" y="782" width="34" height="18"/>
<path d="M32,782 V758 M70,782 V758 M28,758 H74" fill="none"/>
<path d="M51,758 V770" fill="none" stroke-width="1.5"/>
<rect x="45" y="770" width="12" height="9" fill="#999" stroke-width="1.5"/>
</g>
<path d="M40,800 V906 M62,800 V906" stroke="#999" stroke-width="1.5"/>
<text x="51" y="748" font-size="12" text-anchor="middle">饮用水源</text>
<!-- 距离 -->
<path d="M76,770 H264" stroke="#0b5cad" stroke-width="1.8" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="170" y="764" font-size="12" font-weight="bold" fill="#0b5cad" text-anchor="middle">至少200 m(见右表)</text>
<!-- 墓坑 -->
<rect x="268" y="786" width="60" height="62" fill="#fff" stroke="#333" stroke-width="2"/>
<path d="M268,786 H328" stroke="#efe6d6" stroke-width="3"/>
<path d="M268,786 V848 H328 V786" fill="none" stroke="#333" stroke-width="2"/>
<!-- 标记 -->
<g stroke="#333" stroke-width="1.8">
<rect x="291" y="744" width="16" height="42" fill="#c9a56b"/>
<rect x="284" y="744" width="30" height="16" fill="#e8d3a6"/>
</g>
<text x="299" y="756" font-size="9" font-weight="bold" fill="#c33" text-anchor="middle">-001</text>
<text x="316" y="746" font-size="12" text-anchor="start">标记写编号</text>
<!-- 深度 -->
<path d="M342,788 V846" stroke="#c33" stroke-width="1.8" marker-start="url(#arK)" marker-end="url(#arK)"/>
<text x="350" y="816" font-size="12" font-weight="bold" fill="#c33">坑深约</text>
<text x="350" y="832" font-size="12" font-weight="bold" fill="#c33">1.5 m以上</text>
<path d="M298,850 V904" stroke="#0b5cad" stroke-width="1.8" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="306" y="874" font-size="12" font-weight="bold" fill="#0b5cad">墓底高于地下水位</text>
<text x="306" y="890" font-size="12" font-weight="bold" fill="#0b5cad">至少2 m</text>
<text x="226" y="938" font-size="11" fill="#555" text-anchor="middle">示意图,未按比例</text>
<!-- 高处 -->
<text x="392" y="781" font-size="12" text-anchor="middle">地势较高</text>
<text x="432" y="764" font-size="12" text-anchor="end" fill="#555">远离住房 →</text>

<!-- 右栏 -->
<g font-size="13">
<text x="450" y="742" font-weight="bold">远离饮用水源(水井、泉水、河流)</text>
</g>
<g stroke="#bbb" stroke-width="1" fill="#fff">
<rect x="450" y="752" width="252" height="78"/>
</g>
<path d="M450,778 H702 M450,804 H702 M576,752 V830" stroke="#bbb" stroke-width="1"/>
<g font-size="13">
<text x="462" y="770">4具以下</text><text x="590" y="770" font-weight="bold" fill="#0b5cad">至少200 m</text>
<text x="462" y="796">5-60具</text><text x="590" y="796" font-weight="bold" fill="#0b5cad">至少250 m</text>
<text x="462" y="822">60具以上</text><text x="590" y="822" font-weight="bold" fill="#0b5cad">至少350 m</text>
</g>
<g font-size="12">
<text x="450" y="852">✓ 单独埋葬,将来可以找到、迁葬</text>
<text x="450" y="871">✓ 挖坑时渗水的地方不能埋</text>
<text x="450" y="890">✓ 不会被洪水淹没的地方</text>
<text x="450" y="909">✓ 每个墓立一块标记,写上编号</text>
<text x="450" y="928">✓ 画地图,记录每个墓的位置和编号</text>
<text x="450" y="947">✓ 记录、照片、随身物品妥善保存</text>
<text x="450" y="966">✓ 尊重死者的宗教信仰和当地习俗</text>
</g>
</g>
</svg>
