<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 744" width="720" height="744" role="img" aria-label="四冲程循环示意。1. 吸气: 活塞下行,吸入空气(和燃料),进气门开,排气门关;2. 压缩: 活塞上行,压缩混合气,两个气门都关;3. 做功: 点燃(或压燃),燃气膨胀推动活塞下行,两个气门都关;4. 排气: 活塞上行,排出废气,排气门开,进气门关。每个冲程曲轴转半圈,四个冲程曲轴转两圈,完成一个循环。汽油机: 火花塞点火,压缩比约8-12,效率约25-30%;柴油机: 把空气压缩到很高温度,喷入柴油自燃,压缩比约15-22,效率约35-40%以上。内燃机排出的一氧化碳无色无味,在室内使用会致命" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>四冲程循环</title>
