<rect x="160" y="104" width="34" height="92" rx="13" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
<path d="M196,110 Q180,100 170,116 L166,150" fill="none" stroke="#6b5530" stroke-width="4" stroke-linecap="round"/>
<path d="M167,132 L156,148" stroke="#6b5530" stroke-width="3.5" stroke-linecap="round"/>
<!-- 腰带解开下垂 -->
<path d="M200,184 Q204,200 196,214" fill="none" stroke="#6b5530" stroke-width="4" stroke-linecap="round"/>
<rect x="190" y="212" width="10" height="8" fill="#333"/>
<!-- 头 -->
<circle cx="176" cy="86" r="16" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M178,70 Q196,70 193,90 Q186,80 178,78 Z" fill="#555"/>
<circle cx="168" cy="84" r="1.8" fill="#333"/>
<!-- 手臂和木棍 -->
<path d="M126,118 L110,288" stroke="#8a6a3a" stroke-width="5" stroke-linecap="round"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M172,116 L150,150 L128,162" stroke="#333" stroke-width="14"/><path d="M172,116 L150,150 L128,162" stroke="#f3e3d3" stroke-width="9"/>
</g>
<ellipse cx="124" cy="162" rx="7" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<!-- 三点支撑 -->
<g fill="none" stroke="#c33" stroke-width="2"><circle cx="110" cy="288" r="7"/><circle cx="154" cy="288" r="7"/><circle cx="204" cy="288" r="7"/></g>
<text x="16" y="312" font-size="13" fill="#c33" font-weight="bold">三点支撑</text>
<line x1="72" y1="306" x2="103" y2="292" stroke="#c33" stroke-width="1"/>
<!-- 标注 -->
<text x="40" y="62" font-size="13" fill="#0b5cad">面向上游</text>
<line x1="94" y1="66" x2="160" y2="84" stroke="#0b5cad" stroke-width="1"/>
<text x="16" y="200" font-size="13" fill="#0b5cad">木棍撑在</text>
<text x="16" y="216" font-size="13" fill="#0b5cad">上游一侧</text>
<line x1="72" y1="206" x2="114" y2="212" stroke="#0b5cad" stroke-width="1"/>
<text x="234" y="140" font-size="13" fill="#0b5cad">解开背包的</text>
<text x="234" y="156" font-size="13" fill="#0b5cad">腰带和胸带</text>
<text x="234" y="172" font-size="12" fill="#555">(冲倒时能迅速</text>
<text x="234" y="186" font-size="12" fill="#555">甩掉背包)</text>
<line x1="236" y1="196" x2="204" y2="210" stroke="#0b5cad" stroke-width="1"/>
<text x="250" y="232" font-size="13" fill="#0b5cad">穿着鞋</text>
<line x1="256" y1="236" x2="212" y2="284" stroke="#0b5cad" stroke-width="1"/>
<text x="16" y="334" font-size="13">面向上游,侧着身子一小步一小步横着走;</text>
<text x="16" y="352" font-size="13">每次只移动一个支撑点,站稳了再移动下一个</text>
</g>

<!-- ④ 多人 -->
<g transform="translate(365,612)">
<rect x="0" y="0" width="345" height="360" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">④ 多人过河(俯视)</text>
<rect x="12" y="62" width="321" height="186" fill="#d8ebf7"/>
<path d="M12,62 L333,62 M12,248 L333,248" stroke="#7aa6cc" stroke-width="2"/>
