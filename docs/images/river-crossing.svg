<g fill="none" stroke-linecap="round">
<path d="M164,142 L134,148 M164,174 L134,168 M214,142 L184,148 M214,174 L184,168" stroke="#333" stroke-width="9"/>
<path d="M164,142 L134,148 M164,174 L134,168 M214,142 L184,148 M214,174 L184,168" stroke="#f3e3d3" stroke-width="5"/>
</g>
