<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1362" width="720" height="1362" role="img" aria-label="涉水过河: 能不过河就不过河,约15 cm深的快速流水就可能把人冲倒,齐膝深的急流里基本站不稳;1 以下情况不要过: 扔一根树枝下去漂得比快步走还快、急流处水深超过膝盖、水浑浊看不到底、下游不远处有瀑布急流深潭倒木、刚下过大雨水位正在上涨、自己很累很冷;不确定时等一等,或沿河岸找更好的地方、绕路;2 选河面宽、水面平稳、底部是小石子的地方,不选窄处和河弯的外侧,不走湿的倒木、不踩湿滑的石头跳过去;3 一个人: 解开背包的腰带和胸带,穿着鞋,面向上游侧着身子小步横着走,登山杖或木棍撑在上游一侧形成三点支撑,每次只移动一个支撑点,斜着向下游方向走;4 多人: 两三个人互相挽住胳膊或抓住背包顺着水流前后排成一列、横着挪过河,最强壮的人站在上游一侧,下游安排人接应;5 落入急流: 甩掉背包,仰面朝上,脚朝下游,脚抬到水面附近,用脚蹬开石头,双臂划水,斜着向岸边游,到水缓水浅处再站起来,不要在急流中站起来走,不要抱住倒木树枝;不要把绳子系在过河人的身上">
<rect width="100%" height="100%" fill="#fff"/>
<title>涉水过河: 判断、选地方、怎样过、落入急流</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<clipPath id="riv"><path d="M20,112 L160,112 C190,112 195,70 225,70 L390,70 C420,70 430,107 450,107 Q565,182 690,82 L690,150 Q565,250 450,177 C430,177 420,210 390,210 L225,210 C195,210 190,160 160,160 L20,160 Z"/></clipPath>
<g id="topman">
<rect x="7" y="-14" width="15" height="28" rx="4" fill="#d6c29a" stroke="#333" stroke-width="1.5"/>
<ellipse cx="0" cy="0" rx="10" ry="21" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="-2" cy="0" r="9" fill="#555" stroke="#333" stroke-width="1.5"/>
</g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">涉水过河: 能不过河就不过河</text>
<text x="360" y="50" font-size="14" fill="#555" text-anchor="middle">涉水是野外最容易低估的危险之一,冲倒后背包会把人往水里拖</text>

<!-- ① 判断 -->
<g transform="translate(10,64)">
<rect x="0" y="0" width="700" height="258" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">① 判断能不能过: 以下情况不要过</text>
<g font-size="14">
<text x="16" y="58"><tspan fill="#c33" font-weight="bold">✗</tspan> 水流湍急: 扔一根树枝下去,漂得比快步走还快</text>
<text x="16" y="80"><tspan fill="#c33" font-weight="bold">✗</tspan> 急流处水深超过膝盖</text>
<text x="16" y="102"><tspan fill="#c33" font-weight="bold">✗</tspan> 水浑浊,看不到底</text>
<text x="16" y="124"><tspan fill="#c33" font-weight="bold">✗</tspan> 下游不远处有瀑布、急流、深潭、倒木</text>
<text x="16" y="146"><tspan fill="#c33" font-weight="bold">✗</tspan> 刚下过大雨、水位正在上涨</text>
<text x="16" y="168"><tspan fill="#c33" font-weight="bold">✗</tspan> 自己很累、很冷</text>
<text x="16" y="198"><tspan fill="#0b5cad" font-weight="bold">✓</tspan> 不确定时等一等: 山溪雨后涨水往往几个小时后就会回落;</text>
<text x="32" y="220">冰雪融水形成的河流,早上的水量通常比下午小</text>
<text x="16" y="242"><tspan fill="#0b5cad" font-weight="bold">✓</tspan> 或者沿河岸找更好的地方,或者绕路</text>
</g>
<!-- 水深示意 -->
<rect x="458" y="186" width="232" height="54" fill="#d8ebf7"/>
<path d="M458,186 L690,186" stroke="#7aa6cc" stroke-width="2"/>
<path d="M466,212 L500,212" stroke="#0b5cad" stroke-width="2" marker-end="url(#ab)"/><path d="M590,212 L624,212" stroke="#0b5cad" stroke-width="2" marker-end="url(#ab)"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M536,156 L530,234 M546,156 L552,234" stroke="#333" stroke-width="15"/><path d="M536,156 L530,234 M546,156 L552,234" stroke="#cfe0f0" stroke-width="10"/>
</g>
<rect x="526" y="86" width="30" height="76" rx="12" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="540" cy="70" r="14" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M541,56 Q556,56 554,72 Q548,64 541,62 Z" fill="#555"/>
<ellipse cx="526" cy="237" rx="9" ry="4" fill="#555"/><ellipse cx="555" cy="237" rx="9" ry="4" fill="#555"/>
<path d="M458,240 L690,240" stroke="#999" stroke-width="3"/>
<path d="M468,224 L690,224" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M680,224 L680,240 M674,224 L686,224" stroke="#0b5cad" stroke-width="1.2"/>
<text x="574" y="162" font-size="13" fill="#c33" font-weight="bold">齐膝深的急流:</text>
<text x="574" y="178" font-size="13" fill="#c33">基本站不稳</text>
<text x="574" y="76" font-size="13" fill="#0b5cad">约15 cm深的</text>
<text x="574" y="92" font-size="13" fill="#0b5cad">快速流水就可能</text>
<text x="574" y="108" font-size="13" fill="#0b5cad">把人冲倒</text>
<path d="M664,112 L664,218" stroke="#0b5cad" stroke-width="1" marker-end="url(#ab)"/>
</g>

<!-- ② 选地方 -->
<g transform="translate(10,332)">
<rect x="0" y="0" width="700" height="270" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">② 选择过河的地方(俯视)</text>
<path d="M20,112 L160,112 C190,112 195,70 225,70 L390,70 C420,70 430,107 450,107 Q565,182 690,82 L690,150 Q565,250 450,177 C430,177 420,210 390,210 L225,210 C195,210 190,160 160,160 L20,160 Z" fill="#d8ebf7"/>
<path d="M470,190 Q565,252 680,154" fill="none" stroke="#5f93c6" stroke-width="30" stroke-opacity="0.5" clip-path="url(#riv)"/>
