<use href="#topman" transform="translate(164,158)"/>
<use href="#topman" transform="translate(214,158)"/>
<g fill="none" stroke-linecap="round">
<path d="M164,142 L134,148 M164,174 L134,168 M214,142 L184,148 M214,174 L184,168" stroke="#333" stroke-width="9"/>
<path d="M164,142 L134,148 M164,174 L134,168 M214,142 L184,148 M214,174 L184,168" stroke="#f3e3d3" stroke-width="5"/>
</g>
<text x="20" y="122" font-size="13" fill="#0b5cad">最强壮的人</text>
<text x="20" y="138" font-size="13" fill="#0b5cad">站在最上游</text>
<line x1="70" y1="144" x2="100" y2="152" stroke="#0b5cad" stroke-width="1"/>
<text x="196" y="104" font-size="13" fill="#0b5cad">挽住胳膊或</text>
<text x="196" y="120" font-size="13" fill="#0b5cad">抓住背包</text>
<line x1="200" y1="124" x2="180" y2="146" stroke="#0b5cad" stroke-width="1"/>
<path d="M164,192 L164,236" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="62" y="222" font-size="13" fill="#c33">一起横着挪过河</text>
<!-- 下游接应 -->
<g transform="translate(296,270) rotate(90)"><use href="#topman"/></g>
<text x="190" y="286" font-size="13" fill="#0b5cad" text-anchor="end">下游接应</text>
<line x1="194" y1="282" x2="272" y2="272" stroke="#0b5cad" stroke-width="1"/>
<text x="16" y="334" font-size="13">两三个人挽住胳膊或抓住背包,顺着水流</text>
<text x="16" y="352" font-size="13">前后排成一列横着挪过河;下游安排人接应</text>
</g>

<!-- ⑤ 落入急流 -->
<g transform="translate(10,982)">
<rect x="0" y="0" width="700" height="276" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">⑤ 落入急流: 仰面朝上,脚朝下游</text>
<!-- 侧视 -->
<rect x="12" y="98" width="386" height="74" fill="#d8ebf7"/>
<path d="M12,98 L398,98" stroke="#7aa6cc" stroke-width="2"/>
<path d="M60,156 L110,156" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/><path d="M230,160 L280,160" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<ellipse cx="318" cy="106" rx="26" ry="16" fill="#aaa" stroke="#333" stroke-width="2"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M170,108 L222,100 L262,96" stroke="#333" stroke-width="18"/><path d="M170,108 L222,100 L262,96" stroke="#cfe0f0" stroke-width="13"/>
<path d="M98,106 L170,108" stroke="#333" stroke-width="30"/><path d="M98,106 L170,108" stroke="#cfe0f0" stroke-width="25"/>
<path d="M108,112 L128,126 L150,124" stroke="#333" stroke-width="10"/><path d="M108,112 L128,126 L150,124" stroke="#f3e3d3" stroke-width="6"/>
</g>
<ellipse cx="154" cy="124" rx="6" ry="5" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<path d="M150,138 Q160,146 170,138 M150,138 L146,134 M170,138 L174,134" fill="none" stroke="#c33" stroke-width="1.8" stroke-linecap="round"/>
<ellipse cx="270" cy="92" rx="6" ry="10" fill="#555" transform="rotate(-20 270 92)"/>
<circle cx="72" cy="100" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M58,106 Q54,90 66,86 Q62,96 64,108 Z" fill="#555"/>
<circle cx="76" cy="92" r="1.8" fill="#333"/>
<rect x="12" y="104" width="386" height="68" fill="#d8ebf7" fill-opacity="0.55"/>
<path d="M282,92 L296,96" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="40" y="62" font-size="13" fill="#0b5cad">仰面朝上</text>
<line x1="60" y1="66" x2="70" y2="84" stroke="#0b5cad" stroke-width="1"/>
<text x="166" y="54" font-size="13" fill="#0b5cad">脚朝下游,</text>
<text x="166" y="70" font-size="13" fill="#0b5cad">抬到水面附近</text>
<line x1="230" y1="74" x2="258" y2="88" stroke="#0b5cad" stroke-width="1"/>
<text x="296" y="54" font-size="13" fill="#0b5cad">用脚蹬开</text>
<text x="296" y="70" font-size="13" fill="#0b5cad">前方的石头</text>
<text x="182" y="146" font-size="13" fill="#0b5cad">双臂在两侧划水控制方向</text>

<text x="16" y="198" font-size="14">先甩掉背包;到了水缓、水浅的地方再站起来</text>
<text x="16" y="222" font-size="14" fill="#c33">✗ 在急流中不要试图站起来走: 脚可能卡进石缝,</text>
<text x="30" y="240" font-size="14" fill="#c33">水流会把人推倒按在水里</text>
<text x="16" y="264" font-size="14" fill="#c33">✗ 不要抱住水里的倒木、树枝(会被冲进树枝下面)</text>
<!-- 俯视 -->
<g transform="translate(418,0)">
<rect x="0" y="44" width="270" height="110" fill="#d8ebf7"/>
<path d="M0,154 L270,154" stroke="#7aa6cc" stroke-width="2"/>
<path d="M0,154 L270,154" stroke="#999" stroke-width="3"/>
<text x="6" y="60" font-size="12" fill="#555">俯视</text>
<path d="M150,62 L200,62" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="206" y="66" font-size="12" fill="#0b5cad">水流</text>
