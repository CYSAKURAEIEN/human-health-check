<g fill="#c9c2b4" stroke="#999" stroke-width="1">
<circle cx="240" cy="96" r="3"/><circle cx="262" cy="150" r="4"/><circle cx="286" cy="186" r="3"/><circle cx="300" cy="132" r="3"/><circle cx="318" cy="88" r="4"/><circle cx="336" cy="170" r="3"/><circle cx="352" cy="118" r="3"/><circle cx="372" cy="192" r="4"/><circle cx="380" cy="146" r="3"/><circle cx="246" cy="190" r="3"/><circle cx="270" cy="112" r="3"/><circle cx="326" cy="154" r="3"/>
</g>
<!-- 水流 -->
<path d="M30,128 L84,128" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<text x="30" y="150" font-size="12" fill="#0b5cad">水流</text>
<path d="M600,150 Q630,134 660,114" fill="none" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<!-- 窄处、倒木 -->
<rect x="116" y="102" width="12" height="70" rx="5" fill="#b08a58" stroke="#333" stroke-width="1.5"/>
<text x="20" y="92" font-size="13" fill="#c33">✗ 窄处: 水深流急</text>
<line x1="98" y1="186" x2="118" y2="170" stroke="#0b5cad" stroke-width="1"/>
<text x="20" y="200" font-size="13" fill="#c33">✗ 不走湿的倒木,</text>
<text x="20" y="218" font-size="13" fill="#c33">不踩湿滑的石头跳过去</text>
<!-- 过河路线 -->
<path d="M250,62 L348,216" stroke="#c33" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="294" y="104" font-size="13" fill="#c33">斜着向下游走</text>
<text x="214" y="238" font-size="13" fill="#0b5cad" font-weight="bold">✓ 河面宽(通常更浅、水流更慢)</text>
<text x="214" y="258" font-size="13" fill="#0b5cad" font-weight="bold">✓ 水面平稳、底部是小石子</text>
<!-- 河弯外侧 -->
<line x1="560" y1="232" x2="566" y2="214" stroke="#0b5cad" stroke-width="1"/>
<text x="500" y="250" font-size="13" fill="#c33">✗ 河弯的外侧: 冲刷深</text>
</g>

<!-- ③ 一个人 -->
<g transform="translate(10,612)">
<rect x="0" y="0" width="345" height="360" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold">③ 一个人怎样过</text>
<text x="16" y="244" font-size="12" fill="#555">上游</text>
<text x="304" y="244" font-size="12" fill="#555">下游</text>
<rect x="10" y="250" width="325" height="40" fill="#d8ebf7"/>
<path d="M10,250 L335,250" stroke="#7aa6cc" stroke-width="2"/>
<path d="M20,270 L64,270" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/><path d="M250,272 L294,272" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#ab)"/>
<!-- 腿 -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M172,190 L158,286 M184,190 L200,286" stroke="#333" stroke-width="18"/><path d="M172,190 L158,286 M184,190 L200,286" stroke="#cfe0f0" stroke-width="13"/>
</g>
<ellipse cx="154" cy="288" rx="12" ry="5" fill="#555"/><ellipse cx="204" cy="288" rx="12" ry="5" fill="#555"/>
<rect x="10" y="250" width="325" height="40" fill="#d8ebf7" fill-opacity="0.45"/>
