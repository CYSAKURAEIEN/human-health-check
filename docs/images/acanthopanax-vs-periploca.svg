<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" width="720" height="830" role="img" aria-label="五加皮与香加皮对照示意: 香加皮(北五加皮)是杠柳的根皮,含强心苷,有毒,常冒充五加皮,也混作地骨皮。五加是直立灌木,高2-3 m,枝上有疏生的扁钩刺,掌状复叶,小叶5片(偶3-4片);五加皮药材为不规则卷筒状,外表面灰褐色,有稍扭曲的纵皱纹和横长皮孔样斑痕,内表面淡黄色或灰黄色,有细纵纹,气微香,味微辣而苦。杠柳是缠绕藤本,折断有白色乳汁,叶对生、披针形、光滑无刺;香加皮药材栓皮松软,常呈鳞片状剥落,有浓烈的特异香气(有人形容像冬青油)。有浓烈特殊香气的五加皮、地骨皮不用、不泡酒;中毒可出现恶心呕吐、视物发黄发绿、心跳过慢或心律失常,严重时心跳骤停">
<rect width="100%" height="100%" fill="#fff"/>
<title>五加皮与香加皮对照</title>
<defs>
<g id="palm"><path d="M0 0 H22" stroke="#4d6b2a" stroke-width="2"/><g fill="#a9c77c" stroke="#333" stroke-width="1.1"><path transform="translate(22 0) rotate(-66)" d="M0 0 C5 -3 14 -8 22 -6 C27 -4 27 4 22 6 C14 8 5 3 0 0Z"/><path transform="translate(22 0) rotate(-33)" d="M0 0 C6 -3 17 -9 26 -7 C32 -5 32 5 26 7 C17 9 6 3 0 0Z"/><path transform="translate(22 0)" d="M0 0 C6 -3 18 -10 28 -7 C35 -5 35 5 28 7 C18 10 6 3 0 0Z"/><path transform="translate(22 0) rotate(33)" d="M0 0 C6 -3 17 -9 26 -7 C32 -5 32 5 26 7 C17 9 6 3 0 0Z"/><path transform="translate(22 0) rotate(66)" d="M0 0 C5 -3 14 -8 22 -6 C27 -4 27 4 22 6 C14 8 5 3 0 0Z"/></g></g>
<g id="lance"><path d="M0 0 C8 -6 26 -7 44 0 C26 7 8 6 0 0Z" fill="#b5cf88" stroke="#333" stroke-width="1.1"/><path d="M2 0 H40" stroke="#5f7f36" stroke-width="0.8"/></g>
<path id="spine" d="M0 0 L7 -3 Q4 2 6 6 Z" fill="#6b4a2a"/>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">五加皮 vs 香加皮(有毒) 识别要点(示意图)</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">香加皮(北五加皮)常冒充五加皮,也混作地骨皮;它含强心苷——采时看整株,买时先闻气味</text>
<rect x="10" y="64" width="345" height="580" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="365" y="64" width="345" height="580" rx="8" fill="none" stroke="#c33" stroke-width="2"/>

<!-- ① 五加 -->
