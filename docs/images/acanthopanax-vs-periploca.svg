<text x="222" y="150" font-size="15"><tspan font-weight="bold">直立灌木</tspan></text>
<text x="222" y="169" font-size="13">高2-3 m</text>
<text x="222" y="214" font-size="15"><tspan font-weight="bold">掌状复叶</tspan></text>
<text x="222" y="233" font-size="13">小叶5片(偶3-4片)</text>
<text x="230" y="308" font-size="15">枝上有疏生的</text>
<text x="230" y="327" font-size="15"><tspan font-weight="bold">扁钩刺</tspan></text>
<!-- ② 杠柳 -->
<text x="381" y="92" font-size="18" font-weight="bold" fill="#c33">② 香加皮 <tspan font-size="14" font-weight="normal">(北五加皮)</tspan></text>
<text x="381" y="112" font-size="13" fill="#555">杠柳的根皮 · <tspan font-style="italic">Periploca sepium</tspan></text>
<rect x="612" y="74" width="88" height="28" rx="5" fill="#c33"/>
