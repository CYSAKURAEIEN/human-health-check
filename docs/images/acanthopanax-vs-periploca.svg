<text x="594" y="474" font-size="14">常呈<tspan font-weight="bold">鳞片状</tspan></text>
<text x="594" y="492" font-size="14" font-weight="bold">剥落</text>
<!-- 香气 -->
<g stroke="#c33" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M420 528 C412 520 428 514 420 506"/>
<path d="M450 532 C442 522 458 516 450 506"/>
<path d="M480 528 C472 520 488 514 480 506"/>
