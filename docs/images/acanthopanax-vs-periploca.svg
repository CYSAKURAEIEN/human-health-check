<text x="552" y="304" font-size="15"><tspan font-weight="bold">缠绕藤本</tspan></text>
<text x="552" y="240" font-size="15">叶<tspan font-weight="bold">对生</tspan>、披针形</text>
<text x="552" y="259" font-size="15">光滑<tspan font-weight="bold">无刺</tspan></text>
<text x="552" y="182" font-size="15">折断有</text>
<text x="552" y="201" font-size="15" font-weight="bold" fill="#c33">白色乳汁</text>

<!-- 药材 -->
<line x1="22" y1="392" x2="343" y2="392" stroke="#ccc" stroke-dasharray="4 3"/>
