<text x="236" y="434" font-size="13">不规则卷筒状</text>
<text x="236" y="456" font-size="13">外表面灰褐色,</text>
<text x="236" y="472" font-size="13">稍扭曲的纵皱纹</text>
<text x="236" y="492" font-size="13">横长皮孔样斑痕</text>
<text x="236" y="522" font-size="13">内表面淡黄色</text>
<text x="236" y="538" font-size="13">或灰黄色,细纵纹</text>
<!-- 五加皮气味 -->
<rect x="22" y="560" width="321" height="70" rx="6" fill="#f4f4f4"/>
