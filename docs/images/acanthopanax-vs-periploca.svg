<text x="537" y="580" font-size="16" text-anchor="middle" fill="#c33">气味: <tspan font-weight="bold">有浓烈的特异香气</tspan></text>
<text x="537" y="606" font-size="14" text-anchor="middle">(有人形容像冬青油)</text>

<!-- 底部 -->
<rect x="10" y="656" width="700" height="162" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="686" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">闻到浓烈特殊香气的"五加皮""地骨皮",很可能是香加皮——不用</text>
<text x="360" y="712" font-size="14" text-anchor="middle">五加皮只是气微香,地骨皮气微;带刺的直立灌木 ≠ 有白色乳汁的缠绕藤本</text>
<text x="360" y="738" font-size="14" text-anchor="middle">中毒表现: 恶心呕吐、视物发黄发绿、<tspan font-weight="bold">心跳过慢或心律失常</tspan>,严重时心跳骤停</text>
<text x="360" y="760" font-size="13" fill="#555" text-anchor="middle">服地高辛等强心药的人风险更大</text>
<text x="360" y="788" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">❌ 不要自己买"五加皮"泡药酒;认不准不采、不用</text>
<text x="360" y="808" font-size="13" fill="#555" text-anchor="middle">用不用、用多少,在中医师指导下决定</text>
</g>
</svg>
