<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 886" width="720" height="886" role="img" aria-label="火炕与炉灶剖面: 灶膛(做饭的灶)的烟火先经过炕下的炕洞(烟道),把炕面烧热,再从烟囱排出;炕面铺土坯板或石板,上面抹泥,干后铺席;炕洞用土坯或砖砌出迂回的烟道,让热烟在炕下多停留;烟囱根部设闸板,可关小、不可完全关死;烟囱高出穿过屋面处约1 m,并且比周围3 m范围内的屋脊、墙等最高处再高出约0.6 m,顶部加防雨帽和防火星网,穿屋顶处四周用砖石、泥土隔开。防一氧化碳中毒: 闸板睡前不要完全关闭,每年入冬前检查裂缝并用泥抹严,定期掏积灰,室内留一个通风口,安装一氧化碳报警器,出现头痛、头晕、恶心立即开窗、离开房间" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>火炕与炉灶剖面</title>
<defs>
<pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#efe4cf"/><circle cx="4" cy="5" r="1.1" fill="#bba57a"/><circle cx="12" cy="12" r="1.1" fill="#bba57a"/><circle cx="11" cy="3" r="0.8" fill="#bba57a"/></pattern>
<pattern id="screen" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#fff"/><path d="M0 0 L4 4 M4 0 L0 4" stroke="#666" stroke-width="0.7"/></pattern>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#888"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">火炕与炉灶: 灶膛 → 炕洞 → 烟囱</text>

<!-- ① 剖面 -->
<rect x="10" y="44" width="700" height="406" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① 剖面(示意,不按比例)</text>
<rect x="11.5" y="400" width="697" height="36" fill="url(#soil)"/>
<path d="M11.5 400 L708.5 400" stroke="#999" stroke-width="3"/>

<!-- 屋顶(局部) -->
<rect x="300" y="160" width="408.5" height="12" fill="#b98c4f" stroke="#333" stroke-width="2"/>
<path d="M300 160 L294 166 L300 172" fill="none" stroke="#333" stroke-width="1.5"/>

<!-- 灶、炕、烟囱主体 -->
<rect x="40" y="260" width="110" height="140" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<rect x="150" y="254" width="300" height="146" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<rect x="150" y="254" width="300" height="4" fill="#e8d28a"/>
<rect x="150" y="258" width="300" height="8" fill="#b89a70"/>
<path d="M150 266 H450 M150 280 H450 M200 266 V280 M260 266 V280 M320 266 V280 M380 266 V280" stroke="#333" stroke-width="1.2"/>
<rect x="450" y="92" width="44" height="308" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<path d="M450 120 H494 M450 150 H494 M450 210 H494 M450 240 H494 M482 320 H494 M482 350 H494" stroke="#a88b5c" stroke-width="1"/>
<!-- 穿屋顶处的隔离层 -->
<rect x="440" y="156" width="10" height="20" fill="#c9c9c9" stroke="#555" stroke-width="1.2"/>
<rect x="494" y="156" width="10" height="20" fill="#c9c9c9" stroke="#555" stroke-width="1.2"/>
<!-- 防火星网、防雨帽 -->
<rect x="450" y="80" width="44" height="12" fill="url(#screen)" stroke="#333" stroke-width="1.5"/>
<path d="M436 76 L472 58 L508 76 Z" fill="#9a9a9a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M452 76 V80 M492 76 V80" stroke="#333" stroke-width="2"/>

<!-- 内腔: 灶膛、炕洞、烟道 -->
<rect x="56" y="282" width="80" height="90" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="152" y="280" width="330" height="108" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="462" y="92" width="20" height="190" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="463.5" y="276" width="17" height="10" fill="#fff"/>
<rect x="134" y="292" width="20" height="36" fill="#fff"/>
<path d="M136 292 H152 M136 328 H152" stroke="#333" stroke-width="2"/>
<rect x="38" y="334" width="20" height="36" fill="#fff"/>
<path d="M40 334 H56 M40 370 H56" stroke="#333" stroke-width="2"/>

<!-- 锅 -->
<rect x="66" y="257" width="60" height="27" fill="#fff"/>
<path d="M60 262 Q96 322 132 262 Z" fill="#8a8a8a" stroke="#333" stroke-width="2"/>
<path d="M54 262 H138" stroke="#333" stroke-width="4" stroke-linecap="round"/>

<!-- 柴和火 -->
<path d="M16 356 L100 362 M18 366 L96 368" stroke="#8b6b3e" stroke-width="5" stroke-linecap="round"/>
<path d="M70 372 Q76 344 86 354 Q92 326 102 350 Q110 334 120 372 Z" fill="#e8873a" stroke="#c33" stroke-width="1.5"/>
<text x="96" y="318" font-size="15" text-anchor="middle" font-weight="bold">灶膛</text>

<!-- 烟气路线 -->
<path d="M106 336 Q128 300 156 308 C 220 318, 250 298, 320 318 S 420 340, 466 336" fill="none" stroke="#c33" stroke-width="2.5" stroke-dasharray="7 4"/>
<path d="M466 336 V98" fill="none" stroke="#888" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arG)"/>
<path d="M452 86 L430 80" stroke="#888" stroke-width="2" marker-end="url(#arG)"/>

<!-- 闸板 -->
<rect x="470" y="246" width="40" height="6" fill="#555" stroke="#333" stroke-width="1"/>
<rect x="510" y="242" width="6" height="14" rx="2" fill="#333"/>

<!-- 炕面受热 -->
<path d="M245 250 Q239 243 245 236 T245 220" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<path d="M285 250 Q279 243 285 236 T285 220" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="304" y="240" font-size="13" fill="#c33">炕面被烧热</text>

<!-- 炕面裂缝漏烟 -->
<path d="M410 254 L414 262 L408 270 L413 280" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M410 252 Q404 244 410 238 T410 222" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="3 3"/>
<text x="436" y="214" font-size="13" fill="#c33" text-anchor="end">炕面开裂会漏烟进屋</text>

<!-- 标注 -->
<text x="20" y="196" font-size="15">炕面: 土坯板或石板,</text>
<text x="20" y="214" font-size="15">上面抹泥,干后铺席</text>
<line x1="150" y1="219" x2="226" y2="262" stroke="#0b5cad" stroke-width="1.3"/><circle cx="226" cy="262" r="2.6" fill="#0b5cad"/>
<text x="20" y="246" font-size="14">锅</text>
<line x1="36" y1="244" x2="66" y2="266" stroke="#0b5cad" stroke-width="1.3"/><circle cx="66" cy="266" r="2.6" fill="#0b5cad"/>
<text x="300" y="364" font-size="15" text-anchor="middle" font-weight="bold">炕洞(炕下的烟道)</text>
<text x="300" y="381" font-size="12" text-anchor="middle" fill="#555">迂回的烟道见下方②平面图</text>

<text x="520" y="70" font-size="14">防雨帽、防火星网</text>
<line x1="518" y1="66" x2="496" y2="84" stroke="#0b5cad" stroke-width="1.3"/><circle cx="496" cy="84" r="2.6" fill="#0b5cad"/>
<path d="M506 92 L506 158" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="516" y="104" font-size="14" fill="#0b5cad" font-weight="bold">高出穿过屋面处约1 m</text>
<text x="516" y="122" font-size="13" fill="#0b5cad">并且比周围3 m范围内的</text>
<text x="516" y="139" font-size="13" fill="#0b5cad">屋脊、墙等最高处</text>
<text x="516" y="156" font-size="13" fill="#0b5cad">再高出约0.6 m</text>
<text x="520" y="196" font-size="14">穿屋顶处四周用砖石、</text>
<text x="520" y="213" font-size="14">泥土隔开,不碰木料</text>
<line x1="518" y1="192" x2="500" y2="174" stroke="#0b5cad" stroke-width="1.3"/><circle cx="500" cy="174" r="2.6" fill="#0b5cad"/>
<text x="524" y="248" font-size="15" font-weight="bold">闸板(烟囱根部)</text>
<text x="524" y="267" font-size="14" fill="#c33" font-weight="bold">可关小,不可完全关死</text>
<text x="524" y="318" font-size="15" font-weight="bold">烟囱</text>
<line x1="522" y1="314" x2="494" y2="320" stroke="#0b5cad" stroke-width="1.3"/><circle cx="494" cy="320" r="2.6" fill="#0b5cad"/>

<!-- ② 平面 -->
<rect x="10" y="462" width="700" height="228" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="488" font-size="16" font-weight="bold">② 炕洞平面(俯视,揭去炕面)</text>
<rect x="40" y="520" width="110" height="130" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<circle cx="92" cy="580" r="30" fill="#8a8a8a" stroke="#333" stroke-width="2"/>
<text x="95" y="640" font-size="14" text-anchor="middle" font-weight="bold">灶</text>
<rect x="150" y="500" width="300" height="170" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<rect x="162" y="512" width="276" height="146" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="222" y="512" width="12" height="108" fill="#dcc39a" stroke="#333" stroke-width="2"/>
<rect x="294" y="550" width="12" height="108" fill="#dcc39a" stroke="#333" stroke-width="2"/>
<rect x="366" y="512" width="12" height="108" fill="#dcc39a" stroke="#333" stroke-width="2"/>
<rect x="438" y="560" width="52" height="52" fill="#dcc39a" stroke="#333" stroke-width="2.5"/>
<rect x="452" y="574" width="24" height="24" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="436" y="576" width="18" height="20" fill="#fff"/>
<path d="M436 576 H452 M436 596 H452" stroke="#333" stroke-width="2"/>
<rect x="146" y="570" width="20" height="30" fill="#fff"/>
<path d="M146 570 H162 M146 600 H162" stroke="#333" stroke-width="2"/>
<path d="M124 585 H192 V638 H264 V530 H336 V638 H408 V586 H458" fill="none" stroke="#c33" stroke-width="2.5" stroke-dasharray="7 4" stroke-linejoin="round" marker-end="url(#arR)"/>
<text x="464" y="552" font-size="14" text-anchor="middle" font-weight="bold">烟囱</text>
<text x="300" y="686" font-size="13" text-anchor="middle" fill="#555">土坯或砖砌的隔墙</text>
<line x1="300" y1="673" x2="300" y2="652" stroke="#0b5cad" stroke-width="1.3"/><circle cx="300" cy="652" r="2.6" fill="#0b5cad"/>
<text x="510" y="530" font-size="15" font-weight="bold">炕洞:</text>
<text x="510" y="550" font-size="15">用土坯或砖砌出</text>
<text x="510" y="570" font-size="15">迂回的烟道,</text>
<text x="510" y="590" font-size="15">让热烟在炕下多停留</text>
<text x="510" y="630" font-size="14" fill="#555">定期掏炕洞、烟囱里的积灰</text>
<text x="510" y="650" font-size="14" fill="#555">(烟道堵塞会倒烟进屋)</text>

<!-- ③ 一氧化碳 -->
<rect x="10" y="702" width="700" height="170" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="24" y="728" font-size="16" font-weight="bold" fill="#c33">一氧化碳中毒: 火炕和炉灶是北方冬季一氧化碳中毒的主要来源之一</text>
<text x="24" y="756" font-size="14">• 烟囱闸板睡前不要完全关闭;刮风天、阴雨天、气压低的天气特别注意</text>
<text x="24" y="780" font-size="14">• 每年入冬前检查炕面、灶台、烟道、烟囱,开裂处用泥抹严</text>
<text x="24" y="804" font-size="14">• 室内留一个通风口;安装一氧化碳报警器(燃气报警器检测不到一氧化碳)</text>
<text x="24" y="828" font-size="14">• 炉灶周围1 m内不放柴草等易燃物;不在室内烧没有烟囱的炭盆、煤炉</text>
<text x="24" y="854" font-size="15" font-weight="bold" fill="#c33">• 炕上睡觉的人出现头痛、头晕、恶心 → 立即开窗、离开房间</text>
</g>
</svg>
