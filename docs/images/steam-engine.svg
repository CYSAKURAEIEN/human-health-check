<path d="M240,306 q4,-14 10,-18 q-2,8 4,12 q2,-12 10,-16 q-2,10 4,14 q4,-10 10,-14 q-2,10 4,12 q4,-6 8,-8 q0,10 -6,18 Z" fill="#f6b26b" stroke="#c33" stroke-width="1.5"/>
<path d="M236,308 H306" stroke="#555" stroke-width="2.5" stroke-dasharray="4 3"/>
<rect x="308" y="284" width="8" height="26" fill="#555"/>
