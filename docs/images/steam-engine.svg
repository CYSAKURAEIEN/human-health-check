<path d="M82,210 H288 Q310,210 310,232 V308 Q310,330 288,330 H82 Q60,330 60,308 V232 Q60,210 82,210 Z" fill="none" stroke="#333" stroke-width="2.5"/>
<text x="140" y="236" font-size="13" fill="#c33">蒸汽</text>
<text x="96" y="268" font-size="13" fill="#0b5cad">水</text>
<!-- 炉膛 -->
