<text x="24" y="806"><tspan font-weight="bold">调速器</tspan> → 转速太快时自动关小进汽(离心飞球);<tspan font-weight="bold">冷凝器(可选)</tspan> → 把排汽冷凝成水,降低背压,提高效率,回收水</text>
</g>

