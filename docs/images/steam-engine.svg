<!-- ④ 警告 -->
<rect x="10" y="1024" width="700" height="170" rx="8" fill="#fdf0f0" stroke="#c33" stroke-width="2"/>
<text x="24" y="1050" font-size="16" font-weight="bold" fill="#c33">④ ⚠ 锅炉为什么会爆炸</text>
<g font-size="14">
<text x="24" y="1076">• 锅炉里储存着大量超过100°C的高压热水: 一旦破裂,压力骤降,热水瞬间沸腾成蒸汽</text>
<text x="38" y="1096" fill="#555">(1 kg水变成100°C、1 atm的蒸汽,体积膨胀约1700倍)→ 锅炉越大、压力越高,威力越大</text>
<text x="24" y="1120">• <tspan font-weight="bold" fill="#c33">安全阀绝不能堵死、压死</tspan>,必须定期检查</text>
<text x="24" y="1144">• <tspan font-weight="bold" fill="#c33">缺水最危险</tspan>: 炉膛上方的金属干烧过热、强度下降,此时突然补进冷水,可能立即爆炸</text>
<text x="38" y="1164" font-weight="bold">→ 发现严重缺水时,先停火,让锅炉慢慢冷却,不要立即补水</text>
<text x="24" y="1186">• 没有专业设计和检验条件时,只使用常压或很低压力的装置</text>
</g>
</g>
</svg>
