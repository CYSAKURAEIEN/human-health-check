<!-- 缺水提示 -->
<line x1="214" y1="362" x2="214" y2="281" stroke="#c33" stroke-width="1.3"/>
<circle cx="214" cy="281" r="2.5" fill="#c33"/>
<text x="24" y="378" font-size="14" fill="#c33">水位过低 → 炉膛上方的金属被干烧过热(见④)</text>
<!-- 右栏 -->
<g font-size="14">
<text x="404" y="124" font-size="15" font-weight="bold">✓ 安全阀</text>
<text x="420" y="145">压力超过设定值时自动打开排汽;</text>
<text x="420" y="164" fill="#c33">必须定期检查,绝不能堵死、压死</text>
<text x="404" y="198"><tspan font-size="15" font-weight="bold">✓ 压力表</tspan>: 随时看到压力</text>
<text x="420" y="219" font-size="13" fill="#555">读数通常是“表压”(比大气压高出多少),</text>
<text x="420" y="238" font-size="13" fill="#555">绝对压力 = 表压 + 约0.1 MPa</text>
<text x="404" y="272"><tspan font-size="15" font-weight="bold">✓ 水位计</tspan>: 随时看到水位</text>
<text x="404" y="306"><tspan font-size="15" font-weight="bold">✓ 进水装置</tspan>: 能在运行中补水</text>
</g>

