<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1204" width="720" height="1204" role="img" aria-label="锅炉与双作用蒸汽机示意。①锅炉必须有的安全装置: 安全阀(压力超过设定值时自动打开排汽,必须定期检查,绝不能堵死、压死)、压力表(随时看到压力,读数通常是表压,绝对压力等于表压加约0.1 MPa)、水位计(随时看到水位)、进水装置(能在运行中补水)。②蒸汽机主要部件: 锅炉产生蒸汽;气缸和活塞,蒸汽推动活塞往复运动;配汽阀(滑阀)交替把蒸汽送到活塞两侧;曲柄连杆把往复运动变成旋转运动;飞轮使旋转平稳;调速器(离心飞球)转速太快时自动关小进汽;冷凝器(可选)把排汽冷凝成水,降低背压,提高效率,回收水。③双作用: 滑阀偏右时蒸汽进左侧推活塞向右,右侧排汽;滑阀偏左时蒸汽进右侧推活塞向左,左侧排汽,每转做功2次。④锅炉为什么会爆炸: 锅炉里储存着大量超过100°C的高压热水,一旦破裂压力骤降,热水瞬间沸腾成蒸汽,1 kg水变成100°C、1 atm的蒸汽体积膨胀约1700倍;安全阀绝不能堵死、压死;缺水最危险,炉膛上方的金属干烧过热、强度下降,此时突然补进冷水可能立即爆炸,发现严重缺水时先停火,让锅炉慢慢冷却,不要立即补水;没有专业设计和检验条件时,只使用常压或很低压力的装置" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>锅炉与蒸汽机</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#777"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">锅炉与双作用蒸汽机(示意)</text>
<text x="360" y="52" font-size="15" text-anchor="middle">锅炉产生蒸汽 → 滑阀交替送到活塞两侧 → 曲柄连杆把往复运动变成旋转运动</text>

<!-- ① 锅炉 -->
<rect x="10" y="64" width="700" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="90" font-size="16" font-weight="bold">① 锅炉: 必须有的安全装置</text>
<!-- 烟囱 -->
