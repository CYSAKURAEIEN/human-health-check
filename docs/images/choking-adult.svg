<text x="512" y="263" font-size="15" fill="#c33">上方冲击</text>
<text x="500" y="288" font-size="14" fill="#222">拳头拇指侧</text>
<text x="500" y="305" font-size="14" fill="#222">顶住腹部,</text>
<text x="500" y="322" font-size="14" fill="#222">另一手握住</text>
