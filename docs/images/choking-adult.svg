<text x="590" y="185" font-size="14" fill="#222" text-anchor="end">下缘</text>
<line x1="592" y1="176" x2="610" y2="184" stroke="#0b5cad" stroke-width="1.3"/><circle cx="610" cy="184" r="2.6" fill="#0b5cad"/>
<text x="540" y="368" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">② 腹部冲击 5 次</text>
<text x="540" y="390" font-size="14" fill="#222" text-anchor="middle">肚脐上方、剑突以下;每次独立、有力,</text>
<text x="540" y="408" font-size="14" fill="#222" text-anchor="middle">像要把人往上提</text>
<text x="360" y="446" font-size="15" fill="#222" text-anchor="middle">拍背 5 次 ↔ 腹部冲击 5 次,交替重复,直到异物排出或伤者失去意识</text>
<text x="360" y="468" font-size="15" fill="#c33" text-anchor="middle">失去意识 → 放平,立即开始CPR;孕妇、肥胖者改用胸部冲击</text>
