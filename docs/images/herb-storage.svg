<text x="80" y="884" font-size="14" font-weight="bold" text-anchor="middle">陶罐、瓷坛(带盖)</text>
<text x="80" y="902" font-size="13" fill="#555" text-anchor="middle">传统首选,</text>
<text x="80" y="918" font-size="13" fill="#555" text-anchor="middle">避光防潮</text>
<text x="220" y="884" font-size="14" font-weight="bold" text-anchor="middle">玻璃瓶、玻璃罐</text>
<text x="220" y="902" font-size="13" fill="#555" text-anchor="middle">透光: 放暗处</text>
<text x="220" y="918" font-size="13" fill="#555" text-anchor="middle">或用纸包住</text>
<text x="360" y="884" font-size="14" font-weight="bold" text-anchor="middle">铁皮罐、铁皮箱</text>
<text x="360" y="902" font-size="13" fill="#555" text-anchor="middle">防潮防鼠好;</text>
<text x="360" y="918" font-size="13" fill="#555" text-anchor="middle">不装酸性强的</text>
<text x="500" y="884" font-size="14" font-weight="bold" text-anchor="middle">布袋、纸袋</text>
<text x="500" y="902" font-size="13" fill="#c33" text-anchor="middle">不防潮不防虫,</text>
<text x="500" y="918" font-size="13" fill="#c33" text-anchor="middle">只能短期周转</text>
<text x="640" y="884" font-size="14" font-weight="bold" text-anchor="middle">厚塑料袋</text>
<text x="640" y="902" font-size="13" fill="#555" text-anchor="middle">临时替代: 先干透,</text>
<text x="640" y="918" font-size="13" fill="#555" text-anchor="middle">扎紧再套一层</text>
<rect x="10" y="940" width="700" height="76" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="360" y="964" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">❌ 发霉的整袋丢掉——不要洗一洗、晒一晒、炒一炒再用</text>
<text x="360" y="986" font-size="13" text-anchor="middle">平时每1-2个月检查一次,梅雨季、回南天、雨季前后每月一次;回潮的拿出来复晒或低温烘干;先进先出</text>
<text x="360" y="1006" font-size="13" text-anchor="middle">有毒药材单独存放,标明"有毒",上锁或放高处,不和普通药材、食物放在一起</text>
