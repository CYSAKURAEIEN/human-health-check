<rect x="70" y="604" width="174" height="0"/>
<text x="24" y="648" font-size="14" fill="#222" text-anchor="start"><tspan font-weight="bold">阴凉:</tspan> 一般不超过约20-25°C最好</text>
<text x="24" y="668" font-size="14" fill="#222" text-anchor="start"><tspan font-weight="bold">干燥:</tspan> 相对湿度约75%以下</text>
<text x="24" y="688" font-size="14" fill="#222" text-anchor="start"><tspan font-weight="bold">避光:</tspan> 放暗处或用不透光容器</text>
<text x="24" y="708" font-size="14" fill="#222" text-anchor="start"><tspan font-weight="bold">通风:</tspan> 库房通风,但容器本身密封</text>
<text x="24" y="728" font-size="14" fill="#222" text-anchor="start"><tspan font-weight="bold">离地离墙:</tspan> 放架子或垫板上,防潮</text>
