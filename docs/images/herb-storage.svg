<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1024" width="720" height="1024" role="img" aria-label="药材储存示意: 四种变质。霉变表面有白、绿、黑色毛状物或斑点,有霉味,多发生在含糖、淀粉、黏液多的药材,原因是约20-35°C、潮湿、没干透,要充分干燥、密封防潮、阴凉处储存、定期复晒;虫蛀有蛀孔、虫粉、虫丝,多发生在含淀粉、糖、蛋白质多的药材和动物药,要干燥密封、复晒或低温烘;走油(泛油)表面发黏、发暗、出油、有哈喇味,多发生在含油脂多和含糖多的药材,要低温、避光、密封、不压挤、储存期不宜过长;变色散气是颜色变暗变褐、香气变淡,多发生在花类、叶类、芳香类,要避光、密封、阴凉,花叶类一般1年左右更新。储存环境: 阴凉,一般不超过约20-25°C最好;相对湿度约75%以下;避光;库房通风但容器密封;离地离墙。石灰缸: 缸底放布包好的生石灰,中间隔木板或竹篦,上面放药材,盖严;生石灰遇水剧烈放热,包好放稳,不让孩子接触。容器: 陶罐瓷坛是传统首选,玻璃瓶透光要放暗处,铁皮罐防潮防鼠但不装酸性强的药材,布袋纸袋只适合短期周转,厚塑料袋要药材干透、扎紧后再套一层。每1-2个月检查一次,发霉的整袋丢掉">
<rect width="100%" height="100%" fill="#fff"/>
<title>药材的储存</title>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">药材储存: 防霉变、虫蛀、走油、变色散气</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">储存不好,轻则失效,重则发霉产生毒素(如黄曲霉毒素,煮不掉)</text>
<rect x="10" y="66" width="170" height="374" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="22" y="90" font-size="16" font-weight="bold" fill="#c33">① 霉变</text>
<text x="22" y="198" font-size="13" font-weight="bold" fill="#555">表现</text>
<text x="22" y="216" font-size="13" fill="#222" text-anchor="start">表面有白、绿、黑色</text>
<text x="22" y="234" font-size="13" fill="#222" text-anchor="start">毛状物或斑点,有霉味</text>
<text x="22" y="260" font-size="13" font-weight="bold" fill="#555">容易发生在</text>
<text x="22" y="278" font-size="13" fill="#222" text-anchor="start">含糖、淀粉、黏液多的</text>
<text x="22" y="304" font-size="13" font-weight="bold" fill="#555">原因</text>
<text x="22" y="322" font-size="13" fill="#222" text-anchor="start">约20-35°C、空气潮湿、</text>
<text x="22" y="340" font-size="13" fill="#222" text-anchor="start">药材没干透</text>
<text x="22" y="366" font-size="13" font-weight="bold" fill="#555">防止</text>
<text x="22" y="384" font-size="13" fill="#0b5cad" text-anchor="start">充分干燥,密封防潮,</text>
<text x="22" y="402" font-size="13" fill="#0b5cad" text-anchor="start">阴凉处存,定期复晒</text>
<rect x="187" y="66" width="170" height="374" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="199" y="90" font-size="16" font-weight="bold" fill="#c33">② 虫蛀</text>
<text x="199" y="198" font-size="13" font-weight="bold" fill="#555">表现</text>
<text x="199" y="216" font-size="13" fill="#222" text-anchor="start">蛀孔、虫粉、虫丝,</text>
<text x="199" y="234" font-size="13" fill="#222" text-anchor="start">甚至蛀空成粉末</text>
<text x="199" y="260" font-size="13" font-weight="bold" fill="#555">容易发生在</text>
<text x="199" y="278" font-size="13" fill="#222" text-anchor="start">含淀粉、糖、蛋白质</text>
<text x="199" y="296" font-size="13" fill="#222" text-anchor="start">多的,和动物药</text>
<text x="199" y="322" font-size="13" font-weight="bold" fill="#555">原因</text>
<text x="199" y="340" font-size="13" fill="#222" text-anchor="start">采收加工时带入虫卵,</text>
<text x="199" y="358" font-size="13" fill="#222" text-anchor="start">储存时受潮</text>
<text x="199" y="384" font-size="13" font-weight="bold" fill="#555">防止</text>
<text x="199" y="402" font-size="13" fill="#0b5cad" text-anchor="start">干燥、密封;</text>
<text x="199" y="420" font-size="13" fill="#0b5cad" text-anchor="start">复晒或低温烘</text>
<rect x="364" y="66" width="170" height="374" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="376" y="90" font-size="16" font-weight="bold" fill="#c33">③ 走油(泛油)</text>
<text x="376" y="198" font-size="13" font-weight="bold" fill="#555">表现</text>
<text x="376" y="216" font-size="13" fill="#222" text-anchor="start">表面发黏、发暗、</text>
<text x="376" y="234" font-size="13" fill="#222" text-anchor="start">出油,有哈喇味</text>
<text x="376" y="260" font-size="13" font-weight="bold" fill="#555">容易发生在</text>
<text x="376" y="278" font-size="13" fill="#222" text-anchor="start">含油脂多的、</text>
<text x="376" y="296" font-size="13" fill="#222" text-anchor="start">含糖多的</text>
<text x="376" y="322" font-size="13" font-weight="bold" fill="#555">原因</text>
<text x="376" y="340" font-size="13" fill="#222" text-anchor="start">温度高、久放、</text>
<text x="376" y="358" font-size="13" fill="#222" text-anchor="start">接触空气和光</text>
<text x="376" y="384" font-size="13" font-weight="bold" fill="#555">防止</text>
<text x="376" y="402" font-size="13" fill="#0b5cad" text-anchor="start">低温、避光、密封,</text>
<text x="376" y="420" font-size="13" fill="#0b5cad" text-anchor="start">不压挤,不宜久放</text>
<rect x="541" y="66" width="170" height="374" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="553" y="90" font-size="16" font-weight="bold" fill="#c33">④ 变色、散气</text>
<text x="553" y="198" font-size="13" font-weight="bold" fill="#555">表现</text>
<text x="553" y="216" font-size="13" fill="#222" text-anchor="start">颜色变暗变褐,</text>
<text x="553" y="234" font-size="13" fill="#222" text-anchor="start">香气变淡</text>
<text x="553" y="260" font-size="13" font-weight="bold" fill="#555">容易发生在</text>
<text x="553" y="278" font-size="13" fill="#222" text-anchor="start">花类、叶类、芳香类</text>
<text x="553" y="304" font-size="13" font-weight="bold" fill="#555">原因</text>
<text x="553" y="322" font-size="13" fill="#222" text-anchor="start">光照、氧化、受潮、</text>
<text x="553" y="340" font-size="13" fill="#222" text-anchor="start">温度高</text>
<text x="553" y="366" font-size="13" font-weight="bold" fill="#555">防止</text>
<text x="553" y="384" font-size="13" fill="#0b5cad" text-anchor="start">避光、密封、阴凉;</text>
<text x="553" y="402" font-size="13" fill="#0b5cad" text-anchor="start">花叶类约1年更新</text>
