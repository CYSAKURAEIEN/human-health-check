<text x="561" y="636" font-size="13" fill="#0b5cad">布包好的生石灰</text>
<text x="561" y="654" font-size="12" fill="#555">(吸潮)</text>
<text x="379" y="692" font-size="13" fill="#c33" text-anchor="start"><tspan font-weight="bold">⚠️ 生石灰遇水剧烈放热:</tspan> 包好放稳,不让孩子接触;</text>
<text x="379" y="710" font-size="13" fill="#c33" text-anchor="start">溅入眼睛先刷去固体,再用大量清水冲洗</text>
<text x="379" y="734" font-size="12" fill="#555">也可用木炭、干燥的稻壳吸潮,但效果差一些</text>
