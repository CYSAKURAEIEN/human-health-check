<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" role="img" aria-label="拉丝: 把金属条的一端削尖,穿过比它略小的孔,从另一侧用力拉出,它就变细变长;用一系列由大到小的孔反复拉,得到需要的细线。拉丝板用高碳钢(回收的锉刀、板簧最合适),厚约1-2 cm,钻一排由大到小的孔,每个孔从背面扩成锥形,入口大、出口小,出口处的直径就是这一档线的直径;相邻两个孔截面积减小约10-20%,即直径减小约5-10%;孔壁修光滑后淬火、回火。拉丝步骤: 线坯退火,一端锉尖或锤尖,涂肥皂、蜡或牛羊油润滑,拉丝板固定在台钳或木桩上,用钳子夹住穿出的尖端用力拉出,粗线用绞盘或杠杆拉;换下一个更小的孔重复;拉了几次后线材变硬发脆,退火后再继续,铁丝退火后先酸洗去掉氧化皮。退火: 铜和黄铜加热到暗红色,空气中冷却或直接浸水;铁和低碳钢加热到樱桃红(约780-850°C),埋在炉灰中慢慢冷却;铝约300-400°C,不能烧红,涂肥皂加热到肥皂发黑或记号笔记号消失即可。线材突然断裂会猛烈回弹,人不要站在线的延长线上" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>拉丝板与拉丝</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
<marker id="tkB" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5,0 V10" stroke="#0b5cad" stroke-width="1.5"/></marker>
<pattern id="steel" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#b8c2cc"/><path d="M0,0 V8" stroke="#6f7983" stroke-width="1.2"/></pattern>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">拉丝: 穿过由大到小的孔反复拉,金属条变细变长</text>

<!-- ① 拉丝板 -->
<rect x="10" y="44" width="700" height="258" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① 拉丝板</text>
<text x="110" y="70" font-size="14" fill="#555">高碳钢(回收的锉刀、板簧最合适)</text>

<text x="190" y="98" font-size="13" fill="#555" text-anchor="middle">正面(出口一侧)看</text>
<rect x="30" y="108" width="320" height="76" rx="4" fill="#8a949e" stroke="#333" stroke-width="2"/>
<g fill="#fff" stroke="#333" stroke-width="1.8">
<circle cx="60" cy="146" r="15"/>
<circle cx="104" cy="146" r="13.9"/>
<circle cx="147" cy="146" r="12.9"/>
<circle cx="189" cy="146" r="12"/>
<circle cx="230" cy="146" r="11.2"/>
<circle cx="270" cy="146" r="10.4"/>
<circle cx="309" cy="146" r="9.7"/>
</g>
<line x1="60" y1="204" x2="309" y2="204" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="190" y="224" font-size="14" fill="#0b5cad" text-anchor="middle">一排由大到小的孔,依次换小一档</text>

<!-- 剖面 -->
<text x="560" y="98" font-size="13" fill="#555" text-anchor="middle">一个孔的剖面</text>
<path d="M530,108 H590 V170 L530,154 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M530,206 L590,190 V214 H530 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M530,108 V214 M590,108 V214" stroke="#333" stroke-width="2"/>
<text x="522" y="146" font-size="13" text-anchor="end">入口大</text>
<text x="522" y="162" font-size="12" fill="#555" text-anchor="end">(从背面</text>
<text x="522" y="177" font-size="12" fill="#555" text-anchor="end">扩成锥形)</text>
<text x="598" y="130" font-size="13">出口小</text>
<path d="M592,170 H612 M592,190 H612" stroke="#0b5cad" stroke-width="1" stroke-dasharray="2 2"/>
<path d="M606,152 V168" stroke="#0b5cad" stroke-width="1.3" marker-end="url(#arB)"/>
<path d="M606,208 V192" stroke="#0b5cad" stroke-width="1.3" marker-end="url(#arB)"/>
<text x="618" y="168" font-size="12" fill="#0b5cad">出口直径</text>
<text x="618" y="184" font-size="12" fill="#0b5cad">= 这一档</text>
<text x="618" y="200" font-size="12" fill="#0b5cad">线的直径</text>
<path d="M530,232 H590" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#tkB)" marker-end="url(#tkB)"/>
<text x="560" y="250" font-size="13" fill="#0b5cad" text-anchor="middle">厚约1-2 cm</text>

<text x="24" y="270" font-size="14">相邻两个孔: 截面积减小约10-20%(即直径减小约5-10%),差太多会拉断</text>
<text x="24" y="292" font-size="13" fill="#555">制作: 先退火变软 → 钻孔 → 从背面扩成锥形 → 把孔壁修光滑 → 淬火、回火(孔壁硬、耐磨)</text>

<!-- ② 拉一道 -->
<rect x="10" y="314" width="700" height="250" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="340" font-size="16" font-weight="bold">② 拉一道(剖面)</text>

<!-- 木桩/台钳 -->
<rect x="282" y="470" width="76" height="70" fill="#d9b38c" stroke="#333" stroke-width="2"/>
<text x="320" y="530" font-size="12" fill="#555" text-anchor="middle">台钳或木桩</text>
<!-- 拉丝板剖面 -->
<path d="M300,360 H340 V424 L300,418 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M300,442 L340,436 V470 H300 Z" fill="url(#steel)" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M300,360 V470 M340,360 V470" stroke="#333" stroke-width="2"/>
<text x="320" y="354" font-size="13" text-anchor="middle">拉丝板</text>
<!-- 线坯 -->
<path d="M50,421 H300 L340,424 H476 L500,430 L476,436 H340 L300,439 H50" fill="#d08a4f" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M50,421 q-6,4 0,9 q6,5 0,9" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- 润滑剂 -->
<path d="M246,421 q10,-9 22,-4 q14,-6 26,2 L300,421 Z M246,439 q12,8 24,3 q14,6 30,-3 Z" fill="#f2e6a8" stroke="#a89040" stroke-width="1.2"/>
<path d="M246,404 L262,415" stroke="#555" stroke-width="1"/>
<text x="240" y="384" font-size="13" text-anchor="end">涂润滑剂:</text>
<text x="240" y="401" font-size="13" text-anchor="end">肥皂、蜡、牛羊油</text>
<text x="150" y="464" font-size="13" text-anchor="middle">线坯: 粗细均匀的圆条,先退火</text>
<line x1="150" y1="450" x2="150" y2="441" stroke="#555" stroke-width="1"/>
<text x="408" y="464" font-size="13" text-anchor="middle">变细、变长</text>
<line x1="408" y1="450" x2="408" y2="438" stroke="#555" stroke-width="1"/>
<!-- 钳子 -->
<path d="M464,420 H494 L516,430 L610,410" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M464,440 H494 L516,430 L610,450" fill="none" stroke="#333" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="516" cy="430" r="4.5" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="480" y="384" font-size="13" text-anchor="middle">一端锉尖或锤尖,</text>
<text x="480" y="401" font-size="13" text-anchor="middle">从入口穿过去</text>
<text x="560" y="466" font-size="13" text-anchor="middle">钳子夹住尖端</text>
<line x1="618" y1="430" x2="694" y2="430" stroke="#c33" stroke-width="4" marker-end="url(#arR)"/>
<text x="656" y="410" font-size="14" fill="#c33" font-weight="bold" text-anchor="middle">用力拉出</text>
<text x="604" y="496" font-size="13" text-anchor="middle">粗线用绞盘或杠杆拉</text>

<rect x="380" y="510" width="318" height="46" rx="5" fill="#fbeeee" stroke="#c33" stroke-width="1.2"/>
<text x="392" y="529" font-size="13" fill="#c33" font-weight="bold">⚠️ 线突然断裂会猛烈回弹:</text>
<text x="392" y="548" font-size="13" fill="#c33">人不要站在线的延长线上;用绞盘时周围不站人</text>

<!-- ③ 反复 -->
<rect x="10" y="576" width="700" height="274" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="602" font-size="16" font-weight="bold">③ 反复: 拉几次 → 退火 → 再拉</text>
<g fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5">
<rect x="24" y="616" width="150" height="50" rx="6"/>
<rect x="198" y="616" width="150" height="50" rx="6"/>
<rect x="372" y="616" width="150" height="50" rx="6" fill="#fbeeee" stroke="#c33"/>
<rect x="546" y="616" width="150" height="50" rx="6"/>
</g>
<g font-size="14" text-anchor="middle">
<text x="99" y="637">换下一个更小的孔</text><text x="99" y="656">重复拉</text>
<text x="273" y="637">拉了几次后</text><text x="273" y="656">变硬、发脆</text>
<text x="447" y="637" font-weight="bold" fill="#c33">退火</text><text x="447" y="656">恢复柔软</text>
<text x="621" y="637">铁丝: 先酸洗</text><text x="621" y="656">去掉氧化皮</text>
</g>
<g stroke="#0b5cad" stroke-width="2"><line x1="176" y1="641" x2="194" y2="641" marker-end="url(#arB)"/><line x1="350" y1="641" x2="368" y2="641" marker-end="url(#arB)"/><line x1="524" y1="641" x2="542" y2="641" marker-end="url(#arB)"/></g>
<path d="M621,668 V684 H99 V672" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="360" y="700" font-size="13" fill="#0b5cad" text-anchor="middle">再继续拉</text>

<text x="24" y="726" font-size="14" font-weight="bold">退火方法</text>
<line x1="24" y1="734" x2="696" y2="734" stroke="#ccc" stroke-width="1"/>
<rect x="24" y="744" width="16" height="16" rx="3" fill="#8e1c14" stroke="#333" stroke-width="1"/>
<text x="48" y="757" font-size="14" font-weight="bold">铜、黄铜</text>
<text x="150" y="757" font-size="14">加热到暗红色,空气中冷却或直接浸水冷却(急冷不会变硬)</text>
<rect x="24" y="772" width="16" height="16" rx="3" fill="#d23a1e" stroke="#333" stroke-width="1"/>
<text x="48" y="785" font-size="14" font-weight="bold">铁、低碳钢</text>
<text x="150" y="785" font-size="14">加热到樱桃红(约780-850°C),埋在炉灰中慢慢冷却</text>
<rect x="24" y="800" width="16" height="16" rx="3" fill="#d6dde4" stroke="#333" stroke-width="1"/>
<path d="M27,803 L37,813 M37,803 L27,813" stroke="#c33" stroke-width="1.6"/>
<text x="48" y="813" font-size="14" font-weight="bold">铝</text>
<text x="150" y="813" font-size="14">约300-400°C,不能烧红(会熔化);涂肥皂加热到肥皂发黑即可</text>
<text x="24" y="840" font-size="13" fill="#555">铜丝最容易拉,铝丝次之,铁丝最难。退火时工件很烫,看起来不红也可能有几百摄氏度</text>
</g>
</svg>
