<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="基本锻打操作: ①拔长: 熟铁、低碳钢在橙黄色(约1000-1100°C)时拔长,工件压在砧子的圆角边上锤打,金属只往长的方向走;每一锤后把工件翻转90°,保持截面方正,只打一个方向会变成菱形截面;从料的根部往端头一段一段打。②镦粗: 只加热要镦粗的一段(约为直径的2-3倍长),其余部分在水里蘸一下保持硬;工件竖立在砧面上,热端朝上,锤子垂直打端面;一开始弯了立即扶直,否则会折叠出裂缝;被镦的一段不超过直径的约3倍。③弯曲: 只加热要弯的那一段;在砧角或圆钢上弯圆弧,在砧子直角边上弯直角;弯的外侧会被拉薄,要弯结实的直角先在拐角处镦粗一点;弯好后在平砧面上轻锤修平。④冲孔: 加热到橙黄到黄色,比一般锻打更热;先冲到工件厚度的约2/3深,翻过来对准背面颜色较暗的斑冲下,工件垫在砧子的孔上或铁环上,把料芯冲掉;冲子每打几锤拔出来蘸水,孔里撒一小撮木炭粉;只从一面冲到底孔会歪、背面撕出毛边。⑤热切: 红热时切,工件下面垫软铁板或铜板,不直接切在砧面上;热錾切进约一半深,翻过来对准切口再切,剩下薄薄一层时放在砧子边上轻锤掰断;冷切细料用冷錾錾出深槽再掰断,料头会飞出,前方不要站人。⑥每一火: 工件埋在火中心偏上翻动热透,出火刷掉松散氧化皮,先重锤成型、变暗改轻锤,降到深红就回炉;小件一火只能打20-40秒;一火只做一件事。火色: 暗红约500-550°C只能轻微校直;深红约650-700°C是熟铁、低碳钢的停锻温度;樱桃红约780-850°C是高碳钢锻打的下限,高碳钢打到樱桃红就回炉;鲜红约850-950°C;橙黄约1000-1100°C最好锻;黄色约1200°C;亮黄到白约1250-1300°C只在锻焊时用。熟铁、低碳钢在橙黄到黄色时最好锻,高碳钢只在樱桃红到橙黄之间锻。不发红时绝不重锤,低碳钢在约200-400°C表面出现蓝色氧化色时特别脆。戴护目镜,钳口必须和工件吻合" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>基本锻打操作</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">基本锻打操作: 拔长、镦粗、弯曲、冲孔、切断</text>

<!-- ① 拔长 -->
<g transform="translate(10,44)">
<rect width="228" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">① 拔长</text>
<path d="M44,136 Q44,128 54,128 H200 V146 H180 L172,164 H192 V178 H62 V164 H82 L74,146 H44 Z" fill="#666" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="12" y="114" width="26" height="14" fill="#9aa3ad" stroke="#333" stroke-width="1.5"/>
<path d="M38,114 H68 L72,118 L76,114 H92 L96,118 L100,114 H150 V128 H38 Z" fill="#f39a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M2,112 L14,118 M2,130 L14,124" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
<rect x="28" y="66" width="44" height="22" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="72" y="72" width="64" height="10" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M50,92 V108" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M104,104 H148" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="104" y="98" font-size="12" fill="#c33" font-weight="bold">变长</text>
<rect x="164" y="40" width="16" height="16" fill="#f39a2a" stroke="#333" stroke-width="1.5"/>
<path d="M188,40 Q200,48 188,58" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="214" y="76" font-size="12" fill="#c33" font-weight="bold" text-anchor="end">每锤翻转90°</text>
<text x="96" y="196" font-size="12" fill="#0b5cad">砧子圆角边</text>
<line x1="94" y1="190" x2="48" y2="134" stroke="#0b5cad" stroke-width="1.2"/><circle cx="48" cy="134" r="2.2" fill="#0b5cad"/>
<g font-size="13">
<text x="10" y="218" fill="#c33" font-weight="bold">熟铁、低碳钢: 橙黄色时拔长</text>
<text x="10" y="236">工件压在砧子圆角边上锤打,</text>
<text x="10" y="254">金属只往长的方向走;</text>
<text x="10" y="272">每一锤后翻转90°,保持截面方正</text>
<text x="10" y="290">从根部往端头一段一段打</text>
</g>
</g>

<!-- ② 镦粗 -->
<g transform="translate(246,44)">
<rect width="228" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">② 镦粗</text>
<path d="M50,128 H190 V146 H170 L162,164 H182 V178 H58 V164 H78 L70,146 H50 Z" fill="#666" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="106" y="98" width="16" height="30" fill="#9aa3ad" stroke="#333" stroke-width="1.5"/>
<path d="M106,98 Q98,90 100,80 Q102,72 106,70 H122 Q126,72 128,80 Q130,90 122,98 Z" fill="#f39a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="92" y="36" width="44" height="22" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="136" y="42" width="64" height="10" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M114,59 V68" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M96,84 H84" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<path d="M132,84 H144" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="148" y="88" font-size="12" fill="#c33" font-weight="bold">变粗</text>
<text x="14" y="70" font-size="12" fill="#0b5cad">热端朝上</text>
<line x1="44" y1="74" x2="100" y2="82" stroke="#0b5cad" stroke-width="1.2"/><circle cx="100" cy="82" r="2.2" fill="#0b5cad"/>
<text x="14" y="108" font-size="12" fill="#0b5cad">蘸过水</text>
<text x="14" y="122" font-size="12" fill="#0b5cad">保持硬</text>
<line x1="56" y1="112" x2="106" y2="114" stroke="#0b5cad" stroke-width="1.2"/><circle cx="106" cy="114" r="2.2" fill="#0b5cad"/>
<text x="140" y="118" font-size="12" fill="#555">竖立在砧面</text>
<g font-size="13">
<text x="10" y="200" fill="#c33" font-weight="bold">熟铁、低碳钢: 橙黄色时镦粗</text>
<text x="10" y="218">只加热要镦粗的一段(约为直径</text>
<text x="10" y="236">的2-3倍长),锤子垂直打端面</text>
<text x="10" y="254">一开始弯了立即扶直再打</text>
<text x="10" y="272">(弯着打会"折叠"出裂缝)</text>
<text x="10" y="290">被镦的一段不超过直径约3倍</text>
</g>
</g>

<!-- ③ 弯曲 -->
<g transform="translate(482,44)">
<rect width="228" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">③ 弯曲</text>
<rect x="54" y="122" width="12" height="56" fill="#888" stroke="#333" stroke-width="1.5"/>
<circle cx="60" cy="112" r="14" fill="#777" stroke="#333" stroke-width="1.8"/>
<path d="M60,93 H112" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M16,93 H60 A19,19 0 0 1 73.4,98.6 L100,125" fill="none" stroke="#333" stroke-width="11" stroke-linejoin="round"/>
<path d="M30,93 H60 A19,19 0 0 1 73.4,98.6 L100,125" fill="none" stroke="#f39a2a" stroke-width="7.5" stroke-linejoin="round"/>
<path d="M17,93 H30" stroke="#9aa3ad" stroke-width="7.5"/>
<path d="M4,86 L16,90 M4,100 L16,96" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
<rect x="82" y="50" width="40" height="20" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="122" y="55" width="36" height="9" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M98,74 V104" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M134,100 H198 V150 H134 Z" fill="#666" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M130,95 H203.5 V150" fill="none" stroke="#333" stroke-width="11" stroke-linejoin="miter"/>
<path d="M130,95 H203.5 V150" fill="none" stroke="#f39a2a" stroke-width="7.5" stroke-linejoin="miter"/>
<circle cx="203" cy="95" r="9" fill="none" stroke="#c33" stroke-width="1.5" stroke-dasharray="3 2"/>
<text x="214" y="80" font-size="11.5" fill="#c33" text-anchor="end">拐角先镦粗</text>
<text x="18" y="196" font-size="12" fill="#0b5cad">圆弧: 砧角/圆钢</text>
<text x="134" y="170" font-size="12" fill="#0b5cad">直角: 砧子</text>
<text x="134" y="186" font-size="12" fill="#0b5cad">直角边</text>
<g font-size="13">
<text x="10" y="218" fill="#c33" font-weight="bold">只加热要弯的那一段</text>
<text x="10" y="236">圆弧在砧角或圆钢上弯,</text>
<text x="10" y="254">直角在砧子直角边上弯</text>
<text x="10" y="272">外侧会被拉薄 → 拐角先镦粗一点</text>
<text x="10" y="290">弯好后在平砧面上轻锤修平</text>
</g>
</g>

<!-- ④ 冲孔 -->
<g transform="translate(10,354)">
<rect width="228" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">④ 冲孔(两面冲)</text>
<!-- a 正面 -->
<rect x="12" y="140" width="96" height="36" fill="#666" stroke="#333" stroke-width="1.8"/>
<rect x="20" y="118" width="80" height="22" fill="#f39a2a" stroke="#333" stroke-width="1.5"/>
<path d="M54,56 H66 L65,132 Q60,135 55,132 Z" fill="#9aa3ad" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="38" y="34" width="44" height="18" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="82" y="38" width="32" height="9" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M28,44 V60" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M88,118 V133" stroke="#0b5cad" stroke-width="1.2" marker-start="url(#arG)" marker-end="url(#arG)"/>
<text x="72" y="112" font-size="12" fill="#0b5cad">约2/3</text>
<text x="34" y="194" font-size="12" fill="#555">a 先冲约2/3深</text>
<!-- b 翻面 -->
<rect x="120" y="140" width="38" height="36" fill="#666" stroke="#333" stroke-width="1.8"/>
<rect x="176" y="140" width="40" height="36" fill="#666" stroke="#333" stroke-width="1.8"/>
<path d="M127,118 H209 V140 H172 V125 H162 V140 H127 Z" fill="#f39a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="162" y="118" width="10" height="7" fill="#7a3a10" stroke="#333" stroke-width="1"/>
<path d="M161,56 H173 L172,114 H162 Z" fill="#9aa3ad" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="145" y="34" width="44" height="18" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="189" y="38" width="32" height="9" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<rect x="162" y="154" width="10" height="7" fill="#7a3a10" stroke="#333" stroke-width="1"/>
<path d="M167,163 V178" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="126" y="84" font-size="11.5" fill="#0b5cad">对准</text>
<text x="126" y="98" font-size="11.5" fill="#0b5cad">暗斑</text>
<line x1="150" y1="102" x2="162" y2="118" stroke="#0b5cad" stroke-width="1.2"/>
<text x="168" y="194" font-size="12" fill="#555" text-anchor="middle">b 翻面冲掉料芯</text>
<g font-size="13">
<text x="10" y="218" fill="#c33" font-weight="bold">橙黄到黄色(比一般锻打更热)</text>
<text x="10" y="236">先冲到厚度约2/3深;翻过来,</text>
<text x="10" y="254">对准暗斑冲掉料芯(垫砧孔或铁环)</text>
<text x="10" y="272">冲子勤拔出蘸水,孔里撒木炭粉</text>
<text x="10" y="290" fill="#c33">✗ 只从一面冲到底: 孔歪、有毛边</text>
</g>
</g>

<!-- ⑤ 切断 -->
<g transform="translate(246,354)">
<rect width="228" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">⑤ 切断(热切)</text>
<path d="M22,148 H206 V164 H186 L180,176 H48 L42,164 H22 Z" fill="#666" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<rect x="40" y="140" width="148" height="8" fill="#ccc" stroke="#333" stroke-width="1.2"/>
<path d="M30,122 H104 L112,131 L120,122 H196 V140 H30 Z" fill="#f39a2a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M104,62 H120 V104 L113,131 H111 L104,104 Z" fill="#9aa3ad" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<rect x="90" y="36" width="44" height="20" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="134" y="41" width="60" height="10" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M82,46 V62" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="134" y="84" font-size="12" fill="#0b5cad">热錾</text>
<line x1="132" y1="80" x2="120" y2="86" stroke="#0b5cad" stroke-width="1.2"/>
<text x="16" y="98" font-size="12" fill="#0b5cad">切进约一半</text>
<line x1="56" y1="102" x2="106" y2="126" stroke="#0b5cad" stroke-width="1.2"/><circle cx="106" cy="126" r="2.2" fill="#0b5cad"/>
<text x="62" y="194" font-size="12" fill="#0b5cad">垫软铁板或铜板</text>
<line x1="150" y1="184" x2="162" y2="146" stroke="#0b5cad" stroke-width="1.2"/><circle cx="162" cy="146" r="2.2" fill="#0b5cad"/>
<g font-size="13">
<text x="10" y="218" fill="#c33" font-weight="bold">红热时切,不直接切在砧面上</text>
<text x="10" y="236">切进约一半深 → 翻过来对准</text>
<text x="10" y="254">切口再切 → 剩薄薄一层时放在</text>
<text x="10" y="272">砧子边上,轻锤掰断</text>
<text x="10" y="290">冷切: 錾出深槽再掰,前方不站人</text>
</g>
</g>

<!-- ⑥ 每一火 -->
<g transform="translate(482,354)">
<rect width="228" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">⑥ 每一火的节奏</text>
<g font-size="12.5" text-anchor="middle">
<rect x="10" y="38" width="96" height="62" rx="6" fill="#fff3e0" stroke="#f39a2a" stroke-width="1.5"/>
<text x="58" y="58" font-weight="bold">入火</text><text x="58" y="75">火中心偏上</text><text x="58" y="91">翻动热透</text>
<rect x="122" y="38" width="96" height="62" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="170" y="58" font-weight="bold">出火</text><text x="170" y="75">刷掉松散</text><text x="170" y="91">氧化皮</text>
<rect x="122" y="114" width="96" height="62" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<text x="170" y="134" font-weight="bold">锤打</text><text x="170" y="151">先重锤成型</text><text x="170" y="167">变暗改轻锤</text>
<rect x="10" y="114" width="96" height="62" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="58" y="134" font-weight="bold" fill="#c33">回炉</text><text x="58" y="151">降到深红</text><text x="58" y="167">就回炉</text>
</g>
<path d="M107,69 H119" stroke="#666" stroke-width="2" marker-end="url(#arG)"/>
<path d="M170,101 V111" stroke="#666" stroke-width="2" marker-end="url(#arG)"/>
<path d="M121,145 H109" stroke="#666" stroke-width="2" marker-end="url(#arG)"/>
<path d="M58,113 V103" stroke="#666" stroke-width="2" marker-end="url(#arG)"/>
<g font-size="13">
<text x="10" y="200">小件一火只能打20-40秒</text>
<text x="10" y="218">一火只做一件事:</text>
<text x="10" y="236">这一火拔长,下一火再弯</text>
<text x="10" y="254">锤面平着落下,落点在砧子</text>
<text x="10" y="272">正上方(打在悬空处会打弯)</text>
<text x="10" y="290" fill="#c33" font-weight="bold">✗ 不发红时绝不重锤</text>
</g>
</g>

<!-- 火色 -->
<rect x="10" y="664" width="700" height="226" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="688" font-size="15" font-weight="bold">火色与锻打温度(在阴暗处看,温度都是大约值)</text>
<rect x="408" y="702" width="188" height="9" rx="2" fill="#c33"/>
<text x="402" y="711" font-size="12.5" fill="#c33" font-weight="bold" text-anchor="end">熟铁、低碳钢最好锻 →</text>
<rect x="216" y="720" width="284" height="9" rx="2" fill="#0b5cad"/>
<text x="210" y="729" font-size="12.5" fill="#0b5cad" font-weight="bold" text-anchor="end">高碳钢只在这里锻 →</text>
<g stroke="#333" stroke-width="1">
<rect x="24" y="738" width="92" height="22" fill="#6e1b12"/>
<rect x="120" y="738" width="92" height="22" fill="#9e2214"/>
<rect x="216" y="738" width="92" height="22" fill="#c92a1a"/>
<rect x="312" y="738" width="92" height="22" fill="#e8461f"/>
<rect x="408" y="738" width="92" height="22" fill="#f39a2a"/>
<rect x="504" y="738" width="92" height="22" fill="#f6cf3a"/>
<rect x="600" y="738" width="92" height="22" fill="#fff6c8"/>
</g>
<g font-size="13" text-anchor="middle">
<text x="70" y="776">暗红</text><text x="166" y="776">深红</text><text x="262" y="776">樱桃红</text><text x="358" y="776">鲜红</text><text x="454" y="776">橙黄</text><text x="550" y="776">黄色</text><text x="646" y="776">亮黄到白</text>
</g>
<g font-size="11.5" text-anchor="middle" fill="#555">
