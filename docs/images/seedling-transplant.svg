<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 924" width="720" height="924" role="img" aria-label="育苗与移栽: ①育苗土用3年内没种过茄科、瓜类的园土6份加充分腐熟的堆肥或厩肥4份,过筛,可掺少量草木灰;摊薄暴晒几天或上锅蒸约半小时消毒;容器底部要有排水孔,也可切成8-10 cm的方块。②茄果类种子在约55°C热水中不停搅拌15分钟,再用常温水浸泡(茄果类8-12小时,瓜类4-6小时),湿布包好放在25-30°C处催芽,每天用温水淘洗1次,大部分露白就播。③先浇透,水渗下去后撒种,盖过筛细土,播深约为种子直径的2-3倍(茄果类0.5-1 cm),盖薄膜保湿,一出苗立即揭开。④茄果类出苗前25-30°C,出苗后白天20-25°C、夜间12-15°C;夜温太高、光照不足会徒长;见干见湿,上午浇;2-3片真叶时分苗。⑤定植前7-10天开始炼苗,白天搬到室外背风半阴处,先放几小时,逐日延长。⑥阴天或晴天下午三四点以后移栽,带土坨,浇定根水每株约0.5-1 L,缓苗3-5天。定植深度: 番茄可以深栽;辣椒、黄瓜与原土面平或略深;生菜、白菜不要埋住菜心" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>育苗与移栽</title>
<defs>
<pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#efe4cf"/><circle cx="4" cy="5" r="1.1" fill="#bba57a"/><circle cx="12" cy="12" r="1.1" fill="#bba57a"/><circle cx="11" cy="3" r="0.8" fill="#bba57a"/></pattern>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker>
<!-- 小苗(原点在茎基部) -->
<g id="sd"><path d="M0 0 V-22" stroke="#4f8a2f" stroke-width="2.2"/><ellipse cx="-7" cy="-16" rx="7" ry="3" fill="#7fb04f" stroke="#3f6f24" stroke-width="1" transform="rotate(-20 -7 -16)"/><ellipse cx="7" cy="-16" rx="7" ry="3" fill="#7fb04f" stroke="#3f6f24" stroke-width="1" transform="rotate(20 7 -16)"/><path d="M0 -22 Q-9 -32 -4 -38 Q2 -30 0 -22 Z M0 -22 Q9 -32 5 -37 Q-1 -30 0 -22 Z" fill="#4f8a2f" stroke="#3f6f24" stroke-width="1"/></g>
<!-- 营养钵(原点在钵口中心) -->
<g id="pot"><path d="M-20 0 L20 0 L15 34 L-15 34 Z" fill="#555" stroke="#333" stroke-width="1.5"/><rect x="-18" y="2" width="36" height="6" fill="#8b6b4a"/></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">育苗与移栽</text>
<text x="360" y="52" font-size="13" text-anchor="middle">必须育苗: 番茄、辣椒、茄子、甘蓝、大葱 | 只宜直播: 萝卜、胡萝卜、菠菜、小白菜、豆类</text>

<!-- ① 育苗土 -->
<g transform="translate(10,64)">
<rect x="0" y="0" width="230" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">① 配育苗土</text>
<rect x="12" y="38" width="122" height="24" fill="#b98c5a" stroke="#333" stroke-width="1.5"/>
<rect x="134" y="38" width="82" height="24" fill="#5e4128" stroke="#333" stroke-width="1.5"/>
<text x="73" y="55" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">园土 6份</text>
<text x="175" y="55" font-size="13" text-anchor="middle" fill="#fff" font-weight="bold">堆肥 4份</text>
<text x="12" y="78" font-size="12" fill="#555">可掺少量草木灰 → 过筛</text>
<!-- 营养钵 -->
<use href="#pot" x="56" y="126"/>
<use href="#sd" x="56" y="128"/>
<path d="M53 160 H59" stroke="#fff" stroke-width="2"/>
<path d="M56 164 V170 M51 167 V172 M61 167 V172" stroke="#0b5cad" stroke-width="1.5" stroke-linecap="round"/>
<text x="56" y="190" font-size="12" text-anchor="middle">底部有排水孔</text>
<!-- 切块 -->
<path d="M140 128 L152 116 L196 116 L184 128 Z" fill="#a5825c" stroke="#333" stroke-width="1.5"/>
<path d="M184 128 L196 116 L196 156 L184 168 Z" fill="#6f5438" stroke="#333" stroke-width="1.5"/>
<rect x="140" y="128" width="44" height="40" fill="#8b6b4a" stroke="#333" stroke-width="1.5"/>
<use href="#sd" x="168" y="122"/>
<path d="M141 175 H183" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="162" y="190" font-size="12" text-anchor="middle" fill="#0b5cad">8-10 cm方块</text>
<g font-size="13">
<text x="10" y="210">园土: 3年内没种过茄科、瓜类;</text>
<text x="10" y="228">不用长过病的菜地土</text>
<text x="10" y="246">堆肥、厩肥要充分腐熟</text>
<text x="10" y="264">消毒: 夏秋摊薄暴晒几天;</text>
<text x="10" y="282">量少时上锅蒸约半小时</text>
<text x="10" y="300">切块育苗: 湿土压实切块,</text>
<text x="10" y="318">移栽时整块带走</text>
</g>
</g>

<!-- ② 浸种催芽 -->
<g transform="translate(245,64)">
<rect x="0" y="0" width="230" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">② 浸种、催芽</text>
<!-- 热水锅 + 温度计 -->
<rect x="16" y="104" width="54" height="44" rx="4" fill="#e3eef8" stroke="#333" stroke-width="2"/>
<rect x="17" y="104" width="52" height="8" fill="#fff"/>
<path d="M12 104 H74" stroke="#333" stroke-width="2.5"/>
<g fill="#d9b77a" stroke="#8b6b3e" stroke-width="0.8"><ellipse cx="30" cy="140" rx="3" ry="2"/><ellipse cx="40" cy="143" rx="3" ry="2"/><ellipse cx="50" cy="139" rx="3" ry="2"/></g>
<path d="M28 82 L44 138" stroke="#8b6b3e" stroke-width="3" stroke-linecap="round"/>
<path d="M30 124 Q44 116 56 126" fill="none" stroke="#c33" stroke-width="1.5" marker-end="url(#arR)"/>
<rect x="60" y="74" width="8" height="58" rx="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="64" cy="134" r="6" fill="#c33" stroke="#333" stroke-width="1.5"/>
<rect x="62.5" y="96" width="3" height="36" fill="#c33"/>
<path d="M78 126 H92" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<!-- 常温水浸泡 -->
<path d="M96 116 H146 Q144 148 121 148 Q98 148 96 116 Z" fill="#e3eef8" stroke="#333" stroke-width="2"/>
<g fill="#d9b77a" stroke="#8b6b3e" stroke-width="0.8"><ellipse cx="112" cy="138" rx="3" ry="2"/><ellipse cx="122" cy="141" rx="3" ry="2"/><ellipse cx="131" cy="137" rx="3" ry="2"/></g>
<path d="M150 126 H164" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<!-- 湿布催芽 -->
<path d="M168 148 Q170 112 196 112 Q222 112 222 148 Z" fill="#ece4d2" stroke="#333" stroke-width="2"/>
<path d="M188 112 Q196 100 204 112" fill="none" stroke="#333" stroke-width="2"/>
<g transform="translate(184,130)"><ellipse rx="4" ry="2.6" fill="#d9b77a" stroke="#8b6b3e" stroke-width="0.8"/><path d="M4 0 Q8 1 9 4" stroke="#fff" stroke-width="2" fill="none"/><path d="M4 0 Q8 1 9 4" stroke="#999" stroke-width="0.6" fill="none"/></g>
<g transform="translate(200,138)"><ellipse rx="4" ry="2.6" fill="#d9b77a" stroke="#8b6b3e" stroke-width="0.8"/><path d="M4 0 Q8 1 9 4" stroke="#fff" stroke-width="2" fill="none"/><path d="M4 0 Q8 1 9 4" stroke="#999" stroke-width="0.6" fill="none"/></g>
<g font-size="12" text-anchor="middle">
<text x="44" y="170" fill="#c33" font-weight="bold">约55°C</text>
<text x="44" y="185">搅拌15分钟</text>
<text x="121" y="170">常温水</text>
<text x="121" y="185">浸泡</text>
<text x="196" y="170" fill="#c33" font-weight="bold">25-30°C</text>
<text x="196" y="185">保湿催芽</text>
</g>
<g font-size="13">
<text x="10" y="210">1. 温汤浸种(茄果类): 种子放入</text>
<text x="24" y="228">约55°C热水,不停搅拌15分钟</text>
<text x="24" y="246" fill="#555">(水温降了就兑热水,用温度计)</text>
<text x="10" y="264">2. 常温水浸泡: 茄果类8-12小时,</text>
<text x="24" y="282">瓜类4-6小时</text>
<text x="10" y="300">3. 湿布包好放25-30°C处,每天</text>
<text x="24" y="318">温水淘洗1次;大部分露白就播</text>
</g>
</g>

<!-- ③ 播种 -->
<g transform="translate(480,64)">
<rect x="0" y="0" width="230" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">③ 播种</text>
<path d="M60 102 Q118 52 176 102" fill="#e3eef8" fill-opacity="0.5" stroke="#0b5cad" stroke-width="1.8"/>
<text x="118" y="96" font-size="12" text-anchor="middle" fill="#0b5cad">薄膜保湿</text>
<rect x="68" y="122" width="100" height="30" fill="#7a5a3c"/>
<rect x="68" y="102" width="100" height="20" fill="#c4a27a"/>
<g fill="#e8d9a8" stroke="#8b6b3e" stroke-width="0.9"><ellipse cx="80" cy="121" rx="3.5" ry="2.4"/><ellipse cx="96" cy="121" rx="3.5" ry="2.4"/><ellipse cx="112" cy="121" rx="3.5" ry="2.4"/><ellipse cx="128" cy="121" rx="3.5" ry="2.4"/><ellipse cx="144" cy="121" rx="3.5" ry="2.4"/><ellipse cx="160" cy="121" rx="3.5" ry="2.4"/></g>
<path d="M66 96 V154 H170 V96" fill="none" stroke="#333" stroke-width="2.5"/>
<g font-size="12">
<text x="10" y="112">过筛细土</text>
<line x1="58" y1="108" x2="72" y2="110" stroke="#0b5cad" stroke-width="1.2"/>
<text x="10" y="132">种子</text>
<line x1="36" y1="128" x2="77" y2="121" stroke="#0b5cad" stroke-width="1.2"/>
<text x="10" y="150">浇透的土</text>
<line x1="58" y1="146" x2="72" y2="142" stroke="#0b5cad" stroke-width="1.2"/>
</g>
<path d="M178 103 V120" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<path d="M170 102 H182 M170 121 H182" stroke="#0b5cad" stroke-width="1"/>
<g font-size="12" fill="#0b5cad"><text x="186" y="104">种子</text><text x="186" y="118">直径的</text><text x="186" y="132">2-3倍</text></g>
<text x="118" y="176" font-size="12" text-anchor="middle" fill="#0b5cad">茄果类播深0.5-1 cm</text>
<g font-size="13">
<text x="10" y="210">先把苗床或营养钵浇透,</text>
<text x="10" y="228">水渗下去后再撒种</text>
<text x="10" y="246">盖过筛的细土;播深约为种子</text>
<text x="10" y="264">直径的2-3倍,小粒种子别盖厚</text>
<text x="10" y="282">盖薄膜或湿草帘保湿</text>
<text x="10" y="300" fill="#c33">一出苗立即揭开,否则几天就</text>
<text x="10" y="318" fill="#c33">长成又细又高的“高脚苗”</text>
</g>
</g>

<!-- ④ 苗期管理 -->
<g transform="translate(10,402)">
<rect x="0" y="0" width="230" height="334" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">④ 苗期管理</text>
<g transform="translate(0,-10)">
<!-- 壮苗 -->
<use href="#pot" x="62" y="124"/>
<path d="M62 126 V94" stroke="#3f7a2a" stroke-width="4.5"/>
<g fill="#3f7a2a" stroke="#2c5a1c" stroke-width="1">
<path d="M62 118 Q44 112 38 120 Q48 126 62 118 Z"/><path d="M62 112 Q80 104 87 112 Q76 119 62 112 Z"/>
<path d="M62 104 Q44 96 40 103 Q50 110 62 104 Z"/><path d="M62 98 Q78 88 84 95 Q74 103 62 98 Z"/>
<path d="M62 95 Q56 82 62 76 Q68 82 62 95 Z"/>
</g>
<!-- 徒长苗 -->
<use href="#pot" x="168" y="124"/>
<path d="M168 126 Q166 90 170 48" fill="none" stroke="#9cc06a" stroke-width="1.6"/>
<g fill="#c4dc98" stroke="#7fa04a" stroke-width="1">
<ellipse cx="160" cy="104" rx="7" ry="2.6" transform="rotate(-15 160 104)"/><ellipse cx="176" cy="102" rx="7" ry="2.6" transform="rotate(15 176 102)"/>
<path d="M170 50 Q154 44 150 50 Q158 56 170 50 Z"/><path d="M170 50 Q184 40 189 46 Q182 54 170 50 Z"/>
</g>
<g font-size="13" text-anchor="middle">
<text x="62" y="174" font-weight="bold">✓ 壮苗</text>
<text x="62" y="189" font-size="12">茎粗、节间短、</text>
<text x="62" y="203" font-size="12">叶色深绿</text>
<text x="168" y="174" font-weight="bold" fill="#c33">✗ 徒长</text>
<text x="168" y="189" font-size="12">茎细长、叶色淡</text>
</g>
</g>
<g font-size="13">
<text x="10" y="214">温度(茄果类): 出苗前25-30°C;</text>
<text x="10" y="232">出苗后白天20-25°C,夜间12-15°C</text>
<text x="10" y="250" fill="#c33">夜温太高、光照不足 → 徒长</text>
<text x="10" y="268">尽量多见光;苗歪就转动容器</text>
<text x="10" y="286">浇水见干见湿,上午浇</text>
<text x="10" y="304">2-3片真叶时分苗到营养钵,</text>
<text x="10" y="322">或把苗距加大到8-10 cm</text>
</g>
</g>

<!-- ⑤ 炼苗 -->
<g transform="translate(245,402)">
<rect x="0" y="0" width="230" height="334" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">⑤ 炼苗</text>
<rect x="10" y="64" width="30" height="94" fill="#e6d2b0" stroke="#333" stroke-width="2"/>
<rect x="18" y="104" width="16" height="54" fill="#b98c4f" stroke="#333" stroke-width="1.5"/>
<path d="M8 158 H222" stroke="#999" stroke-width="3"/>
<path d="M100 158 V108" stroke="#8b6b3e" stroke-width="5"/>
<circle cx="100" cy="88" r="26" fill="#9cc77a" stroke="#4f8a2f" stroke-width="2"/>
<use href="#pot" x="78" y="124"/><use href="#sd" x="78" y="126"/>
<path d="M118 132 H160" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="139" y="124" font-size="12" text-anchor="middle" fill="#c33">逐日延长</text>
<use href="#pot" x="188" y="124"/><use href="#sd" x="188" y="126"/>
<circle cx="200" cy="56" r="11" fill="#ffd866" stroke="#e0a020" stroke-width="2"/>
<path d="M200 38 V41 M200 71 V74 M182 56 H185 M215 56 H218" stroke="#e0a020" stroke-width="2"/>
<g font-size="12" text-anchor="middle">
<text x="78" y="176">背风半阴处</text>
<text x="78" y="192">先放几小时</text>
<text x="188" y="176">逐渐见</text>
<text x="188" y="192">全日照</text>
</g>
<g font-size="13">
<text x="10" y="214" font-weight="bold" fill="#c33">定植前7-10天开始</text>
<text x="10" y="232">逐渐降低温度、减少浇水</text>
<text x="10" y="250">白天搬到室外背风半阴处,</text>
<text x="10" y="268">先放几小时,逐日延长</text>
<text x="10" y="286">最后几天夜里也放在外面(无霜时)</text>
<text x="10" y="304" fill="#555">没炼过的苗直接栽到外面,常被</text>
<text x="10" y="322" fill="#555">晒伤、冻伤、风吹折</text>
</g>
</g>

<!-- ⑥ 移栽定植 -->
<g transform="translate(480,402)">
<rect x="0" y="0" width="230" height="334" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">⑥ 移栽定植</text>
<path d="M20 58 Q20 46 32 46 Q36 36 48 38 Q58 32 66 42 Q78 42 78 54 Q78 62 68 62 H28 Q20 62 20 58 Z" fill="#e6eaee" stroke="#888" stroke-width="1.5"/>
<text x="49" y="78" font-size="12" text-anchor="middle" fill="#555">阴天</text>
<rect x="8" y="134" width="214" height="24" fill="url(#soil)"/>
<path d="M8 134 H52 Q56 152 70 152 H92 Q106 152 110 134 H222" fill="none" stroke="#999" stroke-width="3"/>
<path d="M54 136 Q58 150 70 150 H92 Q104 150 108 136 Z" fill="#fff"/>
<ellipse cx="81" cy="138" rx="17" ry="12" fill="#7a5a3c" stroke="#333" stroke-width="1.5"/>
<g transform="translate(81,128) scale(1.3)"><use href="#sd"/></g>
<!-- 浇水壶 -->
<path d="M150 82 H196 L192 116 H154 Z" fill="#9fb8cc" stroke="#333" stroke-width="2"/>
<path d="M152 90 L120 70" stroke="#333" stroke-width="4" stroke-linecap="round"/>
<path d="M196 88 Q212 92 194 110" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M118 72 Q104 96 94 126 M122 74 Q110 98 100 128" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="30" y1="104" x2="66" y2="134" stroke="#0b5cad" stroke-width="1.2"/><circle cx="66" cy="134" r="2.4" fill="#0b5cad"/>
<text x="12" y="100" font-size="12">带土坨</text>
<g font-size="12" text-anchor="middle">
<text x="168" y="176" font-weight="bold" fill="#0b5cad">定根水</text>
<text x="168" y="192" fill="#0b5cad">每株约0.5-1 L</text>
<text x="81" y="176">挖穴→放苗→</text>
<text x="81" y="192">填土→轻轻压实</text>
</g>
<g font-size="13">
<text x="10" y="214">阴天,或晴天下午三四点以后;</text>
<text x="10" y="232">避开大风天和寒潮前夕</text>
<text x="10" y="250">前一天把苗浇透,挖苗多带土</text>
<text x="10" y="268">缓苗: 3-5天内保持湿润,</text>
<text x="10" y="286">晴天中午用树枝、草帘遮阴</text>
<text x="10" y="304">心叶开始长新叶 = 缓苗成功</text>
<text x="10" y="322">多育10-20%备用苗,及时补栽</text>
</g>
</g>

<!-- 定植深度 -->
<g transform="translate(10,744)">
<rect x="0" y="0" width="700" height="170" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="14" y="24" font-size="16" font-weight="bold">定植深度</text>
<text x="104" y="24" font-size="13" fill="#555">虚线 = 苗原来的土面(土坨顶)</text>
<rect x="10" y="104" width="680" height="28" fill="url(#soil)"/>
<path d="M10 104 H690" stroke="#999" stroke-width="3"/>
<!-- 番茄: 深栽 -->
<rect x="96" y="112" width="34" height="18" rx="8" fill="#7a5a3c" stroke="#333" stroke-width="1.3"/>
