<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1236" width="720" height="1236" role="img" aria-label="石灰窑与生石灰熟化示意图: 简易立窑(土窑)依山坡挖成,从坡上装料、从坡下出灰;窑膛圆筒形或蛋形,内径约1.5-2.5 m,高约2-4 m,土坡就是保温层,内壁用耐火石块或砖砌一圈,缝用黏土泥抹严;窑底一侧是火门/出灰口,加燃料、通风,烧完从这里扒出石灰;窑底用石块架空成炉箅,让空气从下面进入;窑顶开口装料、排烟。混烧: 底部铺引火柴,然后一层燃料(煤、焦炭、木炭)、一层石灰石交替往上装。分烧: 窑底用大块石灰石干砌成拱,拱下是火膛,在火门持续烧柴,火焰穿过石块向上走。烧制: 头一天小火慢烘;逐渐加大火力,保持窑内鲜红到橙黄约900-1000°C,暗红色说明温度不够,柴窑大火持续烧2-4天,中间不能断火;烧好后封住火门,慢慢冷却1-2天再出窑,不要往热窑里泼水;用长柄耙子从出灰口扒灰,人不要进窑、不要站在窑顶;窑顶和下风处有一氧化碳。熟化: 生石灰加水变成熟石灰并放出大量热;先放水,再分批放入生石灰块,水量约为生石灰重量的3-4倍,用长柄木耙搅动,人站远、偏开脸;不要往一大堆灰上浇少量水,会局部沸腾飞溅;不要用塑料桶、塑料盆,温度可接近100°C;滤去石渣流进储灰池,浆面保持一层水,陈伏: 砌筑用至少2周,抹灰、刷墙用至少1个月。安全: 戴护目镜、手套,穿长袖,身边备一桶清水;溅入眼睛擦去眼周颗粒,马上翻开眼皮用大量清水持续冲洗,尽快就医;溅到皮肤先刷去干粉,再用大量清水冲洗" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>石灰窑与生石灰熟化</title>
<defs>
<pattern id="brick" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#d9a07a"/><path d="M0 0.5 H14 M0 6.5 H14 M4 0.5 V6.5 M11 6.5 V12" stroke="#a0623e" stroke-width="1"/></pattern>
<pattern id="soil" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#efe4cf"/><circle cx="4" cy="5" r="1.1" fill="#bba57a"/><circle cx="12" cy="12" r="1.1" fill="#bba57a"/><circle cx="11" cy="3" r="0.8" fill="#bba57a"/></pattern>
<pattern id="ls" width="26" height="15" patternUnits="userSpaceOnUse"><rect width="26" height="15" fill="#efefe9"/><ellipse cx="13" cy="7.5" rx="11.5" ry="6.4" fill="#d3d3ca" stroke="#666" stroke-width="1"/></pattern>
<pattern id="coal" width="10" height="12" patternUnits="userSpaceOnUse"><rect width="10" height="12" fill="#3a3a3a"/><circle cx="3" cy="4" r="1.6" fill="#6a6a6a"/><circle cx="8" cy="9" r="1.3" fill="#6a6a6a"/></pattern>
