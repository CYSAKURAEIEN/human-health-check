<g transform="translate(170,264)"><rect width="130" height="12" fill="url(#coal)"/></g>
<g transform="translate(170,276)"><rect width="130" height="30" fill="url(#ls)"/></g>
<g transform="translate(170,306)"><rect width="130" height="12" fill="url(#coal)"/></g>
<g transform="translate(170,318)"><rect width="130" height="30" fill="url(#ls)"/></g>
<g transform="translate(170,348)"><rect width="130" height="12" fill="url(#coal)"/></g>
