<text x="30" y="106" font-size="14" fill="#c33" font-weight="bold">坡上装料</text>

<!-- 左侧标注(土坡上) -->
<g fill="#fff" fill-opacity="0.85"><rect x="20" y="182" width="126" height="44" rx="3"/><rect x="34" y="256" width="82" height="24" rx="3"/><rect x="20" y="320" width="126" height="44" rx="3"/><rect x="128" y="424" width="214" height="24" rx="3"/></g>
<text x="26" y="200" font-size="14" font-weight="bold">土坡就是保温层</text>
<text x="26" y="218" font-size="13" fill="#555">依山挖进土坡最省事</text>
<path d="M140 134 V396" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="40" y="273" font-size="14" fill="#0b5cad" font-weight="bold">高约2-4 m</text>
<text x="26" y="338" font-size="14" font-weight="bold">炉箅: 石块架空,</text>
<text x="26" y="356" font-size="13">空气从下面进入</text>
<line x1="146" y1="352" x2="190" y2="380" stroke="#0b5cad" stroke-width="1.2"/><circle cx="190" cy="380" r="2.6" fill="#0b5cad"/>
<path d="M174 414 H296" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="235" y="441" font-size="14" fill="#0b5cad" font-weight="bold" text-anchor="middle">窑膛内径约1.5-2.5 m</text>
<text x="350" y="441" font-size="13" fill="#555">窑膛: 圆筒形或蛋形</text>

<!-- 右侧标注 -->
<g stroke="#0b5cad" stroke-width="1.2">
<line x1="396" y1="96" x2="292" y2="132"/><line x1="396" y1="156" x2="308" y2="150"/><line x1="396" y1="210" x2="284" y2="186"/><line x1="396" y1="248" x2="284" y2="250"/><line x1="396" y1="296" x2="284" y2="300"/><line x1="396" y1="342" x2="282" y2="366"/><line x1="396" y1="372" x2="344" y2="378"/>
</g>
<g fill="#0b5cad"><circle cx="292" cy="132" r="2.6"/><circle cx="308" cy="150" r="2.6"/><circle cx="284" cy="186" r="2.6"/><circle cx="284" cy="250" r="2.6"/><circle cx="284" cy="300" r="2.6"/><circle cx="282" cy="366" r="2.6"/><circle cx="344" cy="378" r="2.6"/></g>
<text x="402" y="100" font-size="15" font-weight="bold">窑顶开口</text>
<text x="474" y="100" font-size="14">装料、排烟</text>
<text x="402" y="160" font-size="15" font-weight="bold">内壁</text>
<text x="440" y="160" font-size="14">耐火石块或砖砌一圈,</text>
<text x="440" y="178" font-size="14">缝用黏土泥抹严</text>
<text x="402" y="214" font-size="15" font-weight="bold">燃料</text>
<text x="440" y="214" font-size="14">煤、焦炭、木炭</text>
<text x="402" y="252" font-size="15" font-weight="bold">石灰石</text>
<text x="456" y="252" font-size="14">敲成约拳头到10-20 cm大小</text>
<text x="402" y="300" font-size="15" font-weight="bold" fill="#c33">燃烧区</text>
<text x="456" y="300" font-size="14" fill="#c33">保持鲜红到橙黄,约900-1000°C</text>
<text x="402" y="346" font-size="15" font-weight="bold">引火柴</text>
<text x="456" y="346" font-size="14">铺在底部</text>
<text x="402" y="376" font-size="15" font-weight="bold">火门/出灰口(坡下)</text>
<text x="402" y="394" font-size="13">加燃料、通风;烧完从这里扒出石灰</text>
<text x="560" y="122" font-size="13" fill="#555">混烧: 一层燃料、一层</text>
<text x="560" y="139" font-size="13" fill="#555">石灰石交替往上装</text>

<!-- ② 分烧 -->
<rect x="10" y="480" width="250" height="316" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="506" font-size="15" font-weight="bold">② 分烧(单独火膛,适合烧柴)</text>
<rect x="70" y="530" width="130" height="160" fill="#fff"/>
<rect x="58" y="530" width="12" height="122" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<rect x="200" y="530" width="12" height="160" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<path d="M50 652 H70" stroke="#333" stroke-width="1.5"/>
<g fill="#d3d3ca" stroke="#555" stroke-width="1">
<circle cx="78" cy="561" r="7"/><circle cx="93" cy="561" r="7"/><circle cx="108" cy="561" r="7"/><circle cx="123" cy="561" r="7"/><circle cx="138" cy="561" r="7"/><circle cx="153" cy="561" r="7"/><circle cx="168" cy="561" r="7"/><circle cx="183" cy="561" r="7"/><circle cx="195" cy="561" r="5"/>
<circle cx="80" cy="580" r="9"/><circle cx="99" cy="580" r="9"/><circle cx="118" cy="580" r="9"/><circle cx="137" cy="580" r="9"/><circle cx="156" cy="580" r="9"/><circle cx="175" cy="580" r="9"/><circle cx="192" cy="580" r="8"/>
<circle cx="82" cy="604" r="12"/><circle cx="107" cy="604" r="12"/><circle cx="132" cy="604" r="12"/><circle cx="157" cy="604" r="12"/><circle cx="182" cy="604" r="12"/>
</g>
<g fill="#c4c4ba" stroke="#333" stroke-width="1.6">
<circle cx="81" cy="675.5" r="13"/><circle cx="95.4" cy="650.4" r="13"/><circle cx="120.5" cy="635.9" r="13"/><circle cx="149.5" cy="635.9" r="13"/><circle cx="174.6" cy="650.4" r="13"/><circle cx="189" cy="675.5" r="13"/>
</g>
<path d="M98 688 Q104 662 114 674 Q120 650 132 670 Q142 652 150 674 Q160 662 168 688 Z" fill="#f2a33a" stroke="#c33" stroke-width="1.3"/>
<use href="#log" x="40" y="682"/><use href="#log" x="66" y="684"/><use href="#log" x="120" y="684"/><use href="#log" x="150" y="684"/>
<path d="M30 690 H240" stroke="#999" stroke-width="3"/>
<g fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)">
<path d="M108 662 Q100 636 108 620 V540"/><path d="M135 656 V616 Q130 590 135 540"/><path d="M162 662 Q170 636 162 620 V540"/>
</g>
<text x="135" y="524" font-size="12" fill="#555" text-anchor="middle">上面装满石灰石(大块在下)</text>
<text x="24" y="714" font-size="13">大块石灰石干砌成拱,拱下是火膛;</text>
<text x="24" y="733" font-size="13">在火门持续烧柴,火焰穿过石块</text>
<text x="24" y="752" font-size="13">向上走</text>
<text x="24" y="778" font-size="13" fill="#555">石灰不混燃料灰,比较干净</text>
<text x="36" y="646" font-size="12" fill="#0b5cad" text-anchor="middle">火门</text>

<!-- ③ 烧制过程 -->
<rect x="270" y="480" width="440" height="316" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="284" y="506" font-size="15" font-weight="bold">③ 烧制过程</text>
<g font-size="14">
<text x="284" y="534" font-weight="bold">1. 头一天小火慢烘</text>
<text x="304" y="553" font-size="13">赶走石块和窑壁里的水分;急火会把石头和窑壁崩裂</text>
<text x="284" y="582" font-weight="bold">2. 逐渐加大火力,保持窑内鲜红到橙黄</text>
<rect x="304" y="592" width="26" height="16" fill="#8b1a1a" stroke="#333"/>
<text x="336" y="605" font-size="13">暗红色: 温度不够</text>
<path d="M452 600 H476" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<rect x="484" y="592" width="13" height="16" fill="#ec3a2c" stroke="#333"/>
<rect x="497" y="592" width="13" height="16" fill="#f39a2a" stroke="#333"/>
<text x="516" y="605" font-size="13" fill="#c33" font-weight="bold">鲜红到橙黄: 约900-1000°C</text>
<text x="304" y="628" font-size="13">柴窑大火持续烧2-4天(看窑和石块大小),中间不能断火</text>
<text x="284" y="658" font-weight="bold">3. 烧好后封住火门,慢慢冷却1-2天再出窑</text>
<text x="304" y="677" font-size="13" fill="#c33">✗ 不要往热窑里泼水</text>
<text x="284" y="706" font-weight="bold">4. 用长柄耙子从出灰口扒灰</text>
<text x="304" y="725" font-size="13" fill="#c33">✗ 人不要进窑、不要站在窑顶</text>
</g>
<rect x="282" y="738" width="416" height="48" rx="5" fill="#fdf3f3"/>
<text x="292" y="757" font-size="13" fill="#c33" font-weight="bold">⚠️ 一氧化碳: 窑顶和下风处、低洼地不要久留</text>
<text x="292" y="776" font-size="13" fill="#c33">料会"悬空"(下面烧酥、上面结拱): 只用长杆在外面捅</text>

<!-- ④ 熟化 -->
<rect x="10" y="808" width="700" height="290" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="834" font-size="16" font-weight="bold">④ 熟化: 生石灰 + 水 → 熟石灰 + 大量热</text>
<text x="370" y="834" font-size="14" fill="#555">CaO + H₂O → Ca(OH)₂</text>

<g transform="translate(20,846)">
<rect width="220" height="196" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="10" y="22" font-size="14" font-weight="bold" fill="#0b5cad">✓ 先放水,再分批放入生石灰块</text>
<path d="M28 60 L36 128 H128 L136 60" fill="#a9a9a9" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M32 74 L38 124 H126 L132 74 Z" fill="#d8ebf7"/>
<path d="M32 74 H132" stroke="#0b5cad" stroke-width="1.5"/>
<g fill="#d3d3ca" stroke="#333" stroke-width="1.2"><use href="#lump" x="72" y="44"/><use href="#lump" x="94" y="34"/></g>
<path d="M82 52 V68" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<path d="M52 70 Q46 60 52 52 T50 38 M112 70 Q118 60 112 52 T114 38" fill="none" stroke="#888" stroke-width="1.6"/>
<path d="M206 38 L120 112" stroke="#8b6b3e" stroke-width="4" stroke-linecap="round"/>
<path d="M112 106 L128 120 M110 112 L122 122" stroke="#8b6b3e" stroke-width="3" stroke-linecap="round"/>
<text x="150" y="70" font-size="12" fill="#555">长柄木耙</text>
<text x="10" y="150" font-size="13">水量约为生石灰重量的3-4倍</text>
<text x="10" y="168" font-size="13">用长柄木耙搅动,人站远、偏开脸</text>
<text x="10" y="186" font-size="13" fill="#555">会冒热汽、沸腾、溅浆</text>
</g>

<g transform="translate(250,846)">
<rect width="220" height="196" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="10" y="22" font-size="14" font-weight="bold" fill="#c33">✗ 往一大堆灰上浇少量水</text>
<path d="M50 126 Q110 52 170 126 Z" fill="#e2e2da" stroke="#333" stroke-width="2"/>
<g fill="#d3d3ca" stroke="#555" stroke-width="1"><use href="#lump" x="86" y="112"/><use href="#lump" x="110" y="104"/><use href="#lump" x="134" y="114"/><use href="#lump" x="98" y="94"/><use href="#lump" x="122" y="92"/></g>
<path d="M30 44 L52 36 L58 52 L38 60 Z" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<path d="M56 46 Q84 46 104 78" fill="none" stroke="#7aa6cc" stroke-width="3"/>
<g stroke="#c33" stroke-width="2" stroke-linecap="round"><path d="M112 74 L118 58 M124 78 L140 66 M100 72 L94 56 M130 88 L150 86"/></g>
<g fill="#c33"><circle cx="122" cy="50" r="2.6"/><circle cx="146" cy="58" r="2.6"/><circle cx="90" cy="48" r="2.2"/><circle cx="158" cy="78" r="2.2"/></g>
<path d="M170 64 Q164 54 170 46 T168 32" fill="none" stroke="#888" stroke-width="1.6"/>
<text x="10" y="150" font-size="13" fill="#c33" font-weight="bold">会局部沸腾飞溅</text>
<text x="10" y="168" font-size="13">(大量消石灰粉的做法见正文:</text>
<text x="10" y="186" font-size="13">薄层摊开,边翻边少量洒水)</text>
</g>

