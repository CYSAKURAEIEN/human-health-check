<!-- 燃烧区 -->
<rect x="170" y="276" width="130" height="98" fill="#f08a24" fill-opacity="0.4"/>
<path d="M176 362 Q182 340 190 352 Q196 330 206 350 Q214 336 222 356 M240 356 Q248 334 258 350 Q266 330 274 352 Q282 342 292 362" fill="none" stroke="#c33" stroke-width="1.6"/>
<!-- 炉箅 -->
<g fill="#b9b9b0" stroke="#333" stroke-width="1.2">
<rect x="172" y="386" width="10" height="14"/><rect x="230" y="386" width="10" height="14"/><rect x="288" y="386" width="10" height="14"/>
<rect x="172" y="374" width="22" height="12" rx="4"/><rect x="199" y="374" width="22" height="12" rx="4"/><rect x="226" y="374" width="22" height="12" rx="4"/><rect x="253" y="374" width="22" height="12" rx="4"/><rect x="278" y="374" width="20" height="12" rx="4"/>
</g>
<path d="M11.5 130 H330 Q342 270 360 400 H708.5" fill="none" stroke="#999" stroke-width="3"/>
<!-- 空气、烟、装料 -->
<path d="M384 393 H186" fill="none" stroke="#0b5cad" stroke-width="2.2" marker-end="url(#arB)"/>
<path d="M210 393 V380 M260 393 V380" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<path d="M218 140 Q210 126 218 114 T216 88" fill="none" stroke="#888" stroke-width="2.2" marker-end="url(#arG)"/>
<path d="M254 140 Q262 126 254 114 T256 88" fill="none" stroke="#888" stroke-width="2.2" marker-end="url(#arG)"/>
