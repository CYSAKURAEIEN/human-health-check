<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#888"/></marker>
<g id="log"><rect x="-14" y="-4" width="28" height="8" rx="3" fill="#8b6b3e" stroke="#333" stroke-width="1"/><ellipse cx="14" cy="0" rx="2.5" ry="4" fill="#c9a26a" stroke="#333" stroke-width="0.8"/></g>
<path id="lump" d="M-8 2 L-6 -5 L1 -7 L7 -3 L8 4 L1 7 L-6 6 Z"/>
<rect id="lb" x="-3" y="-11" width="6" height="16" rx="2" fill="#fff" stroke="none"/>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">石灰窑与生石灰熟化(示意,不按比例)</text>

<!-- ① 立窑剖面 -->
