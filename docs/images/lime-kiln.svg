<text x="24" y="70" font-size="16" font-weight="bold">① 简易立窑(土窑)剖面: 依山坡挖成,从坡上装料、从坡下出灰</text>
<path d="M11.5 130 H330 Q342 270 360 400 H11.5 Z" fill="url(#soil)"/>
<rect x="11.5" y="400" width="697" height="54" fill="url(#soil)"/>
<!-- 窑膛 -->
<rect x="170" y="130" width="130" height="270" fill="#fff"/>
<rect x="300" y="360" width="60" height="40" fill="#fff"/>
<rect x="156" y="130" width="14" height="270" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<rect x="300" y="130" width="14" height="230" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<path d="M300 360 H354" stroke="#333" stroke-width="2"/>
<!-- 混烧装料: 一层燃料、一层石灰石 -->
<g transform="translate(170,150)"><rect width="130" height="30" fill="url(#ls)"/></g>
<g transform="translate(170,180)"><rect width="130" height="12" fill="url(#coal)"/></g>
<g transform="translate(170,192)"><rect width="130" height="30" fill="url(#ls)"/></g>
<g transform="translate(170,222)"><rect width="130" height="12" fill="url(#coal)"/></g>
