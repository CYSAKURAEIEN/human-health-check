<text x="24" y="1066" font-size="14">滤去没化开的石渣 → 流进储灰池,浆面保持一层水 → <tspan font-weight="bold">陈伏</tspan></text>
<text x="24" y="1088" font-size="14">陈伏: 砌筑用至少2周,抹灰、刷墙用至少1个月(让过烧颗粒在池里化完,免得上墙"爆灰")</text>

<!-- 安全 -->
<rect x="10" y="1110" width="700" height="116" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="24" y="1136" font-size="15" font-weight="bold" fill="#c33">⚠️ 生石灰遇水剧烈放热,能把水烧开;粉尘或灰浆溅入眼睛可以致盲</text>
<text x="24" y="1160" font-size="14">✓ 处理生石灰、熟化、拌灰浆时戴护目镜、手套,穿长袖,身边备一桶清水</text>
<text x="24" y="1184" font-size="14"><tspan font-weight="bold" fill="#c33">溅入眼睛:</tspan> 擦去眼周可见的颗粒,马上翻开眼皮用大量清水持续冲洗,尽快就医</text>
<text x="24" y="1208" font-size="14"><tspan font-weight="bold" fill="#c33">溅到皮肤:</tspan> 先刷去(擦去)干粉,再用大量清水冲洗,不要先泼少量水</text>
</g>
