<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" width="720" height="836" role="img" aria-label="锻炉剖面: 火床是砖石平台,高度约70-80 cm,是站着干活舒适的高度;火盆是火床中央的凹坑,直径约20-30 cm,深约15 cm;烟罩可选。侧吹的风口从侧面进风,最简单,对准放工件的位置下方;底吹从火盆底部进风,底部要有可以打开的灰渣口。风口附近是氧化区,工件放在这里会严重起氧化皮;往上一点是还原区,温度最高、氧气少,是加热工件的最佳位置;火要深,工件埋在火的中间,上下都有燃料。旁边放淬火水槽、燃料堆、工具架。砧子牢牢固定在粗木墩或砖台上,砧面约在操作者垂手时的指关节高度。一氧化碳会积聚,必须通风;火星和炭粒会飞出很远;风嘴靠近火的一端温度极高" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>锻炉的结构</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="dimB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#0b5cad"/></marker>
<pattern id="brick" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="#dcbca4"/><path d="M0,0.5 H40 M0,10.5 H40 M20,0 V10 M0.5,10 V20" stroke="#b8927a" stroke-width="1"/></pattern>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">锻炉(侧吹)剖面示意</text>

<!-- 地面 -->
<rect x="0" y="430" width="552" height="14" fill="#ececec"/>
<path d="M0,430 H552" stroke="#999" stroke-width="3"/>

<!-- 烟罩 -->
<path d="M226,140 L258,96 V56 M354,140 L322,96 V56 M226,140 H354" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="6 4"/>
<text x="362" y="104" font-size="14" fill="#555">烟罩(可选)</text>

<!-- 火床 -->
<rect x="150" y="230" width="280" height="200" fill="url(#brick)" stroke="#333" stroke-width="2.5"/>
<!-- 燃料堆和火盆 -->
<path d="M205,230 Q230,226 245,205 Q262,176 290,172 Q318,176 335,205 Q350,226 375,230 H325 Q325,270 290,270 Q255,270 255,230 Z" fill="#3d3d3d" stroke="#222" stroke-width="1.5"/>
<g fill="#5e5e5e">
<circle cx="236" cy="222" r="4"/><circle cx="252" cy="196" r="4"/><circle cx="272" cy="184" r="4"/><circle cx="306" cy="183" r="4"/><circle cx="326" cy="196" r="4"/><circle cx="344" cy="222" r="4"/><circle cx="360" cy="226" r="3"/><circle cx="220" cy="227" r="3"/><circle cx="300" cy="240" r="4"/><circle cx="316" cy="252" r="4"/><circle cx="292" cy="262" r="4"/>
</g>
<ellipse cx="290" cy="212" rx="44" ry="15" fill="#f08a2a"/>
<ellipse cx="278" cy="254" rx="17" ry="10" fill="#ffe27a"/>
<path d="M255,230 Q255,270 290,270 Q325,270 325,230" fill="none" stroke="#333" stroke-width="2"/>
<!-- 工件 -->
<rect x="262" y="208" width="258" height="7" fill="#8a8a8a" stroke="#333" stroke-width="1.2"/>
<rect x="263" y="209" width="70" height="5" fill="#e0482a"/>
<!-- 风管和风箱 -->
<rect x="16" y="236" width="60" height="40" rx="3" fill="#e2cfa6" stroke="#333" stroke-width="2"/>
<text x="46" y="261" font-size="14" text-anchor="middle">风箱</text>
<rect x="76" y="251" width="185" height="10" fill="#c9a27a" stroke="#333" stroke-width="1.5"/>
<rect x="76" y="254.5" width="185" height="3" fill="#fff"/>
<path d="M88,243 H140" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M264,258 Q276,256 282,244" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>

<!-- 火区标注 -->
<text x="16" y="128" font-size="14" font-weight="bold">还原区(风口往上一点)</text>
<text x="16" y="146" font-size="14">温度最高、氧气少</text>
<text x="16" y="164" font-size="14" font-weight="bold" fill="#c33">→ 加热工件的最佳位置</text>
<line x1="170" y1="152" x2="254" y2="209" stroke="#555" stroke-width="1"/>
<text x="16" y="196" font-size="14" font-weight="bold">氧化区(风口附近,氧气多)</text>
<text x="16" y="214" font-size="14">工件放这里会严重起氧化皮</text>
<line x1="178" y1="218" x2="268" y2="251" stroke="#555" stroke-width="1"/>
<text x="400" y="168" font-size="14">工件埋在火的中间,</text>
<text x="400" y="186" font-size="14">上下都有燃料</text>
<line x1="398" y1="182" x2="372" y2="207" stroke="#555" stroke-width="1"/>
<text x="16" y="300" font-size="14" font-weight="bold">风口(侧吹)</text>
<text x="16" y="318" font-size="14">从侧面进风,</text>
<text x="16" y="336" font-size="14">对准放工件的</text>
<text x="16" y="354" font-size="14">位置下方</text>

<!-- 火盆尺寸 -->
<path d="M255,232 V292 M325,232 V292 M292,270 H346" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="257" y1="286" x2="323" y2="286" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<line x1="340" y1="232" x2="340" y2="268" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<rect x="348" y="242" width="76" height="22" rx="3" fill="#fff"/>
<text x="352" y="258" font-size="13" fill="#0b5cad">深约 <tspan font-weight="bold">15 cm</tspan></text>
<rect x="208" y="296" width="164" height="44" rx="3" fill="#fff"/>
<text x="290" y="314" font-size="13" fill="#0b5cad" text-anchor="middle">火盆直径约 <tspan font-weight="bold">20-30 cm</tspan></text>
<text x="290" y="333" font-size="13" text-anchor="middle">(火床中央的凹坑)</text>
<rect x="222" y="372" width="136" height="24" rx="3" fill="#fff"/>
<text x="290" y="389" font-size="14" text-anchor="middle">火床(砖石平台)</text>

<!-- 高度 -->
<path d="M432,230 H452 M432,430 H452" stroke="#0b5cad" stroke-width="1"/>
<line x1="444" y1="232" x2="444" y2="428" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<g font-size="14" fill="#0b5cad">
<text x="452" y="296">高度约</text>
<text x="452" y="314" font-weight="bold">70-80 cm</text>
<text x="452" y="336" font-size="13">(站着干活</text>
<text x="452" y="353" font-size="13">舒适的高度)</text>
</g>

<!-- 旁边的东西 -->
<path d="M24,430 Q40,404 76,402 Q112,404 130,430 Z" fill="#3d3d3d" stroke="#222" stroke-width="1.5"/>
<g fill="#5e5e5e"><circle cx="52" cy="418" r="4"/><circle cx="76" cy="410" r="4"/><circle cx="100" cy="418" r="4"/><circle cx="66" cy="424" r="3"/><circle cx="90" cy="425" r="3"/></g>
<text x="16" y="376" font-size="13" fill="#555">燃料堆</text>
<text x="16" y="392" font-size="13" fill="#555">核桃大小,均匀</text>
<rect x="464" y="406" width="80" height="22" fill="#a9cdf2"/>
<path d="M462,396 V430 H546 V396" fill="none" stroke="#333" stroke-width="2"/>
<text x="504" y="390" font-size="13" fill="#555" text-anchor="middle">淬火水槽</text>
<text x="16" y="466" font-size="14">旁边放: 淬火水槽、燃料堆、工具架</text>

<!-- 砧子 -->
<rect x="560" y="150" width="150" height="330" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="570" y="172" font-size="15" font-weight="bold">砧子<tspan font-size="12" font-weight="normal" fill="#555">(缩小比例)</tspan></text>
<text x="570" y="192" font-size="13">牢牢固定在粗木墩</text>
<text x="570" y="208" font-size="13">或砖台上</text>
<path d="M566,430 H704" stroke="#999" stroke-width="3"/>
<rect x="597" y="312" width="15" height="114" rx="5" fill="#9fb8d0" stroke="#333" stroke-width="2"/>
<rect x="596" y="423" width="24" height="7" rx="2" fill="#555"/>
<rect x="593" y="244" width="22" height="76" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="604" cy="231" r="12" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="601" y="250" width="10" height="78" rx="5" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<circle cx="606" cy="334" r="6" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<line x1="614" y1="334" x2="646" y2="334" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M646,334 H702 V340 L694,346 V352 H656 V346 L648,340 Z" fill="#777" stroke="#333" stroke-width="1.5"/>
<rect x="656" y="352" width="38" height="78" fill="#c9a27a" stroke="#333" stroke-width="2"/>
<path d="M662,372 Q675,368 688,372 M662,396 Q675,392 688,396" fill="none" stroke="#8b6b4b" stroke-width="1"/>
<text x="570" y="452" font-size="13" fill="#0b5cad">砧面约在操作者</text>
<text x="570" y="470" font-size="13" fill="#0b5cad">垂手时的指关节高度</text>

<!-- 底吹 -->
<rect x="10" y="490" width="240" height="190" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="22" y="512" font-size="15" font-weight="bold">底吹: 从火盆底部进风</text>
<text x="22" y="532" font-size="13">火盆底部要有可以打开的</text>
<text x="22" y="549" font-size="13">灰渣口,方便清理炉渣</text>
<rect x="70" y="566" width="150" height="76" fill="url(#brick)" stroke="#333" stroke-width="2"/>
<path d="M100,566 Q100,598 130,598 Q160,598 160,566 Z" fill="#3d3d3d" stroke="#333" stroke-width="2"/>
<rect x="123" y="597" width="14" height="45" fill="#fff" stroke="#333" stroke-width="1.5"/>
<rect x="24" y="617" width="99" height="10" fill="#c9a27a" stroke="#333" stroke-width="1.5"/>
<rect x="24" y="620.5" width="100" height="3" fill="#fff"/>
<path d="M24,608 H62" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M130,622 V588" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<rect x="119" y="642" width="22" height="5" fill="#777" stroke="#333" stroke-width="1"/>
<circle cx="119" cy="644.5" r="2.5" fill="#333"/>
<text x="150" y="666" font-size="13">灰渣口(可打开)</text>
<line x1="148" y1="660" x2="140" y2="648" stroke="#555" stroke-width="1"/>

<!-- 火的管理 -->
<rect x="260" y="490" width="450" height="190" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="274" y="512" font-size="15" font-weight="bold">火的管理</text>
<g font-size="14">
<text x="274" y="536">✓ 火要深: 工件埋在火的中间,上下都有燃料</text>
<text x="274" y="558">✓ 保持火床干净: 定期清除炉渣(炉渣会堵住风口)</text>
<text x="274" y="580">✓ 加热时经常翻转工件,受热均匀</text>
<text x="274" y="602">✓ 不要让工件“过烧”(冒出大量火花说明钢在燃烧)</text>
<text x="274" y="624">✓ 不用时减少鼓风,用湿的燃料在外圈围住火,保存火种</text>
<text x="274" y="646">✓ 燃料块核桃大小,均匀;煤最好先烧成焦炭再用</text>
</g>

<!-- 安全 -->
<rect x="10" y="692" width="700" height="134" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="24" y="716" font-size="15" font-weight="bold" fill="#c33">⚠ 一氧化碳: 炉子在棚子、屋里工作时会积聚,使人头痛、昏迷甚至死亡</text>
<text x="40" y="738" font-size="14">→ 必须通风,最好在半敞开的棚下</text>
<text x="24" y="764" font-size="15" font-weight="bold" fill="#c33">⚠ 鼓风会让火星和炭粒飞出很远</text>
<text x="40" y="786" font-size="14">→ 周围清除易燃物,准备灭火的沙和水</text>
<text x="24" y="812" font-size="15" font-weight="bold" fill="#c33">⚠ 风嘴靠近火的一端温度极高: <tspan font-size="14" font-weight="normal" fill="#222">铁管会很快烧坏,耐火黏土陶管最好;风管附近不要放手</tspan></text>
</g>
</svg>
