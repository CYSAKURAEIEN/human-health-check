<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 716" width="720" height="716" role="img" aria-label="生火材料和火堆结构: 材料从细到粗,火绒、引火材(火柴粗、铅笔粗、拇指粗)、燃料(手指粗到手腕粗),从小到大逐渐添加;锥形火快速生火,迎风一侧留小口点火;木屋式井字交叉堆叠,适合做饭;星形火几根粗木头一头朝向中心,烧短了往中心推,省柴;平台式在湿地雪地上先铺一层木头平台">
<rect width="100%" height="100%" fill="#fff"/>
