<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" width="720" height="830" role="img" aria-label="烧伤面积估算(中国新九分法,成人):头颈9%(头发区、面部、颈部各3%);双上肢18%(双上臂7%、双前臂6%、双手5%);躯干27%(前面13%、后面13%、会阴1%);双下肢46%(双臀5%、双大腿21%、双小腿13%、双足7%)。12岁以下儿童:头颈=9%+(12-年龄)%,双下肢=46%-(12-年龄)%。手掌法:伤者自己的手掌连手指约等于1%体表面积" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
