<text x="452" y="402" font-size="15" fill="#222" font-weight="bold">④ 八字绳圈(比单套结更不容易松,</text>
<text x="472" y="422" font-size="15" fill="#222" font-weight="bold">但受力后难解)</text>
<text x="452" y="452" font-size="14" fill="#222">1. 绳头一段对折成双股</text>
<text x="452" y="474" font-size="14" fill="#222">2. 用双股打一个八字结(同①-③),</text>
<text x="470" y="494" font-size="14" fill="#222">留出的弯头就是绳圈</text>
<text x="452" y="524" font-size="13" fill="#555">图中双股并排画成一条宽带</text>
<text x="360" y="598" font-size="14" fill="#c33" text-anchor="middle">打完整理平整、慢慢拉紧,检查形状对不对;打得不像的结不要用于承重</text>
</svg>
