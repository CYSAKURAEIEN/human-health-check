<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 870" width="720" height="870" role="img" aria-label="预防老人跌倒的家里布置: 1 床边: 床的高度适中,坐下时膝盖约成直角,站起来不费力;床边有伸手就能打开的灯,床边装夜灯;2 卫生间: 马桶旁、淋浴处装扶手,用防滑的洗澡椅,卫生间、厨房铺防滑垫,地面有水及时擦干;3 走廊和地面: 去掉门槛或做成斜坡,清除地上的电线、杂物、小地毯,走廊装夜灯;4 楼梯: 两侧装扶手,上下都有开关;5 常用的东西放在不用弯腰、不用踩凳子就能拿到的地方,不用带轮子会滑动的椅子">
