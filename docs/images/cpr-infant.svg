<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-label="婴儿胸外按压示意图: 首选双手环抱胸部、两拇指并排按在两乳头连线中点正下方的胸骨上,其余手指托住背部;手小或一人既要按压又要吹气时用一只手的掌根按同一位置;按压深度约4 cm,为胸廓厚度的1/3;不要按在剑突上;两指按压已不再推荐">
<rect width="100%" height="100%" fill="#fff"/>
<title>婴儿胸外按压: 两拇指环抱法与单手掌根法</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<!-- 仰卧的婴儿(俯视,头朝上),原点在身体中线 -->
<g id="baby" stroke="#333">
<line x1="-26" y1="132" x2="-56" y2="104" stroke-width="18" stroke-linecap="round"/>
<line x1="-26" y1="132" x2="-56" y2="104" stroke="#f3e3d3" stroke-width="13" stroke-linecap="round"/>
<line x1="26" y1="132" x2="56" y2="104" stroke-width="18" stroke-linecap="round"/>
<line x1="26" y1="132" x2="56" y2="104" stroke="#f3e3d3" stroke-width="13" stroke-linecap="round"/>
<polyline points="-16,232 -38,264 -30,298" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="-16,232 -38,264 -30,298" fill="none" stroke="#f3e3d3" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="16,232 38,264 30,298" fill="none" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="16,232 38,264 30,298" fill="none" stroke="#f3e3d3" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="-34" y="118" width="68" height="124" rx="24" fill="#f3e3d3" stroke-width="2.5"/>
<path d="M-4,192 Q-18,204 -30,222 M4,192 Q18,204 30,222" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="-5" y="128" width="10" height="56" rx="4" fill="#fff" stroke-width="1.5"/>
<path d="M-4,183 L0,193 L4,183" fill="#fff" stroke-width="1.5"/>
<circle cx="-17" cy="150" r="3" fill="#c9a08a" stroke-width="1"/>
<circle cx="17" cy="150" r="3" fill="#c9a08a" stroke-width="1"/>
<circle cx="0" cy="88" r="33" fill="#f3e3d3" stroke-width="2.5"/>
<path d="M-15,84 Q-10,88 -5,84 M5,84 Q10,88 15,84 M-5,102 Q0,105 5,102" fill="none" stroke-width="1.8"/>
</g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="15" fill="#222">
<text x="20" y="28" font-size="17" font-weight="bold">婴儿(&lt;1岁)胸外按压</text>
<text x="230" y="28" font-size="15">深度 <tspan fill="#c33" font-weight="bold">约4 cm</tspan>(胸廓厚度的1/3) · 频率 100-120次/分</text>

<!-- ① 两拇指环抱 -->
<rect x="10" y="42" width="250" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="22" y="66" font-size="16" font-weight="bold">① 首选: 双手环抱、两拇指按压</text>
<g transform="translate(135,0)">
<use href="#baby"/>
<line x1="-40" y1="150" x2="40" y2="150" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 3"/>
<!-- 救护者前臂(从婴儿脚的方向伸过来) -->
<line x1="-46" y1="208" x2="-92" y2="330" stroke="#333" stroke-width="30" stroke-linecap="round"/>
<line x1="-46" y1="208" x2="-92" y2="330" stroke="#f3e3d3" stroke-width="25" stroke-linecap="round"/>
<line x1="46" y1="208" x2="92" y2="330" stroke="#333" stroke-width="30" stroke-linecap="round"/>
<line x1="46" y1="208" x2="92" y2="330" stroke="#f3e3d3" stroke-width="25" stroke-linecap="round"/>
<!-- 手掌贴在胸廓两侧,手指绕到背后 -->
<path d="M-34,150 Q-48,148 -52,166 L-56,206 Q-50,222 -32,214 L-10,196 L-12,180 L-30,184 Z" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M34,150 Q48,148 52,166 L56,206 Q50,222 32,214 L10,196 L12,180 L30,184 Z" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M-34,156 L-44,158 M-34,168 L-46,170 M-34,180 L-46,182" stroke="#333" stroke-width="1.3"/>
<path d="M34,156 L44,158 M34,168 L46,170 M34,180 L46,182" stroke="#333" stroke-width="1.3"/>
<!-- 两拇指并排 -->
<rect x="-12" y="153" width="11" height="44" rx="5.5" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="1" y="153" width="11" height="44" rx="5.5" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M-10,157 Q-6.5,154 -3,157 M3,157 Q6.5,154 10,157" fill="none" stroke="#333" stroke-width="1"/>
<circle cx="0" cy="158" r="4" fill="#c33"/>
</g>
<text x="22" y="320" font-size="14">两拇指并排,按在两乳头连线中点</text>
<text x="22" y="339" font-size="14">正下方的胸骨上;</text>
<text x="22" y="358" font-size="14">其余手指托住背部</text>

<!-- ② 单手掌根 -->
<rect x="268" y="42" width="214" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="280" y="66" font-size="16" font-weight="bold">② 也可以: 单手掌根</text>
<g transform="translate(375,0)">
<use href="#baby"/>
<line x1="-40" y1="150" x2="40" y2="150" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="20" y1="168" x2="98" y2="226" stroke="#333" stroke-width="30" stroke-linecap="round"/>
<line x1="20" y1="168" x2="98" y2="226" stroke="#f3e3d3" stroke-width="25" stroke-linecap="round"/>
<g fill="#f3e3d3" fill-opacity="0.8" stroke="#333" stroke-width="1.8">
<rect x="-80" y="139" width="44" height="9" rx="4.5"/>
<rect x="-84" y="149" width="48" height="9" rx="4.5"/>
<rect x="-82" y="159" width="46" height="9" rx="4.5"/>
<rect x="-74" y="169" width="38" height="9" rx="4.5"/>
<path d="M-40,138 Q-10,132 12,142 Q22,158 12,176 Q-10,186 -40,180 Z"/>
<path d="M-6,138 Q-16,124 -26,112 Q-24,106 -18,110 Q-4,120 6,132"/>
</g>
<circle cx="2" cy="158" r="4" fill="#c33"/>
</g>
<text x="280" y="320" font-size="14">手小、或一个人既要按压又要</text>
<text x="280" y="339" font-size="14">吹气时: 用一只手的掌根</text>
<text x="280" y="358" font-size="14">按在同一位置</text>

<!-- ③ 按压深度(侧面) -->
<rect x="490" y="42" width="220" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="502" y="66" font-size="16" font-weight="bold">③ 按压深度(侧面)</text>
<line x1="500" y1="240" x2="700" y2="240" stroke="#999" stroke-width="3"/>
<text x="506" y="262" font-size="13" fill="#666">硬的平面(桌面、地面)</text>
<polyline points="632,226 668,214 690,232" fill="none" stroke="#333" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="632,226 668,214 690,232" fill="none" stroke="#f3e3d3" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="556" y="178" width="92" height="62" rx="24" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<circle cx="536" cy="208" r="31" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M528,180 Q536,174 544,180" fill="none" stroke="#333" stroke-width="1.5"/>
<path d="M556,199 Q590,199 640,199" fill="none" stroke="#c33" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="590" y1="120" x2="590" y2="172" stroke="#c33" stroke-width="4" marker-end="url(#ar)"/>
<text x="560" y="112" font-size="14" fill="#c33">向下按压</text>
<!-- 尺寸 -->
<line x1="652" y1="178" x2="700" y2="178" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="644" y1="199" x2="700" y2="199" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="694" y1="181" x2="694" y2="196" stroke="#c33" stroke-width="1.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="510" y1="140" x2="510" y2="140" stroke="none"/>
<text x="504" y="300" font-size="14"><tspan fill="#c33">红色</tspan>: 下压约4 cm,</text>
<text x="504" y="319" font-size="14">即胸廓前后厚度的1/3</text>
<line x1="676" y1="178" x2="676" y2="237" stroke="#0b5cad" stroke-width="1.2" marker-start="url(#ab)" marker-end="url(#ab)"/>
<text x="504" y="345" font-size="14"><tspan fill="#0b5cad">蓝色</tspan>: 胸廓厚度</text>

<!-- 底部: 注意事项 -->
<g transform="translate(20,388)">
<rect x="0" y="0" width="92" height="96" rx="6" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
<rect x="10" y="62" width="72" height="26" rx="10" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<rect x="34" y="16" width="10" height="50" rx="5" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<rect x="46" y="14" width="10" height="52" rx="5" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<path d="M12,12 L80,84 M80,12 L12,84" stroke="#c33" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="128" y="410" font-size="15"><tspan fill="#c33" font-weight="bold">两指按压已不再推荐</tspan>: 旧教材的这种方法往往按不到足够深度</text>
<text x="128" y="438" font-size="15"><tspan fill="#c33" font-weight="bold">不要按在剑突上</tspan>(胸骨最下端,容易伤到肝脏)</text>
<text x="128" y="466" font-size="15">婴儿仰卧在<tspan font-weight="bold">硬的平面</tspan>上(桌面、地面)</text>
</g>
</svg>
