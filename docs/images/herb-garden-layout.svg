<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" width="720" height="596" role="img" aria-label="家庭药园的布局,小面积约10-20 m²。平面示意: 金银花(攀援架)和枸杞1-2株是多年生藤本、灌木,放在北侧或边上,不挡矮的植物;菊花2-3株、蒲公英散种在中间阳光充足处;薄荷约1 m²、艾草2-3株、鱼腥草的地下茎乱窜,单独种在挡板围起来的角落或大盆里;生姜、大蒜种在蔬菜地。挡板: 在四周埋入约30 cm深,也可以种在花盆、无底旧桶里。选址: 向阳、排水好、离厕所和畜圈远,药园不要在厕所、畜圈的下坡方向,厕所、畜圈离水源至少30 m。种下以后: 每种植物插标签,写名称、种植日期;施腐熟的堆肥、厩肥,每平方米约2-3 kg,翻入土中,不要用没有腐熟的粪便;优先种药食两用、性质温和的,不种、不留有毒的药用植物如乌头、附子、半夏、天南星、商陆、曼陀罗" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>家庭药园的布局</title>
<defs>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#333"/></marker>
<g id="mum"><circle r="16" fill="#a8c98a" stroke="#4d7a2e" stroke-width="1.2"/><circle r="10" fill="#fff" stroke="#333" stroke-width="1.2"/><circle r="4" fill="#e8a33a" stroke="#333" stroke-width="1"/></g>
<g id="dand"><path d="M-7,0 L0,-3 L7,0 L0,3 Z M0,-7 L3,0 L0,7 L-3,0 Z" fill="#8fbf6a" stroke="#4d7a2e" stroke-width="0.8"/><circle r="3" fill="#f5c518" stroke="#b08a10" stroke-width="0.8"/></g>
<g id="mint"><ellipse cx="-5" rx="5" ry="3" fill="#6fae4a" stroke="#3d6e22" stroke-width="0.8"/><ellipse cx="5" rx="5" ry="3" fill="#6fae4a" stroke="#3d6e22" stroke-width="0.8"/></g>
<g id="mug"><circle r="13" fill="#c3d1b8" stroke="#55704a" stroke-width="1.2"/><path d="M-8,-4 L0,0 L8,-5 M-6,6 L0,0 L7,6 M0,-10 V0" fill="none" stroke="#55704a" stroke-width="1.2"/></g>
<path id="heart" d="M0,6 C-9,-1 -6,-8 0,-4 C6,-8 9,-1 0,6 Z" fill="#7aa85a" stroke="#3d6e22" stroke-width="0.8"/>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">家庭药园的布局(小面积约10-20 m²)</text>
<text x="360" y="50" font-size="13" fill="#555" text-anchor="middle">自己种比野外采安全: 来源清楚,不会和有毒植物混在一起</text>

<!-- ① 平面示意 -->
<rect x="8" y="64" width="444" height="390" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="88" font-size="15" font-weight="bold">① 平面示意(不按比例)</text>
<path d="M434,104 V74" stroke="#333" stroke-width="2" marker-end="url(#arK)"/>
<text x="424" y="96" font-size="13" font-weight="bold" text-anchor="end">北</text>
<text x="28" y="108" font-size="12" fill="#0b5cad">北侧或边上: 多年生的藤本、灌木,不挡矮的植物</text>
<rect x="28" y="114" width="404" height="286" fill="#f4ede0" stroke="#8a6a3a" stroke-width="1.5"/>
<!-- 金银花架 -->
<path d="M46,142 H262" stroke="#8a5a2b" stroke-width="3"/>
<g fill="#8a5a2b"><rect x="43" y="139" width="6" height="6"/><rect x="115" y="139" width="6" height="6"/><rect x="187" y="139" width="6" height="6"/><rect x="259" y="139" width="6" height="6"/></g>
<path d="M48,142 q9,-10 18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0" fill="none" stroke="#4d7a2e" stroke-width="2"/>
<g stroke="#333" stroke-width="0.8"><ellipse cx="66" cy="133" rx="5" ry="2.5" fill="#fff"/><ellipse cx="74" cy="134" rx="5" ry="2.5" fill="#f5d04a"/><ellipse cx="138" cy="133" rx="5" ry="2.5" fill="#fff"/><ellipse cx="146" cy="134" rx="5" ry="2.5" fill="#f5d04a"/><ellipse cx="210" cy="133" rx="5" ry="2.5" fill="#f5d04a"/><ellipse cx="218" cy="134" rx="5" ry="2.5" fill="#fff"/></g>
<text x="154" y="170" font-size="13" font-weight="bold" text-anchor="middle">金银花(攀援架)</text>
<!-- 枸杞 -->
<g stroke="#4d7a2e" stroke-width="1.2"><circle cx="340" cy="142" r="19" fill="#a8c98a"/><circle cx="398" cy="142" r="19" fill="#a8c98a"/></g>
<g fill="#d0342c"><circle cx="333" cy="136" r="2.5"/><circle cx="346" cy="148" r="2.5"/><circle cx="338" cy="152" r="2.5"/><circle cx="392" cy="138" r="2.5"/><circle cx="405" cy="146" r="2.5"/><circle cx="399" cy="132" r="2.5"/></g>
<text x="369" y="180" font-size="13" font-weight="bold" text-anchor="middle">枸杞 1-2株</text>
<!-- 中间 -->
<text x="165" y="206" font-size="12" fill="#0b5cad" text-anchor="middle">中间: 阳光充足处</text>
<use href="#mum" x="112" y="238"/><use href="#mum" x="166" y="258"/><use href="#mum" x="220" y="238"/>
<text x="166" y="294" font-size="13" font-weight="bold" text-anchor="middle">菊花 2-3株</text>
<use href="#dand" x="292" y="214"/><use href="#dand" x="330" y="228"/><use href="#dand" x="372" y="210"/><use href="#dand" x="408" y="232"/><use href="#dand" x="300" y="256"/><use href="#dand" x="348" y="262"/><use href="#dand" x="392" y="268"/><use href="#dand" x="286" y="282"/>
<text x="356" y="300" font-size="13" font-weight="bold" text-anchor="middle">蒲公英(散种)</text>
<!-- 挡板围起来的 -->
<rect x="30" y="314" width="100" height="84" fill="#e6f0d8" stroke="#444" stroke-width="4"/>
<text x="80" y="334" font-size="13" font-weight="bold" text-anchor="middle">薄荷 约1 m²</text>
<use href="#mint" x="52" y="352"/><use href="#mint" x="80" y="350"/><use href="#mint" x="108" y="354"/><use href="#mint" x="58" y="374"/><use href="#mint" x="88" y="378"/><use href="#mint" x="112" y="380"/>
<text x="230" y="318" font-size="13" font-weight="bold" text-anchor="middle">鱼腥草(大盆)</text>
<circle cx="230" cy="358" r="32" fill="#e6f0d8" stroke="#444" stroke-width="4"/>
<use href="#heart" x="216" y="350"/><use href="#heart" x="238" y="344"/><use href="#heart" x="226" y="368"/><use href="#heart" x="246" y="366"/>
<rect x="330" y="314" width="100" height="84" fill="#e6f0d8" stroke="#444" stroke-width="4"/>
<text x="380" y="334" font-size="13" font-weight="bold" text-anchor="middle">艾草 2-3株</text>
<use href="#mug" x="356" y="362"/><use href="#mug" x="404" y="358"/><use href="#mug" x="380" y="382"/>
<!-- 图例 -->
<circle cx="40" cy="420" r="8" fill="#f5c518" stroke="#333" stroke-width="1.2"/>
<text x="54" y="425" font-size="13">南: 向阳</text>
<path d="M150,420 H180" stroke="#444" stroke-width="4"/>
<text x="188" y="425" font-size="13">挡板: 地下茎乱窜的单独围起来</text>
<text x="28" y="446" font-size="13">+ 生姜、大蒜(蔬菜兼药用)种在蔬菜地里</text>

<!-- ② 挡板 -->
<rect x="462" y="64" width="250" height="208" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="472" y="88" font-size="15" font-weight="bold">② 挡板(剖面)</text>
<text x="472" y="108" font-size="12" fill="#555">薄荷、鱼腥草、艾草的地下茎乱窜</text>
<rect x="474" y="150" width="226" height="74" fill="#efe3cc"/>
<path d="M474,150 H700" stroke="#999" stroke-width="3"/>
<g stroke="#4d7a2e" stroke-width="2"><path d="M566,150 V118 M604,150 V122"/></g>
<use href="#mint" x="566" y="124"/><use href="#mint" x="566" y="138"/><use href="#mint" x="604" y="128"/><use href="#mint" x="604" y="141"/>
<path d="M530,168 H638 M552,168 q6,10 16,12 M610,168 q-4,10 -14,14 M566,150 V168 M604,150 V168" fill="none" stroke="#b8935a" stroke-width="4" stroke-linecap="round"/>
<rect x="518" y="138" width="7" height="72" fill="#8a6a3a" stroke="#333" stroke-width="1"/>
<rect x="642" y="138" width="7" height="72" fill="#8a6a3a" stroke="#333" stroke-width="1"/>
<path d="M664,150 V210 M659,150 H669 M659,210 H669" stroke="#0b5cad" stroke-width="1.5"/>
<text x="676" y="176" font-size="12" fill="#0b5cad">约</text>
<text x="676" y="192" font-size="12" fill="#0b5cad">30</text>
<text x="676" y="207" font-size="12" fill="#0b5cad">cm</text>
<text x="584" y="242" font-size="13" text-anchor="middle">四周埋入约30 cm深的挡板</text>
<text x="584" y="262" font-size="12" fill="#555" text-anchor="middle">也可以种在花盆、无底旧桶里</text>

<!-- ③ 选址 -->
<rect x="462" y="282" width="250" height="172" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="472" y="306" font-size="15" font-weight="bold">③ 选址</text>
<path d="M474,344 L700,394" stroke="#999" stroke-width="2.5"/>
<!-- 坡上药园 -->
<g fill="#6fae4a" stroke="#3d6e22" stroke-width="1"><circle cx="492" cy="342" r="6"/><circle cx="508" cy="345" r="6"/><circle cx="524" cy="349" r="6"/></g>
<text x="508" y="330" font-size="12" font-weight="bold" fill="#0b5cad" text-anchor="middle">药园 ✓</text>
<!-- 厕所 -->
<path d="M584,369 V351 L596,341 L608,351 V374" fill="#e3d6c0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<text x="596" y="334" font-size="12" text-anchor="middle">厕所/畜圈</text>
<path d="M612,376 Q630,384 650,386" fill="none" stroke="#c33" stroke-width="1.5" stroke-dasharray="4 3"/>
<g fill="#6fae4a" stroke="#3d6e22" stroke-width="1"><circle cx="664" cy="384" r="6"/><circle cx="680" cy="388" r="6"/></g>
<path d="M660,374 l24,-14 M660,360 l24,14" stroke="#c33" stroke-width="2.5"/>
<g font-size="13">
<text x="472" y="414"><tspan fill="#0b5cad" font-weight="bold">✓</tspan> 向阳、排水好,离厕所、畜圈远</text>
<text x="472" y="432"><tspan fill="#c33" font-weight="bold">✗</tspan> 不在厕所、畜圈的下坡方向</text>
<text x="472" y="448" font-size="12" fill="#555">(厕所、畜圈离水源至少30 m)</text>
</g>

<!-- ④ 种下以后 -->
<rect x="8" y="464" width="704" height="124" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="488" font-size="15" font-weight="bold">④ 种下以后</text>
<g transform="translate(26,500)"><path d="M6,8 V22" stroke="#8a5a2b" stroke-width="2"/><rect x="0" y="0" width="12" height="9" rx="1" fill="#fff" stroke="#333" stroke-width="1.2"/></g>
<g font-size="13">
<text x="46" y="514"><tspan font-weight="bold">每种插标签:</tspan> 写名称、种植日期——几年后容易记混</text>
<path d="M24,544 Q32,526 40,544 Z" fill="#8a6a3a" stroke="#333" stroke-width="1.2"/>
<text x="46" y="542"><tspan font-weight="bold">施肥:</tspan> 腐熟的堆肥、厩肥,每平方米约2-3 kg,翻入土中;<tspan fill="#c33" font-weight="bold">不要用没有腐熟的粪便</tspan></text>
<text x="30" y="570" font-weight="bold" fill="#c33" text-anchor="middle">✗</text>
<text x="46" y="570"><tspan font-weight="bold">种什么:</tspan> 药食两用、性质温和的;<tspan fill="#c33" font-weight="bold">不种、不留有毒的药用植物</tspan>(乌头、附子、半夏、天南星、商陆、曼陀罗等)</text>
</g>
</g>
</svg>
