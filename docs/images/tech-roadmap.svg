<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780" width="720" height="780" role="img" aria-label="技术重建路线图(技术树),从下往上搭。阶段0 生存: 水、食物、住所、卫生、急救、火;知识捷径: 病菌学说,洗手、煮沸、消毒、隔离,在阶段0就能救人。阶段1 农业与基础手工: 种植养殖、留种、食物保存、木炭、木工、石灰、陶器、制皂、纺织。阶段2 冶金与机械: 铜和青铜、铁、钢,水车、风车、车床、齿轮、标准量具。阶段3 基础化工与材料: 硫酸、碱、玻璃、水泥、纸和印刷、耐火材料。阶段4 动力: 锅炉、蒸汽机、斯特林发动机。阶段5 电力: 发电机、电池、电动机、电报、电灯。阶段6 化工与医药进阶: 电解(氯碱)、化肥、显微镜与微生物学、药物提纯。阶段7 电子: 真空管、半导体、无线电、计算机,从零制造极其困难,现实做法是利用保存下来的器件。正文写明的前提: 炼铁要木炭(大量森林);玻璃要石灰;锅炉要钢板,蒸汽机要精密加工的气缸;发电机要铜线、磁铁;化肥要硫酸;电解要电力;玻璃做透镜和真空管。捷径: 知道电磁感应,不必等蒸汽机,就能用水力、风力发电。阶段之间不是严格的先后关系。现实目标: 先保证生存,再逐步恢复到大约19世纪后期的技术水平;废墟里的钢材、铜线、书籍先利用,再制造" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>技术重建路线图</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#999"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">技术重建路线图(技术树)</text>
<text x="360" y="51" font-size="14" text-anchor="middle" fill="#555">每一项技术都站在别的技术上面: 从下往上,一步一步搭</text>

