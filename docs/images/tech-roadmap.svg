<!-- 图例 -->
<rect x="10" y="638" width="700" height="132" rx="8" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M24,660 H62" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="74" y="665" font-size="13">正文写明的前提(例: 炼铁要木炭,玻璃要石灰,发电机要铜线和磁铁)</text>
<path d="M24,686 H62" stroke="#0b5cad" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arB)"/>
<text x="74" y="691" font-size="13">捷径: 知道电磁感应,不必等蒸汽机,就能用水力、风力发电</text>
<path d="M43,716 V700" stroke="#999" stroke-width="2" marker-end="url(#arG)"/>
<text x="74" y="715" font-size="13">大致顺序;阶段之间不是严格的先后关系,图中只画了主要的依赖</text>
<text x="24" y="740" font-size="13" font-weight="bold">现实目标: 先保证生存,再逐步恢复到大约19世纪后期的技术水平</text>
<text x="24" y="760" font-size="13" fill="#0b5cad">废墟里的钢材、铜线、书籍比自己造的好得多: 先保存和利用,再制造</text>
