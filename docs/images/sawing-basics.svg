<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 796" width="720" height="796" role="img" aria-label="锯木头: 量两次,锯一次;用角尺画直角线,用墨斗或粉线弹长直线;在线的废料一侧锯,因为锯缝本身有宽度。1. 用拇指靠住锯片,轻轻往回拉几下,锯出一条小口;2. 拉开锯口后,用较长的行程、均匀的力往复锯;3. 不要用力往下压,让锯齿自己切削;4. 快锯断时放慢,托住要断的一端,防止木料撕裂。安全: 工件用夹具或台钳夹牢;锯保持锋利,钝的工具要用更大力气,更容易打滑伤人;锯木时戴口罩,有条件时开窗或在室外;不要穿宽松的袖子、戴手套操作电锯等旋转工具;锯片涂油,挂起来防止弯曲" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>锯木头</title>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker><marker id="arR0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#c33"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker><marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker><pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fbe9e9"/><path d="M0 0 V6" stroke="#c33" stroke-width="1.2"/></pattern></defs>
<g fill="#222">
