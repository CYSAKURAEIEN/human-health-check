<text x="20" y="292" font-size="15" font-weight="bold">① 起锯</text>
<text x="20" y="514" font-size="13.5">用拇指靠住锯片,</text>
<text x="20" y="533" font-size="13.5">轻轻往回拉几下,</text>
<text x="20" y="552" font-size="13.5">锯出一条小口</text>
<text x="196" y="292" font-size="15" font-weight="bold">② 往复锯</text>
<text x="196" y="514" font-size="13.5">拉开锯口后,用较长</text>
<text x="196" y="533" font-size="13.5">的行程、均匀的力</text>
<text x="196" y="552" font-size="13.5">往复锯</text>
<text x="372" y="292" font-size="15" font-weight="bold">③ 不要往下压</text>
