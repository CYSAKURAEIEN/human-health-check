<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1450" width="720" height="1450" role="img" aria-label="桥: ①简支梁木桥,两岸各做一个桥台,桥台用石块砌或木框里填石头,深埋到坚实的土层,上面搁木梁,梁上铺横板,板间留缝,两侧加护栏,梁的两端搁在石头上不要埋进土里;跨度加倍弯矩加倍,均匀荷载时变成4倍;木梁立着放比平放结实;直径约30 cm的松木梁两根并排、跨度约5 m,过一辆装满货的板车有余量;跨度超过约6-8 m中间加桥墩或改用桁架。②石拱桥,先建厚重的桥台,搭木拱架,从两边同时往上砌楔形石块,最后放拱顶石,两肩填石填土,灰浆硬化后慢慢拆拱架;拱会向两侧推。③索桥,主缆两端锚在大树根部、巨石或深埋的横木上,垂度约为跨度的1/10,两侧加扶手缆并连成网。④检验: 先目测,再在桥中间堆重物试验,先空车再半载再满载,一次只过一辆车;洪水期不要过桥" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>桥: 梁桥、拱桥、索桥和检验</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="dimB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 Z" fill="#0b5cad"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<pattern id="plank" x="180" y="166" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="7" height="6" fill="#b8955a"/></pattern>
<g id="abut"><rect width="40" height="80" fill="#d8d8d8" stroke="#333" stroke-width="2"/><path d="M0,20 H40 M0,40 H40 M0,60 H40 M20,0 V20 M10,20 V40 M30,20 V40 M20,40 V60 M10,60 V80 M30,60 V80" stroke="#888" stroke-width="1"/></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">桥: 梁桥、拱桥、索桥和检验(示意,不按比例)</text>

<!-- ① 简支梁木桥 -->
<rect x="10" y="44" width="700" height="404" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① 简支梁木桥: 两岸各做一个桥台,上面搁木梁,梁上铺横板</text>
<path d="M11.5,210 L216,210 L252,286 L468,286 L504,210 L708.5,210 V300 H11.5 Z" fill="#e8e8e8"/>
<path d="M11.5,210 L216,210 L252,286 L468,286 L504,210 L708.5,210" fill="none" stroke="#999" stroke-width="3"/>
<path d="M233,246 L487,246 L468,286 L252,286 Z" fill="#d6e8f5"/>
<path d="M233,246 H487" stroke="#7fb6e0" stroke-width="2"/>
<use href="#abut" x="176" y="192"/><use href="#abut" x="504" y="192"/>
<rect x="182" y="184" width="28" height="8" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<rect x="510" y="184" width="28" height="8" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<rect x="180" y="172" width="360" height="12" rx="6" fill="#d9c29a" stroke="#333" stroke-width="2"/>
<rect x="180" y="166" width="360" height="6" fill="url(#plank)"/>
<path d="M190,134 V166 M260,134 V166 M330,134 V166 M400,134 V166 M470,134 V166 M530,134 V166 M186,134 H534 M186,150 H534" stroke="#8f6d2e" stroke-width="3"/>
<line x1="218" y1="228" x2="502" y2="228" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<text x="360" y="222" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">跨度</text>
<text x="360" y="202" font-size="13" text-anchor="middle">木梁</text>
<g stroke="#555" stroke-width="1"><path d="M98,142 H186"/><path d="M140,236 H176"/><path d="M558,120 L522,167"/><path d="M554,228 L538,191"/></g>
<text x="24" y="147" font-size="14">两侧加护栏</text>
<g font-size="13"><text x="20" y="228">桥台: 石块砌或</text><text x="20" y="245">木框里填石头,</text><text x="20" y="262">深埋到坚实的土层,</text><text x="20" y="279">防止被洪水掏空</text>
<text x="560" y="106">桥面横板之间留缝,</text><text x="560" y="124">让雨水漏下去</text>
<text x="556" y="232">梁两端搁在石头上,</text><text x="556" y="249">不要直接埋进土里</text><text x="556" y="266" fill="#555">(两端最先腐烂)</text></g>
<!-- 横断面 -->
<path d="M54,316 V343 M170,316 V343" stroke="#8f6d2e" stroke-width="3"/>
<rect x="50" y="343" width="124" height="6" fill="#b8955a"/>
<circle cx="78" cy="366" r="17" fill="#d9c29a" stroke="#333" stroke-width="2"/>
<circle cx="146" cy="366" r="17" fill="#d9c29a" stroke="#333" stroke-width="2"/>
<circle cx="78" cy="366" r="6" fill="none" stroke="#8f6d2e" stroke-width="1"/><circle cx="146" cy="366" r="6" fill="none" stroke="#8f6d2e" stroke-width="1"/>
<line x1="62" y1="394" x2="94" y2="394" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#dimB)" marker-end="url(#dimB)"/>
<path d="M61,370 V398 M95,370 V398" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<text x="104" y="399" font-size="13" fill="#0b5cad">直径约30 cm</text>
<text x="112" y="424" font-size="13" text-anchor="middle">横断面: 两根圆木梁并排</text>
<!-- 立放/平放 -->
<path d="M222,370 H336" stroke="#999" stroke-width="2"/>
<rect x="234" y="334" width="18" height="36" fill="#d9c29a" stroke="#333" stroke-width="2"/>
<rect x="290" y="352" width="36" height="18" fill="#d9c29a" stroke="#333" stroke-width="2"/>
<text x="243" y="390" font-size="13" text-anchor="middle" font-weight="bold">立着放 ✓</text>
<text x="308" y="390" font-size="13" text-anchor="middle" fill="#555">平放</text>
<text x="278" y="410" font-size="13" text-anchor="middle">高大于宽: 立着放</text>
<text x="278" y="426" font-size="13" text-anchor="middle">比平放结实得多</text>
<g font-size="14">
<text x="356" y="326">• 跨度越大,梁要越粗: 同样的荷载,跨度加倍,</text>
<text x="370" y="345">中间受的弯矩加倍(均匀荷载时变成4倍)</text>
<text x="356" y="370">• 例: 直径约30 cm的松木梁两根并排,跨度约5 m,</text>
<text x="370" y="389">过一辆装满货的板车有余量(木头会腐朽、</text>
<text x="370" y="408">有节疤,实际要留足余量)</text>
<text x="356" y="433" font-weight="bold">• 跨度超过约6-8 m: 中间加桥墩,或改用桁架</text>
</g>

<!-- ② 石拱桥 -->
<g transform="translate(0,16)">
<rect x="10" y="444" width="700" height="332" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="470" font-size="16" font-weight="bold">② 石拱桥: 拱把重量变成压力传到两端</text>
<rect x="11.5" y="508" width="28.5" height="192" fill="#e8e8e8"/><rect x="424" y="508" width="16" height="192" fill="#e8e8e8"/>
<rect x="11.5" y="700" width="428.5" height="22" fill="#e2ddd3"/>
<path d="M11.5,700 H440" stroke="#999" stroke-width="2"/>
<text x="232" y="716" font-size="13" fill="#555" text-anchor="middle">坚实的地基或岩石</text>
<path d="M40,508 H424 V640 H360 A128,128 0 0 0 104,640 H40 Z" fill="#f1ead9" stroke="#333" stroke-width="2"/>
<rect x="11.5" y="500" width="428.5" height="8" fill="#cfcfcf" stroke="#333" stroke-width="1.5"/>
<rect x="40" y="640" width="92" height="60" fill="#d8d8d8" stroke="#333" stroke-width="2"/>
<rect x="332" y="640" width="92" height="60" fill="#d8d8d8" stroke="#333" stroke-width="2"/>
<path d="M132,672 H332 V700 H132 Z" fill="#d6e8f5"/>
<path d="M132,672 H332" stroke="#7fb6e0" stroke-width="2"/>
<g fill="#e3e0da" stroke="#333" stroke-width="1.5">
<path d="M104.0,640.0 A128,128 0 0 1 109.2,603.9 L136.1,611.8 A100,100 0 0 0 132.0,640.0 Z"/>
