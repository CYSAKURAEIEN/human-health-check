<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-label="中风120口诀: 1 看一张脸,让患者微笑,一侧嘴角下垂、脸不对称;2 查两只手臂,让患者闭眼、双臂平举10秒,一侧无力下垂;0 聆(零)听语言,让患者重复一句简单的话,吐字不清、说不出、听不懂;出现任何一项立即拨打120,记下发病时间(或最后一次看到患者正常的时间);症状几分钟后自行消失也要立即就医。等待救护车时: 让患者躺下,头和肩部稍垫高;呕吐或意识不清放成侧卧位;松开衣领、腰带;准备好用药清单。不要给阿司匹林或任何药物,不要喂水喂食,不要掐人中、放血,不要等看看会不会好转,不要自行开车送医">
<rect width="100%" height="100%" fill="#fff"/>
<title>识别中风: "中风120"口诀</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">识别中风: "中风120"口诀</text>

<!-- 1 看一张脸 -->
<g transform="translate(10,44)">
<rect x="0" y="0" width="226" height="262" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<circle cx="30" cy="28" r="17" fill="#c33"/>
<text x="30" y="35" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="56" y="34" font-size="17" font-weight="bold">看一张脸</text>
<circle cx="113" cy="122" r="56" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M58,112 Q60,62 113,62 Q166,62 168,112 Q150,84 113,82 Q76,84 58,112 Z" fill="#555"/>
<path d="M86,112 Q93,106 100,112 M126,112 Q133,106 140,112" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round"/>
<path d="M113,118 L109,136 L116,137" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="74" y1="149" x2="152" y2="149" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 3"/>
<path d="M86,149 Q98,162 113,159 Q128,158 138,166" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
<path d="M146,150 L146,162" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="160" y="190" font-size="13" fill="#c33" text-anchor="middle">嘴角下垂</text>
<text x="16" y="222">让患者微笑:</text>
<text x="16" y="244">一侧嘴角下垂、脸不对称?</text>
</g>

<!-- 2 查两只手臂 -->
<g transform="translate(247,44)">
<rect x="0" y="0" width="226" height="262" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<circle cx="30" cy="28" r="17" fill="#c33"/>
<text x="30" y="35" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="56" y="34" font-size="17" font-weight="bold">查两只手臂</text>
<!-- 远侧手臂: 平举 -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M70,128 L176,126" stroke="#333" stroke-width="15"/><path d="M70,128 L176,126" stroke="#f3e3d3" stroke-width="10"/>
</g>
<ellipse cx="184" cy="126" rx="9" ry="6" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<!-- 躯干 -->
<path d="M44,196 L46,138 Q48,120 66,118 L80,118 Q96,120 98,138 L100,196 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<!-- 头(侧面朝右) -->
<rect x="64" y="104" width="16" height="16" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<circle cx="72" cy="86" r="22" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M50,90 Q46,62 72,62 Q92,62 94,76 Q78,70 62,78 Q56,82 56,94 Z" fill="#555"/>
<path d="M93,84 L99,94 L93,96" fill="#f3e3d3" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M80,84 Q85,88 90,84" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
<!-- 近侧手臂: 下垂 -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M74,132 L168,170" stroke="#333" stroke-width="15"/><path d="M74,132 L168,170" stroke="#f3e3d3" stroke-width="10"/>
</g>
<ellipse cx="175" cy="173" rx="9" ry="6" transform="rotate(22 175 173)" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M200,128 Q212,150 194,168" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="104" y1="64" x2="88" y2="80" stroke="#0b5cad" stroke-width="1"/>
<text x="106" y="64" font-size="13" fill="#0b5cad">闭眼</text>
<text x="118" y="112" font-size="13" fill="#0b5cad">平举10秒</text>
<text x="112" y="198" font-size="13" fill="#c33">一侧无力下垂</text>
<text x="16" y="222">让患者闭眼、双臂平举10秒:</text>
<text x="16" y="244">一侧无力下垂?</text>
</g>

<!-- 0 聆听语言 -->
<g transform="translate(484,44)">
<rect x="0" y="0" width="226" height="262" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<circle cx="30" cy="28" r="17" fill="#c33"/>
<text x="30" y="35" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">0</text>
<text x="56" y="34" font-size="17" font-weight="bold">聆(零)听语言</text>
<path d="M28,196 L30,160 Q32,142 50,140 L64,140 Q80,142 82,160 L84,196 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="48" y="126" width="16" height="16" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<circle cx="56" cy="108" r="22" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M34,112 Q30,84 56,84 Q76,84 78,98 Q62,92 46,100 Q40,104 40,116 Z" fill="#555"/>
<path d="M77,106 L83,116 L77,118" fill="#f3e3d3" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<circle cx="68" cy="104" r="2.2" fill="#333"/>
<path d="M70,124 Q74,122 77,125" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
<!-- 话泡 -->
<path d="M100,58 L204,58 Q214,58 214,68 L214,124 Q214,134 204,134 L116,134 L92,124 L104,124 Q100,122 100,114 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M112,84 q6,-8 12,0 t12,0 t12,0 t12,0 M112,106 q6,-8 12,0 t12,0 t12,0" fill="none" stroke="#777" stroke-width="2.2" stroke-linecap="round"/>
<text x="176" y="114" font-size="30" font-weight="bold" fill="#c33">?</text>
<text x="16" y="222">让患者重复一句简单的话:</text>
<text x="16" y="244">吐字不清、说不出、听不懂?</text>
</g>

<!-- 拨打120 -->
<g transform="translate(10,316)">
<rect x="0" y="0" width="700" height="110" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<rect x="22" y="22" width="38" height="64" rx="7" fill="#fff" stroke="#c33" stroke-width="2.5"/>
<rect x="28" y="32" width="26" height="38" fill="#f6cccc"/>
<circle cx="41" cy="78" r="3" fill="#c33"/>
<text x="78" y="38" font-size="19" font-weight="bold" fill="#c33">出现任何一项 → 立即拨打120</text>
<text x="78" y="60" font-size="14"><tspan font-weight="bold">记下发病时间</tspan>(或最后一次看到患者正常的时间;早上醒来才发现的,</text>
<text x="78" y="79" font-size="14">以前一晚入睡时间计),这是医生决定能否溶栓的关键(一般需在发病4.5小时内)</text>
<text x="78" y="100" font-size="14">症状几分钟后自行消失了,同样是急症,也要立即就医</text>
</g>

<!-- 等待救护车时 -->
<g transform="translate(10,436)">
<rect x="0" y="0" width="345" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold" fill="#0b5cad">✓ 等待救护车时</text>
<line x1="20" y1="104" x2="325" y2="104" stroke="#999" stroke-width="3"/>
<!-- 枕垫 -->
<path d="M26,104 L26,74 Q26,68 34,68 L122,90 Q128,92 128,98 L128,104 Z" fill="#e8e8e8" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<!-- 腿 -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M164,90 L300,94" stroke="#333" stroke-width="20"/><path d="M164,90 L300,94" stroke="#cfe0f0" stroke-width="15"/>
</g>
<!-- 躯干,头肩稍高 -->
<path d="M72,60 L166,80 Q174,82 172,92 L170,100 L70,82 Q62,80 64,70 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="56" y="58" width="14" height="14" transform="rotate(14 63 65)" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<circle cx="48" cy="54" r="17" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M32,58 Q28,38 48,37 Q38,44 37,60 Z" fill="#555"/>
<line x1="124" y1="50" x2="100" y2="70" stroke="#0b5cad" stroke-width="1"/>
<text x="124" y="50" font-size="13" fill="#0b5cad">头和肩部稍垫高</text>
<text x="16" y="136">· 让患者躺下,头和肩部稍垫高</text>
<text x="16" y="160">· 呕吐或意识不清 → 侧卧位(防误吸)</text>
<text x="16" y="184">· 松开衣领、腰带</text>
<text x="16" y="208">· 准备好患者的用药清单</text>
</g>

<!-- 不要做 -->
<g transform="translate(365,436)">
<rect x="0" y="0" width="345" height="240" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="16" y="28" font-size="17" font-weight="bold" fill="#c33">✗ 不要做</text>
<text x="16" y="60"><tspan fill="#c33" font-weight="bold">✗</tspan> 不要给阿司匹林或任何药物</text>
<text x="34" y="80" font-size="13" fill="#555">现场分不清缺血性还是出血性</text>
<text x="16" y="108"><tspan fill="#c33" font-weight="bold">✗</tspan> 不要喂水、喂食</text>
<text x="34" y="128" font-size="13" fill="#555">常伴吞咽困难,易呛入气管</text>
<text x="16" y="156"><tspan fill="#c33" font-weight="bold">✗</tspan> 不要掐人中、扎手指放血</text>
<text x="16" y="184"><tspan fill="#c33" font-weight="bold">✗</tspan> 不要等"看看会不会好转"</text>
<text x="16" y="212"><tspan fill="#c33" font-weight="bold">✗</tspan> 不要自行开车送医</text>
<text x="34" y="230" font-size="13" fill="#555">除非确实无法叫到救护车</text>
</g>
</g>
</svg>
