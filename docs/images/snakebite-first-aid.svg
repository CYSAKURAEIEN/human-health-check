<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 750" width="720" height="750" role="img" aria-label="毒蛇咬伤急救: 无法确定是否有毒时一律按毒蛇咬伤处理,三角形头部不是可靠标准。要做: ①立即远离蛇;②保持冷静,减少活动;③移除戒指、手表等饰物;④伤肢用夹板制动,保持与心脏大致同一水平;⑤拍照记住蛇的特征,不要抓蛇;⑥立即就医,拨打120,问清哪家医院有抗蛇毒血清。不要: 切开伤口、吸吮毒液、冰敷、喝酒、奔跑、使用止血带或绳子扎紧" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>毒蛇咬伤急救</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<!-- 禁止标志 -->
<g id="no"><circle r="34" fill="none" stroke="#c33" stroke-width="3.5" opacity="0.85"/><line x1="-24" y1="-24" x2="24" y2="24" stroke="#c33" stroke-width="3.5" opacity="0.85"/></g>
</defs>
<text x="360" y="28" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">毒蛇咬伤急救</text>
<text x="360" y="50" font-size="15" fill="#c33" text-anchor="middle" font-weight="bold">无法确定是否有毒时,一律按毒蛇咬伤处理!</text>
<text x="360" y="70" font-size="13" fill="#222" text-anchor="middle">靠外形判断不可靠: "三角形头部"不是可靠标准,银环蛇、金环蛇、眼镜蛇等剧毒蛇头部呈椭圆形</text>

<text x="14" y="98" font-size="16" fill="#0b5cad" font-weight="bold">✓ 要做</text>

<!-- ① 远离蛇 -->
<rect x="8" y="106" width="228" height="158" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<line x1="20" y1="208" x2="224" y2="208" stroke="#999" stroke-width="2"/>
<path d="M30 200 q10 -12 20 0 t20 0 t20 0" fill="none" stroke="#6a7a3a" stroke-width="6" stroke-linecap="round"/>
<ellipse cx="96" cy="196" rx="9" ry="6" fill="#6a7a3a"/>
<path d="M104 196 l7 -2 m-7 2 l7 2" stroke="#c33" stroke-width="1.3"/>
<line x1="118" y1="176" x2="158" y2="176" stroke="#c33" stroke-width="3" marker-end="url(#ar)"/>
<circle cx="190" cy="136" r="10" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<rect x="179" y="148" width="22" height="34" rx="7" fill="#cfe0f0" stroke="#333" stroke-width="2.2"/>
<path d="M184 182 L180 206 M196 182 L200 206" stroke="#333" stroke-width="4" stroke-linecap="round"/>
<text x="22" y="236" font-size="15" fill="#222" font-weight="bold">① 立即远离蛇</text>

<!-- ② 冷静、少动 -->
<rect x="246" y="106" width="228" height="158" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<line x1="256" y1="208" x2="464" y2="208" stroke="#999" stroke-width="2"/>
<circle cx="278" cy="190" r="11" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<rect x="290" y="179" width="84" height="26" rx="10" fill="#cfe0f0" stroke="#333" stroke-width="2.2"/>
<rect x="372" y="183" width="70" height="20" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="2.2"/>
<rect x="440" y="178" width="10" height="25" rx="4" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<text x="260" y="236" font-size="15" fill="#222" font-weight="bold">② 保持冷静,减少活动</text>
<text x="260" y="255" font-size="13" fill="#222">尽量不要自己走,用担架、背、车送</text>

<!-- ③ 移除饰物 -->
<rect x="484" y="106" width="228" height="158" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="527" y="184" width="34" height="34" fill="#f3e3d3"/>
<line x1="527" y1="184" x2="527" y2="218" stroke="#333" stroke-width="2.2"/>
<line x1="561" y1="184" x2="561" y2="218" stroke="#333" stroke-width="2.2"/>
<g fill="#f3e3d3" stroke="#333" stroke-width="2">
<rect x="523" y="120" width="9.5" height="38" rx="4.7"/><rect x="533.5" y="114" width="9.5" height="44" rx="4.7"/><rect x="544" y="116" width="9.5" height="42" rx="4.7"/><rect x="554.5" y="124" width="9.5" height="34" rx="4.7"/>
<rect x="-5" y="-26" width="10" height="28" rx="5" transform="translate(522 170) rotate(-35)"/>
<path d="M522 150 L564 150 Q568 172 562 188 L526 188 Q518 172 522 150 Z" stroke-linejoin="round"/>
</g>
<!-- 戒指、手表(已摘下) -->
<rect x="532.5" y="136" width="11.5" height="5" rx="2" fill="#fff" stroke="#999" stroke-width="1.3" stroke-dasharray="2 2"/>
<rect x="525" y="196" width="38" height="12" rx="3" fill="#fff" stroke="#999" stroke-width="1.3" stroke-dasharray="3 2"/>
<line x1="572" y1="138" x2="616" y2="132" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="572" y1="202" x2="616" y2="196" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<ellipse cx="640" cy="130" rx="11" ry="7" fill="none" stroke="#c9a227" stroke-width="4"/>
<text x="658" y="135" font-size="13" fill="#222">戒指</text>
<rect x="622" y="190" width="40" height="10" rx="3" fill="#999"/>
<circle cx="642" cy="195" r="9" fill="#fff" stroke="#333" stroke-width="2"/>
<text x="668" y="200" font-size="13" fill="#222">手表</text>
<text x="498" y="236" font-size="15" fill="#222" font-weight="bold">③ 移除戒指、手表等饰物</text>
<text x="498" y="255" font-size="13" fill="#222">防止肿胀后嵌顿</text>

<!-- ④ 制动、与心脏同高 -->
<rect x="8" y="272" width="228" height="158" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<line x1="20" y1="372" x2="224" y2="372" stroke="#999" stroke-width="2"/>
<circle cx="34" cy="352" r="11" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<rect x="46" y="340" width="82" height="26" rx="10" fill="#cfe0f0" stroke="#333" stroke-width="2.2"/>
<rect x="126" y="344" width="44" height="20" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="2.2"/>
<rect x="166" y="345" width="44" height="17" rx="7" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<rect x="206" y="333" width="10" height="29" rx="4" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="160" y="362" width="56" height="7" rx="2" fill="#c9a26b" stroke="#333" stroke-width="1.5"/>
<rect x="170" y="343" width="7" height="27" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
<rect x="199" y="343" width="7" height="27" rx="2" fill="#fff" stroke="#333" stroke-width="1.5"/>
<circle cx="185" cy="352" r="2.2" fill="#c33"/><circle cx="191" cy="352" r="2.2" fill="#c33"/>
<path d="M78 350 c-4 -6 -11 -2 -7 4 l7 7 l7 -7 c4 -6 -3 -10 -7 -4 Z" fill="#c33"/>
<line x1="56" y1="354" x2="226" y2="354" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="130" y="334" font-size="13" fill="#0b5cad" text-anchor="middle">心脏和伤肢大致同一水平</text>
<text x="190" y="390" font-size="12" fill="#666" text-anchor="middle">夹板</text>
<text x="22" y="404" font-size="15" fill="#222" font-weight="bold">④ 伤肢制动(夹板固定),</text>
<text x="22" y="423" font-size="15" fill="#222" font-weight="bold">保持与心脏大致同一水平</text>

<!-- ⑤ 拍照 -->
<rect x="246" y="272" width="228" height="158" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="300" y="282" width="58" height="96" rx="9" fill="#fff" stroke="#333" stroke-width="2.5"/>
<rect x="306" y="292" width="46" height="72" rx="2" fill="#eef4fa" stroke="#333" stroke-width="1.2"/>
<path d="M312 344 q6 -8 12 0 t12 0" fill="none" stroke="#6a7a3a" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="341" cy="338" rx="6" ry="4" fill="#6a7a3a"/>
<circle cx="329" cy="371" r="3" fill="none" stroke="#333" stroke-width="1.2"/>
<text x="374" y="316" font-size="13" fill="#222">拍照即可,</text>
<text x="374" y="334" font-size="13" fill="#c33">不要抓蛇、</text>
<text x="374" y="352" font-size="13" fill="#c33">不要追打蛇</text>
<text x="260" y="404" font-size="15" fill="#222" font-weight="bold">⑤ 记住蛇的特征</text>
<text x="260" y="423" font-size="13" fill="#222">刚打死的蛇头仍可能咬人</text>

<!-- ⑥ 就医 -->
<rect x="484" y="272" width="228" height="158" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="506" y="290" width="44" height="76" rx="8" fill="#fff" stroke="#333" stroke-width="2.5"/>
<text x="528" y="334" font-size="15" fill="#c33" text-anchor="middle" font-weight="bold">120</text>
<path d="M590 372 L590 312 L640 296 L690 312 L690 372 Z" fill="#fff" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="630" y="314" width="20" height="20" fill="#fff"/>
<path d="M636 314 h8 v6 h6 v8 h-6 v6 h-8 v-6 h-6 v-8 h6 Z" fill="#c33"/>
<rect x="630" y="348" width="20" height="24" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<line x1="580" y1="372" x2="700" y2="372" stroke="#999" stroke-width="2"/>
<line x1="556" y1="330" x2="582" y2="330" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="498" y="404" font-size="15" fill="#222" font-weight="bold">⑥ 立即就医: 拨打120,</text>
<text x="498" y="423" font-size="13" fill="#222">问清哪家医院有抗蛇毒血清</text>

<!-- 不要 -->
<text x="14" y="458" font-size="16" fill="#c33" font-weight="bold">✗ 不要</text>
<g>
<rect x="8" y="466" width="112" height="128" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M36 528 L78 494 Q86 490 84 498 L50 538 Z" fill="#e8e8e8" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<rect x="-5" y="0" width="10" height="24" rx="3" fill="#c9a26b" stroke="#333" stroke-width="2" transform="translate(43 533) rotate(50)"/>
<use href="#no" transform="translate(64 514)"/>
<text x="64" y="568" font-size="14" fill="#222" text-anchor="middle">切开伤口</text>
<text x="64" y="585" font-size="12" fill="#666" text-anchor="middle">(刀割放血)</text>
</g>
<g>
<rect x="126" y="466" width="112" height="128" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M156 514 Q170 498 182 508 Q194 498 208 514 Q194 532 182 530 Q170 532 156 514 Z" fill="#e7a0a0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M156 514 Q182 520 208 514" fill="none" stroke="#333" stroke-width="1.5"/>
<use href="#no" transform="translate(182 514)"/>
<text x="182" y="568" font-size="14" fill="#222" text-anchor="middle">吸吮毒液</text>
<text x="182" y="585" font-size="12" fill="#666" text-anchor="middle">(用嘴吸)</text>
</g>
<g>
<rect x="244" y="466" width="112" height="128" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="270" y="502" width="26" height="26" rx="4" fill="#dcecf8" stroke="#333" stroke-width="2"/>
<rect x="296" y="496" width="30" height="30" rx="4" fill="#dcecf8" stroke="#333" stroke-width="2" transform="rotate(12 311 511)"/>
<path d="M275 508 l6 0 M302 502 l6 0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<use href="#no" transform="translate(300 514)"/>
<text x="300" y="568" font-size="14" fill="#222" text-anchor="middle">冰敷</text>
<text x="300" y="585" font-size="12" fill="#666" text-anchor="middle">(冰水泡)</text>
</g>
<g>
<rect x="362" y="466" width="112" height="128" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M404 490 h10 v10 q10 6 10 18 v20 h-30 v-20 q0 -12 10 -18 Z" fill="#cfe0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<rect x="398" y="514" width="22" height="12" fill="#fff" stroke="#333" stroke-width="1.2"/>
<text x="409" y="524" font-size="9" fill="#c33" text-anchor="middle">酒</text>
<path d="M428 520 h14 l-2 18 h-10 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<use href="#no" transform="translate(418 514)"/>
<text x="418" y="568" font-size="14" fill="#222" text-anchor="middle">喝酒</text>
</g>
<g>
<rect x="480" y="466" width="112" height="128" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<circle cx="542" cy="490" r="8" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M538 499 L530 520" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<path d="M530 520 L544 530 L540 544 M530 520 L516 530 L506 528" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M536 504 L550 514 L560 508 M536 504 L522 508 L516 518" fill="none" stroke="#333" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<use href="#no" transform="translate(536 514)"/>
<text x="536" y="568" font-size="14" fill="#222" text-anchor="middle">奔跑</text>
</g>
<g>
<rect x="598" y="466" width="112" height="128" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="616" y="502" width="76" height="24" rx="11" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M648 500 Q652 514 648 528 M656 500 Q660 514 656 528" fill="none" stroke="#8a6a3a" stroke-width="3.5"/>
<path d="M652 528 l-6 10 m6 -10 l6 10" stroke="#8a6a3a" stroke-width="2.5" stroke-linecap="round"/>
<use href="#no" transform="translate(654 514)"/>
<text x="654" y="568" font-size="14" fill="#222" text-anchor="middle">使用止血带</text>
<text x="654" y="585" font-size="12" fill="#666" text-anchor="middle">(绳子、橡皮筋也不行)</text>
</g>

<!-- 送医途中 -->
<text x="14" y="624" font-size="15" fill="#222" font-weight="bold">送医途中:</text>
<text x="22" y="646" font-size="14" fill="#222">● 记下被咬的时间;用笔在肿胀边缘画线、写上时间,每15-30分钟画一次</text>
<text x="22" y="668" font-size="14" fill="#222">● 呕吐时侧卧;呼吸越来越弱、停止 → 立即人工呼吸/CPR,坚持到医院</text>
<text x="22" y="690" font-size="14" fill="#222">● 加压包扎只用于确认或高度怀疑为神经毒蛇(银环蛇、金环蛇等)咬伤;</text>
<text x="36" y="708" font-size="14" fill="#c33">血液/细胞毒蛇,或蛇种不明且局部肿痛明显时不要加压包扎</text>
<text x="22" y="732" font-size="14" fill="#222">● 被咬后暂时没有症状也要到医院观察(通常至少24小时)</text>
</svg>
