<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-label="兔笼和产仔箱示意: 成兔笼60×50×40 cm,母兔笼70×60×40 cm(长×宽×高),需放产仔箱;笼子离地30-50 cm,笼下设粪沟或接粪板,倾斜便于清扫,粪尿每天清。底网用竹片或镀锌铁丝网,竹片宽约2-2.5 cm、间隙约1-1.2 cm,缝太宽兔脚会卡住骨折,铁丝太细会磨出脚皮炎,笼里放一块木板歇脚。产仔箱约40 × 25 × 20 cm,顶部开活盖,前面出入口离箱底约10 cm,箱底钻几个小孔防潮,配种后约27-28天放进铺好干草的产仔箱。兔笼放在室内或有遮蔽处,通风良好,避免阳光直射;兔最适约15-25°C,超过约30°C容易中暑死亡" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>兔笼和产仔箱</title>
<defs>
<pattern id="grid" width="9" height="9" patternUnits="userSpaceOnUse"><path d="M0 0 H9 M0 0 V9" stroke="#888" stroke-width="0.8"/></pattern>
<pattern id="straw" width="10" height="8" patternUnits="userSpaceOnUse"><rect width="10" height="8" fill="#f1dc9a"/><path d="M0 6 L6 2 M5 7 L10 4" stroke="#c9a94e" stroke-width="1"/></pattern>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker>
<g id="rabbit"><ellipse cx="8" cy="-28" rx="4" ry="12" transform="rotate(-15 8 -28)" fill="#e2d9cf" stroke="#333" stroke-width="1.5"/><ellipse cx="15" cy="-27" rx="4" ry="12" transform="rotate(12 15 -27)" fill="#e2d9cf" stroke="#333" stroke-width="1.5"/><circle cx="-25" cy="-4" r="4.5" fill="#fff" stroke="#333" stroke-width="1.2"/><ellipse cx="-6" cy="0" rx="20" ry="13" fill="#e2d9cf" stroke="#333" stroke-width="1.6"/><ellipse cx="12" cy="-10" rx="9" ry="8" fill="#e2d9cf" stroke="#333" stroke-width="1.6"/><circle cx="15" cy="-12" r="1.3" fill="#222"/><ellipse cx="4" cy="12" rx="9" ry="3" fill="#e2d9cf" stroke="#333" stroke-width="1.2"/></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">兔笼和产仔箱(示意,不按比例)</text>

<!-- ① 母兔笼 -->
<rect x="10" y="44" width="440" height="486" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="68" font-size="16" font-weight="bold">① 母兔笼(放产仔箱)</text>
<!-- 地面 -->
<path d="M90 450 H300 L370 394 H160 Z" fill="#eee"/>
<path d="M30 450 H300 L370 394 H430" fill="none" stroke="#999" stroke-width="2"/>
<!-- 接粪板 -->
<path d="M90 414 L300 434 L370 384 L160 366 Z" fill="#cfcfcf" stroke="#333" stroke-width="1.5"/>
<!-- 后面的边 -->
<path d="M160 144 V264 H370 M160 264 L90 320" fill="none" stroke="#999" stroke-width="1.5"/>
<!-- 底网 -->
<path d="M90 320 H300 L370 264 H160 Z" fill="#f4ead6"/>
<g stroke="#b89a5e" stroke-width="2">
<path d="M104 320 L174 264 M118 320 L188 264 M132 320 L202 264 M146 320 L216 264 M160 320 L230 264 M174 320 L244 264 M188 320 L258 264 M202 320 L272 264 M216 320 L286 264 M230 320 L300 264 M244 320 L314 264 M258 320 L328 264 M272 320 L342 264 M286 320 L356 264"/>
</g>
<!-- 产仔箱 -->
<path d="M104 254 L133 231 H253 L224 254 Z" fill="#e6d2b0" stroke="#333" stroke-width="1.5"/>
<path d="M224 254 L253 231 V291 L224 314 Z" fill="#d4bc93" stroke="#333" stroke-width="1.5"/>
<rect x="104" y="254" width="120" height="60" fill="#e6d2b0" stroke="#333" stroke-width="1.5"/>
<path d="M184 284 V270 Q184 262 194 262 H206 Q216 262 216 270 V284 Z" fill="url(#straw)" stroke="#333" stroke-width="1.5"/>
<!-- 兔 -->
<use href="#rabbit" transform="translate(296,296)"/>
<!-- 前面、右侧网 -->
<path d="M300 200 L370 144 V264 L300 320 Z" fill="url(#grid)" fill-opacity="0.5" stroke="#333" stroke-width="2"/>
<rect x="90" y="200" width="210" height="120" fill="url(#grid)" fill-opacity="0.35" stroke="#333" stroke-width="2.5"/>
<path d="M90 200 L160 144 H370 L300 200" fill="url(#grid)" fill-opacity="0.35" stroke="#333" stroke-width="2"/>
<!-- 腿 -->
<path d="M90 320 V450 M300 320 V450 M370 264 V394" stroke="#8b6b3e" stroke-width="5"/>
<!-- 尺寸 -->
<path d="M78 202 V318" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="20" y="256" font-size="14" fill="#0b5cad">高</text>
<text x="20" y="274" font-size="14" fill="#0b5cad">40 cm</text>
<path d="M78 324 V448" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="20" y="378" font-size="14" fill="#0b5cad">离地</text>
<text x="14" y="396" font-size="13" fill="#0b5cad">30-50 cm</text>
<path d="M92 336 H298" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="195" y="352" font-size="14" fill="#0b5cad" text-anchor="middle">长70 cm</text>
<path d="M312 326 L380 271" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="384" y="304" font-size="14" fill="#0b5cad">宽60 cm</text>
<!-- 标注 -->
<text x="196" y="102" font-size="14" font-weight="bold">产仔箱</text>
<line x1="210" y1="108" x2="170" y2="240" stroke="#0b5cad" stroke-width="1.3"/><circle cx="170" cy="240" r="2.6" fill="#0b5cad"/>
<text x="270" y="102" font-size="13">铁丝网或木笼</text>
<line x1="300" y1="108" x2="320" y2="170" stroke="#0b5cad" stroke-width="1.3"/><circle cx="320" cy="170" r="2.6" fill="#0b5cad"/>
<text x="384" y="226" font-size="13">底网</text>
<line x1="390" y1="232" x2="350" y2="270" stroke="#0b5cad" stroke-width="1.3"/><circle cx="350" cy="270" r="2.6" fill="#0b5cad"/>
<text x="138" y="400" font-size="13">接粪板(倾斜,便于清扫)</text>
<path d="M170 410 L286 421" stroke="#0b5cad" stroke-width="1.6" marker-end="url(#arB)"/>
<g font-size="13">
<text x="24" y="478">成兔笼 60×50×40 cm(长×宽×高)</text>
<text x="24" y="497">母兔笼 70×60×40 cm(需产仔箱)</text>
<text x="24" y="516" fill="#555">粪沟或接粪板上的粪尿每天清(尿里有大量氨)</text>
</g>

<!-- ② 底网 -->
<g transform="translate(460,44)">
<rect x="0" y="0" width="250" height="236" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="14" y="24" font-size="16" font-weight="bold">② 底网(放大)</text>
<text x="14" y="44" font-size="13" fill="#555">竹片或镀锌铁丝网</text>
<g fill="#e6cf9a" stroke="#8b6b3e" stroke-width="1.5">
<rect x="20" y="58" width="22" height="80"/><rect x="53" y="58" width="22" height="80"/><rect x="86" y="58" width="22" height="80"/><rect x="119" y="58" width="22" height="80"/><rect x="152" y="58" width="22" height="80"/><rect x="185" y="58" width="22" height="80"/>
</g>
<rect x="150" y="96" width="82" height="34" rx="2" fill="#c9a26a" stroke="#333" stroke-width="1.5"/>
<text x="191" y="118" font-size="12" text-anchor="middle">歇脚木板</text>
<path d="M20 148 H42" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<path d="M42 148 H53" stroke="#c33" stroke-width="1.3"/>
<path d="M42 142 V154 M53 142 V154" stroke="#c33" stroke-width="1.3"/>
<text x="14" y="170" font-size="13" fill="#0b5cad">竹片宽约2-2.5 cm</text>
<text x="14" y="188" font-size="13" fill="#c33">间隙约1-1.2 cm</text>
<text x="14" y="210" font-size="13">缝太宽: 兔脚卡住骨折</text>
<text x="14" y="228" font-size="13">铁丝太细: 磨出脚皮炎</text>
</g>

<!-- ③ 产仔箱 -->
<g transform="translate(460,290)">
<rect x="0" y="0" width="250" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="14" y="24" font-size="16" font-weight="bold">③ 产仔箱</text>
<text x="14" y="44" font-size="13">约40 × 25 × 20 cm木箱</text>
<!-- 打开的活盖 -->
<path d="M68 92 H208 L196 62 H56 Z" fill="#efe0c4" stroke="#333" stroke-width="1.5"/>
<text x="132" y="82" font-size="12" text-anchor="middle">顶部活盖</text>
<path d="M30 116 L68 92 H208 L170 116 Z" fill="url(#straw)" stroke="#333" stroke-width="1.5"/>
<path d="M170 116 L208 92 V162 L170 186 Z" fill="#d4bc93" stroke="#333" stroke-width="1.5"/>
<rect x="30" y="116" width="140" height="70" fill="#e6d2b0" stroke="#333" stroke-width="1.5"/>
<path d="M116 156 V136 Q116 126 128 126 H142 Q154 126 154 136 V156 Z" fill="url(#straw)" stroke="#333" stroke-width="1.5"/>
<path d="M135 158 V184" stroke="#0b5cad" stroke-width="1.3" marker-start="url(#arB0)" marker-end="url(#arB)"/>
<text x="38" y="164" font-size="12" fill="#0b5cad">出入口离箱底</text>
<text x="38" y="179" font-size="12" fill="#0b5cad">约10 cm</text>
<g fill="#555"><circle cx="60" cy="192" r="2"/><circle cx="90" cy="192" r="2"/><circle cx="120" cy="192" r="2"/><circle cx="150" cy="192" r="2"/></g>
<text x="14" y="212" font-size="13">防仔兔过早爬出;箱底钻小孔防潮</text>
<text x="14" y="230" font-size="13" fill="#555">配种后约27-28天放入,铺好干草</text>
</g>

<!-- ④ 放置与温度 -->
<g transform="translate(10,540)">
<rect x="0" y="0" width="700" height="140" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="2"/>
<text x="14" y="24" font-size="16" font-weight="bold" fill="#c33">④ 放置与温度</text>
<g font-size="13">
<text x="14" y="50">室内或有遮蔽处,通风良好,避免阳光直射</text>
<text x="14" y="70">木笼兔子会啃: 木条外侧用铁皮或铁丝网包住</text>
<text x="14" y="90">防鼠、防猫狗、防蛇: 老鼠会咬死仔兔,也传病</text>
<text x="14" y="110">底网缝太宽或铁丝太细伤脚: 笼里放木板歇脚</text>
<text x="360" y="50" font-weight="bold">兔最适约15-25°C</text>
<text x="360" y="70">超过约30°C容易中暑死亡,比冷更危险</text>
<text x="360" y="90">→ 夏天遮阳、通风、地面洒水</text>
<text x="360" y="110">→ 笼里放一瓶冻过的水让兔靠着降温</text>
</g>
</g>
</g>
</svg>
