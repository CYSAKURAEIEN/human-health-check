<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 856" width="720" height="856" role="img" aria-label="辐射的种类和防护。①三种射线的穿透力: α射线(氦原子核)很弱,一张纸、皮肤表层就能挡住,主要危险是吸入、吃进体内;β射线(电子)中等,几 mm铝板能挡住,要防止皮肤沾染和体内摄入;γ射线(高能光子)很强,要用厚铅板、厚混凝土、厚土层,加上距离。②防护三原则: 时间(少待)、距离(远离)、屏蔽(躲在厚墙后、地下)。③半衰期: 每过一个半衰期剩下一半,两个半衰期后剩下1/4;碳-14半衰期约5730年,剩下1/4约是11500年前;碘-131约8天,铯-137约30年" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>辐射的种类和防护</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<pattern id="conc" width="12" height="12" patternUnits="userSpaceOnUse">
<rect width="12" height="12" fill="#bbb"/>
<circle cx="3" cy="4" r="1.3" fill="#888"/><circle cx="9" cy="9" r="1.6" fill="#888"/>
</pattern>
<!-- 辐射警示标志 -->
<g id="tre">
<circle r="17" fill="#f5d33a" stroke="#333" stroke-width="1.5"/>
<circle r="3" fill="#222"/>
<path d="M5 0 L14 0 A14 14 0 0 1 7 12.1 L2.5 4.3 A5 5 0 0 0 5 0 Z" fill="#222" transform="rotate(30)"/>
<path d="M5 0 L14 0 A14 14 0 0 1 7 12.1 L2.5 4.3 A5 5 0 0 0 5 0 Z" fill="#222" transform="rotate(150)"/>
<path d="M5 0 L14 0 A14 14 0 0 1 7 12.1 L2.5 4.3 A5 5 0 0 0 5 0 Z" fill="#222" transform="rotate(270)"/>
</g>
<!-- 人 -->
<g id="man" stroke="#333" stroke-width="2">
<circle cx="0" cy="-46" r="9" fill="#f3e3d3"/>
<rect x="-10" y="-35" width="20" height="30" rx="6" fill="#cfe0f0"/>
<path d="M-5 -6 V16 M5 -6 V16" fill="none" stroke-linecap="round"/>
</g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">辐射的种类和防护</text>

<!-- ① 穿透力 -->
<rect x="10" y="42" width="700" height="272" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="68" font-size="16" font-weight="bold">① 三种射线的穿透力</text>
<!-- 挡板 -->
<rect x="287" y="124" width="7" height="170" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
<rect x="394" y="124" width="14" height="170" fill="#d5dbe3" stroke="#333" stroke-width="1.5"/>
<rect x="490" y="124" width="70" height="170" fill="url(#conc)" stroke="#333" stroke-width="2"/>
<g font-size="14" font-weight="bold" text-anchor="middle">
<text x="290" y="96">一张纸</text>
<text x="401" y="96">几 mm铝板</text>
<text x="525" y="96">厚铅板、厚混凝土</text>
</g>
<g font-size="13" text-anchor="middle" fill="#555">
<text x="290" y="114">皮肤表层</text>
<text x="525" y="114">厚土层</text>
</g>
<!-- 射线名称 -->
<g font-size="16" font-weight="bold">
<text x="26" y="160">α 射线</text>
<text x="26" y="215">β 射线</text>
<text x="26" y="270">γ 射线</text>
</g>
<g font-size="13" fill="#555">
<text x="26" y="178">氦原子核</text>
<text x="26" y="233">电子</text>
<text x="26" y="288">高能光子</text>
</g>
<g fill="#0b5cad" font-size="13">
<text x="200" y="146">很弱</text>
<text x="200" y="201">中等</text>
<text x="200" y="256">很强</text>
</g>
<!-- 放射源 -->
<use href="#tre" x="150" y="210"/>
<path d="M163 196 L180 154 M167 210 H180 M163 224 L180 266" stroke="#999" stroke-width="1.2" stroke-dasharray="3 3" fill="none"/>
<!-- 射线 -->
<g stroke="#c33" fill="none" stroke-linecap="round">
<path d="M180 154 H282" stroke-width="6" marker-end="url(#arR)"/>
<path d="M180 210 H388" stroke-width="3.5" marker-end="url(#arR)"/>
<path d="M180 266 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" stroke-width="2.5"/>
</g>
<path d="M528 259 L542 266 L528 273 Z" fill="#c33"/>
<!-- 右侧说明 -->
<g font-size="13">
<text x="572" y="150">主要危险是</text>
<text x="572" y="168">吸入、吃进体内</text>
<text x="572" y="205">防止皮肤沾染</text>
<text x="572" y="223">和体内摄入</text>
<text x="572" y="262">还要加上距离</text>
</g>

<!-- ② 防护三原则 -->
<rect x="10" y="330" width="700" height="210" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="356" font-size="16" font-weight="bold">② 防护三原则</text>
<!-- 时间 -->
<circle cx="126" cy="430" r="40" fill="#fff" stroke="#333" stroke-width="2.5"/>
<g stroke="#333" stroke-width="2" stroke-linecap="round">
<path d="M126 394 v6 M126 460 v6 M90 430 h6 M156 430 h6"/>
<path d="M126 430 V404 M126 430 L144 440" stroke-width="3"/>
</g>
<path d="M126 390 A40 40 0 0 1 160 409 L126 430 Z" fill="#c33" opacity="0.3"/>
<text x="126" y="500" font-size="16" font-weight="bold" text-anchor="middle">时间</text>
<text x="126" y="522" font-size="14" text-anchor="middle" fill="#0b5cad">少待</text>
<!-- 距离 -->
<use href="#tre" x="292" y="436"/>
<use href="#man" x="430" y="448"/>
<path d="M314 470 H410" stroke="#0b5cad" stroke-width="1.8" marker-start="url(#arB)" marker-end="url(#arB)"/>
<path d="M240 464 H460" stroke="#999" stroke-width="2"/>
<text x="360" y="500" font-size="16" font-weight="bold" text-anchor="middle">距离</text>
<text x="360" y="522" font-size="14" text-anchor="middle" fill="#0b5cad">远离</text>
<!-- 屏蔽 -->
<use href="#tre" x="520" y="436"/>
<rect x="562" y="382" width="30" height="82" fill="url(#conc)" stroke="#333" stroke-width="2"/>
<use href="#man" x="636" y="448"/>
<path d="M500 464 H690" stroke="#999" stroke-width="2"/>
<g stroke="#c33" stroke-width="2.5" fill="none" stroke-linecap="round">
<path d="M540 420 L558 412" marker-end="url(#arR)"/>
<path d="M541 436 H558" marker-end="url(#arR)"/>
<path d="M540 452 L558 458" marker-end="url(#arR)"/>
</g>
<text x="594" y="500" font-size="16" font-weight="bold" text-anchor="middle">屏蔽</text>
<text x="594" y="522" font-size="14" text-anchor="middle" fill="#0b5cad">躲在厚墙后、地下</text>

<!-- ③ 半衰期 -->
<rect x="10" y="556" width="700" height="288" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="24" y="582" font-size="16" font-weight="bold">③ 半衰期: 每过一个半衰期,剩下一半</text>
<!-- 坐标轴: x = 80 + 80 × 半衰期数, y = 760 - 160 × 剩余比例 -->
<path d="M80 600 V760 H420" fill="none" stroke="#333" stroke-width="2"/>
<g stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="4 4" fill="none">
<path d="M80 680 H160 V760"/>
<path d="M80 720 H240 V760"/>
<path d="M80 740 H320 V760"/>
</g>
<path d="M80 600 L100 625.5 L120 646.9 L140 664.9 L160 680 L180 692.7 L200 703.4 L220 712.4 L240 720 L260 726.4 L280 731.7 L300 736.2 L320 740 L340 743.2 L360 745.9 L380 748.1 L400 750" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
<circle cx="160" cy="680" r="4" fill="#333"/>
<circle cx="240" cy="720" r="6" fill="#c33"/>
<circle cx="320" cy="740" r="4" fill="#333"/>
<g font-size="13" text-anchor="end">
<text x="72" y="605">1</text>
<text x="72" y="685">1/2</text>
<text x="72" y="725">1/4</text>
<text x="72" y="745">1/8</text>
</g>
<text x="0" y="0" font-size="13" fill="#555" text-anchor="middle" transform="translate(34 680) rotate(-90)">剩下的比例</text>
<g font-size="13" text-anchor="middle">
<text x="80" y="778">0</text>
<text x="160" y="778">1</text>
<text x="240" y="778">2</text>
<text x="320" y="778">3</text>
<text x="400" y="778">4</text>
</g>
<text x="240" y="828" font-size="13" fill="#555" text-anchor="middle">横轴: 经过几个半衰期</text>
<g font-size="13" fill="#0b5cad" text-anchor="middle">
<text x="34" y="798" text-anchor="start">碳-14:</text>
<text x="160" y="798">约5730年</text>
<text x="240" y="798">约11500年</text>
</g>
<text x="252" y="706" font-size="14" font-weight="bold" fill="#c33">剩下1/4 → 约11500年前</text>
<!-- 半衰期表 -->
<g font-size="14">
<text x="456" y="626" font-weight="bold">常见同位素的半衰期</text>
<text x="456" y="656" font-weight="bold">碘-131</text><text x="536" y="656">约8天</text>
<text x="456" y="674" font-size="12" fill="#555">核事故早期的主要威胁</text>
<text x="456" y="702" font-weight="bold">铯-137</text><text x="536" y="702">约30年</text>
<text x="456" y="720" font-size="12" fill="#555">核事故后长期污染土壤</text>
<text x="456" y="748" font-weight="bold">碳-14</text><text x="536" y="748">约5730年</text>
<text x="456" y="766" font-size="12" fill="#555">用于考古测年</text>
</g>
</g>
</svg>
