<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="淘金: 只用重力法,绝不用汞。金几乎不和其他元素化合,以金属状态存在于自然界,而且极重,密度约19.3,可以用水把它和砂石分开。① 在哪里找: 河流的弯道内侧、大石头的下游、河床的基岩缝隙里,重的东西在这里沉积;有石英脉的山区下游。② 淘金盘,一个浅的、底部较平的盘子: 装入河沙,浸入水中,用手搅散,去掉大石块;在水中左右摇晃、转动盘子,让重的东西沉到底部;稍微倾斜盘子,用水把上层的轻砂慢慢冲出去;重复,最后盘底剩下黑砂(磁铁矿、锡石等重矿物)和金粒。金粒呈金黄色,不像黄铁矿(愚人金)那样有棱角、易碎。③ 溜槽: 一条倾斜的长木槽,底部钉横条(格条)或铺粗毛毡,从上端倒入沙石和水,重的金粒被格条挡住,轻的沙子被冲走,效率比淘金盘高得多。绝不用汞(水银)提金: 汞蒸气剧毒,会造成严重的神经损害,还会长期污染河流和鱼类" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>淘金: 只用重力法,绝不用汞</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<!-- 淘金盘侧视(原点在盘底中心) -->
<path id="pan" d="M-62,-26 L-46,0 H46 L62,-26" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">淘金: 只用重力法(淘金盘、溜槽),绝不用汞</text>
<text x="360" y="50" font-size="13" fill="#555" text-anchor="middle">金以金属状态存在于自然界,而且极重(密度约19.3),可以用水把它和砂石分开</text>

<!-- ① 在哪里找 -->
<rect x="8" y="64" width="704" height="246" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="88" font-size="15" font-weight="bold">① 在哪里找: 重的东西沉积的地方</text>
<!-- 平面图 -->
<rect x="16" y="98" width="330" height="202" fill="#eef3e6" stroke="#ccc" stroke-width="1"/>
<path d="M16,138 H200 A62,62 0 0 1 200,262 H16" fill="none" stroke="#999" stroke-width="48"/>
<path d="M16,138 H200 A62,62 0 0 1 200,262 H16" fill="none" stroke="#cfe6f7" stroke-width="44"/>
<path d="M40,138 h40 M120,138 h40" stroke="#0b5cad" stroke-width="1.8" marker-end="url(#arB)"/>
<path d="M170,262 h-40 M90,262 h-30" stroke="#0b5cad" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="24" y="122" font-size="11" fill="#0b5cad">水流</text>
<!-- 弯道内侧沉积 -->
<path d="M204,164 A26,26 0 0 1 204,236" fill="none" stroke="#d9a400" stroke-width="7" stroke-linecap="round"/>
<g fill="#d9a400"><circle cx="218" cy="180" r="2"/><circle cx="224" cy="196" r="2"/><circle cx="224" cy="210" r="2"/><circle cx="216" cy="224" r="2"/></g>
<path d="M214,200 H172" stroke="#c33" stroke-width="1.5" marker-start="url(#arR)"/>
<text x="110" y="198" font-size="13" font-weight="bold" fill="#c33">弯道内侧</text>
<!-- 大石头 -->
<path d="M106,252 Q112,244 122,246 Q132,250 130,260 Q126,270 114,270 Q104,266 106,252 Z" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<path d="M104,262 Q94,256 84,262 Q94,270 104,262 Z" fill="#d9a400"/>
<path d="M88,258 L66,232" stroke="#c33" stroke-width="1.5" marker-start="url(#arR)"/>
<text x="24" y="226" font-size="13" font-weight="bold" fill="#c33">大石头的下游</text>
<!-- 山 -->
<path d="M290,262 L306,242 L318,254 L330,238 L346,258" fill="none" stroke="#777" stroke-width="2" stroke-linejoin="round"/>
<path d="M300,252 L314,248 M322,250 L334,246" stroke="#fff" stroke-width="2"/>
<text x="342" y="278" font-size="12" text-anchor="end" fill="#555">有石英脉的</text>
<text x="342" y="294" font-size="12" text-anchor="end" fill="#555">山区下游</text>
<!-- 剖面 -->
<rect x="356" y="98" width="348" height="202" fill="#fff" stroke="#ccc" stroke-width="1"/>
<text x="366" y="118" font-size="13" font-weight="bold">河床剖面</text>
<path d="M356,140 H704 V200 H356 Z" fill="#cfe6f7"/>
<path d="M356,140 H704" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M356,200 H704 V240 H356 Z" fill="#e8dcc0"/>
<g fill="#b9a67e" stroke="#777" stroke-width="1"><circle cx="390" cy="214" r="7"/><circle cx="440" cy="222" r="9"/><circle cx="500" cy="212" r="6"/><circle cx="560" cy="224" r="8"/><circle cx="620" cy="214" r="7"/><circle cx="648" cy="226" r="8"/></g>
<path d="M356,240 L420,240 L428,262 L436,240 L540,240 L546,266 L552,240 L640,240 L648,258 L656,240 L704,240 V300 H356 Z" fill="#9a9a9a" stroke="#555" stroke-width="1.5" stroke-linejoin="round"/>
<g fill="#d9a400" stroke="#8a6a00" stroke-width="0.6"><circle cx="428" cy="254" r="3"/><circle cx="430" cy="246" r="2.5"/><circle cx="546" cy="258" r="3"/><circle cx="548" cy="249" r="2.5"/><circle cx="648" cy="250" r="3"/><circle cx="600" cy="237" r="2.2"/><circle cx="480" cy="237" r="2.2"/></g>
<text x="690" y="160" font-size="12" text-anchor="end" fill="#0b5cad">水</text>
<text x="690" y="216" font-size="12" text-anchor="end">砂砾</text>
<text x="694" y="262" font-size="12" text-anchor="end" fill="#fff">基岩</text>
<path d="M552,262 L590,284" stroke="#c33" stroke-width="1.5" marker-start="url(#arR)"/>
<text x="366" y="290" font-size="13" font-weight="bold" fill="#fff">河床的基岩缝隙里</text>
<text x="596" y="292" font-size="11" fill="#fff">金粒沉在这里</text>

<!-- ② 淘金盘 -->
<rect x="8" y="320" width="704" height="272" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="344" font-size="15" font-weight="bold">② 淘金盘: 一个浅的、底部较平的盘子(铁盘、木盘、塑料盘)</text>
<g stroke="#ccc" stroke-width="1.2" fill="#fff">
<rect x="16" y="354" width="168" height="168" rx="5"/>
<rect x="190" y="354" width="168" height="168" rx="5"/>
<rect x="364" y="354" width="168" height="168" rx="5"/>
<rect x="538" y="354" width="168" height="168" rx="5"/>
</g>
<g font-size="14" font-weight="bold">
<text x="24" y="374">1</text><text x="198" y="374">2</text><text x="372" y="374">3</text><text x="546" y="374">4</text>
</g>
<!-- 1 装沙、去大石 -->
<path d="M17,410 H183 V470 H17 Z" fill="#cfe6f7"/>
<path d="M17,410 H183" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M58,450 Q80,432 100,436 Q122,432 142,450 Z" fill="#e8dcc0" stroke="#999" stroke-width="1"/>
<g fill="#b9a67e"><circle cx="80" cy="444" r="2"/><circle cx="96" cy="440" r="2"/><circle cx="114" cy="444" r="2"/><circle cx="126" cy="446" r="2"/></g>
<use href="#pan" x="100" y="450"/>
<path d="M122,398 Q130,390 140,394 Q146,402 138,408 Q128,410 122,398 Z" fill="#aaa" stroke="#333" stroke-width="1.5"/>
<path d="M130,388 V372" stroke="#555" stroke-width="1.8" marker-end="url(#arK)"/>
<!-- 2 摇晃 -->
<path d="M191,410 H357 V470 H191 Z" fill="#cfe6f7"/>
<path d="M191,410 H357" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M232,450 Q254,436 274,438 Q296,436 316,450 Z" fill="#efe6cf" stroke="#999" stroke-width="1"/>
<path d="M230,450 H318 V446 H230 Z" fill="#444"/>
<g fill="#d9a400"><circle cx="262" cy="447" r="2"/><circle cx="286" cy="447" r="2"/></g>
<use href="#pan" x="274" y="450"/>
<path d="M226,390 H322" stroke="#c33" stroke-width="2" marker-start="url(#arR)" marker-end="url(#arR)"/>
<path d="M300,384 A26,8 0 1 0 248,384" fill="none" stroke="#c33" stroke-width="1.8" marker-end="url(#arR)"/>
<!-- 3 倾斜冲出轻砂 -->
<path d="M365,410 H531 V470 H365 Z" fill="#cfe6f7"/>
<path d="M365,410 H531" stroke="#0b5cad" stroke-width="1.5"/>
<g transform="translate(440,446) rotate(14)">
<path d="M-46,0 H46 V-5 H-46 Z" fill="#444"/>
<path d="M-48,-5 Q-20,-14 10,-10 Q34,-8 50,-14 L46,-5 Z" fill="#efe6cf" stroke="#999" stroke-width="1"/>
<circle cx="-10" cy="-2" r="2" fill="#d9a400"/>
<use href="#pan"/>
</g>
<path d="M410,396 Q460,388 500,412" fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<g fill="#b9a67e"><circle cx="506" cy="426" r="2"/><circle cx="514" cy="436" r="2"/><circle cx="508" cy="446" r="2"/><circle cx="518" cy="452" r="2"/></g>
<text x="524" y="402" font-size="11" fill="#555" text-anchor="end">轻砂</text>
<!-- 4 盘底俯视 -->
<ellipse cx="622" cy="430" rx="64" ry="34" fill="#ddd" stroke="#333" stroke-width="3"/>
<ellipse cx="622" cy="430" rx="48" ry="24" fill="#eee" stroke="#999" stroke-width="1"/>
<path d="M580,436 Q600,452 640,450 Q662,446 666,432 Q646,442 618,440 Q594,440 580,436 Z" fill="#333"/>
<g fill="#d9a400" stroke="#8a6a00" stroke-width="0.6"><circle cx="652" cy="434" r="3"/><circle cx="660" cy="428" r="2.4"/><circle cx="646" cy="426" r="2"/></g>
<path d="M596,446 L574,462" stroke="#333" stroke-width="1.2"/>
<text x="548" y="474" font-size="12">黑砂</text>
<path d="M660,428 L676,404" stroke="#c33" stroke-width="1.2"/>
<text x="680" y="400" font-size="12" font-weight="bold" fill="#c33" text-anchor="middle">金粒</text>
<g font-size="12" text-anchor="middle">
<text x="100" y="492">装入河沙,浸入水中</text>
<text x="100" y="510">用手搅散,去掉大石块</text>
<text x="274" y="492">在水中左右摇晃、转动</text>
<text x="274" y="510" font-weight="bold" fill="#0b5cad">让重的东西沉到底部</text>
<text x="448" y="492">稍微倾斜盘子,用水把</text>
<text x="448" y="510">上层的轻砂慢慢冲出去</text>
<text x="622" y="492">重复,最后盘底剩下</text>
<text x="622" y="510" font-weight="bold" fill="#0b5cad">黑砂和金粒</text>
</g>
<!-- 辨认 -->
<rect x="16" y="530" width="690" height="54" rx="4" fill="#fffbe8" stroke="#d9c98a" stroke-width="1"/>
<g stroke="#8a6a00" stroke-width="1" fill="#e0b400"><path d="M36,556 Q40,548 48,551 Q54,556 48,562 Q40,564 36,556 Z"/><path d="M56,560 Q60,554 66,557 Q68,562 63,565 Q57,566 56,560 Z"/><path d="M60,546 Q64,542 69,545 Q70,550 65,551 Q60,551 60,546 Z"/></g>
<text x="82" y="552" font-size="13" font-weight="bold">金粒: 金黄色</text>
<text x="82" y="572" font-size="12" fill="#555">盘底黑砂里是磁铁矿、锡石等重矿物</text>
<g stroke="#555" stroke-width="1" fill="#d8c56a"><path d="M392,548 h14 v14 h-14 Z"/><path d="M392,548 l5,-5 h14 l-5,5 Z M406,548 l5,-5 v14 l-5,5 Z" fill="#bfae55"/><path d="M416,556 h10 v10 h-10 Z"/><path d="M416,556 l4,-4 h10 l-4,4 Z M426,556 l4,-4 v10 l-4,4 Z" fill="#bfae55"/></g>
<text x="444" y="552" font-size="13" font-weight="bold" fill="#c33">不像黄铁矿("愚人金")</text>
<text x="444" y="572" font-size="12" fill="#c33">那样有棱角、易碎</text>

<!-- ③ 溜槽 -->
<rect x="8" y="602" width="704" height="200" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="626" font-size="15" font-weight="bold">③ 溜槽: 效率比淘金盘高得多</text>
<path d="M16,780 H704" stroke="#999" stroke-width="2.5"/>
<path d="M192,690 V780 M516,754 V780" stroke="#8a6a3a" stroke-width="5"/>
<g transform="translate(150,654) rotate(11.31)">
<path d="M0,10 H440 V26 H0 Z" fill="#cfe6f7" opacity="0.9"/>
<g fill="#b9a67e"><circle cx="30" cy="16" r="2"/><circle cx="90" cy="14" r="2"/><circle cx="150" cy="18" r="2"/><circle cx="210" cy="14" r="2"/><circle cx="270" cy="17" r="2"/><circle cx="330" cy="14" r="2"/><circle cx="390" cy="17" r="2"/><circle cx="430" cy="15" r="2"/></g>
<g fill="#8a6a3a" stroke="#333" stroke-width="1"><rect x="80" y="17" width="6" height="9"/><rect x="160" y="17" width="6" height="9"/><rect x="240" y="17" width="6" height="9"/><rect x="320" y="17" width="6" height="9"/><rect x="400" y="17" width="6" height="9"/></g>
<g fill="#d9a400" stroke="#8a6a00" stroke-width="0.6"><circle cx="74" cy="23" r="3"/><circle cx="154" cy="23" r="3"/><circle cx="148" cy="23" r="2.4"/><circle cx="234" cy="23" r="2.6"/><circle cx="314" cy="23" r="2.4"/></g>
<path d="M0,0 V34 H440 V0" fill="none" stroke="#333" stroke-width="2"/>
<rect x="0" y="26" width="440" height="8" fill="#c9a56b" stroke="#333" stroke-width="1.5"/>
<path d="M120,13 H200" stroke="#0b5cad" stroke-width="1.8" marker-end="url(#arB)"/>
</g>
<!-- 出口 -->
<path d="M584,746 Q598,750 604,772" fill="none" stroke="#0b5cad" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arB)"/>
<g fill="#b9a67e"><circle cx="592" cy="756" r="2"/><circle cx="600" cy="766" r="2"/><circle cx="606" cy="760" r="2"/></g>
<text x="616" y="752" font-size="13" font-weight="bold" fill="#0b5cad">轻的沙子</text>
<text x="616" y="770" font-size="13" font-weight="bold" fill="#0b5cad">被冲走</text>
<!-- 入口 -->
<path d="M96,640 L136,640 L132,670 L100,670 Z" fill="#ddd" stroke="#333" stroke-width="2" stroke-linejoin="round" transform="rotate(40 116 655)"/>
<path d="M140,668 Q150,662 158,668" fill="none" stroke="#0b5cad" stroke-width="2"/>
<text x="24" y="700" font-size="13" font-weight="bold">从上端倒入</text>
<text x="24" y="718" font-size="13" font-weight="bold">沙石和水</text>
<!-- 标注 -->
<text x="250" y="652" font-size="13">倾斜的长木槽,底部钉横条(格条)或铺粗毛毡</text>
<path d="M398,658 L398,706" stroke="#333" stroke-width="1.2"/>
<text x="230" y="762" font-size="13" font-weight="bold" fill="#c33">重的金粒被格条挡住</text>
<path d="M300,748 L297,713" stroke="#c33" stroke-width="1.2"/>

<!-- ④ 不用汞 -->
<rect x="8" y="812" width="704" height="80" rx="6" fill="#fbe9e9" stroke="#c33" stroke-width="2"/>
<text x="20" y="838" font-size="16" font-weight="bold" fill="#c33">✗ 绝不用汞(水银)提金</text>
<text x="20" y="860" font-size="13">把汞和金粒混合成"汞齐"、再加热蒸发汞,是很多地方土法采金的做法,但汞蒸气剧毒,</text>
<text x="20" y="880" font-size="13">会造成严重的神经损害,还会长期污染河流和鱼类 → <tspan font-weight="bold" fill="#c33">只用重力法(淘洗、溜槽)分选</tspan></text>
</g>
</svg>
