<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 806" width="720" height="806" role="img" aria-label="中毒的通用处理。①先保护自己: 现场有异味、有人接连倒下,可能是有毒气体,不要贸然进入;接触农药、化学品时戴手套。②让中毒者脱离毒物: 吸入的转移到空气新鲜处,打开门窗通风(屏住呼吸快进快出);皮肤沾染的脱去污染衣物,用大量清水冲洗皮肤和头发;眼睛用流动清水冲洗15-20分钟;口服的吐出嘴里剩余的东西,清水漱口,不要咽下。③拨打120,说清楚吃了或接触了什么、大概多少、什么时间,中毒者年龄、大概体重和现在的情况;中国大陆暂无全国统一的中毒咨询热线。④把毒物的瓶子、包装、剩余药片、呕吐物带去医院。⑤意识不清但有呼吸,侧卧位(恢复体位);无反应、无正常呼吸,立即CPR。不要做: 不要催吐;不要灌醋、牛奶、生鸡蛋、绿豆汤等偏方,除非医生或120明确让你这样做;不要给意识不清的人喂任何东西;看起来没事也要去医院。" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>中毒的通用处理</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">中毒的通用处理</text>
<text x="360" y="52" font-size="13" text-anchor="middle" fill="#555">先保护自己 → 脱离毒物 → 拨打120 → 带上毒物 → 观察意识和呼吸</text>

<!-- ① 先保护自己 -->
<g transform="translate(10,64)">
<rect x="0" y="0" width="230" height="290" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">① 先保护自己</text>
<!-- 门内: 毒气 + 倒地的人 -->
<rect x="118" y="44" width="98" height="124" fill="#f4f4ec" stroke="#333" stroke-width="3"/>
<g fill="#c9d6a3" fill-opacity="0.75"><circle cx="146" cy="84" r="18"/><circle cx="172" cy="76" r="20"/><circle cx="196" cy="90" r="16"/><circle cx="160" cy="104" r="18"/><circle cx="188" cy="112" r="16"/></g>
<path d="M136 74 q6 -6 12 0 t12 0 M170 98 q6 -6 12 0 t12 0" fill="none" stroke="#7d8f4a" stroke-width="1.5"/>
<circle cx="138" cy="152" r="9" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="148" y="146" width="44" height="14" rx="6" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<path d="M192 150 H210 M192 156 H208" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<circle cx="190" cy="140" r="7" fill="#f3e3d3" stroke="#333" stroke-width="1.5"/>
<rect x="196" y="132" width="16" height="10" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/>
<!-- 门外: 救助者 -->
<path d="M46 132 V166 M62 132 V166" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<rect x="40" y="88" width="28" height="48" rx="9" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="54" cy="74" r="12" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M68 98 L84 112" stroke="#333" stroke-width="5" stroke-linecap="round"/>
<path d="M76 124 H110" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M86 112 L102 136 M102 112 L86 136" stroke="#c33" stroke-width="3.5" stroke-linecap="round"/>
<path d="M8 168 H222" stroke="#999" stroke-width="2.5"/>
<g font-size="13">
<text x="10" y="192">现场有异味、有人接连倒下</text>
<text x="10" y="210">→ 可能是有毒气体,</text>
<text x="10" y="228" fill="#c33" font-weight="bold">不要贸然进入</text>
<text x="10" y="250">接触农药、化学品时戴手套</text>
<text x="10" y="268" font-size="12" fill="#555">一氧化碳中毒见《居家与交通意外》,</text>
<text x="10" y="283" font-size="12" fill="#555">化学品泄漏见《人为灾难》</text>
</g>
</g>

<!-- ② 脱离毒物 -->
<g transform="translate(245,64)">
<rect x="0" y="0" width="465" height="290" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">② 让中毒者脱离毒物</text>
<rect x="8" y="36" width="222" height="122" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<rect x="235" y="36" width="222" height="122" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<rect x="8" y="162" width="222" height="122" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<rect x="235" y="162" width="222" height="122" rx="6" fill="none" stroke="#ddd" stroke-width="1"/>
<!-- 吸入: 打开的窗 -->
<g transform="translate(8,36)">
<rect x="10" y="22" width="52" height="64" fill="#e3eef8" stroke="#333" stroke-width="2.5"/>
<path d="M36 22 V86 M10 54 H62" stroke="#333" stroke-width="2"/>
<path d="M36 22 L50 30 V94 L36 86 Z" fill="#fff" stroke="#333" stroke-width="2"/>
<path d="M4 40 Q20 34 30 42 M4 58 Q20 52 30 60 M4 76 Q20 70 30 78" fill="none" stroke="#0b5cad" stroke-width="1.8" marker-end="url(#arB)"/>
<text x="76" y="26" font-size="14" font-weight="bold">吸入</text>
<g font-size="13"><text x="76" y="48">转移到空气新鲜处</text><text x="76" y="68">打开门窗通风</text><text x="76" y="86" font-size="12" fill="#555">(屏住呼吸快进快出)</text></g>
</g>
<!-- 皮肤: 水龙头冲手臂 -->
<g transform="translate(235,36)">
<path d="M14 20 H44 V30 H34 V36 H24 V30 H14 Z" fill="#bbb" stroke="#333" stroke-width="2"/>
<path d="M26 38 V64 M29 38 V64 M32 38 V64" stroke="#3a7fc0" stroke-width="1.6"/>
<path d="M4 72 H52" stroke="#333" stroke-width="16" stroke-linecap="round"/>
<path d="M4 72 H52" stroke="#f3e3d3" stroke-width="11" stroke-linecap="round"/>
<path d="M18 78 Q22 86 18 92 M30 78 Q34 88 30 96 M42 78 Q46 86 42 92" fill="none" stroke="#3a7fc0" stroke-width="1.5"/>
<text x="76" y="26" font-size="14" font-weight="bold">皮肤沾染</text>
<g font-size="13"><text x="76" y="48">脱去污染的衣物,</text><text x="76" y="68">用大量清水冲洗</text><text x="76" y="88">皮肤和头发</text></g>
</g>
<!-- 眼睛 -->
<g transform="translate(8,162)">
<path d="M18 22 H44 V32 H36 V38 H26 V32 H18 Z" fill="#bbb" stroke="#333" stroke-width="2"/>
<path d="M29 40 Q30 52 32 62 M33 40 Q34 52 36 62" fill="none" stroke="#3a7fc0" stroke-width="1.6"/>
<path d="M6 80 Q34 56 62 80 Q34 102 6 80 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
<circle cx="34" cy="80" r="10" fill="#6b8fb3" stroke="#333" stroke-width="1.5"/>
<circle cx="34" cy="80" r="4" fill="#222"/>
<text x="76" y="26" font-size="14" font-weight="bold">眼睛</text>
<g font-size="13"><text x="76" y="48">用流动清水冲洗</text></g>
<text x="76" y="76" font-size="20" font-weight="bold" fill="#c33">15-20分钟</text>
<text x="76" y="100" font-size="12" fill="#555">详见《异物处理》</text>
<text x="76" y="115" font-size="12" fill="#555">化学品入眼</text>
</g>
<!-- 口服 -->
<g transform="translate(235,162)">
<path d="M12 28 L18 92 H44 L50 28 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
<path d="M14.5 50 L18 92 H44 L47.5 50 Z" fill="#cfe5f5"/>
<path d="M14.5 50 H47.5" stroke="#3a7fc0" stroke-width="1.5"/>
<text x="76" y="26" font-size="14" font-weight="bold">口服</text>
<g font-size="13"><text x="76" y="48">吐出嘴里剩余的东西</text><text x="76" y="68">清水漱口,吐掉</text><text x="76" y="90" fill="#c33" font-weight="bold">不要咽下</text></g>
</g>
</g>

<!-- ③ 拨打120 -->
<g transform="translate(10,362)">
<rect x="0" y="0" width="230" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">③ 拨打120</text>
<rect x="20" y="38" width="34" height="58" rx="6" fill="#fff" stroke="#333" stroke-width="2.5"/>
<rect x="25" y="46" width="24" height="36" fill="#e3eef8"/>
<circle cx="37" cy="89" r="3" fill="none" stroke="#333" stroke-width="1.5"/>
<text x="68" y="80" font-size="34" font-weight="bold" fill="#c33">120</text>
<text x="10" y="122" font-size="13" font-weight="bold">说清楚:</text>
<g font-size="13">
<text x="10" y="142">· 吃了(或接触了)什么</text>
<text x="10" y="160">· 大概多少、什么时间</text>
<text x="10" y="178">· 中毒者年龄、大概体重</text>
<text x="10" y="196">· 现在的情况</text>
</g>
<g font-size="12" fill="#555"><text x="10" y="218">中国大陆暂无全国统一的中毒咨询</text><text x="10" y="233">热线,遇到中毒直接拨打120</text></g>
</g>

<!-- ④ 带上毒物 -->
<g transform="translate(245,362)">
<rect x="0" y="0" width="230" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">④ 带上毒物去医院</text>
<!-- 瓶子 -->
<path d="M28 44 H44 V54 Q56 60 56 72 V110 H16 V72 Q16 60 28 54 Z" fill="#e9eef2" stroke="#333" stroke-width="2"/>
<rect x="26" y="36" width="20" height="9" fill="#c33" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="76" width="32" height="22" fill="#fff" stroke="#333" stroke-width="1.2"/>
<path d="M24 83 H48 M24 91 H42" stroke="#999" stroke-width="1.5"/>
<!-- 药板 -->
<rect x="72" y="64" width="54" height="40" rx="3" fill="#dfe4e8" stroke="#333" stroke-width="2"/>
<g fill="#fff" stroke="#333" stroke-width="1.2"><circle cx="84" cy="76" r="5"/><circle cx="99" cy="76" r="5"/><circle cx="114" cy="76" r="5"/><circle cx="84" cy="92" r="5"/></g>
<g fill="none" stroke="#333" stroke-width="1.2" stroke-dasharray="2 2"><circle cx="99" cy="92" r="5"/><circle cx="114" cy="92" r="5"/></g>
<!-- 袋子 -->
<path d="M142 58 H204 L198 110 H148 Z" fill="#f3f0e6" stroke="#333" stroke-width="2"/>
<path d="M160 58 Q160 44 173 44 Q186 44 186 58" fill="none" stroke="#333" stroke-width="2"/>
<g font-size="12" text-anchor="middle" fill="#0b5cad"><text x="36" y="128">瓶子、包装</text><text x="99" y="128">剩余药片</text><text x="173" y="128">呕吐物装袋</text></g>
<g font-size="13">
<text x="10" y="156">把毒物的瓶子、包装、剩余的</text>
<text x="10" y="174">药片、呕吐物带去医院</text>
<text x="10" y="198" fill="#555" font-size="12">医生需要知道具体是什么,</text>
<text x="10" y="214" fill="#555" font-size="12">才能对症解毒</text>
</g>
</g>

<!-- ⑤ 观察 -->
<g transform="translate(480,362)">
<rect x="0" y="0" width="230" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="10" y="24" font-size="16" font-weight="bold">⑤ 观察意识和呼吸</text>
<g transform="translate(8,18) scale(0.66)">
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M185,100 L312,106" stroke="#333" stroke-width="22"/><path d="M185,100 L312,106" stroke="#cfe0f0" stroke-width="17"/>
<path d="M90,104 L90,150 L48,150" stroke="#333" stroke-width="16"/><path d="M90,104 L90,150 L48,150" stroke="#f3e3d3" stroke-width="11"/>
</g>
<ellipse cx="42" cy="150" rx="10" ry="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<rect x="74" y="80" width="114" height="34" rx="14" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M180,98 L184,160 L250,162" stroke="#333" stroke-width="22"/><path d="M180,98 L184,160 L250,162" stroke="#cfe0f0" stroke-width="17"/>
</g>
<path d="M58,92 L80,94" stroke="#333" stroke-width="16" stroke-linecap="round"/>
<path d="M58,92 L80,94" stroke="#f3e3d3" stroke-width="11" stroke-linecap="round"/>
<circle cx="50" cy="90" r="21" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M34,76 Q50,62 68,78 Q72,88 68,96 Q60,80 34,76 Z" fill="#555"/>
<path d="M30,98 Q24,104 32,110" fill="none" stroke="#333" stroke-width="2"/>
<path d="M42,108 Q46,110 50,108" fill="none" stroke="#333" stroke-width="1.8"/>
<circle cx="56" cy="90" r="4" fill="none" stroke="#333" stroke-width="1.5"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M94,88 L114,132 L62,120" stroke="#333" stroke-width="16"/><path d="M94,88 L114,132 L62,120" stroke="#f3e3d3" stroke-width="11"/>
</g>
<ellipse cx="54" cy="118" rx="10" ry="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
<text x="10" y="144" font-size="12" fill="#555">侧卧位(恢复体位),俯视</text>
<g font-size="13">
<text x="10" y="166">意识不清但有呼吸 →</text>
<text x="10" y="184" font-weight="bold" fill="#0b5cad">侧卧位,防止呕吐物堵住气道</text>
<text x="10" y="208">无反应、无正常呼吸 →</text>
<text x="10" y="226" font-weight="bold" fill="#c33">立即CPR</text>
</g>
</g>

<!-- 不要做 -->
<g transform="translate(10,610)">
<rect x="0" y="0" width="700" height="186" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold" fill="#c33">✗ 不要做</text>
<g font-size="14">
<text x="14" y="54"><tspan fill="#c33" font-weight="bold">✗ 不要催吐:</tspan> 抠喉咙、灌盐水、灌肥皂水都不推荐,催吐并不能有效清除胃里的毒物</text>
<text x="32" y="74" font-size="12" fill="#555">腐蚀性物质(强酸、强碱、清洁剂)吐出来会再次烧伤食道和口腔;意识不清时呕吐容易吸进肺里</text>
<text x="14" y="102"><tspan fill="#c33" font-weight="bold">✗ 不要灌醋、牛奶、生鸡蛋、绿豆汤等“解毒”偏方</tspan>,除非医生或120明确让你这样做</text>
<text x="14" y="128"><tspan fill="#c33" font-weight="bold">✗ 不要给意识不清的人喂任何东西</tspan></text>
<text x="14" y="154"><tspan fill="#c33" font-weight="bold">✗ 不要因为“现在看起来没事”就不去医院:</tspan> 百草枯、对乙酰氨基酚、某些鼠药要几小时到几天后</text>
<text x="32" y="174" font-size="12" fill="#555">才出现严重症状,等到出现症状时往往已经错过最佳治疗时机</text>
</g>
</g>
</g>
</svg>
