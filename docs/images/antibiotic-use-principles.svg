<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" width="720" height="1010" role="img" aria-label="抗生素使用原则与耐药。本图不提供任何剂量;能找到医生时,任何疑似细菌感染都应先就医,而不是先吃储备药;自制抗生素没有可靠方法,本手册不提供,要储备成品药、做好预防。①只对细菌感染有效: 伤口化脓、高热不退超过3天、局部红肿热痛、白细胞升高提示细菌感染,要由医生判断,不是自行用药的依据;不要用于病毒感染(感冒、流感)、预防性使用、发热原因不明;对病毒、真菌、寄生虫无效。②耐药的原理是自然选择: 用药时大部分细菌被杀死,少数天生不怕这种药的存活下来,存活的细菌繁殖,下一次同样的药就不管用了;耐药菌还会在家人、邻居之间传播,末日情境下没有药敏试验,也没有新药可换。③加快耐药的做法: 病毒感染吃抗生素,好转就停药、吃吃停停、自己减量,把一个疗程的药分给几个人吃,吃别人剩下的、来源不明的药,没有指征地预防性服用。④正确做法: 一次只用一种,不自行联合用药;按医嘱足量足疗程,不要一有好转就停药;用药2-3天完全无改善或加重,尽快就医,不要自己换药或加药;保留原包装和说明书,核对禁忌和过敏史;记录药名、每次服药时间、每天体温。⑤用药期间: 局部皮疹瘙痒停药并联系医生;皮疹起水疱、皮肤剥脱、口眼黏膜溃烂停药并拨打120;喉头发紧、呼吸困难、面唇肿、头晕虚脱是过敏性休克,按1.3抢救并拨打120;腹泻频繁、带血或黏液、腹痛发热停药立即就医;皮肤眼白发黄、尿色深如浓茶、尿量明显减少停药尽快就医。预防远胜于治疗" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>抗生素使用原则与耐药</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
<!-- 细菌: 怕药的(蓝)、被杀死的(虚线)、不怕药的(红) -->
<rect id="bB" x="-9" y="-4.5" width="18" height="9" rx="4.5" fill="#cfe0f0" stroke="#333" stroke-width="1.2"/>
<rect id="bD" x="-9" y="-4.5" width="18" height="9" rx="4.5" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="2 2"/>
<rect id="bR" x="-9" y="-4.5" width="18" height="9" rx="4.5" fill="#f4c7c7" stroke="#c33" stroke-width="1.4"/>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">抗生素: 只对细菌有效,每一片都要用对</text>

<!-- 警告 -->
<rect x="8" y="42" width="704" height="58" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<g font-size="13">
<text x="20" y="65"><tspan font-weight="bold" fill="#c33">⚠ 本图不提供任何剂量。</tspan>能找到医生时,任何疑似细菌感染都应先就医,而不是先吃储备药</text>
<text x="20" y="88">自制抗生素没有可靠方法,本手册不提供;储备成品药、保留说明书,做好预防</text>
</g>

<!-- ① 什么时候用 -->
<rect x="8" y="110" width="704" height="200" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="134" font-size="15" font-weight="bold">① 什么时候用: 只对细菌感染有效</text>
<!-- 细菌图标 -->
<g stroke="#333" stroke-width="1.6">
<path d="M76,170 q8,-6 14,0 t14,0" fill="none" stroke-width="1.2"/>
<rect x="30" y="160" width="46" height="20" rx="10" fill="#cfe0f0"/>
</g>
<text x="56" y="198" font-size="12" text-anchor="middle" fill="#555">细菌</text>
<text x="116" y="166" font-size="14" font-weight="bold" fill="#0b5cad">✓ 提示细菌感染</text>
<g font-size="13">
<text x="116" y="190">· 伤口化脓</text>
<text x="116" y="210">· 高热不退(>3天)</text>
<text x="116" y="230">· 局部红肿热痛</text>
<text x="116" y="250">· 白细胞升高(如能检测)</text>
</g>
<text x="24" y="292" font-size="12" fill="#555">要由医生判断,不是自行用药的依据</text>
<path d="M360,148 V296" stroke="#ddd" stroke-width="1"/>
<!-- 病毒图标 -->
<g stroke="#333" stroke-width="1.5">
<path d="M400,152 V158 M400,186 V192 M380,172 H386 M414,172 H420 M386,158 L390,162 M414,158 L410,162 M386,186 L390,182 M414,186 L410,182"/>
<circle cx="400" cy="172" r="12" fill="#e3e7eb"/>
</g>
<text x="400" y="210" font-size="12" text-anchor="middle" fill="#555">病毒</text>
<text x="440" y="166" font-size="14" font-weight="bold" fill="#c33">✗ 不要用于</text>
<g font-size="13">
<text x="440" y="190">· 病毒感染(感冒、流感)</text>
<text x="440" y="210">· 预防性使用(浪费且致耐药)</text>
<text x="440" y="230">· 发热原因不明</text>
<text x="440" y="250">· 对病毒、真菌、寄生虫都无效</text>
</g>
<text x="374" y="292" font-size="12" fill="#555">普通感冒以流涕、咽痛为主,一周左右自愈</text>

<!-- ② 耐药 -->
<rect x="8" y="320" width="704" height="250" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="344" font-size="15" font-weight="bold">② 耐药是怎么产生的: 自然选择</text>
<g font-size="14" font-weight="bold" text-anchor="middle">
<text x="120" y="378">用药前</text>
<text x="360" y="378">用药时</text>
<text x="600" y="378">之后</text>
</g>
<g fill="#fff" stroke="#999" stroke-width="2">
<ellipse cx="120" cy="440" rx="80" ry="52"/>
<ellipse cx="360" cy="440" rx="80" ry="52"/>
<ellipse cx="600" cy="440" rx="80" ry="52"/>
</g>
<use href="#bB" transform="translate(70,418) rotate(20)"/>
<use href="#bB" transform="translate(96,410) rotate(-15)"/>
<use href="#bB" transform="translate(124,406) rotate(30)"/>
<use href="#bB" transform="translate(152,414) rotate(0)"/>
<use href="#bB" transform="translate(62,446) rotate(-30)"/>
<use href="#bB" transform="translate(90,440) rotate(10)"/>
<use href="#bR" transform="translate(120,434) rotate(-20)"/>
<use href="#bB" transform="translate(148,440) rotate(40)"/>
<use href="#bB" transform="translate(176,434) rotate(15)"/>
<use href="#bB" transform="translate(80,466) rotate(0)"/>
<use href="#bB" transform="translate(110,464) rotate(25)"/>
<use href="#bB" transform="translate(140,468) rotate(-10)"/>
<use href="#bR" transform="translate(170,462) rotate(-35)"/>

<use href="#bD" transform="translate(310,418) rotate(20)"/>
<use href="#bD" transform="translate(336,410) rotate(-15)"/>
<use href="#bD" transform="translate(364,406) rotate(30)"/>
<use href="#bD" transform="translate(392,414) rotate(0)"/>
<use href="#bD" transform="translate(302,446) rotate(-30)"/>
<use href="#bD" transform="translate(330,440) rotate(10)"/>
<use href="#bR" transform="translate(360,434) rotate(-20)"/>
<use href="#bD" transform="translate(388,440) rotate(40)"/>
<use href="#bD" transform="translate(416,434) rotate(15)"/>
<use href="#bD" transform="translate(320,466) rotate(0)"/>
<use href="#bD" transform="translate(350,464) rotate(25)"/>
<use href="#bD" transform="translate(380,468) rotate(-10)"/>
<use href="#bR" transform="translate(410,462) rotate(-35)"/>

<use href="#bR" transform="translate(550,418) rotate(20)"/>
<use href="#bR" transform="translate(576,410) rotate(-15)"/>
<use href="#bR" transform="translate(604,406) rotate(30)"/>
<use href="#bR" transform="translate(632,414) rotate(0)"/>
<use href="#bR" transform="translate(542,446) rotate(-30)"/>
<use href="#bR" transform="translate(570,440) rotate(10)"/>
<use href="#bR" transform="translate(600,434) rotate(-20)"/>
<use href="#bR" transform="translate(628,440) rotate(40)"/>
<use href="#bR" transform="translate(656,434) rotate(15)"/>
<use href="#bR" transform="translate(560,466) rotate(0)"/>
<use href="#bR" transform="translate(590,464) rotate(25)"/>
<use href="#bR" transform="translate(620,468) rotate(-10)"/>
<use href="#bR" transform="translate(650,462) rotate(-35)"/>
<!-- 箭头 -->
<path d="M206,440 H270" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<path d="M446,440 H510" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<g font-size="12" text-anchor="middle" fill="#555">
<text x="238" y="430">用药</text>
<text x="478" y="430">繁殖</text>
</g>
<g font-size="13" text-anchor="middle">
<text x="120" y="514">大部分细菌怕这种药</text>
<text x="120" y="532" fill="#c33">少数(红色)天生不怕</text>
<text x="360" y="514">大部分被杀死</text>
<text x="360" y="532" fill="#c33">不怕药的活了下来</text>
<text x="600" y="514">活下来的繁殖</text>
<text x="600" y="532" fill="#c33">同样的药就不管用了</text>
</g>
<text x="360" y="558" font-size="13" text-anchor="middle" fill="#c33">⚠ 耐药菌还会在家人、邻居之间传播;末日情境下没有药敏试验,也没有新药可换</text>

<!-- ③ 加快耐药 -->
<rect x="8" y="580" width="348" height="200" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="604" font-size="15" font-weight="bold">③ 这些做法会加快耐药</text>
<g font-size="13">
<text x="20" y="632"><tspan fill="#c33">✗</tspan> 感冒、流感等病毒感染吃抗生素</text>
<text x="20" y="658"><tspan fill="#c33">✗</tspan> 好转就停药、吃吃停停、自己减量</text>
<text x="20" y="684"><tspan fill="#c33">✗</tspan> 把一个疗程的药分给几个人吃</text>
<text x="20" y="710"><tspan fill="#c33">✗</tspan> 吃别人剩下的、来源不明的药</text>
<text x="20" y="736"><tspan fill="#c33">✗</tspan> 没有指征地“预防性”服用</text>
</g>
<text x="20" y="766" font-size="12" fill="#555">社区里出现耐药菌,储备的药就等于少了一类</text>

<!-- ④ 正确做法 -->
<rect x="364" y="580" width="348" height="200" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="374" y="604" font-size="15" font-weight="bold">④ 正确做法</text>
<g font-size="13">
<text x="376" y="632"><tspan fill="#0b5cad">✓</tspan> 一次只用一种,不自行联合用药</text>
<text x="376" y="658"><tspan fill="#0b5cad">✓</tspan> 按医嘱足量足疗程,不要一有好转就停药</text>
<text x="376" y="684"><tspan fill="#0b5cad">✓</tspan> 用药2-3天完全无改善或加重</text>
<text x="392" y="702" fill="#c33">→ 尽快就医,不要自己换药或加药</text>
<text x="376" y="728"><tspan fill="#0b5cad">✓</tspan> 保留原包装和说明书,核对禁忌、过敏史</text>
<text x="376" y="754"><tspan fill="#0b5cad">✓</tspan> 记下药名、每次服药时间、每天体温</text>
</g>

<!-- ⑤ 副作用 -->
<rect x="8" y="790" width="704" height="150" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="814" font-size="15" font-weight="bold">⑤ 用药期间出现这些: 停药</text>
<g font-size="13">
<text x="24" y="840">局部皮疹、瘙痒</text>
<text x="24" y="862">皮疹起水疱、皮肤剥脱、口眼黏膜溃烂</text>
<text x="24" y="884">喉头发紧、呼吸困难、面唇肿、头晕虚脱</text>
<text x="24" y="906">腹泻频繁、带血或黏液、腹痛发热</text>
<text x="24" y="928">皮肤眼白发黄、尿色深如浓茶、尿量明显减少</text>
<g fill="#555">
<text x="322" y="840">→</text><text x="322" y="862">→</text><text x="322" y="884">→</text><text x="322" y="906">→</text><text x="322" y="928">→</text>
</g>
<text x="346" y="840">停药,联系医生;记录药名</text>
<text x="346" y="862" fill="#c33" font-weight="bold">停药,立即拨打120(重症药疹)</text>
<text x="346" y="884" fill="#c33" font-weight="bold">过敏性休克: 按1.3抢救,拨打120</text>
<text x="346" y="906" fill="#c33">停药,立即就医,注意防脱水</text>
<text x="346" y="928">肝、肾损害: 停药,尽快就医</text>
</g>

<!-- 底部 -->
<rect x="8" y="950" width="704" height="52" rx="6" fill="#eef5fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="360" y="972" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b5cad">预防 &gt;&gt; 天然抗菌 &gt;&gt; 储备药品 &gt;&gt; 自制(等死)</text>
<text x="360" y="992" font-size="13" text-anchor="middle">勤洗手、喝开水、伤口加压冲洗: 预防远胜于治疗</text>
</g>
</svg>
