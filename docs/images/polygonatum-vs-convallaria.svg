<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" role="img" aria-label="玉竹与铃兰对照示意: 挖玉竹、黄精之前先认准整株。玉竹高20-50 cm,有一根单生、向一侧弓形弯曲的地上茎;叶互生,椭圆形,在茎上排成左右两列,叶背带灰白色;花1-4朵生于叶腋,下垂,白色带绿的筒状小钟;浆果蓝黑色;根茎长圆柱形,有微隆起的环节和圆盘状茎痕。铃兰全株有毒,含强心苷,误食可致心律失常: 没有弓形的地上茎,通常只有2片宽大的叶从地下直接长出,叶基有鞘;花葶从叶基部抽出,一串白色小铃铛偏向一侧,有浓香;浆果红色。万年青全株有毒,叶全部基生、厚革质、带状,浆果红色;藜芦剧毒,叶宽大、有许多纵向褶皱,茎基部有棕色纤维状残毛。判断口诀: 玉竹、黄精都有一根直立或弯垂的地上茎,叶长在茎上,花挂在叶腋下面;叶从地下直接长出、果实红色的,一律不挖">
<rect width="100%" height="100%" fill="#fff"/>
<title>玉竹与铃兰对照</title>
<defs>
<g id="yleaf"><path d="M0 0 C10 -12 40 -13 56 0 C40 13 10 12 0 0Z" stroke="#333" stroke-width="1.3"/><path d="M2 0 H52 M8 -3 Q30 -9 50 -2 M8 3 Q30 9 50 2" stroke="#6a8a3a" stroke-width="0.8" fill="none"/></g>
<g id="ybell"><path d="M0 0 V8 M0 8 L-6 14 M0 8 L6 14" stroke="#4d6b2a" stroke-width="1.2" fill="none"/><path d="M-10 14 Q-11 24 -10 30 H-2 Q-1 24 -2 14 Z M2 14 Q1 24 2 30 H10 Q11 24 10 14 Z" fill="#fff" stroke="#333" stroke-width="1.2"/><path d="M-10 30 l2 3 l2 -3 l2 3 l2 -3 M2 30 l2 3 l2 -3 l2 3 l2 -3" stroke="#6a9a3a" stroke-width="1.4" fill="none"/></g>
<g id="lbell"><path d="M-7 0 Q-8 9 -10 13 Q-7 11 -5 14 Q-2 11 0 14 Q2 11 5 14 Q7 11 10 13 Q8 9 7 0 Q0 -5 -7 0Z" fill="#fff" stroke="#333" stroke-width="1.3"/></g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">玉竹 vs 铃兰 识别要点(示意图)</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">挖根之前先认准整株——只看地下部分最容易认错</text>
<rect x="10" y="64" width="345" height="560" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="365" y="64" width="345" height="560" rx="8" fill="none" stroke="#c33" stroke-width="2"/>

<!-- ① 玉竹 -->
<text x="26" y="92" font-size="18" font-weight="bold">① 玉竹(黄精同属)</text>
<text x="26" y="112" font-size="14" font-style="italic" fill="#555">Polygonatum odoratum</text>
<text x="26" y="136" font-size="15">高20-50 cm</text>
<line x1="20" y1="392" x2="345" y2="392" stroke="#999" stroke-width="2"/>
<path d="M80 392 C76 300 120 224 200 212 C250 206 292 220 318 246" stroke="#4d6b2a" stroke-width="3" fill="none"/>
<use href="#yleaf" transform="translate(99.5 286) rotate(-111) scale(0.8)" fill="#b5d08a"/>
<use href="#yleaf" transform="translate(119 257) rotate(-1) scale(0.8)" fill="#dfe8d2"/>
<use href="#yleaf" transform="translate(141.5 236) rotate(-84)" fill="#b5d08a"/>
<use href="#yleaf" transform="translate(168.5 221) rotate(26)" fill="#dfe8d2"/>
<use href="#yleaf" transform="translate(207 211) rotate(-53)" fill="#b5d08a"/>
<use href="#yleaf" transform="translate(243 212) rotate(55)" fill="#dfe8d2"/>
<use href="#yleaf" transform="translate(274 219) rotate(-29)" fill="#b5d08a"/>
<use href="#yleaf" transform="translate(300.5 232) rotate(81) scale(0.75)" fill="#dfe8d2"/>
<use href="#ybell" x="158" y="224"/>
<use href="#ybell" x="222" y="212"/>
<use href="#ybell" x="262" y="216"/>
<!-- 根茎 -->
<path d="M30 404 C30 396 36 396 46 396 H196 C206 396 210 400 210 408 C210 416 206 420 196 420 H46 C36 420 30 420 30 412 Z" fill="#f0e3b8" stroke="#333" stroke-width="1.6"/>
<g stroke="#8a7a4a" stroke-width="1.2" fill="none"><path d="M60 397 Q57 408 60 419 M100 397 Q97 408 100 419 M140 397 Q137 408 140 419 M180 397 Q177 408 180 419"/></g>
<ellipse cx="160" cy="398" rx="9" ry="3.5" fill="#d8c890" stroke="#333" stroke-width="1.2"/>
<g fill="#fff" stroke="#8a7a4a" stroke-width="0.8"><circle cx="48" cy="414" r="1.8"/><circle cx="118" cy="413" r="1.8"/><circle cx="196" cy="413" r="1.8"/></g>
<g stroke="#8a7a5a" stroke-width="1" fill="none"><path d="M50 420 Q46 434 40 446 M86 420 Q88 436 84 450 M126 420 Q124 434 128 448 M170 420 Q174 434 168 446 M204 416 Q214 428 222 436"/></g>
<!-- 浆果插图 -->
<circle cx="300" cy="320" r="30" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M300 296 V306 M300 306 L292 314 M300 306 L308 314" stroke="#4d6b2a" stroke-width="1.2" fill="none"/>
<circle cx="292" cy="321" r="7" fill="#2b3a6a" stroke="#111" stroke-width="1"/><circle cx="308" cy="321" r="7" fill="#2b3a6a" stroke="#111" stroke-width="1"/>
<!-- 玉竹标注 -->
<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M200 212 L210 160"/><path d="M128 210 L100 182"/><path d="M152 262 L104 300"/><path d="M262 252 L246 290"/><path d="M160 398 L190 376"/><path d="M100 412 L88 440"/></g>
<g fill="#0b5cad"><circle cx="200" cy="212" r="2.5"/><circle cx="128" cy="210" r="2.5"/><circle cx="152" cy="262" r="2.5"/><circle cx="262" cy="252" r="2.5"/><circle cx="160" cy="398" r="2.5"/><circle cx="100" cy="412" r="2.5"/></g>
<text x="190" y="138" font-size="15"><tspan font-weight="bold">一根</tspan>单生的地上茎</text>
<text x="190" y="157" font-size="15">向一侧<tspan font-weight="bold">弓形弯曲</tspan></text>
<text x="22" y="164" font-size="14">叶<tspan font-weight="bold">互生</tspan>,椭圆形</text>
<text x="22" y="181" font-size="14">排成左右两列</text>
<text x="22" y="314" font-size="14">叶背带灰白色</text>
<text x="160" y="306" font-size="14">花1-4朵生于叶腋</text>
<text x="160" y="323" font-size="14"><tspan font-weight="bold">下垂</tspan>,白色带绿的</text>
<text x="160" y="340" font-size="14">筒状小钟</text>
<text x="300" y="366" font-size="13" text-anchor="middle">浆果<tspan font-weight="bold">蓝黑色</tspan></text>
<text x="194" y="374" font-size="13">圆盘状茎痕</text>
<text x="22" y="460" font-size="14">根茎<tspan font-weight="bold">长圆柱形</tspan>,略扁</text>
<text x="22" y="478" font-size="14">有微隆起的环节</text>
<!-- 药材 -->
<line x1="22" y1="500" x2="343" y2="500" stroke="#ccc" stroke-dasharray="4 3"/>
<text x="26" y="522" font-size="14" fill="#0b5cad">药材</text>
<text x="26" y="544" font-size="14">黄白色或淡黄棕色,半透明</text>
<text x="26" y="564" font-size="14">质硬而脆或稍软,断面角质样</text>
<text x="26" y="584" font-size="14">味甘,<tspan font-weight="bold">嚼之发黏</tspan></text>
<text x="26" y="610" font-size="13" fill="#555">黄精: 叶轮生或互生,药材结节块状</text>

<!-- ② 铃兰 -->
<text x="381" y="92" font-size="18" font-weight="bold" fill="#c33">② 铃兰</text>
<text x="381" y="112" font-size="14" font-style="italic" fill="#555">Convallaria</text>
<rect x="600" y="74" width="98" height="30" rx="5" fill="#c33"/>
<text x="649" y="95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">☠️ 有毒</text>
<text x="698" y="124" font-size="13" fill="#c33" text-anchor="end">全株有毒,含强心苷</text>
<text x="381" y="146" font-size="15" fill="#c33"><tspan font-weight="bold">没有</tspan>弓形的地上茎</text>
<line x1="375" y1="392" x2="700" y2="392" stroke="#999" stroke-width="2"/>
<!-- 两片基生叶 -->
<path d="M468 392 C440 340 404 260 424 196 C450 214 474 300 476 392 Z" fill="#a9c77c" stroke="#333" stroke-width="1.5"/>
<path d="M472 392 C457 320 427 237 424 196 M470 390 C448 330 415 248 424 196 M474 390 C465 310 438 225 424 196" stroke="#5f7f36" stroke-width="0.8" fill="none"/>
<path d="M482 392 C478 320 494 240 520 190 C536 250 520 340 492 392 Z" fill="#b5d08a" stroke="#333" stroke-width="1.5"/>
<path d="M487 392 C499 330 515 245 520 190 M484 390 C488 325 504 242 520 190 M490 390 C509 335 525 248 520 190" stroke="#5f7f36" stroke-width="0.8" fill="none"/>
<path d="M466 392 C466 370 468 352 472 344 L490 344 C494 352 496 370 496 392 Z" fill="#e7dcc2" stroke="#333" stroke-width="1.3"/>
<!-- 花葶 -->
<path d="M494 392 C512 360 548 306 582 262" stroke="#4d6b2a" stroke-width="2" fill="none"/>
<path d="M516 356 Q527 356 527 362 M527 338 Q538 338 538 344 M540 320 Q551 320 551 326 M552 302 Q563 302 563 308 M566 284 Q575 284 575 290 M577 269 Q585 269 585 275" stroke="#4d6b2a" stroke-width="1" fill="none"/>
<use href="#lbell" x="527" y="366"/>
<use href="#lbell" x="538" y="348"/>
<use href="#lbell" x="551" y="330"/>
<use href="#lbell" transform="translate(563 312) scale(0.9)"/>
<use href="#lbell" transform="translate(575 294) scale(0.8)"/>
<use href="#lbell" transform="translate(585 279) scale(0.65)"/>
<!-- 根状茎 -->
<path d="M410 404 H560 C566 404 568 408 568 411 C568 414 566 418 560 418 H410 C404 418 402 414 402 411 C402 408 404 404 410 404 Z" fill="#e7dcc2" stroke="#333" stroke-width="1.3"/>
<g stroke="#8a7a5a" stroke-width="1" fill="none"><path d="M420 418 Q418 432 412 440 M460 418 Q462 432 458 442 M500 418 Q498 432 504 442 M540 418 Q544 430 540 440"/></g>
<!-- 红果插图 -->
<circle cx="440" cy="470" r="30" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="3 3"/>
<path d="M440 446 V456 M440 456 L432 464 M440 456 L448 464" stroke="#4d6b2a" stroke-width="1.2" fill="none"/>
<circle cx="432" cy="471" r="7" fill="#d62a2a" stroke="#7a1a1a" stroke-width="1"/><circle cx="448" cy="471" r="7" fill="#d62a2a" stroke="#7a1a1a" stroke-width="1"/>
<text x="480" y="476" font-size="14">浆果<tspan font-weight="bold" fill="#c33">红色</tspan></text>
<!-- 铃兰标注 -->
<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M432 240 L404 180"/><path d="M506 372 L560 362"/><path d="M572 290 L600 276"/><path d="M480 372 L576 410"/></g>
<g fill="#0b5cad"><circle cx="432" cy="240" r="2.5"/><circle cx="506" cy="372" r="2.5"/><circle cx="572" cy="290" r="2.5"/><circle cx="480" cy="372" r="2.5"/></g>
<text x="381" y="172" font-size="14">通常只有<tspan font-weight="bold">2片</tspan>宽大的叶</text>
<text x="564" y="358" font-size="14">花葶从叶基部抽出</text>
<text x="604" y="250" font-size="14">一串白色</text>
<text x="604" y="267" font-size="14">小铃铛</text>
<text x="604" y="284" font-size="14" font-weight="bold">偏向一侧</text>
<text x="604" y="301" font-size="14">有浓香</text>
<text x="580" y="414" font-size="14"><tspan font-weight="bold">叶从地下直接长出</tspan></text>
<text x="580" y="432" font-size="14">叶基有鞘</text>
<!-- 对照说明 -->
<line x1="377" y1="500" x2="698" y2="500" stroke="#ccc" stroke-dasharray="4 3"/>
<text x="381" y="522" font-size="14" fill="#0b5cad">另两种也要排除</text>
<text x="381" y="546" font-size="14"><tspan font-weight="bold" fill="#c33">万年青</tspan>(全株有毒,含强心苷)</text>
<text x="395" y="565" font-size="13">叶全部基生,厚革质、带状;浆果红色</text>
<text x="381" y="590" font-size="14"><tspan font-weight="bold" fill="#c33">藜芦</tspan>(剧毒)</text>
<text x="395" y="609" font-size="13">叶宽大多纵褶,茎基有棕色纤维状残毛</text>

<!-- 底部 -->
<rect x="10" y="636" width="700" height="214" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="664" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">判断口诀</text>
<text x="360" y="694" font-size="15" text-anchor="middle">玉竹、黄精都有一根直立或弯垂的<tspan font-weight="bold">地上茎</tspan>,</text>
<text x="360" y="716" font-size="15" text-anchor="middle">叶长在茎上,花挂在叶腋下面</text>
<text x="360" y="748" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">叶从地下直接长出、果实红色的,一律不挖</text>
<text x="360" y="780" font-size="14" fill="#555" text-anchor="middle">铃兰含强心苷,误食可致心律失常</text>
<text x="360" y="804" font-size="14" fill="#555" text-anchor="middle">黄精尝到苦味就不是正品(药典: 味苦者不可药用)</text>
<text x="360" y="832" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">挖根之前先认准整株;认不准不挖</text>
</g>
</svg>
