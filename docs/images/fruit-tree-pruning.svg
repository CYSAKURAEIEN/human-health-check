<text x="12" y="174">不剪,</text>
<text x="12" y="192">促进结果</text>
</g>
<text x="14" y="316" font-size="17" font-weight="bold">怎样下剪</text>
<text x="92" y="316" font-size="13" fill="#555">先大后小、先上后下、先里后外;疏掉枯枝、病虫枝、交叉枝、重叠枝、向内长的枝、徒长枝</text>
