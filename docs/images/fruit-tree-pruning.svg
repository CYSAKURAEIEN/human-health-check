<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1242" width="720" height="1242" role="img" aria-label="果树整形修剪。基本方法: 短截是剪短枝条,促发新枝;疏枝是从基部剪除,减少枝量;回缩是剪去多年生枝的一部分,更新复壮;缓放是不剪,促进结果。短截的剪口剪在一个芽的上方约0.5-1 cm处,斜面向芽的背面;剪口芽朝外,新枝才会向外长、树冠开张;留桩太长会枯死成干橛子,病菌从这里侵入;贴芽太近芽会干死。疏枝的剪口贴着枝条基部的领圈剪平,不留桩,也不要削进主干;直径约2 cm以上的剪口、锯口削平后涂蜡、油漆或泥。直径约5 cm以上的大枝用三锯法: 先在要锯处外侧约20-30 cm从下往上锯约1/3深,再在它外侧几 cm处从上往下锯断,最后贴领圈锯掉短桩。常见树形: 自然开心形干高约40-60 cm,没有中心干,3个主枝彼此约120°,上下错开约10-20 cm,与地面夹角约40-60°,每个主枝2-3个侧枝,树高约2.5-3 m,用于桃、李、杏等;疏散分层形有中心干,主枝分2-3层共5-7个,第一层3个、第二层2个、第三层1-2个,层间约80-100 cm,树高约4-5 m,成形需4-6年,用于苹果乔化树、梨、柿、核桃、板栗;纺锤形一根直立的中心干上螺旋状分布10-20个较小的枝,枝条拉成约70-90°甚至下垂,下长上短,树高约2.5-3.5 m,用于矮化密植苹果、梨。">
<rect width="100%" height="100%" fill="#fff"/>
<title>果树整形修剪: 剪法与常见树形</title>
