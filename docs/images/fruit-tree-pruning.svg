<text x="192" y="48" font-size="13" fill="#c33" font-weight="bold">✗ 留桩太长</text>
<text x="274" y="90" font-size="12" fill="#c33">枯死成</text>
<text x="274" y="104" font-size="12" fill="#c33">"干橛子",</text>
<text x="274" y="118" font-size="12" fill="#c33">病菌侵入</text>
<path d="M424,176 V112 L436,108 V176 Z" fill="#8a5a2b" stroke="#333" stroke-width="1.5"/>
<path d="M436,118 q9,-2 10,-13 q-9,2 -10,13 z" fill="#8b6b3e" stroke="#333" stroke-width="1"/>
<text x="364" y="48" font-size="13" fill="#c33" font-weight="bold">✗ 贴芽太近</text>
<text x="452" y="106" font-size="12" fill="#c33">芽会干死</text>
<path d="M556,180 V76" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/>
<text x="560" y="70" font-size="11" fill="#777">树冠中心</text>
