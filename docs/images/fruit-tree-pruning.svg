<text x="240" y="48" font-size="13" fill="#c33" font-weight="bold">✗ 削进主干</text>
<text x="66" y="146" font-size="12" fill="#0b5cad">领圈</text>
<line x1="70" y1="136" x2="58" y2="124" stroke="#0b5cad" stroke-width="1"/>
