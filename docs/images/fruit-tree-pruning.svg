<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">果树整形修剪: 剪法与常见树形</text>
<text x="360" y="50" text-anchor="middle" fill="#555">冬剪(落叶后到春季发芽前)以疏枝、短截、回缩为主,决定第二年树形和产量</text>
<text x="14" y="80" font-size="17" font-weight="bold">基本方法</text>
