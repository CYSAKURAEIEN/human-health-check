<line x1="16" y1="150" x2="156" y2="150" stroke="#8a5a2b" stroke-width="9" stroke-linecap="round"/>
<line x1="46" y1="146" x2="40" y2="50" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/>
