<text x="632" y="140" font-size="12" fill="#0b5cad">新枝向外长,</text>
<text x="632" y="154" font-size="12" fill="#0b5cad">树冠开张</text>
<line x1="10" y1="186" x2="690" y2="186" stroke="#eee"/>
<text x="14" y="203" font-size="13" fill="#555">伤口: 直径约2 cm以上的剪口、锯口削平后,涂蜡、油漆或黄泥加少量牛粪调的泥,防止干裂和病菌侵入</text>
</g>
