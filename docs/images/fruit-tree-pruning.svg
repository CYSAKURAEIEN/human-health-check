<text x="20" y="48" font-size="13" font-weight="bold">✓ 芽上方约0.5-1 cm,</text>
<text x="20" y="66" font-size="13" font-weight="bold">  斜面向芽的背面</text>
<path d="M252,176 V118 H264 V176 Z" fill="#8a5a2b" stroke="#333" stroke-width="1.5"/>
