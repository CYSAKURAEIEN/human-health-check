<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="单套结的打法(兔子出洞,绕树一圈,回到洞里):①在主绳上拧一个小圈,绳头一侧压在上面,这是“洞”,绳头从下往上穿出小圈;②绳头绕到主绳后面;③绳头从上往下穿回小圈,拉紧,得到一个不会收紧的绳圈" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>单套结(称人结)</title>
