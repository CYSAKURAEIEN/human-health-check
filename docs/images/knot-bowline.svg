<path d="M328 122 C340 132 368 122 372 146 L372 196" fill="none" stroke="#c33" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" marker-end="url(#arR)"/>
<text x="123" y="70" font-size="14" fill="#222">主绳</text>
<line x1="121" y1="66" x2="115" y2="66" stroke="#0b5cad" stroke-width="1.3"/><circle cx="115" cy="66" r="2.6" fill="#0b5cad"/>
<text x="360" y="70" font-size="14" fill="#222">主绳</text>
<line x1="358" y1="66" x2="352" y2="66" stroke="#0b5cad" stroke-width="1.3"/><circle cx="352" cy="66" r="2.6" fill="#0b5cad"/>
<text x="597" y="70" font-size="14" fill="#222">主绳</text>
<line x1="595" y1="66" x2="589" y2="66" stroke="#0b5cad" stroke-width="1.3"/><circle cx="589" cy="66" r="2.6" fill="#0b5cad"/>
<text x="197" y="168" font-size="14" fill="#222">“洞”</text>
<line x1="195" y1="164" x2="179" y2="178" stroke="#0b5cad" stroke-width="1.3"/><circle cx="179" cy="178" r="2.6" fill="#0b5cad"/>
<text x="185" y="272" font-size="14" fill="#222">绳头</text>
<line x1="183" y1="266" x2="169" y2="256" stroke="#0b5cad" stroke-width="1.3"/><circle cx="169" cy="256" r="2.6" fill="#0b5cad"/>
<text x="509" y="348" font-size="14" fill="#222">绳圈(不会收紧)</text>
<line x1="545" y1="334" x2="561" y2="296" stroke="#0b5cad" stroke-width="1.3"/><circle cx="561" cy="296" r="2.6" fill="#0b5cad"/>
<text x="653" y="276" font-size="14" fill="#222">绳头</text>
<line x1="651" y1="270" x2="613" y2="256" stroke="#0b5cad" stroke-width="1.3"/><circle cx="613" cy="256" r="2.6" fill="#0b5cad"/>
<text x="123" y="372" font-size="13" fill="#222" text-anchor="middle">① 拧一个小圈(“洞”),绳头一侧</text>
<text x="123" y="392" font-size="13" fill="#222" text-anchor="middle">压在上面;绳头从下往上穿出</text>
<text x="360" y="372" font-size="14" fill="#222" text-anchor="middle">② 绳头绕到</text>
<text x="360" y="392" font-size="14" fill="#222" text-anchor="middle">主绳后面</text>
<text x="597" y="372" font-size="13" fill="#222" text-anchor="middle">③ 从上往下穿回小圈;一手握主绳,</text>
<text x="597" y="392" font-size="13" fill="#222" text-anchor="middle">一手握绳头和绳圈的一边,拉紧</text>
<text x="360" y="430" font-size="14" fill="#222" text-anchor="middle">绳圈受力也不会收紧,受力后也容易解开;不受力、反复抖动时会慢慢松开: 绳头上加一个单结</text>
<text x="360" y="452" font-size="14" fill="#c33" text-anchor="middle">套在人身上作救援只限于专业训练过的人</text>
</svg>
