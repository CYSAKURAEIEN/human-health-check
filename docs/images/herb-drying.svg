<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 868" width="720" height="868" role="img" aria-label="药材的干燥示意: 晒干适用于大多数根及根茎、果实、种子、皮类和不含挥发油的全草,摊薄一层勤翻动,傍晚收回防夜露回潮;阴干适用于花类、叶类和含挥发油的芳香类药材,放在通风的阴凉处或屋檐下,避免暴晒;烘干用于阴雨天、量大或需要快速干燥的药材,用烘房、火炕、低温炉控制温度。烘干温度: 含挥发油的芳香类不超过约35-40°C(教材多取35°C),一般药材约50-60°C,含维生素C的多汁果实约70-90°C快速干燥;含油脂多的种子不宜高温,会走油;颜色鲜艳的花、芳香类、含挥发油的根不宜晒。判断干透: 根和根茎断面没有湿心、折断声音清脆;叶和花一搓就碎;全草茎一折就断;果实种子摇动时声音清脆;皮类一折就断、不弯不软;连续两天称重不再明显减少。宁可多晒一天,不要没干透就装起来">
<rect width="100%" height="100%" fill="#fff"/>
<title>药材的干燥</title>
<defs>
<g id="sl"><ellipse rx="9" ry="4" fill="#e8cfa0" stroke="#333" stroke-width="1"/></g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">药材的干燥: 晒干、阴干、烘干</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">干燥是产地加工最关键的一步: 干得快、干得透,才不霉不坏(具体品种以各章为准)</text>
<rect x="10" y="66" width="226" height="292" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="24" y="90" font-size="16" font-weight="bold">① 晒干</text>
<circle cx="200" cy="116" r="13" fill="#f5c518" stroke="#333" stroke-width="1.5"/>
<path d="M217,116 L224,116 M212,128 L217,133 M200,133 L200,140 M188,128 L183,133 M183,116 L176,116 M188,104 L183,99 M200,99 L200,92 M212,104 L217,99" stroke="#e8a33a" stroke-width="2" stroke-linecap="round"/>
<path d="M46,184 L46,214 M186,184 L186,214" stroke="#8a5a2b" stroke-width="3"/>
<line x1="24" y1="215" x2="222" y2="215" stroke="#999" stroke-width="3"/>
