<path d="M280,700 l-8,-12 M318,672 l10,4" stroke="#7a8a4a" stroke-width="2"/>
<path d="M298,676 l-4,-8 M304,674 l1,-9 M310,676 l5,-7" stroke="#c33" stroke-width="1.5" stroke-linecap="round"/>
<path d="M392,678 L444,678 L438,710 Q418,716 398,710 Z" fill="#f3eadb" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
