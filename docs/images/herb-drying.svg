<text x="68" y="750" font-size="15" font-weight="bold" text-anchor="middle">根、根茎</text>
<text x="68" y="770" font-size="13" fill="#222" text-anchor="middle">断面没有湿心,</text>
<text x="68" y="788" font-size="13" fill="#222" text-anchor="middle">折断声音清脆</text>
<text x="184" y="750" font-size="15" font-weight="bold" text-anchor="middle">叶、花</text>
<text x="184" y="770" font-size="13" fill="#222" text-anchor="middle">一搓就碎,</text>
<text x="184" y="788" font-size="13" fill="#222" text-anchor="middle">一捏成粉</text>
<text x="300" y="750" font-size="15" font-weight="bold" text-anchor="middle">全草</text>
<text x="300" y="770" font-size="13" fill="#222" text-anchor="middle">茎一折就断</text>
<text x="418" y="750" font-size="15" font-weight="bold" text-anchor="middle">果实、种子</text>
<text x="418" y="770" font-size="13" fill="#222" text-anchor="middle">抓一把摇动,</text>
<text x="418" y="788" font-size="13" fill="#222" text-anchor="middle">声音清脆</text>
<text x="536" y="750" font-size="15" font-weight="bold" text-anchor="middle">皮类</text>
<text x="536" y="770" font-size="13" fill="#222" text-anchor="middle">一折就断,</text>
<text x="536" y="788" font-size="13" fill="#222" text-anchor="middle">不弯不软</text>
<text x="652" y="750" font-size="15" font-weight="bold" text-anchor="middle">称重</text>
<text x="652" y="770" font-size="13" fill="#222" text-anchor="middle">连续两天称,</text>
<text x="652" y="788" font-size="13" fill="#222" text-anchor="middle">不再明显减少</text>
<rect x="10" y="816" width="700" height="42" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="360" y="843" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">⚠️ 宁可多晒一天,不要没干透就装起来——几天之内就会发霉</text>
</g>
</svg>
