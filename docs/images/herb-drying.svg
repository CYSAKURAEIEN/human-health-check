<path d="M335,170.3 L331,192.3 M342,170.3 L345,192.3" stroke="#6a8a3a" stroke-width="1"/>
<path d="M381,137.2 L381,151.2" stroke="#555" stroke-width="1.5"/>
<path d="M381,149.2 L371,197.2 L391,197.2 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M377,167.2 L373,189.2 M384,167.2 L387,189.2" stroke="#6a8a3a" stroke-width="1"/>
<path d="M419,134.3 L419,148.3" stroke="#555" stroke-width="1.5"/>
<path d="M419,146.3 L409,194.3 L429,194.3 Z" fill="#cfe3b0" stroke="#333" stroke-width="1.3" stroke-linejoin="round"/>
<path d="M415,164.3 L411,186.3 M422,164.3 L425,186.3" stroke="#6a8a3a" stroke-width="1"/>
<path d="M267,216 q20,-8 40,0 t40,0 t40,0 t40,0 M277,228 q20,-8 40,0 t40,0 t40,0" fill="none" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M425,210 l8,6 l-9,4" fill="none" stroke="#0b5cad" stroke-width="1.5"/>
<text x="443" y="232" font-size="13" fill="#0b5cad" text-anchor="middle">通风</text>
<text x="261" y="260" font-size="13" fill="#222" text-anchor="start"><tspan font-weight="bold">适用:</tspan> 花类、叶类、</text>
<text x="261" y="278" font-size="13" fill="#222" text-anchor="start">含挥发油的芳香类</text>
<text x="261" y="296" font-size="13" fill="#222" text-anchor="start">(薄荷、荆芥、紫苏、当归)</text>
<text x="261" y="320" font-size="13" fill="#0b5cad" text-anchor="start">通风的阴凉处或屋檐下;</text>
<text x="261" y="338" font-size="13" fill="#0b5cad" text-anchor="start">避免暴晒散失香气和褪色</text>
<rect x="484" y="66" width="226" height="292" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="498" y="90" font-size="16" font-weight="bold">③ 烘干</text>
<rect x="514" y="172" width="140" height="52" rx="3" fill="#d9c8b0" stroke="#333" stroke-width="1.8"/>
<rect x="564" y="194" width="40" height="30" rx="2" fill="#555" stroke="#333" stroke-width="1.5"/>
<path d="M572,224 C568,212 578,208 576,198 C584,206 590,210 586,198 C596,208 600,216 596,224 Z" fill="#e8a33a" stroke="#c33" stroke-width="1.2"/>
