<use href="#sl" x="126" y="176"/>
<use href="#sl" x="146" y="176"/>
<use href="#sl" x="166" y="176"/>
<use href="#sl" x="186" y="176"/>
<path d="M80,164 C90,142 120,142 130,160" fill="none" stroke="#c33" stroke-width="2"/><path d="M124,156 L131,163 L134,153" fill="none" stroke="#c33" stroke-width="2"/>
<text x="140" y="158" font-size="13" fill="#c33">勤翻动</text>
<text x="24" y="260" font-size="13" fill="#222" text-anchor="start"><tspan font-weight="bold">适用:</tspan> 大多数根及根茎、</text>
<text x="24" y="278" font-size="13" fill="#222" text-anchor="start">果实、种子、皮类,</text>
<text x="24" y="296" font-size="13" fill="#222" text-anchor="start">不含挥发油的全草</text>
<text x="24" y="320" font-size="13" fill="#0b5cad" text-anchor="start">摊薄一层,勤翻动;</text>
<text x="24" y="338" font-size="13" fill="#0b5cad" text-anchor="start">傍晚收回,防夜露回潮</text>
<rect x="247" y="66" width="226" height="292" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="261" y="90" font-size="16" font-weight="bold">② 阴干</text>
<path d="M259,132 L397,106 L461,118 L461,130 L397,120 L259,146 Z" fill="#b9a68a" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
