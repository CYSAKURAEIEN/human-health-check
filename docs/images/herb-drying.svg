<use href="#sl" x="648" y="158"/>
<path d="M544,150 q-5,-8 0,-16 t0,-16 M584,150 q-5,-8 0,-16 t0,-16 M624,150 q-5,-8 0,-16 t0,-16" fill="none" stroke="#c33" stroke-width="1.3" opacity="0.7"/>
<rect x="675" y="112" width="10" height="64" rx="5" fill="#fff" stroke="#333" stroke-width="1.5"/><rect x="678" y="138" width="4" height="40" fill="#c33"/><circle cx="680" cy="182" r="8" fill="#c33" stroke="#333" stroke-width="1.5"/>
<text x="680" y="208" font-size="13" fill="#c33" text-anchor="middle">控温</text>
<text x="498" y="260" font-size="13" fill="#222" text-anchor="start"><tspan font-weight="bold">适用:</tspan> 阴雨天、量大、</text>
<text x="498" y="278" font-size="13" fill="#222" text-anchor="start">或需要快速干燥的药材</text>
<text x="498" y="320" font-size="13" fill="#0b5cad" text-anchor="start">用烘房、火炕、低温炉,</text>
<text x="498" y="338" font-size="13" fill="#0b5cad" text-anchor="start">控制温度(见下)</text>
<rect x="10" y="370" width="700" height="230" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="24" y="394" font-size="16" font-weight="bold">④ 烘干温度(参考教材的一般原则)</text>
<line x1="236" y1="520" x2="690" y2="520" stroke="#333" stroke-width="1.5"/>
<line x1="236" y1="520" x2="236" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="236" y="540" font-size="12" fill="#555" text-anchor="middle">30°C</text>
<line x1="236" y1="410" x2="236" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="311.7" y1="520" x2="311.7" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="311.7" y="540" font-size="12" fill="#555" text-anchor="middle">40°C</text>
<line x1="311.7" y1="410" x2="311.7" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="387.3" y1="520" x2="387.3" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="387.3" y="540" font-size="12" fill="#555" text-anchor="middle">50°C</text>
<line x1="387.3" y1="410" x2="387.3" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="463" y1="520" x2="463" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="463" y="540" font-size="12" fill="#555" text-anchor="middle">60°C</text>
<line x1="463" y1="410" x2="463" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="538.7" y1="520" x2="538.7" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="538.7" y="540" font-size="12" fill="#555" text-anchor="middle">70°C</text>
<line x1="538.7" y1="410" x2="538.7" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="614.3" y1="520" x2="614.3" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="614.3" y="540" font-size="12" fill="#555" text-anchor="middle">80°C</text>
<line x1="614.3" y1="410" x2="614.3" y2="520" stroke="#eee" stroke-width="1"/>
<line x1="690" y1="520" x2="690" y2="525" stroke="#333" stroke-width="1.5"/>
<text x="690" y="540" font-size="12" fill="#555" text-anchor="middle">90°C</text>
<line x1="690" y1="410" x2="690" y2="520" stroke="#eee" stroke-width="1"/>
<text x="24" y="431" font-size="14">含挥发油的芳香类</text>
<path d="M222,426 L236,416 L273.8,416 L273.8,436 L236,436 Z" fill="#8fbf6a" stroke="#333" stroke-width="1" stroke-linejoin="round"/>
<rect x="273.8" y="416" width="37.8" height="20" fill="#8fbf6a" fill-opacity="0.4" stroke="#333" stroke-width="1" stroke-dasharray="3 2"/>
<text x="319.7" y="431" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="start">不超过约35-40°C<tspan font-weight="normal" font-size="12" fill="#555"> (教材多取35°C)</tspan></text>
<text x="24" y="467" font-size="14">一般药材</text>
<rect x="387.3" y="452" width="75.7" height="20" fill="#e8a33a" stroke="#333" stroke-width="1"/>
<text x="471" y="467" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="start">约50-60°C<tspan font-weight="normal" font-size="12" fill="#555"> </tspan></text>
<text x="24" y="503" font-size="14">含维生素C的多汁果实</text>
<rect x="538.7" y="488" width="151.3" height="20" fill="#d9534f" stroke="#333" stroke-width="1"/>
<text x="530.7" y="503" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="end">约70-90°C,快速干燥<tspan font-weight="normal" font-size="12" fill="#555"> </tspan></text>
<text x="24" y="567" font-size="13" fill="#222" text-anchor="start"><tspan fill="#c33" font-weight="bold">✗ 不宜高温:</tspan> 含油脂多的种子(杏仁、桃仁、柏子仁),高温会"走油"</text>
<text x="24" y="587" font-size="13" fill="#222" text-anchor="start"><tspan fill="#c33" font-weight="bold">✗ 不宜晒:</tspan> 颜色鲜艳的花(红花、金银花)、芳香类、含挥发油的根(当归、川芎)</text>
<rect x="10" y="612" width="700" height="192" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="24" y="636" font-size="16" font-weight="bold">⑤ 怎样判断干透</text>
<path d="M28,684 L62,680 L66,688 L62,696 L28,700 Z" fill="#e8cfa0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M74,676 L108,672 L108,688 L74,692 L78,684 Z" fill="#e8cfa0" stroke="#333" stroke-width="1.5" stroke-linejoin="round"/>
