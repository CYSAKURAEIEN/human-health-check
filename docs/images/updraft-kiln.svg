<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img" aria-label="简易升焰窑剖面: 下面是燃烧室(火膛),上面是放坯子的窑室,中间隔一层有孔的窑箅(炉栅);窑壁用土坯或砖砌,内外抹泥,上面留烟口;火从下往上穿过陶坯,从顶部烟口排出。坯子码放在窑箅上,之间留缝让火通过。烧窑: ① 小火慢烘几个小时,先让残余的水分和黏土里的结合水慢慢出来,烟口看到白烟(水汽)时保持小火,这一阶段升温太快最容易炸坯;② 白烟消失后逐渐加大火力,烧到需要的火色,保持一两个小时;③ 封住火口和烟口,让窑慢慢冷却一两天,绝不提前打开,冷却太快会让陶器开裂。看火色判断温度: 暗红色约600-700°C,樱桃红约800-900°C,橙色约1000-1100°C,黄白色约1200°C以上;约600°C以上黏土变成陶,普通陶器约800-1000°C,炻器、瓷器约1200-1300°C以上">
<rect width="100%" height="100%" fill="#fff"/>
<title>简易升焰窑</title>
<defs>
<pattern id="brick" width="24" height="12" patternUnits="userSpaceOnUse"><rect width="24" height="12" fill="#d9a07a"/><path d="M0 0.5 H24 M0 6.5 H24 M6 0.5 V6.5 M18 6.5 V12" stroke="#a0623e" stroke-width="1"/></pattern>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<path id="pot" d="M-16 0 Q-25 -22 -12 -38 L-10 -46 H10 L12 -38 Q25 -22 16 0 Z"/>
<g id="log"><rect x="-22" y="-5" width="44" height="10" rx="4" fill="#8b6b3e" stroke="#333" stroke-width="1.3"/><ellipse cx="22" cy="0" rx="3" ry="5" fill="#c9a26a" stroke="#333" stroke-width="1"/></g>
<g id="mk">
<path d="M-42 50 V-4 Q-42 -36 -7 -42 M42 50 V-4 Q42 -36 7 -42" fill="none" stroke="#a0623e" stroke-width="9"/>
<path d="M-46.5 50 V-4 Q-46.5 -40.5 -7 -46.5 M46.5 50 V-4 Q46.5 -40.5 7 -46.5 M-37.5 50 V-4 Q-37.5 -31.5 -7 -37.5 M37.5 50 V-4 Q37.5 -31.5 7 -37.5" fill="none" stroke="#333" stroke-width="1.5"/>
<path d="M-60 50 H60" stroke="#999" stroke-width="3"/>
<path d="M-37.5 16 H37.5" stroke="#c98b5a" stroke-width="5" stroke-dasharray="9 4"/>
<use href="#pot" transform="translate(-16,13.5) scale(0.42)" fill="#e7c9a3" stroke="#333" stroke-width="3"/>
<use href="#pot" transform="translate(16,13.5) scale(0.42)" fill="#e7c9a3" stroke="#333" stroke-width="3"/>
</g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">简易升焰窑(剖面示意,不按比例)</text>

<!-- 剖面 -->
<path d="M94 370 V156 Q200 56 306 156 V370 Z" fill="#fff8ef"/>
<rect x="186" y="70" width="28" height="40" fill="#fff8ef"/>
<path d="M70 370 V150 Q128 96.5 186 90.7 L186 106.9 Q140 112.6 94 156 V370 Z" fill="url(#brick)" stroke="#333" stroke-width="2"/>
<path d="M330 370 V150 Q272 96.5 214 90.7 L214 106.9 Q260 112.6 306 156 V370 Z" fill="url(#brick)" stroke="#333" stroke-width="2"/>
<rect x="176" y="70" width="10" height="34" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<rect x="214" y="70" width="10" height="34" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<!-- 火口 -->
<rect x="68" y="324" width="28" height="45" fill="#fff8ef"/>
<path d="M69 369 V330 Q82 318 95 330 V369" fill="none" stroke="#333" stroke-width="1.5"/>
<!-- 燃烧室里的柴和火 -->
<path d="M110 356 Q122 300 140 330 Q150 282 170 322 Q186 270 202 320 Q218 286 230 326 Q248 296 262 336 Q280 310 290 356 Z" fill="#f2a33a" fill-opacity="0.85" stroke="#c33" stroke-width="1.5"/>
<path d="M150 356 Q160 326 176 342 Q190 314 206 340 Q222 322 240 356 Z" fill="#f6d36b"/>
<use href="#log" x="100" y="360"/><use href="#log" x="150" y="360"/><use href="#log" x="196" y="356"/><use href="#log" x="244" y="360"/>
<path d="M20 370 H380" stroke="#999" stroke-width="3"/>
<!-- 窑箅 -->
<rect x="94" y="268" width="212" height="12" fill="#c98b5a" stroke="#333" stroke-width="1.5"/>
<g fill="#fbe3c8" stroke="#333" stroke-width="1">
<rect x="101.5" y="268" width="8" height="12"/><rect x="133" y="268" width="8" height="12"/><rect x="164.5" y="268" width="8" height="12"/><rect x="196" y="268" width="8" height="12"/><rect x="227.5" y="268" width="8" height="12"/><rect x="259" y="268" width="8" height="12"/><rect x="290.5" y="268" width="8" height="12"/>
</g>
<!-- 坯子 -->
<g fill="#e7c9a3" stroke="#333" stroke-width="1.6">
<use href="#pot" x="137" y="268"/><use href="#pot" x="200" y="268"/><use href="#pot" x="263" y="268"/>
<use href="#pot" x="137" y="222"/><use href="#pot" x="200" y="222"/><use href="#pot" x="263" y="222"/>
</g>
<!-- 火路 -->
<g fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)">
<path d="M168.5 300 V190 Q168.5 150 194 120 V62"/>
<path d="M231.5 300 V190 Q231.5 150 206 120 V62"/>
<path d="M105.5 300 V200 Q105.5 160 140 140"/>
<path d="M294.5 300 V200 Q294.5 160 260 140"/>
</g>
<path d="M196 56 Q186 46 196 38 Q206 30 198 20" fill="none" stroke="#888" stroke-width="2"/>

<!-- 标注 -->
<g stroke="#0b5cad" stroke-width="1.2">
<line x1="356" y1="62" x2="226" y2="78"/><line x1="356" y1="140" x2="318" y2="190"/><line x1="356" y1="204" x2="286" y2="236"/><line x1="356" y1="270" x2="300" y2="274"/><line x1="356" y1="326" x2="286" y2="340"/><line x1="44" y1="384" x2="74" y2="350"/>
</g>
<g fill="#0b5cad"><circle cx="226" cy="78" r="2.6"/><circle cx="318" cy="190" r="2.6"/><circle cx="286" cy="236" r="2.6"/><circle cx="300" cy="274" r="2.6"/><circle cx="286" cy="340" r="2.6"/><circle cx="74" cy="350" r="2.6"/></g>
<text x="362" y="60" font-size="15" font-weight="bold">烟口</text>
<text x="402" y="60">火和烟从顶部排出</text>
<text x="362" y="138" font-size="15" font-weight="bold">窑壁</text>
<text x="402" y="138">土坯或砖砌,内外抹泥</text>
<text x="362" y="202" font-size="15" font-weight="bold">窑室</text>
<text x="402" y="202">坯子码放在窑箅上,</text>
<text x="402" y="222">之间留缝让火通过</text>
<text x="362" y="268" font-size="15" font-weight="bold">窑箅(炉栅)</text>
<text x="456" y="268">有孔,隔开上下</text>
<text x="362" y="324" font-size="15" font-weight="bold">燃烧室(火膛)</text>
<text x="20" y="400" font-size="15" font-weight="bold">火口</text>
<path d="M440 100 H476" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="484" y="98" fill="#c33">火从下往上穿过陶坯,</text>
<text x="484" y="116" fill="#c33">从顶部烟口排出</text>

<!-- 烧窑三步 -->
<text x="20" y="432" font-size="16" font-weight="bold">烧窑</text>
<g transform="translate(10,444)">
<rect x="0" y="0" width="226" height="226" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">① 小火慢烘几个小时</text>
<g transform="translate(113,98)">
<use href="#mk"/>
<path d="M-14 46 Q-8 30 -2 40 Q4 26 10 40 Q14 34 16 46 Z" fill="#f2a33a" stroke="#c33" stroke-width="1"/>
<path d="M-10 -52 q-8 -4 -2 -10 q2 -8 10 -4 q8 -6 12 2 q8 2 2 10 q-2 6 -10 4 q-6 4 -12 -2 Z" fill="#fff" stroke="#888" stroke-width="1.5"/>
</g>
<text x="150" y="44" font-size="13" fill="#555">白烟(水汽)</text>
<text x="12" y="172" font-size="13">先让残余的水分和黏土里的</text>
<text x="12" y="190" font-size="13">结合水慢慢出来;烟口看到</text>
<text x="12" y="208" font-size="13">"白烟"时保持小火</text>
</g>
<g transform="translate(247,444)">
<rect x="0" y="0" width="226" height="226" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">② 白烟消失后加大火力</text>
<g transform="translate(113,98)">
<path d="M-37.5 50 V-4 Q-37.5 -31.5 -7 -37.5 H7 Q37.5 -31.5 37.5 -4 V50 Z" fill="#f08a24" fill-opacity="0.35"/>
<use href="#mk"/>
<path d="M-34 46 Q-28 22 -18 34 Q-10 14 0 32 Q10 12 18 34 Q28 22 34 46 Z" fill="#f2a33a" stroke="#c33" stroke-width="1"/>
<path d="M0 -10 V-56" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
</g>
<text x="12" y="172" font-size="13">逐渐加大火力,烧到需要的</text>
<text x="12" y="190" font-size="13">火色(见下),保持一两个小时</text>
</g>
<g transform="translate(484,444)">
<rect x="0" y="0" width="226" height="226" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">③ 封住火口和烟口</text>
<g transform="translate(113,98)">
<use href="#mk"/>
<rect x="-16" y="-52" width="32" height="9" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<rect x="-51" y="24" width="18" height="26" fill="url(#brick)" stroke="#333" stroke-width="1.5"/>
<text x="-62" y="20" font-size="12" fill="#0b5cad" text-anchor="end">封</text>
<text x="26" y="-48" font-size="12" fill="#0b5cad">封</text>
</g>
<text x="12" y="172" font-size="13">让窑慢慢冷却一两天</text>
<text x="12" y="190" font-size="13">冷却太快会让陶器开裂(冷裂)</text>
</g>
<text x="20" y="696" font-size="14" font-weight="bold" fill="#c33">⚠️ 第①步升温太快最容易炸坯;第③步绝不提前打开窑</text>

<!-- 火色 -->
<text x="20" y="728" font-size="15" font-weight="bold">看火色判断温度</text>
<g font-size="13">
<rect x="150" y="712" width="132" height="22" fill="#8b1a1a" stroke="#333"/>
<rect x="290" y="712" width="132" height="22" fill="#d2232a" stroke="#333"/>
<rect x="430" y="712" width="132" height="22" fill="#f08a24" stroke="#333"/>
<rect x="570" y="712" width="132" height="22" fill="#fff3b0" stroke="#333"/>
<text x="216" y="752" text-anchor="middle">暗红色 约600-700°C</text>
<text x="356" y="752" text-anchor="middle">樱桃红 约800-900°C</text>
<text x="496" y="752" text-anchor="middle">橙色 约1000-1100°C</text>
<text x="636" y="752" text-anchor="middle">黄白色 约1200°C以上</text>
<text x="20" y="782" fill="#555">约600°C以上黏土变成陶;普通陶器约800-1000°C;炻器、瓷器约1200-1300°C以上,需要好的窑和耐火材料</text>
</g>
</g>
</svg>
