<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="平结的打法:①左绳头压在右绳头上,绕一圈;②右绳头压在左绳头上,再绕一圈;③拉紧后两个绳头和各自的主绳并排,从同一侧出来。两次都是左压右会打成一拉就滑的祖母结。平结只用来捆扎,不要用来连接两根承重的绳子" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>平结</title>
