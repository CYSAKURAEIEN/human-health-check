<text x="24" y="296" font-size="14" fill="#222">左绳头</text>
<text x="222" y="296" font-size="14" fill="#222" text-anchor="end">右绳头</text>
<text x="259" y="142" font-size="13" fill="#0b5cad">第二次</text>
<text x="259" y="160" font-size="13" fill="#0b5cad">右压左</text>
<text x="259" y="272" font-size="13" fill="#0b5cad">第一次</text>
<text x="259" y="290" font-size="13" fill="#0b5cad">左压右</text>
<text x="490" y="161" font-size="14" fill="#222">绳头</text>
<text x="704" y="174" font-size="14" fill="#222" text-anchor="end">绳头</text>
<text x="490" y="254" font-size="14" fill="#222">主绳</text>
<text x="704" y="244" font-size="14" fill="#222" text-anchor="end">主绳</text>
<text x="597" y="304" font-size="14" fill="#0b5cad" text-anchor="middle">两个绳头和各自的主绳</text>
<text x="597" y="324" font-size="14" fill="#0b5cad" text-anchor="middle">并排,从同一侧出来</text>
<text x="123" y="410" font-size="14" fill="#222" text-anchor="middle">① 左绳头压在右绳头上,</text>
<text x="123" y="430" font-size="14" fill="#222" text-anchor="middle">绕一圈</text>
<text x="360" y="410" font-size="14" fill="#222" text-anchor="middle">② 右绳头压在左绳头上,</text>
<text x="360" y="430" font-size="14" fill="#222" text-anchor="middle">再绕一圈</text>
<text x="597" y="410" font-size="14" fill="#222" text-anchor="middle">③ 拉紧</text>
<text x="597" y="430" font-size="14" fill="#222" text-anchor="middle"></text>
<text x="360" y="468" font-size="14" fill="#222" text-anchor="middle">✗ 两次都是“左压右”,打出来是歪的祖母结,一拉就滑(两个绳头颜色不同只是为了看清)</text>
<text x="360" y="492" font-size="14" fill="#c33" text-anchor="middle" font-weight="bold">⚠ 平结只用于捆扎,不要用来连接两根承重的绳子</text>
</svg>
