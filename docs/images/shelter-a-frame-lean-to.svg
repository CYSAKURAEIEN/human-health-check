<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 742" width="720" height="742" role="img" aria-label="两种简易庇护所: A字庇护所的主梁比身高长约1 m,高的一端架在齐腰高约1 m的支撑上,低的一端着地,肋骨斜靠在两侧、间距约20 cm,先编细枝再盖树枝树叶,底部铺厚厚的干草树叶,入口背风;单坡庇护所两根支柱加横梁,横梁高约1-1.5 m,斜面约45°-60°背对风向,覆盖物从下往上一层压一层,开口前约1 m生火,火的另一侧垒反射墙">
<rect width="100%" height="100%" fill="#fff"/>
<title>A字庇护所和单坡庇护所</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<pattern id="thatch" width="16" height="12" patternUnits="userSpaceOnUse"><rect width="16" height="12" fill="#a9b86a"/><path d="M1,10 Q4,3 8,1 M8,11 Q11,5 15,3 M-2,5 Q0,2 2,1" fill="none" stroke="#5f7330" stroke-width="1.4"/></pattern>
<pattern id="leaf" width="12" height="8" patternUnits="userSpaceOnUse"><rect width="12" height="8" fill="#d6b675"/><path d="M1,6 Q4,1 7,4 M6,8 Q9,4 12,6" fill="none" stroke="#8f6d2e" stroke-width="1.2"/></pattern>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">两种简易庇护所: 入口都背对风</text>
<g transform="translate(10,44)">
