<circle cx="124" cy="230" r="2.5" fill="#0b5cad"/>
<text x="474" y="214" font-size="14" fill="#0b5cad" text-anchor="start">底部铺厚厚的干草、树叶隔地</text>
<text x="474" y="232" font-size="14" fill="#0b5cad" text-anchor="start">(松散时厚30 cm以上)</text>
