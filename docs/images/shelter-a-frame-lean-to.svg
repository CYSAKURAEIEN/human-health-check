<text x="18" y="712" font-size="14">A字: 两侧挡风、防雨,里面只要能躺下、翻身就够,空间越小越暖和</text>
<text x="18" y="732" font-size="14">单坡: 只挡一面,风向改变时不保暖;没有火时不如A字庇护所</text>
