<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-label="粮食够吃多久: 可用天数 = 库存总量 ÷ 每天的消耗量。例: 粮仓有2000 kg粮食,40人,每人每天约0.5 kg。① 每天消耗 = 40 × 0.5 = 20 kg。② 可用天数 = 2000 ÷ 20 = 100天;离下一次收获还有150天,缺口 = 50天 × 20 kg = 1000 kg。③ 现在就要想办法: 节约、补种快熟作物、采集、交换;定量要及早开始,等到快吃完才定量就晚了;种子粮单独保存、单独记账,绝不当口粮吃。大致的粮食需要: 以粮食为主食时,成年人每天约0.5 kg粮食,约1700-1800 kcal;重体力劳动、哺乳期妇女需要更多,儿童、老人少一些;一个100人的社区,一年约需要18 t粮食;留出损耗和来年的种子" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>粮食够吃多久</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker>
<g id="person" stroke="#333" stroke-width="1.5"><circle cx="0" cy="-22" r="6" fill="#f3e3d3"/><path d="M-8,0 V-10 Q-8,-14 -4,-14 H4 Q8,-14 8,-10 V0 Z" fill="#cfe0f0"/></g>
<g id="sack" stroke="#333" stroke-width="2" stroke-linejoin="round"><path d="M-22,24 Q-28,0 -14,-16 L-8,-22 H8 L14,-16 Q28,0 22,24 Z" fill="#e8dcc0"/><path d="M-10,-18 H10" fill="none"/></g>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">粮食够吃多久: 可用天数 = 库存总量 ÷ 每天的消耗量</text>
<text x="360" y="50" font-size="13" fill="#555" text-anchor="middle">例: 粮仓有2000 kg粮食,40人,每人每天约0.5 kg</text>

<!-- ① 每天消耗 -->
<rect x="8" y="64" width="704" height="116" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="88" font-size="15" font-weight="bold">① 先算每天消耗多少</text>
<g transform="translate(60,140)">
<use href="#person" x="-20"/><use href="#person"/><use href="#person" x="20"/>
</g>
<text x="60" y="166" font-size="14" font-weight="bold" text-anchor="middle">40人</text>
<text x="128" y="134" font-size="24" text-anchor="middle">×</text>
<g transform="translate(196,128)" stroke="#333" stroke-width="2">
<path d="M-26,-6 H26 Q24,20 0,22 Q-24,20 -26,-6 Z" fill="#fff"/>
<path d="M-22,-6 Q-14,-16 0,-14 Q14,-16 22,-6 Z" fill="#f5ecc8" stroke-width="1.5"/>
</g>
<text x="196" y="166" font-size="14" font-weight="bold" text-anchor="middle">每人每天约0.5 kg</text>
<text x="282" y="134" font-size="24" text-anchor="middle">=</text>
<use href="#sack" x="340" y="124"/>
<text x="340" y="132" font-size="12" font-weight="bold" text-anchor="middle">20 kg</text>
<text x="340" y="166" font-size="14" font-weight="bold" text-anchor="middle" fill="#0b5cad">每天消耗20 kg</text>
<rect x="430" y="100" width="270" height="70" rx="4" fill="#e3eefa" stroke="#0b5cad" stroke-width="1.2"/>
<text x="565" y="126" font-size="14" text-anchor="middle">每天消耗 = 40 × 0.5 = 20 kg</text>
<text x="565" y="152" font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">可用天数 = 2000 ÷ 20 = 100天</text>

<!-- ② 时间线 -->
<rect x="8" y="190" width="704" height="290" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="214" font-size="15" font-weight="bold">② 和下一次收获比一比</text>
<!-- 坐标: 天 0..150 → x 100..640 (3.6 px/天); 库存 2000 → y 240, 0 → y 380, -1000 → y 450 -->
<path d="M100,240 V450" stroke="#555" stroke-width="1.5"/>
<path d="M100,380 H660" stroke="#555" stroke-width="1.5" marker-end="url(#arK)"/>
<g stroke="#ddd" stroke-width="1"><path d="M100,240 H640 M100,310 H640"/></g>
<g font-size="12" text-anchor="end" fill="#555">
<text x="94" y="244">2000 kg</text>
<text x="94" y="314">1000 kg</text>
<text x="94" y="384">0</text>
</g>
<text x="664" y="398" font-size="12" text-anchor="end" fill="#555">天</text>
<!-- 库存下降 -->
<path d="M100,240 L460,380 L100,380 Z" fill="#f5ecc8"/>
<path d="M100,240 L460,380" stroke="#0b5cad" stroke-width="3"/>
<!-- 缺口 -->
<path d="M460,380 L640,450 L640,380 Z" fill="#fbe9e9"/>
<path d="M460,380 L640,450" stroke="#c33" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M640,234 V462" stroke="#2e7d32" stroke-width="2"/>
<!-- 刻度 -->
<g font-size="12" text-anchor="middle" fill="#555">
<text x="100" y="398">0</text>
</g>
<path d="M460,376 V384 M640,376 V384" stroke="#555" stroke-width="1.5"/>
<text x="452" y="400" font-size="13" font-weight="bold" fill="#0b5cad" text-anchor="end">第100天吃完</text>
<!-- 收获 -->
<g transform="translate(640,230)" stroke="#2e7d32" stroke-width="2" fill="none">
<path d="M0,0 V-14 M0,-14 q-6,-4 -6,-10 M0,-14 q6,-4 6,-10 M0,-6 q-7,-3 -8,-9 M0,-6 q7,-3 8,-9"/>
</g>
<text x="632" y="256" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="end">第150天: 下一次收获</text>
<text x="200" y="268" font-size="13" fill="#0b5cad">库存2000 kg,每天少20 kg</text>
<!-- 尺寸线 -->
<path d="M102,424 H458" stroke="#0b5cad" stroke-width="1.5" marker-start="url(#arB)" marker-end="url(#arB)"/>
<text x="280" y="418" font-size="13" font-weight="bold" fill="#0b5cad" text-anchor="middle">够吃100天</text>
<path d="M462,466 H638" stroke="#c33" stroke-width="1.5" marker-start="url(#arR)" marker-end="url(#arR)"/>
<text x="550" y="460" font-size="13" font-weight="bold" fill="#c33" text-anchor="middle">还差50天</text>
<text x="550" y="334" font-size="13" font-weight="bold" fill="#c33" text-anchor="middle">缺口 = 50天 × 20 kg</text>
<text x="550" y="354" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">= 1000 kg</text>

<!-- ③ 现在就要想办法 -->
<rect x="8" y="490" width="704" height="200" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="514" font-size="15" font-weight="bold">③ 发现缺口,现在就要想办法</text>
<g stroke="#0b5cad" stroke-width="1.2" fill="#e3eefa">
<rect x="18" y="526" width="80" height="32" rx="16"/>
<rect x="106" y="526" width="128" height="32" rx="16"/>
<rect x="242" y="526" width="80" height="32" rx="16"/>
<rect x="330" y="526" width="80" height="32" rx="16"/>
</g>
<g font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">
<text x="58" y="547">节约</text>
<text x="170" y="547">补种快熟作物</text>
<text x="282" y="547">采集</text>
<text x="370" y="547">交换</text>
</g>
<g font-size="13">
<text x="20" y="584" font-weight="bold" fill="#c33">⚠ 定量要及早开始: 等到快吃完才定量就晚了</text>
<text x="20" y="606" font-weight="bold" fill="#c33">⚠ 种子粮单独保存、单独记账,绝不当口粮吃</text>
<text x="38" y="624" font-size="12" fill="#555">(吃掉种子就没有明年)</text>
<text x="20" y="648">配给按需要分,同时分配豆类、蔬菜、油;</text>
<text x="20" y="668">病人、老人、残疾人不能因为不能劳动就少分</text>
</g>
<rect x="420" y="526" width="282" height="154" rx="4" fill="#fffbe8" stroke="#d9c98a" stroke-width="1"/>
<g font-size="13">
<text x="432" y="548" font-weight="bold">大致的粮食需要</text>
<text x="432" y="570">· 以粮食为主食时,成年人每天约</text>
<text x="444" y="588"><tspan font-weight="bold">0.5 kg</tspan>粮食(约1700-1800 kcal)</text>
<text x="432" y="610">· 重体力劳动、哺乳期妇女需要更多;</text>
<text x="444" y="628">儿童、老人少一些</text>
<text x="432" y="650">· 100人的社区,一年约需要<tspan font-weight="bold">18 t</tspan>粮食</text>
<text x="432" y="670">· 留出损耗和来年的种子</text>
</g>
</g>
</svg>
