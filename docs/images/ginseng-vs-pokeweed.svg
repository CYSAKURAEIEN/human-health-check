<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" width="720" height="850" role="img" aria-label="人参与商陆对照示意: 路边、荒地、村旁挖到的分叉粗根常被当作野山参,几乎都不是人参,而是有毒的商陆根。人参是矮小草本,高约30-60 cm,掌状复叶轮生于茎顶(通常3-6片,每片复叶多为5片小叶),顶生伞形花序,结一簇鲜红色扁球形小浆果;根顶端有芦头(根茎),上有碗状茎痕(芦碗),主根纺锤形或圆柱形,下部有2-3条支根,须根上有疣状突起(珍珠点);断面淡黄白色、有粉性,有一圈棕黄色的形成层环,皮部有黄棕色小点和放射状裂隙。商陆全株有毒,是高大草本,高约1-2 m,茎粗壮、常带紫红色,单叶、大、椭圆形、全缘、互生,浆果紫黑色、一串串像葡萄(商陆果穗直立,垂序商陆果穗下垂);根粗壮肉质、圆锥形、常有分叉,外皮淡黄色或灰褐色,没有芦头,横切面有多层同心环纹(罗盘纹),这是很重要的识别点。野生人参受国家保护,不能采挖、买卖;认不准不挖不吃">
<rect width="100%" height="100%" fill="#fff"/>
<title>人参与商陆对照</title>
<defs>
<g id="pleaf"><path d="M0 0 L40 0" stroke="#4d6b2a" stroke-width="2.5"/><g fill="#bcd68e" stroke="#333" stroke-width="1.2"><path transform="translate(40 0) rotate(-60)" d="M0 0 C4.8 -3.5 12 -5.5 19.2 -4 Q24.5 -2 24 0 Q24.5 2 19.2 4 C12 5.5 4.8 3.5 0 0Z"/><path transform="translate(40 0) rotate(-30)" d="M0 0 C7.2 -5.3 18 -8.3 28.8 -6 Q36.7 -3 36 0 Q36.7 3 28.8 6 C18 8.3 7.2 5.3 0 0Z"/><path transform="translate(40 0)" d="M0 0 C8.8 -6.5 22 -10.2 35.2 -7.4 Q44.9 -3.7 44 0 Q44.9 3.7 35.2 7.4 C22 10.2 8.8 6.5 0 0Z"/><path transform="translate(40 0) rotate(30)" d="M0 0 C7.2 -5.3 18 -8.3 28.8 -6 Q36.7 -3 36 0 Q36.7 3 28.8 6 C18 8.3 7.2 5.3 0 0Z"/><path transform="translate(40 0) rotate(60)" d="M0 0 C4.8 -3.5 12 -5.5 19.2 -4 Q24.5 -2 24 0 Q24.5 2 19.2 4 C12 5.5 4.8 3.5 0 0Z"/></g></g>
<g id="umbel"><path d="M0 10 L0 -2 M0 10 L-9 -2 M0 10 L-7.3 -6.8 M0 10 L-2.8 -9.7 M0 10 L2.8 -9.7 M0 10 L7.3 -6.8 M0 10 L9 -2 M0 10 L-17 -2 M0 10 L-15.7 -7.9 M0 10 L-12 -12.8 M0 10 L-6.5 -16.1 M0 10 L0 -17.3 M0 10 L6.5 -16.1 M0 10 L12 -12.8 M0 10 L15.7 -7.9 M0 10 L17 -2" stroke="#4d6b2a" stroke-width="1" fill="none"/><g fill="#d62a2a" stroke="#7a1a1a" stroke-width="0.8"><circle cx="-17" cy="-2" r="4.3"/><circle cx="-15.7" cy="-7.9" r="4.3"/><circle cx="-12" cy="-12.8" r="4.3"/><circle cx="-6.5" cy="-16.1" r="4.3"/><circle cx="0" cy="-17.3" r="4.3"/><circle cx="6.5" cy="-16.1" r="4.3"/><circle cx="12" cy="-12.8" r="4.3"/><circle cx="15.7" cy="-7.9" r="4.3"/><circle cx="17" cy="-2" r="4.3"/><circle cx="-9" cy="-2" r="4.3"/><circle cx="-7.3" cy="-6.8" r="4.3"/><circle cx="-2.8" cy="-9.7" r="4.3"/><circle cx="2.8" cy="-9.7" r="4.3"/><circle cx="7.3" cy="-6.8" r="4.3"/><circle cx="9" cy="-2" r="4.3"/><circle cx="0" cy="-2" r="4.3"/></g></g>
<g id="pkleaf"><path d="M0 0 L12 0" stroke="#4d6b2a" stroke-width="2.5"/><path d="M10 0 C22 -18 58 -20 82 0 C58 20 22 18 10 0Z" fill="#a9c77c" stroke="#333" stroke-width="1.4"/><path d="M12 0 H78 M30 0 L42 -12 M30 0 L42 12 M50 0 L60 -11 M50 0 L60 11" stroke="#5f7f36" stroke-width="1" fill="none"/></g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">人参 vs 商陆 识别要点(示意图)</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">路边、荒地挖到的"野人参"几乎都不是人参——先认地上部分,再看根(两株不按同一比例)</text>
<rect x="10" y="64" width="345" height="590" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="365" y="64" width="345" height="590" rx="8" fill="none" stroke="#c33" stroke-width="2"/>

<!-- ① 人参 -->
<text x="26" y="92" font-size="18" font-weight="bold">① 人参</text>
<text x="26" y="112" font-size="14" font-style="italic" fill="#555">Panax ginseng</text>
<text x="26" y="136" font-size="15"><tspan font-weight="bold">矮小</tspan>草本,高约30-60 cm</text>
<line x1="20" y1="372" x2="345" y2="372" stroke="#999" stroke-width="2"/>
