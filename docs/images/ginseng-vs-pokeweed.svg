<text x="208" y="166" font-size="15">顶生伞形花序</text>
<text x="208" y="186" font-size="15">一簇<tspan font-weight="bold" fill="#c33">鲜红色</tspan>小浆果</text>
<text x="22" y="318" font-size="15"><tspan font-weight="bold">掌状复叶</tspan>轮生茎顶</text>
<text x="22" y="337" font-size="13">通常3-6片,</text>
<text x="22" y="354" font-size="13">每片多为5片小叶</text>
<text x="209" y="395" font-size="15" font-weight="bold">有"芦头"(根茎)</text>
<text x="209" y="413" font-size="13">上有碗状茎痕(芦碗)</text>
<text x="209" y="441" font-size="15">主根纺锤形或圆柱形</text>
<text x="209" y="474" font-size="15">下部有2-3条支根</text>
<text x="213" y="502" font-size="13">须根上有疣状突起</text>
<text x="213" y="519" font-size="13">("珍珠点")</text>
<!-- 人参断面 -->
<line x1="22" y1="542" x2="343" y2="542" stroke="#ccc" stroke-dasharray="4 3"/>
<text x="26" y="562" font-size="14" fill="#0b5cad">根的横切面(放大示意)</text>
<g transform="translate(80 610)">
<circle r="36" fill="#f6eed6" stroke="#333" stroke-width="1.6"/>
<circle r="22" fill="none" stroke="#b07a2a" stroke-width="2.5"/>
