</g>
<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M462 597 L487 600"/></g>
<circle cx="462" cy="597" r="2.5" fill="#0b5cad"/>
<text x="491" y="586" font-size="14">横切面有</text>
<text x="491" y="606" font-size="15" font-weight="bold" fill="#c33">多层同心环纹</text>
<text x="491" y="626" font-size="14">(俗称"罗盘纹")</text>
<text x="491" y="646" font-size="14">很重要的识别点</text>

<!-- 底部 -->
<rect x="10" y="666" width="700" height="174" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="694" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">路边、荒地、村旁挖到的"人参",几乎可以肯定不是人参</text>
<text x="360" y="724" font-size="15" text-anchor="middle">掌状复叶 + 一簇鲜红色小浆果 + 有芦头 → 人参</text>
<text x="360" y="750" font-size="15" text-anchor="middle">单叶 + 紫黑色浆果串 + 没有芦头、横切面同心环纹 → 商陆</text>
<text x="360" y="778" font-size="14" fill="#555" text-anchor="middle">"土人参"可能是可食的栌兰,也可能是商陆根——不要买来泡酒</text>
<text x="360" y="808" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">野生人参受国家保护,不能采挖、买卖</text>
<text x="360" y="830" font-size="16" font-weight="bold" fill="#c33" text-anchor="middle">只拿到一段根的按"来路不明"处理;认不准不挖、不吃</text>
</g>
</svg>
