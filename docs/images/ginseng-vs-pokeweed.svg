<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M552 172 L582 166"/><path d="M548 300 L582 284"/><path d="M483 342 L582 344"/><path d="M500 378 L582 386"/><path d="M500 424 L582 424"/></g>
<g fill="#0b5cad"><circle cx="552" cy="172" r="2.5"/><circle cx="548" cy="300" r="2.5"/><circle cx="483" cy="342" r="2.5"/><circle cx="500" cy="378" r="2.5"/><circle cx="500" cy="424" r="2.5"/></g>
<text x="586" y="162" font-size="15">浆果<tspan font-weight="bold">紫黑色</tspan></text>
<text x="586" y="181" font-size="15">一串串像葡萄</text>
<text x="586" y="200" font-size="12" fill="#555">商陆果穗直立</text>
<text x="586" y="215" font-size="12" fill="#555">垂序商陆果穗下垂</text>
<text x="586" y="270" font-size="15"><tspan font-weight="bold">单叶</tspan>,大</text>
<text x="586" y="289" font-size="15">椭圆形,全缘</text>
<text x="586" y="308" font-size="15">互生</text>
<text x="586" y="340" font-size="15">茎粗壮,常带</text>
<text x="586" y="359" font-size="15" font-weight="bold">紫红色</text>
<text x="586" y="391" font-size="15" font-weight="bold" fill="#c33">没有芦头</text>
<text x="586" y="422" font-size="15">粗壮肉质</text>
<text x="586" y="441" font-size="15">圆锥形,<tspan font-weight="bold">常分叉</tspan></text>
<text x="586" y="468" font-size="13">外皮淡黄色</text>
<text x="586" y="485" font-size="13">或灰褐色</text>
<!-- 商陆断面 -->
<line x1="377" y1="542" x2="698" y2="542" stroke="#ccc" stroke-dasharray="4 3"/>
