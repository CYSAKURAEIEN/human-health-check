<g fill="#0b5cad"><circle cx="99" cy="599" r="2.5"/><circle cx="108" cy="620" r="2.5"/></g>
<text x="136" y="586" font-size="14">淡黄白色,有粉性</text>
<text x="136" y="608" font-size="14">一圈<tspan font-weight="bold">棕黄色形成层环</tspan></text>
<text x="136" y="628" font-size="14">皮部有黄棕色小点</text>
<text x="136" y="646" font-size="14">和放射状裂隙</text>

<!-- ② 商陆 -->
<text x="381" y="92" font-size="18" font-weight="bold" fill="#c33">② 商陆</text>
<text x="381" y="112" font-size="14" font-style="italic" fill="#555">Phytolacca</text>
<rect x="600" y="74" width="98" height="30" rx="5" fill="#c33"/>
<text x="649" y="95" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">☠️ 有毒</text>
<text x="698" y="124" font-size="13" fill="#c33" text-anchor="end">全株有毒,根和未熟果实毒性最大</text>
<text x="381" y="146" font-size="15"><tspan font-weight="bold">高大</tspan>草本,高约1-2 m</text>
<line x1="375" y1="372" x2="700" y2="372" stroke="#999" stroke-width="2"/>
