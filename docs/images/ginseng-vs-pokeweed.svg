<!-- 人参标注 -->
<g stroke="#0b5cad" stroke-width="1" fill="none"><path d="M166 190 L204 170"/><path d="M96 286 L74 304"/><path d="M155 388 L205 390"/><path d="M168 434 L205 436"/><path d="M174 486 L205 470"/><path d="M193 520 L209 504"/></g>
