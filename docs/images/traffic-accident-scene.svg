<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 828" width="720" height="828" role="img" aria-label="车祸现场第一步: 防止二次事故,很多伤亡发生在事故之后,停在路上的人和车被后方车辆撞上。高速公路: 三角警示牌放在来车方向150 m以外,车上人员迅速转移到右侧路肩或应急车道外的护栏外,不要站在车后方,不要在车道上停留。普通道路: 三角警示牌放在车后50-100 m。步骤: ①开启危险报警闪光灯(双闪);②熄火,拉手刹;③车上人员下车,转移到安全位置;④设置三角警示牌,放置时面向来车方向行走,注意后方来车;⑤有反光背心就穿上。夜间同时开启示廓灯、后位灯。报警: 122交通事故,120有人受伤,119车辆起火、有人被困车内;高速公路上说明行驶方向和路边的公里桩号。" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>车祸现场: 先防止二次事故</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#666"/></marker>
<!-- 俯视的车,车头朝右 -->
<g id="car">
<rect x="-32" y="-16" width="64" height="32" rx="9" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<rect x="6" y="-12" width="10" height="24" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/>
<rect x="-24" y="-11" width="8" height="22" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/>
</g>
<g id="flash"><circle r="4" fill="#f5a623" stroke="#c77a00" stroke-width="1"/><path d="M0,-6 v-4 M0,6 v4 M-6,0 h-4 M6,0 h4" stroke="#f5a623" stroke-width="1.6" stroke-linecap="round"/></g>
<g id="tri"><path d="M0,-12 L12,9 L-12,9 Z" fill="#fff" stroke="#c33" stroke-width="3.5" stroke-linejoin="round"/></g>
<!-- 站立的人(侧视),原点在脚下 -->
<g id="ps"><path d="M-3,-9 V0 M3,-9 V0" stroke="#333" stroke-width="3" stroke-linecap="round"/><rect x="-6.5" y="-24" width="13" height="16" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="1.6"/><circle cx="0" cy="-30" r="6" fill="#f3e3d3" stroke="#333" stroke-width="1.6"/></g>
</defs>
<text x="360" y="30" font-size="18" fill="#222" text-anchor="middle" font-weight="bold">车祸现场: 先防止二次事故</text>
<text x="360" y="54" font-size="13" fill="#555" text-anchor="middle">很多伤亡发生在事故之后: 停在路上的人和车被后方车辆撞上</text>

<!-- 高速公路 -->
<rect x="8" y="68" width="704" height="270" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="22" y="94" font-size="16" fill="#222" font-weight="bold">高速公路</text>
<text x="700" y="94" font-size="12" fill="#888" text-anchor="end">示意图,距离不按比例</text>
<rect x="16" y="130" width="688" height="138" fill="#e6e6e6"/>
<line x1="16" y1="130" x2="704" y2="130" stroke="#999" stroke-width="5"/>
<line x1="16" y1="182" x2="704" y2="182" stroke="#fff" stroke-width="2.5" stroke-dasharray="22 16"/>
<line x1="16" y1="234" x2="704" y2="234" stroke="#fff" stroke-width="2.5"/>
<text x="540" y="258" font-size="12" fill="#666" text-anchor="end">应急车道/路肩</text>
<line x1="16" y1="276" x2="704" y2="276" stroke="#777" stroke-width="4"/>
<g stroke="#777" stroke-width="3"><path d="M40 276 v8 M120 276 v8 M200 276 v8 M280 276 v8 M360 276 v8 M440 276 v8 M520 276 v8 M600 276 v8 M680 276 v8"/></g>
<text x="20" y="300" font-size="12" fill="#666">护栏</text>
<!-- 来车 -->
<use href="#car" transform="translate(52 208) scale(0.8)" opacity="0.55"/>
<line x1="84" y1="208" x2="118" y2="208" stroke="#666" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="22" y="174" font-size="13" fill="#555">来车方向 →</text>
<!-- 警示牌 -->
<use href="#tri" transform="translate(150 210)"/>
<text x="170" y="214" font-size="13" fill="#222">三角警示牌</text>
<!-- 事故车 -->
<use href="#car" transform="translate(592 208)"/>
<use href="#flash" transform="translate(562 194)"/><use href="#flash" transform="translate(562 222)"/><use href="#flash" transform="translate(622 194)"/><use href="#flash" transform="translate(622 222)"/>
<text x="592" y="174" font-size="12" fill="#222" text-anchor="middle">双闪</text>
<!-- 距离 -->
<line x1="150" y1="118" x2="560" y2="118" stroke="#c33" stroke-width="1.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="150" y1="110" x2="150" y2="196" stroke="#c33" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="560" y1="110" x2="560" y2="190" stroke="#c33" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="282" y="104" width="146" height="22" fill="#fff"/>
<text x="355" y="122" font-size="15" fill="#c33" text-anchor="middle" font-weight="bold">来车方向150 m以外</text>
<!-- 人员撤离 -->
<path d="M604 228 Q628 262 640 296" fill="none" stroke="#0b5cad" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#ab)"/>
<use href="#ps" transform="translate(658 330)"/><use href="#ps" transform="translate(676 330)"/><use href="#ps" transform="translate(694 330)"/>
<text x="616" y="304" font-size="14" fill="#0b5cad" text-anchor="end">人员迅速撤到右侧路肩或应急车道外的护栏外</text>
<text x="616" y="326" font-size="14" fill="#c33" text-anchor="end">不要站在车后方,不要在车道上停留</text>

<!-- 普通道路 -->
<rect x="8" y="348" width="704" height="216" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="22" y="374" font-size="16" fill="#222" font-weight="bold">普通道路</text>
<rect x="16" y="410" width="688" height="96" fill="#e6e6e6"/>
<line x1="16" y1="458" x2="704" y2="458" stroke="#fff" stroke-width="2.5" stroke-dasharray="22 16"/>
<line x1="16" y1="508" x2="704" y2="508" stroke="#999" stroke-width="3"/>
<rect x="16" y="510" width="688" height="22" fill="#f4f1ea"/>
<text x="20" y="526" font-size="12" fill="#666">路边</text>
<use href="#car" transform="translate(52 484) scale(0.8)" opacity="0.55"/>
<line x1="84" y1="484" x2="118" y2="484" stroke="#666" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="22" y="450" font-size="13" fill="#555">来车方向 →</text>
<use href="#tri" transform="translate(300 486)"/>
<text x="320" y="490" font-size="13" fill="#222">三角警示牌</text>
<use href="#car" transform="translate(592 484)"/>
<use href="#flash" transform="translate(562 470)"/><use href="#flash" transform="translate(562 498)"/><use href="#flash" transform="translate(622 470)"/><use href="#flash" transform="translate(622 498)"/>
<line x1="300" y1="398" x2="560" y2="398" stroke="#c33" stroke-width="1.8" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="300" y1="390" x2="300" y2="472" stroke="#c33" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="560" y1="390" x2="560" y2="466" stroke="#c33" stroke-width="1" stroke-dasharray="3 3"/>
<rect x="374" y="384" width="112" height="22" fill="#fff"/>
<text x="430" y="402" font-size="15" fill="#c33" text-anchor="middle" font-weight="bold">车后50-100 m</text>
<use href="#ps" transform="translate(664 556)"/><use href="#ps" transform="translate(684 556)"/>
<text x="648" y="552" font-size="14" fill="#0b5cad" text-anchor="end">人员下车,转移到安全位置</text>

<!-- 步骤 -->
<!-- ① 双闪 -->
<rect x="8" y="574" width="136" height="164" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="46" y="590" width="60" height="60" rx="12" fill="#c33" stroke="#333" stroke-width="2"/>
<path d="M76 600 L96 636 L56 636 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
<path d="M76 612 L86 630 L66 630 Z" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
<text x="18" y="690" font-size="14" fill="#222" font-weight="bold">① 开启双闪</text>
<text x="18" y="710" font-size="12" fill="#555">(危险报警闪光灯)</text>

<!-- ② 熄火拉手刹 -->
<rect x="150" y="574" width="136" height="164" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<circle cx="184" cy="620" r="13" fill="#fff" stroke="#333" stroke-width="2.2"/>
<circle cx="184" cy="620" r="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
<path d="M197 620 h28 v8 m-8 -8 v6" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="226" y1="666" x2="264" y2="602" stroke="#333" stroke-width="7" stroke-linecap="round"/>
<line x1="226" y1="666" x2="264" y2="602" stroke="#999" stroke-width="3.5" stroke-linecap="round"/>
<rect x="212" y="660" width="30" height="12" rx="3" fill="#666" stroke="#333" stroke-width="1.5"/>
<path d="M278 640 v-30" stroke="#c33" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="160" y="690" font-size="14" fill="#222" font-weight="bold">② 熄火,拉手刹</text>

<!-- ③ 人员下车 -->
<rect x="292" y="574" width="136" height="164" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="302" y="610" width="62" height="34" rx="9" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="316" cy="648" r="7" fill="#666"/><circle cx="350" cy="648" r="7" fill="#666"/>
<line x1="296" y1="656" x2="424" y2="656" stroke="#999" stroke-width="2"/>
<use href="#ps" transform="translate(400 656)"/>
<line x1="366" y1="634" x2="386" y2="634" stroke="#0b5cad" stroke-width="2.2" marker-end="url(#ab)"/>
<text x="302" y="690" font-size="14" fill="#222" font-weight="bold">③ 人员下车,</text>
<text x="302" y="710" font-size="13" fill="#222">转移到安全位置</text>

<!-- ④ 放警示牌 -->
<rect x="434" y="574" width="136" height="164" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<line x1="440" y1="656" x2="564" y2="656" stroke="#999" stroke-width="2"/>
<rect x="444" y="624" width="34" height="24" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="1.6" opacity="0.55"/>
<line x1="482" y1="636" x2="500" y2="636" stroke="#666" stroke-width="2" marker-end="url(#ag)"/>
<text x="446" y="614" font-size="11" fill="#666">来车</text>
<use href="#ps" transform="translate(530 656)"/>
<path d="M524 640 L512 642" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M508 628 L518 646 L498 646 Z" fill="#fff" stroke="#c33" stroke-width="3" stroke-linejoin="round"/>
<line x1="552" y1="600" x2="516" y2="600" stroke="#0b5cad" stroke-width="2" marker-end="url(#ab)"/>
<text x="444" y="690" font-size="14" fill="#222" font-weight="bold">④ 设置警示牌</text>
<text x="444" y="710" font-size="12" fill="#222">面向来车方向行走,</text>
<text x="444" y="727" font-size="12" fill="#c33">注意后方来车</text>

<!-- ⑤ 反光背心 -->
<rect x="576" y="574" width="136" height="164" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<path d="M626 594 L636 600 Q644 610 652 600 L662 594 L672 606 L670 658 L618 658 L616 606 Z" fill="#f2e24a" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M618 626 h52 M618 640 h52" stroke="#bbb" stroke-width="5"/>
<path d="M644 606 v52" stroke="#333" stroke-width="1.2"/>
<text x="586" y="690" font-size="14" fill="#222" font-weight="bold">⑤ 有反光背心</text>
<text x="586" y="710" font-size="13" fill="#222">就穿上</text>

<!-- 底部 -->
<text x="14" y="764" font-size="14" fill="#222"><tspan font-weight="bold">夜间:</tspan> 同时开启示廓灯、后位灯</text>
<text x="14" y="790" font-size="14" fill="#222"><tspan font-weight="bold">报警:</tspan> <tspan fill="#c33" font-weight="bold">122</tspan> 交通事故 · <tspan fill="#c33" font-weight="bold">120</tspan> 有人受伤 · <tspan fill="#c33" font-weight="bold">119</tspan> 车辆起火、有人被困车内</text>
<text x="14" y="814" font-size="13" fill="#555">高速公路上说明行驶方向和路边的公里桩号,便于定位</text>
</svg>
