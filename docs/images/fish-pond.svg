<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" width="720" height="736" role="img" aria-label="家庭鱼塘横剖面和放鱼前的准备。水深1.5-3 m,成鱼塘常用2-2.5 m;池底淤泥10-20 cm,过厚需清淤;池埂顶宽至少1.5-2 m,内坡比约1:2-1:3(每升高1 m,水平伸出2-3 m),埂顶高出最高水位30-50 cm,分层(每层约20-30 cm)夯实,埂上种草护坡,不种深根大树;进水口高于池水面,让水跌落进塘增氧,装两道滤网(先粗后细,如40-60目尼龙网袋);排水口设在池底最低处,能把塘水排干,可埋竖管或用插板闸门,出口外装拦鱼栅;最高水位处开带拦鱼栅的溢水口。混养: 鲢、鳙在上层,草鱼中下层,鲤、鲫在底层。家庭自给700-2000 m²的塘最合适,长方形,长宽比约2-3:1,东西向。放鱼前15-20天排干水(或留5-10 cm)、清野杂鱼、修埂、清淤(留10-20 cm),用生石灰、漂白粉或茶粕消毒;生石灰约7-10天毒性消失;放鱼前7-10天注水50-80 cm、施腐熟有机肥;试水一天(24小时)鱼正常再放;水色黄绿或茶褐、透明度约25-30 cm时放鱼。">
<rect width="100%" height="100%" fill="#fff"/>
<title>家庭鱼塘: 剖面与放鱼前的准备</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<g id="fish"><path d="M0,0 Q11,-7 22,0 Q11,7 0,0 Z M22,0 L29,-5 L28,0 L29,5 Z" fill="#9fb3c4" stroke="#333" stroke-width="1"/><circle cx="5" cy="-1" r="1.2" fill="#333"/></g>
<path id="grass" d="M0,0 l-3,-7 M0,0 l0,-8 M0,0 l3,-7" stroke="#5a8a3a" stroke-width="1.5" fill="none"/>
<pattern id="layers" width="20" height="10" patternUnits="userSpaceOnUse"><rect width="20" height="10" fill="#e6d6b4"/><path d="M0,9.5 H20" stroke="#cdb88e" stroke-width="1"/></pattern>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">家庭鱼塘: 剖面与放鱼前的准备</text>
<g transform="translate(10,42)">
<rect width="700" height="404" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">① 鱼塘横剖面</text>
<text x="118" y="24" font-size="13" fill="#555">(示意,竖向放大约2倍)</text>
<path d="M10,196 H62 L92,150 H127 L277,270 L447,276 L597,150 H632 L668,300 H690 V312 H10 Z" fill="url(#layers)" stroke="none"/>
<path d="M664,290 L668,300 H690" fill="none" stroke="#999" stroke-width="2"/>
<path d="M152,170 L277,270 L447,276 L572,170 Z" fill="#cfe5f5"/>
<path d="M265,260 L277,270 L447,276 L459,266 L447,282 L277,278 Z" fill="#7d6a4a"/>
<path d="M277,270 L447,276" stroke="#5e4c30" stroke-width="1"/>
<path d="M10,196 H62 L92,150 H127 L277,270 L447,276 L597,150 H632 L668,300 H690" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M152,170 H572" stroke="#3a7fc0" stroke-width="2"/>
<path d="M147,166 H577" stroke="#0b5cad" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="206" y="161" font-size="13" fill="#0b5cad">最高水位</text>
<use href="#grass" x="98" y="150"/>
<use href="#grass" x="112" y="150"/>
<use href="#grass" x="122" y="150"/>
<use href="#grass" x="136" y="157"/>
<use href="#grass" x="603" y="150"/>
<use href="#grass" x="617" y="150"/>
<use href="#grass" x="628" y="150"/>
<use href="#grass" x="586" y="159"/>
<use href="#grass" x="640" y="190"/>
<use href="#grass" x="650" y="230"/>
<use href="#grass" x="74" y="182"/>
<use href="#grass" x="40" y="196"/>
<rect x="10" y="128" width="154" height="12" fill="#bbb" stroke="#333" stroke-width="1.5"/>
<path d="M60,126 V142 M66,126 V142 M72,126 V142" stroke="#555" stroke-width="1.2"/>
<path d="M164,126 Q186,132 178,150 Q170,154 162,148 Q156,140 164,142 Z" fill="#fff" stroke="#0b5cad" stroke-width="1.2"/>
<path d="M164,128 L180,148 M170,128 L164,150 M176,134 L166,146 M160,136 L180,138" stroke="#0b5cad" stroke-width="0.6"/>
<path d="M172,152 Q176,160 174,168 M166,152 Q166,160 162,168" fill="none" stroke="#3a7fc0" stroke-width="1.8"/>
<path d="M14,134 H44" stroke="#0b5cad" stroke-width="1.5" marker-end="url(#arB)"/>
<rect x="577" y="161" width="78" height="9" fill="#bbb" stroke="#333" stroke-width="1.2"/>
<path d="M581,158 V173 M585,158 V173" stroke="#333" stroke-width="1.2"/>
<path d="M657,166 Q664,168 664,182" fill="none" stroke="#3a7fc0" stroke-width="1.8" marker-end="url(#arB)"/>
<rect x="450" y="170" width="8" height="106" fill="#bbb" stroke="#333" stroke-width="1.2"/>
<rect x="452" y="276" width="216" height="10" fill="#bbb" stroke="#333" stroke-width="1.2"/>
<path d="M670,274 V292 M675,274 V292" stroke="#333" stroke-width="1.2"/>
<use href="#fish" x="180" y="184"/><use href="#fish" x="212" y="190"/>
<text x="246" y="194" font-size="13">鲢、鳙: 上层</text>
<use href="#fish" x="242" y="232"/>
<text x="278" y="237" font-size="13">草鱼: 中下层</text>
<use href="#fish" x="282" y="258"/>
<text x="318" y="263" font-size="13">鲤、鲫: 底层</text>
<path d="M440,172 V274 M440,172 l-4,7 M440,172 l4,7 M440,274 l-4,-7 M440,274 l4,-7" fill="none" stroke="#c33" stroke-width="1.5"/>
<text x="432" y="194" font-size="14" fill="#c33" font-weight="bold" text-anchor="end">水深1.5-3 m</text>
<text x="432" y="212" font-size="13" fill="#c33" text-anchor="end">成鱼塘常用2-2.5 m</text>
<path d="M177,190 V230 H227" fill="none" stroke="#c33" stroke-width="1.5"/>
<text x="166" y="215" font-size="13" fill="#c33" text-anchor="end">1</text>
<text x="202" y="246" font-size="13" fill="#c33" text-anchor="middle">2-3</text>
<path d="M597,140 V134 H632 V140" fill="none" stroke="#0b5cad" stroke-width="1.2"/>
<path d="M597,150 H560" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 2"/>
<path d="M564,150 V166" stroke="#0b5cad" stroke-width="1.5"/>
<path d="M560,150 h8 M560,166 h8" stroke="#0b5cad" stroke-width="1.5"/>
<g font-size="13" fill="#0b5cad">
<text x="14" y="56">进水口: 高于水面,让水跌落进塘(增氧)</text>
<text x="14" y="74">两道滤网: 先粗后细(如40-60目尼龙网袋),</text>
<text x="14" y="92">挡住野杂鱼、鱼卵和敌害</text>
<line x1="66" y1="96" x2="66" y2="124" stroke="#0b5cad" stroke-width="1"/>
<line x1="170" y1="96" x2="172" y2="124" stroke="#0b5cad" stroke-width="1"/>
<text x="690" y="56" text-anchor="end">池埂顶宽至少1.5-2 m</text>
<line x1="614" y1="60" x2="614" y2="132" stroke="#0b5cad" stroke-width="1"/>
<text x="690" y="90" text-anchor="end">溢水口(带拦鱼栅): 大雨时</text>
<text x="690" y="108" text-anchor="end">多余的水从这里流走</text>
<line x1="670" y1="112" x2="652" y2="160" stroke="#0b5cad" stroke-width="1"/>
<text x="330" y="56">埂顶高出最高水位30-50 cm,</text>
<text x="330" y="74">防大雨漫塘跑鱼</text>
<line x1="430" y1="80" x2="562" y2="152" stroke="#0b5cad" stroke-width="1"/>
<text x="56" y="122" font-size="12">粗</text>
<text x="186" y="128" font-size="12">细</text>
</g>
<g font-size="13">
<text x="14" y="334" fill="#c33">内坡比约1:2-1:3: 每升高1 m,水平伸出2-3 m;</text>
<text x="14" y="352" fill="#c33">沙性土取缓坡。不易塌,落水的人和牲畜也容易爬上来</text>
<text x="14" y="374" fill="#0b5cad">池埂分层夯实(每层约20-30 cm);埂上种草护坡,不种深根大树</text>
<text x="14" y="392" fill="#0b5cad">黏土、壤土保水好;沙土要在池底和池埂内侧铺约30 cm黏土并夯实</text>
<rect x="240" y="288" width="178" height="20" rx="4" fill="#fff" stroke="#5e4c30" stroke-width="1"/>
<text x="248" y="303" fill="#5e4c30">淤泥10-20 cm(过厚需清淤)</text>
<line x1="330" y1="288" x2="336" y2="278" stroke="#5e4c30" stroke-width="1"/>
<text x="690" y="334" text-anchor="end" fill="#0b5cad">排水口: 设在池底最低处,能把塘水排干;</text>
<text x="690" y="352" text-anchor="end" fill="#0b5cad">埋一根竖管(拔管放水)或用插板闸门</text>
<text x="690" y="370" text-anchor="end" fill="#0b5cad">出口外装拦鱼栅</text>
<line x1="560" y1="321" x2="560" y2="288" stroke="#0b5cad" stroke-width="1"/>
</g>
</g>
<g transform="translate(10,456)">
<rect width="250" height="270" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">② 面积和形状(俯视)</text>
<rect x="40" y="56" width="170" height="68" rx="4" fill="#cfe5f5" stroke="#333" stroke-width="2"/>
<text x="30" y="95" font-size="13" text-anchor="end">西</text>
<text x="220" y="95" font-size="13">东</text>
<path d="M125,48 V40 M121,44 L125,36 L129,44" fill="none" stroke="#555" stroke-width="1.2"/>
<text x="134" y="46" font-size="12" fill="#555">北</text>
<path d="M40,132 V138 H210 V132" fill="none" stroke="#0b5cad" stroke-width="1.2"/>
<text x="125" y="152" font-size="13" fill="#0b5cad" text-anchor="middle">长:宽约2-3:1,便于拉网</text>
<text x="12" y="178" font-size="13">家庭自给: 700-2000 m²最合适</text>
<text x="12" y="196" font-size="13">太小水质变化快、易缺氧;</text>
<text x="12" y="214" font-size="13">太大清塘、捕捞费力</text>
<text x="12" y="230" font-size="13">东西向: 受光好,风吹水面能增氧</text>
</g>
<g transform="translate(266,456)">
<rect width="444" height="270" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">③ 放鱼前的准备</text>
<circle cx="24" cy="48" r="9" fill="#0b5cad"/>
<text x="24" y="53" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
<line x1="24" y1="58" x2="24" y2="95" stroke="#0b5cad" stroke-width="2"/>
<text x="42" y="53" font-size="14" font-weight="bold">放鱼前15-20天: 清塘</text>
<text x="42" y="71" font-size="13">排干水(或只留5-10 cm),清除野杂鱼和敌害,修埂堵漏,</text>
<text x="42" y="87" font-size="13" fill="#555">清除过多淤泥(留10-20 cm)</text>
<circle cx="24" cy="104" r="9" fill="#0b5cad"/>
<text x="24" y="109" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
<line x1="24" y1="114" x2="24" y2="151" stroke="#0b5cad" stroke-width="2"/>
<text x="42" y="109" font-size="14" font-weight="bold">消毒(任选一种)</text>
<text x="42" y="127" font-size="13">生石灰、漂白粉或茶粕;等毒性消失再放鱼</text>
<text x="42" y="143" font-size="13" fill="#555">(生石灰约7-10天,漂白粉约4-5天,茶粕约7天)</text>
<circle cx="24" cy="160" r="9" fill="#0b5cad"/>
<text x="24" y="165" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
<line x1="24" y1="170" x2="24" y2="207" stroke="#0b5cad" stroke-width="2"/>
<text x="42" y="165" font-size="14" font-weight="bold">放鱼前7-10天: 注水、施基肥</text>
<text x="42" y="183" font-size="13">注水50-80 cm,施腐熟的有机肥(生粪不能下塘);</text>
<text x="42" y="199" font-size="13" fill="#555">进水口一定装滤网</text>
<circle cx="24" cy="216" r="9" fill="#0b5cad"/>
<text x="24" y="221" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
<text x="42" y="221" font-size="14" font-weight="bold">试水后放鱼</text>
<text x="42" y="239" font-size="13">几尾鱼放在塘里一天(24小时),正常游动就可以放;</text>
<text x="42" y="255" font-size="13" fill="#555">水色黄绿或茶褐、透明度约25-30 cm为好</text>
</g>
</g>
</svg>
