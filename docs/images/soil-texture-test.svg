<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 712" width="720" height="712" role="img" aria-label="简单的土壤质地判断。搓条法: 取一把湿润的土,加水揉到像橡皮泥,在手掌中搓成细条;搓不成条、一搓就散是砂土;能搓成条但一弯就断是壤土;能搓成细长条还能弯成圈不断是黏土。沉淀法更准确: ①在透明瓶子里装约三分之一的土,加水到接近满,加一小撮盐或洗衣粉帮助分散;②用力摇匀,静置;③约1分钟后沉下的是砂,几个小时后沉下的是粉粒,一两天后才沉下的是黏粒;④量出各层的厚度,就知道大致比例。砂、粉粒、黏粒三者比例适中的是壤土,最适合种植" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>土壤质地: 搓条法和沉淀法</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
<g id="palm" fill="#f3e3d3" stroke="#333" stroke-width="2">
<rect x="-50" y="-74" width="22" height="66" rx="11"/>
<rect x="-24" y="-84" width="22" height="76" rx="11"/>
<rect x="2" y="-80" width="22" height="72" rx="11"/>
<rect x="28" y="-66" width="22" height="58" rx="11"/>
<path d="M-54,10 L-84,-18 Q-94,-30 -82,-36 Q-74,-40 -66,-30 L-46,-10"/>
<rect x="-56" y="-30" width="112" height="90" rx="30"/>
</g>
<pattern id="sand" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e3cc86"/><circle cx="2" cy="2" r="1" fill="#a88c3c"/><circle cx="5.5" cy="5" r="0.9" fill="#a88c3c"/></pattern>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">简单的土壤质地判断: 搓条法和沉淀法</text>

<!-- ① 搓条法 -->
<rect x="10" y="44" width="700" height="292" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① 搓条法</text>
<text x="112" y="70" font-size="14">取一把湿润的土(加水揉到像橡皮泥),在手掌中搓成细条</text>
<line x1="243" y1="90" x2="243" y2="320" stroke="#ddd" stroke-width="1.5"/>
<line x1="477" y1="90" x2="477" y2="320" stroke="#ddd" stroke-width="1.5"/>

<!-- 砂土 -->
<use href="#palm" x="127" y="186"/>
<g fill="#a0785a" stroke="#6b4a32" stroke-width="1.2">
<path d="M96,196 l9,-3 l4,6 l-7,5 l-7,-2 Z"/>
<path d="M114,206 l10,-2 l3,7 l-9,4 l-5,-4 Z"/>
<path d="M133,194 l8,1 l2,7 l-8,3 l-5,-5 Z"/>
<path d="M148,208 l7,-4 l6,5 l-4,6 l-8,-1 Z"/>
<path d="M104,222 l8,-1 l2,6 l-7,3 l-5,-3 Z"/>
<path d="M126,224 l9,-3 l5,6 l-8,4 Z"/>
<path d="M150,226 l6,-2 l3,5 l-6,3 Z"/>
<path d="M118,186 l5,-1 l2,4 l-5,2 Z"/>
<path d="M142,182 l6,0 l1,5 l-6,1 Z"/>
<circle cx="112" cy="214" r="2"/><circle cx="140" cy="214" r="2.2"/><circle cx="160" cy="196" r="1.8"/><circle cx="94" cy="210" r="1.8"/><circle cx="134" cy="236" r="1.8"/>
</g>
<text x="127" y="276" font-size="14" text-anchor="middle">搓不成条,一搓就散</text>
<text x="127" y="304" font-size="17" font-weight="bold" text-anchor="middle">→ 砂土</text>

<!-- 壤土 -->
<use href="#palm" x="360" y="186"/>
<g fill="none" stroke-linecap="round">
<path d="M324.3,218 A38,38 0 0 1 353.4,167.6" stroke="#6b4a32" stroke-width="11"/>
<path d="M324.3,218 A38,38 0 0 1 353.4,167.6" stroke="#a0785a" stroke-width="7.5"/>
<path d="M366.6,167.6 A38,38 0 0 1 395.7,218" stroke="#6b4a32" stroke-width="11"/>
<path d="M366.6,167.6 A38,38 0 0 1 395.7,218" stroke="#a0785a" stroke-width="7.5"/>
</g>
<path d="M360,148 l-4,8 l6,4 l-4,8" fill="none" stroke="#c33" stroke-width="2"/>
<g stroke="#6b4a32" stroke-width="1.3">
<path d="M330.5,183 l5,4 M389.5,183 l-5,4 M323,205 l6,0 M397,205 l-6,0"/>
</g>
<text x="384" y="152" font-size="13" fill="#c33">断</text>
<text x="360" y="276" font-size="14" text-anchor="middle">能搓成条,但一弯就断</text>
<text x="360" y="304" font-size="17" font-weight="bold" text-anchor="middle">→ 壤土</text>

<!-- 黏土 -->
<use href="#palm" x="593" y="186"/>
<circle cx="593" cy="198" r="36" fill="none" stroke="#6b4a32" stroke-width="9"/>
<circle cx="593" cy="198" r="36" fill="none" stroke="#a0785a" stroke-width="5.5"/>
<text x="593" y="276" font-size="14" text-anchor="middle">能搓成细长条,还能弯成圈不断</text>
<text x="593" y="304" font-size="17" font-weight="bold" text-anchor="middle">→ 黏土</text>

<!-- ② 沉淀法 -->
<rect x="10" y="350" width="700" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="376" font-size="16" font-weight="bold">② 沉淀法(更准确)</text>
<text x="190" y="376" font-size="14" fill="#555">透明瓶子侧面看</text>

<text x="75" y="404" font-size="15" font-weight="bold" text-anchor="middle">① 装土加水</text>
<text x="205" y="404" font-size="15" font-weight="bold" text-anchor="middle">② 摇匀,静置</text>
<path d="M280,396 V390 H650 V396" fill="none" stroke="#0b5cad" stroke-width="1.5"/>
<text x="465" y="384" font-size="15" font-weight="bold" fill="#0b5cad" text-anchor="middle">③ 颗粒越粗沉得越快,先后分层</text>

<!-- 瓶子通用: 瓶身 y 430-580,瓶口 y 414-430 -->
<!-- A -->
<rect x="40" y="436" width="70" height="92" fill="#dcecf8"/>
<rect x="40" y="528" width="70" height="50" fill="#a0785a"/>
<!-- B -->
<rect x="170" y="436" width="70" height="142" fill="#b89a7c"/>
<!-- C -->
<rect x="300" y="436" width="70" height="120" fill="#cbb398"/>
<rect x="300" y="556" width="70" height="22" fill="url(#sand)"/>
<!-- D -->
<rect x="430" y="436" width="70" height="104" fill="#e2d6c6"/>
<rect x="430" y="540" width="70" height="16" fill="#b9a184"/>
<rect x="430" y="556" width="70" height="22" fill="url(#sand)"/>
<!-- E -->
<rect x="560" y="436" width="70" height="92" fill="#dcecf8"/>
<rect x="560" y="528" width="70" height="12" fill="#8c6a55"/>
<rect x="560" y="540" width="70" height="16" fill="#b9a184"/>
<rect x="560" y="556" width="70" height="22" fill="url(#sand)"/>
<g fill="none" stroke="#333" stroke-width="2.2" stroke-linejoin="round">
<path d="M53,414 V430 Q38,430 38,442 V572 Q38,580 46,580 H104 Q112,580 112,572 V442 Q112,430 97,430 V414 Z"/>
<path d="M183,414 V430 Q168,430 168,442 V572 Q168,580 176,580 H234 Q242,580 242,572 V442 Q242,430 227,430 V414 Z"/>
<path d="M313,414 V430 Q298,430 298,442 V572 Q298,580 306,580 H364 Q372,580 372,572 V442 Q372,430 357,430 V414 Z"/>
<path d="M443,414 V430 Q428,430 428,442 V572 Q428,580 436,580 H494 Q502,580 502,572 V442 Q502,430 487,430 V414 Z"/>
<path d="M573,414 V430 Q558,430 558,442 V572 Q558,580 566,580 H624 Q632,580 632,572 V442 Q632,430 617,430 V414 Z"/>
</g>
<g stroke="#0b5cad" stroke-width="1.2"><path d="M40,436 H110 M170,436 H240 M300,436 H370 M430,436 H500 M560,436 H630"/></g>

<!-- A 标注 -->
<text x="75" y="551" font-size="13" fill="#fff" text-anchor="middle">土</text>
<text x="75" y="568" font-size="12" fill="#fff" text-anchor="middle">约1/3</text>
<text x="75" y="488" font-size="13" fill="#0b5cad" text-anchor="middle">水</text>
<!-- B 摇晃箭头 -->
<path d="M156,470 Q148,500 156,530" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M254,530 Q262,500 254,470" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="205" y="510" font-size="13" fill="#fff" text-anchor="middle">浑浊</text>

<!-- E 分层标注 -->
<path d="M634,534 L648,518 M634,548 H648 M634,567 L648,577" stroke="#333" stroke-width="1"/>
<text x="652" y="522" font-size="13">黏粒</text>
<text x="652" y="552" font-size="13">粉粒</text>
<text x="652" y="582" font-size="13">砂</text>
<text x="595" y="488" font-size="13" fill="#0b5cad" text-anchor="middle">水变清</text>

<!-- 说明 -->
<text x="75" y="602" font-size="13" text-anchor="middle">装约三分之一的土</text>
<text x="75" y="620" font-size="13" text-anchor="middle">加水到接近满</text>
<text x="75" y="638" font-size="13" text-anchor="middle">加一小撮盐或洗衣粉</text>
<text x="75" y="656" font-size="13" text-anchor="middle">帮助分散</text>
<text x="205" y="602" font-size="13" text-anchor="middle">用力摇匀</text>
<text x="205" y="620" font-size="13" text-anchor="middle">然后静置不动</text>
<text x="335" y="602" font-size="14" font-weight="bold" text-anchor="middle">约1分钟后</text>
<text x="335" y="620" font-size="13" text-anchor="middle">砂沉下</text>
<text x="465" y="602" font-size="14" font-weight="bold" text-anchor="middle">几个小时后</text>
<text x="465" y="620" font-size="13" text-anchor="middle">粉粒沉下</text>
<text x="595" y="602" font-size="14" font-weight="bold" text-anchor="middle">一两天后</text>
<text x="595" y="620" font-size="13" text-anchor="middle">黏粒才沉下</text>

<rect x="168" y="640" width="530" height="50" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.2"/>
<text x="180" y="661" font-size="14" font-weight="bold">④ 量出各层的厚度,就知道大致比例</text>
<text x="180" y="681" font-size="13" fill="#555">砂、粉粒、黏粒三者比例适中的是壤土,最适合种植</text>
</g>
</svg>
