<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-label="家庭应急通信计划: 灾难发生时家人往往分散在单位、学校、路上,提前约定好比灾后再想办法有效得多。一、约定三个集合点: 第一集合点是家门外的安全空地,第二集合点在社区内(学校操场、公园),第三集合点在社区外(亲友家、指定避难场所),写下来,确保孩子和老人也知道。二、约定一位住在外地的亲友作外地联系人: 灾区本地电话打不通时,往外地打往往更容易接通;全家人都向他报平安,由他转告其他人。三、把家人、亲友、单位、学校的电话写在纸上,放在钱包、应急包里,孩子的书包里也放一份。四、灾后发短信、少打电话: 短信占用的网络资源少,拥堵时更容易发出去;一条短信说清我是谁、在哪里、是否安全、接下来去哪;打电话要简短。五、收音机是停电断网时最可靠的信息来源,准备手摇或太阳能充电的收音机,只信官方渠道。六、家人失散后: 先到约定的集合地点等候和查看;联系外地联系人;在家门口、集合点留下纸条,装进塑料袋贴在显眼处;到避难场所、安置点登记和查询;向公安机关报告;联系红十字会等救援组织。孩子、老人走失时立即拨打110,不需要等24小时。每年至少演练一次">
<rect width="100%" height="100%" fill="#fff"/>
<title>家庭应急通信计划</title>
<defs>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#777"/></marker>
<g id="person"><circle cx="0" cy="-22" r="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/><path d="M-10 0 V-8 Q-10 -13 -5 -13 H5 Q10 -13 10 -8 V0 Z" fill="#cfe0f0" stroke="#333" stroke-width="2" stroke-linejoin="round"/></g>
<g id="flag"><path d="M0 0 V-34" stroke="#333" stroke-width="2"/><path d="M0 -34 L20 -28 L0 -22 Z" fill="#c33"/></g>
<g id="house"><path d="M-18 0 V-20 L0 -34 L18 -20 V0 Z" fill="#fff" stroke="#333" stroke-width="2" stroke-linejoin="round"/><rect x="-5" y="-12" width="10" height="12" fill="#cfe0f0" stroke="#333" stroke-width="1.5"/></g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">家庭应急通信计划: 灾前约定好</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">灾难发生时,家人往往分散在单位、学校、路上——提前约定好,比灾后再想办法有效得多</text>

<!-- ① 三个集合点 -->
<g transform="translate(10,64)">
<rect x="0" y="0" width="345" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">① 约定三个集合点</text>
<rect x="14" y="40" width="236" height="196" rx="14" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="24" y="60" font-size="13" fill="#0b5cad">社区</text>
<!-- 家 -->
<use href="#house" x="62" y="120"/>
<text x="62" y="138" font-size="13" text-anchor="middle">家</text>
<path d="M30 121 H140" stroke="#999" stroke-width="2"/>
<use href="#flag" x="108" y="120"/>
<circle cx="98" cy="74" r="10" fill="#c33"/><text x="98" y="79" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<!-- 社区内操场/公园 -->
<rect x="120" y="160" width="112" height="60" rx="30" fill="#e3efd6" stroke="#6a8a3a" stroke-width="1.5"/>
<g transform="translate(140 200)"><path d="M0 0 V-12" stroke="#6a5a3a" stroke-width="3"/><circle cx="0" cy="-20" r="10" fill="#a7c47a" stroke="#4d6b2a" stroke-width="1.5"/></g>
<text x="190" y="212" font-size="12" fill="#4d6b2a" text-anchor="middle">操场/公园</text>
<use href="#flag" x="180" y="196"/>
<circle cx="170" cy="150" r="10" fill="#c33"/><text x="170" y="155" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<!-- 社区外 -->
<use href="#house" x="300" y="160"/>
<use href="#flag" x="322" y="166"/>
<circle cx="300" cy="100" r="10" fill="#c33"/><text x="300" y="105" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<path d="M106 128 Q120 150 132 160" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arB)"/>
<path d="M214 166 Q250 150 274 150" fill="none" stroke="#0b5cad" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arB)"/>
<g font-size="14">
<text x="12" y="262"><tspan fill="#c33" font-weight="bold">1</tspan> 家门外的安全空地</text>
<text x="12" y="284"><tspan fill="#c33" font-weight="bold">2</tspan> 社区内(学校操场、公园)</text>
<text x="12" y="306"><tspan fill="#c33" font-weight="bold">3</tspan> 社区外(亲友家、指定避难场所)</text>
</g>
<text x="12" y="324" font-size="12" fill="#555">写下来,确保孩子和老人也知道;每年至少演练一次</text>
</g>

<!-- ② 外地联系人 -->
<g transform="translate(365,64)">
<rect x="0" y="0" width="345" height="330" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">② 约定一位外地联系人</text>
<rect x="14" y="40" width="160" height="196" rx="10" fill="#f6f6f6" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="24" y="60" font-size="13" fill="#555">灾区(本地)</text>
<use href="#person" x="50" y="104"/><text x="70" y="98" font-size="13">在单位</text>
<use href="#person" x="50" y="164"/><text x="70" y="158" font-size="13">在学校</text>
<use href="#person" x="50" y="224"/><text x="70" y="218" font-size="13">在路上</text>
<!-- 本地互打不通 -->
<path d="M32 108 V136" stroke="#c33" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M27 116 L37 126 M37 116 L27 126" stroke="#c33" stroke-width="2"/>
<path d="M32 168 V196" stroke="#c33" stroke-width="1.5" stroke-dasharray="3 3"/>
<path d="M27 176 L37 186 M37 176 L27 186" stroke="#c33" stroke-width="2"/>
<!-- 外地联系人 -->
<rect x="232" y="112" width="100" height="100" rx="10" fill="#eef4fb" stroke="#0b5cad" stroke-width="1.5"/>
<use href="#person" x="282" y="166"/>
<text x="282" y="186" font-size="13" font-weight="bold" text-anchor="middle">外地联系人</text>
<text x="282" y="203" font-size="12" fill="#555" text-anchor="middle">住在外地的亲友</text>
<g fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)">
<path d="M126 96 Q190 100 228 140"/>
<path d="M126 156 L228 160"/>
<path d="M126 216 Q190 214 228 180"/>
</g>
<text x="178" y="92" font-size="12" fill="#0b5cad" text-anchor="middle">报平安</text>
<text x="282" y="236" font-size="13" fill="#0b5cad" text-anchor="middle">由他转告其他人</text>
<g font-size="14">
<text x="12" y="262">全家人都向这位联系人报平安</text>
<text x="12" y="284">灾区本地电话打不通时,</text>
<text x="12" y="306">往外地打<tspan font-weight="bold">往往更容易接通</tspan></text>
</g>
</g>

<!-- ③ 电话写在纸上 -->
<g transform="translate(10,404)">
<rect x="0" y="0" width="226" height="236" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">③ 电话写在纸上</text>
<g transform="rotate(-3 113 90)">
<rect x="34" y="40" width="158" height="96" rx="4" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
<g font-size="12"><text x="44" y="60">家人 ___________</text><text x="44" y="80">亲友 ___________</text><text x="44" y="100">单位 ___________</text><text x="44" y="120">学校 ___________</text></g>
</g>
<text x="12" y="166" font-size="14">放在<tspan font-weight="bold">钱包、应急包</tspan>里,</text>
<text x="12" y="188" font-size="14"><tspan font-weight="bold">孩子书包</tspan>里也放一份</text>
<text x="12" y="210" font-size="12" fill="#555">手机没电、丢失后,很多人</text>
<text x="12" y="225" font-size="12" fill="#555">一个号码都记不住</text>
</g>

<!-- ④ 发短信 -->
<g transform="translate(246,404)">
<rect x="0" y="0" width="228" height="236" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">④ 灾后: 发短信,少打电话</text>
<rect x="14" y="40" width="48" height="86" rx="7" fill="#fff" stroke="#333" stroke-width="2"/>
<rect x="20" y="50" width="36" height="62" fill="#eef4fb"/>
<circle cx="38" cy="119" r="3" fill="none" stroke="#333" stroke-width="1.2"/>
<path d="M76 40 H214 Q218 40 218 44 V126 Q218 130 214 130 H82 Q78 130 78 126 V78 L68 70 L78 66 V44 Q78 40 82 40 Z" fill="#e8f3e2" stroke="#4d6b2a" stroke-width="1.5"/>
<g font-size="13"><text x="88" y="60">我是谁</text><text x="88" y="80">在哪里</text><text x="88" y="100">是否安全</text><text x="88" y="120">接下来去哪</text></g>
<text x="12" y="154" font-size="13">短信占用网络资源少,</text>
<text x="12" y="172" font-size="13">拥堵时<tspan font-weight="bold">更容易发出去</tspan></text>
<text x="12" y="198" font-size="13">打电话要简短: 说完就挂,</text>
<text x="12" y="216" font-size="13">把线路留给其他人和求救电话</text>
</g>

<!-- ⑤ 收音机 -->
<g transform="translate(484,404)">
<rect x="0" y="0" width="226" height="236" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">⑤ 收音机</text>
<path d="M92 50 L130 36" stroke="#333" stroke-width="2"/>
<rect x="56" y="50" width="114" height="66" rx="8" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="88" cy="83" r="18" fill="#fff" stroke="#333" stroke-width="1.5"/>
<g stroke="#333" stroke-width="1"><path d="M76 77 H100 M74 83 H102 M76 89 H100"/></g>
<rect x="116" y="66" width="42" height="12" rx="2" fill="#fff" stroke="#333" stroke-width="1.2"/>
<circle cx="137" cy="98" r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
<path d="M170 76 H184 V100" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="184" cy="103" r="4" fill="#333"/>
<text x="184" y="126" font-size="12" fill="#0b5cad" text-anchor="middle">手摇</text>
<text x="12" y="144" font-size="14">停电断网时</text>
<text x="12" y="163" font-size="14" font-weight="bold">最可靠的信息来源</text>
<text x="12" y="185" font-size="13">应急包里准备手摇或</text><text x="12" y="202" font-size="13">太阳能充电的收音机</text>
<text x="12" y="222" font-size="13" fill="#c33" font-weight="bold">只信官方渠道,不信谣、不传谣</text>
</g>

<!-- ⑥ 失散后 -->
<g transform="translate(10,650)">
<rect x="0" y="0" width="700" height="240" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="16" font-weight="bold">⑥ 家人失散后怎样寻找(按顺序)</text>
<g fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5">
<rect x="14" y="40" width="204" height="58" rx="6"/><rect x="248" y="40" width="204" height="58" rx="6"/><rect x="482" y="40" width="204" height="58" rx="6"/>
<rect x="14" y="120" width="204" height="58" rx="6"/><rect x="248" y="120" width="204" height="58" rx="6"/><rect x="482" y="120" width="204" height="58" rx="6"/>
</g>
<g fill="none" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)">
<path d="M220 69 H244"/><path d="M454 69 H478"/>
<path d="M584 100 V109 H116 V116"/>
<path d="M220 149 H244"/><path d="M454 149 H478"/>
</g>
<g font-size="14">
<text x="24" y="63"><tspan font-weight="bold" fill="#0b5cad">1</tspan> 到约定的集合点</text>
<text x="38" y="85">等候和查看</text>
<text x="258" y="63"><tspan font-weight="bold" fill="#0b5cad">2</tspan> 联系外地联系人</text>
<text x="272" y="85">问其他家人的消息</text>
<text x="492" y="63"><tspan font-weight="bold" fill="#0b5cad">3</tspan> 家门口、集合点留纸条</text>
<text x="506" y="85">装进塑料袋,贴在显眼处</text>
<text x="24" y="143"><tspan font-weight="bold" fill="#0b5cad">4</tspan> 到避难场所、安置点</text>
<text x="38" y="165">登记自己,查询家人</text>
<text x="258" y="143"><tspan font-weight="bold" fill="#0b5cad">5</tspan> 向公安机关报告</text>
<text x="272" y="165">提供照片和特征</text>
<text x="492" y="143"><tspan font-weight="bold" fill="#0b5cad">6</tspan> 联系红十字会等</text>
<text x="506" y="165">了解寻人服务</text>
</g>
<text x="350" y="206" font-size="13" text-anchor="middle">纸条写清: 我是谁、什么时间、人是否安全、现在去了哪里、怎么联系</text>
<text x="350" y="230" font-size="15" font-weight="bold" fill="#c33" text-anchor="middle">孩子、老人走失: 立即拨打110,不需要等24小时</text>
</g>
</g>
</svg>
