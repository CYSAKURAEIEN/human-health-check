<text x="360" y="538" font-size="15" fill="#222" text-anchor="middle">绑带宽 3-5 cm,下面能伸进一根手指;不用细绳、铁丝;原位固定,不要把伤肢掰直</text>
<text x="360" y="560" font-size="15" fill="#c33" text-anchor="middle">固定前后都检查手指或脚趾的颜色、温度、感觉、活动;变白、变紫、发凉、麻木 → 先松开重绑</text>
