<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 878" width="720" height="878" role="img" aria-label="新生儿的黄金一分钟(只用于来不及送医、救护车未到时,先拨打120开免提按调度员指导做)。所有宝宝: 1 放在母亲胸腹部,皮肤贴着皮肤;2 立即用干毛巾擦干全身,尤其是头和背部,擦干既保暖也刺激呼吸;3 换掉湿毛巾,用干毛巾包住宝宝,盖住头部;4 观察是否哭、是否在呼吸、皮肤颜色、手脚是否有活动。宝宝不哭、不呼吸: 1 继续用力擦干背部,轻弹脚底;2 嘴和鼻子里有明显黏液用干净的布擦掉;3 擦干和刺激后仍不呼吸或只有偶尔喘息,立即告诉120调度员并开始人工呼吸: 宝宝平躺在平坦处,头部保持正中位置不要过度后仰,用嘴同时包住宝宝的口和鼻,轻轻吹一小口气,看到胸部轻微起伏即可,每1-2秒吹一次(每分钟30-60次);需要人工呼吸时先处理脐带;持续到宝宝自主呼吸或急救人员到达">
<rect width="100%" height="100%" fill="#fff"/>
<title>新生儿的黄金一分钟</title>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<!-- 趴着的新生儿(侧视,头朝左,脸朝下) -->
<g id="babyP">
<path d="M60,4 L54,15 L80,15" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M60,4 L54,15 L80,15" fill="none" stroke="#f3e3d3" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="38" cy="3" rx="28" ry="12" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<path d="M60,4 L54,15" fill="none" stroke="#f3e3d3" stroke-width="7.5" stroke-linecap="round"/>
<path d="M20,6 L26,15 L12,16" fill="none" stroke="#333" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M20,6 L26,15 L12,16" fill="none" stroke="#f3e3d3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="0" cy="2" r="15" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<path d="M-8,-9 Q2,-15 11,-8" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M-9,6 Q-6,8 -3,6" fill="none" stroke="#333" stroke-width="1.5"/>
</g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">新生儿的黄金一分钟</text>

<!-- 前提 -->
<rect x="10" y="44" width="700" height="40" rx="8" fill="#fdecec" stroke="#c33" stroke-width="1.5"/>
<text x="360" y="70" text-anchor="middle"><tspan fill="#c33" font-weight="bold">⚠️ 只用于来不及送医、救护车还没到时</tspan> —— 先拨打120,开免提,按调度员指导做</text>

<text x="14" y="112" font-size="17" font-weight="bold" fill="#0b5cad">所有宝宝(出生后1分钟内应已自主呼吸)</text>

<!-- ① 皮肤贴皮肤 -->
<g transform="translate(10,124)">
<rect x="0" y="0" width="226" height="246" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">① 放在母亲胸腹部</text>
<g transform="translate(46,92) rotate(18)">
<rect x="-22" y="34" width="176" height="14" rx="6" fill="#e8e8e8" stroke="#333" stroke-width="2"/>
<rect x="14" y="-10" width="130" height="44" rx="18" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M100,-10 L126,-10 Q144,-10 144,8 L144,16 Q144,34 126,34 L100,34 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="6" y="2" width="14" height="18" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<circle cx="-8" cy="10" r="18" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M-26,16 Q-30,-10 -6,-8 Q-20,0 -22,18 Z" fill="#555"/>
<circle cx="2" cy="2" r="1.8" fill="#333"/>
<g transform="translate(40,-26)"><use href="#babyP"/></g>
<path d="M28,6 L62,24 L96,-28" fill="none" stroke="#333" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M28,6 L62,24 L96,-28" fill="none" stroke="#f3e3d3" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<line x1="150" y1="58" x2="112" y2="100" stroke="#0b5cad" stroke-width="1"/>
<text x="120" y="52" font-size="13" fill="#0b5cad">皮肤贴着皮肤</text>
<text x="12" y="200">宝宝放在母亲胸腹部,</text>
<text x="12" y="222">皮肤贴着皮肤</text>
</g>

<!-- ② 擦干 -->
<g transform="translate(247,124)">
<rect x="0" y="0" width="226" height="246" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">② 立即擦干全身</text>
<path d="M14,150 Q113,134 212,150" fill="none" stroke="#cfe0f0" stroke-width="16"/>
<path d="M14,142 Q113,126 212,142" fill="none" stroke="#999" stroke-width="2"/>
<g transform="translate(64,108) scale(1.45)"><use href="#babyP"/></g>
<!-- 毛巾 + 手 -->
<path d="M96,62 L150,58 Q158,58 158,66 L156,86 Q156,92 148,92 L100,94 Q92,94 92,86 Z" fill="#f7eccc" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M104,72 L146,70 M104,80 L146,78" stroke="#c9b98f" stroke-width="1.5"/>
<path d="M152,62 L196,40" stroke="#333" stroke-width="14" stroke-linecap="round"/>
<path d="M152,62 L196,40" stroke="#f3e3d3" stroke-width="9.5" stroke-linecap="round"/>
<path d="M88,52 Q126,38 166,48" fill="none" stroke="#c33" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<line x1="40" y1="70" x2="56" y2="96" stroke="#0b5cad" stroke-width="1"/>
<text x="12" y="64" font-size="13" fill="#0b5cad">头</text>
<line x1="200" y1="76" x2="160" y2="94" stroke="#0b5cad" stroke-width="1"/>
<text x="184" y="72" font-size="13" fill="#0b5cad">背部</text>
<text x="12" y="186">用干毛巾擦干全身,</text>
<text x="12" y="208">尤其是头和背部</text>
<text x="12" y="232" font-size="13" fill="#0b5cad">擦干 = 保暖 + 刺激呼吸</text>
</g>

<!-- ③ 换干毛巾包住 -->
<g transform="translate(484,124)">
<rect x="0" y="0" width="226" height="246" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="26" font-size="16" font-weight="bold">③ 换干毛巾包住</text>
<path d="M14,150 Q100,134 186,150" fill="none" stroke="#cfe0f0" stroke-width="16"/>
<path d="M14,142 Q100,126 186,142" fill="none" stroke="#999" stroke-width="2"/>
<!-- 包好的宝宝: 毛巾盖住头和身体,只露脸 -->
<path d="M40,118 Q30,82 62,76 L150,90 Q176,98 170,120 Q166,132 140,132 L54,134 Q42,132 40,118 Z" fill="#f7eccc" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M44,124 Q50,104 64,100 Q74,104 72,120 Q66,132 52,132 Z" fill="#f3e3d3" stroke="#333" stroke-width="1.8"/>
<path d="M54,118 Q57,120 60,118" fill="none" stroke="#333" stroke-width="1.4"/>
<path d="M88,84 Q96,112 92,132 M120,88 Q126,110 124,132" fill="none" stroke="#c9b98f" stroke-width="1.5"/>
<line x1="56" y1="56" x2="60" y2="80" stroke="#0b5cad" stroke-width="1"/>
<text x="22" y="52" font-size="13" fill="#0b5cad">盖住头部</text>
<!-- 湿毛巾拿走 -->
<path d="M168,48 L198,48 L200,76 L170,78 Z" fill="#dfe6ee" stroke="#777" stroke-width="1.5"/>
<path d="M176,84 l-2,6 a2.5,2.5 0 1 0 4,0 Z M190,86 l-2,6 a2.5,2.5 0 1 0 4,0 Z" fill="#0b5cad"/>
<path d="M164,44 L204,82 M204,44 L164,82" stroke="#c33" stroke-width="2.5"/>
<text x="92" y="62" font-size="13" fill="#c33">湿毛巾换掉</text>
<text x="12" y="186">换掉湿毛巾,用干的毛巾</text>
<text x="12" y="208">包住宝宝,盖住头部</text>
<text x="12" y="232" font-size="13" fill="#0b5cad">头部散热很多</text>
</g>

<!-- ④ 观察 -->
<g transform="translate(10,380)">
<rect x="0" y="0" width="700" height="66" rx="8" fill="#eef4fb" stroke="#0b5cad" stroke-width="1.5"/>
<text x="14" y="26"><tspan font-weight="bold" font-size="16">④ 观察:</tspan> 是否哭?是否在呼吸?皮肤颜色?手脚是否有活动?</text>
<text x="14" y="52" font-size="13">正常: 哭出声、呼吸规则、肤色逐渐变红润、四肢活动;手脚稍发紫在最初几分钟是正常的</text>
</g>

<text x="14" y="478" font-size="17" font-weight="bold" fill="#c33">宝宝不哭、不呼吸</text>

<!-- 1 刺激 -->
<g transform="translate(10,490)">
<rect x="0" y="0" width="226" height="226" rx="8" fill="none" stroke="#c33" stroke-width="1.5"/>
<circle cx="24" cy="22" r="13" fill="#c33"/>
<text x="24" y="28" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="44" y="28" font-size="16" font-weight="bold">刺激呼吸</text>
<path d="M14,134 Q100,120 160,134" fill="none" stroke="#cfe0f0" stroke-width="14"/>
<path d="M14,127 Q100,113 160,127" fill="none" stroke="#999" stroke-width="2"/>
<g transform="translate(40,98) scale(1.2)"><use href="#babyP"/></g>
<!-- 手指弹脚底 -->
<path d="M206,86 L152,108" stroke="#333" stroke-width="12" stroke-linecap="round"/>
<path d="M206,86 L152,108" stroke="#f3e3d3" stroke-width="7.5" stroke-linecap="round"/>
<path d="M140,92 q-6,6 0,14 M134,88 q-9,9 0,22" fill="none" stroke="#c33" stroke-width="2"/>
<line x1="176" y1="128" x2="140" y2="118" stroke="#0b5cad" stroke-width="1"/>
<text x="160" y="140" font-size="13" fill="#0b5cad">脚底</text>
<path d="M50,60 Q74,48 100,60" fill="none" stroke="#c33" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="104" y="58" font-size="13" fill="#c33">用力擦干背部</text>
<text x="12" y="172">继续用力擦干背部,</text>
<text x="12" y="194">轻弹脚底</text>
</g>

<!-- 2 擦掉黏液 -->
<g transform="translate(247,490)">
<rect x="0" y="0" width="226" height="226" rx="8" fill="none" stroke="#c33" stroke-width="1.5"/>
<circle cx="24" cy="22" r="13" fill="#c33"/>
<text x="24" y="28" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="44" y="28" font-size="16" font-weight="bold">擦掉明显黏液</text>
<!-- 宝宝头部特写,侧脸朝右 -->
<path d="M58,148 Q60,128 76,124 L104,124 Q118,128 120,148 Z" fill="#f3e3d3" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<circle cx="86" cy="90" r="36" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/>
<path d="M60,66 Q76,52 98,58" fill="none" stroke="#555" stroke-width="1.5"/>
<path d="M120,86 L128,96 L120,100" fill="#f3e3d3" stroke="#333" stroke-width="2" stroke-linejoin="round"/>
<path d="M102,84 Q107,87 112,84" fill="none" stroke="#333" stroke-width="1.8"/>
<path d="M114,110 Q118,108 121,111" fill="none" stroke="#333" stroke-width="1.8"/>
<!-- 裹布的手指 -->
<path d="M196,140 L138,112" stroke="#333" stroke-width="13" stroke-linecap="round"/>
<path d="M196,140 L138,112" stroke="#f3e3d3" stroke-width="8.5" stroke-linecap="round"/>
<path d="M124,98 Q132,92 144,100 L150,114 Q142,122 132,118 Z" fill="#fff" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<line x1="170" y1="70" x2="142" y2="98" stroke="#0b5cad" stroke-width="1"/>
<text x="150" y="64" font-size="13" fill="#0b5cad">干净的布</text>
<text x="12" y="172">嘴和鼻子里有明显的黏液:</text>
<text x="12" y="194">用干净的布擦掉</text>
</g>

<!-- 3 人工呼吸 -->
<g transform="translate(484,490)">
<rect x="0" y="0" width="226" height="226" rx="8" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<circle cx="24" cy="22" r="13" fill="#c33"/>
<text x="24" y="28" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="44" y="28" font-size="16" font-weight="bold">仍不呼吸 → 吹气</text>
<line x1="12" y1="140" x2="214" y2="140" stroke="#999" stroke-width="3"/>
<!-- 仰卧宝宝,头朝左,脸朝上,头部正中 -->
<path d="M156,128 L176,110 L194,134" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M156,128 L176,110 L194,134" fill="none" stroke="#f3e3d3" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="124" cy="126" rx="40" ry="13" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<path d="M104,118 Q114,104 128,112" fill="none" stroke="#333" stroke-width="2"/>
<circle cx="66" cy="122" r="17" fill="#f3e3d3" stroke="#333" stroke-width="2.2"/>
<path d="M60,104 L62,99 L67,105" fill="#f3e3d3" stroke="#333" stroke-width="1.8" stroke-linejoin="round"/>
<path d="M71,107 Q74,105 77,108" fill="none" stroke="#333" stroke-width="1.6"/>
<path d="M52,114 Q55,112 58,114" fill="none" stroke="#333" stroke-width="1.4"/>
<ellipse cx="68" cy="104" rx="15" ry="8" fill="none" stroke="#c33" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="34" y1="104" x2="100" y2="104" stroke="#0b5cad" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="124" y1="66" x2="80" y2="100" stroke="#c33" stroke-width="1"/>
<text x="100" y="52" font-size="13" fill="#c33">嘴同时包住</text>
<text x="100" y="68" font-size="13" fill="#c33">口和鼻</text>
<text x="12" y="162" font-size="13" fill="#0b5cad">平躺在平坦处,头保持正中,</text>
<text x="12" y="179" font-size="13" fill="#0b5cad">不要过度后仰</text>
<text x="12" y="199" font-size="13">擦干、刺激后仍不呼吸,</text>
<text x="12" y="216" font-size="13">或只有偶尔的喘息</text>
</g>

<!-- 人工呼吸要点 -->
<g transform="translate(10,728)">
<rect x="0" y="0" width="700" height="140" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="16" y="28" font-weight="bold" fill="#c33" font-size="16">立即告诉120调度员,按指导做;开始人工呼吸:</text>
<text x="16" y="54">· 轻轻吹气,量只是你口腔里的一小口气,看到胸部轻微起伏即可</text>
<text x="16" y="78">· 每1-2秒吹一次(每分钟30-60次),每次吹完让气自己呼出来;每隔一会儿看是否开始自己呼吸</text>
<text x="16" y="102">· 需要人工呼吸时,先处理脐带(见脐带的处理),以便把宝宝放到平坦的地方</text>
<text x="16" y="126">· 持续进行,直到宝宝开始自主呼吸或急救人员到达</text>
</g>
</g>
</svg>
