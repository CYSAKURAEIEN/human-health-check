<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" width="720" height="836" role="img" aria-label="测纬度。北极星法: 北半球北极星的高度角约等于当地纬度,误差不到1°,例如北极星离地平线40°,约北纬40°(北京附近)。用象限仪测高度角: 四分之一圆形的木板,弧边刻0°-90°的刻度,一条直边上装两个小孔作为瞄准器,圆心处挂一根细线和小重物作为铅垂线;沿瞄准器对准星星,铅垂线在弧上指示的读数就是高度角,精度大约0.5-1°。正午太阳法: 测出当天正午太阳最高时的高度角h,查出或算出当天太阳的赤纬δ,北半球太阳在南方时,纬度等于90°减h加δ;春分和秋分δ约0°,夏至约+23.44°,冬至约-23.44°;例如6月21日正午太阳高度80°,纬度约33.4°,约北纬33°。不要直视太阳: 测太阳时让阳光穿过前面的小孔,光点落在后面小孔上" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>测纬度: 北极星法和正午太阳法</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">测纬度: 北极星的高度角 ≈ 当地纬度(北半球)</text>

<!-- ① 北极星法 -->
<rect x="10" y="44" width="700" height="410" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="70" font-size="16" font-weight="bold">① 北极星法: 用象限仪测高度角</text>

<!-- 视线 -->
<path d="M70,356.7 L396.4,82.9" stroke="#c33" stroke-width="1.6" stroke-dasharray="7 4"/>
<!-- 北极星 -->
<circle cx="396.4" cy="82.9" r="11" fill="none" stroke="#c33" stroke-width="2"/>
<circle cx="396.4" cy="82.9" r="5" fill="#333"/>
<text x="414" y="88" font-size="16" font-weight="bold" fill="#c33">北极星</text>

<!-- 象限仪 -->
<path d="M220.2,230.7 L90,340 A170,170 0 0 0 329.5,360.9 Z" fill="#ead7b2" stroke="#333" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M329.5,360.9 L320.5,350.2 M305.2,377.9 L300.7,370.1 M278.3,390.4 L275.3,382.0 M249.7,398.1 L247.3,384.3 M190.7,398.1 L192.2,389.3 M162.1,390.4 L166.8,377.3 M135.2,377.9 L139.7,370.1 M110.9,360.9 L116.7,354.0 M90.0,340.0 L100.7,331.0" stroke="#333" stroke-width="1.5"/>
<path d="M317.7,370.0 L314.3,365.0 M292.0,384.8 L289.5,379.3 M264.2,394.9 L262.6,389.1 M235.0,400.1 L234.5,394.1 M205.4,400.1 L205.9,394.1 M176.2,394.9 L177.8,389.1 M148.4,384.8 L150.9,379.3 M122.7,370.0 L126.1,365.0 M100.0,350.9 L104.2,346.7" stroke="#333" stroke-width="1"/>
<text x="311.5" y="344.5" font-size="13" text-anchor="middle">0°</text>
<text x="244.9" y="375.5" font-size="13" text-anchor="middle">30°</text>
<text x="171.6" y="369.1" font-size="13" text-anchor="middle">60°</text>
<text x="123" y="330" font-size="13" text-anchor="middle">90°</text>
<!-- 瞄准孔 -->
<path d="M103.7,337.6 L94.7,326.9 M215.5,243.8 L206.5,233.1" stroke="#333" stroke-width="5"/>
<circle cx="99.2" cy="332.3" r="1.8" fill="#fff"/>
<circle cx="211" cy="238.4" r="1.8" fill="#fff"/>
<text x="36" y="232" font-size="13" fill="#0b5cad">两个瞄准孔</text>
<path d="M66,238 L94,321 M104,228 L203,233" stroke="#0b5cad" stroke-width="1"/>
<!-- 铅垂线 -->
<path d="M220.2,230.7 V418" stroke="#333" stroke-width="1.3"/>
<path d="M220.2,418 l-6,4 l6,12 l6,-12 Z" fill="#555" stroke="#333" stroke-width="1.2"/>
<circle cx="220.2" cy="230.7" r="3" fill="#333"/>
<path d="M220.2,400.7 L220.2,384" stroke="#c33" stroke-width="3"/>
<text x="236" y="428" font-size="15" font-weight="bold" fill="#c33">读数 40°</text>
<text x="160" y="446" font-size="13" fill="#555" text-anchor="end">铅垂线(细线+小重物)</text>
<path d="M162,442 L214,428" stroke="#555" stroke-width="1"/>
<!-- 高度角 -->
<path d="M220.2,230.7 H340" stroke="#0b5cad" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="344" y="235" font-size="13" fill="#0b5cad">水平</text>
<path d="M290.2,230.7 A70,70 0 0 0 273.8,185.7" fill="none" stroke="#c33" stroke-width="2"/>
<text x="296" y="216" font-size="15" font-weight="bold" fill="#c33">h = 40°</text>
<!-- 眼睛 -->
<path d="M56,356.7 Q70,346 84,356.7 Q70,367 56,356.7 Z" fill="#fff" stroke="#333" stroke-width="1.6"/>
<circle cx="70" cy="356.7" r="3.6" fill="#333"/>
<text x="54" y="384" font-size="13">眼睛</text>

<!-- 说明 -->
<text x="430" y="132" font-size="15" font-weight="bold">象限仪(陆地上使用)</text>
<text x="430" y="156" font-size="14">· 四分之一圆形的木板,</text>
<text x="444" y="175" font-size="14">弧边刻0°-90°</text>
<text x="430" y="198" font-size="14">· 一条直边上装两个小孔</text>
<text x="444" y="217" font-size="14">或一根细管(瞄准器)</text>
<text x="430" y="240" font-size="14">· 圆心挂一根细线,下面</text>
<text x="444" y="259" font-size="14">拴一个小重物(铅垂线)</text>
<text x="430" y="288" font-size="14" font-weight="bold">沿瞄准器对准北极星,</text>
<text x="430" y="307" font-size="14" font-weight="bold">铅垂线在弧上的读数</text>
<text x="430" y="326" font-size="14" font-weight="bold">就是高度角</text>
<text x="430" y="347" font-size="13" fill="#555">精度大约0.5-1°,刻度越大越准</text>
<rect x="424" y="362" width="276" height="80" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="436" y="385" font-size="14" font-weight="bold" fill="#0b5cad">北极星的高度角 ≈ 当地纬度</text>
<text x="436" y="406" font-size="13">(北半球,误差不到1°)</text>
<text x="436" y="430" font-size="14">例: 40° → 约北纬40°(北京附近)</text>

<!-- ② 正午太阳法 -->
<rect x="10" y="466" width="700" height="360" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="492" font-size="16" font-weight="bold">② 正午太阳法(任何一天都能用)</text>
<!-- 地平线 -->
<path d="M30,700 H330" stroke="#999" stroke-width="2.5"/>
<text x="330" y="722" font-size="14" font-weight="bold" text-anchor="end">正南 →</text>
<!-- 太阳 -->
<g stroke="#e0a020" stroke-width="2.5">
<path d="M204,526 v-12 M204,566 v12 M184,546 h-12 M224,546 h12 M190,532 l-8,-8 M218,532 l8,-8 M190,560 l-8,8 M218,560 l8,8"/>
</g>
<circle cx="204" cy="546" r="15" fill="#ffd34d" stroke="#c98a00" stroke-width="2"/>
<path d="M80,700 L193,559" stroke="#c33" stroke-width="1.6" stroke-dasharray="7 4"/>
<circle cx="80" cy="700" r="4" fill="#333"/>
<text x="80" y="722" font-size="13" text-anchor="middle">观测点</text>
<path d="M140,700 A60,60 0 0 0 117.5,653.2" fill="none" stroke="#c33" stroke-width="2"/>
<text x="148" y="686" font-size="16" font-weight="bold" fill="#c33">h</text>
<text x="240" y="562" font-size="13">正午(太阳最高时)</text>
<text x="240" y="580" font-size="13">太阳在正南方</text>
<text x="30" y="748" font-size="13">h: 正午太阳的高度角</text>
<text x="30" y="772" font-size="13" fill="#c33" font-weight="bold">⚠️ 不要直视太阳:</text>
<text x="30" y="791" font-size="13" fill="#c33">让阳光穿过前面的小孔,光点落在</text>
<text x="30" y="810" font-size="13" fill="#c33">后面的小孔上,不要用眼睛看</text>

<!-- 公式 -->
<rect x="344" y="508" width="356" height="56" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<text x="522" y="535" font-size="18" font-weight="bold" text-anchor="middle">纬度 = 90° − h + δ</text>
<text x="522" y="555" font-size="12" fill="#555" text-anchor="middle">(北半球、太阳在南方时;δ: 当天太阳的赤纬)</text>
<text x="352" y="590" font-size="14" font-weight="bold">太阳赤纬 δ</text>
<g font-size="13">
<text x="352" y="612">春分(约3月21日)</text><text x="560" y="612">δ ≈ 0°</text>
<text x="352" y="632">夏至(约6月21日)</text><text x="560" y="632">δ ≈ +23.44°</text>
<text x="352" y="652">秋分(约9月23日)</text><text x="560" y="652">δ ≈ 0°</text>
<text x="352" y="672">冬至(约12月22日)</text><text x="560" y="672">δ ≈ −23.44°</text>
<text x="352" y="696" fill="#555">其他日子: δ ≈ 23.44° × sin[360° × (N − 81) ÷ 365]</text>
<text x="352" y="714" fill="#555">N: 当天是一年中的第几天(1月1日为1)</text>
</g>
<rect x="344" y="728" width="356" height="86" rx="6" fill="none" stroke="#bbb" stroke-width="1.2"/>
<text x="356" y="750" font-size="14" font-weight="bold">例: 6月21日正午,太阳高度80°</text>
<text x="356" y="772" font-size="14">纬度 = 90 − 80 + 23.44 ≈ 33.4°</text>
<text x="356" y="794" font-size="14">→ 约北纬33°</text>
<text x="694" y="808" font-size="11" fill="#888" text-anchor="end">太阳高度角按示意画</text>
</g>
</svg>
