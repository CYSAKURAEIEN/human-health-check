<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img" aria-label="简易蒸馏装置: 大锅(蒸馏瓶)装入米酒或果酒到约70%满,盖上锅盖,从盖上的孔接出铜管或竹筒;下面用木炭火小火慢慢加热,控制温度78-85°C,酒精沸点78°C;蒸汽经管子进入盘绕在冷水桶里的冷凝管,冷水进、水出,冷凝成液滴滴进接收瓶。分段接收: 最先流出的酒头含甲醇、乙醛等,至少丢弃每10 L原料约100 mL以上;中段收集;末段超过85°C是水蒸出,停止收集。管子材料: 铜管最好,其次不锈钢管、竹筒、陶管,不用塑料管和铅管。甲醇剧毒,自制酒精只可外用,绝不可饮用;酒精蒸汽易燃,必须通风,最好在室外操作" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>简易蒸馏装置</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0b5cad"/></marker>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">简易蒸馏装置(示意): 低度酒 → 高度酒精</text>

<!-- 地面 -->
<rect x="0" y="430" width="720" height="14" fill="#ececec"/>
<path d="M0,430 H720" stroke="#999" stroke-width="3"/>

<!-- 灶和火 -->
<rect x="52" y="336" width="30" height="94" rx="4" fill="#d6d6d6" stroke="#999" stroke-width="2"/>
<rect x="218" y="336" width="30" height="94" rx="4" fill="#d6d6d6" stroke="#999" stroke-width="2"/>
<path d="M118,410 Q114,392 126,382 Q126,396 134,398 Q134,384 146,374 Q146,392 154,396 Q160,384 170,380 Q168,396 180,410 Z" fill="#f5a623" stroke="#c33" stroke-width="1.5"/>
<g fill="#3d3d3d"><circle cx="108" cy="420" r="8"/><circle cx="126" cy="414" r="8"/><circle cx="146" cy="418" r="9"/><circle cx="166" cy="414" r="8"/><circle cx="186" cy="420" r="8"/><circle cx="136" cy="425" r="6"/><circle cx="160" cy="425" r="6"/></g>

<!-- 大锅 -->
<path d="M50,210 V300 Q50,345 150,345 Q250,345 250,300 V210 Z" fill="#fff" stroke="#333" stroke-width="2.5"/>
<path d="M52,250 H248 V300 Q248,343 150,343 Q52,343 52,300 Z" fill="#f5e6b8"/>
<path d="M52,250 H248" stroke="#b8a060" stroke-width="1.5"/>
<rect x="44" y="198" width="212" height="12" rx="4" fill="#c9c9c9" stroke="#333" stroke-width="2"/>
<g fill="none" stroke="#7d93a8" stroke-width="1.5">
<path d="M90,244 Q84,236 90,228 Q96,220 90,214"/><path d="M130,244 Q124,236 130,228 Q136,220 130,214"/><path d="M170,244 Q164,236 170,228 Q176,220 170,214"/><path d="M210,244 Q204,236 210,228 Q216,220 210,214"/>
</g>
<text x="150" y="284" font-size="14" text-anchor="middle">米酒/果酒</text>
<text x="150" y="302" font-size="14" text-anchor="middle" fill="#0b5cad">装到约 <tspan font-weight="bold">70%</tspan> 满</text>
<text x="56" y="190" font-size="14" font-weight="bold">大锅(蒸馏瓶)</text>

<!-- 管子 -->
<path d="M200,204 V150 Q200,137 214,137 L364,148 Q376,149 376,162 V202" fill="none" stroke="#333" stroke-width="11" stroke-linejoin="round"/>
<path d="M200,204 V150 Q200,137 214,137 L364,148 Q376,149 376,162 V202" fill="none" stroke="#c98a4b" stroke-width="7" stroke-linejoin="round"/>
<path d="M232,124 L318,130" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="234" y="116" font-size="14" fill="#c33">蒸汽</text>
<text x="212" y="176" font-size="13" fill="#555">锅盖开孔,插管子</text>

<!-- 冷水桶和冷凝管 -->
<rect x="362" y="360" width="30" height="70" fill="#d6d6d6" stroke="#999" stroke-width="2"/>
<rect x="468" y="360" width="30" height="70" fill="#d6d6d6" stroke="#999" stroke-width="2"/>
<path d="M352,174 L358,358 H502 L508,174 Z" fill="#cfe6f7"/>
<path d="M350,160 L358,360 H502 L510,160" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M486,214 Q430,205 374,228 M486,242 Q430,233 374,256 M486,270 Q430,261 374,284 M486,298 Q430,289 374,312" fill="none" stroke="#d9b48a" stroke-width="5"/>
<path d="M374,200 Q430,223 486,214 M374,228 Q430,251 486,242 M374,256 Q430,279 486,270 M374,284 Q430,307 486,298 M374,312 Q430,335 486,326 V340 H566 Q574,340 574,348 V356" fill="none" stroke="#a8652a" stroke-width="5" stroke-linejoin="round"/>
<path d="M354,348 H332 V356" fill="none" stroke="#777" stroke-width="5"/>
<path d="M332,362 V384" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="324" y="380" font-size="14" fill="#0b5cad" text-anchor="end">水出</text>
<path d="M552,136 Q522,142 506,166" fill="none" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="556" y="140" font-size="14" fill="#0b5cad">冷水进</text>
<text x="430" y="400" font-size="13" fill="#555" text-anchor="middle">冷水桶</text>
<text x="390" y="74" font-size="14" font-weight="bold">冷凝管: 盘绕在冷水中</text>
<text x="390" y="92" font-size="13" fill="#555">(管子用什么材料见右下)</text>
<line x1="440" y1="98" x2="452" y2="216" stroke="#555" stroke-width="1"/>

<!-- 接收瓶 -->
<g fill="#0b5cad"><path d="M574,362 Q570,368 574,370 Q578,368 574,362 Z"/><path d="M574,372 Q570,378 574,380 Q578,378 574,372 Z"/></g>
<path d="M566,384 V394 Q548,398 548,410 V428 H600 V410 Q600,398 582,394 V384" fill="#fff" stroke="#333" stroke-width="2"/>
<path d="M550,412 H598 V427 H550 Z" fill="#e8f1fb"/>
<text x="584" y="374" font-size="13" fill="#555">液滴</text>
<text x="608" y="404" font-size="14" font-weight="bold">接收瓶</text>
<text x="608" y="422" font-size="14">高度酒精</text>

<!-- 加热、温度 -->
<text x="16" y="72" font-size="14" font-weight="bold">小火慢慢加热</text>
<text x="16" y="92" font-size="14" fill="#0b5cad">控制温度 <tspan font-weight="bold">78-85°C</tspan></text>
<text x="16" y="110" font-size="13" fill="#0b5cad">(酒精沸点 78°C)</text>
<text x="150" y="464" font-size="14" text-anchor="middle">木炭火</text>

<!-- 分段接收 -->
<rect x="10" y="478" width="430" height="178" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="500" font-size="15" font-weight="bold">分段接收: 温度控制是关键</text>
<g stroke="#333" stroke-width="1.5">
<path d="M98,512 V518 Q86,521 86,530 V548 H122 V530 Q122,521 110,518 V512" fill="#fff"/>
<path d="M246,512 V518 Q234,521 234,530 V548 H270 V530 Q270,521 258,518 V512" fill="#fff"/>
<path d="M366,512 V518 Q354,521 354,530 V548 H390 V530 Q390,521 378,518 V512" fill="#fff"/>
</g>
<rect x="87" y="538" width="34" height="9" fill="#f5d0d0"/>
<rect x="235" y="530" width="34" height="17" fill="#e8f1fb"/>
<rect x="355" y="538" width="34" height="9" fill="#eee"/>
<path d="M82,514 L126,552 M126,514 L82,552" stroke="#c33" stroke-width="3"/>
<g font-size="13" text-anchor="middle">
<text x="104" y="572" font-size="14" font-weight="bold" fill="#c33">① 酒头(最先流出)</text>
<text x="104" y="590">含甲醇、乙醛等</text>
<text x="104" y="608" font-weight="bold" fill="#c33">→ 丢弃!</text>
<text x="104" y="626">至少丢弃最初的馏出液</text>
<text x="104" y="643">每 10 L 原料约 100 mL 以上</text>
<text x="252" y="572" font-size="14" font-weight="bold">② 中段</text>
<text x="252" y="590">高度酒精</text>
<text x="252" y="608" font-weight="bold" fill="#0b5cad">→ 收集</text>
<text x="372" y="572" font-size="14" font-weight="bold">③ 末段</text>
<text x="372" y="590">&gt;85°C 水蒸出</text>
<text x="372" y="608" font-weight="bold">→ 停止收集</text>
</g>

<!-- 管子材料 -->
<rect x="450" y="478" width="260" height="178" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="464" y="500" font-size="15" font-weight="bold">管子用什么材料(优先级)</text>
<g font-size="14">
<text x="464" y="524">1. 铜管(最好,导热好,无毒)</text>
<text x="464" y="546">2. 不锈钢管</text>
<text x="464" y="568">3. 竹筒(凿通竹节)</text>
<text x="464" y="590">4. 陶管</text>
<text x="464" y="616" font-weight="bold" fill="#c33">✗ 塑料管(有毒物溶出!)</text>
<text x="464" y="640" font-weight="bold" fill="#c33">✗ 铅管(剧毒!)</text>
</g>

<!-- 安全 -->
<rect x="10" y="668" width="700" height="162" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="24" y="692" font-size="15" font-weight="bold" fill="#c33">⚠ 甲醇剧毒,可致失明、死亡</text>
<text x="40" y="714" font-size="14">自制酒精只可外用,绝不可饮用,也不能兑成酒</text>
<text x="24" y="742" font-size="15" font-weight="bold" fill="#c33">⚠ 蒸馏酒精会产生易燃蒸汽: 必须通风,最好在室外操作</text>
<text x="40" y="764" font-size="14">酒精蒸气比空气重,会沿地面飘到火源处,遇明火、火星即燃</text>
<text x="24" y="792" font-size="15" font-weight="bold" fill="#c33">⚠ 酒精着火时火焰在白天几乎看不见</text>
<text x="40" y="814" font-size="14">小火用湿布或锅盖盖灭,不要用嘴吹,不要泼水到盛酒精的容器里</text>
</g>
</svg>
