<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 816" width="720" height="816" role="img" aria-label="马齿苋与趴地生长的大戟科植物对照示意: 两者都趴地生长、茎常带红色,有的长在同一块地里。马齿苋是肉质草本,茎平卧、多分枝、圆柱形、淡绿色或带紫红色、光滑无毛,叶倒卵形、像马齿或小勺子、肥厚多汁,开黄色小花;掐断流出透明的黏液,没有白色乳汁。斑地锦、地锦草等大戟科植物叶片薄而小、不肉质,折断有白色乳汁,乳汁刺激皮肤和眼睛,误食引起口腔灼痛、剧烈呕吐腹泻;同科的泽漆是直立的,叶在茎顶轮生。有白色乳汁的一律不是马齿苋,不采">
<rect width="100%" height="100%" fill="#fff"/>
<title>马齿苋与大戟科植物对照</title>
