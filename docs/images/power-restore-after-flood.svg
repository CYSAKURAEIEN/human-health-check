<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" width="720" height="736" role="img" aria-label="灾后恢复用电: 洪水、台风、地震后,电气线路可能已经泡水或受损,来电后再出事的情况并不少见。灾前或灾中: 预计会被水淹时,提前关掉总闸;不要涉水进入有电器的房间;房间进水时,不要站在水里去拉闸。灾后: 泡过水的电器、插座、配电箱,没经过电工检查不要通电,即使看起来已经干了;请电工检查线路后再合总闸;墙体开裂、房屋受损的,电线可能被拉断或挤破,也要先检查;闻到焦味、看到冒烟、听到打火声,立即拉总闸。用发电机时: 绝不在室内、车库、窗户附近使用(一氧化碳中毒);不要把发电机接到家里的插座或配电箱上反送电,会电死抢修工人" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>灾后恢复用电</title>
<defs>
<marker id="arK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#555"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<g id="ok"><circle r="13" fill="#0b5cad"/><path d="M-6 0 L-2 5 L7 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="no"><circle r="13" fill="#c33"/><path d="M-5.5 -5.5 L5.5 5.5 M5.5 -5.5 L-5.5 5.5" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
<g id="p">
<path d="M-3 -12 L-5 0 M3 -12 L5 0" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
<rect x="-7" y="-31" width="14" height="20" rx="4" fill="#cfe0f0" stroke="#333" stroke-width="2"/>
<circle cx="0" cy="-38" r="7" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
<g id="box">
<rect x="0" y="0" width="80" height="96" rx="4" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
<rect x="10" y="14" width="20" height="44" rx="2" fill="#ddd" stroke="#333" stroke-width="1.5"/>
<rect x="38" y="14" width="10" height="44" rx="2" fill="#ddd" stroke="#333" stroke-width="1.2"/>
<rect x="52" y="14" width="10" height="44" rx="2" fill="#ddd" stroke="#333" stroke-width="1.2"/>
<rect x="66" y="14" width="8" height="44" rx="2" fill="#ddd" stroke="#333" stroke-width="1.2"/>
<g fill="#333"><rect x="40" y="18" width="6" height="16"/><rect x="54" y="18" width="6" height="16"/><rect x="68" y="18" width="4" height="16"/></g>
</g>
<path id="wave" d="M0 0 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">灾后恢复用电: 先检查,再通电</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">洪水、台风、地震后,电气线路可能已经泡水或受损,来电后再出事的情况并不少见</text>

<!-- 灾前或灾中 -->
<rect x="10" y="66" width="700" height="248" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="92" font-size="16" font-weight="bold">灾前或灾中</text>

<g transform="translate(24,104)">
<rect width="214" height="198" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<g transform="translate(62,12)"><use href="#box"/><rect x="12" y="38" width="16" height="18" rx="2" fill="#333"/></g>
<path d="M50 30 V66" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<text x="84" y="128" font-size="12" text-anchor="middle" fill="#0b5cad">总闸(关)</text>
<use href="#ok" x="186" y="26"/>
<text x="12" y="158" font-size="14" font-weight="bold">预计会被水淹时,</text>
<text x="12" y="180" font-size="14" font-weight="bold">提前关掉总闸</text>
</g>

<g transform="translate(253,104)">
<rect width="214" height="198" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<rect x="14" y="10" width="186" height="118" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<rect x="34" y="62" width="24" height="18" rx="3" fill="#fff" stroke="#333" stroke-width="1.5"/>
<path d="M42 68 V74 M50 68 V74" stroke="#333" stroke-width="2"/>
<rect x="150" y="38" width="38" height="90" rx="3" fill="#e8e8e8" stroke="#333" stroke-width="1.5"/>
<path d="M150 70 H188" stroke="#333" stroke-width="1.2"/>
<rect x="15" y="92" width="184" height="35" fill="#cfe0f0" fill-opacity="0.85"/>
<use href="#wave" x="15" y="92" fill="none" stroke="#7aa6cc" stroke-width="2"/>
<g transform="translate(104,124) scale(1.3)"><use href="#p"/></g>
<use href="#no" x="186" y="24"/>
<text x="12" y="158" font-size="14" font-weight="bold">不要涉水进入</text>
<text x="12" y="180" font-size="14" font-weight="bold">有电器的房间</text>
</g>

<g transform="translate(482,104)">
<rect width="214" height="198" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<rect x="14" y="10" width="186" height="118" fill="#fafafa" stroke="#999" stroke-width="1.5"/>
<g transform="translate(118,22) scale(0.6)"><use href="#box"/><rect x="12" y="16" width="16" height="18" rx="2" fill="#333"/></g>
<rect x="15" y="92" width="184" height="35" fill="#cfe0f0" fill-opacity="0.85"/>
<use href="#wave" x="15" y="92" fill="none" stroke="#7aa6cc" stroke-width="2"/>
<g transform="translate(88,124) scale(1.3)"><use href="#p"/></g>
<path d="M94 82 L126 42" stroke="#333" stroke-width="3.5" stroke-linecap="round"/>
<use href="#no" x="186" y="24"/>
<text x="12" y="158" font-size="14" font-weight="bold">房间进水时,</text>
<text x="12" y="180" font-size="14" font-weight="bold">不要站在水里去拉闸</text>
</g>

<!-- 灾后 -->
<rect x="10" y="326" width="700" height="250" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="352" font-size="16" font-weight="bold">灾后: 按顺序来</text>

<rect x="24" y="366" width="440" height="62" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<use href="#no" x="48" y="397"/>
<text x="72" y="390" font-size="14" font-weight="bold">① 泡过水的电器、插座、配电箱:</text>
<text x="72" y="412" font-size="14"><tspan font-weight="bold" fill="#c33">没经过电工检查不要通电</tspan>(即使看起来已经干了)</text>
<path d="M244 430 V448" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<rect x="24" y="452" width="440" height="62" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<use href="#ok" x="48" y="483"/>
<text x="72" y="476" font-size="14" font-weight="bold">② 请电工检查线路</text>
<text x="72" y="498" font-size="13">墙体开裂、房屋受损的,电线可能被拉断或挤破,也要先检查</text>
<path d="M244 516 V530" stroke="#555" stroke-width="2" marker-end="url(#arK)"/>
<rect x="24" y="534" width="440" height="34" rx="6" fill="#f4f8fc" stroke="#0b5cad" stroke-width="1.5"/>
<use href="#ok" x="48" y="551"/>
<text x="72" y="556" font-size="14" font-weight="bold">③ 检查后再合总闸</text>

<rect x="480" y="366" width="216" height="202" rx="6" fill="#fff" stroke="#c33" stroke-width="2"/>
<text x="494" y="392" font-size="15" font-weight="bold" fill="#c33">⚠️ 一旦发现</text>
<text x="494" y="420" font-size="14">• 闻到焦味</text>
<text x="494" y="444" font-size="14">• 看到冒烟</text>
<text x="494" y="468" font-size="14">• 听到打火声</text>
<path d="M494 490 H520" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="528" y="496" font-size="16" font-weight="bold" fill="#c33">立即拉总闸</text>
<g transform="translate(560,510) scale(0.5)"><use href="#box"/><rect x="12" y="38" width="16" height="18" rx="2" fill="#333"/></g>

<!-- 发电机 -->
<rect x="10" y="588" width="700" height="134" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="24" y="614" font-size="16" font-weight="bold">用发电机时</text>
<use href="#no" x="40" y="644"/>
<text x="62" y="649" font-size="14"><tspan font-weight="bold">绝不在室内、车库、窗户附近使用</tspan>(一氧化碳中毒)</text>
<use href="#no" x="40" y="688"/>
<text x="62" y="684" font-size="14"><tspan font-weight="bold">不要把发电机接到家里的插座或配电箱上"反送电"</tspan></text>
<text x="62" y="704" font-size="14" fill="#c33">会电死抢修工人</text>
</g>
</svg>
