<text x="50" y="20" font-size="13" fill="#555">第7年砍</text>
<use href="#s1" x="26" y="88"/>
<use href="#s1" x="70" y="88"/>
<use href="#s1" x="114" y="88"/>
</g>
<g transform="translate(376,160)">
<rect x="3" y="3" width="134" height="94" fill="#fbecec" stroke="#c33" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="8" y="20" font-size="13" font-weight="bold">第6块</text>
<text x="50" y="20" font-size="13" fill="#555">第6年砍</text>
<use href="#s2" x="26" y="88"/>
<use href="#s2" x="70" y="88"/>
<use href="#s2" x="114" y="88"/>
</g>
