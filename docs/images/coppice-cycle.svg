<path d="M92,210 H66 V110 H88" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="30" y="152" font-size="13" fill="#c33">第9年</text>
<text x="30" y="168" font-size="13" fill="#c33">回到</text>
<text x="30" y="184" font-size="13" fill="#c33">第1块</text>
<g transform="translate(96,260)">
<use href="#stone" x="6" y="22" fill="#9a9a9a" stroke="#555" stroke-width="0.8"/>
<text x="18" y="24" font-size="13" fill="#0b5cad">边界: 石堆、刻痕或界桩</text>
<use href="#big" x="190" y="30" transform="translate(190,30) scale(0.4) translate(-190,-30)"/>
<text x="200" y="24" font-size="13" fill="#0b5cad">每块可留几棵大树不砍</text>
<rect x="356" y="12" width="16" height="14" fill="#fbecec" stroke="#c33" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="378" y="24" font-size="13" fill="#c33">刚砍过两三年内: 禁止放牧</text>
</g>
<text x="12" y="306">✓ 在地图或本子上记下每一块的位置、面积、砍伐年份和产量</text>
<text x="12" y="326" fill="#c33">✗ 刚砍过的块,头两三年禁止放牧: 牲畜会啃光萌条</text>
</g>
<g transform="translate(10,768)">
<rect width="700" height="170" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">能萌生的树和大致轮伐周期</text>
<text x="206" y="24" font-size="13" fill="#555">(经验值,仅供参考,随气候、立地和想要的柴的粗细变化很大)</text>
<text x="12" y="52">柳、旱柳、杞柳 <tspan font-weight="bold">2-5年</tspan></text>
<text x="236" y="52">桉树 <tspan font-weight="bold">3-6年</tspan></text>
<text x="440" y="52">杨树、刺槐 <tspan font-weight="bold">4-8年</tspan></text>
<text x="12" y="76">榆、槐、枫杨、桤木 <tspan font-weight="bold">5-12年</tspan></text>
<text x="236" y="76">栎类、板栗 <tspan font-weight="bold">8-15年</tspan></text>
<text x="12" y="102">周期短: 柴细,砍和搬省力,每次的量少;周期长: 柴粗,可以兼做小木料、烧炭</text>
<text x="12" y="126" fill="#c33">✗ 大多数针叶树(松、杉、柏)砍断后树桩不会再发芽,只能重新种</text>
<text x="12" y="150">管理好的萌生林每公顷每年约长3-8 t干材: 只砍新长出来的那一部分,林子就能一直用下去</text>
</g>
</g>
</svg>
