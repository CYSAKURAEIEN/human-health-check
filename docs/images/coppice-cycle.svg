<text x="50" y="20" font-size="13" fill="#c33">今年(第8年)砍</text>
<use href="#big" x="106" y="88"/>
<use href="#s0" x="22" y="88"/>
<use href="#s0" x="56" y="88"/>
</g>
<g transform="translate(236,160)">
<rect x="3" y="3" width="134" height="94" fill="#fbecec" stroke="#c33" stroke-width="1.2" stroke-dasharray="5 3"/>
