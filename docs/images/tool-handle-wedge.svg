<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 742" width="720" height="742" role="img" aria-label="换工具柄(斧、锤、锄): 1. 拆掉旧柄,把断柄锯掉,剩下的部分从楔子一侧钻孔、敲出;2. 选干透的硬木,木纹顺着柄的长度方向,不能有疤节、裂纹;3. 先粗削,再一边试一边削,让柄头刚好能紧紧敲进工具的孔里;4. 把柄头敲进孔,露出孔外一点,在柄头顶端顺着锯一道口(深约孔深的2/3),往锯口里敲进一个硬木楔子(可以抹点胶)把柄头撑紧,锯平露出的部分;5. 甩一甩、敲一敲,不能有任何松动。斧头、锤头松动时立即停用修理,飞出去会伤人;不要把干燥的工具柄泡在水里让它胀紧,干了以后会更松" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>换工具柄</title>
<defs><marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker><marker id="arB0" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#0b5cad"/></marker><pattern id="hat" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#b8c2cc"/><path d="M0 0 V6" stroke="#7d8894" stroke-width="1"/></pattern><pattern id="cut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fbe9e9"/><path d="M0 0 V6" stroke="#c33" stroke-width="1.2"/></pattern></defs>
<g fill="#222">
<text x="360" y="28" font-size="18" text-anchor="middle" font-weight="bold">换工具柄(斧、锤、锄): 柄头敲进孔,打入木楔撑紧</text>
<rect x="10" y="44" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="186" y="44" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="362" y="44" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="538" y="44" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="10" y="352" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="186" y="352" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="362" y="352" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="538" y="352" width="172" height="300" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="20" y="68" font-size="15" font-weight="bold">① 拆掉旧柄</text>
<text x="20" y="280" font-size="13.5">把断柄锯掉,剩下的</text>
<text x="20" y="299" font-size="13.5">部分从楔子一侧</text>
<text x="20" y="318" font-size="13.5">钻孔、敲出</text>
<text x="196" y="68" font-size="15" font-weight="bold">② 选木料</text>
<text x="196" y="280" font-size="13.5">干透的硬木,木纹</text>
<text x="196" y="299" font-size="13.5">顺着柄的长度方向,</text>
<text x="196" y="318" font-size="13.5">不能有疤节、裂纹</text>
<text x="372" y="68" font-size="15" font-weight="bold">③ 削柄</text>
<text x="372" y="280" font-size="13.5">先粗削,再一边试</text>
<text x="372" y="299" font-size="13.5">一边削,让柄头刚好</text>
<text x="372" y="318" font-size="13.5">能紧紧敲进工具的孔里</text>
<text x="548" y="68" font-size="15" font-weight="bold">④ 敲进孔</text>
<text x="548" y="280" font-size="13.5">把柄头敲进孔,</text>
<text x="548" y="299" font-size="13.5">露出孔外一点</text>
<text x="20" y="376" font-size="15" font-weight="bold">⑤ 锯口</text>
<text x="20" y="588" font-size="13.5">在柄头顶端顺着锯</text>
<text x="20" y="607" font-size="13.5">一道口(深约孔深</text>
<text x="20" y="626" font-size="13.5">的2/3)</text>
<text x="196" y="376" font-size="15" font-weight="bold">⑥ 打楔子</text>
<text x="196" y="588" font-size="13.5">往锯口里敲进一个</text>
<text x="196" y="607" font-size="13.5">硬木楔子(可以抹点</text>
<text x="196" y="626" font-size="13.5">胶),把柄头撑紧</text>
<text x="372" y="376" font-size="15" font-weight="bold">⑦ 锯平</text>
<text x="372" y="588" font-size="13.5">锯平露出的部分</text>
<text x="548" y="376" font-size="15" font-weight="bold">⑧ 检查</text>
<text x="548" y="588" font-size="13.5">甩一甩、敲一敲,</text>
<text x="548" y="607" font-size="13.5">不能有任何松动</text>
