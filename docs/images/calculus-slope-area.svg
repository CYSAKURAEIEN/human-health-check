<path d="M400 469.2 L446 451.6 L492 453.6 L538 458 L584 452.2 L630 451.2 L676 470.5 L676 565.8 L630 549.7 L584 550.4 L538 552.3 L492 569.1 L446 572.9 L400 576.1 Z" fill="none" stroke="#c33" stroke-width="1.5" stroke-dasharray="5 3" stroke-linejoin="round"/>
<g stroke="#0b5cad" stroke-width="1.8">
<path d="M400 469.2 V576.1 M446 451.6 V572.9 M492 453.6 V569.1 M538 458 V552.3 M584 452.2 V550.4 M630 451.2 V549.7 M676 470.5 V565.8"/>
</g>
<g font-size="14" font-weight="bold" fill="#0b5cad" text-anchor="middle">
<text x="400" y="438">f₀</text><text x="446" y="438">f₁</text><text x="492" y="438">f₂</text><text x="538" y="438">f₃</text><text x="584" y="438">f₄</text><text x="630" y="438">f₅</text><text x="676" y="438">f₆</text>
</g>
<path d="M400 594 H446" stroke="#333" stroke-width="1.5" marker-start="url(#arK)" marker-end="url(#arK)"/>
<text x="423" y="612" font-size="14" font-weight="bold" text-anchor="middle">h</text>
<path d="M600 596 H624" stroke="#c33" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="630" y="601" font-size="12" fill="#c33">梯形近似</text>
<g font-size="13">
<text x="380" y="636">面积 ≈ h × [f₀/2 + f₁ + f₂ + … + fₙ₋₁ + fₙ/2]</text>
<text x="380" y="658" fill="#555">(图中 n = 6;辛普森法更准)</text>
</g>
</g>
</svg>
