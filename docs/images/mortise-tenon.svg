<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 684" width="720" height="684" role="img" aria-label="直角榫(用于桌椅腿和横档的连接): 在横档的一端做出榫头,榫头厚度约为木料厚度的1/3,锯掉两侧多余的部分;在腿上对应位置做出卯眼,用钻头先钻掉大部分,再用凿子修方;先试插,紧了就修榫头,不要用锤子硬砸,会把卯眼撑裂;抹胶后敲入,用夹具夹紧,干透后再受力" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
