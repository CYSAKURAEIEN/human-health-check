<text x="240" y="711" font-size="14" fill="#0b5cad" text-anchor="middle">贴着地面匍匐蔓延</text>
<text x="240" y="686" font-size="13" fill="#0b5cad" text-anchor="middle">不长成直立的树,枝不成竖直平面</text>
<text x="240" y="786" font-size="13" fill="#555" text-anchor="middle">西北沙地、园林绿化中常见</text>
<text x="486" y="660" font-size="14" xml:space="preserve">· <tspan font-weight="bold">匍匐灌木</tspan></text>
<text x="486" y="682" font-size="14" xml:space="preserve">· 枝<tspan font-weight="bold">不成竖直平面</tspan></text>
<text x="486" y="704" font-size="14" xml:space="preserve">· 多见于西北沙地和</text>
<text x="486" y="726" font-size="14" xml:space="preserve">  园林绿化</text>
<text x="486" y="748" font-size="14" xml:space="preserve">· <tspan fill="#c33" font-weight="bold">全株有毒</tspan>(含桧油),</text>
<text x="486" y="770" font-size="14" xml:space="preserve">  可引起呕吐、肝肾损害</text>
<text x="486" y="792" font-size="14" xml:space="preserve">  和流产</text>
<rect x="10" y="826" width="700" height="108" rx="8" fill="#fdecec" stroke="#c33" stroke-width="2"/>
<text x="360" y="856" font-size="17" font-weight="bold" fill="#c33" text-anchor="middle">匍匐生长、枝不成竖直平面的"柏"不要采</text>
<text x="360" y="884" font-size="15" text-anchor="middle">只采直立乔木、小枝扁平竖成一个平面、叶全为鳞片状的侧柏</text>
<text x="360" y="910" font-size="15" text-anchor="middle">公园、绿化带打过药的不采;认不准不采、不用</text>
</g></svg>
