<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 944" width="720" height="944" role="img" aria-label="侧柏、圆柏、叉子圆柏怎样区分(示意): 侧柏是常绿直立乔木,小枝扁平、排成一个竖着的平面,像侧立的手掌;叶全部为细小鳞片状,交互对生、紧贴小枝;球果卵形,种鳞4对,背部顶端有一个反曲的尖头,熟时开裂。圆柏(桧柏)同一株上常有刺状叶和鳞叶两种叶,小枝不排成平面,球果肉质、不开裂,不是药典品种。叉子圆柏(沙地柏)是匍匐灌木,多见于西北沙地和园林绿化,全株有毒,含桧油,可引起呕吐、肝肾损害和流产。匍匐生长、枝不成竖直平面的柏不要采,认不准不采">
<rect width="100%" height="100%" fill="#fff"/>
<title>侧柏、圆柏、叉子圆柏怎样区分</title>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">侧柏、圆柏、叉子圆柏怎样区分(示意图)</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">(先看株形和小枝排列,再看叶和球果;各部分比例为示意)</text>
