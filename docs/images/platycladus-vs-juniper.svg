<text x="420" y="292" font-size="13" fill="#0b5cad" text-anchor="middle">熟时开裂</text>
<text x="486" y="130" font-size="14" xml:space="preserve">· 常绿<tspan font-weight="bold">直立乔木</tspan></text>
<text x="486" y="152" font-size="14" xml:space="preserve">· 小枝<tspan font-weight="bold">扁平</tspan>,排成一个</text>
<text x="486" y="174" font-size="14" xml:space="preserve">  <tspan font-weight="bold">竖着的平面</tspan>(像侧立的</text>
<text x="486" y="196" font-size="14" xml:space="preserve">  手掌,所以叫"侧"柏)</text>
<text x="486" y="218" font-size="14" xml:space="preserve">· 叶全部为<tspan font-weight="bold">细小鳞片状</tspan>,</text>
<text x="486" y="240" font-size="14" xml:space="preserve">  交互对生、紧贴小枝</text>
<text x="486" y="262" font-size="14" xml:space="preserve">· 球果卵形,种鳞4对,背部</text>
<text x="486" y="284" font-size="14" xml:space="preserve">  顶端有一个反曲的尖头</text>
<text x="486" y="306" font-size="14" xml:space="preserve">· 气清香</text>
