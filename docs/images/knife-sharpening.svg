<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800" role="img" aria-label="磨刀: 先用粗磨石磨出锋口,再用细磨石磨光;磨石使用前泡水(油石用油),磨的过程中保持湿润,下面垫湿布防滑。找准刃口原来的角度,让刃口斜面平贴在磨石上,保持这个角度不变来回推磨(角度忽高忽低会把刃口磨圆);磨到刃口背面摸到一条细小的卷边(毛刺),翻过来把背面平贴磨石轻磨几下去掉卷边,再在细磨石上重复。常见角度(参考): 菜刀、小刀的刃口斜面与刀面约15-20°,凿子、刨刀斜面约25-30°,劈柴的斧头角度大一些(更钝更厚),砍树的斧头角度小一些。磨石用久了中间凹下去,在平整的水泥地上加水和沙子磨平" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>磨刀</title>
