<text x="20" y="316" font-size="15" font-weight="bold">① 贴平</text>
<text x="161" y="316" font-size="15" font-weight="bold">② 推磨</text>
<text x="302" y="316" font-size="15" font-weight="bold">③ 摸卷边</text>
<text x="443" y="316" font-size="15" font-weight="bold">④ 翻面</text>
<text x="584" y="316" font-size="15" font-weight="bold">⑤ 细磨石</text>
<text x="20" y="482" font-size="13.5">找准刃口原来的</text>
<text x="20" y="501" font-size="13.5">角度,让刃口斜面</text>
<text x="20" y="520" font-size="13.5">平贴在磨石上</text>
<text x="161" y="482" font-size="13.5">保持这个角度不变,</text>
<text x="161" y="501" font-size="13.5">来回推磨</text>
<text x="161" y="520" font-size="13.5"><tspan fill="#c33">角度忽高忽低会</tspan></text>
<text x="161" y="539" font-size="13.5"><tspan fill="#c33">把刃口磨圆</tspan></text>
<text x="302" y="482" font-size="13.5">磨到刃口背面</text>
<text x="302" y="501" font-size="13.5">摸到一条细小的</text>
<text x="302" y="520" font-size="13.5">卷边(毛刺)</text>
<text x="443" y="482" font-size="13.5">翻过来,把背面</text>
<text x="443" y="501" font-size="13.5">平贴磨石轻磨</text>
<text x="443" y="520" font-size="13.5">几下,去掉卷边</text>
<text x="584" y="482" font-size="13.5">在细磨石上重复,</text>
<text x="584" y="501" font-size="13.5">磨得更光</text>
