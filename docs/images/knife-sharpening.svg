<text x="546" y="272" font-size="13" text-anchor="middle" fill="#0b5cad">角度大(更钝更厚)</text>
<text x="650" y="254" font-size="14" font-weight="bold" text-anchor="middle">砍树的斧头</text>
<text x="650" y="272" font-size="13" text-anchor="middle" fill="#0b5cad">角度小一些</text>
