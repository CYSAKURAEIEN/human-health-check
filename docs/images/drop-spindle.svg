<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 944" width="720" height="944" role="img" aria-label="纺锤纺线。纺锤的构造: 一根约30 cm长、筷子粗的直木杆;杆的下部套一个有重量的圆盘(陶片、木片、土豆、石片中间钻孔);杆的顶端刻一个小槽或钉一个小钩。① 在纺锤杆上先系一段已有的线作引线,绕过顶端的钩;② 从梳好的纤维中拉出一小撮,和引线搭在一起;③ 一手捏住纤维,一手让纺锤朝一个方向旋转,然后放手让它悬空转动,纺锤的旋转把纤维捻成线;④ 捏纤维的手慢慢向上放出纤维,保持粗细均匀;⑤ 纺锤快停时再转一下,线够长了绕到纺锤杆上,然后重复。合股: 两根同方向捻好的单线,反方向再捻在一起,成为更结实的双股线">
<rect width="100%" height="100%" fill="#fff"/>
<title>纺锤纺线</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c33"/></marker>
<marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0b5cad"/></marker>
<pattern id="twZ" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="6" height="6" fill="#e6c98f"/><path d="M3 0 V6" stroke="#8b6b3e" stroke-width="1.2"/></pattern>
<pattern id="ply" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="7" height="14" fill="#e6c98f"/><rect x="7" width="7" height="14" fill="#c8995a"/><path d="M0 0 V14 M7 0 V14" stroke="#8b6b3e" stroke-width="1"/></pattern>
<!-- 纺锤: 原点在杆顶(钩的根部),杆长150 -->
<g id="sp">
<path d="M-26 118 V125 A26 7 0 0 0 26 125 V118" fill="#a8763f" stroke="#333" stroke-width="1.5"/>
<ellipse cx="0" cy="118" rx="26" ry="7" fill="#c8995a" stroke="#333" stroke-width="1.5"/>
<path d="M0 0 V118 M0 132 V150" stroke="#8b6b3e" stroke-width="4" stroke-linecap="round"/>
<path d="M0 1 V-7 Q0 -13 -5 -13 Q-9 -13 -9 -9" fill="none" stroke="#333" stroke-width="1.8" stroke-linecap="round"/>
</g>
<!-- 梳好的纤维 -->
<g id="fib">
<path d="M-38 4 Q-44 -10 -28 -14 Q-22 -26 -4 -20 Q10 -28 22 -16 Q40 -14 36 2 Q40 16 22 16 Q8 24 -8 16 Q-28 22 -32 12 Q-44 12 -38 4 Z" fill="#f6ecd8" stroke="#b9a77e" stroke-width="1.5"/>
<path d="M-28 -2 Q-10 -10 8 -4 Q20 0 30 -6 M-24 8 Q-6 2 12 8 M-14 -12 Q2 -16 16 -10" fill="none" stroke="#c9b48a" stroke-width="1"/>
</g>
<!-- 手(捏住纤维,捏合点在原点) -->
<g id="hand">
<path d="M-14 -34 Q-22 -14 -12 -2 Q-6 4 0 2 Q10 0 14 -10 L16 -34 Z" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
<path d="M15 -22 Q22 -12 4 0" fill="#f3e3d3" stroke="#333" stroke-width="2"/>
</g>
</defs>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">纺锤纺线(最简单的工具)</text>

<!-- 构造 -->
<g transform="translate(10,44)">
<rect width="226" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">纺锤的构造</text>
<use href="#sp" transform="translate(96,58) scale(1.3)"/>
<path d="M40 58 V253 M34 58 H46 M34 253 H46" stroke="#0b5cad" stroke-width="1"/>
<text transform="translate(32,156) rotate(-90)" text-anchor="middle" fill="#0b5cad">约30 cm</text>
<g stroke="#0b5cad" stroke-width="1"><line x1="120" y1="46" x2="94" y2="45"/><line x1="120" y1="124" x2="100" y2="124"/><line x1="134" y1="214" x2="126" y2="210"/></g>
<text x="124" y="44">顶端: 小钩</text>
<text x="124" y="60">或刻小槽</text>
<text x="124" y="122">直木杆</text>
<text x="124" y="138">(筷子粗)</text>
<text x="138" y="218">圆盘</text>
<text x="138" y="234">(套在下部)</text>
<text x="12" y="292">下部套一个有重量的圆盘:</text>
<text x="12" y="310">陶片、木片、土豆、石片</text>
<text x="12" y="328">中间钻孔</text>
</g>

<!-- ① 系引线 -->
<g transform="translate(247,44)">
<rect width="226" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">① 系引线</text>
<use href="#sp" transform="translate(113,130)"/>
<path d="M116 236 L119 231 V127 L108 120 L112 54" fill="none" stroke="#a0723e" stroke-width="2"/>
<path d="M109 230 L118 236 M109 236 L118 242" stroke="#a0723e" stroke-width="2"/>
<circle cx="119" cy="236" r="3" fill="#a0723e"/>
<g stroke="#0b5cad" stroke-width="1"><line x1="100" y1="76" x2="111" y2="80"/><line x1="128" y1="116" x2="112" y2="120"/><line x1="128" y1="234" x2="122" y2="235"/></g>
<text x="12" y="74">已有的线</text>
<text x="12" y="90">作引线</text>
<text x="132" y="114">绕过顶端</text>
<text x="132" y="130">的钩</text>
<text x="132" y="232">系在杆上</text>
<text x="12" y="302">先在纺锤杆上系一段已有的线</text>
<text x="12" y="320">作引线,绕过顶端的钩</text>
</g>

<!-- ② 搭上纤维 -->
<g transform="translate(484,44)">
<rect width="226" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">② 搭上纤维</text>
<use href="#fib" transform="translate(60,62)"/>
<use href="#sp" transform="translate(113,130)"/>
<path d="M119 231 V127 L108 120 L112 74" fill="none" stroke="#a0723e" stroke-width="2"/>
<path d="M92 66 Q104 76 110 100 M96 64 Q108 74 114 100 M90 70 Q100 82 112 102" fill="none" stroke="#c9b48a" stroke-width="1.5"/>
<path d="M124 76 H130 V100 H124" fill="none" stroke="#0b5cad" stroke-width="1"/>
<g stroke="#0b5cad" stroke-width="1"><line x1="56" y1="96" x2="96" y2="84"/><line x1="52" y1="142" x2="109" y2="144"/></g>
<text x="12" y="104" fill="#0b5cad" font-size="12">一小撮纤维</text>
<text x="12" y="146" fill="#0b5cad" font-size="12">引线</text>
<text x="134" y="86">搭在</text>
<text x="134" y="102">一起</text>
<text x="108" y="52" font-size="12" fill="#555">梳好的纤维</text>
<text x="12" y="302">从梳好的纤维中拉出一小撮,</text>
<text x="12" y="320">和引线搭在一起</text>
</g>

<!-- ③ 转动纺锤 -->
<g transform="translate(10,404)">
<rect width="226" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">③ 转动纺锤</text>
<use href="#fib" transform="translate(70,48) scale(0.8)"/>
<path d="M98 54 Q108 60 112 70" fill="none" stroke="#c9b48a" stroke-width="2"/>
<use href="#hand" transform="translate(113,104)"/>
<rect x="110" y="106" width="5" height="16" fill="url(#twZ)" stroke="#a0723e" stroke-width="0.8"/>
<use href="#sp" transform="translate(113,130)"/>
<path d="M110 122 L112 124" stroke="#a0723e" stroke-width="2"/>
<path d="M85 200 A28 8 0 0 0 141 200" fill="none" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<g stroke="#0b5cad" stroke-width="1"><line x1="146" y1="112" x2="118" y2="114"/><line x1="146" y1="84" x2="130" y2="88"/></g>
<text x="150" y="88">捏住纤维</text>
<text x="150" y="116">捻成线</text>
<text x="150" y="196" fill="#c33">朝一个</text>
<text x="150" y="212" fill="#c33">方向旋转</text>
<text x="12" y="294">一手捏住纤维,一手让纺锤朝</text>
<text x="12" y="312">一个方向旋转,然后放手让它</text>
<text x="12" y="330">悬空转动,旋转把纤维捻成线</text>
</g>

<!-- ④ 向上放出纤维 -->
<g transform="translate(247,404)">
<rect width="226" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">④ 放出纤维</text>
<use href="#fib" transform="translate(56,66) scale(0.7)"/>
<path d="M80 62 Q96 52 106 54" fill="none" stroke="#c9b48a" stroke-width="2"/>
<use href="#hand" transform="translate(113,82)"/>
<path d="M109 84 Q110 94 112 104 M117 84 Q116 94 114 104 M113 84 V104" fill="none" stroke="#c9b48a" stroke-width="1.5"/>
<rect x="110" y="102" width="5" height="22" fill="url(#twZ)" stroke="#a0723e" stroke-width="0.8"/>
<use href="#sp" transform="translate(113,130)"/>
<path d="M150 82 V48" stroke="#c33" stroke-width="3" marker-end="url(#arR)"/>
<path d="M85 200 A28 8 0 0 0 141 200" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<g stroke="#0b5cad" stroke-width="1"><line x1="146" y1="98" x2="118" y2="94"/><line x1="146" y1="122" x2="118" y2="118"/></g>
<text x="160" y="62" fill="#c33">慢慢</text>
<text x="160" y="78" fill="#c33">向上</text>
<text x="150" y="102" font-size="12">放出纤维</text>
<text x="150" y="126" font-size="12">捻好的线</text>
<text x="12" y="302">捏纤维的手慢慢向上放出纤维,</text>
<text x="12" y="320">保持粗细均匀</text>
</g>

<!-- ⑤ 绕到杆上 -->
<g transform="translate(484,404)">
<rect width="226" height="350" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">⑤ 绕到杆上</text>
<use href="#sp" transform="translate(113,130)"/>
<path d="M106 244 Q94 214 108 176 H118 Q132 214 120 244 Z" fill="#e6c98f" stroke="#a0723e" stroke-width="1.5"/>
<path d="M104 236 L122 228 M101 224 L124 214 M101 212 L125 202 M102 200 L124 190 M105 188 L120 182" stroke="#a0723e" stroke-width="1"/>
<path d="M118 178 L119 128 L108 120 L112 50" fill="none" stroke="#a0723e" stroke-width="2"/>
<path d="M85 160 A28 8 0 0 0 141 160" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<g stroke="#0b5cad" stroke-width="1"><line x1="62" y1="216" x2="98" y2="214"/></g>
<text x="12" y="212" fill="#0b5cad" font-size="12">纺好的线</text>
<text x="12" y="228" fill="#0b5cad" font-size="12">绕在杆上</text>
<text x="150" y="156" fill="#c33">快停时</text>
<text x="150" y="172" fill="#c33">再转一下</text>
<text x="12" y="302">纺锤快停时再转一下;</text>
<text x="12" y="320">线够长了,绕到纺锤杆上;</text>
<text x="12" y="338">然后重复</text>
</g>

<!-- 合股 -->
<g transform="translate(10,764)">
<rect width="700" height="170" rx="8" fill="none" stroke="#bbb" stroke-width="1.5"/>
<text x="12" y="24" font-size="15" font-weight="bold">合股: 做更结实的双股线</text>
<rect x="40" y="56" width="210" height="9" rx="4" fill="url(#twZ)" stroke="#a0723e" stroke-width="1"/>
<rect x="40" y="88" width="210" height="9" rx="4" fill="url(#twZ)" stroke="#a0723e" stroke-width="1"/>
<path d="M266 51 A5 9.5 0 1 1 266 70" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<path d="M266 83 A5 9.5 0 1 1 266 102" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="145" y="122" text-anchor="middle">两根单线,捻的方向相同</text>
<path d="M300 77 H350" stroke="#0b5cad" stroke-width="2.5" marker-end="url(#arB)"/>
<rect x="380" y="68" width="240" height="18" rx="9" fill="url(#ply)" stroke="#a0723e" stroke-width="1"/>
<path d="M642 87 A5 10 0 1 1 642 67" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<text x="500" y="112" text-anchor="middle"><tspan fill="#c33" font-weight="bold">反方向</tspan>再捻在一起 → 双股线</text>
<text x="12" y="154">两根同方向捻好的单线,反方向再捻在一起,成为更结实的双股线</text>
</g>
</g>
</svg>
