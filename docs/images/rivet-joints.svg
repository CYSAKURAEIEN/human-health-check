<line x1="46" y1="98" x2="70" y2="102" stroke="#c33" stroke-width="1.2"/>
<g font-size="13">
<text x="10" y="186">用锤子先把露出的</text>
<text x="10" y="204">钉杆打粗(镦粗)</text>
</g>
</g>

<g transform="translate(538,284)">
<rect width="172" height="230" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">④ 再打成圆头</text>
<rect x="14" y="110" width="144" height="10" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="14" y="120" width="144" height="10" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="76" y="109" width="20" height="22" fill="#e6e9ec"/>
<path d="M76,110 V130 M96,110 V130" stroke="#333" stroke-width="1.5"/>
<path d="M68,110 A18,12 0 0 1 104,110 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<path d="M68,130 A18,10 0 0 0 104,130 Z" fill="#e6e9ec" stroke="#333" stroke-width="1.8"/>
<rect x="40" y="140" width="92" height="22" fill="#666" stroke="#333" stroke-width="1.8"/>
<path d="M44,62 L66,94" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M128,62 L106,94" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M86,46 V84" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M18,104 l5,6 l9,-11" fill="none" stroke="#2a8a3a" stroke-width="2.5"/>
<text x="10" y="150" font-size="12" fill="#2a8a3a">贴紧</text>
<g font-size="13">
<text x="10" y="186">再打成圆头;两块板</text>
<text x="10" y="204">紧密贴合,不晃动</text>
</g>
</g>

<!-- 热铆 -->
<g transform="translate(10,524)">
<rect width="344" height="260" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">热铆(大铆钉、钢结构)</text>
<rect x="40" y="100" width="260" height="14" fill="#c0c8d0" stroke="#333" stroke-width="1.8"/>
<rect x="40" y="114" width="260" height="14" fill="#9aa3ad" stroke="#333" stroke-width="1.8"/>
<rect x="159" y="99" width="22" height="30" fill="#d4372a"/>
<path d="M159,100 V128 M181,100 V128" stroke="#333" stroke-width="1.5"/>
<rect x="160" y="70" width="20" height="58" fill="#d4372a" stroke="#333" stroke-width="1.8"/>
<path d="M148,128 A22,13 0 0 0 192,128 Z" fill="#d4372a" stroke="#333" stroke-width="1.8"/>
<rect x="152" y="141" width="36" height="28" fill="#666" stroke="#333" stroke-width="1.8"/>
<path d="M170,192 V174" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<rect x="138" y="32" width="64" height="24" rx="3" fill="#888" stroke="#333" stroke-width="1.8"/>
<rect x="202" y="38" width="56" height="11" rx="3" fill="#c8a06a" stroke="#333" stroke-width="1.5"/>
<path d="M170,58 V66" stroke="#c33" stroke-width="2.5"/>
<text x="230" y="80" font-size="12.5" fill="#c33" font-weight="bold">铆钉烧到鲜红色</text>
<line x1="228" y1="78" x2="182" y2="86" stroke="#0b5cad" stroke-width="1.2"/>
<text x="196" y="160" font-size="12.5" fill="#555">背面顶住</text>
<text x="264" y="56" font-size="12.5" fill="#555">正面锤打</text>
<path d="M90,78 V97" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<path d="M90,150 V131" stroke="#0b5cad" stroke-width="2" marker-end="url(#arB)"/>
<text x="20" y="72" font-size="12.5" fill="#0b5cad">冷却收缩,拉紧</text>
<g font-size="13">
<text x="10" y="210">把铆钉加热到鲜红色,迅速插入孔中,背面顶住,</text>
<text x="10" y="228">正面锤打成头;冷却收缩,把两块板拉得非常紧</text>
<text x="10" y="246">→ 比冷铆结实得多,适合受力大的地方</text>
</g>
</g>

<!-- 咬口 -->
<g transform="translate(366,524)">
<rect width="344" height="260" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<text x="10" y="24" font-size="15" font-weight="bold">铁皮的咬口(剖面)</text>
