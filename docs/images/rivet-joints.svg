<path d="M224,58 H124 A4,4 0 0 0 124,66 H148"/>
<path d="M20,120 H96 A4,4 0 0 0 96,112 H80"/>
<path d="M200,108 H76 A4,4 0 0 0 76,116 H92"/>
<path d="M20,172 H96 A2,2 0 0 0 96,168 H80"/>
<path d="M200,162 H76 A2,2 0 0 0 76,166 H92"/>
</g>
<path d="M86,138 V156" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="236" y="68" font-size="13">① 边缘折弯</text>
<text x="236" y="118" font-size="13">② 互相钩住</text>
<text x="236" y="170" font-size="13">③ 锤平压紧</text>
<g font-size="13">
<text x="10" y="210">把两块铁皮的边折弯互相钩住再压平,不用铆钉、</text>
<text x="10" y="228">不用焊接;做铁皮桶、烟囱管、水槽的常用方法,</text>
<text x="10" y="246">再用锡焊封缝即可防漏</text>
</g>
</g>
