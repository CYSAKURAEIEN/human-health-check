<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 908" width="720" height="908" role="img" aria-label="钢的淬火与回火: ①碳钢慢慢均匀加热到约780-850°C(樱桃红),在阴暗处看火色,磁铁刚好吸不住(约770°C)后再稍加热,保温透热: 小件30秒-2分钟,大件5-10分钟,不要烧到鲜红以上、不要在火里久泡;②用钳子夹牢厚的一端,刃口朝下,竖直、快速、整个没入淬火液,沿刃口方向上下抽动,不要左右甩;③水淬约3-5秒后不再剧烈沸腾、不再发红,薄件可提起,厚件留在液中冷到约100°C以下,手勉强能握住(约50-80°C)就取出,立即回火,不要冷透放置过夜。淬火液: 常温水约20°C,盐水加5-10%食盐,油先预热到约50°C;液量至少是工件重量的10倍以上,一把菜刀约10 L水或4-5 L油;不要用汽油、柴油、酒精。回火色: 200-220°C浅黄(稻草色)用于锉刀、刮刀、剃刀;230-240°C金黄用于菜刀、刨刀、钻头;250-260°C褐色用于斧头、凿子;270-280°C紫色用于剪刀、冲子;290-300°C深蓝用于锯条、螺丝刀;310-350°C浅蓝-灰用于弹簧。走色法从背部加热,颜色向刃口走,到目标色立即蘸水。淬火油着火时盖上盖子闷灭,绝对不能泼水" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>钢的淬火与回火</title>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arR2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#c33"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker>
<clipPath id="barClip"><path d="M60,728 H260 L304,744 L260,752 H60 Z"/></clipPath>
</defs>
<g fill="#222">
<text x="360" y="28" font-size="18" font-weight="bold" text-anchor="middle">钢的淬火与回火</text>

<!-- ① 加热 -->
<rect x="8" y="44" width="228" height="258" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="66" font-size="15" font-weight="bold">① 加热</text>
<path d="M22,182 Q36,150 70,142 Q100,134 130,142 Q160,150 170,182 Z" fill="#3d3d3d" stroke="#222" stroke-width="1.5"/>
<g fill="#5e5e5e"><circle cx="44" cy="170" r="4"/><circle cx="66" cy="158" r="4"/><circle cx="146" cy="160" r="4"/><circle cx="158" cy="174" r="4"/><circle cx="90" cy="172" r="4"/><circle cx="120" cy="174" r="4"/></g>
<ellipse cx="100" cy="152" rx="44" ry="9" fill="#f08a2a"/>
<path d="M40,144 H226 V152 H40 Z" fill="#8a8a8a" stroke="#333" stroke-width="1.2"/>
<rect x="41" y="145" width="112" height="6" fill="#d4372a"/>
<path d="M150,72 V98" stroke="#555" stroke-width="1.2"/>
<path d="M138,128 V108 Q138,98 150,98 Q162,98 162,108 V128 H156 V108 Q156,104 150,104 Q144,104 144,108 V128 Z" fill="#c33" stroke="#333" stroke-width="1.2"/>
<rect x="138" y="122" width="6" height="6" fill="#ddd" stroke="#333" stroke-width="1"/>
<rect x="156" y="122" width="6" height="6" fill="#ddd" stroke="#333" stroke-width="1"/>
<text x="168" y="104" font-size="12" fill="#555">磁铁</text>
<text x="168" y="120" font-size="12" fill="#c33" font-weight="bold">吸不住</text>
<text x="24" y="196" font-size="12" fill="#555">炭火</text>
<g font-size="13">
<text x="18" y="214" font-weight="bold" fill="#c33">碳钢: 约780-850°C(樱桃红)</text>
<text x="18" y="232">在阴暗处看火色;磁铁刚好吸不住</text>
<text x="18" y="250">(约770°C)后再稍加热</text>
<text x="18" y="268">保温透热: 小件30秒-2分钟,</text>
<text x="18" y="286">大件5-10分钟</text>
</g>
<text x="118" y="286" font-size="12" fill="#c33">✗ 不烧到鲜红以上</text>

<!-- ② 入液 -->
<rect x="244" y="44" width="228" height="258" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="254" y="66" font-size="15" font-weight="bold">② 竖直入液</text>
<rect x="301" y="140" width="98" height="96" fill="#a9cdf2"/>
<path d="M298,118 V238 H402 V118" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M301,140 H399" stroke="#0b5cad" stroke-width="1.2"/>
<path d="M344,152 H356 L354,206 L350,220 L346,206 Z" fill="#555" stroke="#333" stroke-width="1.2"/>
<path d="M346,80 L345,156 M354,80 L355,156" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<text x="350" y="76" font-size="12" fill="#555" text-anchor="middle">钳子</text>
<path d="M378,162 V206" stroke="#c33" stroke-width="2.5" marker-start="url(#arR2)" marker-end="url(#arR2)"/>
<path d="M306,188 H336" stroke="#888" stroke-width="2" marker-start="url(#arG)" marker-end="url(#arG)"/>
<path d="M314,178 L328,198 M328,178 L314,198" stroke="#c33" stroke-width="2"/>
<text x="404" y="190" font-size="12" fill="#c33" font-weight="bold">上下</text>
<text x="404" y="205" font-size="12" fill="#c33" font-weight="bold">抽动</text>
<text x="252" y="128" font-size="12" fill="#555">深容器</text>
<text x="362" y="232" font-size="12" fill="#555">刃口朝下</text>
<g font-size="13">
<text x="254" y="256">夹牢厚的一端,刃口朝下,竖直、</text>
<text x="254" y="274">快速、整个没入;沿刃口方向</text>
<text x="254" y="292">上下抽动,不要左右甩(会弯)</text>
</g>

<!-- ③ 取出 -->
<rect x="480" y="44" width="232" height="258" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="490" y="66" font-size="15" font-weight="bold">③ 取出,立即回火</text>
<rect x="503" y="168" width="84" height="56" fill="#a9cdf2"/>
<path d="M500,150 V226 H590 V150" fill="none" stroke="#333" stroke-width="2.5"/>
<path d="M539,104 H551 L549,150 L545,162 L541,150 Z" fill="#666" stroke="#333" stroke-width="1.2"/>
<path d="M541,78 L540,108 M549,78 L550,108" stroke="#333" stroke-width="3" stroke-linecap="round"/>
<path d="M520,150 V104" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<path d="M564,150 Q558,140 564,130 Q570,120 564,110 M576,152 Q570,142 576,132" fill="none" stroke="#999" stroke-width="1.5"/>
<rect x="604" y="96" width="100" height="78" rx="4" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<text x="654" y="118" font-size="14" font-weight="bold" fill="#c33" text-anchor="middle">立即回火</text>
<text x="654" y="138" font-size="12" text-anchor="middle">不要冷透后</text>
<text x="654" y="154" font-size="12" text-anchor="middle">放置过夜</text>
<text x="654" y="168" font-size="11" fill="#555" text-anchor="middle">(会自己开裂)</text>
<path d="M558,128 H600" stroke="#c33" stroke-width="2" marker-end="url(#arR)"/>
<g font-size="13">
<text x="490" y="242">水淬约3-5秒后不再剧烈沸腾、</text>
<text x="490" y="259">不再发红: 薄件可提起,厚件</text>
<text x="490" y="276">在液中冷到约100°C以下;</text>
<text x="490" y="293">手勉强能握住(约50-80°C)就取出</text>
</g>

<!-- 淬火液 -->
<rect x="8" y="312" width="704" height="148" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="336" font-size="15" font-weight="bold">淬火液</text>
<rect x="18" y="348" width="14" height="14" fill="#a9cdf2" stroke="#333"/>
<rect x="250" y="348" width="14" height="14" fill="#cfe0f0" stroke="#333"/>
<rect x="482" y="348" width="14" height="14" fill="#e8c860" stroke="#333"/>
<g font-size="14">
<text x="38" y="360" font-weight="bold">水: 冷得快、硬,易开裂</text>
<text x="18" y="380" font-size="13">用常温水(约20°C),不用冰水</text>
<text x="18" y="398" font-size="13">适合简单形状、小件</text>
<text x="270" y="360" font-weight="bold">盐水: 最快,最易裂</text>
<text x="250" y="380" font-size="13">加5-10%食盐,冷却更快、更均匀</text>
<text x="250" y="398" font-size="13">只用于形状简单的件</text>
<text x="502" y="360" font-weight="bold">油: 较慢,不易裂</text>
<text x="482" y="380" font-size="13">先用烧红的废铁预热到约50°C</text>
<text x="482" y="398" font-size="13">复杂形状、大件;高碳钢用油</text>
<text x="18" y="426">液量至少是工件重量的10倍以上: 一把菜刀约10 L水或4-5 L油;容器要深</text>
<text x="18" y="448" fill="#c33">✗ 不要用汽油、柴油、酒精等低闪点液体,一碰红铁就会着火</text>
</g>

<!-- 回火 -->
<rect x="8" y="470" width="704" height="340" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.5"/>
<text x="18" y="494" font-size="15" font-weight="bold">④ 回火(淬火必回火): 把工件磨出光亮面,慢慢加热,看表面的回火色</text>
<text x="18" y="514" font-size="13" fill="#555">回火色是光亮钢面上氧化膜的颜色(钢本身不发光),油污、氧化皮会让颜色失真</text>
<text x="24" y="536" font-size="13" fill="#0b5cad" font-weight="bold">← 更硬</text>
<text x="696" y="536" font-size="13" fill="#0b5cad" font-weight="bold" text-anchor="end">更韧 →</text>
<text x="360" y="536" font-size="13" fill="#555" text-anchor="middle">加热时颜色依次出现 →</text>
<g stroke="#333" stroke-width="1.2">
<rect x="24" y="544" width="112" height="46" fill="#efe08a"/>
<rect x="136" y="544" width="112" height="46" fill="#d9a521"/>
<rect x="248" y="544" width="112" height="46" fill="#9b5a2a"/>
<rect x="360" y="544" width="112" height="46" fill="#7b3f91"/>
<rect x="472" y="544" width="112" height="46" fill="#23408e"/>
<rect x="584" y="544" width="112" height="46" fill="#9db1c2"/>
</g>
<g text-anchor="middle">
<g font-size="14" font-weight="bold">
<text x="80" y="610">200-220°C</text><text x="192" y="610">230-240°C</text><text x="304" y="610">250-260°C</text><text x="416" y="610">270-280°C</text><text x="528" y="610">290-300°C</text><text x="640" y="610">310-350°C</text>
</g>
<g font-size="14">
<text x="80" y="628">浅黄(稻草色)</text><text x="192" y="628">金黄</text><text x="304" y="628">褐色</text><text x="416" y="628">紫色</text><text x="528" y="628">深蓝</text><text x="640" y="628">浅蓝-灰</text>
</g>
<g font-size="13" fill="#555">
<text x="80" y="646">锉刀、刮刀、剃刀</text><text x="192" y="646">菜刀、刨刀、钻头</text><text x="304" y="646">斧头、凿子</text><text x="416" y="646">剪刀、冲子</text><text x="528" y="646">锯条、螺丝刀</text><text x="640" y="646">弹簧</text>
</g>
</g>
<text x="18" y="670" font-size="12" fill="#555">温度都是大约值,要用试片淬火、锉刀试硬来校正自己的眼睛</text>
<!-- 走色法 -->
<text x="18" y="696" font-size="14" font-weight="bold">走色法(刀、凿等长条工具)</text>
<g clip-path="url(#barClip)">
<rect x="60" y="720" width="50" height="40" fill="#23408e"/>
<rect x="110" y="720" width="40" height="40" fill="#7b3f91"/>
<rect x="150" y="720" width="40" height="40" fill="#9b5a2a"/>
<rect x="190" y="720" width="40" height="40" fill="#d9a521"/>
<rect x="230" y="720" width="40" height="40" fill="#efe08a"/>
<rect x="270" y="720" width="40" height="40" fill="#e4e4e4"/>
</g>
<path d="M60,728 H260 L304,744 L260,752 H60 Z" fill="none" stroke="#333" stroke-width="1.5"/>
<rect x="52" y="758" width="70" height="8" rx="2" fill="#d4372a" stroke="#333" stroke-width="1"/>
<path d="M86,758 V754" stroke="#c33" stroke-width="2"/>
<path d="M96,716 H250" stroke="#c33" stroke-width="2.5" marker-end="url(#arR)"/>
<text x="130" y="710" font-size="12" fill="#c33">颜色向刃口“走”</text>
<text x="300" y="764" font-size="12" fill="#555">刃口</text>
<text x="30" y="784" font-size="13">烧红的粗铁棒只加热背部/尾部;</text>
<text x="30" y="802" font-size="13" fill="#c33" font-weight="bold">刃口到目标颜色时立即蘸水止住</text>
<g font-size="14">
<text x="348" y="696">✓ 到达目标颜色立即离开热源,空冷或油冷</text>
<text x="348" y="716">✓ 回火温度远低于淬火温度,蘸水不会再淬硬</text>
<text x="348" y="740">✗ 颜色过头(要黄变成了蓝): 只能重新淬火</text>
<text x="368" y="758">再回火,不能“回退”</text>
<text x="348" y="782">✓ 厚件(超过10 mm)到色后在热沙中再放</text>
<text x="368" y="800">10-15分钟,或回火2次</text>
</g>

<!-- 安全 -->
<rect x="8" y="820" width="704" height="80" rx="6" fill="#fdf3f3" stroke="#c33" stroke-width="1.5"/>
<g font-size="14">
<text x="22" y="842"><tspan font-weight="bold" fill="#c33">⚠ 淬火油着火:</tspan> 油装在带盖的金属桶里,旁边放干沙;着火时盖上盖子闷灭,<tspan font-weight="bold">绝对不能泼水</tspan></text>
<text x="22" y="864"><tspan font-weight="bold" fill="#c33">⚠ 蒸汽和热水:</tspan> 穿长袖、皮围裙、皮手套,脸不要正对淬火桶</text>
<text x="22" y="886"><tspan font-weight="bold" fill="#c33">⚠ 看起来已经“不红”的铁仍有几百度,</tspan> 一律用钳子夹</text>
</g>
</g>
</svg>
