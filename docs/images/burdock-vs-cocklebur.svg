<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 850" width="720" height="850" role="img" aria-label="牛蒡子与苍耳子对照示意: 两者同为菊科、都带钩刺、都粘衣服,野外常一起出现。牛蒡是高大草本,高1-2 m,基生叶极大、宽卵形或心形、背面有灰白色绒毛,头状花序球形、总苞片顶端钩状、花紫红色,成熟后整个球形总苞像带钩的刺球;药材牛蒡子是从刺球里打出的瘦果,长倒卵形、略扁、微弯,长5-7 mm,灰褐色带紫黑色斑点,有数条纵棱。苍耳有毒伤肝,叶三角状卵形、粗糙,刺果纺锤形或椭圆形、长约1-1.5 cm,整个带刺果实就是苍耳子。不要混采,认不准不采,采收戴手套">
