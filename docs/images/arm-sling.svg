<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 474" width="720" height="474" role="img" aria-label="三角巾悬吊:①三角巾托住前臂吊在胸前,肘弯曲约90°、手比肘略高,指尖露出,再用宽布带绕胸把上臂绑在躯干上;②没有三角巾时,把上衣下摆向上翻起包住手臂,用别针别在胸前" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<title>三角巾悬吊</title>
<text x="360" y="28" font-size="17" fill="#222" text-anchor="middle" font-weight="bold">三角巾悬吊(悬臂带)</text>
<rect x="8" y="42" width="344" height="392" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<rect x="368" y="42" width="344" height="392" rx="10" fill="none" stroke="#ddd" stroke-width="1.5"/>
<g transform="translate(0 0)"><path d="M126 300 L126 340 M214 300 L214 340" stroke="#333" stroke-width="2.5"/><path d="M126 300 L214 300 L214 340 L126 340 Z" fill="#a9bfd6" stroke="#333" stroke-width="2.5"/><rect x="160" y="104" width="20" height="26" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><path d="M124 134 Q170 122 216 134 Q226 140 224 170 L216 300 L124 300 L116 170 Q114 140 124 134 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/><path d="M156 128 Q170 140 184 128" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="170" cy="84" r="26" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><path d="M122 142 L110 222 L106 292" fill="none" stroke="#333" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 142 L110 222 L106 292" fill="none" stroke="#cfe0f0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="106" cy="302" r="10" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><path d="M218 142 L228 252" fill="none" stroke="#333" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/><path d="M218 142 L228 252" fill="none" stroke="#cfe0f0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 252 L152 230" fill="none" stroke="#333" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 252 L152 230" fill="none" stroke="#cfe0f0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M156 220 L150 128" fill="none" stroke="#333" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M156 220 L150 128" fill="none" stroke="#fbfaf3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 228 L192 126" fill="none" stroke="#333" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/><path d="M204 228 L192 126" fill="none" stroke="#fbfaf3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 210 Q200 220 238 232 Q252 250 244 270 Q196 262 150 248 Z" fill="#fbfaf3" stroke="#333" stroke-width="2.5"/><path d="M162 244 Q200 252 236 262" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="193" cy="122" r="7" fill="#fbfaf3" stroke="#333" stroke-width="2.5"/><path d="M114 176 Q172 190 246 180 L246 202 Q172 212 116 198 Z" fill="#fbfaf3" stroke="#333" stroke-width="2.5"/><ellipse cx="140" cy="226" rx="14" ry="9" fill="#f3e3d3" stroke="#333" stroke-width="2.5" transform="rotate(-15 140 226)"/><path d="M130 222 L136 223 M130 229 L136 230" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="262" y="98" font-size="15" fill="#222">三角巾托住</text>
<text x="262" y="117" font-size="15" fill="#222">前臂,吊在</text>
<text x="262" y="136" font-size="15" fill="#222">胸前</text>
<line x1="290" y1="141" x2="240" y2="252" stroke="#0b5cad" stroke-width="1.3"/><circle cx="240" cy="252" r="2.6" fill="#0b5cad"/>
<text x="268" y="172" font-size="14" fill="#222">宽布带绕胸</text>
<text x="268" y="189" font-size="14" fill="#222">把上臂绑在</text>
<text x="268" y="206" font-size="14" fill="#222">躯干上</text>
<line x1="266" y1="191" x2="240" y2="192" stroke="#0b5cad" stroke-width="1.3"/><circle cx="240" cy="192" r="2.6" fill="#0b5cad"/>
<text x="24" y="82" font-size="15" fill="#222">指尖露出</text>
<text x="24" y="101" font-size="15" fill="#222">便于检查</text>
<line x1="54" y1="106" x2="128" y2="222" stroke="#0b5cad" stroke-width="1.3"/><circle cx="128" cy="222" r="2.6" fill="#0b5cad"/>
<text x="250" y="300" font-size="14" fill="#222">肘弯曲</text>
<text x="250" y="317" font-size="14" fill="#222">约 90°</text>
<line x1="258" y1="288" x2="244" y2="262" stroke="#0b5cad" stroke-width="1.3"/><circle cx="244" cy="262" r="2.6" fill="#0b5cad"/>
<text x="180" y="372" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">① 三角巾悬吊 + 宽布带固定</text>
<text x="180" y="394" font-size="14" fill="#222" text-anchor="middle">手比肘略高(减轻肿胀)</text>
<text x="180" y="412" font-size="14" fill="#222" text-anchor="middle">上臂、前臂、锁骨、肋骨骨折常用</text>
<g transform="translate(360 0)"><path d="M126 264 L126 340 M214 264 L214 340" stroke="#333" stroke-width="2.5"/><path d="M126 300 L214 300 L214 340 L126 340 Z" fill="#a9bfd6" stroke="#333" stroke-width="2.5"/><path d="M124 264 L216 264 L214 300 L126 300 Z" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><circle cx="170" cy="286" r="2.5" fill="#333" stroke="#333" stroke-width="0"/><rect x="160" y="104" width="20" height="26" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><path d="M124 134 Q170 122 216 134 Q226 140 224 170 L216 264 L124 264 L116 170 Q114 140 124 134 Z" fill="#cfe0f0" stroke="#333" stroke-width="2.5"/><path d="M156 128 Q170 140 184 128" fill="none" stroke="#333" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="170" cy="84" r="26" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><path d="M122 142 L110 222 L106 292" fill="none" stroke="#333" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 142 L110 222 L106 292" fill="none" stroke="#cfe0f0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><circle cx="106" cy="302" r="10" fill="#f3e3d3" stroke="#333" stroke-width="2.5"/><path d="M218 142 L228 252" fill="none" stroke="#333" stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/><path d="M218 142 L228 252" fill="none" stroke="#cfe0f0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 252 L152 230" fill="none" stroke="#333" stroke-width="25" stroke-linecap="round" stroke-linejoin="round"/><path d="M228 252 L152 230" fill="none" stroke="#cfe0f0" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 206 Q172 216 230 230 Q246 248 240 270 Q180 270 124 264 Q118 236 122 206 Z" fill="#a9c3dd" stroke="#333" stroke-width="2.5"/><path d="M124 250 Q180 256 238 260" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M137 209 L155 215" fill="none" stroke="#666" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="156" cy="215" r="3" fill="#fff" stroke="#666" stroke-width="2"/><path d="M199 221 L217 227" fill="none" stroke="#666" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="218" cy="227" r="3" fill="#fff" stroke="#666" stroke-width="2"/><ellipse cx="140" cy="226" rx="14" ry="9" fill="#f3e3d3" stroke="#333" stroke-width="2.5" transform="rotate(-15 140 226)"/><path d="M130 222 L136 223 M130 229 L136 230" fill="none" stroke="#333" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></g>
<text x="620" y="98" font-size="15" fill="#222">上衣下摆</text>
<text x="620" y="117" font-size="15" fill="#222">向上翻起,</text>
<text x="620" y="136" font-size="15" fill="#222">包住手臂</text>
<line x1="648" y1="141" x2="596" y2="252" stroke="#0b5cad" stroke-width="1.3"/><circle cx="596" cy="252" r="2.6" fill="#0b5cad"/>
<text x="386" y="82" font-size="15" fill="#222">用别针别</text>
<text x="386" y="101" font-size="15" fill="#222">在胸前</text>
<line x1="420" y1="106" x2="506" y2="214" stroke="#0b5cad" stroke-width="1.3"/><circle cx="506" cy="214" r="2.6" fill="#0b5cad"/>
<text x="540" y="372" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">② 没有三角巾时</text>
<text x="540" y="394" font-size="14" fill="#222" text-anchor="middle">把上衣下摆翻起包住手臂,</text>
<text x="540" y="412" font-size="14" fill="#222" text-anchor="middle">用别针别在胸前,当作悬臂带</text>
<text x="360" y="458" font-size="15" fill="#222" text-anchor="middle">吊好后检查手指: 颜色、温度、感觉;发白、发紫、发凉、麻木 → 松开重绑</text>
</svg>
