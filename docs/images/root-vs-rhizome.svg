<text x="322" y="632" font-size="13" fill="#555" text-anchor="middle">断面</text>
<ellipse cx="322" cy="670" rx="46" ry="28" fill="#f2dca0" fill-opacity="0.75" stroke="#333" stroke-width="2"/>
