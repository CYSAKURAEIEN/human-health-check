<text x="390" y="150" font-size="13" fill="#0b5cad" text-anchor="start">皮部</text>
<path d="M351,190 L387,174" stroke="#0b5cad" stroke-width="1"/>
<circle cx="351" cy="190" r="2" fill="#0b5cad"/>
<text x="390" y="178" font-size="13" fill="#0b5cad" text-anchor="start">形成层环</text>
<path d="M336,202 L387,202" stroke="#0b5cad" stroke-width="1"/>
<circle cx="336" cy="202" r="2" fill="#0b5cad"/>
<text x="390" y="206" font-size="13" fill="#0b5cad" text-anchor="start">木部</text>
<path d="M343.2,223.1 L387,230" stroke="#0b5cad" stroke-width="1"/>
<circle cx="343.2" cy="223.1" r="2" fill="#0b5cad"/>
<text x="390" y="234" font-size="13" fill="#0b5cad" text-anchor="start">放射状纹理、</text>
<text x="390" y="251" font-size="13" fill="#0b5cad" text-anchor="start">裂隙(菊花心)</text>
<text x="486" y="128" font-size="14">· 表面有纵皱纹、皮孔,</text>
<text x="498" y="149" font-size="14">下部分出支根、须根</text>
<text x="486" y="170" font-size="14">· 断面: 皮部、形成层环、</text>
<text x="498" y="191" font-size="14">木部,常有放射状纹理</text>
<text x="486" y="212" font-size="14">· 块根(如地黄、何首乌)</text>
<text x="498" y="233" font-size="14">也是根,只是膨大成块</text>
<rect x="10" y="306" width="700" height="230" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="26" y="332" font-size="17" font-weight="bold">② 根茎 <tspan font-size="13" font-weight="normal" fill="#555">(例: 黄精、玉竹、知母、射干、石菖蒲)</tspan></text>
