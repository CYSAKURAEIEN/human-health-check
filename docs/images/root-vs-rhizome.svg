<circle cx="206" cy="474" r="2" fill="#0b5cad"/>
<text x="186" y="520" font-size="13" fill="#0b5cad" text-anchor="middle">须根: 下面、节上长出</text>
<text x="322" y="370" font-size="13" fill="#555" text-anchor="middle">横切面</text>
<circle cx="322" cy="426" r="44" fill="#ecd9a8" stroke="#333" stroke-width="2"/>
<circle cx="322" cy="426" r="26" fill="none" stroke="#8a5a2b" stroke-width="2"/>
<circle cx="322" cy="426" r="13" fill="#f8f2e0" stroke="#a8875a" stroke-width="1.2"/>
<path d="M326,424 L387,418" stroke="#0b5cad" stroke-width="1"/>
