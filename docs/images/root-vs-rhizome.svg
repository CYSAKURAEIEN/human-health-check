<text x="322" y="724" font-size="13" fill="#0b5cad" text-anchor="middle">角质样、半透明</text>
<text x="486" y="608" font-size="14">· 表面有潜伏芽排成的</text>
<text x="498" y="629" font-size="14">多轮点状环纹</text>
<text x="486" y="650" font-size="14">· 顶端有鹦嘴状芽(冬麻)</text>
<text x="498" y="671" font-size="14">或残留茎基(春麻)</text>
<text x="486" y="692" font-size="14">· 另一端有圆脐形疤痕</text>
<text x="486" y="713" font-size="14">· 冒充品没有这组特征</text>
