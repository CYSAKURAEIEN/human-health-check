<text x="390" y="422" font-size="13" fill="#0b5cad" text-anchor="start">髓</text>
<text x="322" y="492" font-size="13" fill="#555" text-anchor="middle">例: 甘草的根茎,</text>
<text x="322" y="510" font-size="13" fill="#555" text-anchor="middle">断面中央有髓</text>
<text x="486" y="368" font-size="14">· 有一圈圈环节(节),</text>
<text x="498" y="389" font-size="14">节间长短因品种而异</text>
<text x="486" y="410" font-size="14">· 上面有茎痕、芽或芽痕</text>
<text x="486" y="431" font-size="14">· 下面、节上长须根,</text>
<text x="498" y="452" font-size="14">或留下根痕</text>
<text x="486" y="473" font-size="14">· 节上可见叶痕、残存叶基</text>
<rect x="10" y="546" width="700" height="230" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="26" y="572" font-size="17" font-weight="bold">③ 块茎 <tspan font-size="13" font-weight="normal" fill="#555">(例: 天麻)</tspan></text>
