<text x="130" y="120" font-size="13" fill="#0b5cad" text-anchor="start">芦头: 一段根茎</text>
<text x="130" y="138" font-size="13" fill="#0b5cad" text-anchor="start">有碗状茎痕(芦碗)</text>
<path d="M92,192 L127,184" stroke="#0b5cad" stroke-width="1"/>
<circle cx="92" cy="192" r="2" fill="#0b5cad"/>
<text x="130" y="188" font-size="13" fill="#0b5cad" text-anchor="start">纵皱纹、皮孔</text>
<path d="M116,268 L127,262" stroke="#0b5cad" stroke-width="1"/>
<circle cx="116" cy="268" r="2" fill="#0b5cad"/>
<text x="130" y="266" font-size="13" fill="#0b5cad" text-anchor="start">支根、须根</text>
<text x="322" y="130" font-size="13" fill="#555" text-anchor="middle">横切面</text>
