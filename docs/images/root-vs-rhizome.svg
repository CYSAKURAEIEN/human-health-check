<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1100" width="720" height="1100" role="img" aria-label="根、根茎、块茎、鳞茎怎样区分(示意): 根表面有纵皱纹、皮孔,下部有支根、须根,断面有皮部、形成层环和木部,常有放射状纹理和裂隙(菊花心),人参主根上端的芦头是一段根茎,有碗状茎痕;块根(地黄、何首乌)也是根。根茎有一圈圈环节,上面有茎痕、芽或芽痕,下面和节上长须根或留根痕,节上可见叶痕、残存叶基,甘草根茎断面中央有髓。块茎(天麻)表面有潜伏芽排成的多轮点状环纹,顶端有鹦嘴状芽或残留茎基,另一端有圆脐形疤痕,断面角质样半透明。鳞茎由肉质鳞叶抱合而成,川贝的松贝外层鳞叶2瓣、大瓣紧抱小瓣(怀中抱月),百合药用单片肉质鳞叶,有纵直平行的白色维管束。只看根认不准药,要在植株带花或带果时认准地上部分再挖">
<rect width="100%" height="100%" fill="#fff"/>
<title>根、根茎、块茎、鳞茎怎样区分</title>
<g font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif" fill="#222">
<text x="360" y="30" font-size="18" font-weight="bold" text-anchor="middle">根、根茎、块茎、鳞茎怎样区分</text>
<text x="360" y="52" font-size="13" fill="#555" text-anchor="middle">(药材外形示意: 先看表面有没有环节、芽、茎痕,再看断面;具体品种以各章描述为准)</text>
<rect x="10" y="66" width="700" height="230" rx="8" fill="none" stroke="#999" stroke-width="1.5"/>
<text x="26" y="92" font-size="17" font-weight="bold">① 根 <tspan font-size="13" font-weight="normal" fill="#555">(例: 黄芪、甘草、桔梗、人参的主根)</tspan></text>
