# 每次 main 分支的内容更新后,生成离线版(单文件 HTML 和 PDF),
# 发布到 Releases 里的 offline-latest。
name: 生成离线版

on:
  push:
    branches: [main]
    paths: ['**.md', 'tools/build_offline.py', 'tools/build_pdf.py', '.github/workflows/offline.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pandoc 和中文字体
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk

      - name: 生成 HTML
        run: python3 tools/build_offline.py dist/human-health-guide.html

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 Playwright 和 pypdf
        run: |
          pip install playwright pypdf
          python3 -m playwright install --with-deps chromium

      - name: 生成 PDF(每页页脚印版本号,写入隐藏标记和文档属性)
        run: python3 tools/build_pdf.py dist/human-health-guide.html dist/human-health-guide.pdf

      - name: 发布到 offline-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -o '<meta name="build-version" content="[^"]*"' dist/human-health-guide.html | cut -d'"' -f4)
          notes="版本 ${version},由 main 分支提交 ${GITHUB_SHA} 自动生成。HTML 用浏览器打开即可离线阅读;PDF 适合打印或存在手机上。文件开头的“版本信息”页和 PDF 每页页脚都印有版本号,可据此在仓库中查到对应的原文。"
          gh release view offline-latest >/dev/null 2>&1 || \
            gh release create offline-latest --title "离线版(自动生成)" --notes "$notes" --target "$GITHUB_SHA"
          gh release edit offline-latest --notes "$notes"
          gh release upload offline-latest --clobber \
            "dist/human-health-guide.html#人类紧急求生与健康指南(离线版).html" \
            "dist/human-health-guide.pdf#人类紧急求生与健康指南(离线版).pdf"
